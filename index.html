{"f":"基礎:情報・論理","q":"200人にA, B, Cの3つの質問へ「はい」か「いいえ」で答えてもらった。Aに「はい」が90人、Bに「はい」が80人、Cに「はい」が70人、AとBの両方に「はい」が30人、BとCの両方が25人、AとCの両方が20人、3つ全てに「はい」が10人であった。3つのどれにも「はい」と答えなかった人数はどれか。","h":"少なくとも1つに「はい」の人数を3集合の包除原理で求め、全体から引く。","c":["15人","35人","175人","25人"],"a":3,"v":"calc","n":"<b>正解は25人</b>。少なくとも1つに「はい」は 90+80+70−30−25−20+10=175人。200−175=25人。<br>誤答の出どころ: 35人は最後の＋10（3重の共通部分）を足し忘れた場合（165人を引く）、15人は3重の共通部分を引いてしまった場合（185人を引く）、175人は問われている補集合ではなく和集合の人数をそのまま答えた場合。<br><br>【出典】検算: 3集合の包除原理 |A∪B∪C|=ΣA−Σ(A∩B)+|A∩B∩C|、補集合は全体から引く。python で計算。〔出題実績: R1再 2-5、R4 2-2、R5 2-6〕"},
{"f":"基礎:情報・論理","q":"100人に英語・数学・理科の履修状況を調べた。英語を履修している者が60人、数学が50人、理科が40人、英語と数学の両方が25人、数学と理科の両方が20人、英語と理科の両方が15人、どの科目も履修していない者が5人であった。ちょうど2科目だけを履修している者の人数はどれか。","h":"まず3科目すべてを履修している人数 x を、包除原理と「どれも履修しない5人」から求める。","c":["45人","60人","50人","55人"],"a":0,"v":"calc","n":"<b>正解は45人</b>。少なくとも1科目は100−5=95人。95=60+50+40−25−20−15+x より x=5人。2科目の両方に入る人数の合計60には、3科目の者が3回ずつ数えられているので、ちょうど2科目は 60−3×5=45人。<br>誤答の出どころ: 60人は両方の人数の合計をそのまま答えた場合、50人は3科目の者を2回分しか引かなかった場合（60−2×5）、55人は1回分しか引かなかった場合（60−5）。<br><br>【出典】検算: 包除原理（3集合）と「ちょうどk個」の人数の数え方。python で各領域の人数を計算し合計が100になることを確認。〔出題実績: R1再 2-5、R4 2-2、R5 2-6〕"},
{"f":"基礎:情報・論理","q":"標的型攻撃への対策に関する次の記述のうち、最も不適切なものはどれか。","h":"侵入を100%防げるという前提に立っている記述を探す。","c":["脅威はできるだけ上流で食い止めるため、技術的対策に加えて、標的型メールの取扱い規則を組織として定めて周知する。","ウイルス対策ソフトとファイアウォールによる入口対策を十分に整備すれば、侵入を阻止できるので、出口対策や通信の監視は不要と判断してよい。","入口対策をすり抜けた場合に備え、組織内ネットワークの通信量を監視し、外部への通信をプロキシ経由に限るなどして、攻撃活動の抑止と早期発見を図る。","知的財産などを扱う重要なサーバーはインターネットから隔離し、アクセス制御と暗号化によって、最後の砦として保護を強化する。"],"a":1,"v":"primary","n":"<b>正解は「入口対策を整備すれば出口対策や監視は不要」とする記述</b>。IPAの資料は、対策の考え方として「一つの対策だけでなく、多層の防御が重要」とし、侵入を阻止できなかったときの攻撃活動の抑止・被害の極小化、最後の砦となる情報の保護の強化、システム全体の監視と証跡の分析を挙げている。出口対策は「入口対策をすり抜けた場合においても、攻撃者に情報を窃取させない」ための対策と定義されている。<br>他の3つは同資料の考え方（上流で食い止める・取扱い規則、ウイルス活動の阻害と通信量の監視・プロキシ経由、重要サーバーの隔離と暗号化）に沿った適切な記述。<br><br>【出典】IPA「標的型攻撃／新しいタイプの攻撃の実態と対策」（IPA技術本部セキュリティセンター、2011年）スライド28〜30・出口対策の節 https://www.ipa.go.jp/security/j-csip/ug65p9000000nkvm-att/000024542.pdf（確認日 2026-10-04）〔出題実績: R2 2-3、R7 2-4〕"},
{"f":"基礎:情報・論理","q":"IPAの資料は、標的型攻撃メールを起点とする攻撃を、初期潜入段階、攻撃基盤構築段階、システム調査段階、攻撃最終目的の遂行段階の4段階で説明している。このうち「システム調査段階」で行われる内容として最も適切なものはどれか。","h":"4段階は、潜入して足場を作り、中を調べ、最後に目的を果たす順に進むので、「調べる」段階の内容を選ぶ。","c":["標的型攻撃メールの添付ファイルやUSBメモリを介して、ウイルスを組織内の端末に送り込む。","バックドアを通じてウイルスを追加でダウンロードさせ、機能を拡張して攻撃の足場を築く。","組織のシステム内の情報を取得し、重要情報がどこにあるかを特定する。","重要情報を外部へ窃取し、得たアカウント情報などをもとに次の攻撃目標を設定し直す。"],"a":2,"v":"primary","n":"<b>正解は「組織のシステム内の情報を取得し、情報の存在箇所を特定する」</b>。IPAの資料の表では、第3段階（システム調査段階）が「組織のシステムにおける情報の取得」「情報の存在箇所特定」とされ、時間をかけて何度もしつこく行うと説明されている。<br>他の選択肢が属する段階: 添付ウイルスやUSB経由の送り込みは第1段階（初期潜入）、バックドアを使ったウイルスのダウンロードと拡張機能の追加は第2段階（攻撃基盤構築）、重要情報の窃取と目標の再設定は第4段階（攻撃最終目的の遂行）。<br><br>【出典】IPA「標的型攻撃／新しいタイプの攻撃の実態と対策」スライド23の表 https://www.ipa.go.jp/security/j-csip/ug65p9000000nkvm-att/000024542.pdf（確認日 2026-10-04）〔出題実績: R2 2-3、R7 2-4〕"},
{"f":"基礎:情報・論理","q":"通信回線でデータを伝送するのに要する時間は、「伝送時間＝伝送データ量（ビット）÷（データ伝送速度（ビット/秒）×回線利用率）」で求める。1.2Gバイトのデータを元の大きさの40%に圧縮してから、伝送速度100Mbps、回線利用率60%の回線で伝送するとき、伝送時間に最も近い値はどれか。ただし 1Gバイト=10^9バイト、1Mbps=10^6ビット/秒とする。","h":"圧縮後のデータ量をバイトからビットへ換算してから、速度と利用率の積で割る。","c":["8.0秒","96.0秒","64.0秒","38.4秒"],"a":2,"v":"calc","n":"<b>正解は64.0秒</b>。圧縮後のデータ量は 1.2×10^9×0.4=4.8×10^8バイト=3.84×10^9ビット。実効速度は 100×10^6×0.6=6×10^7ビット/秒。3.84×10^9÷(6×10^7)=64秒。<br>誤答の出どころ: 8.0秒はバイトをビットに換算（×8）し忘れた場合、96.0秒は圧縮後を40%でなく60%として計算した場合（利用率と取り違え）、38.4秒は回線利用率を考慮しなかった場合。<br><br>【出典】検算: 問題文に与えた伝送時間の式（R3・R7で出題された式と同形）。python で全誤答を再現。〔出題実績: R3 2-3、R7 2-5〕"},
{"f":"基礎:情報・論理","q":"360Mバイトのデータを元の大きさの8分の5に圧縮してから、伝送速度50Mbpsの回線で伝送したところ、伝送に60秒かかった。この間の回線利用率として最も適切なものはどれか。ただし 1Mバイト=10^6バイト、1Mbps=10^6ビット/秒とし、伝送時間は「伝送データ量（ビット）÷（データ伝送速度×回線利用率）」で求められるものとする。","h":"利用率は、実際に送ったビット数を、その60秒間に送れる最大ビット数で割った値になる。","c":["60%","7.5%","96%","37.5%"],"a":0,"v":"calc","n":"<b>正解は60%</b>。圧縮後は 360×10^6×5/8=2.25×10^8バイト=1.8×10^9ビット。60秒間に送れる最大は 50×10^6×60=3×10^9ビット。1.8×10^9÷(3×10^9)=0.6。<br>誤答の出どころ: 7.5%はバイトをビットに換算し忘れた場合、96%は圧縮を考慮しなかった場合（2.88×10^9÷3×10^9）、37.5%は圧縮比5/8を二重に掛けた場合（0.6×5/8）。<br><br>【出典】検算: 問題文に与えた伝送時間の式を利用率について解いたもの。python で全誤答を再現。〔出題実績: R3 2-3、R7 2-5〕"},
{"f":"基礎:情報・論理","q":"集合 A={a, b, c}、B={1, 2, 3}、C={0, 1} とする。直積集合 A×B から C への写像 f: A×B→C の総数はどれか。","h":"A×B の要素1つ1つについて、行き先を C の中から独立に選べる。","c":["9^2 = 81通り","2×9 = 18通り","2^6 = 64通り","2^9 = 512通り"],"a":3,"v":"calc","n":"<b>正解は 2^9 = 512通り</b>。|A×B|=3×3=9。9個の要素それぞれの行き先を C の2要素から選べるので 2^9=512。一般に写像の総数は |C|^|A×B|。<br>誤答の出どころ: 81は底と指数を入れ替えた場合（9^2）、18は積 2×9 を総数とした場合、64は指数を |A|+|B|=6 とした場合（直積の要素数ではなく和を使用）。<br><br>【出典】検算: 写像の総数 |C|^|定義域|（集合の基本）。python で itertools により小さい例（|A×B|=4）を全列挙して公式を確認し、本問を計算。〔出題実績: R1再 2-6、R7 2-1〕"},
{"f":"基礎:情報・論理","q":"3個の要素をもつ集合 A から、5個の要素をもつ集合 B への写像のうち、単射（A の異なる2要素が B の同じ要素に写らない写像）の総数はどれか。","h":"A の要素を1つずつ順に、すでに使われた B の要素を避けて行き先を決めていく。","c":["5^3 = 125通り","5×4×3 = 60通り","3^5 = 243通り","C(5,3) = 10通り"],"a":1,"v":"calc","n":"<b>正解は 5×4×3 = 60通り</b>。1番目の要素の行き先は5通り、2番目はすでに使われた1つを除いて4通り、3番目は3通りなので 5×4×3=60。<br>誤答の出どころ: 125は単射の条件を無視した写像全体の数（5^3）、243は定義域と値域を入れ替えた場合（3^5）、10は B から3要素を選ぶ組合せの数で、どの要素をどこへ写すかの順序を数えていない。<br><br>【出典】検算: 単射の個数＝順列 P(n,k)=n!/(n−k)!。python で itertools.product による全探索（125通りのうち単射が60通り）。〔出題実績: R1再 2-6、R7 2-1（写像の総数）〕"},
{"f":"基礎:情報・論理","q":"ディジタル署名（電子署名）に関する次の記述のうち、最も適切なものはどれか。","h":"署名を作れるのは本人だけで、確かめるのは誰でもできる、という非対称性に着目する。","c":["署名者と検証者が事前に共有した同じ共通鍵で署名を作り、その共通鍵を持つ者だけが署名を検証できる。","署名者が検証者の公開鍵で署名を作り、検証者だけが自分の秘密鍵で署名を検証できる。","署名の作成にも検証にも署名者の秘密鍵が必要なため、検証者は署名者から秘密鍵の預託を受けておく。","署名者が自分の秘密鍵で署名を作り、対応する公開鍵を入手した者なら誰でも署名を検証できる。"],"a":3,"v":"primary","n":"<b>正解は「署名者が自分の秘密鍵で署名を作り、公開鍵を入手した者なら誰でも検証できる」</b>。NIST FIPS 186-5は、署名の生成には秘密鍵、検証には対応する公開鍵を用い、公開鍵は公開してよく秘密鍵は秘匿する、秘密鍵を持つ者だけが署名を生成でき、誰でも署名者の公開鍵で検証できると定めている。<br>誤答の出どころ: 共通鍵で署名するのはメッセージ認証コード（MAC）の考え方で、第三者が検証できず署名者本人の証明にもならない。検証者の公開鍵で署名する記述は、暗号化（公開鍵で暗号化、秘密鍵で復号）と署名の鍵の使い方を逆にしたもの。秘密鍵を検証者へ預ける記述は、秘密鍵を本人しか持たないという前提を崩す。<br><br>【出典】NIST FIPS 186-5 Digital Signature Standard (DSS)、Explanation 欄 https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.186-5.pdf（確認日 2026-10-04）〔出題実績: R3 2-1、R6 2-6〕"},
{"f":"基礎:情報・論理","q":"ハッシュ関数 SHA-256 に関する次の記述のうち、最も適切なものはどれか。","h":"ハッシュ値は「入力の長さに関係なく固定長」で、「元に戻す」ためのものではない。","c":["入力メッセージの長さにかかわらず出力（メッセージダイジェスト）は256ビットで、入力が少し変わると出力は極めて高い確率で変わる。","出力の長さは入力メッセージの長さに比例して大きくなり、1Gバイトのデータを入力すると約1Gバイトのダイジェストが得られる。","ダイジェストから元のメッセージを効率よく復元できるので、メッセージを秘匿して送る暗号化の代わりに利用できる。","秘密の鍵を使ってダイジェストを計算するので、鍵を知っている者だけが同じメッセージのダイジェストを再計算できる。"],"a":0,"v":"primary","n":"<b>正解は「入力の長さによらず出力は256ビットで、入力が少し変わると出力は極めて高い確率で変わる」</b>。NIST FIPS 180-4 は、SHA-256 などに任意長（2^64ビット未満）のメッセージを入力すると固定長のメッセージダイジェストが出力され、ダイジェスト長は160〜512ビットの範囲でアルゴリズムごとに決まること、メッセージに変更があれば極めて高い確率で異なるダイジェストになることを定めている。SHA-256 のダイジェスト長は256ビット。<br>誤答の出どころ: 入力長に比例する記述は固定長という性質を落としたもの。復元できるとする記述は、同標準が「与えられたダイジェストに対応するメッセージを見つけることは計算量的に困難」としている性質（一方向性）に反する。鍵を使う記述は、鍵付きハッシュ（HMAC）と鍵を持たない通常のハッシュ関数を混同したもの。<br><br>【出典】NIST FIPS 180-4 Secure Hash Standard (SHS)、Explanation 欄 https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.180-4.pdf（確認日 2026-10-04）〔出題実績: R3 2-1、R6 2-6〕"},
{"f":"基礎:情報・論理","q":"長さ5ビットの4つの符号語 00000, 01111, 10110, 11001 からなる符号がある。この符号の最小ハミング距離と、符号語が1つ送られて一部のビットが反転したとき、確実に検出できる反転ビット数の最大値と、最も近い符号語への復号で確実に訂正できる反転ビット数の最大値の組合せとして、正しいものはどれか。","h":"最小距離を d とすると、検出できるのは d−1 ビット、訂正できるのは (d−1)÷2 の整数部分までのビット数。","c":["最小距離4、検出3ビット、訂正1ビット","最小距離3、検出2ビット、訂正1ビット","最小距離3、検出3ビット、訂正1ビット","最小距離3、検出1ビット、訂正1ビット"],"a":1,"v":"calc","n":"<b>正解は最小距離3、検出2ビット、訂正1ビット</b>。符号語どうしの距離は、00000-01111:4、00000-10110:3、00000-11001:3、01111-10110:3、01111-11001:3、10110-11001:4 なので最小は3。検出は d−1=2ビット、訂正は⌊(d−1)/2⌋=1ビット。<br>誤答の出どころ: 最小距離4は一部の組（距離4の組）だけを見て最小を決めた場合。検出3ビットは検出の限界を d として数えた場合（3ビットが反転して別の符号語に変わる可能性がある）。検出1ビットは検出と訂正の限界を同じ値としてしまった場合。<br><br>【出典】検算: 最小ハミング距離 d の符号は d−1 ビットまで検出、⌊(d−1)/2⌋ ビットまで訂正可能（Hamming, 1950, Bell System Technical Journal 29(2) の符号の距離の議論に基づく標準的結果）。python で全ペアの距離を計算。〔出題実績: R4 2-4、R6 2-4〕"},
{"f":"基礎:情報・論理","q":"7ビットの符号語 c1 c2 c3 c4 c5 c6 c7 からなる(7,4)ハミング符号を考える。c1, c2, c4 が検査ビット、c3, c5, c6, c7 がデータビットで、検査ビットは偶数パリティ、すなわち c1 は (c1, c3, c5, c7)、c2 は (c2, c3, c6, c7)、c4 は (c4, c5, c6, c7) の中の1の個数が偶数になるように定められる。受信語 c1 c2 c3 c4 c5 c6 c7 = 0110001 には高々1ビットの誤りがある。誤りを訂正した後のデータビット c3 c5 c6 c7 はどれか。","h":"3つの検査グループそれぞれの1の個数が偶数かどうかを調べ、不成立のグループが共通に含むビットの位置を探す。","c":["1001","0110","1011","0001"],"a":2,"v":"calc","n":"<b>正解は1011</b>。(c1,c3,c5,c7)=(0,1,0,1)は偶数で成立、(c2,c3,c6,c7)=(1,1,0,1)は奇数で不成立、(c4,c5,c6,c7)=(0,0,0,1)は奇数で不成立。不成立は2番目と3番目のグループだけで、両方に含まれ1番目に含まれないのは c6。シンドローム（c4のグループを上位、c1を下位とした2進数）=110₂=6 と一致する。c6 を反転して 0110011、データビットは c3 c5 c6 c7 = 1011。<br>誤答の出どころ: 1001 は訂正せずデータビットを取り出した場合、0110 は先頭の4ビットをそのままデータとした場合、0001 はシンドロームの並びを逆（011₂=3）に読んで c3 を反転してしまった場合。<br><br>【出典】検算: (7,4)ハミング符号のシンドローム復号（Hamming, 1950）。python で全128語から符号語16個を生成し、受信語に最も近い符号語（距離1）を探して照合。〔出題実績: R4 2-4、R6 2-4〕"},
{"f":"基礎:情報・論理","q":"5種類の記号 A〜E が情報源から独立に出力され、出現確率は A:0.40、B:0.30、C:0.15、D:0.10、E:0.05 である。この情報源をハフマン符号で符号化したときの、1記号あたりの平均符号長（ビット）として正しいものはどれか。","h":"確率の小さい2記号を順にまとめていく木を作ると、各記号の符号長が決まる。","c":["3.00ビット","2.80ビット","2.50ビット","2.05ビット"],"a":3,"v":"calc","n":"<b>正解は2.05ビット</b>。確率の小さい順にまとめる: E(0.05)+D(0.10)=0.15、これと C(0.15) で 0.30、これと B(0.30) で 0.60、最後に A(0.40)。符号長は A:1、B:2、C:3、D:4、E:4。平均は 0.40×1+0.30×2+0.15×3+0.10×4+0.05×4=2.05。（エントロピーは約2.009ビットで、平均符号長はそれ以上になる。）<br>誤答の出どころ: 3.00は5種類を固定長3ビットで符号化した場合、2.80は符号長を確率で重み付けせず単純平均した場合（(1+2+3+4+4)÷5）、2.50は各記号の符号長を −log2(確率) の切り上げ（2,2,3,4,5）としてそれを重み付けした場合。<br><br>【出典】検算: ハフマン符号（Huffman, 1952）の構成。python のヒープ実装で符号長と平均を算出。〔出題実績: R2 2-1、R5 2-4〕"},
{"f":"基礎:情報・論理","q":"データ圧縮に関する次の記述のうち、最も適切なものはどれか。","h":"圧縮して元に戻したときにデータが完全に一致するかどうかが、可逆と非可逆の分かれ目。","c":["PNG形式は DEFLATE による可逆圧縮を用いており、伸張すると元の画素値が完全に復元される。","JPEG形式の DCT 方式は、量子化で情報を捨てないため、伸張すると元の画像と完全に一致する。","LZ77 とハフマン符号を組み合わせる DEFLATE は非可逆圧縮のため、文書やプログラムの圧縮には使えない。","ランレングス符号化は、同じ値が連続しない画像ほど、データの大きさが小さくなる。"],"a":0,"v":"primary","n":"<b>正解は「PNGはDEFLATEによる可逆圧縮で、元の画素値が完全に復元される」</b>。W3CのPNG仕様は、PNGを「lossless（可逆）」な画像形式とし、圧縮方式として定義されるのは deflate（zlib形式）のみ、フィルタ処理も可逆と述べている。<br>誤答の出どころ: ITU-T T.81（JPEG）は、DCTに基づく処理は非可逆（lossy）で高い圧縮率を得る代わりに復元画像は元と完全には一致しない、と定めている。DEFLATE は RFC 1951 が「可逆圧縮（lossless）データ形式」と定義しており、文書やプログラムの圧縮にこそ向く。ランレングスは同じ値の連続を（値,長さ）で表すので、連続が少ないほど圧縮効果は小さくなり、逆に膨らむこともある。<br><br>【出典】W3C PNG Specification (Third Edition) https://www.w3.org/TR/png-3/、RFC 1951 DEFLATE 要旨 https://www.rfc-editor.org/rfc/rfc1951、ITU-T T.81 §4.2 https://www.w3.org/Graphics/JPEG/itu-t81.pdf（確認日 2026-10-04。ランレングスの性質のみ教科書的知識）〔出題実績: R2 2-1、R5 2-4〕"},
{"f":"基礎:情報・論理","q":"主記憶の前にキャッシュメモリを置いた計算機で、キャッシュのアクセス時間は10ns、主記憶のアクセス時間は100ns、キャッシュのヒット率は95%である。ヒットしたときはキャッシュだけにアクセスし、ヒットしなかったときはキャッシュにアクセスして失敗を確認したあと主記憶にアクセスするものとする。実効アクセス時間として正しいものはどれか。","h":"ヒット率で重み付けした平均を求め、ヒットしなかったときの所要時間はキャッシュと主記憶の合計とする。","c":["14.5ns","55.0ns","15.0ns","95.5ns"],"a":2,"v":"calc","n":"<b>正解は15.0ns</b>。ヒット時は10ns、ミス時は10+100=110ns。実効アクセス時間=0.95×10+0.05×110=9.5+5.5=15.0ns。<br>誤答の出どころ: 14.5nsはミス時にキャッシュの確認時間を加えず100nsとした場合（0.95×10+0.05×100）、55.0nsはヒット率を無視して両者の平均 (10+100)÷2 を取った場合、95.5nsはヒット率とミス率を入れ替えた場合（0.05×10+0.95×100）。<br><br>【出典】検算: 実効アクセス時間=h×t1+(1−h)×(t1+t2)（ミス時の経路は問題文で明示。計算機アーキテクチャの標準的な式）。python で計算。〔出題実績: R2 2-6、R4 2-3〕"},
{"f":"基礎:情報・論理","q":"主記憶に3ページ分の枠があり、最初は空である。ページ置換アルゴリズムとして LRU（最後に使われてから最も時間が経過したページを追い出す）を用い、ページを 3, 1, 4, 1, 5, 2, 1, 3, 5, 2, 3, 4, 1 の順に参照した。ページフォールト（参照したページが枠に無い）の回数はどれか。","h":"参照のたびに「最近使った順」を更新し、枠が埋まっているときだけ最も古いものを追い出す。","c":["11回","10回","8回","3回"],"a":1,"v":"calc","n":"<b>正解は10回</b>。枠（古い→新しい）の変化: 3→[3]、1→[3,1]、4→[3,1,4]、1:ヒット→[3,4,1]、5:3を追い出し→[4,1,5]、2:4を追い出し→[1,5,2]、1:ヒット→[5,2,1]、3:5を追い出し→[2,1,3]、5:2を追い出し→[1,3,5]、2:1を追い出し→[3,5,2]、3:ヒット→[5,2,3]、4:5を追い出し→[2,3,4]、1:2を追い出し→[3,4,1]。フォールトは13回中10回、ヒットは3回。<br>誤答の出どころ: 11回は FIFO（到着順に追い出す）で数えた場合、8回は将来の参照を知っている最適置換で数えた場合、3回はヒットの回数を答えた場合。<br><br>【出典】検算: LRU 置換（オペレーティングシステムの標準的なページ置換アルゴリズム）。python でLRU・FIFO・最適置換を実装して照合。〔出題実績: R2 2-6、R4 2-3〕"},
{"f":"基礎:情報・論理","q":"3変数 A, B, C の論理関数 F は、(A,B,C)=(0,0,1), (0,1,1), (1,0,0), (1,0,1) のときだけ F=1 で、他の組合せでは F=0 である。F を表す論理式として正しいものはどれか。ただし ¬ は否定、∧ は論理積、∨ は論理和を表す。","h":"A=1 のときと A=0 のときに分け、それぞれ F が B, C のどんな式になっているかを見る。","c":["(A∧¬B)∨(¬A∧C)","(A∧B)∨(¬A∧C)","(A∧¬B)∨(A∧C)","(¬A∧¬B)∨(A∧C)"],"a":0,"v":"calc","n":"<b>正解は (A∧¬B)∨(¬A∧C)</b>。A=1 のとき F=1 になるのは B=0（C は問わない）の (1,0,0),(1,0,1)、A=0 のとき F=1 になるのは C=1（B は問わない）の (0,0,1),(0,1,1)。したがって A=1 では ¬B、A=0 では C を選ぶ形になる。<br>誤答の出どころ: (A∧B) の形は B の否定を落とした場合で (1,1,*) が F=1 になってしまう。(A∧¬B)∨(A∧C) は A=0 の場合の項を落とした場合で (0,*,1) が F=0 になってしまう。(¬A∧¬B)∨(A∧C) は A=0 と A=1 での B, C の使い方を入れ替えた場合。<br><br>【出典】検算: 真理値表と論理式の対応（ブール代数）。python で8通りの全入力について各選択肢を評価し、正解のみが表と一致することを確認。〔出題実績: R2 2-2、R3 2-2〕"},
{"f":"基礎:情報・論理","q":"論理式 ¬((A∨¬B)∧C) と常に等しい論理式はどれか。ただし ¬ は否定、∧ は論理積、∨ は論理和を表す。","h":"ド・モルガンの法則（否定は ∧ と ∨ を入れ替え、各項の否定を取る）を外側から順に適用する。","c":["(¬A∨B)∧¬C","(¬A∧B)∧¬C","(A∧¬B)∨¬C","(¬A∧B)∨¬C"],"a":3,"v":"calc","n":"<b>正解は (¬A∧B)∨¬C</b>。¬(X∧C)=¬X∨¬C を適用し、X=(A∨¬B) について ¬(A∨¬B)=¬A∧¬¬B=¬A∧B。よって (¬A∧B)∨¬C。<br>誤答の出どころ: (¬A∨B)∧¬C は ∧ と ∨ を入れ替えず各項の否定だけを取った場合、(¬A∧B)∧¬C は外側の ∧ を入れ替えなかった場合、(A∧¬B)∨¬C は内側の項の否定を取らなかった場合。<br><br>【出典】検算: ド・モルガンの法則 ¬(P∧Q)=¬P∨¬Q、¬(P∨Q)=¬P∧¬Q。python で8通りの全入力を評価し、正解のみが元の式と一致することを確認。〔出題実績: R2 2-2、R3 2-2〕"},
{"f":"基礎:情報・論理","q":"TCP の輻輳（ふくそう）制御に関する次の記述のうち、最も適切なものはどれか。ただし SMSS は送信側の最大セグメントサイズ、cwnd は輻輳ウィンドウ、ssthresh はスロースタートのしきい値とする。","h":"再送タイムアウトは輻輳がかなり深刻だと判断される事象なので、cwnd の縮め方としきい値の更新を組で考える。","c":["スロースタートでは、ACK を受信するたびに cwnd を SMSS だけ増やすので、cwnd は RTT ごとに SMSS ずつ線形に増加する。","cwnd が ssthresh を下回っている間は輻輳回避フェーズで動作し、cwnd を RTT ごとに約1セグメント分だけ増やす。","再送タイムアウトが発生すると、ssthresh は変更せず、cwnd を従来の半分の値に縮小して送信を続ける。","再送タイムアウトが発生すると、ssthresh を未確認データ量の半分（最小 2×SMSS）に下げ、cwnd を1セグメント分に戻してスロースタートからやり直す。"],"a":3,"v":"primary","n":"<b>正解は「再送タイムアウトで ssthresh を未確認データ量の半分に下げ、cwnd を1セグメントに戻す」</b>。RFC 5681 §3.1 は、再送タイムアウトの際に ssthresh=max(FlightSize/2, 2×SMSS) とし、cwnd を損失ウィンドウ（1セグメント）に設定すると定めている。<br>誤答の出どころ: スロースタートでは ACK ごとに cwnd を増やすため cwnd は RTT ごとにおよそ2倍（指数的）に増える（線形増加は輻輳回避フェーズの性質）。輻輳回避に入るのは cwnd が ssthresh を超えたとき（下回っている間はスロースタート）。ssthresh を変えず cwnd だけ半分にするのは RFC の規定ではない。<br><br>【出典】RFC 5681 TCP Congestion Control §3.1 https://www.rfc-editor.org/rfc/rfc5681（確認日 2026-10-04）〔出題実績: R7 2-3〕"},
{"f":"基礎:情報・論理","q":"次の式を満たす関数 A: ℕ×ℕ→ℕ（ℕ は非負整数全体）はアッカーマン関数と呼ばれる。<br>A(0, n) = n + 1<br>A(m+1, 0) = A(m, 1)<br>A(m+1, n+1) = A(m, A(m+1, n))<br>このとき A(2, 3) として正しい値はどれか。","h":"A(1, n) を先に求めておくと、A(2, n) の計算が楽になる。","c":["7","5","9","11"],"a":2,"v":"calc","n":"<b>正解は9</b>。A(1,0)=A(0,1)=2、A(1,n+1)=A(0,A(1,n))=A(1,n)+1 より A(1,n)=n+2。A(2,0)=A(1,1)=3、A(2,n+1)=A(1,A(2,n))=A(2,n)+2 より A(2,n)=2n+3。よって A(2,3)=9。<br>誤答の出どころ: 7 は A(2,2)（引数を1つ小さく数えた場合）、11 は A(2,4)（1つ大きく数えた場合）、5 は A(1,3) または A(2,1) と、再帰の段数を取り違えた場合。<br><br>【出典】検算: 問題文の再帰定義をそのまま実行（python の再帰で A(2,3)=9、A(2,2)=7、A(2,4)=11、A(1,3)=5 を確認）。〔出題実績: R7 2-6〕"},
{"f":"基礎:情報・論理","q":"4種類の記号が、確率 1/2, 1/4, 1/8, 1/8 で独立に出力される情報源がある。この情報源の1記号あたりの平均情報量（エントロピー）はいくつか。対数の底は2とし、単位はビットとする。","h":"各記号の情報量は −log2(確率) で、それを出現確率で重み付けして足し合わせる。","c":["1.75ビット","2.00ビット","2.25ビット","1.21ビット"],"a":0,"v":"calc","n":"<b>正解は1.75ビット</b>。H=Σ p·log2(1/p)=(1/2)×1+(1/4)×2+(1/8)×3+(1/8)×3=0.5+0.5+0.375+0.375=1.75。<br>誤答の出どころ: 2.00ビットは4種類が等確率とみなした場合（log2 4）、2.25ビットは各記号の情報量 1,2,3,3 を確率で重み付けせず単純平均した場合、1.21は自然対数で計算した場合（単位はナット）。<br><br>【出典】検算: シャノンのエントロピー H=−Σ p log2 p（C. E. Shannon, 1948, A Mathematical Theory of Communication）。python で計算し、自然対数・単純平均・等確率の場合の値と照合。〔出題実績: R7 2-2〕"},
{"f":"基礎:情報・論理","q":"IPネットワークの経路制御に関する次の記述のうち、最も適切なものはどれか。","h":"リンク状態型は「全体の地図を持って自分で最短経路を計算」、距離ベクトル型は「隣から教わった距離を足していく」。","c":["OSPF はリンク状態型で、各ルータが同一のリンク状態データベースを持ち、自分を根とする最短経路木から経路表を計算する。","距離ベクトル型では、各ルータがネットワーク全体のトポロジを把握したうえで、自分を根とする最短経路木から経路表を作る。","RIP は距離ベクトル型で、メトリックは回線帯域幅の逆数を用い、有効な値の範囲は1〜255である。","RIP は30秒ごとに、前回の送信から変化した経路の差分だけを隣接する全てのルータへ送信する。"],"a":0,"v":"primary","n":"<b>正解は「OSPFはリンク状態型で、同一のデータベースから最短経路木で経路表を計算する」</b>。RFC 2328 は、OSPF はリンク状態型ルーティングプロトコルであり、各ルータが自律システムのトポロジを表す同一のデータベースを持ち、そこから最短経路木を構築して経路表を計算すると述べている。<br>誤答の出どころ: 全体のトポロジを把握するのはリンク状態型で、距離ベクトル型は隣接ルータから受け取った距離情報だけで次ホップを決める。RIP のメトリックはホップ数（有効値1〜15、16が到達不能を表す無限大）。RIP は30秒ごとに経路表の全体を送る（RFC 2453）。<br><br>【出典】RFC 2328 OSPF Version 2 要旨・§1 https://www.rfc-editor.org/rfc/rfc2328、RFC 2453 RIP Version 2 §3.4.1・§3.6・§3.8 https://www.rfc-editor.org/rfc/rfc2453（確認日 2026-10-04）〔出題実績: R6 2-3〕"},
{"f":"基礎:情報・論理","q":"実数 x について、次の空欄に当てはまる語句の組合せとして正しいものはどれか。<br>「x>2」は「x²>4」であるための（ア）。<br>「x³=8」は「x=2」であるための（イ）。","h":"それぞれ「P ならば Q」と「Q ならば P」の真偽を、反例（x=−3 など）も含めて調べる。","c":["ア：必要条件であるが十分条件ではない／イ：必要十分条件である","ア：十分条件であるが必要条件ではない／イ：必要十分条件である","ア：十分条件であるが必要条件ではない／イ：必要条件であるが十分条件ではない","ア：必要十分条件である／イ：十分条件であるが必要条件ではない"],"a":1,"v":"calc","n":"<b>正解は ア：十分条件であるが必要条件ではない／イ：必要十分条件である</b>。ア: x>2 ならば x²>4 は真（十分）。逆は x=−3 のとき x²=9>4 だが x>2 でないので偽（必要ではない）。イ: 実数の範囲では x³=8 と x=2 は同値（3乗は実数で単調増加）なので必要十分。<br>誤答の出どころ: アを「必要条件」とするのは、命題の向き（どちらがどちらの条件か）を逆に読んだ場合。イを「必要のみ」「十分のみ」とするのは、片方向の確認で止めた場合。<br><br>【出典】検算: 必要条件・十分条件の定義（P⇒Q のとき P は Q の十分条件、Q は P の必要条件）。python で整数・有理数の格子点について命題の真偽を調べ、反例 x=−3 を確認。〔出題実績: R6 2-2〕"},
{"f":"基礎:情報・論理","q":"8ビットの値 X=10110110 と Y=11001010 について、Z=(X XOR Y) AND 11110000 を求め、Z を論理右シフトで2ビット右へずらした値を16進数で表したものはどれか。","h":"XOR は同じビットで0・異なるビットで1となり、AND の 11110000 は上位4ビットだけを残すマスクである。","c":["70","3C","1C","C0"],"a":2,"v":"calc","n":"<b>正解は1C</b>。X XOR Y = 01111100、これに 11110000 を AND して 01110000（70）。論理右シフト2ビットで 00011100 = 1C。<br>誤答の出どころ: 70 はシフトを忘れた場合、3C は XOR を OR に取り違えた場合（(X OR Y)=11111110、AND で 11110000、右2ビットで 00111100）、C0 は右シフトを左シフトとしてしまった場合（01110000 を左へ2ビットで 11000000）。<br><br>【出典】検算: ビット演算（XOR・AND・シフト）の定義。python の ^ & >> で計算し、誤答の導出も再現。〔出題実績: R5 2-5〕"},
{"f":"基礎:情報・論理","q":"NIST SP 800-63B（デジタルアイデンティティガイドライン：認証とライフサイクル管理）の記述として、最も適切なものはどれか。","h":"近年のガイドラインは、定期変更や文字種の強制よりも、長さや漏えい済みパスワードの照合を重視している。","c":["検証者は、パスワードに大文字・小文字・数字・記号を混在させるなどの構成規則を課さなければならない。","検証者は、単要素認証に用いるパスワードの最小の長さを8文字とするだけで十分と考えてよい。","検証者は、利用者に対してパスワードを定期的に変更するよう要求してはならない。","検証者は、パスワード入力欄では、貼り付け（ペースト）機能を禁止することが望ましい。"],"a":2,"v":"primary","n":"<b>正解は「パスワードの定期的な変更を要求してはならない」</b>。SP 800-63B-4 §3.1.1.2 は、検証者およびCSPは利用者に定期的なパスワード変更を要求してはならない（SHALL NOT）と定めている。<br>誤答の出どころ: 構成規則（文字種の混在など）は「課してはならない（SHALL NOT）」。最小長は単要素認証で15文字、多要素認証の一要素としてなら8文字。貼り付け機能は「許可すべき（SHOULD permit）」でパスワードマネージャの利用を支える。総務省のテレワークセキュリティガイドライン（第5版）も、パスワードの定期変更は原則不要と述べている。<br><br>【出典】NIST SP 800-63B-4 §3.1.1.2 https://pages.nist.gov/800-63-4/sp800-63b.html、総務省 テレワークセキュリティガイドライン第5版 https://www.soumu.go.jp/main_content/000752925.pdf（確認日 2026-10-04）〔出題実績: R5 2-1、R3 2-1、R6 2-6〕"},
{"f":"基礎:情報・論理","q":"13桁のJANコードの第13桁はチェックディジットである。第1〜12桁のうち左から奇数番目の桁に1、偶数番目の桁に3を掛けて合計し、その合計の下1桁を10から引いた値（10になる場合は0）を第13桁とする。第1〜12桁が 450987654321 のとき、チェックディジットはどれか。","h":"12桁を左から順に、重み 1,3,1,3,… を掛けて足し合わせ、合計の下1桁だけを使う。","c":["8","4","7","6"],"a":3,"v":"calc","n":"<b>正解は6</b>。4×1+5×3+0×1+9×3+8×1+7×3+6×1+5×3+4×1+3×3+2×1+1×3=4+15+0+27+8+21+6+15+4+9+2+3=114。下1桁4を10から引いて6。<br>誤答の出どころ: 8は重みを3,1,3,1,…と逆に掛けた場合（合計がちがって下1桁2を引く）、4は合計の下1桁をそのまま答えた場合、7は合計を11で割った余り4を11から引いた場合（mod 10 と mod 11 の混同）。<br><br>【出典】GS1「How to calculate a check digit manually」（GTIN-13 は右から3,1,3,…の重み、合計を次の10の倍数に切り上げるまでの差がチェックディジット。12桁データでは左から奇数番目が1、偶数番目が3となる）https://www.gs1.org/services/how-calculate-check-digit-manually（直接取得は403のため検索結果の抜粋と、実在のJANコード 4901234567894 で規則どおりチェックディジット4になることを python で確認、確認日 2026-10-04）。検算: python。〔出題実績: R5 2-3〕"},
{"f":"基礎:情報・論理","q":"IPv4 アドレス 172.16.5.77 を含む、プレフィックス長 27（サブネットマスク 255.255.255.224）のネットワークのブロードキャストアドレスはどれか。","h":"ホスト部は下位5ビットなので、最後のオクテットを32ずつの区間に分け、77が入る区間の最後のアドレスを探す。","c":["172.16.5.64","172.16.5.95","172.16.5.79","172.16.5.127"],"a":1,"v":"calc","n":"<b>正解は172.16.5.95</b>。ホスト部は32−27=5ビットで、ブロックの大きさは 2^5=32。最後のオクテットは 0-31、32-63、64-95、…に分かれ、77 は 64-95 に入る。ネットワークアドレスは .64、ブロードキャストアドレス（ホスト部が全て1）は .95。<br>誤答の出どころ: .64 はネットワークアドレス、.79 はプレフィックス長を28としてブロックを16で区切った場合、.127 はプレフィックス長を25としてブロックを128で区切った場合。<br><br>【出典】RFC 4632 §3.1（/n のプレフィックスは 2^(32−n) 個のアドレスを表す）https://www.rfc-editor.org/rfc/rfc4632（確認日 2026-10-04）。検算: python の ipaddress モジュール。〔出題実績: R4 2-6（IPv4/IPv6）〕"},
{"f":"基礎:情報・論理","q":"総務省「テレワークセキュリティガイドライン（第5版）」の内容に照らして、テレワークでの情報セキュリティ対策に関する次の記述のうち、最も不適切なものはどれか。","h":"報告するかどうか迷ったときの行動について、ガイドラインは安全側に倒す立場をとっている。","c":["既知の脆弱性を放置したVPN機器が攻撃を受けた事例があるため、過去に使っていた機器を再利用するときは、ファームウェアを最新にして既知の脆弱性を解消してから使う。","第三者からののぞき見（ショルダーハッキング）や大声でのオンライン会議による情報漏えいが起きないよう、テレワークに適した環境を選んで作業する。","不審なメールを受け取ったときに、報告すべきか判断に迷う場合は、手間を増やさないよう報告せず、自分でメールを削除して済ませる。","クラウドサービスや社内システムへの接続では、利用者認証情報が漏えいしても直ちに不正アクセスを受けないよう、可能な限り多要素認証を利用する。"],"a":2,"v":"primary","n":"<b>正解は「判断に迷う場合は報告せず自分で削除する」</b>。ガイドラインは、少しでも不審を感じたメールは開かず、必要に応じて送信者に確認するほか、システム・セキュリティ管理者へ速やかに報告すること、報告の是非に迷う場合は報告することを心がけることを勤務者の基本対策としている。<br>他の3つはガイドラインの記述に沿う: 過去に使用した機器を再利用する場合はファームウェアを最新にして既知の脆弱性が残っていない状態で使う（VPN機器の脆弱性の放置の事例）、のぞき見（ショルダーハッキング）や大声でのオンライン会議を避ける適切なテレワーク環境の確保、クラウドサービスや社内接続での可能な限りの多要素認証。<br><br>【出典】総務省「テレワークセキュリティガイドライン 第5版」（令和3年5月）勤務者F-1、事例「VPN機器の脆弱性の放置」、管理者H-2 等 https://www.soumu.go.jp/main_content/000752925.pdf（確認日 2026-10-04）〔出題実績: R4 2-1〕"},
{"f":"基礎:情報・論理","q":"3つの条件 A, B, C が成立（Y）か不成立（N）かによって、動作 X または Y のいずれかを実行する。動作は「A と B がともに成立していれば X（C の成否は問わない）、それ以外は Y」である。決定表では、動作が同じで1つの条件だけが異なる規則を、その条件を不問（−）にして1つにまとめられる。「その他」の規則は使わず、規則が重ならないようにするとき、規則の列数は最小でいくつになるか。","h":"X になる組は (Y,Y,*) の2通りなので、残りの6通りの Y を何列で重ならずに表せるかを考える。","c":["3列","4列","7列","8列"],"a":0,"v":"calc","n":"<b>正解は3列</b>。(A,B,C)=(Y,Y,−)→X、(Y,N,−)→Y、(N,−,−)→Y の3列で、8通りすべての組合せが重なりなく含まれる。Y になる6通りは1つの列では表せない（−を含む列は2のべき乗個の組を表す）ので、最小は2列（4通りと2通り）、これに X の1列を加えて3列。<br>誤答の出どころ: 8列は8通りを1列ずつ展開したまま（まとめない場合）、7列は X の2通りだけを1列にまとめて Y の6通りをまとめなかった場合、4列は C だけを不問にして (A,B) の4通りを列挙し、A=N側の B を不問にする併合を行わなかった場合。<br><br>【出典】検算: 決定表（デシジョンテーブル）の規則の併合。python で3^3=27通りの規則の候補から、重ならない被覆の最小列数を全探索して3を確認。〔出題実績: R3 2-4〕"},
{"f":"基礎:情報・論理","q":"データ件数 n=1,024 のとき、あるアルゴリズムの処理時間が T であった。このアルゴリズムの計算量は O(n log n) であり、処理時間は n log2 n に比例するものとして、n=8,192 に増やしたときの処理時間は T の何倍になるか。定数係数と低次の項は無視できるものとする。","h":"n は8倍になるが log2 n も増えるので、n=1,024 と 8,192 のそれぞれで n×log2 n を計算して比べる。","c":["約8.0倍","約24.0倍","約64.0倍","約10.4倍"],"a":3,"v":"calc","n":"<b>正解は約10.4倍</b>。n=1,024 のとき n log2 n=1024×10、n=8,192 のとき 8192×13。比は (8192×13)÷(1024×10)=8×1.3=10.4倍。<br>誤答の出どころ: 8.0倍は計算量を O(n)（件数に比例）とみなした場合、24.0倍は n の増加率 8 に log2 8=3 をさらに掛けた場合、64.0倍は O(n²) とみなした場合。<br><br>【出典】検算: O(n log n)（ヒープソート・マージソート等の計算量）。python で比を計算。〔出題実績: R3 2-6〕"},
{"f":"基礎:情報・論理","q":"中置記法の式 a − b × (c + d) ÷ e を、逆ポーランド記法（後置記法）で表したものはどれか。ただし演算の優先順位は乗除が加減より高く、同順位の演算は左から順に行う。","h":"括弧内の c + d が最初に計算され、その後 b との積、さらに e での割り算、最後に a からの引き算になる。","c":["a b - c d + * e /","a b c * d + e / -","a b c d + * e / -","a b c d + e / - *"],"a":2,"v":"calc","n":"<b>正解は a b c d + * e / -</b>。式は a − ((b × (c+d)) ÷ e)。c d + で (c+d)、b を掛けて b c d + *、e で割って e /、最後に a から引く。後置記法は各演算子が直前の2つの値に作用する。<br>誤答の出どころ: 「a b - c d + * e /」は優先順位を無視して左から順に計算した場合（((a−b)×(c+d))÷e）、「a b c * d + e / -」は括弧を無視して b×c を先に計算した場合、「a b c d + e / - *」は割り算と引き算の結びつきを取り違えて a×(b−(c+d)÷e) の形にした場合。<br><br>【出典】検算: 後置記法への変換（操車場アルゴリズム）。python で各選択肢をスタックで評価し、乱数で元の式と値を比較して正解のみが一致することを確認。〔出題実績: R3 2-5〕"},
{"f":"基礎:情報・論理","q":"8ビットの2の補数表現で、10進数 −37 を表したものはどれか。","h":"37 を2進数で表し、全ビットを反転してから1を加える。","c":["11011010","11011011","10100101","00100101"],"a":1,"v":"calc","n":"<b>正解は11011011</b>。37=00100101、全ビット反転（1の補数）11011010、1を加えて11011011。検算: 11011011 を符号なしで読むと 219=256−37。<br>誤答の出どころ: 11011010 は1の補数で止めて1を加え忘れた場合、10100101 は符号ビットだけを1にした符号絶対値表現、00100101 は符号を処理せず +37 を答えた場合。<br><br>【出典】検算: 2の補数表現（−x = 2^n − x）。python で (-37)&0xFF を計算し、1の補数・符号絶対値との違いも確認。〔出題実績: R2 2-4〕"},
{"f":"基礎:情報・論理","q":"フィッシングやなりすましの手口に関する次の記述のうち、最も適切なものはどれか。","h":"ワンタイムパスワード（OTP）も、利用者本人が偽サイトへ入力してしまえば、攻撃者が使えてしまう。","c":["リアルタイムフィッシングでは、偽サイトにIDとパスワードを入力させた後でワンタイムパスワードも入力させ、攻撃者がそれを正規サイトへ即座に入力して多要素認証を突破しようとする。","SMS や認証アプリのワンタイムパスワードによる多要素認証を導入すれば、フィッシングサイトに入力してしまっても突破されないので、メールの見分け方の教育は不要になる。","中間者（AiTM）型のフィッシングでは、ブラウザーのアドレス欄に正規サイトのURLが表示されるため、URLの確認だけでは偽サイトと見抜けない。","フィッシングメールは特定の組織や個人だけを狙うもので、同じ文面を不特定多数に一斉に送りつける手口は、フィッシングには含まれない。"],"a":0,"v":"primary","n":"<b>正解は「リアルタイムフィッシングではOTPも入力させ、攻撃者がその場で正規サイトに入力して多要素認証を突破しようとする」</b>。IPAの資料は、リアルタイムフィッシングでは、偽サイトに入力させた情報をその場で抜き取って攻撃者が正規サイトに入力し、SMSや認証アプリを使った多要素認証を突破しようとする、と説明している。<br>誤答の出どころ: OTPの多要素認証を入れれば教育が不要になる、とする記述は、同資料が述べる突破の手口に反する（対策としてフィッシング耐性のある多要素認証が挙げられている）。AiTM では、ブラウザーには偽サイトのURLが表示される（接続先は正規サイトではない）と記載されている。フィッシングは実在の企業・サービスを騙るメールやSMSを不特定多数へ送るばらまき型が典型で、標的型とは区別される。<br><br>【出典】IPA「企業組織を狙う攻撃メールの手口とその対策」（2026年8月3日）2.1 フィッシング https://www.ipa.go.jp/security/support/rcu1hd0000019vmo-att/20260803_1.pdf（確認日 2026-10-04）〔出題実績: R1再 2-1、R4 2-1〕"},
{"f":"基礎:情報・論理","q":"10進法で表記された容量 500GB（1GB=10^9バイト）のストレージの容量を、2進接頭辞の GiB（1GiB=2^30バイト）で表したとき、最も近い値はどれか。","h":"500×10^9 バイトを 2^30 バイトで割ればよく、2^30 は 10^9 より約7.4%大きい。","c":["500.0GiB","536.9GiB","488.3GiB","465.7GiB"],"a":3,"v":"calc","n":"<b>正解は465.7GiB</b>。500×10^9÷2^30=500×10^9÷1,073,741,824≒465.66。GiB は 2^30 バイトで、GB（10^9）より大きいので、同じバイト数の数値は小さくなる。<br>誤答の出どころ: 500.0は単位の違い（GBとGiB）を無視した場合、536.9は掛け算と割り算を逆にした場合（500×2^30÷10^9）、488.3は 1024^3 でなく 1.024 倍の近似を1回だけ使って割った場合（500÷1.024）。<br><br>【出典】NIST「Prefixes for binary multiples」（kibi, mebi, gibi, tebi は 2^10, 2^20, 2^30, 2^40。IEC 60027-2 で規定）https://physics.nist.gov/cuu/Units/binary.html（確認日 2026-10-04）。検算: python。〔出題実績: R1再 2-3〕"},
{"f":"基礎:情報・論理","q":"IEEE 754 の単精度（32ビット）浮動小数点形式は、符号1ビット、指数部8ビット（バイアス127）、仮数部23ビット（最上位の1は省略）で実数を表す。10進数 −6.25 をこの形式で表したものを16進数で書いたものはどれか。","h":"6.25 を2進数にして 1.xxx×2^e の形に正規化し、指数にバイアスを加える。","c":["40C80000","C0C80000","C1480000","C0E40000"],"a":1,"v":"calc","n":"<b>正解は C0C80000</b>。6.25=110.01₂=1.1001×2^2。符号1（負）、指数=2+127=129=10000001₂、仮数部は 1001 に0を続けた23ビット。1 10000001 10010000000000000000000 を4ビットずつ区切ると C0C80000。<br>誤答の出どころ: 40C80000 は符号ビットを0（正）とした場合、C1480000 はバイアスを128として指数130を使った場合、C0E40000 は省略されるはずの最上位の1を仮数部に含めた場合（11001…）。<br><br>【出典】検算: IEEE 754-2019 binary32 の定義（符号1・指数8・仮数23、バイアス127）。python の struct.pack('>f', -6.25).hex() と、誤答の導出を再現して照合。〔出題実績: R1再 2-4〕"},
{"f":"基礎:情報・論理","q":"データ7ビットに偶数パリティの1ビットを付加した8ビットを伝送する。付加するビットは、8ビット全体の中の「1」の個数が偶数になるように決める。受信側は「1」の個数が奇数であれば伝送誤りありと判定する。伝送中に次のビット反転が起きたとき、受信側が誤りを検出できないものはどれか。","h":"反転したビットの個数が奇数のときと偶数のときで、「1」の個数の偶奇がどう変わるかを考える。","c":["データ部の1ビットだけが反転した。","付加したパリティビットだけが反転した。","データ部の2ビットが反転した。","データ部の3ビットが反転した。"],"a":2,"v":"calc","n":"<b>正解は「データ部の2ビットが反転した」</b>。ビットが反転するたびに「1」の個数は±1変わるので、反転したビット数が奇数なら偶奇が変わり、必ず検出できる。2ビット反転では偶奇が元に戻ることがあり、検出できない（8ビット全体で見ると偶数個の反転は検出できない）。<br>誤答の出どころ: データ部の1ビット、パリティビットだけ、データ部の3ビットは、いずれも反転したビット数が奇数で、「1」の個数が奇数になるので検出される。なお、1ビット誤りの検出はできても、どのビットが誤っているかは特定できない。<br><br>【出典】検算: パリティ検査の性質（反転ビット数が奇数なら検出、偶数なら検出不能）。python で 7ビットの全データ(128通り)と全反転パターン(255通り)を調べ、反転数の偶奇と検出可否が一致することを確認。〔出題実績: R4 2-4、R6 2-4〕"}

const KISO3_DATA = [
{"f":"基礎:解析","q":"なめらかな水平面上で、質量 m＝2.0 kg の物体を、ばね定数 k₁＝300 N/m と k₂＝600 N/m の2本のばねを直列に接続して壁につなぎ、軸方向に微小振動させる。この系の固有振動数 f [Hz] として最も適切なものはどれか。","h":"直列ばねの合成ばね定数は、抵抗の並列と同じ形の式になります。","c":["約3.4 Hz","約10 Hz","約1.6 Hz","約0.63 Hz"],"a":2,"v":"calc","n":"<b>直列の合成ばね定数 k＝k₁k₂/(k₁+k₂)＝300×600/900＝200 N/m</b>。f＝(1/2π)√(k/m)＝(1/2π)√(200/2.0)＝10/2π≒<b>1.59 Hz</b>。<br>約3.4 Hz は並列と見なして k＝k₁+k₂＝900 N/m とした値（直列と並列の取り違え）。約10 Hz は角振動数 ω＝√(k/m)＝10 rad/s を 2π で割らずに Hz とした値。約0.63 Hz は周期 T＝1/f＝0.628 s を振動数と混同した値。<br><br>【出典】検算: 直列ばねの合成式 1/k＝1/k₁+1/k₂、f＝(1/2π)√(k/m)（機械振動学の教科書）。verify_g3.py で数値確認〔出題実績: R1再 3-5、R2 3-5、R3 3-5、R4 3-6、R6 3-5〕"},
{"f":"基礎:解析","q":"上端を固定した、ばね定数 k＝200 N/m のばねの下端に質量 m＝0.50 kg の質点をつり下げると、つり合い位置で静止する。この位置から 0.060 m だけ鉛直下方に引き下げて静かに放すと、質点は単振動する。質点が最も下の位置にあるとき、ばねに蓄えられている弾性エネルギーとして最も適切なものはどれか。重力加速度は 9.8 m/s² とし、ばねの質量は無視する。","h":"最下点でのばねの伸びは、つり合い位置での伸びと振幅の和です。","c":["0.36 J","約0.13 J","約0.060 J","約0.71 J"],"a":3,"v":"calc","n":"つり合い位置のばねの伸び δ＝mg/k＝0.0245 m。最下点の伸びは δ+A＝0.0845 m なので、<b>E＝½k(δ+A)²＝½×200×0.0845²≒0.71 J</b>。<br>0.36 J は振幅だけを伸びとした ½kA²（重力による静的な伸びの見落とし）。約0.13 J は最上点（伸び A−δ＝0.0355 m）での値で、上下を逆にした場合。約0.060 J は ½kδ² で、つり合い位置での値。<br><br>【出典】検算: フックの法則とつり合い mg＝kδ、弾性エネルギー ½k(伸び)²（力学の教科書）。verify_g3.py で数値確認〔出題実績: R1再 3-5、R2 3-5、R3 3-5、R4 3-6、R6 3-5〕"},
{"f":"基礎:解析","q":"長さ L＝2.0 m の弦を張力 T＝100 N で両端に固定し、その中央に質量 m＝0.50 kg の質点を取り付ける。弦の質量は無視でき、質点が弦に垂直な方向に微小振動する間、張力は T のまま一定とみなせる。この系の固有振動数として最も適切なものはどれか。","h":"質点が x だけ変位したとき、弦の傾きは x/(L/2) です。左右2本の弦が復元力を出します。","c":["約2.3 Hz","約1.6 Hz","約20 Hz","約3.2 Hz"],"a":3,"v":"calc","n":"変位 x のとき弦の傾きは x/(L/2)。左右2本の弦の復元力は 2T×x/(L/2)＝(4T/L)x なので <b>k_eff＝4T/L＝200 N/m</b>。ω＝√(200/0.50)＝20 rad/s、<b>f＝ω/2π≒3.2 Hz</b>。<br>約2.3 Hz は傾きを x/L とした場合（k＝2T/L）、約1.6 Hz は弦1本分で傾きを x/L とした場合（k＝T/L）。約20 Hz は角振動数 20 rad/s を 2π で割らずに Hz とした値。<br><br>【出典】検算: 微小変位での力のつり合い（張力一定）から k_eff＝4T/L（弦の振動の教科書）。verify_g3.py で数値確認〔出題実績: R1再 3-5、R2 3-5、R3 3-5、R4 3-6、R6 3-5〕"},
{"f":"基礎:解析","q":"電卓が各演算の結果を、そのつど有効数字5桁に丸めるとする。√10001 − √10000 を、(A) 2つの平方根を求めてそのまま引き算する、(B) 1/(√10001 + √10000) に変形して計算する、の2通りで求めたとき、(A)、(B) の結果の組合せとして最も適切なものはどれか。","h":"近い値どうしの引き算では、有効数字が失われます。","c":["(A) 0　(B) 5.0000×10⁻³","(A) 5.0000×10⁻³　(B) 0","(A) 0　(B) 0","(A) 5.0000×10⁻³　(B) 5.0000×10⁻³"],"a":0,"v":"calc","n":"√10001＝100.005… は5桁で 100.00 になるため、(A) は 100.00−100.00＝<b>0</b>。絶対値の近い2数の引き算で有効桁が失われる<b>桁落ち</b>です。(B) は 1/(100.00+100.00)＝1/200.00＝<b>5.0000×10⁻³</b>（真値 4.99998750…×10⁻³ とよく一致）。<br>(A)と(B)を入れ替えた組は桁落ちを起こす側を逆にした場合。両方 0 は変形式でも消えると考えた場合。両方 5.0000×10⁻³ は、引き算に桁落ちは起きないと考えた場合。<br><br>【出典】検算: 桁落ちと、差を和の逆数に変形する有理化（数値計算の教科書）。5桁丸めを verify_g3.py で再現〔出題実績: R1再 3-3、R2 3-3、R4 3-3、R5 3-3〕"},
{"f":"基礎:解析","q":"浮動小数点演算の誤差に関する次の記述のうち、最も適切なものはどれか。","h":"桁落ちは近い2数の引き算で、情報落ちは大きさが極端に違う2数の加算で起こります。","c":["0.1 を10回足し合わせた値は、2進浮動小数点でも常にちょうど 1 になり、丸め誤差は生じない。","単精度から倍精度に変えると、仮数部の桁が増えて丸め誤差は大きくなるが、打切り誤差は小さくなる。","倍精度でも (1.0×10¹⁶＋1.0)−1.0×10¹⁶ が 0 になることがあり、これは情報落ちである。","x²＋10⁸x＋1＝0 を解の公式で解くと、2つの解がともに桁落ちなく、十分な精度で求まる。"],"a":2,"v":"calc","n":"<b>情報落ち</b>の説明として正しい。倍精度では 10¹⁶ 付近の刻みが 2 なので、1.0 を足しても値が変わらず、差は 0 になる（Python で (1e16+1.0)−1e16＝0.0 を確認）。<br>0.1 は2進数で有限桁に表せず、10回の加算は 0.9999999999999999 になる。単精度→倍精度は丸め誤差を小さくするもので、打切り誤差（アルゴリズムに由来）は変わらない。解の公式は b²≫4ac のとき、−b と √(b²−4ac) がほぼ等しく符号が逆の側の解で桁落ちを起こす。上の方程式では小さい根（真値 約−1×10⁻⁸）が約−7.5×10⁻⁹ になり、約25%もずれる。<br><br>【出典】検算: IEEE 754 倍精度の丸め挙動（情報落ち・桁落ちの定義は数値計算の教科書）。verify_g3.py で Python 実行して確認〔出題実績: R1再 3-3、R2 3-3、R4 3-3、R5 3-3〕"},
{"f":"基礎:解析","q":"数値計算における誤差と連立1次方程式の解法に関する次の記述のうち、最も不適切なものはどれか。","h":"有限回で終わる解法であることと、誤差が出ないことは別の話です。","c":["無限級数を有限項で打ち切って近似値を求めるときに生じる誤差は打切り誤差で、項数を増やすと一般に小さくなる。","ガウスの消去法は有限回の四則演算で終了する直接法なので、浮動小数点演算で実行しても丸め誤差の影響を受けない。","係数行列の条件数が大きい連立1次方程式では、右辺や係数の微小な誤差が、解に大きく拡大されて現れることがある。","反復法で収束判定のしきい値を小さくすると、一般に反復回数は増えるが、解に残る打切り誤差は小さくなる。"],"a":1,"v":"calc","n":"<b>直接法でも丸め誤差は生じます</b>。12×12 のヒルベルト行列（条件数が約10¹⁶）の方程式を、解を全て 1 とした右辺で倍精度のガウス消去（部分ピボット）を行うと、解の誤差は 10⁻⁴ 以上に達します（verify_g3.py で確認）。<br>他の3つは正しい記述です。打切り誤差は級数や反復の打切りに由来し、条件数は誤差の拡大率の目安で、反復法のしきい値を小さくすると収束解に近づきます。<br><br>【出典】検算: ヒルベルト行列の条件数と直接法の誤差（数値線形代数の教科書）。verify_g3.py で再現〔出題実績: R1再 3-3、R2 3-3、R4 3-3、R5 3-3〕"},
{"f":"基礎:解析","q":"1本の抵抗が 24 Ω の導線12本を用いて、立方体の12辺の形に回路を組む。立方体の1つの頂点 A と、A から最も遠い（体対角の位置にある）頂点 B の間の合成抵抗として最も適切なものはどれか。接続部の抵抗は無視する。","h":"対称性から、A から出る3辺の先の3点は等電位です。","c":["18 Ω","14 Ω","20 Ω","16 Ω"],"a":2,"v":"calc","n":"A の隣3点は等電位、B の隣3点も等電位。A→隣3点は3本並列で 24/3＝8 Ω、中央の6本並列で 24/6＝4 Ω、B 側の3本並列で 8 Ω。直列にして <b>8＋4＋8＝20 Ω</b>（＝5R/6）。<br>18 Ω（3R/4）は同じ面の対角にある頂点間の値、14 Ω（7R/12）は隣り合う頂点間の値。16 Ω は中央の6本並列の段（4 Ω）を数え落とした 8＋8 の値。<br><br>【出典】検算: 立方体回路の5R/6（電気回路の教科書の定番）。節点電位法で全頂点対を verify_g3.py で数値計算し一致を確認〔出題実績: R5 3-6、R6 3-6、R7 3-5〕"},
{"f":"基礎:解析","q":"端子 A, B の間に、A→C: 2 Ω、C→B: 4 Ω、A→D: 3 Ω、D→B: 6 Ω の4本の抵抗を接続し、さらに C と D の間に 10 Ω の抵抗をつないだ（ブリッジ回路）。A–B 間の合成抵抗として最も適切なものはどれか。","h":"2×6 と 4×3 を比べてみてください。","c":["約3.3 Ω","約0.74 Ω","3.6 Ω","15 Ω"],"a":2,"v":"calc","n":"抵抗の積 2×6＝12 と 4×3＝12 が等しい<b>平衡ブリッジ</b>なので、C と D は等電位で 10 Ω には電流が流れず、無視（または短絡）してよい。(2＋4) Ω と (3＋6) Ω の並列で <b>6×9/15＝3.6 Ω</b>。<br>約3.3 Ω は (2＋3) と (4＋6) の並列とした値（接続の組み方の誤り）。約0.74 Ω は5本すべてを並列とした値。15 Ω は 6 Ω＋9 Ω を直列にした値。<br><br>【出典】検算: ブリッジの平衡条件 R₁R₄＝R₂R₃（電気回路の教科書）。節点電位法で verify_g3.py により 3.6 Ω を確認〔出題実績: R5 3-6、R6 3-6、R7 3-5〕"},
{"f":"基礎:解析","q":"1本の抵抗が 6 Ω の導線6本で、正四面体の6辺の形に回路を組む。頂点 A と頂点 B の間（1辺の両端）の合成抵抗として最も適切なものはどれか。","h":"残る2頂点 C, D は、A と B から見て同じ位置にあります。","c":["3 Ω","2 Ω","4 Ω","1 Ω"],"a":0,"v":"calc","n":"C と D は等電位なので、C–D 間の辺は電流が流れず無視できる。A–B 間は、直結の 6 Ω、A→C→B の 12 Ω、A→D→B の 12 Ω の3経路が並列で、<b>1/(1/6＋1/12＋1/12)＝3 Ω</b>（＝R/2）。<br>2 Ω は3経路をすべて 6 Ω と見て R/3 とした値。4 Ω は C 経由か D 経由の一方を数え落とし、6 Ω と 12 Ω の2本並列とした値。1 Ω は6本すべてを並列とした R/6。<br><br>【出典】検算: 対称性による等電位点の省略（電気回路の教科書）。節点電位法で verify_g3.py により 3 Ω を確認〔出題実績: R5 3-6、R6 3-6、R7 3-5〕"},
{"f":"基礎:解析","q":"定積分 ∫₁³ (1/x) dx を、区間 [1, 3] を2等分（刻み h＝1）して、シンプソンの1/3公式で近似したときの値として最も近いものはどれか。","h":"シンプソンの1/3公式の重みは、両端と中央で 1：4：1 です。","c":["0.78","1.17","1.11","1.33"],"a":2,"v":"calc","n":"シンプソンの1/3公式は ∫≒(h/3){f(1)＋4f(2)＋f(3)}＝(1/3)(1＋2＋1/3)＝<b>1.111</b>（厳密値 ln3＝1.0986）。<br>0.78 は重みを 1：2：1 とした値。1.17 は台形公式（2分割）h/2{f(1)＋2f(2)＋f(3)} の値。1.33 は台形公式を区間全体で1回だけ適用した (3−1)/2×{f(1)＋f(3)} の値。<br><br>【出典】検算: シンプソンの1/3公式 (h/3)(f₀＋4f₁＋f₂)、台形公式（数値解析の教科書）。verify_g3.py で数値確認〔出題実績: R1再 3-4、R3 3-2、R7 3-3〕"},
{"f":"基礎:解析","q":"∫₀¹ eˣ dx を、区間の分割数 n を4から8に増やして近似する。このとき、厳密値との誤差は分割数 4 の場合のおよそ何倍になるか。台形公式とシンプソンの1/3公式の組合せとして最も適切なものはどれか。ただし、被積分関数は滑らかで、丸め誤差は無視できるものとする。","h":"台形公式の誤差は刻み幅の2乗、シンプソン公式の誤差は刻み幅の4乗に比例します。","c":["台形公式: 約1/2、シンプソン公式: 約1/4","台形公式: 約1/16、シンプソン公式: 約1/4","台形公式: 約1/4、シンプソン公式: 約1/16","台形公式: 約1/4、シンプソン公式: 約1/8"],"a":2,"v":"calc","n":"刻み幅 h が半分になると、台形公式の誤差（O(h²)）は <b>約1/4</b>、シンプソン公式の誤差（O(h⁴)）は <b>約1/16</b> になる。実際に計算すると誤差比は台形 0.250、シンプソン 0.0625（≒1/16）。<br>1/2 と 1/4 の組は誤差を h の1乗と2乗に比例すると考えた場合。台形とシンプソンを入れ替えた組は精度の高い方を逆にした場合。1/4 と 1/8 の組はシンプソン公式の誤差を h³ に比例すると考えた場合。<br><br>【出典】検算: 台形公式 O(h²)・シンプソン公式 O(h⁴) の誤差評価（数値解析の教科書）。verify_g3.py で n＝4, 8 の誤差比を計算〔出題実績: R1再 3-4、R3 3-2、R7 3-3〕"},
{"f":"基礎:解析","q":"f(x)＝x³ を区間 [0, 2] で積分する。区間を2等分（刻み h＝1）して次の4つの公式で近似したとき、近似値が厳密値 ∫₀² x³dx＝4 と一致するものはどれか。","h":"3次関数まで厳密に積分できる公式を選びます。","c":["台形公式","中点公式","左端点を用いる長方形公式","シンプソンの1/3公式"],"a":3,"v":"calc","n":"シンプソンの1/3公式は3次関数まで厳密で、(1/3){0＋4×1＋8}＝<b>4</b> と一致する。<br>台形公式は (1/2){0＋2×1＋8}＝5。中点公式は 1×(0.5³＋1.5³)＝3.5。左端点の長方形公式は 1×(0＋1)＝1。いずれも2次以上の項で誤差が残る（台形・中点は1次関数まで、長方形は定数まで厳密）。<br><br>【出典】検算: シンプソン公式の代数的精度が3次（数値解析の教科書）。4公式の値を verify_g3.py で計算〔出題実績: R1再 3-4、R3 3-2、R7 3-3〕"},
{"f":"基礎:解析","q":"断面積 250 mm²、長さ 1.5 m の一様な線形弾性体の棒の上端を固定し、下端を 15 kN の力で軸方向に引っ張った。棒の伸びとして最も近いものはどれか。ヤング率は 200 GPa とし、自重は無視する。","h":"δ＝PL/(AE) に入れる前に、単位を N, m に揃えます。","c":["0.45 mm","4.5 mm","0.045 mm","0.90 mm"],"a":0,"v":"calc","n":"δ＝PL/(AE)＝(15×10³ N × 1.5 m)/(250×10⁻⁶ m² × 200×10⁹ Pa)＝4.5×10⁻⁴ m＝<b>0.45 mm</b>。<br>4.5 mm と 0.045 mm は 10 倍・1/10 の桁ずれ（mm²→m² などの単位換算ミス）。0.90 mm は力を2倍にして（両端から引くと考えて）計算した値。<br><br>【出典】検算: δ＝PL/(AE)（材料力学の教科書）。verify_g3.py で数値確認〔出題実績: R3 3-4、R5 3-4、R7 3-4〕"},
{"f":"基礎:解析","q":"長さ 1.5 m、断面積 400 mm² の棒の両端を、動かない剛な壁に固定し、最初の応力ゼロの状態から全体を 50 K 温度上昇させた。線膨張係数を 1.2×10⁻⁵ /K、ヤング率を 200 GPa（＝2.0×10⁵ MPa）とするとき、棒に生じる応力として最も適切なものはどれか。","h":"熱膨張を壁に止められるので、棒は縮められる向きの力を受けます。","c":["圧縮応力 120 MPa","引張応力 120 MPa","圧縮応力 60 MPa","圧縮応力 0.12 MPa"],"a":0,"v":"calc","n":"拘束がなければ棒は αLΔT だけ伸びるが、壁に止められるので同じ量だけ押し縮められる。<b>σ＝EαΔT＝2.0×10⁵×1.2×10⁻⁵×50＝120 MPa（圧縮）</b>。長さと断面積は応力に影響しない。<br>引張は符号の誤り。60 MPa は片側だけが拘束されると考えて半分にした値。0.12 MPa は E を 200 のまま（GPa を MPa に直さず）に計算した単位ミス。<br><br>【出典】検算: 完全拘束の熱応力 σ＝−EαΔT（材料力学の教科書）。verify_g3.py で数値確認〔出題実績: R3 3-4、R5 3-4、R7 3-4〕"},
{"f":"基礎:解析","q":"同じ材質・同じ断面の一様な棒の両端 A, B を剛な壁に固定する。全長は 1.0 m で、A から 0.3 m の位置 C に、A から B へ向かう軸方向の力 P＝10 kN を加えた。壁が棒に及ぼす反力の大きさ R_A, R_B の組合せとして最も適切なものはどれか。","h":"AC 部が伸びる量と CB 部が縮む量は等しく、棒全体の長さは変わりません。","c":["R_A＝3 kN、R_B＝7 kN","R_A＝7 kN、R_B＝3 kN","R_A＝5 kN、R_B＝5 kN","R_A＝10 kN、R_B＝0 kN"],"a":1,"v":"calc","n":"荷重点に近い側の壁ほど大きな反力を受け持つ。つり合い R_A＋R_B＝P と、棒全体の長さが変わらない条件 R_A×0.3（AC の伸び）＝R_B×0.7（CB の縮み）から、<b>R_A＝7 kN、R_B＝3 kN</b>（A 側の短い部分が主に荷重を受け持つ）。<br>R_A＝3、R_B＝7 は長さの比を逆に使った場合。5：5 は荷重点が中央にあると見なした場合。10：0 は一方の壁だけが荷重を受けると考えた不静定性の見落とし。<br><br>【出典】検算: 不静定棒のつり合いと適合条件（材料力学の教科書）。verify_g3.py で数値確認〔出題実績: R3 3-4、R5 3-4、R7 3-4〕"},
{"f":"基礎:解析","q":"3次元空間で、原点を通る平面 S: 2x − y + 2z ＝ 0 と、点 A(2, 3, 1) がある。A から S に下ろした垂線の足 B の座標として最も適切なものはどれか。","h":"S の法線ベクトルは (2, −1, 2) です。A から法線方向に、S に届く距離だけ戻ります。","c":["(4/3, 10/3, 1/3)","(8/3, 8/3, 5/3)","(0, 4, −1)","(2/3, −1/3, 2/3)"],"a":0,"v":"calc","n":"法線ベクトル n＝(2, −1, 2)、n·A＝4−3+2＝3、|n|²＝9。B＝A − {(n·A)/|n|²}n＝(2, 3, 1) − (1/3)(2, −1, 2)＝<b>(4/3, 10/3, 1/3)</b>。B は 2x−y+2z＝8/3−10/3+2/3＝0 を満たす。<br>(8/3, 8/3, 5/3) は引かずに足した（符号の誤り）。(0, 4, −1) は |n|² でなく |n|＝3 で割った値。(2/3, −1/3, 2/3) は A の n 方向への射影成分そのもので、平面上の点ではない。<br><br>【出典】検算: 点から平面への垂線の足 B＝A−{(n·A)/|n|²}n（線形代数の教科書）。verify_g3.py で数値確認〔出題実績: R1再 3-2、R4 3-2、R6 3-2〕"},
{"f":"基礎:解析","q":"3次元ベクトル a, b, c について、内積を a·b、外積を a×b と書く。次の関係式のうち、必ずしも成立しないものはどれか。","h":"外積は積の組み方（かっこの位置）を変えられるかを考えます。","c":["a · (a × b) ＝ 0","a × b ＝ −(b × a)","|a × b|² ＝ |a|²|b|² − (a · b)²","a × (b × c) ＝ (a × b) × c"],"a":3,"v":"calc","n":"外積は結合法則を満たさない。<b>a×(b×c)＝b(a·c)−c(a·b)</b> と <b>(a×b)×c＝b(c·a)−a(c·b)</b> は一般に一致しない（乱数のベクトルで成立しないことを確認）。<br>他の3つは常に成り立つ。a×b は a にも b にも垂直なので a·(a×b)＝0。外積は反交換的で a×b＝−b×a。|a×b|²＝|a|²|b|²sin²θ＝|a|²|b|²−(a·b)²（ラグランジュの恒等式）。<br><br>【出典】検算: ベクトル三重積の公式、ラグランジュの恒等式（ベクトル解析の教科書）。乱数ベクトル200組で verify_g3.py により確認〔出題実績: R1再 3-2、R4 3-2、R6 3-2〕"},
{"f":"基礎:解析","q":"ベクトル a＝(1, 2, 2) と b＝(2, −1, 2) を2辺とする平行四辺形の面積として最も適切なものはどれか。","h":"面積は2辺の外積ベクトルの大きさです。","c":["4.00","8.06","9.00","65.0"],"a":1,"v":"calc","n":"a×b＝(2×2−2×(−1), 2×2−1×2, 1×(−1)−2×2)＝(6, 2, −5)。面積＝|a×b|＝√(36+4+25)＝<b>√65≒8.06</b>。<br>4.00 は内積 a·b＝2−2+4＝4（外積と内積の取り違え）。9.00 は |a||b|＝3×3（sinθ を掛け忘れた値）。65.0 は平方根を取り忘れた |a×b|²。<br><br>【出典】検算: 平行四辺形の面積＝|a×b|（ベクトル解析の教科書）。verify_g3.py で数値確認〔出題実績: R1再 3-2、R4 3-2、R6 3-2〕"},
{"f":"基礎:解析","q":"関数 f(x, y)＝x²y − 3y² の点 (x, y)＝(2, 1) における最急勾配の大きさ |grad f| として、最も適切なものはどれか。ただし grad f＝(∂f/∂x, ∂f/∂y) である。","h":"答えは向きではなく大きさ（長さ）です。","c":["(4, −2)","2√5","20","2"],"a":1,"v":"calc","n":"∂f/∂x＝2xy＝4、∂f/∂y＝x²−6y＝4−6＝−2 なので grad f＝(4, −2)。大きさは √(16+4)＝√20＝<b>2√5</b>。<br>(4, −2) は大きさでなくベクトルそのもの。20 は平方根を取り忘れた値。2 は成分の和 4＋(−2) を取った値（大きさの定義を使っていない）。<br><br>【出典】検算: grad f＝(∂f/∂x, ∂f/∂y)、|grad f|＝√(f_x²＋f_y²)（ベクトル解析の教科書）。差分で偏微分を verify_g3.py で確認〔出題実績: R2 3-2、R7 3-2〕"},
{"f":"基礎:解析","q":"関数 f(x, y)＝x² ＋ 3y² の点 (1, 1) から出発して、f の値が最も急に減少する向きの単位ベクトルとして最も適切なものはどれか。","h":"最急降下の向きは、勾配ベクトルの向きに対して正反対です。","c":["(1, 3)/√10","(−1, −3)/√10","(−3, −1)/√10","(−1, −1)/√2"],"a":1,"v":"calc","n":"grad f＝(2x, 6y)＝(2, 6)。f が最も急に増える向きは grad f の向き (1, 3)/√10、最も急に減る向き（最急降下方向）はその逆の<b>(−1, −3)/√10</b>。全方向を調べても、この向きで f の減少が最大になることを数値で確認した。<br>(1, 3)/√10 は増加の向き（符号の誤り）。(−3, −1)/√10 は成分 x, y の偏微分を入れ替えた向き。(−1, −1)/√2 は原点方向を向くだけで、y 方向の係数 3 を考慮していない。<br><br>【出典】検算: 勾配ベクトルは関数が最も急に増加する向きを指す（ベクトル解析・最適化の教科書）。全方向の数値探索で verify_g3.py により確認〔出題実績: R2 3-2、R7 3-2〕"},
{"f":"基礎:解析","q":"行列 A＝(1 0 0; 2 1 0; 3 4 1)（行を「;」で区切って示す）の逆行列として、最も適切なものはどれか。","h":"A は下三角行列です。A·A⁻¹＝E となるように、上の行から順に成分を決めます。","c":["(1 0 0; -2 1 0; -3 -4 1)","(1 -2 5; 0 1 -4; 0 0 1)","(1 0 0; -2 1 0; 11 -4 1)","(1 0 0; -2 1 0; 5 -4 1)"],"a":3,"v":"calc","n":"A⁻¹ の第1行は (1 0 0)、第2行は (−2 1 0)。第3行は 3×1＋4×(−2)＋1×x＝0 から x＝5、4×1＋y＝0 から y＝−4 となり、<b>A⁻¹＝(1 0 0; −2 1 0; 5 −4 1)</b>。A·A⁻¹＝E を確認した。<br>(1 0 0; −2 1 0; −3 −4 1) は対角以外の成分の符号を単純に反転した値で、3×3 では (3,1) 成分が合わない。上三角の形のものは転置（行と列の入れ替え）をした値。(3,1) 成分が 11 のものは 3＋4×2 と符号を誤って足した値。<br><br>【出典】検算: 三角行列の逆行列は前進代入で求められる（線形代数の教科書）。A·A⁻¹＝E を verify_g3.py で確認〔出題実績: R5 3-1、R7 3-1〕"},
{"f":"基礎:解析","q":"行列 A＝(1 2 3; 0 1 4; 5 6 0)（行を「;」で区切って示す）は det A＝1 で、逆行列 A⁻¹ をもつ。A⁻¹ の第3行第1列の成分として、最も適切なものはどれか。","h":"余因子行列を転置してから det A で割ります。第3行第1列は、余因子 C₁₃ に対応します。","c":["5","−5","4","−4"],"a":1,"v":"calc","n":"A⁻¹＝(1/det A)×(余因子行列の転置)。A⁻¹ の (3,1) 成分は余因子 C₁₃＝(+1)×det(0 1; 5 6)＝0×6−1×5＝<b>−5</b>（det A＝1）。全体は A⁻¹＝(−24 18 5; 20 −15 −4; −5 4 1) で、A·A⁻¹＝E を確認した。<br>5 は転置を忘れて C₃₁＝det(2 3; 1 4)＝5 を使った値。4 は隣の成分 (3,2) の値、−4 は (2,3) の値（添字の取り違え）。<br><br>【出典】検算: 余因子による逆行列 A⁻¹＝(1/det A)·C^T（線形代数の教科書）。A·A⁻¹＝E を verify_g3.py で確認〔出題実績: R5 3-1、R7 3-1〕"},
{"f":"基礎:解析","q":"モータ出力軸から、損失のない減速機（モータ軸の回転数に対し、出力軸の回転数が 1/4）を介して、出力軸に慣性モーメント 2.0 kg·m² の円盤を取り付ける。円盤を静止状態から 5.0 s かけて 50 rad/s まで一定の角加速度で増速させるために必要なモータ出力軸のトルクはいくらか。減速機とモータの慣性モーメントは無視する。","h":"損失がなければ、減速機の入出力でトルク×角速度（仕事率）が等しくなります。","c":["20 N·m","80 N·m","5 N·m","1.25 N·m"],"a":2,"v":"calc","n":"角加速度 α＝50/5.0＝10 rad/s²。円盤に必要なトルクは T＝Iα＝2.0×10＝20 N·m。減速機は損失がないので入力側の仕事率＝出力側の仕事率で、回転数が 1/4 ならトルクは 4 倍になる。モータ側は 20/4＝<b>5 N·m</b>。<br>20 N·m は減速機を無視した値。80 N·m は減速比を逆に掛けた値。1.25 N·m は減速比を2回割った値。<br><br>【出典】検算: T＝Iα、損失なしの変速機では T_in×ω_in＝T_out×ω_out（機械力学の教科書）。verify_g3.py で数値確認〔出題実績: R4 3-5、R5 3-5〕"},
{"f":"基礎:解析","q":"質量 8.0 kg、半径 0.50 m の一様な円板が、中心を通る固定軸のまわりに摩擦なく回転できる。静止した状態から、円板の縁に接線方向の一定の力 20 N を 10 s 間加え続けたとき、10 s 後の角速度 [rad/s] として最も適切なものはどれか。","h":"一様な円板の慣性モーメントは ½MR² です。トルクは「力×腕の長さ」です。","c":["100 rad/s","50 rad/s","200 rad/s","10 rad/s"],"a":0,"v":"calc","n":"I＝½MR²＝½×8.0×0.50²＝1.0 kg·m²。トルク N＝FR＝20×0.50＝10 N·m。角加速度 α＝N/I＝10 rad/s²、10 s 後は ω＝αt＝<b>100 rad/s</b>。<br>50 rad/s は円板を細いリング（I＝MR²＝2.0）と見なした値。200 rad/s は腕の長さ R を掛け忘れて N＝F とした値。10 rad/s は α そのもので、時間 t を掛けていない値。<br><br>【出典】検算: 円板の慣性モーメント I＝½MR²、運動方程式 Iα＝FR（力学の教科書）。verify_g3.py で数値確認〔出題実績: R4 3-5、R5 3-5〕"},
{"f":"基礎:解析","q":"ベクトル場 V＝(x²y, yz², x＋z³) の点 (1, 2, 1) における発散 div V の値として、最も適切なものはどれか。ただし div V＝∂Vₓ/∂x＋∂V_y/∂y＋∂V_z/∂z である。","h":"同じ向きの成分どうし（Vₓ を x で、V_y を y で、V_z を z で）の偏微分を足します。","c":["6","8","4","12"],"a":1,"v":"calc","n":"∂Vₓ/∂x＝2xy＝4、∂V_y/∂y＝z²＝1、∂V_z/∂z＝3z²＝3。足して <b>div V＝8</b>（数値微分でも確認）。<br>6 は異なる成分と変数を組み合わせた ∂Vₓ/∂y＋∂V_y/∂z＋∂V_z/∂x＝1＋4＋1（回転の式に出てくる組合せの取り違え）。4 は ∂Vₓ/∂x だけを取った値。12 は3つの偏微分を足さずに掛けた値。<br><br>【出典】検算: div V＝∂Vₓ/∂x＋∂V_y/∂y＋∂V_z/∂z（ベクトル解析の教科書）。数値微分で verify_g3.py により確認〔出題実績: R2 3-1、R3 3-1〕"},
{"f":"基礎:解析","q":"ベクトル場 V＝(y z², x² z, x y²) の点 (1, 2, 3) における回転 rot V として、最も適切なものはどれか。ただし rot V＝(∂V_z/∂y − ∂V_y/∂z, ∂Vₓ/∂z − ∂V_z/∂x, ∂V_y/∂x − ∂Vₓ/∂y) である。","h":"各成分を、式の通りに（符号も含めて）順に計算します。","c":["(−3, −8, 3)","(3, −8, −3)","(3, 8, −3)","(−3, 8, 3)"],"a":2,"v":"calc","n":"第1成分 ∂V_z/∂y−∂V_y/∂z＝2xy−x²＝4−1＝3。第2成分 ∂Vₓ/∂z−∂V_z/∂x＝2yz−y²＝12−4＝8。第3成分 ∂V_y/∂x−∂Vₓ/∂y＝2xz−z²＝6−9＝−3。よって <b>rot V＝(3, 8, −3)</b>（数値微分で確認）。<br>(−3, −8, 3) は全成分の引き算の順序を逆にした値。(3, −8, −3) は第2成分だけ符号を逆にした値（行列式の展開で中央の項の符号を落とす典型例）。(−3, 8, 3) は第1・第3成分の符号を逆にした値。<br><br>【出典】検算: rot V の成分表示（ベクトル解析の教科書）。数値微分で verify_g3.py により確認〔出題実績: R2 3-1、R3 3-1〕"},
{"f":"基礎:解析","q":"有限要素法で三角形要素の内部を表すときに使う面積座標を考える。頂点 A(0, 0)、B(4, 0)、C(0, 3) の三角形 ABC の内部の点 P(1, 1) の面積座標 (L_A, L_B, L_C) として、最も適切なものはどれか。ただし L_A は三角形 PBC と ABC の面積比、L_B は三角形 PCA と ABC の面積比、L_C は三角形 PAB と ABC の面積比である。","h":"三角形 ABC の面積は 6 です。3つの面積座標の和は 1 になります。","c":["(1/3, 5/12, 1/4)","(1/4, 1/3, 5/12)","(1/3, 1/3, 1/3)","(5/12, 1/4, 1/3)"],"a":3,"v":"calc","n":"三角形 ABC の面積は ½×4×3＝6。三角形 PBC＝5/2、PCA＝3/2、PAB＝2 なので、<b>(L_A, L_B, L_C)＝(5/12, 1/4, 1/3)</b>（和は1）。座標の確認は L_A×0＋L_B×4＋L_C×0＝1（x）、L_A×0＋L_B×0＋L_C×3＝1（y）。<br>(1/3, 5/12, 1/4) と (1/4, 1/3, 5/12) は面積と頂点の対応を1つずつずらした値（向かい合う頂点の取り違え）。(1/3, 1/3, 1/3) は重心の面積座標。<br><br>【出典】検算: 面積座標 L_i＝(対辺を底辺とする三角形の面積)/(全体の面積)、x＝ΣL_i x_i（有限要素法の教科書）。verify_g3.py で数値確認〔出題実績: R2 3-4、R3 3-3〕"},
{"f":"基礎:解析","q":"有限要素法（変位法）に関する次の記述のうち、最も適切なものはどれか。","h":"構造が空間内で動かないように固定する条件が、まだ与えられていない場合を考えます。","c":["3節点三角形要素（1次要素）では、要素内のひずみは座標に対して線形に変化し、その結果、要素内の応力も線形に変化する。","支持条件を与える前の全体剛性行列は、構造全体が剛体として動ける自由度を持つため特異であり、そのままでは逆行列が存在しない。","変位法の有限要素法では、各節点の応力を未知数として剛性方程式を組み立て、得られた応力からひずみと変位を求める。","要素分割を細かくしても、増えるのは節点の数だけであり、解が厳密解に近づくことは一般に期待できない。"],"a":1,"v":"textbook","n":"正しいのは全体剛性行列の記述。拘束がないと構造全体の剛体変位（並進・回転）が解に含まれ、行列は特異になる（2要素のばね系で det K＝0、剛体並進が零固有ベクトルになることを数値確認）。支持条件で自由度を拘束して初めて解ける。<br>3節点三角形要素のひずみは要素内で<b>一定</b>（変位が線形のため）。変位法の未知数は節点変位で、応力は後で求める。要素分割を細かくすると一般に近似誤差は小さくなり、解は厳密解に収束する。<br><br>【出典】教科書的知識（一次資料は未確認）。2要素ばねの全体剛性行列の特異性を verify_g3.py で数値確認〔出題実績: R2 3-4、R3 3-3〕"},
{"f":"基礎:解析","q":"水平な平行レール（間隔 L＝0.40 m）の端に抵抗 R＝2.0 Ω をつなぎ、レールの上に導体棒をレールに直角にのせる。レール面に垂直に磁束密度 B＝0.50 T の一様な磁界がある。棒の中点にひもをつけ、滑車を経て質量 M＝0.050 kg のおもりをつり下げると、棒は動き出し、やがて一定の速さ v で動き続ける。v として最も適切なものはどれか。レールと棒の抵抗、摩擦、空気抵抗は無視し、重力加速度は 9.8 m/s² とする。","h":"一定の速さになったとき、おもりが引く力と、棒が磁界から受ける力はつり合っています。","c":["4.9 m/s","24.5 m/s","6.1 m/s","9.8 m/s"],"a":1,"v":"calc","n":"起電力 e＝BLv、電流 I＝BLv/R。棒が磁界から受ける力は BIL＝(BL)²v/R。これがおもりの重力 Mg とつり合うので <b>v＝MgR/(BL)²</b>＝0.050×9.8×2.0/(0.20)²＝<b>24.5 m/s</b>。<br>4.9 m/s は分母を (BL)² でなく BL とした値（2乗の付け忘れ）。6.1 m/s は R を分子でなく分母に置いた値 Mg/{(BL)²R}。9.8 m/s は分母を B²L とした値（L の2乗の付け忘れ）。<br><br>【出典】検算: ファラデーの法則 e＝BLv とローレンツ力 F＝BIL のつり合い（電磁気学の教科書）。verify_g3.py で数値確認〔出題実績: R7 3-6〕"},
{"f":"基礎:解析","q":"方程式 f(x)＝x² − 7＝0 の正の解を、ニュートン法（ニュートン・ラフソン法）x_{n+1}＝x_n − f(x_n)/f′(x_n) で求める。初期値を x₀＝3 とするとき、2回反復した後の x₂ の値として最も近いものはどれか。","h":"f′(x)＝2x を使い、x₁ を求めてから、その x₁ で再び同じ式を適用します。","c":["2.667","3.000","3.95","2.646"],"a":3,"v":"calc","n":"f′(x)＝2x。x₁＝3−(9−7)/6＝2.6667、x₂＝2.6667−(7.1111−7)/5.3333＝<b>2.6458</b>（√7＝2.64575…）。<br>2.667 は1回反復後の x₁。3.000 は f′(x) を x としてしまい（係数2の見落とし）、x₁＝2.333、x₂＝3.000 になった値。3.95 は修正量の符号を逆にして足した値で、解から遠ざかる。なお収束判定は |Δx|＜ε（Δx＝−f/f′）で行う。<br><br>【出典】検算: ニュートン法の反復式（数値解析の教科書）。反復値を verify_g3.py で計算〔出題実績: R6 3-3〕"},
{"f":"基礎:解析","q":"変数 f, g が x, y の関数として f＝x²y、g＝x＋y² で与えられ、関数 u(f, g) の偏微分が点 (x, y)＝(2, 1) で ∂u/∂f＝3、∂u/∂g＝2 であるとする。連鎖律により ∂u/∂x と ∂u/∂y を求めたとき、(∂u/∂x, ∂u/∂y) として最も適切なものはどれか。","h":"∂u/∂x＝(∂u/∂f)(∂f/∂x)＋(∂u/∂g)(∂g/∂x) です。∂u/∂y も同様に組み立てます。","c":["(14, 16)","(20, 7)","(11, 14)","(16, 14)"],"a":0,"v":"calc","n":"(2, 1) で ∂f/∂x＝2xy＝4、∂f/∂y＝x²＝4、∂g/∂x＝1、∂g/∂y＝2y＝2。∂u/∂x＝3×4＋2×1＝<b>14</b>、∂u/∂y＝3×4＋2×2＝<b>16</b>。ヤコビ行列 J＝(∂f/∂x ∂g/∂x; ∂f/∂y ∂g/∂y)＝(4 1; 4 2) と (3, 2) の積に相当する。<br>(20, 7) は J を転置（行と列を入れ替え）して掛けた値。(11, 14) は重み ∂u/∂f と ∂u/∂g を取り違えて 2, 3 とした値。(16, 14) は結果の2成分を入れ替えた値。<br><br>【出典】検算: 多変数の連鎖律とヤコビ行列（解析学の教科書）。u＝3f＋2g の直接微分を sympy で確認〔出題実績: R6 3-1〕"},
{"f":"基礎:解析","q":"材料・断面・長さが同じ柱で、両端がピンで支持されたときのオイラー座屈荷重を 1 とする。(a) 一端固定・他端自由、(b) 一端固定・他端ピン、(c) 両端固定、の各支持条件の座屈荷重の比 (a : b : c) として、最も適切なものはどれか。","h":"座屈荷重は有効長さ係数 K を使った Pcr＝π²EI/(KL)² で、K は2乗で効きます。","c":["約 1/2 : 1.4 : 2","約 4 : 2 : 1/4","約 1/4 : 2 : 4","約 1/4 : 1.4 : 4"],"a":2,"v":"calc","n":"有効長さ係数は両端ピン K＝1、(a) 一端固定・他端自由 K＝2、(b) 一端固定・他端ピン K＝0.7、(c) 両端固定 K＝0.5。Pcr∝1/K² なので、(a)＝1/4、(b)＝1/0.49≒2.0、(c)＝1/0.25＝4。比は <b>1/4 : 2 : 4</b>。<br>1/2 : 1.4 : 2 は K の2乗を忘れて 1/K を使った値。4 : 2 : 1/4 は (a) と (c) の大小を逆にした値。1/4 : 1.4 : 4 は (b) だけ K の2乗を忘れた値。<br><br>【出典】検算: オイラーの座屈荷重 Pcr＝π²EI/(KL)² と有効長さ係数（材料力学の教科書）。比を verify_g3.py で計算〔出題実績: R6 3-4〕"},
{"f":"基礎:解析","q":"領域 D を、x ≧ 0、y ≧ 0、x² ＋ y² ≦ 4 で表される四分円（半径 2）とする。重積分 ∬_D (x² ＋ y²) dx dy の値として、最も適切なものはどれか。","h":"極座標 x＝r cosθ, y＝r sinθ に変換すると、面積要素は r dr dθ になります。","c":["4π/3","8π","4π","2π"],"a":3,"v":"calc","n":"極座標では x²＋y²＝r²、dx dy＝r dr dθ。∬＝∫₀^{π/2}dθ ∫₀² r²·r dr＝(π/2)×(2⁴/4)＝(π/2)×4＝<b>2π</b>（格子分割の数値積分でも一致）。<br>4π/3 は面積要素の r を掛け忘れた ∫₀^{π/2}dθ∫₀² r² dr＝(π/2)(8/3)。8π は円全体（θ が 0〜2π）、4π は半円（θ が 0〜π）で積分した値。<br><br>【出典】検算: 極座標変換の面積要素 r dr dθ（解析学の教科書）。sympy と格子分割で verify_g3.py により確認〔出題実績: R5 3-2〕"},
{"f":"基礎:解析","q":"天井や壁に取り付けた支持点から、軽い2本の棒（両端はピン接合）が点 P に集まっている。棒1は水平から 30° の角度で左上へ、棒2は水平から 45° の角度で右上へ伸び、P には下向きに W＝12 kN の荷重がかかって静止している。棒1、棒2の軸力（引張）N₁、N₂ [kN] の組合せとして最も適切なものはどれか。","h":"点 P での水平方向と鉛直方向の力のつり合いを、2つの未知数の連立方程式にします。","c":["N₁＝8.8、N₂＝10.8","N₁＝8.8、N₂＝6.2","N₁＝24.0、N₂＝17.0","N₁＝10.8、N₂＝8.8"],"a":0,"v":"calc","n":"水平: N₁cos30°＝N₂cos45°、鉛直: N₁sin30°＋N₂sin45°＝12。N₂＝1.2247N₁ を代入して N₁(0.5＋0.866)＝12 より <b>N₁＝8.8 kN、N₂＝10.8 kN</b>。<br>N₂＝6.2 は角度を鉛直から測ったものと見なして sin と cos を取り違えた値。24.0 と 17.0 は各棒が単独で W を支えると考えた W/sin30°、W/sin45°。N₁ と N₂ を入れ替えた組は、棒と角度の対応を逆にした場合。<br><br>【出典】検算: 節点での力のつり合い ΣFₓ＝0、ΣF_y＝0（構造力学の教科書）。連立方程式を verify_g3.py で解いて確認〔出題実績: R4 3-4〕"},
{"f":"基礎:解析","q":"関数 f(x)＝x³ の x＝1 における導関数の真値は f′(1)＝3 である。刻み幅 h＝0.1 として、前進差分 {f(x+h)−f(x)}/h、後退差分 {f(x)−f(x−h)}/h、中心差分 {f(x+h)−f(x−h)}/(2h)、および3点の式 {f(x+h)−2f(x)+f(x−h)}/h² で f′(1) を近似したとき、真値に最も近い値を与えるものはどれか。","h":"テイラー展開で、誤差が h に比例するものと h² に比例するものを区別します。","c":["中心差分（3.01）","前進差分（3.31）","後退差分（2.71）","3点の式（6.00）"],"a":0,"v":"calc","n":"中心差分の誤差は O(h²) で、近似値は 3.01（誤差 0.01）。前進差分・後退差分の誤差は O(h) で、それぞれ 3.31、2.71（誤差 0.31）。前進と後退の誤差は符号が逆で、その平均が中心差分になる。<br>3点の式は2階導関数 f″(1)＝6 の近似式で、1階導関数の近似ではない。<br><br>【出典】検算: テイラー展開による差分近似の誤差次数（数値解析の教科書）。各差分値を verify_g3.py で計算〔出題実績: R4 3-1〕"},
{"f":"基礎:解析","q":"T形断面で、下側のフランジは幅 60 mm、高さ 10 mm、その上に幅 10 mm、高さ 50 mm のウェブが中央に垂直に立っている（全高 60 mm）。断面の図心の、底面からの高さとして最も近いものはどれか。","h":"各長方形の面積に、その図心の高さを掛けて合計し、全面積で割ります。","c":["20.0 mm","9.3 mm","18.6 mm","30.0 mm"],"a":2,"v":"calc","n":"フランジ: 面積 600 mm²、図心の高さ 5 mm。ウェブ: 面積 500 mm²、図心の高さ 10＋25＝35 mm。図心 y＝(600×5＋500×35)/(600＋500)＝20500/1100＝<b>18.6 mm</b>。<br>20.0 mm は面積の重みなしで2つの図心の高さを平均した値。9.3 mm は幅を重みにした値、30.0 mm は高さを重みにした値で、どちらも面積（幅×高さ）の代わりに一部の寸法で重みづけた値。<br><br>【出典】検算: 図心 y＝ΣAᵢyᵢ/ΣAᵢ（材料力学の教科書）。verify_g3.py で数値確認〔出題実績: R3 3-6〕"},
{"f":"基礎:解析","q":"水平な円管の中を水（密度 1000 kg/m³）が定常に流れている。断面積 20 cm² の太い部分の圧力は、断面積 10 cm² の細い部分の圧力より 15 kPa 高い。粘性と高さの差を無視できるとき、太い部分での流速 v₁ として最も近いものはどれか。","h":"連続の式 A₁v₁＝A₂v₂ で v₂ を v₁ で表し、ベルヌーイの式に入れます。","c":["6.3 m/s","3.2 m/s","5.5 m/s","1.4 m/s"],"a":1,"v":"calc","n":"連続の式から v₂＝(20/10)v₁＝2v₁。ベルヌーイの式 p₁＋½ρv₁²＝p₂＋½ρv₂² より Δp＝½ρ(v₂²−v₁²)＝(3/2)ρv₁²。<b>v₁＝√(2Δp/3ρ)＝√10≒3.2 m/s</b>。<br>6.3 m/s は細い部分の流速 v₂（問われている部分の取り違え）。5.5 m/s は連続の式を使わずに Δp＝½ρv² とした値。1.4 m/s は断面積比を2乗の2乗（(a/b)⁴）として用いた値。<br><br>【出典】検算: 連続の式とベルヌーイの式 p＋½ρv²＝一定（流体力学の教科書）。verify_g3.py で数値確認〔出題実績: R2 3-6〕"},
{"f":"基礎:解析","q":"関数 f(x) が f′(x)＝1 − {f(x)}² を満たし、f(0)＝1/2 であるとする。f″(0) と f‴(0) の組合せとして、最も適切なものはどれか。","h":"f′＝1−f² の両辺を x で微分すると、f″＝−2ff′ になります。さらにもう一度微分します。","c":["f″(0)＝−3/4、f‴(0)＝3/4","f″(0)＝3/4、f‴(0)＝−3/8","f″(0)＝−1/2、f‴(0)＝−3/8","f″(0)＝−3/4、f‴(0)＝−3/8"],"a":3,"v":"calc","n":"f′(0)＝1−1/4＝3/4。f″＝−2ff′ より f″(0)＝−2×(1/2)×(3/4)＝<b>−3/4</b>。f‴＝−2(f′)²−2ff″ より f‴(0)＝−2×(9/16)−2×(1/2)×(−3/4)＝−9/8＋3/4＝<b>−3/8</b>。解 f＝tanh(x＋artanh(1/2)) の高階導関数でも一致。<br>f‴(0)＝3/4 は積の微分で (f′)² の項を落とし −2ff″ だけにした値。f″(0)＝3/4 は符号を取り違えた値。f″(0)＝−1/2 は f′(0) を 1/2 として −2ff′ に入れた値（f′(0)＝1−f² の計算の取り違え）。<br><br>【出典】検算: 合成関数の微分・積の微分（微分積分学の教科書）。厳密解 tanh(x＋artanh(1/2)) の導関数を sympy で確認〔出題実績: R1再 3-1〕"},
{"f":"基礎:解析","q":"一様な引張応力 σ を受ける無限に広い薄板に、小さな楕円孔がある。楕円の長軸（半長軸 a＝6 mm）が引張方向に垂直、短軸（半短軸 b＝2 mm）が引張方向に平行であるとき、孔縁に生じる最大応力 σ_max は、孔がない場合の応力 σ の何倍か。インルスの式 σ_max＝σ(1＋2a/b) を用いてよい。ただし a は引張方向に垂直な半径である。","h":"円孔（a＝b）にこの式を当てはめると、よく知られた値になります。","c":["7倍","3倍","4倍","約1.7倍"],"a":0,"v":"calc","n":"σ_max＝σ(1＋2a/b)＝σ(1＋2×6/2)＝<b>7σ</b>。円孔（a＝b）では 1＋2＝3 倍となり、これが円孔の応力集中係数として知られる値と一致する。細長い孔が荷重に垂直な向きにあるほど応力集中は強くなる。<br>3倍は孔が円であるときの値（形状の違いを無視）。4倍は式の係数2を落とした 1＋a/b。約1.7倍は a と b を入れ替えた 1＋2b/a（長軸が引張方向に平行な場合）。<br><br>【出典】検算: 楕円孔の応力集中（インルスの解）σ_max＝σ(1＋2a/b)。円孔 a＝b で K_t＝3 になることを verify_g3.py で確認（材料力学の教科書）〔出題実績: R1再 3-6〕"}

{"f":"基礎:材料・化学・バイオ","q":"ヒトが体内で十分に合成できず、食事から摂取しなければならないアミノ酸を必須アミノ酸（不可欠アミノ酸）といい、成人では9種類とされる。次のアミノ酸のうち、必須アミノ酸でないものはどれか。","h":"体内で別の代謝物からつくれるアミノ酸を探します。","c":["トリプトファン","グルタミン酸","ヒスチジン","フェニルアラニン"],"a":1,"v":"textbook","n":"<b>正解: グルタミン酸</b><br>必須アミノ酸はバリン・ロイシン・イソロイシン・メチオニン・フェニルアラニン・トリプトファン・トレオニン・リシン・ヒスチジンの9種類。グルタミン酸は体内で合成できる非必須アミノ酸です。<br><br>誤答の生まれ方<br>・「トリプトファン」: 芳香族アミノ酸で、ヒトは合成できない。必須アミノ酸の1つ。<br>・「ヒスチジン」: 「乳児だけ必須」と覚えている人が除外しやすいが、成人でも必須アミノ酸として扱われる。<br>・「フェニルアラニン」: 必須アミノ酸。体内ではフェニルアラニンからチロシンがつくられ、逆の変換はできない。<br><br>【出典】教科書的知識（一次資料は未確認）〔出題実績: R7 4-5〕"},
{"f":"基礎:材料・化学・バイオ","q":"酵素に関する次の記述のうち、最も適切なものはどれか。","h":"酵素の働きは「反応を速くする」ことで、反応の行き着く先は変えません。","c":["酵素は反応の平衡定数を大きくして、平衡に達したときの生成物の割合を高める生体触媒である。","酵素は反応の活性化エネルギーを下げて反応速度を高める生体触媒で、反応の前後で酵素自身は消費されない。","酵素の活性は温度が上がるほど単調に大きくなり、100℃でも活性を保つ酵素が大多数を占める。","酵素は基質に対する選択性が低く、1種類の酵素がほとんどすべての種類の基質に作用して反応を進める。"],"a":1,"v":"textbook","n":"<b>正解: 酵素は反応の活性化エネルギーを下げて反応速度を高める生体触媒で、反応の前後で…</b><br>酵素はタンパク質を主成分とする生体触媒で、活性化エネルギーを下げて反応速度を上げます。平衡は動かさず、自身は反応の前後で変化しません。<br><br>誤答の生まれ方<br>・「酵素は反応の平衡定数を大きくして、平衡に達したときの生成物の割合を高める生体…」: 触媒は平衡への到達を速めるだけで、平衡定数や平衡組成は変えない。<br>・「酵素の活性は温度が上がるほど単調に大きくなり、100℃でも活性を保つ酵素が大…」: 主成分のタンパク質は高温で変性し、活性は最適温度を過ぎると低下する。<br>・「酵素は基質に対する選択性が低く、1種類の酵素がほとんどすべての種類の基質に作…」: 酵素は活性部位の形に合う基質にだけ作用する（基質特異性が高い）。<br><br>【出典】教科書的知識（一次資料は未確認）〔出題実績: R4 4-5、R5 4-5〕"},
{"f":"基礎:材料・化学・バイオ","q":"グリシン（分子量75.0）だけが10分子、ペプチド結合で直鎖状につながったペプチドの分子量はいくらか。ペプチド結合1個が生じるごとに水（分子量18.0）が1分子失われるものとする。","h":"つながった分子の数と、結合の数は同じではありません。","c":["750","570","588","606"],"a":2,"v":"calc","n":"<b>正解: 588</b><br>残基数10の直鎖ペプチドのペプチド結合は 10−1=9 個で、失われる水も9分子。分子量は 75.0×10 − 18.0×9 = 750 − 162 = 588。<br><br>誤答の生まれ方<br>・「750」: 水が失われることを考えず、75.0×10 とした。<br>・「570」: 結合の数を10個と数え、水を10分子分（180）引いた。10分子の直鎖には結合が9個しかない。<br>・「606」: 結合の数を8個と数え、水を8分子分（144）しか引かなかった。<br><br>【出典】検算: 分子量=残基の分子量の和−18.0×(残基数−1)。ペプチド結合は脱水縮合（大学の生化学教科書の基本事項）。〔出題実績: R5 4-5、R6 4-6〕"},
{"f":"基礎:材料・化学・バイオ","q":"プロパン C3H8 を 22.0 g、完全燃焼させるのに必要な酸素 O2 の質量は何gか。原子量は H=1.0、C=12.0、O=16.0 とする。","h":"反応式 C3H8 + 5O2 → 3CO2 + 4H2O の係数比を使います。","c":["40.0 g","48.0 g","110 g","80.0 g"],"a":3,"v":"calc","n":"<b>正解: 80.0 g</b><br>C3H8 = 44.0 なので 22.0 g は 0.500 mol。係数比 C3H8:O2 = 1:5 より O2 は 2.50 mol。2.50×32.0 = 80.0 g。<br><br>誤答の生まれ方<br>・「40.0 g」: O2 の質量を原子量16で計算し、分子量32を使わなかった（2.5 mol×16）。<br>・「48.0 g」: O2 の係数を5ではなく CO2 の係数3と取り、0.500 mol×3×32.0 とした。<br>・「110 g」: モル数でなく質量に係数5をそのまま掛けた（22.0×5）。<br><br>【出典】検算: 反応式の係数比に基づくモル計算（一般化学の基本）。〔出題実績: R2 4-1、R3 4-4〕"},
{"f":"基礎:材料・化学・バイオ","q":"原子百分率で鉄 96.0%、炭素 4.00% の鉄−炭素合金がある。この合金中の炭素の質量百分率［%］に最も近い値はどれか。原子量は Fe=55.85、C=12.01 とする。","h":"原子の数の割合に、それぞれの原子量を掛けて質量の割合に直します。","c":["4.00%","0.888%","16.2%","0.0888%"],"a":1,"v":"calc","n":"<b>正解: 0.888%</b><br>合金100原子あたりの質量は C: 4.00×12.01=48.04、Fe: 96.0×55.85=5361.6。炭素の質量百分率は 48.04/(48.04+5361.6)×100 ≒ 0.888%。<br><br>誤答の生まれ方<br>・「4.00%」: 原子百分率をそのまま質量百分率とした（原子量による換算を忘れた）。<br>・「16.2%」: 原子量を掛ける向きを逆にし、4.00×55.85 と 96.0×12.01 で計算した。<br>・「0.0888%」: 計算結果の小数点の位置を1桁ずらした。<br><br>【出典】検算: 質量=原子数×原子量で換算し質量比を取る（一般化学の基本）。python で確認。〔出題実績: R7 4-4、R4 4-3〕"},
{"f":"基礎:材料・化学・バイオ","q":"アルミニウムはアルミナ Al2O3 の溶融塩電解（2Al2O3 → 4Al + 3O2）で得られる。Al2O3 を質量で50.0%含むボーキサイト 2.00 t から、理論上得られる Al の質量はおよそ何kgか。ボーキサイト中の Al2O3 以外の成分からは Al が得られないものとし、原子量は Al=27.0、O=16.0 とする。","h":"まず、2.00 t のうち Al2O3 が何 kg あるかを求めます。","c":["265 kg","1060 kg","529 kg","1890 kg"],"a":2,"v":"calc","n":"<b>正解: 529 kg</b><br>Al2O3 は 1000 kg、式量 102.0（=27.0×2+16.0×3）。Al2O3 1分子に Al 原子が2個含まれるので 1000×(54.0/102.0) ≒ 529 kg。<br><br>誤答の生まれ方<br>・「265 kg」: Al2O3 1分子から Al が1個できるとして、Al の質量比を 27.0/102 とした（実際は Al は2個）。<br>・「1060 kg」: ボーキサイトの含有率50.0%を考えず、2.00 t 全部を Al2O3 として計算した。<br>・「1890 kg」: Al2O3 と Al の質量比を逆（102/54.0）にして掛けた。<br><br>【出典】検算: 化学式の原子数比に基づく質量計算（一般化学の基本）。python で確認。〔出題実績: R3 4-4〕"},
{"f":"基礎:材料・化学・バイオ","q":"質量パーセント濃度が98.0%、密度が1.84 g/cm³ の濃硫酸（H2SO4 の分子量は98.0）から、0.500 mol/L の硫酸水溶液を1.00 L つくる。必要な濃硫酸の体積は何mLか。","h":"必要な H2SO4 の物質量を決めてから、濃硫酸の質量・体積へと進めます。","c":["26.6 mL","50.0 mL","27.2 mL","49.0 mL"],"a":2,"v":"calc","n":"<b>正解: 27.2 mL</b><br>必要な H2SO4 は 0.500 mol = 49.0 g。濃硫酸1 mL中の H2SO4 は 1.84×0.980 = 1.803 g なので 49.0/1.803 ≒ 27.2 mL。<br><br>誤答の生まれ方<br>・「26.6 mL」: 濃硫酸の質量の98.0%が H2SO4 であることを考えず、49.0 g を密度1.84で割った。<br>・「50.0 mL」: 必要な H2SO4 の質量 49.0 g を 0.980 で割った質量 50.0 g を、密度を使わずそのまま体積［mL］とした。<br>・「49.0 mL」: H2SO4 の必要量 49.0 g をそのまま体積［mL］とした。<br><br>【出典】検算: 溶液の質量=密度×体積、溶質=質量×質量分率（一般化学の基本）。python で確認。〔出題実績: R2 4-5、R3 4-4〕"},
{"f":"基礎:材料・化学・バイオ","q":"二本鎖DNAの一方の鎖の塩基組成を調べたところ、アデニン（A）18%、チミン（T）26%、グアニン（G）32%、シトシン（C）24% であった。この二本鎖DNA全体（2本の鎖の合計）におけるグアニン（G）の割合［%］はいくらか。","h":"もう一方の鎖のGは、調べた鎖のどの塩基と対になっているかを考えます。","c":["32%","22%","28%","56%"],"a":2,"v":"calc","n":"<b>正解: 28%</b><br>相補鎖のGは調べた鎖のCと同じ位置なので 24%。二本鎖全体のGは (32+24)/2 = 28%。同様に A=(18+26)/2=22%、2×(28+22)=100% で矛盾しない（シャルガフの法則）。<br><br>誤答の生まれ方<br>・「32%」: 調べた鎖のGの割合だけを見て、二本鎖全体の値とした。<br>・「22%」: AとTの平均（18と26の平均）を、Gの割合と混同した。<br>・「56%」: G と C を足したが、2本の鎖の合計で割る（平均する）操作を忘れた。<br><br>【出典】検算: 二本鎖で G=C、A=T、全体は両鎖の平均（シャルガフの法則）。〔出題実績: R4 4-6〕"},
{"f":"基礎:材料・化学・バイオ","q":"遺伝暗号（コドン）に関する次の記述のうち、最も適切なものはどれか。","h":"コドンは塩基3個の並びです。数え上げて、アミノ酸の種類との差を考えます。","c":["64通りのコドンのうち20通りがアミノ酸を指定し、残る44通りはどのアミノ酸も指定せず翻訳の終止を指示する。","64通りのコドンのうち61通りがアミノ酸を指定し、3通りは翻訳の終止を指示する。そのため、多くのアミノ酸は複数のコドンで指定される。","1つのコドンは状況に応じて複数のアミノ酸を指定でき、64通りのコドンが20種類のアミノ酸に割り振られている。","コドンは塩基2個の並びで決まるため16通りあり、そのうち16種類がアミノ酸を指定して、残りのアミノ酸は修飾で生じる。"],"a":1,"v":"primary","n":"<b>正解: 64通りのコドンのうち61通りがアミノ酸を指定し、3通りは翻訳の終止を指示す…</b><br>コドンは3ヌクレオチドの並びで64通り。うち61通りがアミノ酸を指定し、3通りが終止シグナル（NHGRI の定義）。アミノ酸は20種類なので、1つのアミノ酸が複数のコドンで指定される（縮重）。<br><br>誤答の生まれ方<br>・「64通りのコドンのうち20通りがアミノ酸を指定し、残る44通りはどのアミノ酸…」: アミノ酸の種類の数（20）をコドンの数と取り違えた。終止コドンは3種類しかない。<br>・「1つのコドンは状況に応じて複数のアミノ酸を指定でき、64通りのコドンが20種…」: 縮重（1つのアミノ酸に複数のコドン）と、1つのコドンが複数のアミノ酸を指定する（多義）を混同した。通常、コドンは1つのアミノ酸だけを指定する。<br>・「コドンは塩基2個の並びで決まるため16通りあり、そのうち16種類がアミノ酸を…」: コドンを塩基3個ではなく2個の並びと考えた。4×4×4=64通りが正しい。<br><br>【出典】NHGRI Talking Glossary「Codon」https://www.genome.gov/genetics-glossary/Codon（64通り・61通りがアミノ酸・3通りが終止）／論文 PMC6802134「On the origin of degeneracy in the genetic code」（コドン64通りがアミノ酸20種類＋終止に対応するため写像は縮重）。確認日 2026-10-04〔出題実績: R1再 4-5〕"},
{"f":"基礎:材料・化学・バイオ","q":"遺伝子のコード領域で起こる次の変化のうち、フレームシフト変異を生じるものはどれか。","h":"コドンは塩基3個ずつ読まれます。読み枠がずれる条件を考えます。","c":["塩基が1個だけ欠失する。","連続する3個の塩基が欠失する。","塩基が1個、別の塩基に置換される。","連続する6個の塩基が挿入される。"],"a":0,"v":"primary","n":"<b>正解: 塩基が1個だけ欠失する。</b><br>フレームシフトは、塩基の挿入または欠失の数が3の倍数でないとき生じ、その位置より下流が誤って読まれる（NHGRI の定義）。1塩基の欠失は3の倍数でないので該当。<br><br>誤答の生まれ方<br>・「連続する3個の塩基が欠失する。」: 3の倍数の欠失は読み枠が保たれ、アミノ酸が1個抜けるだけ（インフレーム欠失）。<br>・「塩基が1個、別の塩基に置換される。」: 置換は塩基の数を変えないので読み枠はずれない（点突然変異で、ミスセンスやナンセンスとなりうる）。<br>・「連続する6個の塩基が挿入される。」: 3の倍数の挿入は読み枠が保たれ、アミノ酸が2個増えるだけ。<br><br>【出典】NHGRI Talking Glossary「Frameshift Mutation」https://www.genome.gov/genetics-glossary/Frameshift-Mutation（挿入・欠失が3の倍数でない場合）。確認日 2026-10-04〔出題実績: R3 4-6〕"},
{"f":"基礎:材料・化学・バイオ","q":"DNAの構造に関する次の記述のうち、最も適切なものはどれか。","h":"塩基の種類は4つで、対になる相手は決まっています。","c":["2本のポリヌクレオチド鎖が二重らせんをつくり、アデニンはシトシンと、グアニンはチミンと対になる。各鎖は糖（デオキシリボース）とリン酸が交互に並ぶ骨格をもつ。","DNAの塩基はアデニン・グアニン・シトシン・ウラシルの4種類で、各鎖は糖（リボース）とリン酸が交互に並ぶ骨格をもつ。","2本のポリヌクレオチド鎖が二重らせんをつくり、アデニンはチミンと、グアニンはシトシンと対になる。各鎖は糖（デオキシリボース）とリン酸が交互に並ぶ骨格をもつ。","各鎖は塩基とリン酸が交互に並ぶ骨格をもち、糖が向かい合う鎖の塩基と対になって二重らせんの内側を占める。"],"a":2,"v":"primary","n":"<b>正解: 2本のポリヌクレオチド鎖が二重らせんをつくり、アデニンはチミンと、グアニンは…</b><br>DNAは糖（デオキシリボース）とリン酸が交互に並ぶ骨格に塩基（A、C、G、T）が結合した2本の鎖からなる二重らせん。A‐T、C‐G が対をつくる（NHGRI の定義）。<br><br>誤答の生まれ方<br>・「2本のポリヌクレオチド鎖が二重らせんをつくり、アデニンはシトシンと、グアニン…」: 塩基対の組合せ（A‐T、G‐C）を入れ替えた。<br>・「DNAの塩基はアデニン・グアニン・シトシン・ウラシルの4種類で、各鎖は糖（リ…」: RNAの構成（ウラシル、リボース）をDNAと混同した。DNAの塩基はチミン。<br>・「各鎖は塩基とリン酸が交互に並ぶ骨格をもち、糖が向かい合う鎖の塩基と対になって…」: 骨格は糖とリン酸で、塩基は内側で対をつくる。骨格の成分と内側にくるものを取り違えた。<br><br>【出典】NHGRI Talking Glossary「Deoxyribonucleic Acid (DNA)」https://www.genome.gov/genetics-glossary/Deoxyribonucleic-Acid（二重らせん・糖リン酸骨格・4塩基・A‐T/C‐G）。確認日 2026-10-04〔出題実績: R6 4-5〕"},
{"f":"基礎:材料・化学・バイオ","q":"次の化合物を、水溶液中での酸としての強さ（酸性度）が強い順に左から並べたとき、最も適切なものはどれか。<br>a トリクロロ酢酸　b 酢酸　c フェノール　d エタノール","h":"塩素のような電子を引きつける原子が近くにあると、共役塩基が安定になります。","c":["a−b−c−d","b−a−c−d","a−b−d−c","a−c−b−d"],"a":0,"v":"textbook","n":"<b>正解: a−b−c−d</b><br>目安のpKaは トリクロロ酢酸 約0.7、酢酸 約4.8、フェノール 約10、エタノール 約16（値が小さいほど強い酸）。カルボン酸 > フェノール > アルコールの順で、塩素の電子求引効果が酸性を強める。<br><br>誤答の生まれ方<br>・「b−a−c−d」: 塩素の電子求引（誘起）効果を考えず、酢酸をトリクロロ酢酸より強いとした。<br>・「a−b−d−c」: フェノールの共役塩基（フェノキシドイオン）が共鳴で安定になることを見落とし、エタノールより弱いとした。<br>・「a−c−b−d」: カルボン酸よりフェノールのほうが強いと考えた。酢酸の共役塩基は2つの酸素で電荷を分け合うので、フェノールより酸性が強い。<br><br>【出典】教科書的知識（一次資料は未確認）（pKaは大学教科書の代表値）〔出題実績: R1再 4-2、R4 4-1、R7 4-2〕"},
{"f":"基礎:材料・化学・バイオ","q":"0.010 mol/L の酢酸水溶液の pH に最も近い値はどれか。酢酸の電離定数を Ka = 1.8×10⁻⁵ mol/L とし、電離度は十分に小さく、水の電離は無視できるものとする。必要なら log10(1.8) = 0.255 を用いてよい。","h":"弱酸では [H⁺] = √(Ka×C) と近似できます。","c":["2.0","3.4","4.7","6.7"],"a":1,"v":"calc","n":"<b>正解: 3.4</b><br>[H⁺] = √(1.8×10⁻⁵×0.010) = √(1.8×10⁻⁷) ≒ 4.2×10⁻⁴ mol/L。pH = ½(7 − 0.255) ≒ 3.37 ≒ 3.4。<br><br>誤答の生まれ方<br>・「2.0」: 酢酸を強酸とみなし、[H⁺] = 0.010 mol/L として pH = 2.0 とした。<br>・「4.7」: pH を pKa（= −log10 Ka ≒ 4.7）と同じとした。pH = pKa となるのは酸と共役塩基が同量のとき。<br>・「6.7」: [H⁺] を √ を取らずに Ka×C = 1.8×10⁻⁷ とした。<br><br>【出典】検算: 弱酸の近似式 [H⁺]=√(Ka·C)（分析化学・一般化学の教科書の標準式）。python で確認。〔出題実績: R4 4-1〕"},
{"f":"基礎:材料・化学・バイオ","q":"0.050 mol/L の硫酸 30.0 mL を過不足なく中和するために必要な、0.10 mol/L の水酸化ナトリウム水溶液の体積は何mLか。","h":"硫酸は2価の酸で、1 mol あたり H⁺ を2 mol 出します。","c":["15.0 mL","30.0 mL","60.0 mL","7.50 mL"],"a":1,"v":"calc","n":"<b>正解: 30.0 mL</b><br>H⁺ の物質量 = 0.050×2×30.0 = 3.0 mmol。OH⁻ が同量必要なので 0.10 mol/L の NaOH は 3.0/0.10 = 30.0 mL。<br><br>誤答の生まれ方<br>・「15.0 mL」: 硫酸を1価の酸として扱い、H⁺ の物質量を半分にした。<br>・「60.0 mL」: 水酸化ナトリウムを2価の塩基として扱い、必要量を2倍にした。<br>・「7.50 mL」: 価数の補正を酸と塩基の両方に誤って掛け、さらに半分にした。<br><br>【出典】検算: 中和の条件 (酸の価数×mol)=(塩基の価数×mol)（一般化学の基本）。〔出題実績: R4 4-1〕"},
{"f":"基礎:材料・化学・バイオ","q":"チオ硫酸ナトリウム Na2S2O3 に含まれる硫黄原子の酸化数（平均値）はいくらか。ナトリウムは +1、酸素は −2 とする。","h":"化合物全体の酸化数の和は0です。","c":["+4","+6","−2","+2"],"a":3,"v":"calc","n":"<b>正解: +2</b><br>S原子は2個。2×(+1) + 2x + 3×(−2) = 0 より x = +2。<br><br>誤答の生まれ方<br>・「+4」: S原子の数を1個と数え、2 + x − 6 = 0 から x = +4 とした。<br>・「+6」: 硫酸イオン SO4²⁻ の硫黄（+6）と同じと考えた。<br>・「−2」: 硫化物イオンのような S²⁻ と同じと考えた。<br><br>【出典】検算: 化合物中の酸化数の総和=0（酸化数の規則）。python で確認。〔出題実績: R3 4-2、R4 4-2、R7 4-1〕"},
{"f":"基礎:材料・化学・バイオ","q":"次の化学反応のうち、酸化還元反応でないものはどれか。","h":"反応の前後で酸化数が変わる原子があるかどうかを調べます。","c":["2KI + Cl₂ → 2KCl + I₂（ヨウ化カリウム水溶液に塩素を通す）","CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂（石灰石に塩酸を加える）","Zn + CuSO₄ → ZnSO₄ + Cu（硫酸銅(II)水溶液に亜鉛板を浸す）","2H₂O₂ → 2H₂O + O₂（酸化マンガン(IV)を触媒に分解する）"],"a":1,"v":"calc","n":"<b>正解: CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂（石灰石に塩…</b><br>炭酸カルシウムと塩酸の反応は、Ca +2、C +4、O −2、H +1、Cl −1 のいずれも変化せず、酸化還元反応ではない。<br><br>誤答の生まれ方<br>・「2KI + Cl₂ → 2KCl + I₂（ヨウ化カリウム水溶液に塩素を通す）」: Iが −1 から 0、Clが 0 から −1 に変わる酸化還元反応。<br>・「Zn + CuSO₄ → ZnSO₄ + Cu（硫酸銅(II)水溶液に亜鉛板…」: Znが 0 から +2、Cuが +2 から 0 に変わる酸化還元反応。<br>・「2H₂O₂ → 2H₂O + O₂（酸化マンガン(IV)を触媒に分解する）」: Oが −1 から −2 と 0 に変わる酸化還元反応（不均化）。<br><br>【出典】検算: 各原子の酸化数を前後で比較（酸化数の規則）。python で確認。〔出題実績: R3 4-2〕"},
{"f":"基礎:材料・化学・バイオ","q":"二酸化硫黄 SO₂ が酸化剤としてはたらいている反応はどれか。","h":"酸化剤は相手を酸化し、自分は還元される（酸化数が下がる）物質です。","c":["SO₂ + H₂O₂ → H₂SO₄","5SO₂ + 2KMnO₄ + 2H₂O → K₂SO₄ + 2MnSO₄ + 2H₂SO₄","SO₂ + 2H₂S → 3S + 2H₂O","SO₂ + 2NaOH → Na₂SO₃ + H₂O"],"a":2,"v":"calc","n":"<b>正解: SO₂ + 2H₂S → 3S + 2H₂O</b><br>SO₂ + 2H₂S → 3S + 2H₂O では、SO₂ の S は +4 から 0 に下がり（還元される＝酸化剤）、H₂S の S は −2 から 0 に上がる（還元剤）。<br><br>誤答の生まれ方<br>・「SO₂ + H₂O₂ → H₂SO₄」: SO₂ の硫黄は +4 から +6 に上がるので、SO₂ は還元剤。<br>・「5SO₂ + 2KMnO₄ + 2H₂O → K₂SO₄ + 2MnSO₄ …」: SO₂ の硫黄は +4 から +6 に上がるので、SO₂ は還元剤（酸化剤は KMnO₄）。<br>・「SO₂ + 2NaOH → Na₂SO₃ + H₂O」: 酸化数の変化がない酸塩基（中和）反応で、酸化剤・還元剤は存在しない。<br><br>【出典】検算: 酸化数の増減で酸化剤・還元剤を判定（酸化数の規則）。python で確認。〔出題実績: R3 4-2、R4 4-2、R7 4-1〕"},
{"f":"基礎:材料・化学・バイオ","q":"マグネシウム Mg、アルミニウム Al、チタン Ti、鉄 Fe の4種類の金属を、常温での密度が小さい順に左から並べたとき、最も適切なものはどれか。","h":"Mg と Al は代表的な軽金属で、Fe は Ti より重い金属です。","c":["Al−Mg−Ti−Fe","Mg−Ti−Al−Fe","Mg−Al−Fe−Ti","Mg−Al−Ti−Fe"],"a":3,"v":"textbook","n":"<b>正解: Mg−Al−Ti−Fe</b><br>密度は Mg 約1.74、Al 約2.70、Ti 約4.5、Fe 約7.9 g/cm³ の順に大きくなる。<br><br>誤答の生まれ方<br>・「Al−Mg−Ti−Fe」: 軽金属の Mg と Al の順を入れ替えた（Mg 約1.74、Al 約2.70 g/cm³）。<br>・「Mg−Ti−Al−Fe」: Ti を Al より軽い金属と思い込んだ（Ti は約4.5 g/cm³で Al より重い）。<br>・「Mg−Al−Fe−Ti」: Ti を鉄より重い金属と思い込んだ（Fe は約7.9 g/cm³で Ti より重い）。<br><br>【出典】教科書的知識（一次資料は未確認）（密度は理科年表系の代表値の記憶で、原典の数値は未確認）〔出題実績: R2 4-3、R6 4-4〕"},
{"f":"基礎:材料・化学・バイオ","q":"金属材料の加工と強度に関する次の記述のうち、最も適切なものはどれか。","h":"冷間加工で金属内部に起こる変化と、加熱で起こる変化を区別します。","c":["冷間加工を加えると金属内の転位が増えて強度と硬さが上がり、延性は低下する。","冷間加工を加えると金属内の転位が減って強度と硬さが下がり、延性は大きくなる。","加工硬化した金属を再結晶温度以上に加熱すると、強度と硬さはさらに上がり、延性は低下する。","結晶粒を細かくするほど降伏強度は下がるため、強度を上げたいときは結晶粒を大きくするとよい。"],"a":0,"v":"textbook","n":"<b>正解: 冷間加工を加えると金属内の転位が増えて強度と硬さが上がり、延性は低下する。</b><br>冷間加工で転位が増えると、強度・硬さが上がり延性が下がる（加工硬化）。加熱して再結晶させると転位が減り、軟化して延性が回復する。結晶粒の微細化は強化に有効。<br><br>誤答の生まれ方<br>・「冷間加工を加えると金属内の転位が減って強度と硬さが下がり、延性は大きくなる。」: 加工硬化の向きを逆にした。冷間加工では転位が増えて互いの動きを妨げる。<br>・「加工硬化した金属を再結晶温度以上に加熱すると、強度と硬さはさらに上がり、延性…」: 再結晶では新しい結晶粒が生じて転位が減り、軟らかく延びやすくなる。<br>・「結晶粒を細かくするほど降伏強度は下がるため、強度を上げたいときは結晶粒を大き…」: 結晶粒界は転位の動きを妨げるので、細粒化で降伏強度は上がる（ホール・ペッチの関係）。<br><br>【出典】教科書的知識（一次資料は未確認）〔出題実績: R6 4-4、R7 4-3〕"},
{"f":"基礎:材料・化学・バイオ","q":"鋼の熱処理に関する次の記述のうち、最も適切なものはどれか。","h":"硬くする処理（急冷）と、そのあとで粘りを戻す処理の組合せを考えます。","c":["焼入れは高温から炉の中でゆっくり冷却する処理で、組織が軟らかくなり、鋼を切削や塑性加工しやすい状態にする。","焼戻しは焼入れの前に鋼を軟化させる処理で、焼戻しをした鋼は焼入れしただけの鋼より硬く、しかももろい。","焼なましは急冷によって硬いマルテンサイトを得る処理で、機械部品の硬さと耐摩耗性を高めるために行う。","焼入れはオーステナイト域から急冷してマルテンサイトを得る処理で、硬さが増す反面もろくなるため、焼戻しで靱性を回復させる。"],"a":3,"v":"textbook","n":"<b>正解: 焼入れはオーステナイト域から急冷してマルテンサイトを得る処理で、硬さが増す反…</b><br>焼入れ（急冷でマルテンサイト化）で硬くなるがもろいので、焼戻し（再加熱）で靱性を戻す。焼なましは徐冷による軟化、焼ならしは組織の均一化・微細化。<br><br>誤答の生まれ方<br>・「焼入れは高温から炉の中でゆっくり冷却する処理で、組織が軟らかくなり、鋼を切削…」: ゆっくりした冷却は焼なましの内容。焼入れは急冷して硬いマルテンサイトを得る。<br>・「焼戻しは焼入れの前に鋼を軟化させる処理で、焼戻しをした鋼は焼入れしただけの鋼…」: 焼戻しは焼入れ後に行い、焼入れ鋼のもろさを下げて靱性を回復させる（硬さは多少下がる）。<br>・「焼なましは急冷によって硬いマルテンサイトを得る処理で、機械部品の硬さと耐摩耗…」: 急冷による硬化は焼入れの内容。焼なましは徐冷して軟化・内部応力除去を行う。<br><br>【出典】教科書的知識（一次資料は未確認）〔出題実績: R5 4-3、R7 4-3〕"},
{"f":"基礎:材料・化学・バイオ","q":"PCRで、標的配列が1サイクルごとに理想的にちょうど2倍になるものとする。標的配列を含む二本鎖DNAが1.0×10³ 分子あるとき、20サイクル後の分子数に最も近い値はどれか。ただし 2¹⁰ = 1024 とし、鋳型の増え方以外の要因は考えない。","h":"1サイクルごとの増え方は足し算ではなく掛け算です。","c":["2.0×10⁴ 分子","1.0×10⁶ 分子","1.0×10²³ 分子","1.0×10⁹ 分子"],"a":3,"v":"calc","n":"<b>正解: 1.0×10⁹ 分子</b><br>n サイクル後の分子数は初期量×2ⁿ。2²⁰ = (2¹⁰)² ≒ 1.05×10⁶ なので、1.0×10³ × 1.05×10⁶ ≒ 1.0×10⁹ 分子。<br><br>誤答の生まれ方<br>・「2.0×10⁴ 分子」: 毎サイクル、初期量と同じ数だけ増えると考え 1.0×10³×20 とした。増幅は指数的で、直線的ではない。<br>・「1.0×10⁶ 分子」: 2²⁰ ≒ 1.0×10⁶ を求めただけで、初期の分子数 1.0×10³ を掛けるのを忘れた。<br>・「1.0×10²³ 分子」: 底を2ではなく10にして 1.0×10³×10²⁰ とした。<br><br>【出典】検算: 指数増幅 N=N₀×2ⁿ（理想効率）。python で確認。〔出題実績: R1再 4-6〕"},
{"f":"基礎:材料・化学・バイオ","q":"PCRで、Taq DNAポリメラーゼのような耐熱性のDNAポリメラーゼが用いられる理由として、最も適切なものはどれか。","h":"各サイクルで、二本鎖を1本ずつにほどく高温の工程があります。","c":["熱変性の高温で二本鎖DNAのリン酸ジエステル結合を切って1本鎖にする活性をもち、変性の工程を短時間で終わらせられるため、サイクル数を減らせるため。","プライマーが不要で任意の配列を増幅でき、アニーリングの工程を省くことができるため、1サイクルの時間が短くなり反応全体が短縮できるため。","好熱性細菌（Thermus aquaticus）由来の酵素は、約95℃の熱変性を繰り返しても失活しにくく、サイクルごとに酵素を加え直す必要がないため。","RNAを鋳型として逆転写反応を行ってcDNAを合成できるため、RNA試料からそのまま増幅するのに適しており、変性の工程も不要になるため。"],"a":2,"v":"primary","n":"<b>正解: 好熱性細菌（Thermus aquaticus）由来の酵素は、約95℃の熱変…</b><br>PCRは約95℃の変性、プライマーのアニーリング、伸長を繰り返す。Taqポリメラーゼは好熱菌 Thermus aquaticus 由来の熱安定なDNAポリメラーゼで、高温を繰り返しても機能が保たれる。<br><br>誤答の生まれ方<br>・「熱変性の高温で二本鎖DNAのリン酸ジエステル結合を切って1本鎖にする活性をも…」: 熱変性で切れるのは塩基間の水素結合で、加熱によって起こる。ポリメラーゼの役割はDNA鎖の合成。<br>・「プライマーが不要で任意の配列を増幅でき、アニーリングの工程を省くことができる…」: DNAポリメラーゼは3′末端を伸ばす酵素で、起点となるプライマーが必要。<br>・「RNAを鋳型として逆転写反応を行ってcDNAを合成できるため、RNA試料から…」: 逆転写を行うのは逆転写酵素。Taq DNAポリメラーゼはDNAを鋳型にDNA鎖を伸長する。<br><br>【出典】StatPearls「Polymerase Chain Reaction (PCR)」NCBI Bookshelf https://www.ncbi.nlm.nih.gov/sites/books/NBK589663/（変性は95℃で水素結合を切断・Taq は Thermus aquaticus 由来の耐熱性ポリメラーゼ）。確認日 2026-10-04〔出題実績: R2 4-6、R5 4-6〕"},
{"f":"基礎:材料・化学・バイオ","q":"組換えDNA技術で用いられる制限酵素に関する次の記述のうち、最も適切なものはどれか。","h":"制限酵素の名前に入っている「制限」は、切る場所が決まっていることを指します。","c":["DNAを任意の位置で無作為に切断するため、同じDNAから毎回、長さのそろわない断片が無秩序に得られる。","切断されたDNA断片の末端どうしを結合する酵素で、組換えDNAをつくる際に断片を環状につなぐ。","真核生物の核に存在してRNAの特定配列を切断し、前駆体mRNAからイントロンを除去する酵素である。","細菌から単離されるタンパク質で、DNAの特定の塩基配列を認識して切断し、決まった末端をもつ断片を生じる。"],"a":3,"v":"primary","n":"<b>正解: 細菌から単離されるタンパク質で、DNAの特定の塩基配列を認識して切断し、決ま…</b><br>制限酵素は細菌から単離される、配列特異的なDNA切断酵素（NHGRI の定義）。組換えDNA技術では、切り出した断片をDNAリガーゼでつなぐ。<br><br>誤答の生まれ方<br>・「DNAを任意の位置で無作為に切断するため、同じDNAから毎回、長さのそろわな…」: 制限酵素は特定の塩基配列を認識して切断するので、同じDNAからは同じ断片が得られる。<br>・「切断されたDNA断片の末端どうしを結合する酵素で、組換えDNAをつくる際に断…」: 断片をつなぐ酵素はDNAリガーゼ。制限酵素は切断する側。<br>・「真核生物の核に存在してRNAの特定配列を切断し、前駆体mRNAからイントロン…」: スプライシングはRNAの加工であり、制限酵素の働きではない。制限酵素は細菌由来でDNAを切る。<br><br>【出典】NHGRI Talking Glossary「Restriction Enzyme」https://www.genome.gov/genetics-glossary/Restriction-Enzyme（細菌由来・配列特異的にDNAを切断）。確認日 2026-10-04〔出題実績: R1再 4-6〕"},
{"f":"基礎:材料・化学・バイオ","q":"鉄（α-Fe）は常温で体心立方格子をとり、格子定数は a = 0.2866 nm である。体心立方格子では体対角線の方向で原子が互いに接しているとして、鉄原子を剛体球とみなしたときの原子半径 R［nm］に最も近い値はどれか。","h":"立方体の体対角線の長さは a√3 で、その上に原子半径 R が4つ分並びます。","c":["0.124","0.101","0.143","0.0717"],"a":0,"v":"calc","n":"<b>正解: 0.124</b><br>体心立方では体対角線 a√3 に原子半径4個分が並ぶので 4R = a√3、R = a√3/4 = 0.2866×1.732/4 ≒ 0.124 nm。<br><br>誤答の生まれ方<br>・「0.101」: 面心立方格子の関係（面対角線方向で接する a√2 = 4R）を使った。<br>・「0.143」: 立方体の辺（a）上で原子が接するとして R = a/2 とした。<br>・「0.0717」: R = a/4 とした。体対角線ではなく a を4等分した。<br><br>【出典】検算: 体心立方格子の幾何 4R=√3·a（材料科学の教科書）。python で確認。〔出題実績: R2 4-4、R6 4-3〕"},
{"f":"基礎:材料・化学・バイオ","q":"銅は面心立方格子をとり、格子定数は a = 0.3615 nm、モル質量は 63.55 g/mol である。アボガドロ定数を 6.022×10²³ /mol とするとき、銅の密度［g/cm³］に最も近い値はどれか。ただし 1 nm = 10⁻⁷ cm とする。","h":"単位格子に含まれる原子の数がカギです。","c":["4.47","2.23","13.4","8.93"],"a":3,"v":"calc","n":"<b>正解: 8.93</b><br>面心立方の単位格子には 8×(1/8) + 6×(1/2) = 4 個の原子。密度 = 4×63.55 / (6.022×10²³ × (3.615×10⁻⁸ cm)³) ≒ 8.93 g/cm³。<br><br>誤答の生まれ方<br>・「4.47」: 面心立方の単位格子の原子数を4個ではなく2個（体心立方の値）とした。<br>・「2.23」: 単位格子の原子数を1個とした。<br>・「13.4」: 単位格子の原子数を6個とした。<br><br>【出典】検算: ρ = n·M / (N_A·a³)（材料科学の教科書）。python で確認。〔出題実績: R2 4-4、R6 4-3〕"},
{"f":"基礎:材料・化学・バイオ","q":"体心立方格子の単位格子には原子が2個含まれ、体対角線の方向で原子が接している。原子を同一の剛体球とみなしたとき、原子が単位格子の体積に占める割合（充填率）に最も近い値はどれか。","h":"原子半径 R と格子定数 a の関係（4R = a√3）から、a³ を R で表します。","c":["68%","74%","52%","34%"],"a":0,"v":"calc","n":"<b>正解: 68%</b><br>原子2個の体積 2×(4/3)πR³、a = 4R/√3 なので a³ = 64R³/(3√3)。充填率 = π√3/8 ≒ 0.680 で約68%。<br><br>誤答の生まれ方<br>・「74%」: 面心立方格子・六方最密格子の充填率を使った。体心立方はそれより隙間が大きい。<br>・「52%」: 単純立方格子（原子1個、辺で接する）の充填率を使った。<br>・「34%」: ダイヤモンド構造の充填率を使った。<br><br>【出典】検算: 充填率 = n·(4/3)πR³ / a³（材料科学の教科書）。python で確認。〔出題実績: R6 4-3、R7 4-3〕"},
{"f":"基礎:材料・化学・バイオ","q":"原子に関する次の記述のうち、最も適切なものはどれか。ただし、いずれも電荷をもたない原子とし、元素記号の左上の数字は質量数を表す。","h":"中性子の数は（質量数−原子番号）で求まります。","c":["³⁹K（原子番号19）と ⁴⁰Ca（原子番号20）の中性子の数は等しい。","³⁵Cl と ³⁷Cl（原子番号17）は互いに同素体である。","¹⁶O と ¹⁸O（原子番号8）は、電子が2個多い分だけ ¹⁸O のほうが重い。","⁴⁰Ar（原子番号18）と ⁴⁰Ca（原子番号20）は互いに同位体である。"],"a":0,"v":"calc","n":"<b>正解: ³⁹K（原子番号19）と ⁴⁰Ca（原子番号20）の中性子の数は等しい。</b><br>³⁹K の中性子は 39−19 = 20、⁴⁰Ca は 40−20 = 20 で等しい。<br><br>誤答の生まれ方<br>・「³⁵Cl と ³⁷Cl（原子番号17）は互いに同素体である。」: 同じ元素で質量数が違うものは同位体。同素体は同じ元素の単体で構造が違うもの（O₂とO₃など）。<br>・「¹⁶O と ¹⁸O（原子番号8）は、電子が2個多い分だけ ¹⁸O のほうが重い。」: 同位体は中性子の数が違うだけで、陽子の数も、電荷をもたない原子の電子の数も等しい（8個）。<br>・「⁴⁰Ar（原子番号18）と ⁴⁰Ca（原子番号20）は互いに同位体である。」: 同位体は原子番号が同じ。質量数が同じで原子番号が違うものは同重体。<br><br>【出典】検算: 中性子数=質量数−原子番号、同位体は原子番号が同じ（一般化学の基本）。python で確認。〔出題実績: R3 4-1、R5 4-1〕"},
{"f":"基礎:材料・化学・バイオ","q":"炭素の放射性同位体 ¹⁴C の半減期は 5730 年である。ある木片に残っている ¹⁴C の量が、生きていた当時の 12.5% であったとき、この木片が伐採されてからの経過年数に最も近い値はどれか。","h":"12.5% は 1/2 を何回掛けた値かを数えます。","c":["1.72×10⁴ 年","1.15×10⁴ 年","4.58×10⁴ 年","7.16×10⁴ 年"],"a":0,"v":"calc","n":"<b>正解: 1.72×10⁴ 年</b><br>12.5% = (1/2)³ なので半減期3回分。5730×3 = 17190 年 ≒ 1.72×10⁴ 年。<br><br>誤答の生まれ方<br>・「1.15×10⁴ 年」: 25%（半減期2回分）の場合の値。12.5% は半減期3回分。<br>・「4.58×10⁴ 年」: 12.5% を 1/8 から 8 と読み、半減期を8回分とした。<br>・「7.16×10⁴ 年」: 半減期 5730 年に 12.5 を掛けた。<br><br>【出典】検算: N=N₀(1/2)^(t/T)（放射壊変の基本式）。python で確認。〔出題実績: R3 4-1〕"},
{"f":"基礎:材料・化学・バイオ","q":"ヤング率 E = 200 GPa の鋼の丸棒（直径 10.0 mm、長さ 1.00 m）に引張荷重 15.7 kN を加えた。変形は弾性範囲内でフックの法則が成り立つとき、棒の伸びは何mmか。","h":"応力＝荷重÷断面積、ひずみ＝応力÷ヤング率、伸び＝ひずみ×長さ。","c":["0.25 mm","0.79 mm","4.00 mm","1.00 mm"],"a":3,"v":"calc","n":"<b>正解: 1.00 mm</b><br>断面積 A = π×(5.00 mm)² ≒ 78.5 mm²。応力 σ = 15700 N / 78.5 mm² ≒ 200 MPa。ひずみ ε = σ/E = 200 MPa / 200 GPa = 1.00×10⁻³。伸び = ε×1000 mm ≒ 1.00 mm。<br><br>誤答の生まれ方<br>・「0.25 mm」: 断面積を π×d²（直径の2乗）として計算した（半径ではなく直径を使用）。<br>・「0.79 mm」: 断面積を d²（円でなく正方形）として計算した。<br>・「4.00 mm」: 断面積を π×(d/4)² と、半径を直径の1/4として計算した。<br><br>【出典】検算: σ=P/A、σ=Eε（フックの法則）。python で確認。〔出題実績: R3 4-3〕"},
{"f":"基礎:材料・化学・バイオ","q":"断面積 20.0 mm²、標点距離 50.0 mm の試験片に引張荷重 10.0 kN を加えたところ、標点距離が 55.0 mm になった。変形は均一で、体積は変化しないものとする。このときの真応力と真ひずみの組合せとして、最も適切なものはどれか。ただし ln 1.1 = 0.0953 とする。","h":"断面積は伸びとともに小さくなり、真応力は変形後の断面積で求めます。","c":["500 MPa、0.10","550 MPa、0.095","550 MPa、0.10","500 MPa、0.095"],"a":1,"v":"calc","n":"<b>正解: 550 MPa、0.095</b><br>公称応力 = 10.0 kN / 20.0 mm² = 500 MPa、公称ひずみ = 5.0/50.0 = 0.10。体積一定より真応力 = 公称応力×(1+公称ひずみ) = 550 MPa、真ひずみ = ln(1+0.10) ≒ 0.095。<br><br>誤答の生まれ方<br>・「500 MPa、0.10」: 公称応力（変形前の断面積で割った値）と公称ひずみ（伸び÷元の長さ）をそのまま答えた。<br>・「550 MPa、0.10」: 真応力は求めたが、真ひずみを公称ひずみ（ΔL/L₀）のまま答えた。<br>・「500 MPa、0.095」: 真ひずみは求めたが、真応力を公称応力のまま答えた。<br><br>【出典】検算: σ_真=σ_公称(1+ε_公称)、ε_真=ln(1+ε_公称)（体積一定の場合・材料力学の教科書）。python で確認。〔出題実績: R4 4-4〕"},
{"f":"基礎:材料・化学・バイオ","q":"細菌（大腸菌など）の細胞を構成する成分のうち、水を除いて質量比が最も大きいものはどれか。","h":"細胞の中ではたらく分子の大部分は、これでできています。","c":["リボ核酸（RNA）","デオキシリボ核酸（DNA）","タンパク質","多糖類"],"a":2,"v":"textbook","n":"<b>正解: タンパク質</b><br>細菌細胞の質量の約70%は水。残りの巨大分子ではタンパク質が約15%と最も多く、RNA 約6%、多糖・リン脂質 各約2%、DNA 約1%（教科書の概数）。<br><br>誤答の生まれ方<br>・「リボ核酸（RNA）」: 核酸の中では2番目に多いが、質量比はタンパク質の半分以下（RNA 約6%、タンパク質 約15%）。<br>・「デオキシリボ核酸（DNA）」: 遺伝情報を担う重要な分子だが、質量比は約1%にすぎない。<br>・「多糖類」: 細胞壁やエネルギー貯蔵に使われるが、質量比は約2%程度。<br><br>【出典】教科書的知識（一次資料は未確認）（成分比は分子細胞生物学の教科書の概数で、原典は未確認）〔出題実績: R7 4-6〕"},
{"f":"基礎:材料・化学・バイオ","q":"常温・常圧（約25℃、1気圧）でのハロゲン単体の状態と色に関する次の記述のうち、最も適切なものはどれか。","h":"常温で液体のハロゲンは1つだけです。","c":["塩素 Cl₂ は常温で赤褐色の液体であり、刺激臭をもつ。","ヨウ素 I₂ は常温で黄緑色の気体であり、刺激臭をもつ。","フッ素 F₂ は常温で黒紫色の固体であり、刺激臭をもつ。","臭素 Br₂ は常温で赤褐色の液体であり、刺激臭をもつ。"],"a":3,"v":"textbook","n":"<b>正解: 臭素 Br₂ は常温で赤褐色の液体であり、刺激臭をもつ。</b><br>ハロゲン単体は周期が下がるほど分子間力が強くなり、F₂（淡黄色の気体）、Cl₂（黄緑色の気体）、Br₂（赤褐色の液体）、I₂（黒紫色の固体）となる。<br><br>誤答の生まれ方<br>・「塩素 Cl₂ は常温で赤褐色の液体であり、刺激臭をもつ。」: 塩素は黄緑色の気体。赤褐色の液体は臭素。<br>・「ヨウ素 I₂ は常温で黄緑色の気体であり、刺激臭をもつ。」: ヨウ素は黒紫色の固体（昇華しやすい）。黄緑色の気体は塩素。<br>・「フッ素 F₂ は常温で黒紫色の固体であり、刺激臭をもつ。」: フッ素は淡黄色の気体。黒紫色の固体はヨウ素。<br><br>【出典】教科書的知識（一次資料は未確認）〔出題実績: R6 4-1〕"},
{"f":"基礎:材料・化学・バイオ","q":"価数が3の多原子イオンを含む化合物として、最も適切なものはどれか。","h":"化合物は全体で電荷が0になります。陽イオンの電荷から陰イオンの電荷を考えます。","c":["リン酸ナトリウム Na₃PO₄","硫酸ナトリウム Na₂SO₄","硝酸アンモニウム NH₄NO₃","炭酸水素ナトリウム NaHCO₃"],"a":0,"v":"calc","n":"<b>正解: リン酸ナトリウム Na₃PO₄</b><br>Na₃PO₄ は Na⁺ 3個と釣り合うリン酸イオン PO₄³⁻（3価）をもつ。<br><br>誤答の生まれ方<br>・「硫酸ナトリウム Na₂SO₄」: 硫酸イオン SO₄²⁻ は2価。<br>・「硝酸アンモニウム NH₄NO₃」: アンモニウムイオン NH₄⁺ と硝酸イオン NO₃⁻ はどちらも1価。<br>・「炭酸水素ナトリウム NaHCO₃」: 炭酸水素イオン HCO₃⁻ は1価。<br><br>【出典】検算: 化合物の電荷の総和=0 から多原子イオンの価数を決定。python で確認。〔出題実績: R6 4-2〕"},
{"f":"基礎:材料・化学・バイオ","q":"負に帯電した疎水コロイド（粘土や硫黄のコロイド溶液など）に、同じモル濃度の次の電解質を加えた。最も少量で凝析させるものはどれか。","h":"コロイド粒子と反対の電荷をもつイオンの価数が大きいほど、凝析力が強くなります。","c":["塩化アルミニウム AlCl₃","塩化ナトリウム NaCl","リン酸ナトリウム Na₃PO₄","硫酸ナトリウム Na₂SO₄"],"a":0,"v":"textbook","n":"<b>正解: 塩化アルミニウム AlCl₃</b><br>負コロイドの凝析には陽イオンが有効で、価数が大きいほど少量で足りる（シュルツ・ハーディの法則）。Al³⁺（3価）が最も強い。<br><br>誤答の生まれ方<br>・「塩化ナトリウム NaCl」: 反対電荷（陽イオン）は Na⁺ で1価。凝析力は弱い。<br>・「リン酸ナトリウム Na₃PO₄」: 陰イオンの価数（3価）に目が行ったが、負のコロイドに効くのは陽イオン（Na⁺、1価）。<br>・「硫酸ナトリウム Na₂SO₄」: 陰イオンの価数（2価）に目が行ったが、負のコロイドに効くのは陽イオン（Na⁺、1価）。<br><br>【出典】教科書的知識（一次資料は未確認）〔出題実績: R5 4-2〕"},
{"f":"基礎:材料・化学・バイオ","q":"純鉄の結晶構造と相変態に関する次の記述のうち、最も適切なものはどれか。","h":"加熱すると、より原子が密に詰まった構造に変わります。","c":["常温では面心立方構造のα-Feで、加熱すると約912℃で体心立方構造のγ-Feへ変態し、体積はわずかに膨張する。","常温では体心立方構造のα-Feで、加熱すると約912℃で面心立方構造のγ-Feへ変態し、体積はわずかに膨張する。","常温では体心立方構造のα-Feで、加熱すると約912℃で面心立方構造のγ-Feへ変態し、体積はわずかに収縮する。","常温では体心立方構造のα-Feで、加熱すると約912℃で六方最密構造のγ-Feへ変態し、体積はわずかに収縮する。"],"a":2,"v":"textbook","n":"<b>正解: 常温では体心立方構造のα-Feで、加熱すると約912℃で面心立方構造のγ-F…</b><br>α-Fe（体心立方）は約912℃でγ-Fe（面心立方）に変態する。面心立方のほうが充填率が高いので、体積はわずかに収縮する。<br><br>誤答の生まれ方<br>・「常温では面心立方構造のα-Feで、加熱すると約912℃で体心立方構造のγ-F…」: 常温の純鉄は体心立方で、高温側が面心立方。構造の順序を入れ替えた。<br>・「常温では体心立方構造のα-Feで、加熱すると約912℃で面心立方構造のγ-F…」: 構造は正しいが、充填率が上がる（68%→74%）変態なので体積は収縮する。<br>・「常温では体心立方構造のα-Feで、加熱すると約912℃で六方最密構造のγ-F…」: γ-Fe は面心立方構造。六方最密構造ではない。<br><br>【出典】教科書的知識（一次資料は未確認）（変態温度は教科書値）〔出題実績: R5 4-3〕"},
{"f":"基礎:材料・化学・バイオ","q":"ステンレス鋼と耐食性に関する次の記述のうち、最も適切なものはどれか。","h":"さびにくい理由は、表面にできる薄い皮膜にあります。","c":["鉄に10.5%以上のクロムを加えた合金鋼で、表面にクロム酸化物の薄い不働態皮膜ができ、傷がついても周囲に酸素があれば皮膜が再生する。","鉄に10.5%以上のニッケルを加えた合金鋼で、表面にニッケルの酸化物を主体とする厚い皮膜ができ、傷がついた皮膜は再生しない。","鉄にクロムを1%程度加えた合金鋼で、表面に厚い酸化鉄の皮膜ができ、傷がつくと皮膜は内部まで割れて再生しない。","炭素を多く加えて硬くした鉄の合金で、金属が貴で酸素や水と反応しないため、皮膜がなくても腐食しない。"],"a":0,"v":"primary","n":"<b>正解: 鉄に10.5%以上のクロムを加えた合金鋼で、表面にクロム酸化物の薄い不働態皮…</b><br>ステンレス鋼は鉄に10.5%以上のクロムを加えた合金鋼。クロムが酸素と結びついて表面に薄い不働態皮膜をつくり、傷がついても周囲に酸素があれば自動的に再生する。<br><br>誤答の生まれ方<br>・「鉄に10.5%以上のニッケルを加えた合金鋼で、表面にニッケルの酸化物を主体と…」: ステンレス鋼の定義の元素はクロム（Cr）。皮膜は薄く、傷がついても酸素があれば再生する。<br>・「鉄にクロムを1%程度加えた合金鋼で、表面に厚い酸化鉄の皮膜ができ、傷がつくと…」: ステンレス鋼として十分な耐食性が出るのは、クロムが約10.5%以上のとき。<br>・「炭素を多く加えて硬くした鉄の合金で、金属が貴で酸素や水と反応しないため、皮膜…」: 耐食性のもとは炭素の量ではなく、クロムによる不働態皮膜。皮膜がなければ鉄は腐食する。<br><br>【出典】日本ステンレス協会（JSSA）「特長」https://www.jssa.gr.jp/contents/about_stainless/key_properties/（10.5%以上のクロム・不動態皮膜・自己再生）。確認日 2026-10-04〔出題実績: R5 4-4、R6 4-4〕"},
{"f":"基礎:材料・化学・バイオ","q":"次の有機反応のうち、脱離反応に分類されるものはどれか。","h":"脱離は、分子から小さな分子が取れて二重結合ができる反応です。","c":["エチレンに臭素を作用させ、1,2-ジブロモエタンを生じる反応","エタノールを濃硫酸とともに加熱し、エチレンと水を生じる反応","クロロメタンと水酸化ナトリウム水溶液から、メタノールと塩化ナトリウムを生じる反応","ベンゼンに混酸を作用させ、ニトロベンゼンを生じる反応"],"a":1,"v":"textbook","n":"<b>正解: エタノールを濃硫酸とともに加熱し、エチレンと水を生じる反応</b><br>エタノールの脱水でエチレンができる反応は、H と OH が取れて二重結合ができる脱離反応。臭素の反応は付加、残り2つは置換反応。<br><br>誤答の生まれ方<br>・「エチレンに臭素を作用させ、1,2-ジブロモエタンを生じる反応」: 二重結合に原子団が加わる付加反応。<br>・「クロロメタンと水酸化ナトリウム水溶液から、メタノールと塩化ナトリウムを生じる反応」: 塩素がヒドロキシ基に入れ替わる置換反応。<br>・「ベンゼンに混酸を作用させ、ニトロベンゼンを生じる反応」: ベンゼンの水素がニトロ基に入れ替わる置換反応。<br><br>【出典】教科書的知識（一次資料は未確認）〔出題実績: R2 4-2〕"},
{"f":"基礎:材料・化学・バイオ","q":"次の分子のうち、極性分子であるものはどれか。","h":"分子の形が対称で、結合の極性が打ち消し合うものは無極性です。","c":["二硫化炭素 CS₂","六フッ化硫黄 SF₆","エチレン C₂H₄","アンモニア NH₃"],"a":3,"v":"textbook","n":"<b>正解: アンモニア NH₃</b><br>NH₃ は三角錐形で、N‐H 結合の極性が打ち消されず、分子全体が極性をもつ。他は対称形で極性が打ち消し合う。<br><br>誤答の生まれ方<br>・「二硫化炭素 CS₂」: 直線形で、2つの結合の極性が打ち消し合うので無極性。<br>・「六フッ化硫黄 SF₆」: 正八面体形で結合の極性が互いに打ち消し合うので無極性。<br>・「エチレン C₂H₄」: 平面で対称な形のため、結合の極性が打ち消し合い無極性。<br><br>【出典】教科書的知識（一次資料は未確認）（VSEPR による分子形状の判断）〔出題実績: R1再 4-1〕"},
{"f":"基礎:材料・化学・バイオ","q":"炭酸カルシウムの熱分解 CaCO₃ → CaO + CO₂ の標準反応エンタルピーは ΔH° = +178.3 kJ/mol、標準反応エントロピーは ΔS° = +160.5 J/(K·mol) である。これらの値が温度によらないとして、ΔG° = ΔH° − TΔS° が 0 になる温度、すなわち反応が自発的に進み始める温度［K］に最も近い値はどれか。","h":"ΔH° は kJ、ΔS° は J で与えられています。単位をそろえます。","c":["1.11 K","1.11×10³ K","9.00×10² K","8.38×10² K"],"a":1,"v":"calc","n":"<b>正解: 1.11×10³ K</b><br>ΔG° = 0 より T = ΔH°/ΔS° = 178.3×10³ J/mol ÷ 160.5 J/(K·mol) ≒ 1.11×10³ K（約838℃）。ΔH>0、ΔS>0 の反応は高温ほど自発的になる。<br><br>誤答の生まれ方<br>・「1.11 K」: ΔH° を kJ のまま、ΔS° を J のまま割って、単位換算（1 kJ = 10³ J）を忘れた。<br>・「9.00×10² K」: ΔS°/ΔH°（分子と分母の逆）で計算した。<br>・「8.38×10² K」: T は求めたが、さらに 273 を引いて摂氏にした。ΔG° の式の T は絶対温度。<br><br>【出典】検算: ΔG°=ΔH°−TΔS°=0 より T=ΔH°/ΔS°（化学熱力学の基本式）。python で確認。〔出題実績: R1再 4-3〕"},
{"f":"基礎:材料・化学・バイオ","q":"液晶ディスプレイやタッチパネルの透明電極に用いられる ITO（酸化物の薄膜）に含まれる主な金属元素の組合せとして、最も適切なものはどれか。","h":"ITO の名前は、含まれる2つの金属元素の名称に由来します。","c":["ガリウム（Ga）とヒ素（As）","銅（Cu）と亜鉛（Zn）","インジウム（In）とスズ（Sn）","アルミニウム（Al）と銅（Cu）"],"a":2,"v":"textbook","n":"<b>正解: インジウム（In）とスズ（Sn）</b><br>ITO は Indium Tin Oxide（インジウムスズ酸化物）で、インジウムとスズを含む透明導電膜。<br><br>誤答の生まれ方<br>・「ガリウム（Ga）とヒ素（As）」: 化合物半導体 GaAs の元素と混同した。<br>・「銅（Cu）と亜鉛（Zn）」: 黄銅（真ちゅう）の成分と混同した。<br>・「アルミニウム（Al）と銅（Cu）」: ジュラルミンの主な成分と混同した。<br><br>【出典】教科書的知識（一次資料は未確認）〔出題実績: R1再 4-4〕"}
];
