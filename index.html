<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="技術士第一次試験【19】環境部門・専門科目の学習ツール。令和元年度〜7年度の過去問245問を全問分類した頻出テーマと、白書・環境省統計の数値を問う4択クイズ。">
<title>技術士一次試験 環境部門 数値クイズ｜頻出テーマ</title>
</head>
<body>

<style>
  :root {
    --paper: #FCFBF8;
    --panel: #FFFFFF;
    --rule: #DCDDD6;
    --rule-strong: #B7BBB2;
    --ink: #191D1A;
    --ink-2: #4A5049;
    --ink-3: #767C74;
    --accent: #0E5049;
    --accent-soft: #E3EDEA;
    --ok: #1B6B3A;
    --ok-soft: #E2F0E5;
    --ng: #9E3324;
    --ng-soft: #F7E6E2;
    --shadow: 0 1px 2px rgba(25,29,26,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #131614; --panel: #1A1E1C; --rule: #2C312E; --rule-strong: #454B46;
      --ink: #E8EBE7; --ink-2: #AFB5AD; --ink-3: #838A82;
      --accent: #6FBFB2; --accent-soft: #1E3833;
      --ok: #6FC28C; --ok-soft: #1C3325;
      --ng: #E08878; --ng-soft: #3A2320;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --paper: #131614; --panel: #1A1E1C; --rule: #2C312E; --rule-strong: #454B46;
    --ink: #E8EBE7; --ink-2: #AFB5AD; --ink-3: #838A82;
    --accent: #6FBFB2; --accent-soft: #1E3833;
    --ok: #6FC28C; --ok-soft: #1C3325;
    --ng: #E08878; --ng-soft: #3A2320;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    font-size: 16px; line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 34rem; margin: 0 auto; padding: 1.5rem 1.1rem 4rem; }

  /* header */
  header { margin-bottom: 1.3rem; }
  .eyebrow { font-size: .72rem; letter-spacing: .15em; color: var(--ink-3); }
  h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 1.32rem; font-weight: 600; margin: .3rem 0 .5rem; line-height: 1.4;
  }
  .intro { font-size: .87rem; color: var(--ink-2); margin: 0; }

  /* progress */
  .status {
    display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap;
    font-size: .8rem; color: var(--ink-3); margin: 1.2rem 0 .45rem;
    font-variant-numeric: tabular-nums;
  }
  .status .field { color: var(--accent); font-weight: 600; letter-spacing: .02em; }
  .status .score { margin-left: auto; }
  .status b { color: var(--ink); }
  .status[hidden], .bar[hidden] { display: none; }

  /* 本番までの残り日数 */
  /* おまかせ出題 */
  .set.auto[aria-pressed="false"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .set .badge {
    display: inline-block; min-width: 1.4em; margin-left: .35em; padding: 0 .35em; border-radius: 999px;
    background: var(--ng); color: #fff; font-size: .68rem; font-weight: 700; line-height: 1.55; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .auto { margin-top: 1rem; padding-top: .9rem; border-top: 1px solid var(--rule); }
  .auto h3 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1rem; font-weight: 600; margin: 0 0 .3rem; }
  .auto-lead { font-size: .82rem; color: var(--ink-2); margin: 0 0 .7rem; line-height: 1.75; }
  .auto-n { display: flex; justify-content: space-between; align-items: baseline; font-size: .85rem; }
  .auto-n output { font-weight: 700; color: var(--accent); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  #autoN { display: block; width: 100%; margin: .45rem 0 .1rem; accent-color: var(--accent); }
  .auto-scale { display: flex; justify-content: space-between; font-size: .72rem; color: var(--ink-3); }
  .auto .btn.wide { margin-top: .8rem; }
  .mastery { display: flex; flex-wrap: wrap; gap: .3rem .9rem; margin-top: .7rem; font-size: .76rem; color: var(--ink-3); }
  .mastery b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .mastery .m1 b { color: var(--ng); }
  .mastery .m3 b, .mastery .m4 b { color: var(--ok); }
  .mst {
    display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .04em; padding: 0 .4rem;
    border-radius: 2px; margin-left: .45rem; vertical-align: 1px; border: 1px solid var(--rule-strong); color: var(--ink-3);
  }
  .mst.m1 { color: var(--ng); border-color: var(--ng); }
  .mst.m3, .mst.m4 { color: var(--ok); border-color: var(--ok); }
  .countdown { font-size: .82rem; color: var(--ink-2); margin: .5rem 0 0; font-variant-numeric: tabular-nums; }
  .countdown b { color: var(--accent); font-size: 1rem; }
  .countdown .cd2 { font-size: .76rem; color: var(--ink-3); }

  /* 覚える理由（過去問の出題実績） */
  .whys { display: flex; flex-wrap: wrap; gap: .3rem; margin: .35rem 0 0; }
  .why {
    display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .02em; line-height: 1.6;
    padding: 0 .45rem; border-radius: 2px; border: 1px solid var(--accent); color: var(--accent);
  }
  .why.t3 { background: var(--accent); color: var(--paper); }
  .why.same { background: var(--accent-soft); }
  .why.t1 { border-style: dashed; border-color: var(--rule-strong); color: var(--ink-3); font-weight: 600; }
  .whybox {
    margin: .7rem 0 0; padding: .55rem .7rem; background: var(--accent-soft);
    border-left: 3px solid var(--accent); font-size: .82rem; line-height: 1.7; color: var(--ink-2);
  }
  .whybox .wh { display: block; font-size: .72rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
  .whybox.t0 { border-left-color: var(--rule-strong); background: transparent; border: 1px dashed var(--rule); border-left: 3px solid var(--rule-strong); }
  .whybox.t0 .wh { color: var(--ink-3); }

  /* 合格までの道のり（ホーム） */
  .roadmap { margin-top: 1.1rem; padding-top: .9rem; border-top: 1px solid var(--rule); }
  .roadmap h3 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1rem; font-weight: 600; margin: 0 0 .3rem; }
  .roadmap .rm-lead { font-size: .84rem; color: var(--ink-2); margin: 0 0 .6rem; line-height: 1.75; }
  .rm-steps { list-style: none; margin: 0; padding: 0; }
  .rm-steps li {
    display: grid; grid-template-columns: 4.2rem 1fr; gap: .1rem .6rem; align-items: baseline;
    padding: .5rem 0; border-bottom: 1px solid var(--rule); font-size: .84rem;
  }
  .rm-steps .d { font-size: .74rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .rm-steps .t { color: var(--ink); }
  .rm-steps .v { grid-column: 2; font-size: .76rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .rm-steps .st { font-size: .68rem; font-weight: 700; padding: 0 .35rem; border-radius: 2px; margin-left: .35rem; vertical-align: 1px; }
  .rm-steps .done .st { color: var(--ok); border: 1px solid var(--ok); }
  .rm-steps .now .st { color: var(--paper); background: var(--accent); }
  .rm-steps .late .st { color: var(--paper); background: var(--ng); }
  .rm-steps .todo .t { color: var(--ink-3); }
  .rm-next { margin-top: .8rem; }
  .rm-next .lab { font-size: .74rem; color: var(--ink-3); margin: 0 0 .3rem; }
  .rm-next .btn { display: block; width: 100%; text-align: left; padding: .65rem 1rem; margin-top: .45rem; }
  .rm-next .btn .sub { display: block; font-size: .76rem; font-weight: 400; opacity: .88; }
  .homecard .hlead { font-size: .9rem; color: var(--ink-2); margin: 0; line-height: 1.7; }
  .homecard .btn.wide { display: block; width: 100%; text-align: left; padding: .7rem 1rem; margin-top: .9rem; }
  .homecard .btn.wide .sub { display: block; font-size: .78rem; font-weight: 400; opacity: .88; margin-top: .1rem; }
  .homestats {
    display: flex; gap: .4rem 1rem; flex-wrap: wrap; margin-top: 1rem; padding-top: .8rem;
    border-top: 1px solid var(--rule); font-size: .8rem; color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  .homestats b { color: var(--ink); }
  .bar { height: 3px; background: var(--rule); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

  /* card */
  .card {
    background: var(--panel); border: 1px solid var(--rule);
    box-shadow: var(--shadow); padding: 1.15rem 1.1rem 1.25rem; margin-top: 1.1rem;
  }
  .qn { font-size: .75rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .qt { font-size: 1.03rem; font-weight: 600; margin: .25rem 0 .1rem; line-height: 1.6; text-wrap: pretty; }
  .qh { font-size: .82rem; color: var(--ink-3); margin: 0 0 .9rem; line-height: 1.6; }

  .choices { display: flex; flex-direction: column; gap: .45rem; }
  .ch {
    display: flex; align-items: flex-start; gap: .65rem; width: 100%;
    font: inherit; font-size: .95rem; text-align: left; cursor: pointer;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: 2px;
    padding: .58rem .7rem; line-height: 1.55;
    transition: background .12s, border-color .12s;
    font-variant-numeric: tabular-nums;
  }
  .ch:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .ch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ch:disabled { cursor: default; }
  .ch .key {
    flex: none; width: 1.35rem; height: 1.35rem; margin-top: .1rem;
    display: grid; place-items: center;
    border: 1px solid var(--rule-strong); border-radius: 50%;
    font-size: .72rem; color: var(--ink-3);
  }
  .ch.ok { border-color: var(--ok); background: var(--ok-soft); }
  .ch.ok .key { border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .ch.ng { border-color: var(--ng); background: var(--ng-soft); }
  .ch.ng .key { border-color: var(--ng); color: var(--ng); font-weight: 700; }
  .ch.dim { opacity: .45; }

  .verdict { margin-top: .95rem; padding-top: .85rem; border-top: 1px solid var(--rule); }
  .vtag { font-size: .82rem; font-weight: 700; letter-spacing: .04em; }
  .vtag.ok { color: var(--ok); }
  .vtag.ng { color: var(--ng); }
  .vnote { font-size: .86rem; color: var(--ink-2); margin: .3rem 0 0; line-height: 1.72; }
  .vnote b { color: var(--ink); }
  .vsrc {
    font-size: .73rem; color: var(--ink-3); margin: .55rem 0 0;
    padding-top: .45rem; border-top: 1px dotted var(--rule);
  }
  .vsrc.k { color: var(--ng); }

  .actions { display: flex; gap: .5rem; margin-top: 1rem; align-items: center; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: .87rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--paper);
    border: 1px solid var(--accent); border-radius: 2px; padding: .45rem 1.3rem;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--rule-strong); font-weight: 400; }
  .btn.ghost:hover { border-color: var(--accent); color: var(--accent); filter: none; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: .35; cursor: default; filter: none; }
  /* 一番よく押す「次の問題」を横幅いっぱいに、その下に「前の問題」「ホーム」を半分ずつ */
  .qnav { margin-top: 1rem; }
  .navrow { display: grid; gap: .5rem; }
  .navrow.one { grid-template-columns: 1fr; margin-bottom: .5rem; }
  .navrow.two { grid-template-columns: 1fr 1fr; }
  .qnav .btn { padding: .6rem .5rem; white-space: nowrap; text-align: center; }
  .hintkey { font-size: .74rem; color: var(--ink-3); margin: .55rem 0 0; }
  @media (hover: none) { .hintkey { display: none; } }

  /* result */
  .result h2 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 1.18rem; margin: 0 0 .2rem;
  }
  .big { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--accent); }
  .big small { font-size: 1rem; font-weight: 400; color: var(--ink-3); }
  .judge { font-size: .9rem; color: var(--ink-2); margin: .5rem 0 1.1rem; line-height: 1.7; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
  th, td { padding: .38rem .3rem; border-bottom: 1px solid var(--rule); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  thead th { font-size: .75rem; color: var(--ink-3); font-weight: 600; border-bottom: 1px solid var(--rule-strong); }
  td .mini { display: inline-block; width: 3.2rem; height: 4px; background: var(--rule); vertical-align: middle; margin-left: .4rem; }
  td .mini i { display: block; height: 100%; background: var(--accent); }
  .missed { margin-top: 1.4rem; }
  .missed h3 { font-size: .85rem; margin: 0 0 .5rem; color: var(--ink-3); font-weight: 600; letter-spacing: .03em; }
  .missed ol { margin: 0; padding-left: 1.2rem; font-size: .87rem; color: var(--ink-2); line-height: 1.75; }
  .missed b { color: var(--ink); }

  /* 再開バナー・保存警告 */
  .resume {
    display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap;
    background: var(--accent-soft); border-left: 3px solid var(--accent);
    padding: .6rem .85rem; margin-top: 1rem; font-size: .84rem; color: var(--ink-2);
  }
  .resume b { color: var(--ink); }
  .resume button {
    font: inherit; font-size: .78rem; cursor: pointer; background: none; color: var(--accent);
    border: 0; border-bottom: 1px solid var(--accent); padding: 0 0 1px; margin-left: auto;
  }
  .nostore {
    background: var(--ng-soft); border-left: 3px solid var(--ng);
    padding: .6rem .85rem; margin-top: 1rem; font-size: .82rem; color: var(--ink-2); line-height: 1.7;
  }
  .nostore b { color: var(--ink); }

  /* データ読み込み */
  .datamgr { margin-top: 2rem; padding-top: 1.1rem; border-top: 1px solid var(--rule); }
  .datamgr h3 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 1rem; font-weight: 600; margin: 0 0 .3rem;
  }
  .datamgr p { font-size: .82rem; color: var(--ink-2); margin: 0 0 .8rem; line-height: 1.75; }
  .imp { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .imp input[type=file] { display: none; }
  .impfile {
    font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--paper); border: 1px solid var(--accent);
    border-radius: 2px; padding: .45rem 1.2rem; display: inline-block;
  }
  .impfile:hover { filter: brightness(1.12); }
  .impfile.ghost { background: transparent; color: var(--accent); }
  .impfile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .impmsg { font-size: .78rem; }
  .impmsg.ok { color: var(--ok); }
  .impmsg.ng { color: var(--ng); }
  .impitem {
    display: flex; align-items: baseline; gap: .6rem; padding: .5rem 0;
    border-bottom: 1px solid var(--rule); font-size: .86rem;
  }
  .impitem .n2 { color: var(--ink-3); font-size: .78rem; font-variant-numeric: tabular-nums; }
  .impitem button {
    margin-left: auto; font: inherit; font-size: .76rem; cursor: pointer;
    background: none; color: var(--ink-3); border: 0;
    border-bottom: 1px solid var(--rule-strong); padding: 0 0 1px;
  }
  .impitem button:hover { color: var(--ng); border-bottom-color: var(--ng); }
  .privacy { font-size: .76rem; color: var(--ink-3); line-height: 1.7; margin-top: .8rem; }

  /* 学習診断 */
  .diag { margin-top: 1.6rem; }
  .diag h3 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 1rem; font-weight: 600; margin: 0 0 .2rem;
    padding-bottom: .4rem; border-bottom: 1.5px solid var(--ink);
  }
  .diag .note2 { font-size: .8rem; color: var(--ink-3); margin: .5rem 0 .8rem; line-height: 1.7; }
  .drow {
    display: grid; grid-template-columns: 1fr 4.6rem 3.4rem; gap: .15rem .7rem;
    padding: .5rem 0; border-bottom: 1px solid var(--rule); align-items: center;
  }
  .drow .dn { font-size: .87rem; font-weight: 600; }
  .drow .dsub { grid-column: 1 / -1; font-size: .72rem; color: var(--ink-3); line-height: 1.55; }
  .drow .dv { font-size: .82rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .drow .dloss { font-size: .95rem; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .drow.p1 .dloss { color: var(--ng); }
  .drow.p2 .dloss { color: var(--amber, #8A6A1F); }
  .drow.p3 .dloss { color: var(--ink-3); font-weight: 400; }
  .rx { background: var(--accent-soft); padding: .9rem 1.1rem; margin-top: 1rem; font-size: .87rem; line-height: 1.8; }
  .rx b { color: var(--ink); }
  .rx ol { margin: .4rem 0 0; padding-left: 1.2rem; }
  .rx li { margin-bottom: .3rem; }
  .exp { margin-top: 1.2rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .exp .msg { font-size: .78rem; color: var(--accent); }

  /* 履歴タブ */
  .hsum {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr));
    gap: .1rem 1rem; margin: 1.1rem 0 .3rem; padding-bottom: .9rem;
    border-bottom: 1px solid var(--rule);
  }
  .hsum div { font-size: .74rem; color: var(--ink-3); }
  .hsum b { display: block; font-size: 1.35rem; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.35; }
  .hsum .warn b { color: var(--ng); }
  .filters { display: flex; gap: .35rem; flex-wrap: wrap; margin: .9rem 0 .2rem; align-items: center; }
  .flt {
    font: inherit; font-size: .78rem; cursor: pointer; background: var(--panel); color: var(--ink-2);
    border: 1px solid var(--rule-strong); border-radius: 999px; padding: .2rem .75rem;
  }
  .flt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 600; }
  .flt:hover:not([aria-pressed="true"]) { border-color: var(--accent); color: var(--accent); }
  .flt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hrow {
    display: grid; grid-template-columns: 1fr auto; gap: .1rem .8rem;
    padding: .62rem 0; border-bottom: 1px solid var(--rule); align-items: baseline;
  }
  .hrow .hq { font-size: .87rem; line-height: 1.55; }
  .hrow .hf { font-size: .7rem; color: var(--accent); letter-spacing: .03em; }
  .hrow .hn { font-size: .8rem; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .hrow .hn b { color: var(--ink); }
  .hbar { display: block; width: 3.6rem; height: 4px; background: var(--rule); margin-top: .28rem; margin-left: auto; }
  .hbar i { display: block; height: 100%; background: var(--accent); }
  .hbar.bad i { background: var(--ng); }
  .hrow.miss .hq::before {
    content: "✕"; color: var(--ng); font-weight: 700; font-size: .78rem; margin-right: .35rem;
  }
  .hrow.none .hq { color: var(--ink-3); }
  .empty { font-size: .87rem; color: var(--ink-3); padding: 1.6rem 0; text-align: center; }
  .hact { margin: 1.2rem 0 .4rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

  /* 履歴・フラグ */
  .hist { font-size: .72rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .flagmark {
    display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .04em;
    color: var(--ng); background: var(--ng-soft); border: 1px solid var(--ng);
    padding: 0 .4rem; border-radius: 2px; margin-left: .45rem; vertical-align: 1px;
  }
  .qmeta { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .set.weak[aria-pressed="false"] { border-color: var(--ng); color: var(--ng); }
  .set.weak[aria-pressed="true"] { background: var(--ng); border-color: var(--ng); color: var(--paper); }

<script>
const Q = QUIZ_DATA.slice();

const LETTERS = ["1","2","3","4","5"];
/* 解説の根拠の質。誤った知識を覚えないよう、どこまで裏を取ったかを明示する */
const VLABEL = {
  primary:   "◎ 白書・法令・告示など一次資料で確認",
  answer:    "○ 公開正答表との突合により確定",
  knowledge: "△ 教科書的知識にもとづく記述（一次資料は未確認。テキストでの確認を推奨）"
};
let i = 0, correct = 0, answered = false;
const log = [];
const answers = [];

const stage = document.getElementById("stage");
const elField = document.getElementById("field");
const elCount = document.getElementById("count");
const elScore = document.getElementById("score");
const elBar = document.getElementById("bar");

function shuffle(n, seed) {
  // 決定論的シャッフル（問題ごとに選択肢の並びを変える）
  const idx = [...Array(n).keys()];
  for (let k = n - 1; k > 0; k--) {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    const j = seed % (k + 1);
    [idx[k], idx[j]] = [idx[j], idx[k]];
  }
  return idx;
}

function render() {
  AT_HOME = false;
  setQuizChrome(true);
  document.body.classList.remove("home-mode");
  const hb = document.getElementById("homeBottom");
  if (hb) hb.innerHTML = "";
  if (i >= Q.length) return renderResult();
  const q = Q[i];
  let seed = 0;
  for (let k = 0; k < q.q.length; k++) seed = (seed * 31 + q.q.charCodeAt(k)) & 0x7fffffff;
  const order = shuffle(q.c.length, seed);
  const prev = answers[i];
  answered = !!prev;

  elField.textContent = q.f;
  elCount.textContent = (i + 1) + " / " + Q.length;
  elScore.innerHTML = "正解 <b>" + correct + "</b>";
  elBar.style.width = (i / Q.length * 100) + "%";

  const card = document.createElement("div");
  card.className = "card";
  const h = histOf(q);
  let badge = '';
  if (h) {
    badge = '<span class="hist">これまで ' + h.n + '回中 ' + h.ok + '回正解</span>';
    if (h.last === 0) badge += '<span class="flagmark">前回まちがえた</span>';

  }
  const bm = isBookmarked(q);
  card.innerHTML =
    '<div class="qmeta"><span class="qn">Q' + (i + 1) + '</span>' + badge +
      '<span class="qtools">' +
        '<button type="button" class="qtool" id="bmTog" aria-pressed="' + bm + '">' + bmLabel(bm) + '</button>' +
        '<button type="button" class="qtool" id="memoTog" aria-expanded="false" aria-controls="memoBox"></button>' +
      '</span></div>' +
    whyChips(whyOf(q)) +
    '<p class="qt"></p><p class="qh"></p><div class="choices"></div>' +
    '<div class="memo" id="memoBox" hidden>' +
      '<label for="memoTa">メモ（この端末に自動で保存されます）</label>' +
      '<textarea id="memoTa" rows="3" placeholder="覚え方、間違えた理由など"></textarea>' +
      '<div class="saved" aria-live="polite"></div>' +

  card.querySelector(".qt").textContent = q.q;
  card.querySelector(".qh").textContent = q.h;

  const box = card.querySelector(".choices");

      b => Number(b.dataset.orig) === prev.pick);

  }

}

/* 前へ／次へのナビゲーション。解答前でも「前へ」で戻れる */
/* 解答前も解答後も「← 前の問題／ホーム／次の問題 →」を同じ位置に出す */
/* 解答前は「とばす」扱い（控えめな見た目・Enterでは押されない）、解答後は通常の「次へ」 */
function navHtml(answeredNow) {

      (answeredNow
        ? '<button class="btn" id="next">' + label + '</button>'
        : '<button class="btn ghost" id="skip">' + label + '</button>') +
    '</div>' +
    '<div class="navrow two">' +
      '<button class="btn ghost" id="prev"' + (i > 0 ? '' : ' disabled') + '>← 前の問題</button>' +
      '<button class="btn ghost" id="home">ホーム</button>' +
    '</div>';
}
function wireNav(el) {
  el.querySelector("#prev").addEventListener("click", goPrev);
  el.querySelector("#home").addEventListener("click", goHome);
  const nb = el.querySelector("#next");
  if (nb) nb.addEventListener("click", goNext);
  const sk = el.querySelector("#skip");
  if (sk) sk.addEventListener("click", goNext);

}
function renderNav(card) {
  const old = card.querySelector(".nav");
  if (old) old.remove();

  nav.className = "qnav nav";

}
function goPrev() { if (i > 0) { i--; saveSession(); render(); } }
function goNext() { i++; saveSession(); render(); }
/* ---------- 合格までの道のり（本番日と期日の目安） ---------- */
/* 受験日はホーム画面から変更でき、この端末に保存する。未設定・壊れた値は既定日にフォールバック */
const EKEY = "gq_exam_day";
const EXAM_DAY_DEFAULT = new Date(2026, 10, 22);
function pad2(x) { return String(x).padStart(2, "0"); }
function ymd(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function mdLabel(d) { return (d.getMonth() + 1) + "/" + d.getDate(); }
function mdJp(d) { return (d.getMonth() + 1) + "月" + d.getDate() + "日"; }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
/* "YYYY-MM-DD" 以外・2/30のような存在しない日付はnullを返す（new Dateは繰り上げて解釈してしまうため） */
function parseYmd(s) {
  if (typeof s !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  const parts = s.split("-").map(Number);
  const y = parts[0], m = parts[1], dd = parts[2];
  const d = new Date(y, m - 1, dd);
  if (d.getFullYear() !== y || d.getMonth() !== m - 1 || d.getDate() !== dd) return null;
  return d;
}
function loadExamDay() {
  try {
    const d = parseYmd(localStorage.getItem(EKEY));
    if (d) return d;
  } catch (e) {}
  return new Date(EXAM_DAY_DEFAULT);
}
let EXAM_DAY = loadExamDay();
let RM_ROUND1, RM_RATE, RM_FINAL;
function computeRoadmapDates() {
  RM_ROUND1 = addDays(EXAM_DAY, -38);  // 全問1周
  RM_RATE = addDays(EXAM_DAY, -21);    // 正答率70%・測定分析の見直し
  RM_FINAL = addDays(EXAM_DAY, -14);   // 以降は苦手とブックマークだけ
}
computeRoadmapDates();
function setExamDay(s) {
  const d = parseYmd(s);
  if (!d) return false;
  EXAM_DAY = d;
  computeRoadmapDates();
  try { localStorage.setItem(EKEY, s); } catch (e) {}
  return true;
}
function todayMid() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function daysLeft() { return Math.round((EXAM_DAY - todayMid()) / 86400000); }
/* 正答率は「直近の解答で正解している問題の割合」。累計だと最初の失点をいつまでも引きずるため */
function progressNow() {
  const all = verifiedOnly(SETS.all);
  let done = 0, ok = 0, md = 0, mo = 0;
  all.forEach(function (q) {
    const h = histOf(q);
    if (!h) return;
    done++; if (h.last === 1) ok++;
    if (q.f === "測定・分析") { md++; if (h.last === 1) mo++; }
  });
  return { total: all.length, done: done, rate: done ? ok / done : null, mRate: md ? mo / md : null };
}
function pct(x) { return x === null ? "—" : Math.round(x * 100) + "%"; }
let RM_ACTIONS = [];
function renderRoadmap() {
  const today = todayMid(), p = progressNow(), left = daysLeft();
  if (left < 0) return "";
  const allDone = p.done >= p.total;
  const st = function (cls, word) { return { c: cls, w: word }; };
  const s1 = allDone ? st("done", "達成") : today > RM_ROUND1 ? st("late", "遅れ") : st("now", "いまここ");
  const s2 = (allDone && p.rate >= 0.7) ? st("done", "達成") : today > RM_RATE ? st("late", "遅れ") : allDone ? st("now", "いまここ") : st("todo", "");
  const s3 = today < RM_RATE ? st("todo", "")
    : (p.mRate !== null && p.mRate < 0.5) ? st("now", "絞る") : st("done", "不要");
  const s4 = today >= RM_FINAL ? st("now", "いまここ") : st("todo", "");
  const li = function (s, d, t, v) {
    return '<li class="' + s.c + '"><span class="d">' + d + '</span><span class="t">' + t +
      (s.w ? '<span class="st">' + s.w + '</span>' : '') + '</span>' + (v ? '<span class="v">' + v + '</span>' : '') + '</li>';
  };

  // 次にやること
  const weak = weakList(), freq = verifiedOnly(SETS.all).filter(function (q) { return whyOf(q).tier >= 2; });
  RM_ACTIONS = [];
  if (today >= RM_FINAL && weak.length) {
    RM_ACTIONS.push({ label: "苦手を解く", sub: weak.length + "問・直近でまちがえた／正答率6割未満", list: weak });
  } else if (!allDone) {
    const un = verifiedOnly(SETS.all).filter(function (q) { return !histOf(q); });
    RM_ACTIONS.push({ label: "まだ解いていない問題を解く", sub: "残り " + un.length + "問（頻出論点から先に出します）", list: un, limit: 20 });
  } else if (p.rate < 0.7) {
    const top = fieldStats().filter(function (r) { return r.loss !== null; })[0];
    if (top) RM_ACTIONS.push({ label: top.f + " を解く", sub: "いちばん点を落としている分野（正答率" + pct(top.rate) + "・本番で年" + top.weight + "問）",
      list: verifiedOnly(SETS.all).filter(function (q) { return q.f === top.f; }) });
  } else if (weak.length) {
    RM_ACTIONS.push({ label: "苦手を解く", sub: weak.length + "問", list: weak });
  }
  RM_ACTIONS.push({ label: "★ 頻出論点だけ解く", sub: freq.length + "問・過去7年で2回以上出た論点。まずここを固める", list: freq, ghost: true });

  let btns = "";
  RM_ACTIONS.forEach(function (a, k) {
    btns += '<button class="btn' + (a.ghost ? ' ghost' : '') + '" data-rm="' + k + '">' + a.label + '<span class="sub">' + a.sub + '</span></button>';
  });

  return '<div class="roadmap"><h3>合格までの道のり</h3>' +
    '<p class="rm-lead">本番まであと<b>' + left + '日</b>。35問から25問を選び、<b>13問正解</b>で合格です。' +
    '当日の読み違いを見込んで、目標は<b>16問</b>に置きます。</p>' +
    '<details><summary>期日ごとの目安を見る</summary><ol class="rm-steps">' +
      li(s1, "〜" + mdLabel(RM_ROUND1), "全問を1周する", "解いた問題 " + p.done + " / " + p.total) +
      li(s2, "〜" + mdLabel(RM_RATE), "正答率を70%以上にする", "いま " + pct(p.rate) + "（直近の解答で正解している割合）") +
      li(s3, mdLabel(RM_RATE), "測定・分析が50%未満なら、頻出論点だけに絞る", "測定・分析 いま " + pct(p.mRate)) +
      li(s4, mdLabel(RM_FINAL) + "〜", "新しい範囲は増やさず、苦手とブックマークだけを回す", "") +
      li(st(left === 0 ? "now" : "todo", left === 0 ? "今日" : ""), mdLabel(EXAM_DAY), "本番", "") +
    '</ol></details>' +
    '<div class="rm-next"><p class="lab">次にやること</p>' + btns + '</div></div>';
}
function wireRoadmap(card) {
  card.querySelectorAll("[data-rm]").forEach(function (b) {
    b.addEventListener("click", function () {
      const a = RM_ACTIONS[Number(b.dataset.rm)];
      if (!a || !a.list.length) return;
      // 頻出論点から先に出す（同じ段の中は毎回シャッフル）
      const byTier = [5, 4, 3, 2, 1].map(function (r) { return shuffled(a.list.filter(function (q) { return whyOf(q).rank === r; })); });
      let list = [].concat.apply([], byTier);
      if (a.limit) list = list.slice(0, a.limit);
      Q.length = 0; list.forEach(function (q) { Q.push(q); });
      CUSTOM_LIST = list.slice(); CURRENT_SET = "custom";
      i = 0; correct = 0; log.length = 0; answers.length = 0;
      applySetButtons("__none__");
      document.getElementById("pickinfo").textContent = "";
      saveSession(); render();
    });
  });
}
function renderCountdown() {
  const el = document.getElementById("countdown");
  if (!el) return;
  const left = daysLeft();
  const editBtn =
    '<button type="button" class="examEditBtn" id="examEditBtn" aria-expanded="false">' +

function wireExamEdit(el) {
  const editBtn = el.querySelector("#examEditBtn");
  const editRow = el.querySelector("#examEdit");
  const dateInput = el.querySelector("#examDate");
  const saveBtn = el.querySelector("#examSave");
  const cancelBtn = el.querySelector("#examCancel");
  editBtn.addEventListener("click", function () {

/* ---------- ホーム（出題範囲を選ぶ画面） ---------- */
/* いまの回は中断するだけで消さない。「続きから」で同じ問題に戻れる */

function choose(card, btn, origIdx) {
  if (answered) return;
  answered = true;
  const q = Q[i];
  const hit = origIdx === q.a;
  if (hit) correct++;
  recordAnswer(q, hit);
  log.push({ f: q.f, hit: hit, q: q.q, a: q.c[q.a] });
  answers[i] = { pick: origIdx, hit: hit };
  saveSession();
  showVerdict(card, btn, hit, true);
}

function showVerdict(card, btn, hit, focusNext) {
  const q = Q[i];
  card.querySelectorAll(".ch").forEach(b => {
    b.disabled = true;
    const oi = Number(b.dataset.orig);

}

/* ---------- おまかせ出題（忘却曲線にもとづく復習日の管理） ---------- */
const DAY = 86400000;
// 連続正解数ごとの、次の復習までの日数。まちがえたら翌日。本番まで約2か月なので最長30日
const SR_DAYS = [1, 2, 4, 7, 14, 30];
const MASTERY = ["未学習", "要復習", "学習中", "定着", "完璧"];
function dayStart(t) { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function srSchedule(h, now) {
  h.ts = now;
  h.due = dayStart(now) + SR_DAYS[Math.min(h.st || 0, SR_DAYS.length - 1)] * DAY;
}
/* 解いた日時を持たない古い履歴：まちがえた問題は今日が復習日、正解した問題は今日解いたものとして扱う */
function migrateSR() {
  let changed = false;
  const now = Date.now();
  Object.keys(HIST).forEach(function (k) {
    const h = HIST[k];
    if (typeof h.due === "number") return;
    h.st = h.last === 1 ? (h.ok === h.n ? Math.min(h.ok, 2) : 1) : 0;
    if (h.last === 1) srSchedule(h, now); else { h.ts = now; h.due = dayStart(now); }
    changed = true;
  });
  if (changed) saveHist();
}
migrateSR();
function isDue(h, today) { return !!h && typeof h.due === "number" && h.due <= today; }
function dueList() {
  const t = dayStart(Date.now());
  return verifiedOnly(SETS.all).filter(function (q) { return isDue(histOf(q), t); });
}
/* 習熟度：0未学習 1要復習（直近まちがえた／正答率6割未満） 2学習中 3定着（3回連続正解） 4完璧（5回連続正解） */
function mastery(q) {
  const h = histOf(q);
  if (!h) return 0;
  if (h.last === 0 || h.ok / h.n < 0.6) return 1;
  const st = h.st || 0;
  return st >= 5 ? 4 : st >= 3 ? 3 : 2;
}
/* 出題の順：①復習日を過ぎた問題（古い順・習熟度の低い順） ②まだ解いていない問題（頻出論点から） ③期限前でも習熟度の低い問題 */
function autoPick(n) {
  const today = dayStart(Date.now());
  const all = verifiedOnly(SETS.all);
  let pick = all.filter(function (q) { return isDue(histOf(q), today); }).sort(function (a, b) {
    return histOf(a).due - histOf(b).due || mastery(a) - mastery(b) || whyOf(b).rank - whyOf(a).rank;
  }).slice(0, n);
  if (pick.length < n) {
    const fresh = [];
    [5, 4, 3, 2, 1].forEach(function (r) {
      fresh.push.apply(fresh, shuffled(all.filter(function (q) { return !histOf(q) && whyOf(q).rank === r; })));
    });
    pick = pick.concat(fresh.slice(0, n - pick.length));
  }
  if (pick.length < n) {
    const ahead = all.filter(function (q) { const h = histOf(q); return h && !isDue(h, today); }).sort(function (a, b) {
      return mastery(a) - mastery(b) || histOf(a).due - histOf(b).due;
    });
    pick = pick.concat(ahead.slice(0, n - pick.length));
  }
  return shuffled(pick);
}

/* ---------- 出題数の絞り込み ---------- */
let LIMIT = 0;              // 0 = 全問
let CUSTOM_LIST = null;     // 履歴タブから渡された任意の問題群

/* 未検証（確度△）の問題は既定で出題しない。誤った知識を覚えないための安全側の既定値 */
let INCLUDE_UNVERIFIED = false;
try { INCLUDE_UNVERIFIED = localStorage.getItem("gq_inc_unverified") === "1"; } catch (e) {}
function verifiedOnly(list) {
  return INCLUDE_UNVERIFIED ? list : list.filter(function (q) { return q.v !== "knowledge"; });
}
function baseList() {
  if (CURRENT_SET === "weak") return verifiedOnly(weakList());

function updateUnvUI() {

      : "一次資料または公開正答表で裏を取った <b>" + (all.length - unv) + "問</b> だけを出題しています（未検証の" + unv + "問は除外）。";
  }

/* その場でシャッフル（Fisher-Yates）。同じ並びで覚えてしまうのを防ぐ */
function shuffled(list) {
  const a = list.slice();
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    const t = a[k]; a[k] = a[j]; a[j] = t;
  }
  return a;
}
/* 絞り込むときは「未回答 → 直近誤答 → 正答率が低い順」で拾い、拾ったあとに順番を混ぜる */
function pickQuestions(list) {
  if (!LIMIT || list.length <= LIMIT) return shuffled(list);
  const base = shuffled(list);                     // 同点のときの並びも毎回変える
  const scored = base.map(function (q, idx) {
    const h = histOf(q);
    let s;
    if (!h) s = 0;
    else if (h.last === 0) s = 1;
    else s = 2 + (h.ok / h.n);
    return { q: q, s: s, idx: idx };
  });
  // 同じ優先度（未回答どうし等）なら、出題実績のある論点から拾う
  scored.sort(function (a, b) { return a.s - b.s || whyOf(b.q).rank - whyOf(a.q).rank || a.idx - b.idx; });
  return shuffled(scored.slice(0, LIMIT).map(function (x) { return x.q; }));
}
function rebuild() {
  const picked = pickQuestions(baseList());
  if (!picked.length) return false;
  Q.length = 0; picked.forEach(function (q) { Q.push(q); });
  i = 0; correct = 0; log.length = 0; answers.length = 0;

/* ---------- 学習診断 ---------- */
/* 本試験での年間出題数の目安（令和4〜7年度140問の分類を35問/年に換算） */
const EXAM_WEIGHT = {
  "測定・分析": 11.5, "自然環境": 5.0, "生物多様性": 2.0, "法令・制度": 6.0,
  "地球環境": 4.0, "国際": 1.75, "統計": 1.5, "大気・水質": 1.5,
  "一般廃棄物": 0.75, "産業廃棄物": 0.75, "循環経済": 0.75, "化学物質": 1.5,
};
/* ---------- 覚える理由：過去問の出題実績から自動で付ける ---------- */
/* 「頻出」は出題年が2年以上ある論点だけ。同じ年に2問出ただけのものは数えない */
function yearsOf(t) {
  const s = {};
  t.cites.forEach(function (c) { s[c.split("-")[0]] = 1; });
  return Object.keys(s).length;
}
const TOPIC_BY_CITE = {};
TOPICS.forEach(function (t) {
  if (yearsOf(t) < 2) return;
  t.cites.forEach(function (c) {
    if (!TOPIC_BY_CITE[c] || yearsOf(TOPIC_BY_CITE[c]) < yearsOf(t)) TOPIC_BY_CITE[c] = t;
  });
});
// 白書・統計の数値問題は解説に過去問番号を持たないので、分野名で毎年出る廃棄物テーマに結びつける
const WASTE_TOPIC = {};
TOPICS.forEach(function (t) {
  if (t.t === "一般廃棄物の排出及び処理状況等") WASTE_TOPIC["一般廃棄物"] = t;
  if (t.t === "産業廃棄物の排出及び処理状況等") WASTE_TOPIC["産業廃棄物"] = t;
});
const WHY_CACHE = new Map();
function whyOf(q) {
  if (WHY_CACHE.has(q)) return WHY_CACHE.get(q);
  const cs = ((q.n || "") + " " + (q.h || "")).match(/R[1-7]-Ⅲ-\d+/g) || [];
  let t = null;
  cs.forEach(function (c) {
    const x = TOPIC_BY_CITE[c];
    if (x && (!t || yearsOf(x) > yearsOf(t))) t = x;
  });
  if (!t && QUIZ_DATA.indexOf(q) >= 0 && WASTE_TOPIC[q.f]) t = WASTE_TOPIC[q.f];
  // rank：出題の確かさで並べる順（頻出3回以上 > 2回 > 1回出た > 今年の予想 > 実績なし）
  let w;
  if (t) {
    const y = yearsOf(t);
    w = { tier: y >= 3 ? 3 : 2, rank: y >= 3 ? 5 : 4, years: y, topic: t, same: t.flag === "選択肢が同一", label: "過去7年で" + y + "回出題" };
  } else if (cs.length) {
    const uniq = cs.filter(function (c, k) { return cs.indexOf(c) === k; });
    w = { tier: 0, rank: 3, once: uniq, label: "" };
  } else if (q.f === "今年の注意事項") {
    w = { tier: 1, rank: 2, label: "今年の新論点（出題実績なし・予想）" };
  } else {
    w = { tier: 0, rank: 1, label: "" };
  }
  WHY_CACHE.set(q, w);
  return w;
}
function whyChips(w) {
  let s = "";
  if (w.tier >= 2) s += '<span class="why t' + w.tier + '">★ ' + w.label + '</span>';
  if (w.same) s += '<span class="why same">選択肢まで同じ再出題</span>';
  if (w.tier === 1) s += '<span class="why t1">' + w.label + '</span>';
  return s ? '<div class="whys">' + s + '</div>' : "";
}
function whyBox(q, w) {
  let body;
  if (w.tier >= 2) {
    body = '過去7年で<b>' + w.years + '回</b>出題（' + w.topic.cites.join("・") + '）。' +
      (w.same ? '過去問では、<b>同じ内容の選択肢が並び順だけ変えて繰り返し出ています</b>。' : '') + w.topic.note;
  } else if (w.tier === 1) {
    // 予想の根拠が問題ごとに違うものは、データ側の y に理由を書く
    body = q.y || '令和8年版白書で新しく出た数値・論点です。過去問での出題実績はなく、出るかどうかは<b>予想</b>です。頻出論点より優先度を下げて構いません。';
  } else {
    const head = w.once
      ? '過去問で<b>1回</b>出題（' + w.once.join("・") + '）。同じ論点が繰り返し出た記録はまだありません。'
      : 'この論点そのものの出題実績は確認できていません。';
    const wt = EXAM_WEIGHT[q.f];
    body = head + (q.f === "測定・分析"
      ? 'ただし<b>測定・分析は年11〜12問出る最大の分野</b>です。分野ごと捨てると、残りの問題から約57%を当てる必要が出ます。'
      : (wt ? q.f + 'の分野全体では年' + wt + '問前後出ます。' : '') + '頻出論点を優先し、余力で押さえる問題です。');
  }
  return '<div class="whybox t' + (w.tier >= 2 ? 3 : w.tier) + '"><span class="wh">' +
    (w.tier >= 2 ? '★ 絶対に覚える理由' : w.tier === 1 ? '覚える理由（予想）' : 'この問題の位置づけ') + '</span>' + body + '</div>';
}

function fieldStats() {
  const m = {};
  SETS.all.forEach(function (q) {
    const h = histOf(q);
    if (!m[q.f]) m[q.f] = { n: 0, ok: 0, q: 0, done: 0 };
    m[q.f].q++;
    if (h) { m[q.f].n += h.n; m[q.f].ok += h.ok; m[q.f].done++; }
  });
  return Object.keys(m).map(function (f) {
    const d = m[f];
    const rate = d.n ? d.ok / d.n : null;
    const w = EXAM_WEIGHT[f] || 1;
    return { f: f, rate: rate, n: d.n, done: d.done, total: d.q, weight: w,
             loss: (rate === null || w === 0) ? null : w * (1 - rate) };
  }).sort(function (a, b) {
    if (a.loss === null && b.loss === null) return b.weight - a.weight;
    if (a.loss === null) return 1;
    if (b.loss === null) return -1;
    return b.loss - a.loss;
  });
}
function renderDiagnosis() {
  const fs = fieldStats();
  const scored = fs.filter(function (r) { return r.loss !== null; });
  if (!scored.length) {
    return '<div class="diag"><h3>学習診断</h3><p class="note2">何問か解くと、分野ごとの正答率から「本番で何問落とす計算になるか」を出します。</p></div>';
  }
  let rows = "";
  fs.forEach(function (r, idx) {
    const cls = r.loss === null ? "p3" : (idx === 0 ? "p1" : idx <= 2 ? "p2" : "p3");
    rows += '<div class="drow ' + cls + '">' +
      '<div class="dn">' + r.f + '</div>' +
      '<div class="dv">' + (r.rate === null ? '未着手' : Math.round(r.rate * 100) + '%') + '</div>' +
      '<div class="dloss">' + (r.loss === null ? '—' : '▲' + r.loss.toFixed(1)) + '</div>' +
      '<div class="dsub">' + (r.weight ? '本試験で年 ' + r.weight + '問前後' : '専門科目とは別の科目') + ' ／ 収録 ' + r.total + '問中 ' + r.done + '問に解答' +
        (r.n ? '（延べ' + r.n + '回）' : '') + '</div>' +
    '</div>';
  });
  const top = scored.slice(0, 3);
  const totalLoss = scored.reduce(function (a, r) { return a + r.loss; }, 0);
  let rx = '<div class="rx"><b>いまの正答率のままなら、本試験35問中およそ ' + totalLoss.toFixed(1) +
    '問を落とす計算</b>（25問選択・13問正解で合格）。効く順に並べるとこうなります。<ol>';
  top.forEach(function (r) {
    rx += '<li><b>' + r.f + '</b>（正答率' + Math.round(r.rate * 100) + '%・年' + r.weight + '問）— ' +
      (r.rate < 0.5 ? '基礎から。用語の定義と数値をまず1周' :
       r.rate < 0.75 ? '取りこぼしを潰す段階。間違えた問題だけ回す' :
       '仕上がりつつある。維持で十分') + '</li>';
  });
  rx += '</ol></div>';
  return '<div class="diag"><h3>学習診断</h3>' +
    '<p class="note2">▲は「本試験でその分野から落とす問題数の見込み」＝ 年間出題数 ×（1 − 正答率）。出題が多い分野ほど、同じ正答率でも損失が大きくなります。</p>' +
    rows + rx +
    '<div class="exp"><button class="btn ghost" id="copyDiag">診断結果をコピー</button>' +
    '<span class="msg" id="copyMsg"></span></div></div>';
}
function diagnosisText() {
  const fs = fieldStats(), L = lifetimeStats();
  let t = "【技術士一次試験 環境部門 学習状況】\n";
  t += "累計 " + L.answers + "回解答／正答率 " + (L.answers ? Math.round(L.correct / L.answers * 100) : 0) + "%／苦手 " + weakList().length + "問\n\n";
  t += "分野別（正答率 / 本試験の年間出題数 / 落とす見込み）\n";
  fs.forEach(function (r) {

      " / 年" + r.weight + "問 / " + (r.loss === null ? "—" : "▲" + r.loss.toFixed(1)) +
      "（収録" + r.total + "問中" + r.done + "問に解答）\n";
  });

function exportStudyData() {
  const nh = Object.keys(HIST).length, nn = Object.keys(NOTES).length;
  if (!nh && !nn) return null;
  const d = { app: "gijutsushi-quiz", kind: "study-data", v: 1,

  const t = new Date();

  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(d)], { type: "application/json" }));
  a.download = "gijutsushi-study-" + t.getFullYear() + pad(t.getMonth() + 1) + pad(t.getDate()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
  return { h: nh, n: nn };
}
function mergeStudyData(d) {
  if (!d || d.app !== "gijutsushi-quiz" || d.kind !== "study-data" ||
      !d.history || typeof d.history !== "object" || !d.notes || typeof d.notes !== "object") {
    return { err: "このアプリの学習データのファイルではありません" };
  }
  let h = 0, n = 0;
  Object.keys(d.history).forEach(function (k) {
    const r = d.history[k];
    if (!r || typeof r.n !== "number" || typeof r.ok !== "number" || r.n < 1 || r.ok < 0 || r.ok > r.n) return;
    const cur = HIST[k];
    // 合算すると同じファイルを2回読んだとき回数が倍になるので、解答回数の多い方を残す
    if (!cur || r.n > cur.n) {
      HIST[k] = { n: r.n, ok: r.ok, last: (r.last === 0 || r.last === 1) ? r.last : null };
      if (typeof r.st === "number" && r.st >= 0) HIST[k].st = r.st;
      if (typeof r.ts === "number") HIST[k].ts = r.ts;
      if (typeof r.due === "number") HIST[k].due = r.due;
      h++;
    }
  });
  Object.keys(d.notes).forEach(function (k) {
    const r = d.notes[k];
    if (!r || typeof r !== "object") return;
    const memo = typeof r.memo === "string" ? r.memo : "";
    const bm = r.bm === true;
    if (!memo && !bm) return;
    const t = typeof r.t === "number" ? r.t : 0;
    const cur = NOTES[k];
    if (!cur || t > (cur.t || 0)) { NOTES[k] = { bm: bm, memo: memo, t: t || Date.now() }; n++; }
  });
  saveHist(); saveNotes();
  migrateSR();   // 復習日を持たない古い形式のファイルにも復習日を付ける
  // 受験日はこの端末が既定日のままのときだけ取り込む（すでに変更済みの設定を上書きしないため）
  let examTaken = false;
  if (typeof d.examDay === "string" && ymd(EXAM_DAY) === ymd(EXAM_DAY_DEFAULT) && setExamDay(d.examDay)) {
    examTaken = true;
  }
  return { h: h, n: n, e: examTaken };
}

let HFILTER = "miss";
function renderHistory() {
  const p = document.getElementById("pane-hist");
  const all = SETS.all;

  const answered = all.filter(function (q) { return histOf(q); });
  const weak = weakList();

  let list = all.map(function (q) { return { q: q, h: histOf(q) }; });
  if (HFILTER === "miss") list = list.filter(function (r) { return r.h && (r.h.last === 0 || r.h.ok / r.h.n < 0.6); });
  else if (HFILTER === "none") list = list.filter(function (r) { return !r.h; });
  else if (HFILTER === "bm") list = list.filter(function (r) { return isBookmarked(r.q); });
  else if (HFILTER === "memo") list = list.filter(function (r) { return !!memoOf(r.q); });
  const nBm = all.filter(isBookmarked).length;
  const nMemo = all.filter(function (q) { return !!memoOf(q); }).length;
  // 正答率が低い順、未回答は末尾
  list.sort(function (a, b) {

      '<button class="flt" data-f="all" aria-pressed="' + (HFILTER === "all") + '">すべて</button>' +
      '<button class="flt" data-f="none" aria-pressed="' + (HFILTER === "none") + '">未回答</button>' +
      '<button class="flt" data-f="bm" aria-pressed="' + (HFILTER === "bm") + '">★ ブックマーク ' + nBm + '</button>' +
      '<button class="flt" data-f="memo" aria-pressed="' + (HFILTER === "memo") + '">メモあり ' + nMemo + '</button>' +
    '</div>' +
    (list.length
      ? '<div class="hact"><button class="btn" id="solveThese">この ' + list.length + '問を解く</button>' +
        (L.answers ? '<button class="reset" id="resetHist2">履歴をリセット</button>' : '') + '</div>' + rows
      : '<p class="empty">' + (HFILTER === "miss"
          ? "間違えた問題はありません。まだ解いていない場合は「未回答」から始めてください。"
          : HFILTER === "none" ? "すべての問題に一度は解答済みです。"
          : HFILTER === "bm" ? "ブックマークした問題はありません。クイズ画面で問題の右上の「☆ ブックマーク」を押すと、ここに集まります。"
          : HFILTER === "memo" ? "メモを書いた問題はありません。クイズ画面で問題の右上の「メモ」から書けます。"
          : "履歴がありません。") + '</p>')
    + renderDiagnosis() + renderBackup() + renderDataManager();

  // 問題文・メモは利用者の入力を含むので textContent で入れる
  p.querySelectorAll(".hrow").forEach(function (row, idx) {
    const r = list[idx];
    if (!r) return;
    row.querySelector(".hq").textContent = r.q.q;
    const m = memoOf(r.q);
    if (m) {
      const d = document.createElement("div");
      d.className = "hmemo";
      d.textContent = m;
      row.appendChild(d);
    }
  });

  p.querySelectorAll(".flt").forEach(function (b) {
    b.addEventListener("click", function () { HFILTER = b.dataset.f; renderHistory(); });
  });
  const st = p.querySelector("#solveThese");
  if (st) st.addEventListener("click", function () {
    CUSTOM_LIST = list.map(function (r) { return r.q; });
    CURRENT_SET = "custom";
    document.querySelectorAll(".set").forEach(function (o) { o.setAttribute("aria-pressed", "false"); });
    selectTab("quiz");
    rebuild();
  });
  wireBackup(p);
  wireDataManager(p);
  const cd = p.querySelector("#copyDiag");
  if (cd) cd.addEventListener("click", function () {
    const txt = diagnosisText();
    const msg = p.querySelector("#copyMsg");
    function done() { msg.textContent = "コピーしました。Claudeに貼れます"; setTimeout(function () { msg.textContent = ""; }, 4000); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      const ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { msg.textContent = "コピーできませんでした"; }
      document.body.removeChild(ta);
    }
  });
  const rh2 = p.querySelector("#resetHist2");
  if (rh2) rh2.addEventListener("click", function () {
    if (!confirm("これまでの解答履歴をすべて削除します。よろしいですか。")) return;
    HIST = {}; saveHist(); refreshWeakBtn(); renderHistory();
  });
}

/* ---------- 頻出テーマ ---------- */
const YEARS = ["R1","R2","R3","R4","R5","R6","R7"];
function renderTopics() {
  const p = document.getElementById("pane-topics");
  if (p.dataset.done) return;

  let stats = '<div class="scroll"><table class="stats"><thead><tr><th>出典・分野</th>' +
    YEARS.map(y => '<th>' + y + '</th>').join('') + '<th>7年計</th><th>比率</th></tr></thead><tbody>';
  FIELD_STATS.forEach(f => {
    const hi = (f.name === "環境測定・分析" || f.name === "白書・環境省統計") ? ' class="hi"' : '';
    stats += '<tr' + hi + '><td><span class="nm">' + f.name + '</span><span class="sb">' + f.sub + '</span></td>' +
      f.y.map(v => '<td>' + v + '</td>').join('') +
      '<td><b>' + f.total + '</b></td><td>' + Math.round(f.total / 245 * 100) + '%</td></tr>';
  });
  stats += '</tbody></table></div>';

  let list = '';
  TOPICS.forEach(t => {
    list += '<div class="topic">' +
      '<div class="cnt">' + t.n + '<small>回</small></div>' +
      '<div class="ti">' + t.t + '</div>' +
      '<div class="meta"><span class="f">' + t.f + '</span>　' + t.cites.join('・') +
      (t.flag ? '　<span class="flag">' + t.flag + '</span>' : '') + '</div>' +
      '<div class="nt">' + t.note + '</div>' +
    '</div>';
  });

  p.innerHTML =
    '<p class="lede">令和元年度（再試験）〜7年度の環境部門・専門科目 <b>245問（35問×7年）</b>を1問ずつ分類した結果です。' +
    '問題文は転載していません。番号は<a href="https://www.engineer.or.jp/c_categories/index02021.html" target="_blank" rel="noopener">日本技術士会の公開過去問</a>を参照してください。</p>' +
    stats +
    '<p class="lede"><b>合格ラインは35問中25問を選んで13問正解（50%）。</b>捨てられるのは10問だけなので、' +
    '最大ブロックの環境測定・分析を丸ごと捨てると残り23問から13問＝56.5%が必要になり、一気に苦しくなります。</p>' +
    '<h2 style="font-family:\'Hiragino Mincho ProN\',\'Yu Mincho\',serif;font-size:1.05rem;margin:1.6rem 0 .2rem">7年で2回以上出たテーマ</h2>' +
    '<p class="lede" style="margin-top:.2rem">★印は<b>選択肢まで同一で再出題</b>されたもの。順序が入れ替わるだけなので、選択肢単位で覚えると確実に取れます。</p>' +
    list +
    '<div class="foot">分類の対象：技術士第一次試験 専門科目【19】環境部門 令和元年度（再試験）〜7年度（公益社団法人 日本技術士会 公開過去問）。' +
    '正答は同会公開の正答表から機械的に取得。本ページは問題文・選択肢を転載せず、分類結果と論点の要約のみを掲載しています。</div>';
  p.dataset.done = "1";
}

/* ---------- タブ ---------- */
const PANES = { quiz: "pane-quiz", topics: "pane-topics", hist: "pane-hist" };
const TABS  = { quiz: "tab-quiz",  topics: "tab-topics",  hist: "tab-hist"  };
function selectTab(which) {
  Object.keys(PANES).forEach(function (k) {
    document.getElementById(PANES[k]).hidden = (k !== which);
    document.getElementById(TABS[k]).setAttribute("aria-selected", String(k === which));
  });
  if (which === "topics") renderTopics();
  if (which === "hist") renderHistory();
  window.scrollTo({ top: 0, behavior: "instant" });
}
Object.keys(TABS).forEach(function (k) {
  document.getElementById(TABS[k]).addEventListener("click", function () {
    if (k === "quiz" && !document.getElementById("pane-quiz").hidden && !AT_HOME) { goHome(); return; }
    selectTab(k);
  });
});

refreshImportedSet();
renderCountdown();
updateUnvUI();
refreshWeakBtn();
(function boot() {
  if (!STORAGE_OK) {
    document.getElementById("resumeHost").innerHTML =
      '<div class="nostore"><b>この端末では学習履歴を保存できません。</b>' +
      'プライベートブラウズを使っている場合は通常のウィンドウで開いてください。' +
      '履歴・進捗ともにページを閉じると消えます。</div>';
  }
  const sv = loadSession();
  if (sv) {
    CURRENT_SET = sv.set;
    LIMIT = sv.limit;
    document.querySelectorAll(".lim").forEach(function (o) {
      o.setAttribute("aria-pressed", String(Number(o.dataset.lim) === LIMIT));
    });
    Q.length = 0; sv.list.forEach(function (q) { Q.push(q); });
    i = sv.i; correct = sv.correct;
    answers.length = 0; sv.answers.forEach(function (a, idx) { answers[idx] = a; });
    if (SETS[sv.set] || sv.set === "weak" || sv.set === "bm" || sv.set === "auto") applySetButtons(sv.set); else applySetButtons("__none__");
    updatePickInfo();
    showResume(sv.i, Q.length);
    render();
  } else {
    Q.length = 0;   // 初期値のまま「続きから」が出ないように
    goHome();       // 解きかけの回がないときは、道のりと出題範囲を選ぶ画面から始める
  }
})();
</script>
