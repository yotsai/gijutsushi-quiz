<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="{{DESCRIPTION}}">
<title>{{TITLE}}</title>
</head>
<body>

<style>
{{STYLE}}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">{{EYEBROW}}</p>
    <h1>{{H1}}</h1>
    <p class="intro">{{INTRO}}</p>
    <p class="countdown" id="countdown"></p>
    <p class="ver">{{VER}}</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" id="tab-quiz" role="tab" aria-selected="true" aria-controls="pane-quiz"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h5v-6h3v6h5V10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg><span>ホーム</span><i class="navbadge" id="navBadge" hidden></i></button>
    <button class="tab" id="tab-topics" role="tab" aria-selected="false" aria-controls="pane-topics"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>頻出テーマ</span></button>
    <button class="tab" id="tab-hist" role="tab" aria-selected="false" aria-controls="pane-hist"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>履歴</span></button>
  </div>

  <div class="pane" id="pane-quiz" role="tabpanel" aria-labelledby="tab-quiz">
  <h2 class="home-h" id="setsHead">分野を選んで解く</h2>
  <div class="sets" role="group" aria-label="出題範囲" id="setsBox"></div>

  <div class="limits" role="group" aria-label="出題数">
    <span class="lab">出題数</span>
    <button class="lim" data-lim="10" aria-pressed="false">10問</button>
    <button class="lim" data-lim="20" aria-pressed="false">20問</button>
    <button class="lim" data-lim="0" aria-pressed="true">全問</button>
    <span class="pickinfo" id="pickinfo"></span>
  </div>

  <label class="unvwrap">
    <input type="checkbox" id="incUnv">
    <span>未検証（△）の問題も出題する</span>
    <span class="cnt2" id="unvCnt"></span>
  </label>
  <div class="unvnote" id="unvNote"></div>
  <div id="homeBottom"></div>

  <div class="status">
    <span class="field" id="field">—</span>
    <span id="count">0 / 44</span>
    <span class="score" id="score">正解 <b>0</b></span>
  </div>
  <div class="bar"><i id="bar"></i></div>

  <div id="resumeHost"></div>
  <div id="stage"></div>
  </div>

  <div class="pane" id="pane-topics" role="tabpanel" aria-labelledby="tab-topics" hidden></div>
  <div class="pane" id="pane-hist" role="tabpanel" aria-labelledby="tab-hist" hidden></div>
</div>

{{DATA_SCRIPTS}}
<script>
{{APP}}
</script>

</body>
</html>
