// 環境測定・分析（本試験で年11〜12問＝最大ブロック）の論点集。
// 令和4〜7年度の過去問で実際に問われた内容を独自の設問として再構成。問題文・選択肢は転載していない。
// 各論点の正誤は日本技術士会の公開正答表と突き合わせて確定させている。

const MEASURE_DATA = [
 {f:"測定・分析", q:"二酸化硫黄（SO₂）の測定方法として正しいものは？", h:"大気の汚染に係る環境基準（告示）に定められた測定方法。物質と方法の組合せが頻出です。",
  c:["溶液導電率法または紫外線蛍光法","溶液導電率法または紫外線吸収法","非分散型赤外分析計","ザルツマン試薬を用いる吸光光度法"], a:0, v:"primary",
  n:"SO₂は<b>溶液導電率法／紫外線蛍光法</b>。「紫外線<b>吸収</b>法」とした選択肢が誤りとして出題されました（紫外線吸収法は<b>光化学オキシダント</b>用）。「非分散型赤外分析計」はCO、「ザルツマン試薬を用いる吸光光度法」はNO₂の方法。〔R4-Ⅲ-17〕"},

 {f:"測定・分析", q:"一酸化炭素（CO）の測定に用いる方法は？", h:"上の設問と同じ告示。5物質の測定法をまとめて覚えます。",
  c:["非分散型赤外分析計","β線吸収法","化学発光法","中性ヨウ化カリウム溶液を用いる吸光光度法"], a:0, v:"primary",
  n:"COは<b>非分散型赤外分析計</b>。「β線吸収法」はSPM（浮遊粒子状物質）、「化学発光法」はNO₂、「中性ヨウ化カリウム溶液を用いる吸…」は光化学オキシダント。物質と方法をセットで覚えると1問取れます。〔R4-Ⅲ-17〕"},

 {f:"測定・分析", q:"二酸化窒素（NO₂）の測定方法は？", h:"2つの方法が併記されています。",
  c:["ザルツマン試薬を用いる吸光光度法、またはオゾンを用いる化学発光法","溶液導電率法、または紫外線蛍光法により大気中の濃度を連続的に測定する方式","非分散型赤外分析計","位相差顕微鏡法"], a:0, v:"primary",
  n:"<b>ザルツマン試薬の吸光光度法／オゾンによる化学発光法</b>。なおNO₂・SPMの環境基準達成率は一般局・自排局とも100%です。〔R4-Ⅲ-17〕"},

 {f:"測定・分析", q:"浮遊粒子状物質（SPM）の測定方法に含まれるものは？", h:"PM2.5の標準測定法（ろ過捕集による質量濃度測定）との違いに注意。",
  c:["β線吸収法","紫外線蛍光法","化学発光法","電量法"], a:0, v:"primary",
  n:"標準測定法は<b>ろ過捕集による質量濃度測定方法</b>（10µm以下を分粒する装置つき）で、これと等価と認められる<b>β線吸収法</b>・光散乱法・圧電天びん法も用いられます。β線吸収法では粒径0.3µmの粒子に対し捕集率95%以上のろ紙を用います。〔R4-Ⅲ-17／R6-Ⅲ-20〕"},

 {f:"測定・分析", q:"フレーム原子吸光法の光源として用いるものは？", h:"原子吸光分析には3つの方式（フレーム／電気加熱／還元気化）があります。",
  c:["中空陰極ランプ","重水素ランプ","アルゴンプラズマ","キセノンランプ"], a:0, v:"primary",
  n:"測定元素と同じ元素の<b>中空陰極ランプ</b>。なお選択肢に出てくる「アセチレン－空気フレーム」「アセチレン－一酸化二窒素フレーム」は<b>フレームの燃料ガス</b>であって光源ではありません。重水素ランプはバックグラウンド補正用。〔R7-Ⅲ-17〕<br><br>【2026-08-11 一次資料で確認】中空陰極ランプ（ホロカソードランプ）は内部にNe・Arを封入し、放電で陰極金属をスパッタして<b>測定元素固有の輝線</b>を出します。測定元素ごとにランプを替える必要があります（複合ランプもあり）。<b>重水素ランプは連続光によるバックグラウンド補正用</b>（補正範囲190〜420nm）で、光源ではありません。"},

 {f:"測定・分析", q:"還元気化原子吸光法で測定する主な元素は？", h:"還元剤で金属蒸気を発生させ、加熱せずに吸収セルへ導入する方式。",
  c:["水銀","カドミウム","鉛","クロム"], a:0, v:"answer",
  n:"<b>水銀</b>。常温で蒸気になる性質を利用します。「還元剤の作用で発生したセレンやひ素の金属蒸気を吸収セルに導入する」とした選択肢が誤りとして出題されました（セレン・ひ素は水素化物発生法）。〔R7-Ⅲ-17〕"},

 {f:"測定・分析", q:"ICP発光分光分析のプラズマガスに用いるのは？", h:"イオン化エネルギーとの関係で選ばれています。",
  c:["アルゴン","ヘリウム","窒素","水素"], a:0, v:"answer",
  n:"<b>アルゴン</b>。ヘリウムの方がイオン化エネルギーは高く、「アルゴンの方が高いためプラズマガスに適している」とした選択肢は誤り。また多くの金属元素の分析にはアルゴンプラズマが有利です。〔R5-Ⅲ-20〕"},

 {f:"測定・分析", q:"四重極型ICP質量分析法で注意すべき干渉は？", h:"Cr・As・Cd・Pbなど多元素の同時分析に使われます。",
  c:["他の元素の酸化物や塩化物などの分子イオンによる干渉","中空陰極ランプの発光スペクトルに由来するバックグラウンド干渉","フレーム温度の変動による化学干渉","光路長の違いによる誤差"], a:0, v:"answer",
  n:"<b>分子イオンによる干渉</b>（例：ArCl⁺がAs⁺に重なる）。四重極型は多元素を高速走査でき、Cr・As・Cd・Pbで1 ng/mL以下の装置検出下限を持ちます。〔R6-Ⅲ-16〕"},

 {f:"測定・分析", q:"ランベルト・ベールの法則が成り立つ範囲で、測定対象物質の濃度を2倍にすると？", h:"吸光光度法の基本。何が変わり、何が変わらないか。",
  c:["吸光度が2倍になる","モル吸光係数が2倍になる","透過率が2分の1になる","光源の強度が2倍必要になる"], a:0, v:"answer",
  n:"吸光度A＝εcl なので<b>吸光度が2倍</b>。<b>モル吸光係数εは物質固有の定数で変わりません</b>（「濃度を2倍にするとモル吸光係数が2倍」は誤り）。光路長を2倍にしても吸光度は2倍で、透過率は2分の1にはなりません（対数関係のため）。〔R6-Ⅲ-17〕"},

 {f:"測定・分析", q:"ガスクロマトグラフで硫黄化合物（硫化水素・メチルメルカプタン等）に用いる検出器は？", h:"検出器と対象物質の組合せは毎年のように問われます。",
  c:["炎光光度検出器（FPD）","水素炎イオン化検出器（FID）","電子捕獲検出器（ECD）","熱伝導度検出器（TCD）"], a:0, v:"answer",
  n:"<b>FPD</b>（硫黄・りん化合物）。FIDは炭化水素全般、ECDはハロゲン化合物（PCB等）、アルカリ熱イオン化検出器（FTD）はトリメチルアミン等の含窒素化合物。〔R5-Ⅲ-16／R7-Ⅲ-15〕"},

 {f:"測定・分析", q:"ガスクロマトグラフの電子捕獲検出器（ECD）で測定するのに適した物質は？", h:"水質環境基準項目の測定方法として出ます。",
  c:["PCB","メタン","アンモニア","糖類"], a:0, v:"answer",
  n:"<b>PCB</b>など<b>ハロゲン化合物</b>。放射性同位元素からのβ線で生成した自由電子が、分析対象物質と再結合する現象を利用します。〔R4-Ⅲ-15〕"},

 {f:"測定・分析", q:"ダイオキシン類の測定（JIS K 0311 / K 0312）で求められる質量分析計の分解能は？", h:"排ガス用がK 0311、工業用水・排水用がK 0312。",
  c:["10,000以上","1,000以上","100,000以上","500以上"], a:0, v:"answer",
  n:"<b>質量分解能10,000以上</b>。これを満たせば二重収束形以外の方式でも可。二重収束形高分解能GC/MS以外による分析も、令和4年3月改定のマニュアルで記載が追加されています。〔R4-Ⅲ-14／R6-Ⅲ-22〕"},

 {f:"測定・分析", q:"分析精度管理における「内標準物質」を添加するタイミングは？", h:"★サロゲート物質との違いが、選択肢ごとほぼ同一で再出題されています。",
  c:["装置で測定する直前の試験液に添加する","試料採取または前処理の段階で添加する","測定が終わった後に添加する","標準液にのみ添加する"], a:0, v:"answer",
  n:"内標準物質は<b>装置測定の直前</b>に加え、試料注入誤差や装置変動を補正します。一方<b>サロゲート物質は試料採取または前処理段階</b>で添加し、添加位置以降すべての分析操作の変動を補正します。この2つの取り違えが狙われます。〔R4-Ⅲ-13／R7-Ⅲ-21／R5-Ⅲ-24〕"},

 {f:"測定・分析", q:"「二重測定」とは何をすることか？", h:"精度管理用語。添加回収率試験・操作ブランクとセットで問われます。",
  c:["同一条件で採取した2つ以上の試料を、同じように分析する","同じ試料を2回続けて装置に注入し、機器の再現性を確認する","2種類の分析法で同じ試料を測る","2人の分析者が別々に測る"], a:0, v:"answer",
  n:"<b>同一条件で採取した2つ以上の試料</b>を同様に分析し、試料採取・前処理・装置分析を通した総合的な信頼性を確認します。同一試験液の反復注入ではない点が要点。〔R4-Ⅲ-13／R7-Ⅲ-21〕"},

 {f:"測定・分析", q:"JIS Z 8103（計測用語）における「誤差」の定義は？", h:"誤差・かたより・真度・精密さ・不確かさの区別。",
  c:["測定値から真値を引いた値","測定値の母平均から真値を引いた値","繰り返し測定による測定値のばらつきの程度","測定値に付随する、合理的に測定対象量に結び付けられる値の広がり"], a:0, v:"primary",
  n:"<b>誤差＝測定値−真値</b>。「測定値の母平均から真値を引いた値」は<b>かたより</b>、「繰り返し測定による測定値のばらつ…」は<b>精密さ（精度）</b>、「測定値に付随する、合理的に測定対…」は<b>不確かさ</b>。「真度」は多数の測定結果の平均と真値との一致の度合いで、単一の測定値についての概念ではありません。〔R6-Ⅲ-23〕"},

 {f:"測定・分析", q:"振動レベル計（JIS C 1510）の使用周波数範囲は？", h:"騒音計の周波数範囲と取り違えないこと。",
  c:["1〜80Hz","20〜20,000Hz","100〜1,000Hz","0.1〜10Hz"], a:0, v:"primary",
  n:"振動レベル計は<b>1〜80Hz</b>。「20〜20,000Hz」は<b>騒音計</b>の範囲で、これを充てた選択肢が誤りとして出題されました。使用温度範囲は−10〜+50℃、基準の振動加速度は10⁻⁵ m/s²。〔R4-Ⅲ-18〕"},

 {f:"測定・分析", q:"「低周波音問題対応の手引書」における測定周波数範囲は？", h:"超低周波音との区別も問われます。",
  c:["1〜80Hz","100〜1,000Hz","20〜20,000Hz","0.1〜1Hz"], a:0, v:"primary",
  n:"手引書の測定周波数範囲は<b>1〜80Hz</b>（1/3オクターブバンド）。「100Hz〜1,000Hz」とした選択肢が誤りとして出題されました。なお<b>低周波音の定義は100Hz以下</b>の空気振動で、うち<b>20Hz以下が超低周波音</b>。測定周波数範囲と用語の定義は別物なので混同しないこと。適用範囲は固定発生源による<b>物的苦情および心身に係る苦情</b>の両方です。〔R7-Ⅲ-13〕"},

 {f:"測定・分析", q:"騒音レベルの定義は？", h:"JIS Z 8731。等価騒音レベルの定義とあわせて。",
  c:["A特性音圧の2乗の常用対数の10倍","A特性音圧の常用対数の10倍で表され、単位はデシベルである","音圧の絶対値の自然対数","1時間あたりの音圧の積分値"], a:0, v:"answer",
  n:"<b>A特性音圧の2乗の常用対数の10倍</b>。等価騒音レベルは「変動する騒音のエネルギー的な<b>平均</b>」で、「積分値」とした選択肢は誤り。背景騒音は特定騒音がないときの騒音を指します。〔R4-Ⅲ-19／R5-Ⅲ-15〕"},

 {f:"測定・分析", q:"CODの測定で用いる反応試薬は？（日本の公定法）", h:"BODとの違い、国際的なCODcrとの違いに注意。",
  c:["過マンガン酸カリウム","二クロム酸カリウム","しゅう酸カリウム","塩素酸カリウム"], a:0, v:"answer",
  n:"日本の公定法（CODMn）は<b>過マンガン酸カリウム</b>。試料に加えて沸騰水浴中で30分反応させ、消費量を酸素量に換算します。BODは20℃・5日間の生物化学的酸素消費量で、原理が異なります。〔R6-Ⅲ-12〕"},

 {f:"測定・分析", q:"浮遊物質量（SS）の測定で、ろ過材ごと乾燥させる温度は？", h:"水質汚濁に係る環境基準項目の分析方法。",
  c:["105〜110℃","60〜70℃","250〜300℃","550〜600℃"], a:0, v:"answer",
  n:"<b>105〜110℃</b>で乾燥し、あらかじめ測定したろ過材の質量を差し引いて求めます。550〜600℃は強熱減量（灰化）の温度で、混同させる作りが出ます。〔R5-Ⅲ-13〕"},

 {f:"測定・分析", q:"底質調査における試料採取器として用いるのは？", h:"「底質調査方法」（環境省 水・大気環境局）。",
  c:["エクマンバージ型採泥器","ロウボリウムエアサンプラ","メンブランフィルター","黒鉛炉"], a:0, v:"answer",
  n:"<b>エクマンバージ型採泥器</b>（またはこれに準ずるもの）で、原則底質表面から10cm程度を3回以上採取して混合します。「ロウボリウムエアサンプラ」は大気の浮遊粒子状物質、「メンブランフィルター」は大腸菌数などの捕集材。〔R6-Ⅲ-21〕"},

 {f:"測定・分析", q:"大腸菌数の測定で、ろ過したメンブランフィルターを培地に置くときの向きは？", h:"令和7年4月に大腸菌群数から大腸菌数へ改正された項目。",
  c:["ろ過面を上にして、気泡ができないように密着させる","ろ過面を下にして、気泡ができないように密着させる","向きは問わない","ろ過面を下にして、わずかに浮かせる"], a:0, v:"primary",
  n:"「ろ過面を<b>下</b>にして」とした選択肢が誤りであることは正答表から確定しています。一般的なメンブランフィルター法では<b>菌を捕集した面を上</b>にして培地に密着させます。検水量は100mLで、コロニー数が100を超えると予想される場合は希釈します。〔R4-Ⅲ-20〕<br><br>【2026-08-11 補足】メンブランフィルター法では直径47mm・孔径0.45µmの滅菌フィルターを使用。試料は0〜5℃の暗所で保存し、<b>9時間以内が望ましく12時間以内に試験</b>。なお「ろ過面を下にして」が誤りであることは正答表から確定していますが、向きそのものを明記した公定法の原文は未確認です。"},

 {f:"測定・分析", q:"アスベストの環境大気中の繊維数濃度測定で、試料採取を避けるべき条件は？", h:"「アスベストモニタリングマニュアル（第4.2版）」。",
  c:["強風時や降雨時","気温が20℃を下回るとき","日中の時間帯","湿度が50%を超えるとき"], a:0, v:"answer",
  n:"<b>強風・降雨時は避ける</b>。「実施しても差し支えない」とした選択肢が誤りとして出題されました。判別には位相差顕微鏡法と電子顕微鏡法があり、位相差顕微鏡だけでは繊維状物質がアスベストかを確定できません。〔R4-Ⅲ-23〕"},

 {f:"測定・分析", q:"イオンクロマトグラフのサプレッサーの役割は？", h:"PM2.5成分測定マニュアルでイオン成分の分析に使われます。",
  c:["溶離液のバックグラウンド電気伝導度を下げ、検出感度を高める","分析対象イオンを樹脂上に一時的に濃縮し、ピーク強度を高める","カラム温度を一定に保つ","試料中の有機物を分解する"], a:0, v:"primary",
  n:"<b>バックグラウンドを下げて感度を上げる</b>のがサプレッサー。アニオン分析では溶離液の陽イオンをH⁺に交換します（「分析対象の陰イオンを水酸化物イオンに交換する」とした選択肢は誤り）。抽出液には超純水を用い、超音波抽出します。〔R6-Ⅲ-18〕<br><br>【2026-08-11 一次資料で確認】サプレッサーは<b>溶離液成分を中和してバックグラウンド電気伝導度を下げ、同時に測定対象を当量伝導度の高いイオンに変換</b>します。バックグラウンド低減とピーク応答の増大の両方で感度が上がります。"},

 {f:"測定・分析", q:"VOCsを固体吸着－加熱脱着－GC/MSで測定するとき、破過（ブレイクスルー）が起きる原因は？", h:"捕集管の容量を超えると対象成分が抜けてしまう現象。",
  c:["物質の性状・捕集量・吸着剤の充てん量や特性","カラムオーブンの昇温速度の設定が不適切であること","検出器の感度設定","キャリアガスの純度"], a:0, v:"answer",
  n:"<b>物質の性状、捕集量、吸着剤の充てん量や特性</b>により破過が生じます。捕集管は十分な洗浄を行えば再利用可能。なお「溶媒ピークと重なる物質は測定できない」とした選択肢は誤りで、条件を変えれば測定できます。〔R7-Ⅲ-22〕"},

 {f:"測定・分析", q:"水質環境基準項目のうち、測定に高速液体クロマトグラフ法（HPLC）を用いるのは？", h:"項目と公定法の組合せ。4年で3回出ています。",
  c:["チウラム","アルキル水銀","1,4-ジオキサン","シマジン"], a:0, v:"answer",
  n:"<b>チウラム</b>。アルキル水銀はガスクロマトグラフ（ECD）、1,4-ジオキサンはパージ・トラップGC/MSまたは固相抽出GC/MS、シマジン・チオベンカルブはGC/MSまたはHPLC。チウラムがHPLC専用である点が要点。〔R7-Ⅲ-20〕"},

 {f:"測定・分析", q:"河川で水質試料を採水する日として適切なのは？", h:"「水質調査方法」（環水管30号）。河川・湖沼・海域で条件が違います。",
  c:["数日前から比較的晴天が続き、水質が安定している日","降雨の直後で流量が多い日","水質が最も良くなる時刻を含むように、あらかじめ採水時刻を計画した日","大潮期の風雨が強い日"], a:0, v:"answer",
  n:"河川・湖沼は<b>晴天が続いて水質が安定している日</b>。感潮域では水質が最も<b>悪く</b>なる時刻を含むよう採水時刻を決め、海域は大潮期の風雨の影響が少ない日を選びます。なお湖沼は<b>停滞期に深度別の多層採水</b>、循環期は表層でよく、これを逆にした選択肢が誤りとして出題されました。〔R7-Ⅲ-16〕"},

 {f:"測定・分析", q:"排出ガス中の水銀測定で、ガス状水銀の採取に用いる吸収液は？", h:"環境省告示94号（令和4年改正）。",
  c:["過マンガン酸カリウムと硫酸の混合溶液","水酸化ナトリウム溶液","塩化ヒドロキシルアンモニウム溶液","硝酸と過酸化水素の混合液"], a:0, v:"answer",
  n:"<b>過マンガン酸カリウム＋硫酸</b>の混合溶液。吸収瓶は2本以上を直列に連結します。塩化ヒドロキシルアンモニウム溶液は、煮沸処理後に残存する過剰の吸収液試薬を分解するために用いるもので、役割が異なります。〔R7-Ⅲ-19〕"},

 {f:"測定・分析", q:"環境試料の分析で用いる「標準添加法」が有効なのはどんな場合か？", h:"検量線法・内標準法との使い分け。",
  c:["試料中のマトリクスの影響で、検量線の傾きが試料と標準試料で異なる場合","分析対象物質の濃度が定量下限値を下回り、検出下限付近での定量が必要な場合","操作ブランクに一定のゲタがある場合","複数の物質を同時に測定する場合"], a:0, v:"answer",
  n:"<b>マトリクス効果で検量線の傾きがずれる場合</b>に有効です。「操作ブランクの相加誤差は標準添加法で補正できる」とした選択肢が誤りとして出題されました（ゲタの補正はブランク値の差し引きで行う）。〔R5-Ⅲ-24〕"},

 {f:"測定・分析", q:"キレート樹脂を用いた固相抽出法で、水試料を固相に通す前に行う操作は？", h:"環境水中の重金属類の分離濃縮分析。",
  c:["pH緩衝液や水で固相を洗浄（コンディショニング）する","水試料を酸分解処理する","希酸を固相に流下させる","高濃度のカルシウムイオンをあらかじめ添加し、目的金属の吸着効率を高めておく"], a:0, v:"primary",
  n:"通液前に<b>固相をコンディショニング</b>します。「水試料を固相に吸着させる前に酸分解処理を行う」とした選択肢が誤り（酸分解すると吸着が阻害される）。希酸の流下は吸着後の<b>溶出</b>操作。高濃度カルシウムは妨害要因です。〔R5-Ⅲ-19〕<br><br>【2026-08-11 一次資料で確認】操作手順は<b>コンディショニング（メタノール等→2M硝酸→超純水）→試料通液→洗浄→溶出（1M硝酸）</b>。イミノ二酢酸系キレート樹脂は遷移金属を多元素同時に濃縮しつつ、ICP-MSの妨害となるアルカリ・アルカリ土類金属を除去できます。吸着時のpHは<b>4〜6</b>に調整するとほぼ定量的に回収できます。"},
{"f":"測定・分析","q":"JIS K0102（工場排水試験方法）が規定するBOD（生物化学的酸素消費量）の培養条件として、最も適切なものはどれか。","h":"培養槽の温度の許容幅と、培養期間に注目します。","c":["20±1℃に調節した恒温槽の中で、暗所に5日間放置する","35±1℃に調節した恒温槽の中で、暗所に5日間放置する","20±1℃に調節した恒温槽の中で、明所に7日間放置する","4±1℃に調節した恒温槽の中で、暗所に5日間放置する"],"a":0,"v":"primary","n":"<b>20±1℃・暗所で5日間放置</b>してBOD5を測定する（JIS K0102 21）。希釈水の適否は、同一条件で5日間放置した際の溶存酸素の減少が0.2mg/L以下であることで確認する。35℃は下水試験の活性汚泥関連の温度と混同しやすく、BODの培養は常温より低い20℃の区分である。<br><br>【出典】JIS K0102:2019（kikakurui.com掲載本文）。確認日 2026-10-10"},
{"f":"測定・分析","q":"JIS K0102のCODMn（過マンガン酸カリウムによる化学的酸素消費量）測定で規定される反応条件として、最も適切なものはどれか。","h":"COD測定で問われる反応試薬の識別とは別に、今回は反応の温度と時間を問います。","c":["試料に過マンガン酸カリウム溶液を加え、常温の暗所で30分間反応させる","試料に過マンガン酸カリウム溶液を加え、沸騰水浴中で30分間加熱反応させる","試料に過マンガン酸カリウム溶液を加え、沸騰水浴中で2時間かけてゆっくりと加熱反応させる","試料に二クロム酸カリウム溶液を加え、沸騰水浴中で30分間加熱反応させる"],"a":1,"v":"primary","n":"<b>沸騰水浴中で30分間加熱</b>して反応させ、残った過マンガン酸カリウムをしゅう酸ナトリウム溶液で逆滴定して消費量を酸素量に換算する（JIS K0102 17）。常温反応や2時間加熱は実際の条件と異なり、二クロム酸カリウムはCODcr（国際的な指標）の試薬であってJIS K0102の公定法ではない。<br><br>【出典】JIS K0102:2019。確認日 2026-10-10"},
{"f":"測定・分析","q":"JIS K0102のn-ヘキサン抽出物質（油分等）の試験で、抽出後の操作として規定されているものはどれか。","h":"抽出した溶媒を蒸発させて残留物を量る、重量法の手順です。","c":["ヘキサンを氷冷しながら真空濃縮した後、室温で24時間風乾して恒量を得る","ヘキサンをそのまま加熱せず風通しのよい場所で自然蒸発させ、残留物を105〜110℃で2時間かけてじっくり乾燥する","ヘキサンを蒸留フラスコで約80℃に保ちながら留去した後、80±5℃の乾燥器で30分間乾燥して恒量を得る","ヘキサン層を直接ガスクロマトグラフに注入し、重量を測定せずに面積値で定量する"],"a":2,"v":"primary","n":"<b>蒸留フラスコを約80℃に保ちながらヘキサンを留去し、窒素ガスを通気して揮散させたのち、80±5℃の乾燥器で30分間乾燥</b>して残留物の質量を求める重量法（JIS K0102 24）。酸性にした試料をn-ヘキサンで抽出し、エマルションが生じたときは遠心分離（8,000rpm以上・約5分）等で改善する。105〜110℃はSSの乾燥温度で、n-ヘキサン抽出物質の条件とは異なる。<br><br>【出典】JIS K0102:2019。確認日 2026-10-10"},
{"f":"測定・分析","q":"JIS K0102の全窒素・全りんの分析で、ペルオキソ二硫酸カリウムを用いる分解条件として、最も適切なものはどれか。","h":"高圧蒸気滅菌器を使った加圧加熱分解です。","c":["試料に水酸化ナトリウム・ペルオキソ二硫酸カリウム溶液を加え、常圧の沸騰水浴中で十分な時間をかけてじっくりと30分間加熱分解する","試料に塩酸を加え、高圧蒸気滅菌器で約120℃・2時間加熱分解する","試料に過マンガン酸カリウムを加え、常温で24時間静置して分解する","試料に水酸化ナトリウム・ペルオキソ二硫酸カリウム溶液を加え、高圧蒸気滅菌器で約120℃・30分間加熱分解する"],"a":3,"v":"primary","n":"<b>水酸化ナトリウム・ペルオキソ二硫酸カリウム溶液を加え、高圧蒸気滅菌器中で約120℃・30分間加熱分解</b>し、窒素化合物を硝酸イオンに、りん化合物をりん酸イオンに酸化分解してから、それぞれ紫外線吸光光度法・モリブデン青吸光光度法で測定する。常圧の沸騰水浴（100℃前後）では加圧分解の条件に届かない。なお全窒素の紫外線吸光光度法は海水中の臭化物イオン等による妨害を受けるため、海水への適用には注意が必要。<br><br>【出典】JIS K0102:2019、環境省水・大気環境局資料。確認日 2026-10-10"},
{"f":"測定・分析","q":"JIS K0102が規定する溶存酸素（DO）の測定方法として、原理が異なる2つの組合せはどれか。","h":"滴定による化学分析と、電極による直接測定の違いです。","c":["よう素滴定法（ウインクラーアジ化ナトリウム変法）と隔膜電極法","よう素滴定法と、金属元素の定量に用いるフレーム原子吸光法","隔膜電極法と、金属元素の定量に用いるICP発光分光分析法","よう素滴定法と、有機化合物の分離に用いるガスクロマトグラフ法"],"a":0,"v":"primary","n":"<b>よう素滴定法（ウインクラーアジ化ナトリウム変法）</b>は、試料中の溶存酸素を化学的に固定して遊離したヨウ素をチオ硫酸ナトリウムで滴定する方法。<b>隔膜電極法</b>は、酸素透過性の隔膜を通じて拡散した酸素を電極で電気化学的に検出する方法で、現場での連続測定に向く（JIS K0102 32）。原子吸光法・ICP発光分光分析法・ガスクロマトグラフ法はDOの公定法ではない。<br><br>【出典】JIS K0102:2019。確認日 2026-10-10"},
{"f":"測定・分析","q":"JIS K0102の透視度の測定方法として、最も適切なものはどれか。","h":"標識板の模様と、測定範囲の単位（度）に注目します。","c":["試料を遠心分離した後の沈殿物の体積を、試料体積に対する割合（%）でできるだけ精密に表す","透視度計の底に置いた標識板の二重十字が初めて明らかに識別できるときの水層の高さを、10mmを1度として表す","試料に特定波長の光を照射し、散乱光の強度を基準液と比較して相対値（度）で表す","試料をろ過して得たろ紙上の残留物の色の濃淡を、複数の標準色票と並べてできるだけ注意深く目視で比較し等級（度）で表す"],"a":1,"v":"primary","n":"<b>透視度計の底部に置いた標識板（二重十字）が初めて明らかに識別できるときの水層の高さを、10mmを1度として表す</b>（JIS K0102 9）。測定範囲は1〜30度で、下口のゴム管のピンチコックを緩めて水面を下げながら識別点を探し、2〜3回繰り返して平均値を取る。散乱光強度を測る方法は濁度の考え方に近く、透視度の定義ではない。<br><br>【出典】JIS K0102:2019。確認日 2026-10-10"},
{"f":"測定・分析","q":"JIS K0102のpH測定（ガラス電極法）における校正操作として、最も適切なものはどれか。","h":"標準液の種類と、温度補償の操作に注目します。","c":["塩化ナトリウム標準液でガラス電極を校正し、それ以降は温度補償を一切調整せず常に25℃固定のまま測定をそのまま何時間でも続ける運用とする","硫酸銅標準液で比色計を校正し、吸光度からpH値を換算する","中性りん酸塩pH標準液等でガラス電極を校正し、温度補償用ダイヤルを標準液の温度に合わせてpH値が±0.05で一致するまで操作を繰り返す","標準液を使わず、既知のpH7.00を電極の基準点として毎回手入力する"],"a":2,"v":"primary","n":"<b>中性りん酸塩pH標準液・フタル酸塩pH標準液等でガラス電極を校正し、温度補償用ダイヤルを標準液の温度に合わせて、pH値が±0.05で一致するまで操作を繰り返す</b>（JIS K0102 12.1）。塩化ナトリウム標準液や硫酸銅標準液はpH校正に用いる標準液ではない。<br><br>【出典】JIS K0102:2019。確認日 2026-10-10"},
{"f":"測定・分析","q":"JIS K0102の浮遊物質量（SS）試験で使用するろ過材と、その前処理として、最も適切なものはどれか。","h":"試験に使う前に、ろ紙自体の質量を一定にしておく必要があります。","c":["孔径0.45μmのメンブランフィルターを、あらかじめ550〜600℃で1時間かけてじっくりと十分に強熱してから質量を測る","孔径1μmのガラス繊維ろ紙を、水で湿らせたまま質量を測り、乾燥処理は行わない","孔径10μmの金属メッシュを、あらかじめ希硝酸で洗浄してから質量を測る","孔径1μmのガラス繊維ろ紙を、あらかじめ105〜110℃で約1時間加熱し、デシケーター中で放冷してから質量を測る"],"a":3,"v":"primary","n":"<b>孔径1μmのガラス繊維ろ紙</b>を用い、あらかじめ105〜110℃で約1時間加熱してデシケーター中で放冷し、恒量にしてから質量を測定する（前処理）。ろ過後も同じ105〜110℃で2時間加熱して質量差からSSを求める（JIS K0102 14.1）。孔径0.45μmのメンブランフィルターは大腸菌数の捕集に使う別の材質・孔径で、550〜600℃の強熱は強熱減量（灰化）の条件。<br><br>【出典】JIS K0102:2019。確認日 2026-10-10"},
{"f":"測定・分析","q":"JIS K0102の塩化物イオンの硝酸銀滴定法で、現在指示薬として用いられているものはどれか。","h":"かつて広く使われたクロム酸カリウムを用いる方法（モール法）とは別の指示薬です。","c":["ジクロロフルオレセインナトリウム溶液","モール法で指示薬として用いるクロム酸カリウム溶液","中和滴定の指示薬に用いるフェノールフタレイン溶液","よう素滴定の指示薬に用いるでんぷん溶液"],"a":0,"v":"primary","n":"現行のJIS K0102では、<b>ジクロロフルオレセインナトリウム溶液</b>を指示薬として硝酸銀溶液で滴定するファヤンス法が採用されている。クロム酸カリウムを指示薬とする古典的な<b>モール法</b>と混同しやすいが、現行規格の指示薬はこれとは異なる。フェノールフタレインは中和滴定、でんぷん溶液はよう素滴定の指示薬。<br><br>【出典】JIS K 0102:2019 工場排水試験方法 35.1 a) 3)（指示薬：ジクロロフルオレセインナトリウム溶液 2 g/L、デキストリン溶液を併用）https://kikakurui.com/k0/K0102-2019-02.html（確認日 2026-10-10）"},
{"f":"測定・分析","q":"JIS Z8808（排ガス中のダスト濃度の測定方法）が規定する等速吸引の許容範囲として、最も適切なものはどれか。","h":"吸引ノズルの向きのずれと、吸引流速のずれ、両方に許容範囲があります。","c":["ノズルの向きの偏りは45°以下であれば特に問題とされず、吸引流速は常に排ガス流速のおよそ2倍程度に保つように運用する","測定点の排ガスの流れ方向とノズルの向きの偏りは10°以下、吸引流速は排ガス流速に対し相対誤差−5〜+10%以内とする","ノズルは排ガスの流れ方向と直角に向け、吸引流速は排ガス流速の半分で固定する","ノズルの向き・吸引流速のいずれも許容範囲は規定されておらず、作業者の判断に委ねられる"],"a":1,"v":"primary","n":"<b>ノズルの向きの偏りは10°以下、吸引流速は排ガス流速に対し相対誤差−5〜+10%以内</b>に収める必要がある（JIS Z8808 10.4）。等速吸引は、吸引ノズルを排ガスの流れに正対させ、排ガスと同じ流速でガスを吸引することと定義される。ダストは「ばいじん・粉じんなどの固体粒子で、乾燥によって付着水分を除いたもの」と定義される。<br><br>【出典】JIS Z8808:2013。確認日 2026-10-10"},
{"f":"測定・分析","q":"JIS K0104（排ガス中の窒素酸化物分析方法）が規定する分析方法に含まれないものはどれか。","h":"3つの吸光光度法・クロマトグラフ法のほかに、JIS K0104に規定がない方法が1つ混ざっています。","c":["ザルツマン吸光光度法","亜鉛還元ナフチルエチレンジアミン吸光光度法","三点比較式臭袋法","イオンクロマトグラフ法"],"a":2,"v":"primary","n":"JIS K0104には<b>ザルツマン吸光光度法・亜鉛還元ナフチルエチレンジアミン吸光光度法（Zn-NEDA法）・ナフチルエチレンジアミン吸光光度法・イオンクロマトグラフ法・フェノールジスルホン酸吸光光度法</b>などが規定されている。<b>三点比較式臭袋法</b>は悪臭（臭気指数）の測定法で、窒素酸化物の分析法ではない。<br><br>【出典】JIS K0104:2011。確認日 2026-10-10"},
{"f":"測定・分析","q":"JIS K0103（排ガス中の硫黄酸化物分析方法）の沈殿滴定法に関する記述として、最も適切なものはどれか。","h":"試料ガスを過酸化水素溶液に吸収させた後の操作に注目します。","c":["試料ガスを水酸化ナトリウム溶液にゆっくりとていねいに吸収させて亜硫酸イオンとし、よう素溶液で直接滴定する","試料ガスをそのまま冷却凝縮させ、凝縮液の電気伝導率から硫黄酸化物濃度を算出する","試料ガスを活性炭に捕集し、燃焼させて発生したガスをガスクロマトグラフで分析する","試料ガスを過酸化水素溶液に吸収させて硫酸とし、アルセナゾIIIを指示薬として酢酸バリウム溶液で滴定する"],"a":3,"v":"primary","n":"<b>過酸化水素溶液に吸収させて硫酸とし、2-プロパノール・酢酸を加えて、アルセナゾIIIを指示薬に酢酸バリウム溶液で滴定</b>するのが沈殿滴定法（JIS K0103）。ほかにイオンクロマトグラフ法（過酸化水素吸収液を直接クロマトグラフで分析）や比濁法も規定されている。よう素滴定・電気伝導率・ガスクロマトグラフはJIS K0103の硫黄酸化物分析方法として規定されていない。<br><br>【出典】JIS K0103:2011に基づく解説資料。確認日 2026-10-10"},
{"f":"測定・分析","q":"悪臭防止法の臭気指数規制で用いられる三点比較式臭袋法の手順として、最も適切なものはどれか。","h":"3つの袋のうち、においが入っているのは1つだけです。","c":["6人以上のパネルが、無臭の空気を入れた袋2つと試料を希釈した袋1つの計3袋から、においのある袋を当てる操作を希釈倍数を上げながら繰り返す","3人のパネルが、濃度をそれぞれ変えた試料を入れた3つの袋のにおいの強さを順位付けする","1人のパネルが、無臭の袋と試料を希釈した袋を1つずつ交互に何度も慎重に嗅ぎ比べながら、どちらがより強く臭うかをそのつどできるだけ即座に判定する","6人以上のパネルが、試料を希釈せずそのまま嗅ぎ、臭気の種類を言葉で記述する"],"a":0,"v":"primary","n":"<b>無臭の空気を入れた袋2つと、試料を希釈した空気を入れた袋1つの計3袋</b>から、6人以上のパネルがにおいのある袋を嗅ぎ当てる操作を、希釈倍数を上げながら繰り返す。パネルが当てられなくなった時点の希釈倍数（臭気濃度）から臭気指数を算出する。平成7年の悪臭防止法改正で同法に取り入れられた。<br><br>【出典】環境省「臭気指数規制ガイドライン」。確認日 2026-10-10"},
{"f":"測定・分析","q":"ある排出口の臭気濃度（希釈倍数）が1,000であるとき、悪臭防止法上の臭気指数はいくらか。","h":"臭気指数＝10×log₁₀（臭気濃度）で算出します。","c":["1,000","30","100","3"],"a":1,"v":"primary","n":"臭気指数＝10×log₁₀（臭気濃度）＝10×log₁₀(1,000)＝10×3＝<b>30</b>。臭気濃度1,000倍に希釈してようやく無臭になる排出口は、臭気指数30として扱われる。臭気濃度の対数に10を乗じる変換により、桁の大きい希釈倍数を扱いやすい指数に変換している。<br><br>【出典】環境省「臭気指数規制ガイドライン」。確認日 2026-10-10"},
{"f":"測定・分析","q":"悪臭防止法の嗅覚測定法におけるパネル選定基準として、最も適切なものはどれか。","h":"パネルの資格は一度確認したら永久に有効というわけではありません。","c":["色覚検査に合格すれば、嗅覚の検査は免除される","1種類の基準臭だけで合否を判定し、以後は再確認を行わない","5種類の基準臭を用いた判定試験で正常な嗅覚を確認し、5年以内（40歳以上は3年以内）ごとに再確認する","パネルの資格には年齢による違いはなく、検査周期の制限も設けられていないため、一度合格すれば生涯にわたって有効な資格として扱われる"],"a":2,"v":"primary","n":"<b>β-フェニルエチルアルコール等の5種類の基準臭を用いた判定試験で正常な嗅覚を確認</b>し、<b>5年以内（40歳以上は3年以内）ごとに再確認</b>する必要がある。色覚検査とは無関係で、1種類だけの基準臭や終身有効という運用ではない。<br><br>【出典】環境省「嗅覚測定法マニュアル」関連資料。確認日 2026-10-10"},
{"f":"測定・分析","q":"土壌汚染対策法に基づく環境省告示第18号（土壌溶出量調査に係る測定方法）の検液作成条件として、最も適切なものはどれか。","h":"検体と溶媒（水）の重量体積比と、振とうの条件に注目します。","c":["検体と溶媒（1mol/L塩酸）を重量体積比3%でできるだけゆっくりと丁寧に混合しながら、2時間連続してじっくりと振とうする","検体と溶媒（水）を重量体積比50%で混合し、24時間静置する","検体をそのまま溶媒に浸し、振とうせず1週間自然放置する","検体と溶媒（水）を重量体積比10%で混合し、振とう機（毎分約200回、振とう幅4〜5cm）で6時間連続して水平に振とうする"],"a":3,"v":"primary","n":"<b>検体と溶媒（水）を重量体積比10%で混合し、振とう機（毎分約200回、振とう幅4〜5cm）で6時間連続して水平に振とう</b>したのち、10〜30分程度静置・必要に応じ遠心分離して検液を作成する（平成15年環境省告示第18号）。重量体積比3%・2時間振とうは<b>告示19号（含有量調査）</b>の条件で、溶出量調査とは異なる。<br><br>【出典】環境省告示第18号（土壌溶出量調査に係る測定方法を定める件）。確認日 2026-10-10"},
{"f":"測定・分析","q":"土壌汚染対策法に基づく環境省告示第19号（土壌含有量調査に係る測定方法）の検液作成条件として、最も適切なものはどれか。","h":"溶出量調査（告示18号）の条件と比べて、溶媒の種類・比率・振とう時間がすべて異なります。","c":["検体と溶媒（1mol/Lとなるよう塩酸を加えた水）を重量体積比3%で混合し、2時間連続して振とうする","検体と溶媒（純水）を重量体積比10%で混合し、6時間連続して振とうする","検体をそのまま乾式で加熱分解し、振とうは行わない","検体と溶媒（1mol/L水酸化ナトリウム水溶液）を重量体積比10%で混合し、6時間連続してゆっくりと振とうする"],"a":0,"v":"primary","n":"<b>検体6g以上と、純水に塩酸を加え1mol/Lとした溶媒を重量体積比3%で混合し、2時間連続して振とう</b>して検液を作成する（平成15年環境省告示第19号）。経口摂取（直接摂取）のリスクを想定した試験で、重量体積比10%・6時間振とうは<b>告示18号（溶出量調査、溶媒は水）</b>の条件であり、混同しやすい。<br><br>【出典】環境省告示第19号（土壌含有量調査に係る測定方法を定める件）。確認日 2026-10-10"},
{"f":"測定・分析","q":"微小粒子状物質（PM2.5）の自動測定機に求められる性能条件として、最も適切なものはどれか。","h":"自動測定機は標準測定法そのものではなく、標準測定法との関係で評価されます。","c":["標準測定法とは無関係に、装置メーカーが独自に定める基準で校正されていればよい","フィルタ捕集による標準測定法（質量濃度測定方法）と同等もしくは良好な相関を持つ測定値が得られること","測定値が常に標準測定法より高く出ることが条件とされており、低く出る場合は補正係数を掛けて調整する","標準測定法を完全に置き換えるものとされ、今後は標準測定法そのものを常時監視には使用しない運用とする"],"a":1,"v":"primary","n":"PM2.5の自動測定機（β線吸収法・フィルタ振動法等）には、<b>フィルタ捕集による標準測定法（ろ過捕集による質量濃度測定方法）と同等もしくは良好な相関を持つ測定値が得られること</b>が求められる。標準測定法を置き換えるのではなく、これと比較・相関確認した上で常時監視に用いられる。<br><br>【出典】環境省「微小粒子状物質(PM2.5)の測定方法について」（測定法評価検討会資料）。確認日 2026-10-10"},
{"f":"測定・分析","q":"光化学オキシダントの常時監視に用いる紫外線吸収法の測定原理として、最も適切なものはどれか。","h":"オゾンが吸収しやすい、特定の波長の紫外線を利用します。","c":["オゾンが橙色に近いオレンジ色の可視光（波長600nm付近）の光を特に強く吸収する性質を利用して測定する","オゾンに紫外線を照射すると発生する蛍光の強度を測定する","オゾンが紫外線の波長254nm付近に強い吸収帯をもつ性質を利用し、その吸光量からオゾン濃度を算出する","オゾンを白金触媒で分解し、発生した酸素の体積を測定する"],"a":2,"v":"primary","n":"<b>オゾンは紫外線の波長254nm付近に強い吸収帯</b>をもち、この波長以外の紫外線はオゾンにほとんど吸収されない特異性がある。光源に低圧水銀ランプ（254nm）を用い、オゾンによる吸光量をランベルト・ベールの法則に基づいて濃度に換算する。光化学オキシダント濃度は、紫外線吸収法又は化学発光法で得られたオゾン濃度をもって代用してよいとされている。<br><br>【出典】環境省資料・JEMIMA計測器解説。確認日 2026-10-10"},
{"f":"測定・分析","q":"分析における検出下限値（検出限界）と定量下限値の定義として、最も適切なものはどれか。","h":"低濃度の標準溶液を繰り返し分析したときの、ばらつきの大きさがもとになります。","c":["検出下限値は標準偏差の10倍、定量下限値はその3倍に相当する値とする","検出下限値・定量下限値のいずれも、個々の分析機関が独自に定めた社内基準値を装置メーカーのカタログから転記して決める","検出下限値・定量下限値のいずれも、検量線の最高濃度の標準液を1回だけ測定し、装置のソフトウェアが自動的に算出した値をそのまま採用する","検出下限値はブランクまたは低濃度標準液の繰り返し測定による標準偏差の3倍、定量下限値はその10倍の濃度に相当する値とする"],"a":3,"v":"primary","n":"<b>検出下限値（検出限界）は標準偏差の3倍（3σ）、定量下限値は標準偏差の10倍（10σ）</b>に相当する濃度として求める。検出下限付近の低濃度標準溶液を繰り返し分析し、濃度換算した値の標準偏差から算出する（カタログ値の流用や検量線最高濃度での1回測定では、ばらつきを正しく反映できない）。試験法に別の算出方法が定められている場合はそれに従う。<br><br>【出典】環境省「要調査項目等調査マニュアル」等の精度管理解説。確認日 2026-10-10"},
{"f":"測定・分析","q":"分析精度管理における「空試験（ブランク試験）」と「添加回収試験」の違いとして、最も適切なものはどれか。","h":"何も加えずに測る試験と、既知量を加えて測る試験の違いです。","c":["空試験は試薬・器具・操作由来の汚染を確認するため試料を含まない系で測定し、添加回収試験は既知量の標準物質を試料に加えて回収率を確認する","空試験は既知量の標準物質を試料に加えて回収率を確認する操作を指し、添加回収試験は試料を含まない系で汚染の有無を確認する操作を指す","空試験と添加回収試験はいずれも、同一試料を2回繰り返して分析する操作を指す同義語である","空試験と添加回収試験はいずれも、検出下限値を直接算出するための操作である"],"a":0,"v":"textbook","n":"<b>空試験（ブランク試験）</b>は試料を含まない系（純水や試薬のみ）を分析し、試薬・器具・操作に由来する汚染（バックグラウンド）を確認する。<b>添加回収試験</b>は既知量の標準物質やサロゲート物質を試料に加えて前処理から測定まで行い、添加量と分析値から回収率を算出して、試料のマトリックスが分析値に与える影響（妨害）を評価する。両者は目的も操作も異なり、同一試料を2回測定する「二重測定」とも別の概念。<br><br>【出典】分析精度管理に関する一般的な解説（環境測定分析統一精度管理調査資料等）。確認日 2026-10-10"},
{"f":"測定・分析","q":"計量における「トレーサビリティ」の定義として、最も適切なものはどれか。","h":"個々の校正の不確かさが、どのようにつながっていくかに注目します。","c":["同じ試料を複数の分析者がそれぞれ独立に繰り返し測定し、得られた結果の間でばらつきが十分に小さく一致していることを示す、測定の再現性に関する性質","個々の校正が不確かさに寄与する、切れ目なく連鎖した文書化された校正を通じて、測定結果を参照基準に関係づけることができる測定結果の性質","測定値が真値と完全に一致していることを保証する性質","分析に用いた試薬の購入履行が記録として残っていることを示す性質"],"a":1,"v":"primary","n":"計量トレーサビリティは、JIS Z8103（計測用語）において<b>「個々の校正が不確かさに寄与する、切れ目なく連鎖した、文書化された校正を通して、測定結果を参照基準に関係づけることができる測定結果の性質」</b>と定義される。国家計量標準等への切れ目のない連鎖、文書化された不確かさ・測定手順、認定された技術能力などが要素となる。複数分析者の一致（再現性）や真値との一致そのものを指す概念ではない。<br><br>【出典】JIS Z8103:2019（計測用語）。確認日 2026-10-10"},
{"f":"測定・分析","q":"日本の「生物応答を用いた排水試験法（WET試験）」が取りまとめている3種類の生物を用いた試験の組合せとして、最も適切なものはどれか。","h":"植物プランクトン・甲殻類・脊椎動物の3つのグループです。","c":["大腸菌増殖試験、ミジンコ繁殖試験、藻類生長阻害試験","魚類胚・仔魚期短期毒性試験、底生生物生息試験、鳥類急性毒性試験","藻類生長阻害試験、ミジンコ繁殖試験、魚類胚・仔魚期短期毒性試験","藻類生長阻害試験、魚類胚・仔魚期短期毒性試験、哺乳類急性毒性試験"],"a":2,"v":"primary","n":"日本のWET試験は<b>藻類生長阻害試験・ミジンコ繁殖試験・魚類胚・仔魚期短期毒性試験</b>の3種として取りまとめられている。希釈した排水の中でこれらの生物の生存・成長・繁殖への影響を見て、排水全体の毒性（複合影響）を評価する手法で、個別物質の濃度規制では捉えにくい複合的な影響を補完する位置づけ。大腸菌増殖試験・底生生物生息試験・鳥類や哺乳類の急性毒性試験はWET試験の対象ではない。<br><br>【出典】環境省「生物応答試験を用いた排水の評価手法とその活用の手引き（中間とりまとめ）」。確認日 2026-10-10"},
{"f":"測定・分析","q":"環境分析で用いる機器分析法の使い分けとして、最も適切なものはどれか。","h":"対象が「金属元素」か「イオン」か「有機化合物」かで、使う機器が変わります。","c":["重金属・陰イオン・揮発性有機化合物のいずれも、対象物質の種類を一切問わず、ガスクロマトグラフ質量分析法（GC-MS）という単一の機器だけで前処理も行わずに精度よく分析できるため、他の機器分析法は原理的に不要である","水中の陰イオン分析には原子吸光法を、重金属の元素分析にはイオンクロマトグラフ法を用いる","揮発性有機化合物の分析には原子吸光法を、重金属の元素分析にはガスクロマトグラフ質量分析法を用いる","重金属等の元素分析には原子吸光法・ICP発光分光分析法・ICP質量分析法、陰イオン分析にはイオンクロマトグラフ法、揮発性有機化合物にはガスクロマトグラフ質量分析法（GC-MS）を用いる"],"a":3,"v":"textbook","n":"<b>重金属等の元素分析は原子吸光法・ICP発光分光分析法・ICP質量分析法（元素を気化・イオン化して検出）、水中の陰イオンはイオンクロマトグラフ法、揮発性有機化合物はガスクロマトグラフ質量分析法（GC-MS）</b>が適する。GC-MSは気化しやすい有機化合物を分離・同定するための機器で、金属イオンや無機陰イオンの分析には使わない。原子吸光法とイオンクロマトグラフ法、GC-MSを取り違えた選択肢は、対象物質と機器の対応関係が逆になっている。<br><br>【出典】各機器分析法の原理に関する一般的な技術解説。確認日 2026-10-10"},
{"f":"測定・分析","q":"原子吸光分析法とICP発光分光分析法（ICP-OES）の違いとして、最も適切なものはどれか。","h":"1つの元素ずつ測るか、複数の元素を同時に測れるか、という能力の違いです。","c":["原子吸光法は原則として1元素ずつの測定であり、ICP発光分光分析法は多元素を同時に測定できる","原子吸光法は多元素を同時に測定でき、ICP発光分光分析法は1元素ずつの測定に限られる","両者はいずれも1元素ずつしか測定できず、多元素同時測定にはガスクロマトグラフが必要である","両者はいずれも多元素同時測定が可能で、能力に違いはない"],"a":0,"v":"textbook","n":"<b>原子吸光法（フレーム法・電気加熱法等）は、測定元素ごとに固有の中空陰極ランプを用いるため原則1元素ずつの測定</b>となる。一方<b>ICP発光分光分析法（ICP-OES）は、高温のアルゴンプラズマで励起発光させた多数の元素の発光スペクトルを同時に検出できる</b>ため、多元素同時分析に向く。さらに高感度・多元素同時分析が必要な場合はICP質量分析法（ICP-MS）が使われる。<br><br>【出典】原子吸光法・ICP発光分光分析法の原理に関する一般的な技術解説。確認日 2026-10-10"}
];
</script>
<script>
// 既存の学習アプリ（claude-agents/projects/personal_技術士補試験対策/03_学習アプリ）の46問を検証して統合したもの。
// 検証の結果：問題として成立しない4問と、既存問題と重複する2問を削除し、1問の選択肢を訂正、3問を作り直した。
// 出典表記のない問題は確度△（教科書的知識）として扱う。
// 2026-08-11：適性科目7問・基礎科目5問は市販アプリで対応するため除外し、環境部門の専門科目のみとした。

const EXTRA_DATA = [
  {f:"化学物質", q:"PFOSとPFOAの、ストックホルム条約（POPs条約）における位置づけの組合せは？", h:"2つは追加された附属書も年も異なります。もとの問題は5肢すべてが誤りで成立していなかったため作り直しました。",
  c:["PFOS＝附属書B（制限）／PFOA＝附属書A（廃絶）","PFOS・PFOAとも附属書A（廃絶）","PFOS・PFOAとも附属書B（制限）","PFOS＝附属書A（廃絶）／PFOA＝附属書B（制限）"], a:0, v:"primary",
  n:"<b>PFOSは2009年に附属書B（制限）</b>、<b>PFOAは2019年のCOP9で附属書A（廃絶）</b>に追加されました。PFOSが制限にとどまったのは、半導体製造や航空機の油圧作動油など代替が困難な用途があったためで、例外を認めつつ段階的な廃絶を目指す形になっています。なおPFHxSは2022年に附属書A。<br><br>【誤答の定番】水質の暫定目標値はPFOSとPFOAの<b>合計で50ng/L（0.05µg/L）</b>で、2025年6月30日に水質基準へ格上げされ<b>2026年4月1日施行</b>。「1µg/L」は誤りです。またPFASは炭素－フッ素結合が<b>非常に強く難分解性</b>で、水に溶けやすく生体内に蓄積します。"},

 {f:"大気・水質", q:"ICP（誘導結合プラズマ）質量分析法による環境中の重金属等の元素分析に関する次の記述のうち、最も不適切なものはどれか。", h:"大気・水・土壌等の環境保全",
  c:["フレーム原子吸光分析法（FAAS）より多くの元素に対して高感度である。","試料中の元素は、約6,000℃のプラズマ中でイオン化され、質量分析計に導入される。","質量電荷比（m/z）に近い値を持つ原子スペクトル干渉をコリジョンセルの添加により低減できる。","同位体希釈法により、スペクトル干渉の影響を低減できる。","多元素を同時に定量できるため、水質・土壌・大気粉じんなど多様な環境試料の分析に広く用いられる。"], a:2, v:"primary",
  n:"ICP-MS（誘導結合プラズマ質量分析法）は環境中の微量金属分析の主力手法です。<br><br>「質量電荷比（m/z）に近い値を持…」の誤り：コリジョンセル（コリジョン/リアクションセル）は、スペクトル干渉の「原因となるイオン」をガスとの衝突・反応で除去する装置ですが、「質量電荷比に近い値を持つ干渉への対応」だけでなく、特定のポリアトミックイオン干渉（例：ArCl⁺によるAs⁷⁵への干渉）への対処に有効です。選択肢の「スペクトル干渉を低減できる」という方向性は正しいですが、「m/zに近い値を持つ」干渉はコリジョンセルでは必ずしも完全に解消できず、高分解能型ICPが有効なケースもあります。<br><br>【ポイント】<br>- プラズマ温度：約6,000〜8,000℃<br>- 同位体希釈法：内標準として既知量の安定同位体を添加し、マトリックスの影響を補正<br>- コリジョンセル：ArO⁺、ArCl⁺などのポリアトミックイオン干渉を低減<br><br>【2026-08-11 一次資料で確認】コリジョン／リアクションセルは、<b>単原子イオンより多原子イオンの方がセルガスと衝突しやすい</b>性質を利用して<b>多原子イオン（分子イオン）干渉</b>を除去します。質量が完全に同じ<b>同重体（原子スペクトル）干渉は除去できず</b>、化学分離が必要になります。ここが誤りの箇所です。"},

 {f:"大気・水質", q:"大気汚染に係る環境基準に関する次の記述のうち、最も適切なものはどれか。", h:"大気・水・土壌等の環境保全",
  c:["二酸化硫黄（SO₂）の環境基準は、1時間値の1日平均値が0.1ppm以下であり、かつ、1時間値が0.04ppm以下であることである。","浮遊粒子状物質（SPM）とは、大気中に浮遊する粒子状物質であって、その粒径が2.5μm以下のものをいう。","PM2.5の環境基準は、1年平均値が35μg/m³以下であり、かつ、1日平均値が15μg/m³以下であることである。","光化学オキシダントの環境基準は、1時間値が0.06ppm以下とされており、令和8年の告示改正後もこの条件が維持されている。","二酸化窒素（NO₂）の環境基準は、1時間値の1日平均値が0.04ppmから0.06ppmまでのゾーン内又はそれ以下であることである。"], a:4, v:"primary",
  n:"<b>NO₂は「0.04〜0.06ppmのゾーン内またはそれ以下」</b>。他の物質のように「0.04ppm以下」とは書かない点が出題の狙い目です。<br><br>各選択肢の整理：<br>・SO₂：1時間値の1日平均値0.04ppm以下<b>かつ</b>1時間値0.1ppm以下（数値が入れ替わっている）<br>・SPM：粒径<b>10μm以下</b>のもの（2.5μm以下はPM2.5）<br>・PM2.5：<b>年平均15μg/m³以下かつ日平均35μg/m³以下</b>（「年15・日35」。入れ替わっている）<br>・光化学オキシダント：令和8年1月30日告示・同年4月1日施行の改正で、<b>オゾンとして8時間値0.07ppm以下かつ日最高8時間値の1年平均値0.04ppm以下</b>に変わった。1時間値0.06ppmは旧基準<br><br>【出典】環境省「大気汚染に係る環境基準」（確認日 2026-10-02）。NO₂は昭和53年告示、SO₂は昭和48年告示、PM2.5は平成21年告示。"},

 {f:"大気・水質", q:"PCB（ポリ塩化ビフェニル）に関する次の記述のうち、最も不適切なものはどれか。", h:"大気・水・土壌等の環境保全",
  c:["PCBは難分解性・高脂溶性・生物濃縮性を持ち、ストックホルム条約（POPs条約）の規制対象物質である。","日本では化学物質の審査及び製造等の規制に関する法律（化審法）により第一種特定化学物質に指定され、製造・輸入が禁止されている。","PCB廃棄物の処理はPCB廃棄物の適正な処理の推進に関する特別措置法（PCB特措法）によって期限が定められており、高圧トランスや低圧コンデンサ等のPCB含有機器が対象となる。","PCBの分析には主にガスクロマトグラフ質量分析法（GC-MS）が用いられ、電子捕獲検出器（ECD）付きガスクロマトグラフ法は適用できない。","PCBは電気絶縁性・耐熱性・化学的安定性に優れることから、絶縁油・熱媒体・塗料・ノーカーボン紙などに広く使われていた。"], a:3, v:"primary",
  n:"PCBの分析には、ECD付きガスクロマトグラフ法（GC-ECD）も環境庁告示に定められた公定分析法として広く使われています。GC-MSよりGC-ECDの方が感度が高いため、微量PCBの分析には依然GC-ECDが活用されます。「適用できない」は誤りです。<br><br>【PCB基礎知識】<br>- 国内使用開始：1954年、製造禁止：1972年（カネミ油症事件1968年を契機）<br>- 化審法：第一種特定化学物質（難分解・高蓄積・人健康への長期毒性）<br>- PCB特措法：2001年制定、処理期限は2027年3月31日まで<br>- ストックホルム条約：意図的POPsとして附属書Aに掲載<br><br>【2026-08-11 一次資料で確認】ECDは<b>有機ハロゲン化合物を選択的に高感度検出</b>でき、環境省の絶縁油中微量PCB簡易測定法マニュアルでも<b>キャピラリーGC/ECD</b>が採用されています。GC/HRMS・GC/MS/MSと併用される公定法であり、「適用できない」は誤りです。"},

 {f:"大気・水質", q:"土壌汚染対策法に基づく特定有害物質の区分として、最も適切な組合せはどれか。", h:"大気・水・土壌等の環境保全",
  c:["第一種特定有害物質：揮発性有機化合物（トリクロロエチレン等）、第二種特定有害物質：重金属等（鉛・砒素等）、第三種特定有害物質：農薬等（有機塩素化合物等）","第一種特定有害物質：重金属等（鉛・カドミウム・砒素等）、第二種特定有害物質：揮発性有機化合物（テトラクロロエチレン等）、第三種特定有害物質：農薬等（有機塩素化合物等）","第一種特定有害物質：揮発性有機化合物（トリクロロエチレン等）、第二種特定有害物質：重金属等（鉛・砒素等）、第三種特定有害物質：農薬等・PCB（シマジン・チウラム等）","第一種特定有害物質：農薬等（有機塩素化合物等）、第二種特定有害物質：重金属等（鉛・カドミウム等）、第三種特定有害物質：揮発性有機化合物（ベンゼン等）","第一種特定有害物質：揮発性有機化合物（ベンゼン等）、第二種特定有害物質：農薬等（有機塩素化合物等）、第三種特定有害物質：重金属等（カドミウム等）"], a:2, v:"primary",
  n:"<b>第一種＝揮発性有機化合物（12物質・トリクロロエチレン等）／第二種＝重金属等（9物質・カドミウム、六価クロム、シアン、水銀、セレン、鉛、砒素、ふっ素、ほう素）／第三種＝農薬等（5物質・シマジン、チオベンカルブ、チウラム、PCB、有機りん化合物）</b>。全26物質。<b>第二種と第三種の取り違えが最頻出の誤答</b>で、もとの問題データもここを逆に記載していました（2026-08-11に一次資料で訂正）。なお第一種は地下水経由で広がりやすく、第二種・第三種は土壌に留まりやすいという性質の違いがあります。"},

 {f:"大気・水質", q:"VOC（揮発性有機化合物）と光化学オキシダントに関する次の記述のうち、最も不適切なものはどれか。", h:"大気・水・土壌等の環境保全",
  c:["光化学オキシダントは、VOCとNOxが紫外線を受けて光化学反応を起こすことで生成される二次汚染物質である。","大気汚染防止法では、VOC排出施設からの排出口濃度規制と、総量規制・自主的取組の組み合わせによる排出削減を図っている。","VOCの主な排出源は、塗料・印刷インキ・接着剤・工業用洗浄剤などの使用工程である。","光化学オキシダントの主成分はオゾン（O₃）であり、生成には一般に強い日射・高温・低風速の気象条件が関係する。","光化学スモッグ注意報は、光化学オキシダントの1時間値が0.12ppm以上になると予測される場合に発令される。"], a:4, v:"primary",
  n:"光化学スモッグ注意報の発令基準は、光化学オキシダントの「1時間値が0.12ppm以上になり、気象条件から判断してその状態が継続すると認められるとき」です。<br>「予測される場合」という記述は正確性を欠きますが、他の選択肢はすべて適切な記述なので、この問題では「光化学スモッグ注意報は、光化学オ…」を誤りとして選ぶのが適当です。<br><br>実際には発令基準：<br>- 注意報：0.12ppm以上・継続と見込まれる場合<br>- 警報：0.24ppm以上<br>- 重大警報：0.40ppm以上<br><br>【光化学オキシダント生成メカニズム】<br>VOC + NOx → （紫外線）→ NO₂ → O₃（オゾン）＋PAN等<br>→ 光化学オキシダント（オゾンが主成分、約90%以上）<br><br>【2026-08-11 一次資料で確認】注意報は<b>1時間値0.12ppm以上になり、気象条件からその状態が継続すると認められるとき</b>に都道府県知事等が発令（警報は0.24ppm以上）。「予測される場合」という表現が誤りです。"},

 {f:"地球環境", q:"パリ協定に関する次の記述のうち、最も不適切なものはどれか。", h:"地球環境の保全",
  c:["2015年のCOP21で採択され、2016年に発効した。京都議定書に代わる2020年以降の国際的な気候変動対策の枠組みである。","世界の平均気温上昇を産業革命前と比較して2℃未満に抑え、1.5℃未満に向けた努力を追求することを目標としている。","各国が自国の削減目標（NDC：国が決定する貢献）を策定し、5年ごとに更新・提出することが義務付けられている。","先進国と途上国を区別する「共通だが差異ある責任」の原則に基づき、先進国のみに法的拘束力のある削減義務を課している。","日本のNDCは、2030年度の温室効果ガス排出量を2013年度比46%削減（2050年カーボンニュートラル）することを目標としている。"], a:3, v:"primary",
  n:"パリ協定では、先進国・途上国の区別なく「すべての締約国」が削減目標（NDC）を策定・実施する義務を負います。ただし、削減量の具体的な数値に法的拘束力はなく、目標策定・提出・報告の「プロセス」に義務があります。「先進国のみに法的拘束力」は京都議定書の枠組みであり、パリ協定とは異なります。<br><br>【パリ協定のキー数字】<br>- 採択：2015年12月（COP21・パリ）<br>- 発効：2016年11月<br>- 長期目標：2℃未満（1.5℃努力目標）<br>- 世界全体の排出ピークアウトと今世紀後半のカーボンニュートラル<br>- NDC更新：5年ごと（漸進的向上原則）<br>- 日本：2030年-46%（2013年比）、2050年CN<br><br>【2026-08-11 一次資料で確認】パリ協定は<b>全ての締約国</b>にNDCの策定・提出・更新（5年ごと）と国内対策の実施を義務付けています。先進国のみに削減義務を課したのは<b>京都議定書</b>で、そこが最大の違いです。「共通だが差異ある責任」は先進国に途上国への資金・技術支援を求める形で残っていますが、削減義務の有無を分けるものではありません。"},

 {f:"地球環境", q:"フロン類（HFC・HCFCなど）に関する次の記述のうち、最も適切なものはどれか。", h:"地球環境の保全",
  c:["HFC（ハイドロフルオロカーボン）はオゾン層を破壊するため、モントリオール議定書で規制されているが、温室効果は持たない。","キガリ改正（2016年）では、HFCを段階的に廃絶し、フルオロカーボンを含まない冷媒への転換を義務付けた。","HCFCはHFCよりオゾン破壊係数（ODP）が高く、先進国では2020年までに全廃が義務付けられた。","HFCはオゾン層は破壊しないが地球温暖化係数（GWP）が高く、キガリ改正によりモントリオール議定書の下で段階的に削減することとなった。","代替フロンとして開発されたHFO（ハイドロフルオロオレフィン）は、GWPが高く、長期的な環境負荷が懸念される。"], a:3, v:"primary",
  n:"HFCはCFC・HCFCの代替として普及しましたが、オゾン層を壊さない一方でGWPが極めて高い（R-134aで1,430倍など）。2016年のモントリオール議定書キガリ改正でHFCの段階的削減が決定されました。<br><br>各選択肢の誤り：<br>「HFC（ハイドロフルオロカーボン…」：HFCはオゾン層を破壊しないが、強力な温室効果ガス<br>「キガリ改正（2016年）では、H…」：キガリ改正はHFCの「段階的削減」であり「廃絶」ではない。また「フルオロカーボンを含まない冷媒への転換義務」という規定はない<br>「HCFCはHFCよりオゾン破壊係…」：HCFCのODPはHFCより高い（HFCのODP＝0）は正しいが、先進国でのHCFC全廃は2020年（開発途上国は2030年）→これは正しい記述<br>「代替フロンとして開発されたHFO…」：HFOのGWPは低く（多くは1未満〜数十）、次世代冷媒として期待されている<br><br>【暗記表】CFC(ODP高・GWP高)→HCFC(ODP中・GWP中)→HFC(ODP=0・GWP高)→HFO(ODP=0・GWP低)<br><br>【2026-08-11 一次資料で確認】HFCはオゾン層を破壊しないがCO₂の100〜10,000倍超のGWPを持つため、<b>2016年10月のキガリ改正</b>でモントリオール議定書の下に削減対象として追加されました。先進国は2019年に削減を開始し、2036年までに85%削減。"},

 {f:"国際", q:"残留性有機汚染物質（POPs）に関するストックホルム条約に関する次の記述のうち、最も不適切なものはどれか。", h:"国際条約・国際枠組み",
  c:["残留性・生物蓄積性・長距離移動性・毒性の4つの特性を持つ化学物質を対象としている。","附属書A（廃絶）、附属書B（制限）、附属書C（意図せざる排出削減）の3つに分類して規制している。","DDT・アルドリン・ディルドリンなどの有機塩素系農薬が当初12物質（ダーティーダース）として規制された。","PFOSは2009年のCOP4で附属書Aに追加され、PFOAは2019年のCOP9で附属書Aに追加された。","ダイオキシン類・フラン類は附属書Bに掲載されており、排出量の制限が求められている。"], a:4, v:"primary",
  n:"ダイオキシン類（PCDDs）・フラン類（PCDFs）は附属書Cに掲載されており、「意図せざる排出の削減・廃絶」が求められています。廃棄物の焼却・金属精錬などの工業プロセスで副産物として生成されるため、「廃絶（A）」や「制限（B）」ではなく「削減（C）」の区分です。<br><br>【ストックホルム条約 3区分】<br>- 附属書A（廃絶）：PCB、DDT（用途制限あり）、アルドリン、PFOS、PFOAなど<br>- 附属書B（制限）：DDT（マラリア防除目的のみ使用可）<br>- 附属書C（意図せざる排出削減）：ダイオキシン類、フラン類、HCB、PCBなど<br><br>2001年採択・2004年発効。日本は2002年に批准。<br><br>【2026-08-11 一次資料で確認】<b>附属書A＝製造・使用の原則禁止（廃絶）／B＝原則制限（DDT等）／C＝非意図的生成物の排出削減</b>。ダイオキシン・ジベンゾフラン・HCB・PCB等がCに該当します。"},

 {f:"国際", q:"有害廃棄物の国境を越える移動及びその処分の規制に関するバーゼル条約について、最も適切なものはどれか。", h:"国際条約・国際枠組み",
  c:["1989年に採択され、1992年に発効した条約で、有害廃棄物の国境を越える移動を全面的に禁止している。","有害廃棄物を国際的に移動させる場合は、事前通告・同意（PIC：事前通知及び同意）手続きが義務付けられている。","先進国（OECD加盟国）から途上国（非OECD国）への有害廃棄物の輸出は、リサイクル目的であれば無制限に認められている。","電子廃棄物（E-waste）はバーゼル条約の規制対象外であり、別途条約が締結されている。","日本では廃棄物の処理及び清掃に関する法律（廃棄物処理法）ではなく、外国為替及び外国貿易法により国内担保法制が整備されている。"], a:1, v:"primary",
  n:"バーゼル条約の核心は事前通告・同意（PIC手続き）。輸出国・通過国・輸入国すべての事前同意なく移動を禁止しています。<br><br>各選択肢の誤り：<br>「1989年に採択され、1992年…」：全面禁止ではなく、適切な管理を条件に一定の移動を認める（PIC手続きが前提）<br>「先進国（OECD加盟国）から途上…」：2019年のバーゼル条約改正（COP14）で、汚染プラスチック廃棄物の輸出規制が強化され、非OECD国へのリサイクル目的輸出も事前同意が必要に<br>「電子廃棄物（E-waste）はバ…」：E-wasteもバーゼル条約の対象（汚染プラスチック等と合わせて2019年改正で規制強化）<br>「日本では廃棄物の処理及び清掃に関…」：日本の国内法は廃棄物処理法と特定有害廃棄物等の輸出入等の規制に関する法律（バーゼル法）<br><br>採択：1989年（バーゼル）、発効：1992年、日本批准：1993年<br><br>【2026-08-11 一次資料で確認】バーゼル条約は越境移動に際し<b>輸出国から輸出先国への事前の通告及び同意（PIC手続）</b>と移動書類の携帯を義務付けています。日本ではバーゼル法に基づき、相手国の書面による同意、環境大臣の確認（非OECD国の場合）、外為法に基づく経済産業大臣の承認が必要です。"},

 {f:"自然環境", q:"「30by30目標」に関する次の記述のうち、最も適切なものはどれか。", h:"自然生態系・風景保全",
  c:["2022年12月のCOP15（モントリオール）で採択された「昆明・モントリオール生物多様性枠組」の目標30であり、2030年までに世界の陸と海の30%以上を保全するものである。","保護地域のみが対象であり、国立公園・自然保護区など法的に指定された区域だけがカウントされる。","日本の達成状況は陸域で約20%、海域で約10%であり、目標達成にはほとんど課題がないとされている。","OECM（その他の効果的なエリアベースの保全措置）は30by30の達成手段として認められていないが、企業の社有林や里山などの民間管理地を活用する取組は、あくまで補完的なものとして推奨されているにとどまる。","30by30目標の達成には保護区の拡大のみが求められており、既存の保護区の質の向上は含まれない。"], a:0, v:"primary",
  n:"【訂正済み】もとの選択肢は「2020年・昆明で採択」となっていましたが、正しくは<b>2022年12月・モントリオール</b>です（COP15は昆明とモントリオールの2段階開催で、第2部がモントリオール）。<br><br>【正解】「2022年12月のCOP15（モントリオール）で採択…」<br><br>30by30目標は、2022年12月のCOP15（モントリオール）で採択された昆明-モントリオール生物多様性枠組（GBF）の目標30として規定されています（COP15は昆明・モントリオールの2段階開催）。<br><br>各選択肢の誤り：<br>「保護地域のみが対象であり、国立公…」：OECMも30by30の達成手段としてカウントされる（これが④の否定でもある）<br>「日本の達成状況は陸域で約20%、…」：日本の陸域保護率は約20.5%でほぼ達成済みだが、海域は約13.3%（2023年時点）と取組継続中。「課題がない」は不適切<br>「OECM（その他の効果的なエリア…」：OECMは30by30の達成手段として積極的に認められている（2030生物多様性枠組の重要施策）<br>「30by30目標の達成には保護区…」：量的拡大だけでなく既存保護区の「効果的な管理・質の向上」も目標に含まれる<br><br>【OECM（Other Effective area-based Conservation Measures）】<br>保護区以外で、生物多様性の保全に資する民間の土地・海域（企業の緑地・里山・社有林など）<br><br>【2026-08-11 一次資料で確認】<b>2022年12月・カナダのモントリオール</b>で開かれたCOP15で採択された昆明・モントリオール生物多様性枠組の23ターゲットの一つ。OECM（自然共生サイト等）も達成手段として正式にカウントされます。"},

 {f:"自然環境", q:"自然公園法に基づく自然公園に関する次の記述のうち、最も不適切なものはどれか。", h:"自然生態系・風景保全",
  c:["自然公園は、国立公園・国定公園・都道府県立自然公園の3種類に区分される。","国立公園は環境大臣が指定し、国が管理する。国定公園は環境大臣が指定し、都道府県が管理する。","公園計画に基づき、特別地域・特別保護地区・海域公園地区などが設けられ、区域ごとに行為規制の水準が異なる。","特別保護地区は特別地域の中でも特に優れた自然の風景地であり、工作物の新築等はすべて禁止されている。","利用調整地区制度により、立ち入り者数の調整が可能であり、混雑緩和と自然保護を両立する仕組みが設けられている。"], a:3, v:"primary",
  n:"特別保護地区における工作物の新築等は「すべて禁止」ではなく、環境大臣の許可を受けることで認められる場合があります。絶対禁止ではなく許可制です。<br><br>特別保護地区（最高レベルの保護）での許可制行為例：<br>- 建築物・工作物の新築・改築<br>- 木竹の伐採<br>- 土地の掘削・盛土<br>- 広告物の掲出<br>（環境大臣の許可必要）<br><br>【自然公園の地域区分（厳しい順）】<br>特別保護地区 ＞ 特別地域（第1〜3種） ＞ 海域公園地区 ＞ 普通地域<br><br>国立公園数：35か所（2024年6月に日高山脈襟裳十勝国立公園が35か所目として指定）<br>国定公園数：58か所<br><br>【2026-08-11 一次資料で確認】特別保護地区の工作物新築は<b>原則不可だが、公益性・必然性が認められる場合は許可されうる</b>ため「すべて禁止」は誤り。国立公園は環境大臣、国定公園は都道府県知事の許可。"},

 {f:"循環経済", q:"廃棄物処理法（廃棄物の処理及び清掃に関する法律）に関する次の記述のうち、最も不適切なものはどれか。", h:"廃棄物・物質循環",
  c:["廃棄物は一般廃棄物と産業廃棄物に大別され、産業廃棄物は事業活動に伴って生じた廃棄物のうち法令で定める20種類が該当する。","産業廃棄物の処理は排出事業者責任の原則に基づき、排出した事業者が自ら処理するか、許可業者に委託して処理する。","特別管理産業廃棄物は、爆発性・毒性・感染性などの特定の有害性を持つ産業廃棄物であり、通常の産業廃棄物より厳しい処理基準が適用される。","産業廃棄物の処理委託は書面によるマニフェスト（産業廃棄物管理票）制度によって管理され、電子マニフェストも認められている。","廃棄物処理施設の設置は都道府県知事の許可が必要であるが、一般廃棄物処理施設については市町村が設置する場合も許可が必要である。"], a:4, v:"primary",
  n:"市町村が設置する一般廃棄物処理施設（市町村のごみ処理施設）については、都道府県知事の許可ではなく「都道府県知事への届出（設置の届出）」が必要です。また実際には市町村設置の一廃処理施設に「許可」は不要で、届出・技術上の基準適合義務が課されます。<br><br>【廃棄物の基礎】<br>- 産業廃棄物：20種類（燃え殻、汚泥、廃油、廃酸、廃アルカリ、廃プラ等）<br>- 特別管理産業廃棄物：廃PCB、感染性廃棄物、廃水銀等<br>- マニフェスト制度：A票〜E票の5枚または電子マニフェスト<br>- 排出事業者は、処理完了確認義務あり（マニフェストの返付確認）<br><br>【3R原則】Reduce（発生抑制）＞ Reuse（再使用）＞ Recycle（再生利用）<br><br>【2026-08-11 一次資料で確認】法第8条は市町村を許可対象から除外しており、<b>市町村が設置する一般廃棄物処理施設は届出制（法第9条の3）</b>。届出に先立ち、条例により利害関係者へ意見書提出の機会を付与します。"},

 {f:"法令・制度", q:"環境影響評価法に関する次の記述のうち、最も適切なものはどれか。", h:"環境アセスメント・基盤施策",
  c:["環境影響評価法の対象事業（第一種事業・第二種事業）には道路・ダム・鉄道・空港・発電所など13種類が規定されており、すべて必ず環境アセスを実施しなければならない。","スクリーニングとは、第二種事業について環境影響評価を実施するかどうかを個別に判定する手続きであり、都道府県知事が判定する。","スコーピングとは、環境アセス実施前に調査・予測・評価の項目・方法を絞り込む手続きであり、方法書の段階で行われる。","準備書の縦覧・意見聴取後、事業者は評価書を作成・公告し、それをもって環境影響評価の手続きは完了する。","環境影響評価法は1997年に制定されたが、2011年改正で戦略的環境アセスメント（SEA）が法定化された。"], a:2, v:"primary",
  n:"スコーピング（絞り込み）は方法書の段階で行われる手続きで、調査・予測・評価の方法について関係機関や地域住民の意見を聴取し、実施する調査の対象項目・手法を決定します。<br><br>各選択肢の誤り：<br>「環境影響評価法の対象事業（第一種…」：第一種事業は「必ず実施」だが、第二種事業は「スクリーニング（判定）」後に必要性を判断する<br>「スクリーニングとは、第二種事業に…」：判定するのは<b>免許・許可等を行う者（許認可権者）</b>で、都道府県知事は意見を述べる立場（環境影響評価法第4条）<br>「準備書の縦覧・意見聴取後、事業者…」：評価書の後も「大臣意見→事業者意見の反映→確定版の作成・公告」があり、工事完了後の事後調査・報告も必要<br>「環境影響評価法は1997年に制定…」：2011年改正では風力発電・地熱発電の対象化・配慮書手続き追加などを実施。SEAの法定化はされていない<br><br>【アセス手続きの流れ】<br>配慮書→方法書（スコーピング）→準備書（縦覧・意見）→評価書→大臣意見→確定・公告→事後調査<br><b>覚え方</b>：両端の配慮書と報告書は2011年の法改正（2013年4月全面施行）で足された書類で、<b>配慮書＝計画段階のいちばん最初</b>、<b>報告書＝工事後のいちばん最後</b>。真ん中の3つは<b>方法（どう調べるかを決める）→準備（下書きを出して意見を聴く）→評価（意見を反映した清書）</b>。語呂は「<b>はい、方法を準備して評価を報告</b>」（配・方・準・評・報）。<br><br>【2026-08-11 一次資料で確認】スコーピングは<b>方法書</b>を公告・縦覧し、地方公共団体や住民等の意見を聴いて項目・手法を選定する手続。図書の順は<b>配慮書→方法書→準備書→評価書→報告書</b>。"},

 {f:"大気・水質", q:"騒音に係る環境基準に関する次の記述のうち、最も不適切なものはどれか。", h:"大気・水・土壌等の環境保全",
  c:["環境基準は、地域の類型（AAA・AA・A・B・C）及び時間帯（昼間・夜間）に応じて設定されている。","幹線道路沿道の環境基準は、一般地域の環境基準と同一の数値が適用される。","騒音の大きさはデシベル（dB）で表され、A特性で聴感補正した値（dB(A)）が環境基準に用いられる。","環境基準の評価には等価騒音レベル（LAeq）が用いられており、変動する騒音を時間的に平均化したものである。","航空機騒音及び新幹線鉄道騒音については、一般の騒音環境基準とは別に専用の環境基準が設けられている。"], a:1, v:"primary",
  n:"幹線道路沿道の環境基準は、一般地域の環境基準とは「異なる（より緩い）」数値が設定されています。自動車交通騒音による沿道への影響を考慮し、別途の基準（幹線交通を担う道路に近接する空間における特例）が定められています。<br><br>【騒音環境基準の地域類型】<br>| 地域 | 昼間（6〜22時） | 夜間（22〜6時） |<br>|------|---------|----------|<br>| AA  | 50dB以下 | 40dB以下 |<br>| A・B | 55dB以下 | 45dB以下 |<br>| C   | 60dB以下 | 50dB以下 |<br><br>幹線道路沿道特例：昼間70dB・夜間65dB（近接空間）<br><br>【騒音の種類別基準】<br>- 一般騒音：環境基本法に基づく環境基準<br>- 航空機騒音：WECPNL（うるささ指数）またはLden<br>- 新幹線鉄道：70dB以下（特例措置あり）<br><br>【2026-08-11 一次資料で確認】幹線交通を担う道路に近接する空間は特例として<b>昼間70dB以下・夜間65dB以下</b>。一般地域とは別の数値です。近接空間の範囲は車線数で決まり、2車線以下は道路端から15m。"},

 {f:"地球環境", q:"IPCCに関する次の記述のうち、最も適切なものはどれか。", h:"地球環境の保全",
  c:["IPCCは国連環境計画（UNEP）と世界気象機関（WMO）が共同設立した政府間組織で、気候変動に関する独自の観測・研究を行う機関である。","IPCC第6次評価報告書（AR6）では、人間活動が大気・海洋・陸域を温暖化させたことは「疑う余地がない」と断定した。","IPCC第6次評価報告書の総合報告書（SYR）は2021年に発表され、1.5℃の温暖化は既に達成されたとした。","IPCCの報告書は5年ごとに発行することが義務付けられており、政策決定者向けSPMは各国政府の承認を必要としない。","IPCCは気候変動に関する政策提言を行う機関であり、各国の排出削減目標（NDC）の審査・承認を実施する。"], a:1, v:"primary",
  n:"IPCC第6次評価報告書（AR6：2021〜2023年）の総合報告書（SYR・2023年3月）では、「人間活動が大気・海洋・陸域を温暖化させたことは疑う余地がない（unequivocal）」と断言しました。AR5（2013年）の「極めて高い可能性（extremely likely：95%以上）」から断定表現に強化されました。<br><br>各選択肢の誤り：<br>「IPCCは国連環境計画（UNEP…」：IPCCは「独自に観測・研究は行わない」。既存の科学論文・研究を評価・統合する機関<br>「IPCC第6次評価報告書の総合報…」：SYRは2023年3月発表。「1.5℃達成済み」ではなく「近い将来（2030年代に）超過する可能性」と警告<br>「IPCCの報告書は5年ごとに発行…」：政策決定者向けSPM（Summary for Policymakers）は各国政府代表が承認する<br>「IPCCは気候変動に関する政策提…」：IPCCは政策提言機関ではなく、政策策定に資する科学的知見の評価機関。NDC審査は行わない<br><br>【AR6の主要メッセージ】<br>- 世界平均気温：産業革命前比+1.1℃（2011-2020年平均）<br>- 2030年代に1.5℃到達の可能性大<br>- 気候変動の影響は既に深刻・不可逆<br><br>【2026-08-11 一次資料で確認】AR6第1作業部会SPM（2021年8月）は「<b>人間の影響が大気、海洋及び陸域を温暖化させてきたことには疑う余地がない</b>」と記載。AR5の「可能性が極めて高い（95%以上）」から<b>断定表現に強化</b>された点が要点です。"},

 {f:"大気・水質", q:"水質汚濁防止法における特定施設・特定事業場に関する次の記述のうち、最も不適切なものはどれか。", h:"大気・水・土壌等の環境保全",
  c:["特定施設とは、汚水または廃液を排出する施設であって、水質汚濁防止法施行令に規定されているものをいう。","特定事業場を設置しようとする者は、原則として30日前までに都道府県知事に届け出なければならない。","一律排水基準は、全国一律の排水基準であり、都道府県はこれより厳しい基準を条例で定めることができない。","公共用水域への排水については排水基準が適用され、地下浸透については別途規制がなされている。","有害物質を含む排水を排出する特定事業場は、事業場設置の届出に加え、有害物質に関する定期的な自主測定・記録が義務付けられている。"], a:2, v:"primary",
  n:"水質汚濁防止法では国が定める「一律排水基準」を基本としていますが、都道府県は地域の実情に応じてそれより「**厳しい**」上乗せ排水基準を条例で定めることができます（法第3条第3項）。「より厳しい基準を定めることができない」は誤りです。<br><br>なお、生活環境項目については「横出し規制」（一律基準にない物質の規制追加）も可能です。<br><br>【水質汚濁防止法の体系】<br>- 一律排水基準：健康項目26物質（カドミウム、水銀、PCB等）＋生活環境項目（pH・BOD・SS・n-ヘキサン抽出物質等）<br>- 上乗せ基準：都道府県条例（一律より厳しく設定可）<br>- 横出し基準：一律基準対象外の物質を条例で追加可<br>- 届出期限：設置の30日前<br>- 自主測定：有害物質は年4回以上<br><br>【2026-08-11 一次資料で確認】<b>水質汚濁防止法第3条第3項</b>により、都道府県は自然的・社会的条件から一律基準では不十分な場合、<b>条例でより厳しい「上乗せ排水基準」を定められます</b>。「定めることができない」は誤りです。"},

 {f:"大気・水質", q:"水質の有機汚濁指標に関する次の記述のうち、最も適切なものはどれか。", h:"大気・水・土壌等の環境保全",
  c:["BODは、水中の有機物を化学的な酸化剤で酸化する際に消費される酸素量であり、20℃で5日間、密栓した暗所で測定される。","CODは、過マンガン酸カリウム等の酸化剤により有機物を酸化する際に消費される酸素量の当量で表される。","DO（溶存酸素）が高いほど、水中の有機汚濁は進行している。","SS（浮遊物質）は、水中に溶解している有機物の量を示す。","TOCは、無機炭素の総量を測定する指標である。"], a:1, v:"primary",
  n:"BOD=微生物が有機物を分解する際の消費酸素量（20℃・5日）。COD=酸化剤で酸化する際の酸素消費当量（選択肢2が正しい）。DOは高いほど清浄、SSは浮遊物質、TOCは全有機炭素（燃焼してCO₂量で測定）。<br><br>【2026-08-11 一次資料で確認】日本の公定法CODは<b>過マンガン酸カリウム</b>による酸素消費当量（沸騰水浴中30分）。BODは20℃・5日間の微生物による消費酸素量。<b>河川＝BOD／湖沼・海域＝COD／水道水質基準＝TOC</b>の使い分けもセットで。"},

 {f:"大気・水質", q:"大気の汚染に係る環境基準が定められている項目として、適切でないものはどれか。", h:"大気・水・土壌等の環境保全",
  c:["二酸化硫黄（SO₂）","二酸化窒素（NO₂）","微小粒子状物質（PM2.5）","光化学オキシダント","生物化学的酸素要求量（BOD）"], a:4, v:"primary",
  n:"大気の環境基準はSO₂・NO₂・SPM・PM2.5・光化学オキシダント・ベンゼン等。BODは水質の有機汚濁指標であり大気の環境基準ではない。<br><br>【2026-08-11 一次資料で確認】大気の環境基準はSO₂・NO₂・SPM・PM2.5・光化学オキシダント・CO、および有害大気汚染物質（ベンゼン・トリクロロエチレン・テトラクロロエチレン・ジクロロメタン）。<b>BODは水質の生活環境項目</b>で、大気には存在しません。"},

 {f:"大気・水質", q:"土壌汚染対策法に関する次の記述のうち、最も適切なものはどれか。", h:"大気・水・土壌等の環境保全",
  c:["汚染のおそれがある土地は、すべて「要措置区域」に指定される。","健康被害のおそれがあり、摂取経路の遮断等の措置が必要な区域を「要措置区域」という。","「形質変更時要届出区域」は、健康被害のおそれがないと確認された土地に指定される区域であり、その土地の形質変更は全面的に禁止される。","特定有害物質に揮発性有機化合物は含まれない。","区域の指定は環境大臣が全国一律に行う。"], a:1, v:"primary",
  n:"要措置区域＝健康被害のおそれがあり措置が必要な区域。形質変更時要届出区域は届出をすれば形質変更が可能。特定有害物質にはVOCも含まれる。指定は都道府県知事等が行う。<br><br>【2026-08-11 一次資料で確認】<b>要措置区域（法6条）＝摂取経路があり健康被害のおそれがあるため措置が必要</b>／<b>形質変更時要届出区域（法11条）＝摂取経路がなく措置は不要だが、形質変更時に事前届出が必要</b>。措置により摂取経路が遮断されると後者に切り替わります。"},

 {f:"化学物質", q:"残留性有機汚染物質であるPFOS・PFOAが、規制対象として附属書に追加された国際条約はどれか。", h:"化学物質・有害物質",
  c:["バーゼル条約（有害廃棄物の越境移動）","ワシントン条約（絶滅危惧種の国際取引規制）","ストックホルム条約（POPs条約）","水俣条約（水銀に関する条約）","モントリオール議定書（オゾン層保護）"], a:2, v:"primary",
  n:"PFOS・PFOAは残留性有機汚染物質（POPs）としてストックホルム条約の附属書に追加された。水俣条約=水銀、バーゼル=有害廃棄物の越境移動、CITES=絶滅危惧種、モントリオール=オゾン層破壊物質。<br><br>【2026-08-11 一次資料で確認】<b>ストックホルム条約（POPs条約）</b>。PFOSは2009年に附属書B（制限）、PFOAは2019年COP9で附属書A（廃絶）。水俣条約＝水銀、バーゼル条約＝有害廃棄物の越境移動、ロッテルダム条約＝有害化学物質の輸出入時のPIC。"},

 {f:"化学物質", q:"ストックホルム条約（POPs条約）の附属書の分類として、最も適切なものはどれか。", h:"化学物質・有害物質",
  c:["附属書A＝製造・使用の制限、附属書B＝廃絶","附属書A＝廃絶、附属書B＝制限、附属書C＝非意図的生成の削減","附属書A＝非意図的生成、附属書C＝廃絶","附属書Aは各国が自由に品目を追加できる暫定リストである","附属書は排出量取引の割当量を定めるものである"], a:1, v:"primary",
  n:"POPs条約の附属書は A＝廃絶／B＝制限／C＝非意図的生成の削減。<br><br>【2026-08-11 一次資料で確認】<b>附属書A＝製造・使用の原則禁止（廃絶）／B＝原則制限（DDT等）／C＝非意図的生成物の排出削減</b>。Cにはダイオキシン・ジベンゾフラン・HCB・PCB・ポリ塩化ナフタレン等が該当します。"},

 {f:"地球環境", q:"日本の気候変動対策の目標に関する次の記述のうち、最も適切なものはどれか。", h:"地球環境の保全",
  c:["2050年カーボンニュートラル、2030年度に2013年度比▲46％","2050年カーボンニュートラル、2030年度に2013年度比▲26％","2040年カーボンニュートラル、2030年度に▲46％","2030年カーボンニュートラルを目標とする","2050年までに2013年度比▲80％を最終到達点とする"], a:0, v:"primary",
  n:"2050年カーボンニュートラル、2030年度▲46％（2013年度比）が基本ライン。▲26％は旧目標。<br><br>【2026-08-11 一次資料で確認】<b>2050年カーボンニュートラル</b>、<b>2030年度に2013年度比46%削減</b>（さらに50%の高みに向けて挑戦）。2025年2月の地球温暖化対策計画改定で<b>2035年度60%減・2040年度73%減</b>が加わりました。26%減は旧目標。"},

 {f:"国際", q:"モントリオール議定書のキガリ改正で、新たに削減対象に追加された物質はどれか。", h:"国際条約・国際枠組み",
  c:["二酸化炭素（CO₂）","メタン（CH₄）","代替フロン（HFC）","特定フロン（CFC）","六フッ化硫黄（SF₆）"], a:2, v:"primary",
  n:"キガリ改正（2016年）で、オゾン層は破壊しないが強力な温室効果を持つ代替フロン（HFC）が削減対象に追加された。CFC等は元々の規制対象。<br><br>【2026-08-11 一次資料で確認】<b>2016年10月・ルワンダのキガリ</b>で採択。HFCはオゾン層を破壊しないがCO₂の100〜10,000倍超の温室効果を持つため、生産量・消費量の削減義務が課されました。<b>日本を含む先進国は2019年に削減を開始し、2036年までに85%削減</b>（2011〜2013年平均が基準）。"},

 {f:"国際", q:"水銀及び水銀化合物の人為的な排出・使用を包括的に規制する国際条約はどれか。", h:"国際条約・国際枠組み",
  c:["ストックホルム条約","水俣条約","バーゼル条約","ロッテルダム条約","ラムサール条約"], a:1, v:"primary",
  n:"水銀に関する水俣条約。バーゼル=有害廃棄物の越境移動、ラムサール=湿地、ストックホルム=POPs。<br><br>【2026-08-11 一次資料で確認】<b>2013年10月、熊本市・水俣市</b>で開催された外交会議で全会一致採択、92か国（EU含む）が署名。同年1月のジュネーブ会合で条約名が「水銀に関する水俣条約」に決定しています。"},

 {f:"循環経済", q:"近年の資源循環・廃棄物分野の制度動向に関する次の記述のうち、適切でないものはどれか。", h:"廃棄物・物質循環",
  c:["使用済み太陽電池について、多量に排出する事業者にリサイクルを促す法制度の整備が進められている","廃棄物処理法の改正で、金属スクラップ等を扱うヤード事業に許可制の導入が図られた","再資源化事業等高度化法により、高度な再資源化事業者を国が認定する仕組みが設けられた","プラスチックに係る資源循環の促進等に関する法律が施行されている","循環型社会形成推進基本法は既に廃止され、リサイクルの根拠法は存在しない"], a:4, v:"primary",
  n:"循環型社会形成推進基本法は現行法であり、各種リサイクル法の上位に位置する。他は近年の制度動向として正しい。<br><br>【2026-08-11 一次資料で確認】<b>循環型社会形成推進基本法（平成12年公布）は現行法</b>で、廃棄物処理法・資源有効利用促進法・各種リサイクル法（容器包装・家電・食品・建設・自動車・小型家電）・グリーン購入法の<b>上位に位置する基本法</b>です。「既に廃止」は誤り。"},

 {f:"自然環境", q:"環境白書に示された30by30の保全状況（進捗）として、最も近いものはどれか。", h:"自然生態系・風景保全",
  c:["陸域約10％・海域約5％","陸域約21％・海域約13％","陸域約30％・海域約30％（既に達成）","陸域約50％・海域約40％","陸域約13％・海域約21％"], a:1, v:"primary",
  n:"白書時点で陸域約21.0％・海域約13.3％。自然共生サイトの認定拡大で上積みを図る段階。※進捗値は時点により変動。<br><br>※この進捗値は環境省30by30ロードマップの2021年時点の集計（陸域20.5%・海域13.3%）に基づきます。年度により変動するため、桁で覚えてください。<br><br>【2026-08-11 一次資料で確認】環境省30by30ロードマップの集計で<b>陸域約20.5%・海域約13.3%</b>。自然共生サイト（2026年3月末で569か所・約11.6万ha）の認定拡大で上積みを図る段階です。年度により変動するため桁で覚えてください。"},

 {f:"自然環境", q:"2022年のCOP15で採択された、2030年に向けた世界目標を含む生物多様性の新たな枠組はどれか。", h:"自然生態系・風景保全",
  c:["愛知目標（2010年COP10で採択）","昆明・モントリオール生物多様性枠組","名古屋議定書（遺伝資源の利益配分）","カルタヘナ議定書（遺伝子組換え生物の規制）","パリ協定（気候変動の国際枠組み）"], a:1, v:"primary",
  n:"2022年採択の昆明・モントリオール生物多様性枠組。愛知目標（2010）の後継で、30by30等を掲げる。<br><br>【2026-08-11 一次資料で確認】<b>昆明・モントリオール生物多様性枠組</b>（2022年12月・モントリオールで採択）。2010年の愛知目標の後継で、30by30を含む<b>23のターゲット</b>を掲げています。"},

 {f:"大気・水質", q:"水質の有機物指標について、河川・湖沼海域・水道水質基準で用いられる指標の組合せは？", h:"BOD・COD・TOCの使い分け。もとの問題は5肢すべてが正しく成立していなかったため作り直しました。",
  c:["河川＝BOD、湖沼・海域＝COD、水道水質基準＝TOC","河川＝COD、湖沼・海域＝BOD、水道水質基準＝TOC","河川＝BOD、湖沼・海域＝TOC、水道水質基準＝COD","すべてBODで統一されている"], a:0, v:"primary",
  n:"<b>河川＝BOD／湖沼・海域＝COD／水道水質基準＝TOC</b>。BODは20℃・5日間の微生物による酸素消費量、CODは酸化剤（日本の公定法は過マンガン酸カリウム）による酸素消費当量。水道水質基準は酸化力のばらつきを避けるため、2004年に過マンガン酸カリウム消費量からTOCへ変更されました。"},

 {f:"化学物質", q:"PRTR制度（化管法）で届出義務の対象となる事業者の要件は？", h:"3条件をすべて満たす必要があります。もとの問題は正答が逆だったため作り直しました。",
  c:["対象24業種／常用雇用者21人以上／第一種指定化学物質の年間取扱量1トン以上","対象24業種／常用雇用者11人以上／年間取扱量0.5トン以上","全業種／常用雇用者50人以上／年間取扱量1トン以上","対象24業種／従業員数の要件なし／年間取扱量5トン以上であり、届出は翌年度の4月1日〜6月30日に行う"], a:0, v:"primary",
  n:"<b>①24業種のいずれか ②常用雇用者21人以上（本社・工場等の合計） ③第一種指定化学物質の年間取扱量1トン以上</b>の3条件すべて。特定第一種指定化学物質は<b>0.5トン以上</b>。「11人以上」「10人超」は誤りです。届出は翌年度の4月1日〜6月30日。"},

 {f:"大気・水質", q:"有機物が河川に流入したとき、汚染ピーク地点でDOが最低値をとる現象を何というか？", h:"自浄作用の過程で現れる特徴的な曲線。もとの問題は5肢すべてが正しく成立していなかったため作り直しました。",
  c:["DOサグ","DOカーブ","BODサグ","酸素飽和点"], a:0, v:"primary",
  n:"<b>DOサグ（酸素垂下）</b>。好気性微生物が有機物を分解する際にDOを消費し、汚染源の下流で最低値をとってから回復します。あわせて河川の類型別DO基準は<b>AA・A＝7.5mg/L以上、B・C＝5mg/L以上、D・E＝2mg/L以上</b>。DOは水温が高いほど溶解度が下がります。<br><br>【2026-08-11 一次資料で確認】河川のDO環境基準は<b>AA・A＝7.5mg/L以上、B・C＝5mg/L以上、D・E＝2mg/L以上</b>（生活環境の保全に関する環境基準）。"},
 {"f":"大気・水質","q":"光化学オキシダントに係る環境基準（令和8年1月30日告示、同年4月1日施行）の内容として、最も適切なものはどれか。","h":"昭和48年の設定以来、初めての見直しです。評価に使う時間の単位も変わりました。","c":["オゾンとして、8時間値が0.07ppm以下であり、かつ、日最高8時間値の1年平均値が0.04ppm以下であること。","オゾンとして、1時間値が0.06ppm以下であり、かつ、1時間値の1日平均値が0.04ppm以下であること。","オゾンとして、8時間値が0.04ppm以下であり、かつ、日最高8時間値の1年平均値が0.07ppm以下であること。","オゾンとして、1時間値が0.12ppm以下であり、かつ、日最高1時間値の1年平均値が0.07ppm以下であること。","オゾンとして、1時間値が0.06ppm以下であることとされ、昭和48年の設定から条件は据え置かれている。"],"a":0,"v":"primary","n":"<b>8時間値0.07ppm以下、かつ日最高8時間値の1年平均値0.04ppm以下</b>。短期曝露の目標値（0.07）と長期曝露の目標値（0.04）の2本立てです。<br>・従来は<b>1時間値0.06ppm以下</b>の1本でした（昭和48年告示）。<b>市販の参考書や過去問解説の多くは、この旧基準のままです</b>。<br>・8時間値を採用した理由：日最高8時間値が0.07ppm以下なら、日最高1時間値0.12ppm以下も達成できる可能性が高いと整理されたため。<br>・0.12ppmは光化学スモッグ注意報の発令の目安で、環境基準の値ではありません。<br>・環境基準の対象は「オゾン、PAN等の酸化性物質」という定義のまま変えず、基準値だけをオゾンとして設定しました。<br>・達成率0%（令和6年度）は旧基準での評価です。<br><br>【出典】環境省「大気汚染に係る環境基準」、環境省水・大気環境局長通知「光化学オキシダントに係る環境基準の改定について」（環水大管発第2601301号・令和8年1月30日）。確認日 2026-10-02"},
 {"f":"大気・水質","q":"大気汚染に係る環境基準のうち、浮遊粒子状物質（SPM）に関する記述として、最も適切なものはどれか。","h":"1日平均値と1時間値、二つの条件の数値の大小に注意します。","c":["1時間値の1日平均値が0.10mg/m³以下であり、かつ、1時間値が0.20mg/m³以下であること。","1時間値の1日平均値が0.20mg/m³以下であり、かつ、1時間値が0.10mg/m³以下であること。","1時間値の1日平均値が0.04mg/m³以下であり、かつ、1時間値が0.10mg/m³以下であること。","1年平均値が15μg/m³以下であり、かつ、1日平均値が35μg/m³以下であること。","1時間値の1日平均値が0.10mg/m³以下であることのみで、1時間値の条件は定められていない。"],"a":0,"v":"primary","n":"<b>SPM：1時間値の1日平均値0.10mg/m³以下、かつ1時間値0.20mg/m³以下</b>。粒径10μm以下の粒子です。<br>・「1日平均が厳しく、1時間値が緩い」のが全物質共通の型です（SO₂は0.04と0.1、COは10と20、SPMは0.10と0.20）。数値の大小を入れ替えた選択肢は誤りです。<br>・年15・日35は<b>PM2.5</b>の基準です。<br>・NO₂だけは1日平均値の「0.04〜0.06ppmのゾーン」のみで、1時間値の条件がありません。<br>・SO₂・CO・SPMは1日平均値と1時間値（COは8時間平均値）の二つの条件を両方満たす必要があります。<br><br>【出典】環境省「大気汚染に係る環境基準」。確認日 2026-10-02"},
{"f": "法令・制度", "q": "省エネ法（昭和54年法律第49号）の令和4年改正（2023年4月1日施行）の内容として、最も適切なものはどれか。", "h": "法律名と目的規定がどう変わったかに注目する。", "c": ["法律名が「エネルギーの使用の合理化及び再生可能エネルギーの導入等に関する法律」に改められ、対象が再エネ電気に限られた。", "特定事業者の指定の仕組みが廃止され、すべての事業者に非化石エネルギーへの転換計画の提出が義務付けられた。", "法律名が「エネルギーの使用の合理化及び非化石エネルギーへの転換等に関する法律」に改められ、目的に電気の需要の最適化も位置づけられた。", "特定事業者による定期報告の義務が廃止され、エネルギーの使用の合理化に関する中長期計画の提出だけが残った。", "エネルギーの定義から電気と熱が除かれ、化石燃料と非化石燃料の使用量だけを対象とする法律に改められた。"], "a": 2, "v": "primary", "n": "<b>法律名が「エネルギーの使用の合理化及び非化石エネルギーへの転換等に関する法律」に変わった</b>のが令和4年改正（令和4年法律第46号・2022年5月20日公布・2023年4月1日施行）の核心です。第1条の目的には、エネルギーの使用の合理化に加え<b>非化石エネルギーへの転換</b>と<b>電気の需要の最適化</b>に関する措置が明記されました。略称は従来どおり「省エネ法」です。<br><br>各選択肢について：<br>再エネ限定：非化石エネルギーは再エネに限らず、水素・アンモニア等の非化石燃料、非化石熱、非化石電気を含む概念<br>指定の廃止：特定事業者の指定（第7条）は残っており、年度のエネルギー使用量が政令の数値以上の者が対象<br>定期報告の廃止：定期報告（第16条）は存続<br>電気と熱の除外：「エネルギー」は化石燃料・非化石燃料・熱・電気（第2条）<br><br>【出典】e-Gov法令検索「エネルギーの使用の合理化及び非化石エネルギーへの転換等に関する法律」第1条・第2条・第7条・第16条、同法の改正履歴（令和4年法律第46号） 確認日 2026-10-02"},
{"f": "法令・制度", "q": "改正後の省エネ法（エネルギーの使用の合理化及び非化石エネルギーへの転換等に関する法律）における特定事業者の中長期計画に関する記述として、最も適切なものはどれか。", "h": "第15条は、計画の対象を2つの目標に分けて定めている。", "c": ["非化石エネルギーへの転換の目標に関する計画だけを作成すればよく、エネルギーの使用の合理化の目標に関する計画は不要になった。", "計画の作成・提出義務を負うのは特定連鎖化事業者に限られ、特定事業者は年度ごとの定期報告だけを行えばよい。", "計画は経済産業大臣への届出で足り、作成の指針を主務大臣が定めて公表することはできない。", "合理化の目標に関する計画に加え、一定の特定事業者は非化石エネルギーへの転換の目標に関する中長期的な計画も定期に提出する。", "計画の対象は電気の需要の最適化の目標に限られ、化石燃料の使用の合理化に関する計画は対象外となった。"], "a": 3, "v": "primary", "n": "<b>特定事業者は、合理化の目標に関する中長期計画（第15条1項）に加えて、非化石エネルギーへの転換の目標に関する中長期計画（同条2項）も定期に作成し、主務大臣に提出</b>します。2項の対象は、その設置する工場等のエネルギー使用量（他者への供給分の燃料等を除く）が政令の数値以上の特定事業者です。主務大臣は計画の適確な作成に資する指針を定めることができ、定めたときは公表します（同条3・4項）。<br><br>各選択肢について：<br>転換計画のみ：合理化の計画（1項）は残っている<br>特定連鎖化事業者に限定：計画提出義務は特定事業者（第15条）に課される<br>届出で足りる：条文は「作成し、主務大臣に提出」<br>電気の需要の最適化に限る：計画は合理化と非化石転換の目標に関するもの<br><br>【出典】e-Gov法令検索 同法 第15条・第16条 確認日 2026-10-02"},
{"f": "地球環境", "q": "地球温暖化対策の推進に関する法律（温対法）第2条に規定される「温室効果ガス」に関する記述として、最も適切なものはどれか。", "h": "対象物質の数と、政令に委任されている物質に注目する。", "c": ["CO2・CH4・N2O・HFC・PFC・SF6の6物質で、NF3は対象に含まれない。", "CO2・CH4・N2O・HFC（政令指定）・PFC（政令指定）・SF6・NF3の7物質である。", "CO2・CH4・N2O・HFC・PFC・SF6・NF3の7物質に加え、CFCも対象に含まれる。", "CO2・CH4・N2O・オゾン・水蒸気の5物質で、フッ素系のガスは対象に含まれない。", "CO2・CH4・N2Oの3物質で、フッ素系のガスは別の法律だけが対象としている。"], "a": 1, "v": "primary", "n": "<b>温対法第2条3項は、CO2・CH4・N2O・HFC（政令で定めるもの）・PFC（政令で定めるもの）・SF6・NF3の7物質</b>を温室効果ガスと定めています。HFCとPFCは物質群の全体ではなく、<b>政令で個別に指定されたもの</b>が対象です。日本の2024年度排出量では、CO2が92.8%、HFCsが約2.6%です（環境省）。<br><br>各選択肢について：<br>6物質：旧来の6ガスの整理。現行条文は三ふっ化窒素（NF3）を含む7物質<br>CFCを含む：CFC等のオゾン層破壊物質はオゾン層保護法の規制対象で、温対法の温室効果ガスには入らない<br>オゾン・水蒸気：温対法の対象物質ではない<br>3物質のみ：フッ素系のガスも対象に含まれる<br><br>【出典】e-Gov法令検索「地球温暖化対策の推進に関する法律」第2条3項（2026年1月1日施行版）、環境省「2024年度の温室効果ガス排出・吸収量」 確認日 2026-10-02"},
{"f": "国際", "q": "世界のエネルギー起源CO2排出量（2023年・約344億t）の国別内訳に関する記述として、最も適切なものはどれか。", "h": "上位3か国の順位と日本の順位を押さえる。", "c": ["中国が約32%で最大、次いで米国、インドの順であり、日本は約2.7%で第5位である。", "米国が約3割で最大、次いで中国、インドの順であり、日本は第3位である。", "中国が約3割で最大、次いでインドが米国を上回って2位となり、日本は第4位である。", "中国が約2割で最大、次いで米国、ロシアの順であり、インドは第5位である。", "上位3か国（中国・米国・インド）で全体の約8割を占め、日本は第10位以下である。"], "a": 0, "v": "primary", "n": "<b>中国11,130百万t（32.4%）、米国4,413百万t（12.8%）、インド2,763百万t（8.0%）</b>の順で、日本は935百万t（2.7%）で<b>第5位</b>（4位はロシア）です。世界合計は約344億t（34,368百万t）で、中国・米国・インド・ロシア・日本の5か国で約6割を占めます。以前の参考書にある「2015年・約329億t・中国28.4%」から、<b>中国の割合が上昇し、インドが3位に入った</b>点が変化です。<br><br>各選択肢について：<br>米国が最大：最大は中国で、米国は2位<br>インドが米国を上回る：米国が2位、インドが3位<br>中国が約2割：約3割（32.4%）<br>上位3か国で約8割：約5割強（約53%）。日本は5位<br><br>【出典】全国地球温暖化防止活動推進センター（JCCCA）「世界の二酸化炭素排出量（2023年）」（原典：EDMC『エネルギー・経済統計要覧2026年版』） 確認日 2026-10-02"},
{"f": "国際", "q": "IPCCの評価報告書に関する記述として、最も適切なものはどれか。", "h": "サイクルの区切りと、現在進行中のサイクルを確認する。", "c": ["AR6は2023年3月の統合報告書で完了し、AR7の統合報告書は2029年後半までに提出予定である。", "第5次評価報告書が最新であり、第6次評価報告書の作成は2025年から始まる予定である。", "AR6の統合報告書は2021年に公表され、AR7の統合報告書は2025年に提出済みである。", "AR7では特別報告書や方法論報告書の作成は行われず、3つの作業部会報告書のみが作成される。", "AR6は2023年3月の統合報告書で完了し、AR7の統合報告書は2024年に公表済みである。"], "a": 0, "v": "primary", "n": "<b>第6次評価報告書（AR6）は2023年3月の統合報告書で完了</b>し、第7次サイクル（AR7）が始動しています。2024年1月のIPCC第60回総会では、<b>統合報告書を全作業部会報告書の完成後、2029年後半までに提出する</b>こと、2027年初頭に<b>気候変動と都市に関する特別報告書</b>を、2027年までに短寿命気候強制力因子（SLCF）の方法論報告書を提出することが決まりました。本の「5次にわたり公開」は、現在は<b>6次まで</b>に更新されています。<br><br>各選択肢について：<br>第5次が最新：第5次は2013〜2014年。第6次は2021〜2023年に公表済み<br>統合報告書は2021年：第6次の統合報告書は2023年3月。第7次はまだ未公表<br>特別報告書は作成しない：都市に関する特別報告書や方法論報告書が予定されている<br>2024年に公表済み：第7次の統合報告書は2029年後半までに提出予定<br><br>【出典】環境省「IPCC第60回総会の結果について」（2024年1月）、IPCC AR6 SYR（2023年3月） 確認日 2026-10-02"},
{"f": "法令・制度", "q": "GX推進法（脱炭素成長型経済構造への円滑な移行の推進に関する法律）に基づく排出量取引制度に関する記述として、最も適切なものはどれか。", "h": "届出の対象となる排出規模と、排出枠の扱いを確認する。", "c": ["二酸化炭素の排出量にかかわらず、国内の上場企業はすべて届出の対象となり、排出枠を保有する。", "排出目標量は、事業者が独自に設定し、登録確認機関など第三者の確認を受ける必要はない。", "届出事業者に割り当てられた排出枠は、投機目的の売買も含めて、市場で自由に取引できる。", "前3年度の平均排出量が10万トン以上の事業者は、毎年度、排出目標量等を経済産業大臣に届け出る。"], "a": 3, "v": "primary", "n": "<b>GX推進法（令和5年法律第32号）第33条</b>は、前3年度の二酸化炭素の<b>年度平均排出量が政令で定める量以上</b>の事業者に、毎年度、排出目標量等の<b>経済産業大臣への届出</b>を義務づけます。政令（施行令第2条）で定める量は<b>10万トン</b>です。<br><br>制度の流れ：<br>・届出前に、排出目標量の設定が適切であることについて<b>登録確認機関の確認</b>を受ける（第33条2項）<br>・経済産業大臣が<b>排出枠を無償で割り当てる</b>（第34条）<br>・割当年度の翌年度に<b>排出実績量を報告</b>（第35条）<br>・排出実績量に相当する量の排出枠を、割当年度の翌年度の<b>1月31日に保有</b>し、その量が償却される（第36条・第37条）<br><br>各選択肢について：<br>上場企業すべて：対象は排出量が10万トン以上の事業者<br>確認不要：登録確認機関の確認が必要<br>自由に取引：取引は可能だが、投機的取引の対象としてはならない（第38条2項）<br><br>発電事業者（特定事業者）に対する排出枠の有償割当と負担金は、第27条により<b>令和15年度（2033年度）から</b>です。<br><br>【出典】e-Gov法令検索「脱炭素成長型経済構造への円滑な移行の推進に関する法律」第27条・第33〜38条、同法施行令第2条 確認日 2026-10-02"},
{"f": "国際", "q": "COP30（2025年・ブラジル・ベレン）の結果に関する記述として、最も適切なものはどれか。", "h": "成果文書の名称と、適応分野の指標がどう決着したかを思い出す。", "c": ["各国に排出削減義務を課す法的拘束力のある新たな議定書が採択され、パリ協定に代わる枠組みとなった。", "適応に関する世界目標（GGA）の指標リストが全会一致で採択され、継続検討の議題は残らなかった。", "開催地はアゼルバイジャンのバクーで、新規合同数値目標（NCQG）が初めて合意され、適応資金も拡大された。", "適応資金について、2030年までに現行の10倍とする数値目標が義務として定められた。", "「グローバル・ムチラオ決定」が採択され、適応指標リストは完全な合意に至らず、翌年も継続検討となった。"], "a": 4, "v": "primary", "n": "COP30は<b>2025年11月10〜22日、ブラジル・パラー州ベレン</b>で開かれ、<b>パリ協定10周年</b>の節目でした。包括的なカバー決定<b>「グローバル・ムチラオ決定」</b>（ムチラオ＝協働の意）と各議題の決定は<b>「ベレン・ポリティカル・パッケージ」</b>と総称されます。<br><br>主な内容：<br>・適応に関する世界目標（GGA）：進捗を測る指標リストの採択は<b>完全な合意に至らず</b>、翌年も継続検討。2か年の「適応に関するベレン–アディスビジョン」を立上げ<br>・気候資金：NCQGの文脈で、適応資金を<b>2035年までに少なくとも3倍</b>にする努力を呼びかけ<br>・緩和：1.5度目標に向けた取組の加速を呼びかけ、「Global Implementation Accelerator」等の立上げを決定<br><br>各選択肢について：<br>新議定書：新たな法的拘束力のある文書は採択されていない<br>全会一致：指標リストは完全な合意に至らなかった<br>バクー・NCQG：バクーはCOP29の開催地で、NCQGはCOP29で合意<br>10倍・義務：3倍にする努力の呼びかけ（2035年まで）<br><br>【出典】環境省「国連気候変動枠組条約第30回締約国会議（COP30）の結果概要」 確認日 2026-10-02"},
{"f": "法令・制度", "q": "フロン類対策に関する法制度の沿革として、最も適切なものはどれか。", "h": "2001年の法律から、ライフサイクル全体を対象とする法律への流れを確認する。", "c": ["平成13年のフロン回収破壊法が現在まで一度も改正されずに運用され、フロン排出抑制法は存在しない。", "平成13年のフロン回収破壊法を平成25年に排出抑制法へ改正し、令和元年改正で廃棄時の回収率向上を図った。", "平成25年の改正は、廃棄時の回収と破壊のみに対象を絞り込み、使用段階の管理を外すものであった。", "令和元年の改正は、製造段階の規制の新設を主目的とし、廃棄時の回収率の向上は対象外とした。", "フロン排出抑制法は令和元年に初めて制定され、平成25年に旧法の改正は行われなかった。"], "a": 1, "v": "primary", "n": "環境省の資料によると、沿革は次のとおりです。<br>・<b>平成13年</b>：「特定製品に係るフロン類の回収及び破壊の実施の確保等に関する法律（フロン回収破壊法）」を制定<br>・<b>平成25年</b>：フロン類の<b>製造から使用、廃棄に至るライフサイクル全体</b>の包括的な対策のため、「フロン類の使用の合理化及び管理の適正化に関する法律（<b>フロン排出抑制法</b>）」に大幅改正（<b>平成27年4月施行</b>）<br>・<b>令和元年</b>：<b>廃棄時の回収率向上</b>のため一部改正（<b>令和2年4月施行</b>）<br>・令和7年3月末で改正法の施行後5年を迎え、中環審・産構審の合同会議で施行状況の評価と更なる排出抑制策が検討されています（令和8年）<br><br>各選択肢について：<br>改正されずに運用：回収破壊法は平成25年に排出抑制法へ改正された<br>回収と破壊のみ：ライフサイクル全体が対象<br>製造段階の規制が主目的：令和元年改正の目的は廃棄時の回収率向上<br>令和元年に初めて制定：制定ではなく、平成25年に改正された法律の一部改正<br><br>【出典】環境省 地球環境局「代替フロン等４ガスの排出削減に向けた進捗・課題と施策の方向性」（2026年6月、中環審・産構審合同会議資料） 確認日 2026-10-02"},
