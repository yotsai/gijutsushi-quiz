  n:"<b>約20kg</b>。CN⁻の総量は45mg/L×62,000L=2,790,000mg=2.79kgで、モル数は2.79kg÷26g/mol≒107.3mol。第1段階（NaCN+NaOCl→NaOCN+NaCl）ではCN⁻1molにNaOCl1molが必要なので107.3mol。第2段階（2NaOCN+3NaOCl+H2O→2CO2+N2+2NaOH+3NaCl）ではNaOCN:NaOCl=2:3なので、107.3mol×3/2≒161.0molが追加で必要。合計約268.3molのNaOClが必要で、質量は268.3mol×74.5g/mol≒19,990g≒20kg。〔R3-Ⅲ-8〕"},
 {f:"地球環境", q:"文部科学省・気象庁が作成した「日本の気候変動2020」が示す観測結果に関する記述のうち、最も適切なものはどれか。", h:"台風の発生数・接近数・上陸数の統計に、長期的な傾向があるかどうかに注目。",
  c:["台風の発生数、日本への接近数及び上陸数には、統計的に有意な長期的な増加・減少の変化傾向は見られない","台風の発生数は長期的に増加傾向にある","日本への台風の上陸数は長期的に減少傾向にある","台風の接近数は長期的に増加傾向にあり、上陸数もこれに伴い増加しているため、沿岸部の防災対策の見直しが進められている"], a:0, v:"answer",
  n:"<b>台風の発生数・接近数・上陸数には、統計期間を通じて長期的な変化傾向は見られない</b>（1年〜数十年規模の変動が卓越する）というのが「日本の気候変動2020」の結論。長期的な変化傾向が見られるとした記述は誤り。一方、真夏日・猛暑日・熱帯夜の日数増加、大雨・短時間強雨の頻度の有意な増加、日本沿岸の海水の酸性化傾向は、同報告書で実際に観測されている変化として記載されている。〔R3-Ⅲ-10〕"},
 {f:"測定・分析", q:"各種分析装置に関する記述のうち、最も適切なものはどれか。", h:"誘導結合プラズマ質量分析計（ICP-MS）の基本原理に注目。",
  c:["誘導結合プラズマ質量分析計（ICP-MS）は、プラズマでイオン化した元素を、質量電荷比に応じて分離・測定する装置である","蛍光X線分析計は、試料中の元素の化学的な存在形態（化合物としての結合状態）を直接測定する装置である","ガスクロマトグラフ（GC）は、常温で気体状の物質のみを測定対象とする装置である","イオンクロマトグラフ（IC）は、試料中の無機イオンのみを測定対象とし、有機酸イオン等は測定できない装置である"], a:0, v:"answer",
  n:"<b>ICP-MSは、誘導結合プラズマ中でイオン化した元素を質量電荷比（m/z）により分離・検出する装置</b>。蛍光X線分析計が測定するのは元素の存在量（濃度）であり、化合物としての結合状態（化学形態）までは分からない。GCは加熱気化させた試料を分析するもので、対象は常温で気体の物質に限らず、揮発性の液体・固体試料も気化させて測定できる。ICは無機イオンだけでなく有機酸イオン等の分析にも用いられる。〔R3-Ⅲ-13〕"},
 {f:"測定・分析", q:"大気環境基準物質の測定方法に関する記述のうち、最も適切なものはどれか。", h:"光化学オキシダント・SPM・CO・SO2それぞれの測定・校正方法の細かな規定に注意。",
  c:["光化学オキシダントは、紫外線吸収法又は化学発光法により得られたオゾン濃度をもって光化学オキシダント濃度としてよい","浮遊粒子状物質（SPM）は、粒径10μmの粒子を50%の割合で分離する分粒装置を通過したものを測定対象とする","一酸化炭素は不安定な物質であるため、標準ガスによる測定機器の校正はできない","二酸化硫黄の試料採取管には、塩化ビニルやゴム製の素材を使用できる"], a:0, v:"answer",
  n:"<b>光化学オキシダントは、紫外線吸収法又は化学発光法で得られたオゾン濃度をもって光化学オキシダント濃度としてよい</b>とされている。浮遊粒子状物質（SPM）の分粒装置は粒径10μmを超える粒子状物質を除去するもので、粒径の50%分離点を持たせる設計はPM2.5用分粒装置（50%分離径2.5μm）の特徴であり、SPMには当てはまらない。一酸化炭素は標準ガスによる校正が可能な安定した物質。二酸化硫黄の採取管には、SO2を吸着・反応してしまう塩化ビニルやゴムは使用できず、四フッ化エチレン樹脂等の不活性材質を用いる。〔R3-Ⅲ-15〕"},
 {f:"測定・分析", q:"「PM2.5成分測定マニュアル」の試料採取（分粒装置の流量制御など）に関する記述のうち、最も不適切なものはどれか。", h:"分粒装置の分粒特性は、大気温度・気圧の影響を受ける何流量によって決まるかに注目。",
  c:["PM2.5用の分粒装置は一定の質量流量で分粒特性が設計されているため、大気の吸引は常に質量流量計（マスフローメーター）のみで制御しなければならない","PM2.5の質量濃度測定では、PTFE製フィルタの秤量に際して静電気の除去が必要である","PM2.5の無機元素成分をICP-MS法で分析する際は、フィルタ試料を密閉容器中で酸分解する前処理を行う","PM2.5のイオン成分をイオンクロマトグラフ法で分析する際、PTFE等のフィルタを少量のエタノールで濡らして親水処理をしてから抽出する"], a:0, v:"answer",
  n:"PM2.5用分粒装置の分粒特性は、採取時の大気温度・気圧における<b>実際の体積流量（実流量）</b>によって決まる。マスフローコントローラ（質量流量制御）は広く使われているものの、出力設定条件（20℃・1気圧等）と分粒装置の設計条件が一致していないと分粒特性がずれる恐れがあり、質量流量だけで足りるとする記述は不適切。PTFEフィルタの静電気除去、ICP-MSによる酸分解前処理、エタノールによるフィルタの親水処理はいずれもマニュアルに記載された正しい手順。〔R3-Ⅲ-16〕"},
 {f:"法令・制度", q:"悪臭防止法の規制の仕組みに関する記述のうち、最も適切なものはどれか。", h:"都道府県知事等が定める規制基準の方式が、複数ある場合にどういう関係になるかに注目。",
  c:["臭気指数規制は、特定悪臭物質の濃度規制では捕捉できない複合臭や、規制対象になっていない未規制物質による臭気も捕捉できる","悪臭防止法では、都道府県知事等が特定悪臭物質濃度規制と臭気指数規制の両方の規制手法を必ず併用して規制基準を設定しなければならない","特定悪臭物質は、法律上、無機化合物のみに限定されている","臭気指数規制を採用している市区町村数は、全国の市区町村数の9割を超えている"], a:0, v:"answer",
  n:"<b>臭気指数規制は、特定悪臭物質だけでは捕捉できない複合臭や未規制物質による臭気も捕捉できる</b>のが特徴。都道府県知事等（市の区域は市長）は、規制地域の自然的・社会的条件を考慮して、特定悪臭物質濃度規制と臭気指数規制の<b>いずれか一方</b>を選択して規制基準を定めるのであり、両方の併用が義務付けられているわけではない。特定悪臭物質にはアンモニア等の無機化合物だけでなく、トルエン・アルデヒド類等の有機化合物も指定されている。臭気指数規制を導入している市区町村数は全国の3割に満たない。〔R3-Ⅲ-17〕"},
 {f:"測定・分析", q:"「低周波音問題対応の手引書」の評価指針で、低周波音による心身に係る苦情を評価する際、G特性音圧レベルが何dB以上であれば20Hz以下の超低周波音による苦情の可能性が考えられるとされているか。", h:"超低周波音は20Hz以下の低周波音を指します。",
  c:["92dB以上","70dB以上","110dB以上","85dB以上"], a:0, v:"answer",
  n:"<b>G特性音圧レベルが92dB以上であれば、20Hz以下の超低周波音による苦情の可能性が考えられる</b>とされている。値を低めに設定した選択肢や高めに設定した選択肢は、他の基準値と混同させる誤答。〔R3-Ⅲ-19〕"},
 {f:"測定・分析", q:"「底質調査方法」（環境省水・大気環境局）における強熱減量の測定方法として正しいものは。", h:"灼熱に耐えられる材質の器具を使う必要があります。",
  c:["磁器製のるつぼを用いる","ほうけい酸ガラス製のはかりびんを用いる","ポリエチレン製の容器を用いる","ステンレス製のバットを用いる"], a:0, v:"answer",
  n:"<b>強熱減量の測定には磁器製のるつぼを用いる</b>。ほうけい酸ガラス製のはかりびんは、強熱減量測定で行う高温の灼熱に耐えられないため使用できない。プラスチック製・金属製の容器も同様に高温灼熱には不向き。〔R3-Ⅲ-20〕"},
 {f:"化学物質", q:"環境省の化学物質環境実態調査（黒本調査）における生物モニタリング試料の生物種に求められる望ましい特徴として適切なものは。", h:"全国の複数地点で同じ条件で継続的に採取できることが重要です。",
  c:["物質を蓄積する性質があり、全生活史にわたって生活領域が明確で比較的狭く、日本各地に分布して採取が容易なこと","希少種であり、限られた特定の地域にのみ生息すること","季節ごとに広い範囲を移動する渡り性の高い種であること","化学物質を速やかに代謝・排出し、体内にほとんど蓄積しない種であることが望ましく、代謝速度の速い小型魚類が適する"], a:0, v:"answer",
  n:"<b>物質を蓄積する性質(生物濃縮性)があり、全生活史にわたって生活領域が明確で比較的狭く、日本各地に分布して採取が容易なことなどの特徴を持つ種が望ましいとされ、スズキやムラサキイガイなどが用いられている</b>。希少種や渡り性の高い種は全国で継続的に同条件で採取することが難しく不向きで、体内に蓄積しない種では残留状況を把握できない。〔R3-Ⅲ-22〕"},
 {f:"測定・分析", q:"JIS K 0124（高速液体クロマトグラフィー通則）における吸着クロマトグラフィーの移動相として一般的に用いられるのは。", h:"固定相には無機酸化物(シリカゲル等)が使われます。",
  c:["水に混和しない非極性の有機溶媒","水に混和可能な極性の高い有機溶媒","純水のみ","強アルカリ性の水溶液のみ"], a:0, v:"answer",
  n:"<b>吸着クロマトグラフィーは無機酸化物固定相による溶質の吸着平衡に基づく分離で、移動相には水に混和しない非極性の有機溶媒を用いるのが一般的</b>。水に混和可能な極性溶媒を移動相とするのは、オクタデシルシリル(ODS)等を固定相とする分配(逆相)クロマトグラフィーの説明であり、取り違えないよう注意したい。〔R3-Ⅲ-23〕"},
 {f:"化学物質", q:"要監視項目PFOS・PFOAの水質測定における試料の取扱いとして適切なものは。", h:"フッ素樹脂やガラスへの吸着・溶出が測定値に影響します。",
  c:["フッ素樹脂加工された器具等からPFOS・PFOAが溶出する可能性があるため、これらの器具は可能な限り使用しない","フッ素樹脂加工された器具を積極的に使用し、他の物質による汚染を防止し、洗浄にはガラス器具を用いることが定められている","試料水は必ずガラス瓶で採取し、ポリプロピレン瓶は使用しない","固相抽出を行う際は、試料水をアルカリ性に調整してから通水する"], a:0, v:"answer",
  n:"<b>PFOS・PFOAはフッ素樹脂加工された器具等から溶出する可能性があるため、これらの器具は可能な限り使用しない</b>。試料水はガラス瓶又はポリプロピレン瓶で採取するが、PFOS・PFOAはガラスに吸着する可能性があるためガラス製の使用は可能な限り避ける。固相抽出の際は試料水に希塩酸などを加えpHを3.5程度に調整するのが一般的で、アルカリ性にはしない。なお、公共用水域・地下水のPFOS・PFOAの指針値（合計50ng/L以下）は2025年6月30日付で暫定値から正式な指針値になった（要監視項目の位置づけは変わらない）。水道では2026年4月1日から水質基準になっている（環境省）。〔R3-Ⅲ-24〕"},
 {f:"自然環境", q:"長野県に位置し、2020年（令和2年）3月に指定された国定公園はどれか。", h:"隣接する南アルプスは古くからある国立公園です。",
  c:["中央アルプス国定公園","南アルプス国立公園","秩父多摩甲斐国立公園","妙高戸隠連山国立公園"], a:0, v:"answer",
  n:"<b>中央アルプス国定公園は2020年3月27日に指定された、当時57か所目の国定公園</b>。隣接する南アルプスは1964年指定の国立公園であり、名称が似ているため混同しやすいが指定区分が異なる。秩父多摩甲斐・妙高戸隠連山はいずれも国立公園。<br><br>環境省報道発表「57カ所目となる国定公園「中央アルプス国定公園」が誕生します。」〔R3-Ⅲ-26〕"},
 {f:"自然環境", q:"自然環境保全法に基づく自然環境保全地域の指定目的として適切なものは。", h:"自然公園法とは重視するものが異なります。",
  c:["人の活動の影響を受けていない原生の状態や、特に保全が必要な自然環境を、極力人為を加えずに保全すること","優れた自然の風景地を保護しつつ、その利用の増進を図ることを目的とし、レクリエーション利用が保全より優先される仕組みとなっている","地域住民のレクリエーション利用を積極的に推進すること","希少な野生動植物種の商業的な繁殖・流通を促進すること"], a:0, v:"answer",
  n:"<b>自然環境保全地域は、人の活動の影響を受けていない原生の状態などを、極力人為を加えずに保全することを目的とする</b>。「優れた自然の風景地を保護しつつ利用の増進を図る」のは自然公園法(国立公園等)の目的であり、自然環境保全地域は「保護と利用の両立」ではなく「保全」そのものに重点を置く点が異なる。（確認元：環境省）〔R3-Ⅲ-27〕"},
 {f:"法令・制度", q:"種の保存法の特定第二種国内希少野生動植物種に関する記述として適切なものは。", h:"規制対象となるのは、特定の「目的」を持った行為に限られます。",
  c:["販売又は頒布等を目的とした捕獲等・譲渡等が規制される一方、調査研究や環境教育、個人での愛玩飼育を目的とした捕獲等は規制の対象外である","捕獲・採取・譲渡など、目的を問わずあらゆる行為が全面的に禁止される","絶滅のおそれのある野生動植物の種の保存に関する法律とは別の法律に基づいて指定される区分であり、里地里山などの二次的自然に生息する身近な種を主な対象としている","指定と同時に、対象種の生息地が自動的に生息地等保護区に指定される"], a:0, v:"answer",
  n:"<b>特定第二種国内希少野生動植物種は、里地里山等の二次的自然に生息する種を主な対象に、販売・頒布等を目的とした捕獲等・譲渡等のみを規制する制度で、調査研究・環境教育・個人の愛玩飼育を目的とした捕獲等は規制対象外</b>。種の保存法(絶滅のおそれのある野生動植物の種の保存に関する法律)に基づく区分であり、生息地等保護区の指定は必要性が認められた種について別途行われるもので自動的ではない。<br><br>環境省「特定第二種国内希少野生動植物種の保全」で、販売・頒布目的の行為のみが規制対象と明記。〔R3-Ⅲ-28〕"},
 {f:"自然環境", q:"南西諸島の河口や汽水域の海岸に見られるマングローブ植物の樹高について、一般的な傾向として適切なものは。", h:"寒さへの耐性の強さが樹高に関わります。",
  c:["高緯度になるほど樹高が低くなる傾向があり、低木林となる","高緯度になるほど樹高が高くなる傾向があり、高木林となる","緯度による樹高の違いはほとんど見られない","マングローブ植物は分布域を問わず常に高木林を形成する"], a:0, v:"answer",
  n:"<b>マングローブ植物は一般に、分布の北限に近い高緯度になるほど低温への耐性の制約から樹高が低くなり、低木林となる傾向がある</b>。南西諸島の中でも南に位置する地域ほど、高木のマングローブ林が発達しやすい。〔R3-Ⅲ-29〕"},
 {f:"生物多様性", q:"環境省レッドリストの絶滅危惧カテゴリーの定義として適切なものは。", h:"絶滅危惧Ⅰ類はさらにIA類・IB類に細分されます。",
  c:["絶滅危惧Ⅰ類はごく近い将来における野生での絶滅の危険性が極めて高い(またはそれに準じ近い将来危険性が高い)種を指し、絶滅危惧Ⅱ類は絶滅の危険が増大している種を指す","絶滅危惧Ⅰ類・Ⅱ類はいずれも、ごく近い将来における野生での絶滅の危険性が極めて高い種を指し、両者に定義上の違いはなく、いずれも同一の保全策・保護増殖事業が適用される","絶滅危惧Ⅱ類の方が、絶滅危惧Ⅰ類よりも絶滅の危険性が高いカテゴリーである","絶滅危惧Ⅰ類・Ⅱ類は、個体数ではなく生息地の面積のみを基準に区分される"], a:0, v:"answer",
  n:"<b>絶滅危惧Ⅰ類(IA類・IB類)はごく近い将来(またはそれに準じ近い将来)における野生での絶滅の危険性が高い種、絶滅危惧Ⅱ類は絶滅の危険が増大している種と定義される</b>。Ⅱ類の定義を「近い将来における危険性が高い種」とする記述は、実際にはⅠ類の中のIB類の定義に近く、取り違えやすい。危険度はⅠ類の方がⅡ類より高い。〔R3-Ⅲ-31〕"},
 {f:"自然環境", q:"定期的な草刈りが行われる道路・鉄道路線・河川堤防の法面に、セイタカアワダチソウ・オオブタクサ・セイバンモロコシなどの大型外来植物が優占しやすい主な理由として適切なものは。", h:"頻繁な刈り取りという撹乱への適応性が関係します。",
  c:["繰り返される刈り取りという撹乱に適応し、撹乱後にいち早く再生・拡大する速い成長力を持つため","法面の土壌が極端に貧栄養であり、貧栄養への耐性に優れるため、施肥を行わない法面ほど優占しやすい","在来植物より草丈が低く、刈り取りの影響を受けにくいため","刈り取り機械の力を借りなければ種子が発芽しない性質を持つため"], a:0, v:"answer",
  n:"<b>これらの大型外来植物は、繰り返される刈り取りという撹乱に適応し、撹乱後にいち早く再生・拡大する速い成長力を持つ(撹乱依存性が高い)ため優占しやすい</b>。法面の土壌は必ずしも貧栄養ではなく、これらの植物はむしろ肥沃な立地でも旺盛に繁茂する。いずれも大型で背が高い植物である点にも注意したい。〔R3-Ⅲ-32〕"},
 {f:"自然環境", q:"国定公園の特別地域内で工作物の新築、樹木の伐採、土地の形状変更等の行為を行おうとする場合の許可権者は。", h:"国立公園の場合と許可権者が異なります。",
  c:["都道府県知事","環境大臣","市町村長","環境大臣及び都道府県知事の両方の許可"], a:0, v:"answer",
  n:"<b>国定公園の特別地域内における行為の許可権者は都道府県知事</b>。国立公園の特別地域・特別保護地区内における同様の行為は環境大臣の許可が必要であり、国立公園と国定公園とで許可権者が異なる点が問われやすい。〔R3-Ⅲ-33〕"},
 {f:"法令・制度", q:"奄美大島における特定外来生物フイリマングースの防除の到達状況として適切なものは。", h:"2000年から本格化した防除の成果です。",
  c:["2000年から本格化した防除事業の結果、環境省は2024年9月にフイリマングースの根絶を宣言した","マングースの捕獲数は近年も増加を続けており、根絶のめどは立っていない","奄美大島でのマングース対策は2010年代に終了し、現在は防除を行っておらず、その後の生息状況の変化も特に報告されていない","フイリマングースは特定外来生物に指定されておらず、法的な防除の根拠がない"], a:0, v:"answer",
  n:"<b>環境省は2000年から本格化した防除事業(累計約3万2千匹を捕獲)の結果、2024年9月3日に奄美大島におけるフイリマングースの根絶を宣言した</b>。面積の大きな島における大型哺乳類の根絶事例としては世界的にも類のない規模とされる。<br><br>環境省報道発表「奄美大島における特定外来生物フイリマングースの根絶の宣言について」（出題当時(令和3年)は「捕獲のない状態が続き根絶の可能性が高まっている」段階だったが、現在は根絶宣言済み）〔R3-Ⅲ-35〕"},
 {f:"自然環境", q:"全国的な観点から自然環境の現状や変化を把握し、自然環境保全施策の基礎資料を得るために国が実施している「自然環境保全基礎調査」の法的根拠は？", h:"生物多様性に関する基本理念を定めた法律と混同させる選択肢に注意。",
  c:["自然環境保全法（基礎調査に関する規定）","生物多様性基本法（平成20年制定で、環境政策全般の基本理念を定める法律）","自然公園法","種の保存法"], a:0, v:"answer",
  n:"<b>自然環境保全法第4条</b>（国はおおむね5年ごとに地形・地質・植生・野生動物等の基礎調査を行うよう努める、との規定）に基づき、昭和48年度から実施されている。生物多様性基本法（平成20年制定）を根拠と取り違えさせる選択肢が過去問に登場した。〔R5-Ⅲ-27〕"},
 {f:"地球環境", q:"日本の温室効果ガスインベントリを「分野」（エネルギー、工業プロセス及び製品の使用、農業、廃棄物等）で区分したとき、排出量が最大の分野とその内容の組合せとして正しいのは？", h:"各分野が具体的にどんな排出活動を指すかをイメージしてみる。",
  c:["エネルギー分野（燃料の燃焼に伴うCO2排出等）が最大で、工業プロセス及び製品の使用分野が続く","工業プロセス及び製品の使用分野が最大で、エネルギー分野が続き、この順位は年度によって入れ替わる","農業分野が最大で、廃棄物分野が続く","廃棄物分野が最大で、エネルギー分野が続く"], a:0, v:"answer",
  n:"<b>エネルギー分野</b>（燃料の燃焼に伴うCO2排出が中心）が毎年8割超を占めて突出して最大で、2位は<b>工業プロセス及び製品の使用分野</b>。この分野間の大小関係は年度が変わっても安定しているが、ガス別の細かい順位（CO2の次にどのガスが多いか等）は年度によって入れ替わることがあるため丸暗記は禁物。〔R6-Ⅲ-1〕"},
 {f:"大気・水質", q:"公共用水域の水質汚濁（BOD・COD、全窒素・全りん）の環境基準達成率に見られる一般的な傾向として正しいのは？", h:"水の入れ替わりにくさが汚濁の蓄積しやすさに関わる。",
  c:["閉鎖性の高い内湾・湖沼は水が滞留しやすく汚濁が蓄積しやすいため、外洋や河川に比べて達成率が低い傾向が続いている","閉鎖性の高い内湾・湖沼は外部からの汚濁流入が少ないため、外洋より達成率が高い傾向にあり、近年その差はさらに拡大している","達成率は閉鎖性の有無に関係なく、水域の面積のみで決まる","BOD・CODは全国一律の基準のため、水域による達成率の差はほとんど生じない"], a:0, v:"answer",
  n:"<b>閉鎖性水域</b>（東京湾・伊勢湾・瀬戸内海などの内湾や湖沼）は水の滞留時間が長く汚濁物質が蓄積しやすいため、外洋に開けた海域や河川に比べてBOD・COD、全窒素・全りんの環境基準達成率が低い傾向が続いている。具体的な達成率（%）は白書の年度ごとに変わるため数値そのものは覚えず、「閉鎖性水域ほど達成率が低い」という構造を押さえる。〔R6-Ⅲ-5〕"},
 {f:"法令・制度", q:"浄化槽法の一部改正（令和元年法律第40号、令和2年4月施行）で新設された「浄化槽処理促進区域」制度の運用に関し、都道府県知事に対して助言・情報提供等の支援を行うよう努めることとされたのは？", h:"浄化槽行政を所管する省庁はどこかを考える。",
  c:["環境大臣","国土交通大臣","経済産業大臣","厚生労働大臣"], a:0, v:"answer",
  n:"浄化槽の所管は<b>環境省</b>であり、改正浄化槽法では<b>環境大臣</b>が都道府県知事に対し、浄化槽処理促進区域の運用等に関する助言・情報の提供その他の支援を行うよう努めることとされた。下水道を所管する国土交通大臣と取り違えさせる選択肢が過去問に登場した。〔R6-Ⅲ-6〕"},
 {f:"自然環境", q:"「自然環境保全基礎調査マスタープラン」（令和5年3月、環境省自然環境局生物多様性センター）における「種の分布調査」の調査対象として正しいのは？", h:"海の生き物までまるごと含むかどうかがポイント。",
  c:["陸生動物の哺乳類・鳥類・両生類・爬虫類・淡水魚類・昆虫類・陸産及び淡水産の貝類、および植物が対象","陸生動物に加え海生の哺乳類・魚類・貝類も含めた、あらゆる動植物が対象であり、海洋保護区の設定状況とあわせて調査される","哺乳類と鳥類のみが対象で、魚類・貝類・植物は対象外","対象とする分類群を定めず、その都度調査ごとに決める"], a:0, v:"answer",
  n:"「種の分布調査」は<b>陸生動物</b>の哺乳類・鳥類・両生類・爬虫類・<b>淡水</b>魚類・昆虫類・陸産及び<b>淡水産</b>の貝類、および植物を調査項目とする（環境省「自然環境保全基礎調査マスタープラン」令和5年3月）。海生の魚類・貝類まで含むかのように書いて誤答に誘導する選択肢が過去問に登場した。〔R6-Ⅲ-27〕"},

 {f:"大気・水質", q:"エチレン（C2H4）1 m³ を完全燃焼させるのに必要な理論酸素量は？", h:"化学反応式の係数から体積比を読みます。気体どうしの体積比は物質量比と等しくなります。",
  c:["2.5 m³","4.0 m³","3.0 m³","2.0 m³"], a:2, v:"answer",
  n:"C2H4 + 3O2 → 2CO2 + 2H2O より<b>3.0 m³</b>。理論燃焼ガス量は二酸化炭素2.0＋水蒸気2.0。ほか水素0.5、一酸化炭素0.5、メタン2.0、アセチレン（C2H2）2.5。エチレンの理論酸素量を4.0とした選択肢が過去問に登場した。〔R1-Ⅲ-1〕"},

 {f:"一般廃棄物", q:"含水率95%の汚泥を脱水して含水比400%の脱水ケーキにしたとき、脱水後の体積は脱水前の何倍か。汚泥・ケーキの比重はいずれも1とし、固形分は脱水で失われないものとする。", h:"含水率と含水比は分母が違います。まず固形分を基準にそろえます。",
  c:["0.20","0.05","0.50","0.25"], a:3, v:"answer",
  n:"含水比＝水分÷固形分、含水率＝水分÷（水分＋固形分）。含水比400%は含水率80%。汚泥100に固形分5、ケーキは固形分5÷0.2＝25。体積比は<b>5÷20＝0.25</b>。〔R2-Ⅲ-7〕"},

 {f:"一般廃棄物", q:"含水率98%の汚泥を脱水して含水比400%の脱水ケーキにしたとき、脱水後の体積は脱水前の何倍か。比重は1、固形分は脱水で失われないものとする。", h:"固形分の割合が変わらないことに着目します。",
  c:["0.02","0.10","0.25","0.05"], a:1, v:"answer",
  n:"含水比400%は含水率80%（固形分20%）。汚泥100に固形分2なので、ケーキは2÷0.2＝10。体積比は<b>2÷20＝0.10</b>。含水率95%なら0.25になる（固形分率の比 5÷20）。〔R6-Ⅲ-7〕"},

 {f:"大気・水質", q:"公共用水域の水質環境基準で、CODが基準項目となる「湖沼」の定義と、類型別のCOD基準値の組合せは？", h:"貯水量と滞留時間の両方の要件があります。数値は類型ごとに段階的に緩くなります。",
  c:["貯水量500万m³以上・滞留7日以上で、AAは1、Aは3、Bは5 mg/L以下","貯水量1,000万m³以上・滞留4日以上で、AAは2、Aは3、Bは6 mg/L以下","貯水量500万m³以上・滞留4日以上で、AAは1、Aは2、Bは4 mg/L以下","貯水量1,000万m³以上・滞留4日以上で、AAは1、Aは3、Bは5 mg/L以下"], a:3, v:"answer",
  n:"湖沼は天然湖沼＋<b>貯水量1,000万m³以上かつ滞留4日以上</b>の人工湖。COD基準値は<b>AA 1／A 3／B 5 mg/L以下</b>（C類型は8）。これ未満の人工湖や河川はBODで評価する。〔R3-Ⅲ-5、R6-Ⅲ-8〕"},

 {f:"地球環境", q:"CCSとCCUSの関係を述べた記述として正しいものは？", h:"頭文字のU（Utilization）が何を指すかを手がかりにします。",
  c:["CCSは回収・有効利用・貯留の3工程を含む語で、CCUSは貯留せず利用だけを行うもの","CCSは大気中のCO2を直接回収する技術で、排ガス由来のものはCCUSと呼ぶ","CCSはCO2を回収して貯留する技術で、有効利用まで含めたものがCCUS","CCSは火力発電所に限った技術で、バイオマス由来のCO2を扱うものがCCUSと呼ぶ"], a:2, v:"answer",
  n:"CCSは<b>回収（Capture）・貯留（Storage）</b>、これに<b>有効利用（Utilization）</b>を加えたものがCCUS。「CCSは分離・貯留し有効利用するもの」と書いて誤りにした選択肢が2回出ている。BECCSはバイオマス燃焼で出るCO2を回収・貯留して大気中のCO2を除去する技術、ZEBは年間の一次エネルギー収支ゼロを目指す建築物、JCMは削減成果を両国で分け合う二国間クレジット制度。〔R3-Ⅲ-3、R6-Ⅲ-4〕"},

 {f:"自然環境", q:"生態系を活用した防災・減災（Eco-DRR）と、堤防などの人工構造物による防災対策との関係についての考え方は？", h:"どちらか一方を選ぶ発想かどうかを考えます。",
  c:["両者は同時に併用しにくいため、地域の特性に応じてどちらかを選び分ける","人工構造物を整備した地域では、生態系を活用した防災は不要になる","両者を組み合わせて併用し、地域の特性に応じて役割を補い合わせる","生態系の活用は低頻度の大規模災害に、人工構造物は日常の災害に限って用いる"], a:2, v:"answer",
  n:"Eco-DRRと人工構造物（グレーインフラ）は<b>対立せず併用できる</b>。地域特性に応じて組み合わせるのが基本。「併用が難しいので使い分ける」とした選択肢が2回続けて「最も不適切」の正解だった。ほか、生態系を基盤とした防災は新しい概念ではないこと、多様なステークホルダーの参画で総合的な地域づくりの視点が必要なこと、平時は水環境の保全や資源採集・レクリエーションの場として福利に貢献することは正しい。〔R3-Ⅲ-25、R5-Ⅲ-25〕"},

 {f:"測定・分析", q:"赤外分光法とラマン分光法で、スペクトルが現れる原理の組合せとして正しいものは？", h:"分子振動に伴って変化する物理量が、それぞれ異なります。",
  c:["赤外吸収もラマン散乱も、分子振動に伴う双極子モーメントの変化により生じる","赤外吸収は分極率の変化、ラマン散乱は双極子モーメントの変化により生じる","赤外吸収もラマン散乱も、分子振動に伴う分極率の変化により生じる","赤外吸収は双極子モーメントの変化、ラマン散乱は分極率の変化により生じる"], a:3, v:"answer",
  n:"<b>赤外＝双極子モーメントの変化、ラマン＝分極率の変化</b>。両者は補完的で、対称性の高い分子の対称伸縮などは赤外で不活性でもラマンで観測される。赤外分光に使う波長は2.5〜25μmの中赤外線。未知のプラスチック試料はまず赤外分光（IR）で定性するのが一般的。この2つを入れ替えた選択肢が過去問に登場した。〔R3-Ⅲ-21〕"},

 {f:"測定・分析", q:"LC/MSに関する記述として正しいものは？", h:"GC/MSとの前処理の違いを思い出します。",
  c:["難揮発性の化合物は検出しにくいため、誘導体化で揮発性を高めて測定するのが一般的","イオン化にはエレクトロスプレーイオン化法と大気圧化学イオン化法が一般的に用いられる","移動相のpH調整にはリン酸塩緩衝液が最もよく使われ、揮発性の酸や塩基は避けられる","タンデム型（LC/MS/MS）は選択性が低いため、定量には単一の質量分析計が好まれる"], a:1, v:"answer",
  n:"LC/MSのイオン化は<b>ESIとAPCI</b>が一般的。移動相のpH調整にはギ酸・酢酸・アンモニアなど揮発性のものを使い、選択性向上のためLC/MS/MSがよく使われる。<b>難揮発性でも測れる</b>のがLCの利点で、誘導体化で揮発性を上げるのはGC/MSの前処理。〔R5-Ⅲ-22〕"},

 {f:"測定・分析", q:"濃度の単位ppmの次元として正しいものは？", h:"ppmは「100万分の1」を表します。何の比かを考えます。",
  c:["mol／m³","kg／m³","mol／kg","無次元（比）"], a:3, v:"answer",
  n:"ppmは同種の量の比（質量比・体積比）で<b>無次元</b>。mol/m³はモル濃度（M＝mol/L）の次元で、ppmとは別物。ppmの次元をmol/m³とした選択肢が「最も不適切」の正解だった。ほか圧力（Pa）はN/m²、電気伝導率（S/m）は(A/V)/m、放射能（Bq）と周波数（Hz）はs⁻¹で正しい。〔R3-Ⅲ-14〕"},

 {f:"測定・分析", q:"熱量（エネルギー）の単位J（ジュール）を、SI基本単位で表したものは？", h:"J＝N・mです。力の単位Nを基本単位に分解します。",
  c:["kg・K","kg・m・s⁻²","kg・m⁻¹・s⁻²","kg・m²・s⁻²"], a:3, v:"answer",
  n:"1 J＝1 N・m＝<b>kg・m²・s⁻²</b>（1 cal≒4.184 J）。「熱量（cal）はkg K」とした選択肢が誤り。kg・m・s⁻²はN、kg・m⁻¹・s⁻²はPa。ほか電子ボルト（eV）はC・V、気圧（atm）はN・m⁻²、電気伝導度（S）はA・V⁻¹、モル濃度（M）はmol・m⁻³で正しい。〔R6-Ⅲ-19〕"},

 {f:"地球環境", q:"オゾンに関する記述として正しいものは？", h:"オゾン層がどの圏にあるか、まず位置を確認します。",
  c:["対流圏のオゾン濃度は成層圏よりはるかに高く、オゾン層は対流圏に位置する","一酸化二窒素（N2O）は対流圏で速やかに分解されるため、オゾン層破壊に関与しない","オゾンの大部分は成層圏にあり、フロン類の分解で生じる塩素原子により破壊される","南極オゾンホールは、南極域で一年を通じて同程度の濃度低下が続く現象である"], a:2, v:"answer",
  n:"オゾンは<b>成層圏に多く</b>（オゾン層）、対流圏の濃度は成層圏よりはるかに低い。南極オゾンホールは南極極渦内で春先（10月頃）に著しい濃度低下を示す。N2Oは対流圏で分解されず成層圏に運ばれ、オゾン層破壊の原因物質になる。「対流圏のオゾン濃度は成層圏よりはるかに高い」と書いた選択肢が誤りだった。〔R1-Ⅲ-2〕"},

 {f:"測定・分析", q:"地球観測衛星が観測に使う電磁波について、正しいものは？", h:"波長が短すぎる電磁波は、地表に届く前に大気に吸収されます。",
  c:["使用するのは、X線からマイクロ波にわたる広い波長帯である","使用するのは、可視光線とマイクロ波の2つの波長帯に限られる","使用するのは、紫外線から赤外線までで、マイクロ波は使えない","主にX線を除く、紫外線からマイクロ波にわたる波長帯を使う"], a:3, v:"answer",
  n:"電磁波は波長の短い順にγ線・X線・紫外線・可視光線・赤外線・マイクロ波。γ線やX線は大気に吸収され、衛星観測には使われない（<b>X線は使わない</b>）。衛星は反射・放射された電磁波を捉えるほか、重力や磁力も使う。いぶきはCO2・メタンなどの温室効果ガスを観測。極軌道と静止軌道の2種類がある。〔R1-Ⅲ-14〕"},

 {f:"生物多様性", q:"シュレーゲルアオガエルの産卵場所として正しいものは？", h:"同じ「アオガエル」でも、モリアオガエルとは産む場所が違います。",
  c:["水面上に伸びた樹の枝や葉に、泡状の卵塊を産みつける","水田の畦の土中に穴を掘り、泡状の卵塊を産みつける","水中の水草に、紐状の卵塊を絡めて産みつける","落ち葉の下の湿った地面に、1個ずつ卵を産みつける"], a:1, v:"answer",
  n:"シュレーゲルアオガエルは<b>水田の畦など水際の土中</b>に泡状卵塊を産む。樹上産卵（水面上の枝・葉）を行うのはモリアオガエル。両者の産卵場所を取り替えた選択肢が過去問に登場した。ほか、カヤネズミの球状巣の巣材はススキ・オギなどのイネ科植物、フクロウは樹洞に産卵、オオムラサキの越冬幼虫はエノキの根際の落ち葉の中、アマモ場は浅海の生物多様性に重要、はいずれも正しい。〔R1-Ⅲ-29〕"},

 {f:"大気・水質", q:"黄砂について、正しい記述は？", h:"粒子の大きさと、飛来途中での他の物質との混合に着目します。",
  c:["飛来する粒子は粒径10μm以上が多く、PM2.5の測定値には影響しない","土壌起源の物質に加え、硫酸イオンなど人為起源の物質も検出される","自然現象にすぎず、森林減少や砂漠化との関連は認識されていない","氷河期には氷に覆われる陸地が減るため、黄砂の発生頻度は上がる"], a:1, v:"answer",
  n:"黄砂粒子は造岩鉱物・粘土鉱物などの土壌起源が主だが、<b>アンモニウム・硫酸・硝酸イオンなど人為起源の大気汚染物質も検出</b>される。微小粒子もありPM2.5に影響し得る。森林減少・土地の劣化・砂漠化などの人為的影響と越境環境問題として認識が高まっている。氷河期は氷に覆われる陸地が増え、黄砂の規模と頻度は低下する。〔R2-Ⅲ-2〕"},

 {f:"国際", q:"持続可能な開発目標（SDGs）の位置づけとして正しいのは？", h:"2000年に採択された国際目標の名前を思い出します。",
  c:["アジェンダ21（地球サミットの行動計画）の後継として採択された","ミレニアム開発目標（MDGs）の後継として採択された","国連人間環境会議（ストックホルム会議）の後継として採択された","京都議定書（第一約束期間の枠組み）の後継として採択された"], a:1, v:"answer",
  n:"SDGsは2015年9月の国連サミットで採択された「2030アジェンダ」に記載された2030年までの目標で、<b>MDGs（ミレニアム開発目標）の後継</b>。アジェンダ21は1992年の地球サミットの行動計画で、後継ではない。先進国自身も取り組む普遍的な目標。2020年1月に「行動の10年」が開始された。〔R2-Ⅲ-9〕"},

 {f:"測定・分析", q:"ガスクロマトグラフィーで、同じ保持時間のピーク幅が小さいほど、理論段数はどうなるか。", h:"理論段数はカラムの効率（分離の良さ）を表す指標です。",
  c:["大きくなる","小さくなる","変わらない","保持時間と無関係に決まる"], a:0, v:"answer",
  n:"理論段数 N＝16×（保持時間÷ピーク幅）²。同じ保持時間ならピーク幅が小さいほど<b>理論段数は大きく</b>、カラム効率が高い。「小さくなる」とした選択肢が誤り。ほかデコンボリューションは重複ピークを成分ごとに分ける操作、保持指標は直鎖アルカンで算出する、GC-GCはハートカット方式でGC×GCは全領域を連続して2次元に展開する。〔R4-Ⅲ-16〕"},

 {f:"自然環境", q:"日本芝（Zoysia属）の特徴として正しいものは？", h:"西洋芝は常緑の寒地型、日本芝は暖地型です。",
  c:["常緑性で、種子から容易に新設でき、経費と労力が少ない","常緑性で、踏圧に弱く、公園の園路脇には向かない","冬季に地上部が枯れて休眠する匍匐型で、踏圧に強い","冬季に最も旺盛に生育し、夏季に休眠する"], a:2, v:"answer",
  n:"日本芝は暖地型で、<b>冬季に地上部が枯れて休眠</b>し、匍匐型で踏圧に強い。種子繁殖は難しく、張り芝などで新設するため西洋芝より経費と労力がかかる。「常緑性・種子繁殖が容易」とした記述が誤りだった。ほかハーディネスゾーンは年最低気温の平均値で温度帯を区分、地域性種苗は市町村以下の地域スケールで原産地が特定された種苗、トウネズミモチは重点対策外来種、クビアカツヤカミキリはサクラ類の害虫。〔R4-Ⅲ-29〕"},

 {f:"自然環境", q:"外来種の侵入の段階と、根絶を目指す防除に最も効果的な時期の組合せは？", h:"個体数が少ないうちは、対象を探し出しやすいかどうかより、広がっていないことが重要です。",
  c:["まん延期に、捕獲効率が高くなってから行う","分布拡大期に、地域の合意を待って行う","まん延期の後に、個体数が安定してから行う","定着初期の、分布がまだ小さいうちに行う"], a:3, v:"answer",
  n:"外来種の侵入は定着初期・分布拡大期・まん延期と進み、根絶を目指す防除は<b>定着初期（早期発見・早期対応）</b>が最も効果的。まん延期は費用も労力も膨らみ根絶が難しい。「捕獲効率が高いまん延期に行う」とした選択肢が誤りだった。生息地の分断化は広い面積を要する高次捕食者ほど影響が大きい。人工光は走光性の種（ガ類・タガメ）を誘引する光害。〔R4-Ⅲ-31〕"},

 {f:"地球環境", q:"地球温暖化対策推進法が対象とする温室効果ガスに含まれないものは？", h:"7種類の中に、大気汚染の原因となる物質は含まれません。",
  c:["六ふっ化硫黄（SF6）","三ふっ化窒素（NF3）","二酸化硫黄（SO2）","パーフルオロカーボン類（PFCs）"], a:2, v:"answer",
  n:"対象は二酸化炭素・メタン・一酸化二窒素・HFCs・PFCs・六ふっ化硫黄（SF6）・三ふっ化窒素（NF3）の<b>7種類</b>。二酸化硫黄（SO2）は含まれない（大気汚染物質、冷却効果のあるエアロゾル前駆体）。〔R5-Ⅲ-2〕"},

 {f:"化学物質", q:"PFOS・PFOAに関する指針値（暫定）の考え方として正しいものは？", h:"2種類の物質を、別々に評価するか、合わせて評価するかがポイントです。",
  c:["PFOSとPFOAの合算値として、0.00005 mg/L以下","PFOSとPFOAそれぞれについて、0.00005 mg/L以下","PFOSは0.00005 mg/L以下、PFOAは0.0005 mg/L以下","PFOSのみ対象とし、PFOAは対象としない"], a:0, v:"answer",
  n:"指針値（暫定）は<b>PFOSとPFOAの合算値として0.00005 mg/L（50 ng/L）以下</b>。それぞれについてとした選択肢が誤り。分析はエレクトロスプレーイオン化法（負イオンモード）、採水容器はガラスを避けて事前にメタノールで洗浄、直鎖体と分岐異性体を分離して測定するのが望ましい。〔R5-Ⅲ-23〕"},

 {f:"自然環境", q:"沿岸域の一次生産者に関する記述として正しいものは？", h:"陸上と同様に、維管束植物も沿岸の一次生産を担っています。",
  c:["植物プランクトンと藻類だけで、維管束植物は寄与しない","主要な一次生産者は、植物プランクトンと造礁性サンゴ類の2つに限られる","植物プランクトンや藻類に加え、海草（アマモなど）も一次生産に寄与する","一次生産は有光層より深い層で行われる"], a:2, v:"answer",
  n:"沿岸域の一次生産者は植物プランクトン・底生性微細藻類・コンブやワカメなどの藻類に加え、<b>アマモなどの海草（維管束植物）</b>や塩性湿地植物も含む。「維管束植物は寄与していない」とした選択肢が誤りだった。有光層は外洋で150〜200m、内湾ではその数分の1〜10分の1。P/B比は陸上より海洋の方がはるかに高い。熱水噴出孔生態系は化学合成細菌が生産者。〔R5-Ⅲ-28〕"},

 {f:"自然環境", q:"生物多様性に配慮した緑化の方法として、不適切なものは？", h:"地域の遺伝的多様性を損なうおそれのある材料に注意します。",
  c:["地域性種苗を用いた植生工","森林表土利用工","周辺植生からの飛来種子を利用する自然侵入促進工","外来牧草種子による早期全面緑化"], a:3, v:"answer",
  n:"外来牧草の早期全面緑化は在来植生の回復を妨げ、<b>生物多様性に配慮した方法に当たらない</b>。配慮した方法は地域性種苗、森林表土利用工、自然侵入促進工、湿地での埋土種子集団の利用など。再生事業の工事段階では地学的条件を整えた後に初期植生を導入する。潜在自然植生は応用面で植栽種の把握や土地利用計画に使われる。〔R5-Ⅲ-31〕"},

 {f:"生物多様性", q:"落葉広葉樹林の林床に生育するスプリング・エフェメラルの生活史として正しいものは？", h:"高木の葉が開く前に、林床に光が届く季節を考えます。",
  c:["春先の明るい林床で成長し、初夏までに地上部が枯れる","夏から秋にかけて地上部が成長し、冬に枯れる","一年を通じて地上部を保ち、冬季も成長を続ける","高木の葉が茂った夏の暗い林床で最も旺盛に成長する"], a:0, v:"answer",
  n:"カタクリなどのスプリング・エフェメラル（春の儚い植物）は、高木が葉を広げる前の<b>春先の明るい林床で成長・開花</b>し、初夏には地上部が枯れる。「夏から秋に成長し冬に枯れる」とした記述が誤りだった。日本の維管束植物は約6,000種近く（亜種・変種を含め8,000種以上）、固有種は約2,900種。〔R6-Ⅲ-31〕"},

 {f:"測定・分析", q:"JIS K 0050の分類で、「光分析」（光の放射・吸収・散乱などを利用する分析）に含まれる方法の組合せは？", h:"X線や質量分析は、光分析とは別の区分（電磁気的特性を作用させる分析）に入ります。",
  c:["赤外分光分析・ラマン分光分析・原子吸光分析","蛍光X線分析・赤外分光分析・原子吸光分析","核磁気共鳴分析・質量分析・蛍光X線分析","電量滴定・電気伝導率測定・容量分析"], a:0, v:"answer",
  n:"光分析は、紫外・可視、赤外、近赤外、ラマン、蛍光光度、原子吸光、炎光光度、発光分光（ICP・スパーク）、化学発光など。<b>蛍光X線分析は光分析ではなく電磁気分析</b>（電子線マイクロアナリシス・NMR・ESR・質量分析・放射化分析も同じ区分）。「光分析に赤外分光と蛍光X線が含まれる」とした選択肢が2年続けて「最も不適切」の正解。ICP発光分光は光分析、ICP質量分析は質量分析で電磁気分析。容量分析は滴定液の体積から、沈殿重量分析は沈殿の質量から定量する。〔R2-Ⅲ-14、R5-Ⅲ-18〕"},

 {f:"一般廃棄物", q:"災害廃棄物処理計画を、平時に策定する主体として正しいものは？", h:"国の役割は、計画そのものでなく指針の側にあります。",
  c:["国（環境省）が、全国の災害廃棄物の処理計画を一括して策定する","都道府県と市町村などの地方公共団体が、それぞれ策定する","発災後に、環境大臣が被災地ごとに策定する","廃棄物処理業者の団体が、地域ごとに策定する"], a:1, v:"answer",
  n:"災害廃棄物処理計画は、<b>平時に地方公共団体（都道府県・市町村）が策定</b>する。国は、災害廃棄物対策指針や、大規模災害発生時における災害廃棄物対策行動指針（平成27年11月）を策定する。発災後に地方公共団体が定めるのは災害廃棄物処理実行計画。地域ブロック協議会は、地方環境事務所が中心となって設置している。「国が平時に策定する」とした選択肢が誤りだった。〔R6-Ⅲ-11〕"},

 {f:"国際", q:"パリ協定における「適応」の位置づけとして正しいものは？", h:"緩和の2℃・1.5℃のような、数値の目標があるかどうかを考えます。",
  c:["緩和と同様に、世界共通の数値目標が明確に定められている","適応については、世界全体の目標が一切定められていない","適応に関する世界全体の目標はあるが、数値目標はない","適応は先進国のみの義務で、途上国には目標が課されない"], a:2, v:"answer",
  n:"第7条1項は<b>適応に関する世界全体の目標</b>（適応能力の向上、強靱性の強化、ぜい弱性の減少）を定めるが、緩和の2℃・1.5℃のような数値目標ではない。COP28（2023年）で「UAEフレームワーク」が採択され、分野別の適応目標が設定された。SDGs目標13のターゲット13.1は、気候関連災害に対する強靱性と適応力の強化。気候変動適応法は令和5年4月に改正されている。〔R6-Ⅲ-2〕"},

 {f:"地球環境", q:"短寿命気候強制因子のうち、ブラックカーボン・メタン・対流圏オゾンの放射強制力の符号の組合せは？", h:"これらは地表を冷やす物質か、暖める物質かを考えます。",
  c:["ブラックカーボンは負、メタンは正、対流圏オゾンは負","すべて負（寒冷化効果）","ブラックカーボンは負、メタンと対流圏オゾンは正","すべて正（温暖化効果）"], a:3, v:"answer",
  n:"ブラックカーボン・メタン・対流圏オゾンの放射強制力は<b>いずれも正（温暖化）</b>。冷却効果（負）をもつのは硫酸塩エアロゾル。IPCC第6次報告書では、NOx排出の正味の有効放射強制力は、オゾン生成（正）とメタン寿命の短縮（負）の合計で負になる。CO2などの長寿命温室効果気体と異なり、短寿命のものは削減の効果が早く現れる。〔R4-Ⅲ-4〕"},

 {f:"統計", q:"年間のエネルギー起源CO2排出量を335億t、その4割が大気中に残留するとき、大気中CO2濃度の年増加率は約何%か。大気の全質量を5.1×10¹⁸ kg、空気の平均分子量を29、CO2の分子量を44、現在の大気中CO2濃度を410 ppm（体積比）とする。", h:"大気中にあるCO2の質量を求め、年間に残留する質量との比を取ります。",
  c:["約0.04%/年","約4%/年","約1.7%/年","約0.4%/年"], a:3, v:"answer",
  n:"大気中のCO2質量＝5.1×10¹⁸×(44/29)×410×10⁻⁶≒3.2×10¹⁵ kg（約3,200億t）。残留量＝335億t×0.4＝134億t。比は134÷3,200≒<b>0.42%/年</b>。実測の増加率（約2.4 ppm/年÷410 ppm≒0.6%）より小さいのは、残留割合を4割としたため。〔R4-Ⅲ-1〕"},

 {f:"大気・水質", q:"工場排水（10,000 m³/日、BOD 100 mg/L）を河川水（200,000 m³/日、BOD 1 mg/L）に放流し、完全混合後のBODを2 mg/L以下にするには、工場排水のBODを最低何%除去する必要があるか。", h:"混合後のBOD負荷量（流量×濃度）の合計で考えます。",
  c:["58%","98%","68%","78%"], a:3, v:"answer",
  n:"混合後の許容負荷＝2×210,000＝420,000、河川の負荷＝200,000なので、工場排水の許容負荷は220,000。除去率＝(1,000,000−220,000)÷1,000,000＝<b>78%</b>。河川のBODを無視すると58%、希釈を無視すると98%になる。〔R4-Ⅲ-8〕"},

 {f:"法令・制度", q:"「地域連携促進法」（平成22年法律第72号）に基づき、地域連携保全活動計画を作成することができる主体は？", h:"計画の区域は、市区町村の範囲です。",
  c:["環境省及び都道府県","市町村（単独又は共同）","環境大臣のみ","特定非営利活動法人等のみ"], a:1, v:"answer",
  n:"地域連携保全活動計画を作成できるのは<b>市町村</b>（法第4条）。環境省と都道府県が作成するとした選択肢が誤りだった。計画作成のため、市町村はNPO等を含む協議会を組織できる（法第5条）。ほか、カルタヘナ法は事前に使用規程を定め主務大臣の承認を受ける、エコツーリズム推進法は市町村が特定自然観光資源を指定、生物多様性基本法は都道府県・市町村に地域戦略の策定を努力義務とする。〔R1-Ⅲ-33〕"},

 {f:"一般廃棄物", q:"廃棄物処理法で、一般廃棄物の処理について基本的に責任を負う主体は？", h:"産業廃棄物は排出事業者の責任ですが、一般廃棄物はどこが担うでしょう。",
  c:["都道府県","国","排出者である事業者","市町村"], a:3, v:"answer",
  n:"一般廃棄物は、<b>市町村</b>が一般廃棄物処理計画に従って収集・運搬・処分する（法第6条の2）。産業廃棄物は排出事業者の責任。「基本的には都道府県の責任」とした選択肢が誤りだった。産業廃棄物は事業活動に伴う廃棄物のうち政令で定める20種類と、輸入された廃棄物。災害廃棄物は一般廃棄物に分類される。〔R1-Ⅲ-12〕"},

 {f:"法令・制度", q:"浄化槽法の浄化槽処理促進区域を指定できる主体は？", h:"区域内の浄化槽の設置計画を作成する主体と同じです。",
  c:["市町村","都道府県知事","環境大臣","保健所設置市の長のみ"], a:0, v:"answer",
  n:"浄化槽処理促進区域は<b>市町村</b>が指定できる（下水道の処理区域・予定処理区域を除く）。区域内で市町村が設置計画を作成し、地方公共団体以外の者が所有する浄化槽を自ら管理することもできる（第12条の5・12条の6）。浄化槽台帳は都道府県知事（保健所設置市・特別区は長）が作成する（第49条）。〔R4-Ⅲ-6〕"},

 {f:"循環経済", q:"プラスチック資源循環促進法で、プラスチック使用製品廃棄物の分別収集に当たり、分別基準の策定・周知などの措置を講ずるよう努めなければならない主体は？", h:"家庭ごみの収集を担う主体です。",
  c:["都道府県知事","市町村","環境大臣","プラスチック使用製品製造事業者"], a:1, v:"answer",
  n:"分別収集に当たり、分別の基準の策定・周知などの措置を講ずる努力義務を負うのは<b>市町村</b>（法第31条）。市町村は分別収集物の再商品化を指定法人に委託でき（第32条）、単独又は共同で再商品化計画の認定を申請できる（第33条）。「使用済プラスチック使用製品」は、一度使用され、又は使用されずに収集・廃棄された製品で、放射性物質で汚染されていないもの（第2条2項）。設計指針は主務大臣が定める（第7条）。「都道府県知事は…努めなければならない」とした選択肢が誤りだった。〔R4-Ⅲ-11〕"},

 {f:"自然環境", q:"2019年（令和元年12月）の自然再生基本方針の見直しにおける「小さな自然再生」の扱いとして正しいものは？", h:"削除されたか、維持されたかを考えます。",
  c:["削除され、代わりに広域的な視点に基づく取組が打ち出された","自然再生事業の対象外とされた","維持され、協議会による取組と併せて各地で展開するものとされた","新たに追加された項目で、それ以前は位置づけがなかった"], a:2, v:"answer",
  n:"小さな自然再生は2019年の見直しでも<b>削除されず維持</b>され、「全国的、広域的な視点に基づく取組」とともに重要事項として位置づけられた。見直しでは長期にわたる自然再生に継続的に取り組む考え方や、自然再生の果たす役割の多様化が追記された。基本方針は2003年に初めて決定され、おおむね5年ごとに見直す。「小さな自然再生が削除された」とした選択肢が誤りだった。〔R2-Ⅲ-27〕"},

 {f:"生物多様性", q:"地球規模生物多様性概況第5版（GBO5、2020年）が示した愛知目標の達成状況として正しいものは？", h:"「達成」と評価された目標があったかどうかを確認します。",
  c:["20目標のうち、6目標が達成され、損失は止まりつつある","20目標のうち、すべてが達成された","20目標のうち、6目標が部分的に達成され、完全に達成された目標はない","20目標のうち、達成された目標も部分的に達成された目標もない"], a:2, v:"answer",
  n:"GBO5は「20の目標のうち<b>完全に達成されたものはなく、6つが部分的に達成</b>」と評価。生物多様性の損失が止まったとは評価していない。ほか、森林減少の速度は直前の10年に比べ約3分の1に減少、保護地域は陸域で約10%から少なくとも15%、海域で3%から少なくとも7%に増加。〔R4-Ⅲ-34〕"},

 {f:"生物多様性", q:"2023年9月に、自然関連財務情報の開示に関する最終提言（v1.0）を公表した枠組みは？", h:"気候版のTCFDを土台に、自然を対象とした枠組みです。",
  c:["TCFD（気候関連財務情報開示タスクフォース）","TNFD（自然関連財務情報開示タスクフォース）","ISSB（国際サステナビリティ基準審議会）","SBTN（Science Based Targets Network）"], a:1, v:"answer",
  n:"自然関連財務情報の最終提言（v1.0）は<b>TNFD</b>が2023年9月に公表した（TCFDを土台とし、ISSBとも整合）。「TCFDが2023年9月に自然関連の提言書を公開した」とした選択肢が誤りだった。ほか、昆明・モントリオール生物多様性枠組のターゲット15は事業者のリスク・依存・影響の評価と開示、国家戦略2023-2030の基本戦略3はネイチャーポジティブ経済の実現、ネイチャーポジティブ経済移行戦略は環境省・農林水産省・経済産業省・国土交通省が2024年3月に公表。〔R6-Ⅲ-32〕"},

 {f:"自然環境", q:"東北太平洋岸自然歩道（みちのく潮風トレイル）が全線開通した時期は？", h:"東日本大震災からの復興の取組として、段階的に整備されてきました。",
  c:["2015年（平成27年）","2017年（平成29年）","2021年（令和3年）","2019年（令和元年）6月"], a:3, v:"answer",
  n:"みちのく潮風トレイルは<b>2019年（令和元年）6月9日に全線開通</b>（青森県八戸市〜福島県相馬市、全長1,000km超）。令和5年度末時点で未開通とした選択肢が誤りだった。三陸復興国立公園の創設、エコツーリズムの推進、ESDの推進も復興の取組。〔R6-Ⅲ-26〕"},

 {f:"自然環境", q:"コウノトリの食性・採餌に関する記述として正しいものは？", h:"魚類・両生類・爬虫類・昆虫類などを丸ごと食べる鳥です。",
  c:["雑食性で、水田の稲の籾や雑草の種子を主に食べる","肉食性で、魚類や、ヘビ・カエル・バッタなどを食べる","草食性で、浅い水辺の水草や藻類を主に食べる","主に木の実や植物の種子を食べ、動物質はほとんど食べない"], a:1, v:"answer",
  n:"コウノトリは<b>肉食性</b>の大型鳥類で、ドジョウ・フナなどの魚類のほか、ヘビ・カエル・バッタなど多様な動物を食べる。「雑食性」とした選択肢が誤りだった。トキは水田での採餌が主だが夏に稲が成長すると採餌が減る。イシガメは雑食性。水生カメムシ類（コオイムシ・タガメなど）は田に水が入ると飛来して繁殖し、生活史はイネの栽培暦とよく同期している。〔R6-Ⅲ-30〕"},

 {f:"自然環境", q:"水草の生活形による4タイプの組合せとして正しいものは？", h:"水面を突き抜ける植物の名称が、ポイントです。",
  c:["水上植物・浮葉植物・沈水植物・浮遊植物","抽水植物・浮葉植物・沈水植物・浮遊植物","抽水植物・浮葉植物・水中植物・浮遊植物","水上植物・浮葉植物・水中植物・湿生植物"], a:1, v:"answer",
  n:"水草は<b>抽水植物</b>（茎や葉が水面を突き抜ける）・浮葉植物・沈水植物（植物体全体が水中）・浮遊植物（根が水底に固着しない）に大別される。「水上植物」「水中植物」はこの区分の名称でない。水辺では水深の深い方から沈水・浮葉・抽水・湿生植物・湿性林の順に帯状に形成される。〔R5-Ⅲ-29〕"},

 {f:"法令・制度", q:"大気汚染防止法で「ばい煙」として定義されている物質の組合せは？", h:"一酸化炭素や光化学オキシダントは、ばい煙の定義に入りません。",
  c:["一酸化炭素、浮遊粒子状物質、光化学オキシダント、非メタン炭化水素","いおう酸化物、一酸化炭素、浮遊粒子状物質、光化学オキシダント","ばいじん、粉じん、揮発性有機化合物、特定粉じん（石綿）","いおう酸化物、ばいじん、及びカドミウム・鉛などの有害物質"], a:3, v:"answer",
  n:"「ばい煙」は<b>いおう酸化物・ばいじん・有害物質</b>（カドミウム、塩素、ふっ化水素、鉛など政令で定めるもの）（法第2条1項）。粉じん・揮発性有機化合物は別の定義。ばい煙は工場・事業場の固定発生源に対する規制で、自動車排出ガスは別に規制される。〔R2-Ⅲ-1〕"},

 {f:"測定・分析", q:"環境庁告示13号の方法で、揮発性有機化合物（VOC）の検液を作る手順として正しいものは？", h:"重金属の検液作成と同じ手順ではありません。揮発させない工夫が必要です。",
  c:["密栓した容器で4時間かくはんし、静置後に混合液を分取して検液とする","開放容器で6時間水平振とうし、遠心分離後にメンブランフィルターでろ過して検液とする","開放容器で4時間かくはんした後、孔径1μmのろ紙でろ過して検液とする","試料を加熱して揮発した成分を捕集し、そのまま検液として用いる"], a:0, v:"answer",
  n:"VOCは揮発して失われるので、<b>密栓した容器（ヘッドスペースを最小に）で4時間かくはん→静置→混合液を分取</b>して検液とする。「遠心分離→上澄みをろ過」としたものが誤りだった。重金属等は、純水と混合して6時間連続水平振とう→遠心分離→孔径1μmメンブランフィルターでろ過。燃え殻・汚泥・ばいじんは有姿のまま採取し、小石等の異物を除いて試料とする。〔R3-Ⅲ-18〕"},

 {f:"自然環境", q:"水田周辺のカエル類のうち、非繁殖期にも水辺からほとんど離れないとされるのは？", h:"トノサマガエル属3種で、水辺への依存度が異なります。",
  c:["ナゴヤダルマガエル","トノサマガエル","3種とも同じで、非繁殖期は水辺から遠く離れた林に移る","3種とも同じで、非繁殖期には完全に陸上の樹上で生活する"], a:0, v:"answer",
  n:"<b>ナゴヤダルマガエル</b>は水辺からほとんど離れない。トウキョウダルマガエルも非繁殖期にあまり水辺から離れず、<b>トノサマガエルはかなり水辺から離れることもある</b>（農水省「水田生態系の保全技術ガイドブック」）。「3種ともほとんど水辺から離れない」とした選択肢が誤りだった。〔R3-Ⅲ-30〕"},

 {f:"生物多様性", q:"生物多様性総合評価（JBO3・2021年）の、第1〜3の危機と第4の危機の評価として正しいものは？", h:"圧力が弱まったことと、影響が小さくなったことは別の話です。",
  c:["第1〜3の危機は圧力が減少しているものもあるが影響は依然大きく、第4の危機の影響が近年顕在化している","第1〜3の危機は圧力が減少して影響が小さくなったため、第4の危機の対策だけに絞ればよい","第1〜3の危機は圧力が増加し続けており、第4の危機の影響は現時点ではまだ顕在化していない","第1〜3の危機は評価から外され、地球温暖化に伴う第4の危機のみを評価した"], a:0, v:"answer",
  n:"JBO3は、第1〜3の危機（開発・利用、管理の縮小、外来種等）は<b>圧力が減少しているものもあるが、影響は依然として大きい</b>と評価し、地球温暖化などの第4の危機の影響が顕在化していると整理した。「影響は小さくなっている」とした選択肢が誤りだった。損失速度は過去50年で緩和されてきたが、回復には至っていない。〔R3-Ⅲ-34〕"},

 {f:"循環経済", q:"「プラスチック資源循環戦略」を受けたバイオプラスチック導入ロードマップ（令和3年1月）の、バイオマスプラスチック導入目標は？", h:"目標年と導入量の組合せが問われます。",
  c:["2030年までに最大限（約200万トン）の導入を目指す","2050年までに最大限（約200万トン）の導入を目指す","2030年までに最大限（約2,000万トン）の導入を目指す","2025年までに最大限（約100万トン）の導入を目指す"], a:0, v:"answer",
  n:"目標は<b>2030年までに約200万トン</b>。「2050年までに」とした選択肢が誤りだった（2050年は長期的な方向性としてのみ出てくる）。基本的な考え方は、回避可能なプラの使用を合理化して資源の無駄を減らすこと、焼却せざるを得ない可燃ごみ指定収集袋などにバイオマスプラを最大限使い確実に熱回収すること。〔R4-Ⅲ-12〕"},

 {f:"自然環境", q:"2021年の瀬戸内海環境保全特別措置法の改正内容として正しいものは？", h:"計画を作る主体と、連携して取り組む主体に注意します。",
  c:["関係府県知事が栄養塩類管理計画を策定できる制度が創設された","栄養塩類管理計画は環境大臣が瀬戸内海全域について一括して策定する制度になった","国民に対し、漂流ごみ等の除去を罰則付きで義務づける規定が新設された","自然海浜保全地区は、天然の砂浜に限って指定でき、再生・創出された砂浜は含まれない"], a:0, v:"answer",
  n:"<b>関係府県知事が栄養塩類管理計画を策定</b>できるようになった。ほか、基本理念への「気候変動」の追加、自然海浜保全地区の対象に再生・創出された砂浜等を含めること、国による栄養塩類管理の科学的知見充実（情報収集・研究の推進）が盛り込まれた。漂流ごみ等は国・地方公共団体が相互の連携の下に取り組む規定で、「国、地方公共団体及び国民」とした選択肢が誤りだった。〔R5-Ⅲ-5〕"},

 {f:"一般廃棄物", q:"使用済み紙おむつの廃棄物区分として正しいものは？", h:"事業所から出たものの区分が問われます。感染性かどうかが分かれ目です。",
  c:["保育園・老人福祉施設などの事業所から出たものは事業系一般廃棄物で、医療機関等の感染性のものは特別管理一般廃棄物","保育園・老人福祉施設などの事業所から出たものは、すべて特別管理一般廃棄物として処理する必要がある","保育園・老人福祉施設などの事業所から出たものは、すべて産業廃棄物として排出事業者が処理する","家庭から出たものも特別管理一般廃棄物となり、市区町村が特別な処理を行う必要がある"], a:0, v:"answer",
  n:"環境省のガイドラインでは、家庭から出たものは<b>家庭系一般廃棄物</b>、保育園・老人福祉施設・病院等の事業所から出たものは<b>事業系一般廃棄物</b>。感染性を有する医療機関等のものだけが特別管理一般廃棄物になる。「事業所分は特別管理一般廃棄物」とした選択肢が誤りだった。紙おむつは上質パルプ・フィルム・吸水性樹脂からなり、水分が多く焼却時に助燃剤を使う場合がある。〔R5-Ⅲ-11〕"},

 {f:"循環経済", q:"ごみ焼却施設の排ガス中のCO2を回収して有効利用している国内の事例は？", h:"国内で稼働中の実例があるかどうかが問われます。",
  c:["佐賀市のごみ焼却施設で、CO2を分離・回収し藻類培養に利用している","国内に稼働しているものはなく、いずれも実証計画の段階にとどまる","国内のごみ焼却施設で回収したCO2は、全量を海外へ輸送して利用している","回収したCO2は全量を地下貯留しており、有効利用（CCU）は行われていない"], a:0, v:"answer",
  n:"<b>佐賀市</b>の廃棄物発電施設では、日本で初めて排ガスからCO2を分離・回収する設備を設置し、回収したCO2を藻類培養事業者に供給している。「稼働しているCCUプラントはない」とした選択肢が誤りだった。〔R5-Ⅲ-12〕"},

 {f:"測定・分析", q:"JIS K 0094による水質試料の保存で、シアン化合物と硫化物イオンの試料の処理は？", h:"アルカリ性にして保存します。pHの値を区別しておきましょう。",
  c:["水酸化ナトリウム溶液を加えてpH約12とする","水酸化ナトリウム溶液を加えてpH約10とし、よう化物イオンと同じ処理をする","塩酸又は硫酸を加えてpH2〜3とし、0〜10℃の暗所に保存する","クロロホルムを加えて0〜10℃の暗所に保存する（りん化合物と同じ処理）"], a:0, v:"answer",
  n:"シアン化合物・硫化物イオンは<b>NaOHでpH約12</b>。よう化物・臭化物イオンはNaOHでpH約10。アンモニウム・有機体窒素・全窒素は塩酸又は硫酸でpH2〜3・0〜10℃暗所。亜硝酸イオンはクロロホルム添加＋0〜10℃暗所で、「亜硝酸・硝酸イオンにNaOHでpH約12」とした選択肢が誤りだった。りんはクロロホルム（全りんは硫酸又は硝酸でpH約2でも可）。〔R6-Ⅲ-14〕"},

 {f:"自然環境", q:"サギ類の渡りの区分（夏鳥・留鳥）として正しい組合せは？", h:"ゴイサギが夏鳥か留鳥かで迷いやすいところです。",
  c:["ササゴイ・アマサギ・チュウサギは夏鳥、ゴイサギ・コサギ・アオサギは留鳥","ササゴイ・ゴイサギ・アマサギは夏鳥、コサギ・アオサギ・ダイサギは留鳥","ゴイサギ・アマサギ・コサギは夏鳥、ササゴイ・アオサギ・ダイサギは留鳥","ゴイサギ・チュウサギ・アオサギは夏鳥、ササゴイ・アマサギ・コサギは留鳥"], a:0, v:"answer",
  n:"<b>ササゴイ・アマサギ・チュウサギは夏鳥</b>、<b>ゴイサギ・コサギ・ダイサギ・アオサギは1年中いる留鳥</b>（環境省生物多様性センターの調査報告）。「ゴイサギは夏鳥」とした選択肢が誤りだった。淡水ガモ類の多くは本州以南に冬鳥として渡来する。〔R6-Ⅲ-28〕"},

 {f:"生物多様性", q:"ニホンジカの分布拡大に関する記述として正しいものは？", h:"高山帯にまで及んでいるかどうかが問われます。",
  c:["南アルプスなどの高山帯にも進出し、お花畑の食害が生じている","高山帯ではまだ生息が確認されておらず、被害は低標高の森林に限られる","2020年の調査では、東北地方（青森・秋田）ではまだ分布が確認されていない","分布拡大は九州に限られ、本州・四国ではほとんど確認されていない"], a:0, v:"answer",
  n:"ニホンジカは<b>南アルプスの高山帯にも進出</b>し、お花畑の被害が出ている。2020年度の調査では東北（青森・秋田）でも分布拡大が確認された。「高山帯ではまだ生息確認されていない」とした選択肢が誤りだった。オスとメスは別の群れをつくり、5〜7月に出産し、栄養が良ければ1歳から繁殖する。〔R6-Ⅲ-29〕"},

 {f:"国際", q:"EUが2018年1月に発表したプラスチック戦略で示された、プラスチック容器包装の目標は？", h:"目標年が2030年か2050年かが問われます。",
  c:["2030年までに、全てのプラスチック容器包装を再使用又は容易にリサイクル可能にする","2050年までに、全てのプラスチック容器包装を再使用又は容易にリサイクル可能にする","2030年までに、全てのプラスチック容器包装の使用を廃止して代替素材へ移行する","2050年までに、全てのプラスチック容器包装を生分解性のものに置き換える"], a:0, v:"answer",
  n:"EUプラスチック戦略（2018年）は、<b>2030年までに全てのプラスチック容器包装を再使用又は容易にリサイクル可能</b>にすることを掲げた。「2050年までに」とした選択肢が誤りだった。日本ではプラスチック資源循環戦略に基づく省令改正（2019年12月）により、2020年7月からレジ袋が有料化された。〔R3-Ⅲ-6〕"}
];
