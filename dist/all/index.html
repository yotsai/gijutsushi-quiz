<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="技術士第一次試験（環境部門）の基礎科目・適性科目・専門科目をまとめて学べる4択クイズ。令和元年度〜7年度の過去問の出題論点と、白書・環境省統計の数値から作成。">
<title>技術士一次試験 環境部門クイズ｜基礎・適性・専門</title>
</head>
<body>

<style>
  :root {
    --paper: #FCFBF8;
    --panel: #FFFFFF;
    --rule: #DCDDD6;
    --rule-strong: #B7BBB2;
    --ink: #191D1A;
    --ink-2: #4A5049;
    --ink-3: #767C74;
    --accent: #0E5049;
    --accent-soft: #E3EDEA;
    --ok: #1B6B3A;
    --ok-soft: #E2F0E5;
    --ng: #9E3324;
    --ng-soft: #F7E6E2;
    --shadow: 0 1px 2px rgba(25,29,26,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #131614; --panel: #1A1E1C; --rule: #2C312E; --rule-strong: #454B46;
      --ink: #E8EBE7; --ink-2: #AFB5AD; --ink-3: #838A82;
      --accent: #6FBFB2; --accent-soft: #1E3833;
      --ok: #6FC28C; --ok-soft: #1C3325;
      --ng: #E08878; --ng-soft: #3A2320;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --paper: #131614; --panel: #1A1E1C; --rule: #2C312E; --rule-strong: #454B46;
    --ink: #E8EBE7; --ink-2: #AFB5AD; --ink-3: #838A82;
    --accent: #6FBFB2; --accent-soft: #1E3833;
    --ok: #6FC28C; --ok-soft: #1C3325;
    --ng: #E08878; --ng-soft: #3A2320;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    font-size: 16px; line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 34rem; margin: 0 auto; padding: 1.5rem 1.1rem 4rem; }

  /* header */
  header { margin-bottom: 1.3rem; }
  .eyebrow { font-size: .72rem; letter-spacing: .15em; color: var(--ink-3); }
  h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 1.32rem; font-weight: 600; margin: .3rem 0 .5rem; line-height: 1.4;
  }
  .intro { font-size: .87rem; color: var(--ink-2); margin: 0; }

  /* progress */
  .status {
    display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap;
    font-size: .8rem; color: var(--ink-3); margin: 1.2rem 0 .45rem;
    font-variant-numeric: tabular-nums;
  }
  .status .field { color: var(--accent); font-weight: 600; letter-spacing: .02em; }
  .status .score { margin-left: auto; }
  .status b { color: var(--ink); }
  .status[hidden], .bar[hidden] { display: none; }

  /* 本番までの残り日数 */
  /* おまかせ出題 */
  .set.auto[aria-pressed="false"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .set .badge {
    display: inline-block; min-width: 1.4em; margin-left: .35em; padding: 0 .35em; border-radius: 999px;
    background: var(--ng); color: #fff; font-size: .68rem; font-weight: 700; line-height: 1.55; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .auto { margin-top: 1rem; padding-top: .9rem; border-top: 1px solid var(--rule); }
  .auto h3 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1rem; font-weight: 600; margin: 0 0 .3rem; }
  .auto-lead { font-size: .82rem; color: var(--ink-2); margin: 0 0 .7rem; line-height: 1.75; }
  .auto-n { display: flex; justify-content: space-between; align-items: baseline; font-size: .85rem; }
  .auto-n output { font-weight: 700; color: var(--accent); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  #autoN { display: block; width: 100%; margin: .45rem 0 .1rem; accent-color: var(--accent); }
  .auto-scale { display: flex; justify-content: space-between; font-size: .72rem; color: var(--ink-3); }
  .auto .btn.wide { margin-top: .8rem; }
  .mastery { display: flex; flex-wrap: wrap; gap: .3rem .9rem; margin-top: .7rem; font-size: .76rem; color: var(--ink-3); }
  .mastery b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .mastery .m1 b { color: var(--ng); }
  .mastery .m3 b, .mastery .m4 b { color: var(--ok); }
  .mst {
    display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .04em; padding: 0 .4rem;
    border-radius: 2px; margin-left: .45rem; vertical-align: 1px; border: 1px solid var(--rule-strong); color: var(--ink-3);
  }
  .mst.m1 { color: var(--ng); border-color: var(--ng); }
  .mst.m3, .mst.m4 { color: var(--ok); border-color: var(--ok); }
  .countdown { font-size: .82rem; color: var(--ink-2); margin: .5rem 0 0; font-variant-numeric: tabular-nums; }
  .countdown b { color: var(--accent); font-size: 1rem; }
  .countdown .cd2 { font-size: .76rem; color: var(--ink-3); }

  /* 覚える理由（過去問の出題実績） */
  .whys { display: flex; flex-wrap: wrap; gap: .3rem; margin: .35rem 0 0; }
  .why {
    display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .02em; line-height: 1.6;
    padding: 0 .45rem; border-radius: 2px; border: 1px solid var(--accent); color: var(--accent);
  }
  .why.t3 { background: var(--accent); color: var(--paper); }
  .why.same { background: var(--accent-soft); }
  .why.t1 { border-style: dashed; border-color: var(--rule-strong); color: var(--ink-3); font-weight: 600; }
  .whybox {
    margin: .7rem 0 0; padding: .55rem .7rem; background: var(--accent-soft);
    border-left: 3px solid var(--accent); font-size: .82rem; line-height: 1.7; color: var(--ink-2);
  }
  .whybox .wh { display: block; font-size: .72rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
  .whybox.t0 { border-left-color: var(--rule-strong); background: transparent; border: 1px dashed var(--rule); border-left: 3px solid var(--rule-strong); }
  .whybox.t0 .wh { color: var(--ink-3); }

  /* 合格までの道のり（ホーム） */
  .roadmap { margin-top: 1.1rem; padding-top: .9rem; border-top: 1px solid var(--rule); }
  .roadmap h3 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1rem; font-weight: 600; margin: 0 0 .3rem; }
  .roadmap .rm-lead { font-size: .84rem; color: var(--ink-2); margin: 0 0 .6rem; line-height: 1.75; }
  .rm-steps { list-style: none; margin: 0; padding: 0; }
  .rm-steps li {
    display: grid; grid-template-columns: 4.2rem 1fr; gap: .1rem .6rem; align-items: baseline;
    padding: .5rem 0; border-bottom: 1px solid var(--rule); font-size: .84rem;
  }
  .rm-steps .d { font-size: .74rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .rm-steps .t { color: var(--ink); }
  .rm-steps .v { grid-column: 2; font-size: .76rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .rm-steps .st { font-size: .68rem; font-weight: 700; padding: 0 .35rem; border-radius: 2px; margin-left: .35rem; vertical-align: 1px; }
  .rm-steps .done .st { color: var(--ok); border: 1px solid var(--ok); }
  .rm-steps .now .st { color: var(--paper); background: var(--accent); }
  .rm-steps .late .st { color: var(--paper); background: var(--ng); }
  .rm-steps .todo .t { color: var(--ink-3); }
  .roadmap .rm-note { font-size: .76rem; color: var(--ink-3); margin: .45rem 0 0; line-height: 1.65; }
  .rm-next { margin-top: .8rem; }
  .rm-next .lab { font-size: .74rem; color: var(--ink-3); margin: 0 0 .3rem; }
  .rm-next .btn { display: block; width: 100%; text-align: left; padding: .65rem 1rem; margin-top: .45rem; }
  .rm-next .btn .sub { display: block; font-size: .76rem; font-weight: 400; opacity: .88; }
  .homecard .hlead { font-size: .9rem; color: var(--ink-2); margin: 0; line-height: 1.7; }
  .homecard .btn.wide { display: block; width: 100%; text-align: left; padding: .7rem 1rem; margin-top: .9rem; }
  .homecard .btn.wide .sub { display: block; font-size: .78rem; font-weight: 400; opacity: .88; margin-top: .1rem; }
  .homestats {
    display: flex; gap: .4rem 1rem; flex-wrap: wrap; margin-top: 1rem; padding-top: .8rem;
    border-top: 1px solid var(--rule); font-size: .8rem; color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  .homestats b { color: var(--ink); }
  .bar { height: 3px; background: var(--rule); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

  /* card */
  .card {
    background: var(--panel); border: 1px solid var(--rule);
    box-shadow: var(--shadow); padding: 1.15rem 1.1rem 1.25rem; margin-top: 1.1rem;
  }
  .qn { font-size: .75rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .qt { font-size: 1.03rem; font-weight: 600; margin: .25rem 0 .1rem; line-height: 1.6; text-wrap: pretty; white-space: pre-line; }
  .qh { font-size: .82rem; color: var(--ink-3); margin: 0 0 .9rem; line-height: 1.6; }

  .choices { display: flex; flex-direction: column; gap: .45rem; }
  .ch {
    display: flex; align-items: flex-start; gap: .65rem; width: 100%;
    font: inherit; font-size: .95rem; text-align: left; cursor: pointer;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: 2px;
    padding: .58rem .7rem; line-height: 1.55;
    transition: background .12s, border-color .12s;
    font-variant-numeric: tabular-nums;
  }
  .ch:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .ch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ch:disabled { cursor: default; }
  .ch .key {
    flex: none; width: 1.35rem; height: 1.35rem; margin-top: .1rem;
    display: grid; place-items: center;
    border: 1px solid var(--rule-strong); border-radius: 50%;
    font-size: .72rem; color: var(--ink-3);
  }
  .ch.ok { border-color: var(--ok); background: var(--ok-soft); }
  .ch.ok .key { border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .ch.ng { border-color: var(--ng); background: var(--ng-soft); }
  .ch.ng .key { border-color: var(--ng); color: var(--ng); font-weight: 700; }
  .ch.dim { opacity: .45; }

  .verdict { margin-top: .95rem; padding-top: .85rem; border-top: 1px solid var(--rule); }
  .vtag { font-size: .82rem; font-weight: 700; letter-spacing: .04em; }
  .vtag.ok { color: var(--ok); }
  .vtag.ng { color: var(--ng); }
  .vnote { font-size: .86rem; color: var(--ink-2); margin: .3rem 0 0; line-height: 1.72; }
  .vnote b { color: var(--ink); }
  .vsrc {
    font-size: .73rem; color: var(--ink-3); margin: .55rem 0 0;
    padding-top: .45rem; border-top: 1px dotted var(--rule);
  }
  .vsrc.k { color: var(--ng); }

  .actions { display: flex; gap: .5rem; margin-top: 1rem; align-items: center; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: .87rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--paper);
    border: 1px solid var(--accent); border-radius: 2px; padding: .45rem 1.3rem;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--rule-strong); font-weight: 400; }
  .btn.ghost:hover { border-color: var(--accent); color: var(--accent); filter: none; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: .35; cursor: default; filter: none; }
  /* 一番よく押す「次の問題」を横幅いっぱいに、その下に「前の問題」「ホーム」を半分ずつ */
  .qnav { margin-top: 1rem; }
  .navrow { display: grid; gap: .5rem; }
  .navrow.one { grid-template-columns: 1fr; margin-bottom: .5rem; }
  .navrow.two { grid-template-columns: 1fr 1fr; }
  .qnav .btn { padding: .6rem .5rem; white-space: nowrap; text-align: center; }
  .hintkey { font-size: .74rem; color: var(--ink-3); margin: .55rem 0 0; }
  @media (hover: none) { .hintkey { display: none; } }

  /* result */
  .result h2 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 1.18rem; margin: 0 0 .2rem;
  }
  .big { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--accent); }
  .big small { font-size: 1rem; font-weight: 400; color: var(--ink-3); }
  .judge { font-size: .9rem; color: var(--ink-2); margin: .5rem 0 1.1rem; line-height: 1.7; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
  th, td { padding: .38rem .3rem; border-bottom: 1px solid var(--rule); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  thead th { font-size: .75rem; color: var(--ink-3); font-weight: 600; border-bottom: 1px solid var(--rule-strong); }
  td .mini { display: inline-block; width: 3.2rem; height: 4px; background: var(--rule); vertical-align: middle; margin-left: .4rem; }
  td .mini i { display: block; height: 100%; background: var(--accent); }
  .missed { margin-top: 1.4rem; }
  .missed h3 { font-size: .85rem; margin: 0 0 .5rem; color: var(--ink-3); font-weight: 600; letter-spacing: .03em; }
  .missed ol { margin: 0; padding-left: 1.2rem; font-size: .87rem; color: var(--ink-2); line-height: 1.75; }
  .missed b { color: var(--ink); }

  /* 再開バナー・保存警告 */
  .resume {
    display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap;
    background: var(--accent-soft); border-left: 3px solid var(--accent);
    padding: .6rem .85rem; margin-top: 1rem; font-size: .84rem; color: var(--ink-2);
  }
  .resume b { color: var(--ink); }
  .resume button {
    font: inherit; font-size: .78rem; cursor: pointer; background: none; color: var(--accent);
    border: 0; border-bottom: 1px solid var(--accent); padding: 0 0 1px; margin-left: auto;
  }
  .nostore {
    background: var(--ng-soft); border-left: 3px solid var(--ng);
    padding: .6rem .85rem; margin-top: 1rem; font-size: .82rem; color: var(--ink-2); line-height: 1.7;
  }
  .nostore b { color: var(--ink); }

  /* データ読み込み */
  .datamgr { margin-top: 2rem; padding-top: 1.1rem; border-top: 1px solid var(--rule); }
  .datamgr h3 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 1rem; font-weight: 600; margin: 0 0 .3rem;
  }
  .datamgr p { font-size: .82rem; color: var(--ink-2); margin: 0 0 .8rem; line-height: 1.75; }
  .imp { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .imp input[type=file] { display: none; }
  .impfile {
    font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--paper); border: 1px solid var(--accent);
    border-radius: 2px; padding: .45rem 1.2rem; display: inline-block;
  }
  .impfile:hover { filter: brightness(1.12); }
  .impfile.ghost { background: transparent; color: var(--accent); }
  .impfile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .impmsg { font-size: .78rem; }
  .impmsg.ok { color: var(--ok); }
  .impmsg.ng { color: var(--ng); }
  .impitem {
    display: flex; align-items: baseline; gap: .6rem; padding: .5rem 0;
    border-bottom: 1px solid var(--rule); font-size: .86rem;
  }
  .impitem .n2 { color: var(--ink-3); font-size: .78rem; font-variant-numeric: tabular-nums; }
  .impitem button {
    margin-left: auto; font: inherit; font-size: .76rem; cursor: pointer;
    background: none; color: var(--ink-3); border: 0;
    border-bottom: 1px solid var(--rule-strong); padding: 0 0 1px;
  }
  .impitem button:hover { color: var(--ng); border-bottom-color: var(--ng); }
  .privacy { font-size: .76rem; color: var(--ink-3); line-height: 1.7; margin-top: .8rem; }

  /* 学習診断 */
  .diag { margin-top: 1.6rem; }
  .diag h3 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 1rem; font-weight: 600; margin: 0 0 .2rem;
    padding-bottom: .4rem; border-bottom: 1.5px solid var(--ink);
  }
  .diag .note2 { font-size: .8rem; color: var(--ink-3); margin: .5rem 0 .8rem; line-height: 1.7; }
  .drow {
    display: grid; grid-template-columns: 1fr 4.6rem 3.4rem; gap: .15rem .7rem;
    padding: .5rem 0; border-bottom: 1px solid var(--rule); align-items: center;
  }
  .drow .dn { font-size: .87rem; font-weight: 600; }
  .drow .dsub { grid-column: 1 / -1; font-size: .72rem; color: var(--ink-3); line-height: 1.55; }
  .drow .dv { font-size: .82rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .drow .dloss { font-size: .95rem; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .drow.p1 .dloss { color: var(--ng); }
  .drow.p2 .dloss { color: var(--amber, #8A6A1F); }
  .drow.p3 .dloss { color: var(--ink-3); font-weight: 400; }
  .rx { background: var(--accent-soft); padding: .9rem 1.1rem; margin-top: 1rem; font-size: .87rem; line-height: 1.8; }
  .rx b { color: var(--ink); }
  .rx ol { margin: .4rem 0 0; padding-left: 1.2rem; }
  .rx li { margin-bottom: .3rem; }
  .exp { margin-top: 1.2rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .exp .msg { font-size: .78rem; color: var(--accent); }

  /* 履歴タブ */
  .hsum {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr));
    gap: .1rem 1rem; margin: 1.1rem 0 .3rem; padding-bottom: .9rem;
    border-bottom: 1px solid var(--rule);
  }
  .hsum div { font-size: .74rem; color: var(--ink-3); }
  .hsum b { display: block; font-size: 1.35rem; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.35; }
  .hsum .warn b { color: var(--ng); }
  .filters { display: flex; gap: .35rem; flex-wrap: wrap; margin: .9rem 0 .2rem; align-items: center; }
  .flt {
    font: inherit; font-size: .78rem; cursor: pointer; background: var(--panel); color: var(--ink-2);
    border: 1px solid var(--rule-strong); border-radius: 999px; padding: .2rem .75rem;
  }
  .flt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 600; }
  .flt:hover:not([aria-pressed="true"]) { border-color: var(--accent); color: var(--accent); }
  .flt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hrow {
    display: grid; grid-template-columns: 1fr auto; gap: .1rem .8rem;
    padding: .62rem 0; border-bottom: 1px solid var(--rule); align-items: baseline;
  }
  .hrow .hq { font-size: .87rem; line-height: 1.55; white-space: pre-line; }
  .hrow .hf { font-size: .7rem; color: var(--accent); letter-spacing: .03em; }
  .hrow .hn { font-size: .8rem; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .hrow .hn b { color: var(--ink); }
  .hbar { display: block; width: 3.6rem; height: 4px; background: var(--rule); margin-top: .28rem; margin-left: auto; }
  .hbar i { display: block; height: 100%; background: var(--accent); }
  .hbar.bad i { background: var(--ng); }
  .hrow.miss .hq::before {
    content: "✕"; color: var(--ng); font-weight: 700; font-size: .78rem; margin-right: .35rem;
  }
  .hrow.none .hq { color: var(--ink-3); }
  .empty { font-size: .87rem; color: var(--ink-3); padding: 1.6rem 0; text-align: center; }
  .hact { margin: 1.2rem 0 .4rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

  /* 履歴・フラグ */
  .hist { font-size: .72rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .flagmark {
    display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .04em;
    color: var(--ng); background: var(--ng-soft); border: 1px solid var(--ng);

 {f:"生物多様性", q:"30by30目標の内容は？", h:"2021年のG7コーンウォール・サミット「自然協約」で各国が約束した。",
  c:["2030年までに陸と海の30%以上を保全","2030年までに温室効果ガスを30%削減","2030年までに再生可能エネルギーを30%に","2030年までに生物種の30%を回復"], a:0, v:"primary",
  n:"<b>2030年までに陸と海の30%以上を健全な生態系として効果的に保全</b>する目標。昆明・モントリオール世界生物多様性枠組にも盛り込まれた（「途上国の反対で盛り込まれなかった」は誤り）。"},
 {f:"生物多様性", q:"生物多様性国家戦略2023-2030が掲げる2030年ミッションは？", h:"2023年3月に閣議決定。「生物多様性の損失を止め、反転させる」という考え方。",
  c:["ネイチャーポジティブ","カーボンニュートラル","サーキュラーエコノミー","ノーネットロス"], a:0, v:"primary",
  n:"<b>ネイチャーポジティブ（自然再興）</b>。関連して2024年3月に「ネイチャーポジティブ経済移行戦略」が4省庁から公表されている。"},
 {f:"生物多様性", q:"自然共生サイトを法定化した法律は？", h:"令和6年法律第18号。それ以前は環境省の任意の認定制度だった。",
  c:["地域生物多様性増進法","生物多様性基本法","自然環境保全法","種の保存法"], a:0, v:"primary",
  n:"<b>地域における生物の多様性の増進のための活動の促進等に関する法律（地域生物多様性増進法）</b>。令和5〜6年度に環境省が認定した自然共生サイトは<b>法に基づく認定へ自動的には移行せず、改めて増進活動実施計画の認定申請が必要</b>（令和7年4月1日受付開始）。なお同法の増進活動には<b>農林漁業や緑地の保全・創出も含まれる</b>（「含まれていない」は誤り／R7-Ⅲ-35）。"},

 {f:"今年の注意事項", q:"30by30目標（2030年までに陸域・海域の30%以上を保全）に対して、現状の保護地域面積の割合は？", h:"令和8年版白書で示された最新の進捗状況。自然共生サイトの認定（569か所・約11.6万ha）だけではまだ埋まらない差がある。",
  c:["陸域約20%・海域約13%","陸域約13%・海域約20%","陸域約28%・海域約22%","陸域約10%・海域約4%"], a:0, v:"primary",
  n:"<b>陸域約20%・海域約13%</b>。目標の30%にはまだ届いておらず、特に海域の遅れが大きい。陸域・海域の数字を入れ替えた選択肢が典型的な誤答パターン。"},
 {f:"今年の注意事項", q:"令和8年版環境・循環型社会・生物多様性白書（2026年6月5日公表）の特集テーマは？", h:"第1部（第1〜4章）がまるごとこのテーマに充てられている、今年の白書の目玉。",
  c:["循環経済（サーキュラーエコノミー）で日本列島を強く豊かに","ネイチャーポジティブで実現する自然と共生する社会","GX（グリーントランスフォーメーション）による産業構造の転換","気候変動適応と防災・減災の一体的推進"], a:0, v:"primary",
  n:"<b>循環経済（サーキュラーエコノミー）で日本列島を強く豊かに</b>。第1部第1〜4章がこの特集テーマに充てられている。他の選択肢は近年の環境政策のキーワードだが、今年の特集テーマではない。"},
 {f:"今年の注意事項", q:"産業廃棄物の総排出量（2023年度、3億6,725万t）は、前年度と比べてどう変化したか？", h:"総排出量そのものの値は別の問題で既に出題済み。ここでは増減の向きと幅を問う。",
  c:["約680万トン減少した","約680万トン増加した","ほぼ横ばい（増減1%未満）だった","約2,000万トン減少した"], a:0, v:"primary",
  n:"<b>約680万トン減少した</b>。総排出量3億6,725万tという絶対値だけでなく、前年度からの増減方向・幅も問われうる点に注意。"},
 {f:"今年の注意事項", q:"2024年の廃プラスチック総排出量は？", h:"産業廃棄物とは別カテゴリの統計。有効利用率とセットで出題されやすい。",

  n:"<b>911万t</b>。近年は900万t台で推移。有効利用率（約89%）とセットで覚える。"},
 {f:"今年の注意事項", q:"2024年の廃プラスチックの有効利用率は？", h:"マテリアル・ケミカル・サーマルの各リサイクルを合算した値。",
  c:["約89%","約65%","約99%","約45%"], a:0, v:"primary",

 {f:"今年の注意事項", q:"2024年度の生活環境項目（BOD・COD）の環境基準達成率を水域別に見ると、最も低いのは？", h:"全体では88.6%。河川・湖沼・海域で水準に大きな差がある。",

  n:"<b>湖沼（50.8%）</b>。河川93.9%・海域78.2%・湖沼50.8%の順で、閉鎖性水域である湖沼は改善が進みにくい。全体の88.6%は水域別の値ではない点も混同しやすい。"},
 {f:"今年の注意事項", q:"2024年度の土壌汚染対策法に基づく調査で、環境基準を超過した事例数は？", h:"同年度の調査実施件数は1,680件。",

  n:"<b>1,194件</b>。調査実施1,680件のうち1,194件で基準超過が確認された。これは大気・水環境の「達成率（%）」とは異なり「超過件数」ベースの統計である点に注意。"},
 {f:"今年の注意事項", q:"2024年度末までの土壌汚染対策法の要措置区域の指定件数と、そのうち解除された件数の組み合わせは？", h:"指定後、汚染の除去等の措置が完了すれば区域指定は解除される。",
  c:["指定1,093件・うち解除759件","指定1,680件・うち解除1,194件","指定759件・うち解除1,093件","指定1,093件・うち解除334件"], a:0, v:"primary",
  n:"<b>指定1,093件・うち解除759件</b>。指定と解除の件数を入れ替えた選択肢や、超過事例数1,194件・調査件数1,680件と混同させる選択肢が典型的な誤答パターン。"},
 {f:"今年の注意事項", q:"化学物質の審査及び製造等の規制に関する法律（化審法）に基づく2025年度の新規化学物質の事前審査届出件数は？", h:"うち低生産量新規化学物質が124件を占める。",
  c:["255件（うち低生産量新規化学物質124件）","124件（うち低生産量新規化学物質255件）","573件（うち低生産量新規化学物質210件）","89件（うち低生産量新規化学物質40件）"], a:0, v:"primary",
  n:"<b>255件（うち低生産量新規化学物質124件）</b>。全体件数と低生産量分の件数を入れ替えた選択肢が典型的な誤答パターン。"},
 {f:"今年の注意事項", q:"PFHxS（ペルフルオロヘキサンスルホン酸）関連物質について、2025年12月に閣議決定されたのは？", h:"化審法に基づく規制強化の動き。PFOS・PFOAに続く措置。",
  c:["第一種特定化学物質指定等の政令","水道水質基準への格上げ","要監視項目からの除外","POPs条約附属書Bへの追加"], a:0, v:"primary",
  n:"<b>第一種特定化学物質指定等の政令（化審法に基づく）</b>の閣議決定。PFOS・PFOAに続きPFHxS関連物質も規制対象に加わる。「水道水質基準への格上げ」はPFOS・PFOAについて2025年6月30日に決定・2026年4月1日施行された別の措置なので紛らわしい。"},
 {f:"今年の注意事項", q:"2024年度のダイオキシン類の環境基準超過状況として正しいのは？", h:"大気・地下水質・土壌の3媒体はいずれも超過なし。",
  c:["公共用水域水質で29地点、底質で1地点が基準超過","大気で29地点、水質で1地点が基準超過","公共用水域水質・底質とも超過なし","土壌で29地点が基準超過"], a:0, v:"primary",
  n:"<b>公共用水域水質で29地点、底質で1地点が基準超過</b>。大気・地下水質・土壌ではいずれも基準超過はなかった。媒体を取り違えた選択肢（大気や土壌に超過があるとする）が典型的な誤答。"},
 {f:"今年の注意事項", q:"2024年度のダイオキシン類の人の一日摂取量（推計）は？", h:"耐容一日摂取量（TDI）は体重1kgあたり4pg-TEQ。",
  c:["約0.41pg-TEQ/kg体重/日","約4.0pg-TEQ/kg体重/日","約1.2pg-TEQ/kg体重/日","約0.04pg-TEQ/kg体重/日"], a:0, v:"primary",
  n:"<b>約0.41pg-TEQ/kg体重/日</b>。耐容一日摂取量（TDI）4pg-TEQ/kg体重の1割程度にとどまる。TDIの値そのもの（4pg-TEQ）と取り違えないよう注意。"},
 {f:"今年の注意事項", q:"2024年度のダイオキシン類の排出基準超過件数（大気・水質合計）は？", h:"内訳は大気27件・水質1件。",
  c:["28件（大気27件・水質1件）","1件（大気0件・水質1件）","55件（大気50件・水質5件）","0件（超過なし）"], a:0, v:"primary",
  n:"<b>28件（大気27件・水質1件）</b>。環境基準の超過状況（公共用水域水質29地点・底質1地点）とは別の統計＝排出基準（発生源側の規制値）の超過件数なので、数字を混同しないこと。"},
 {f:"今年の注意事項", q:"COP30（国連気候変動枠組条約第30回締約国会議）の開催地・会期は？", h:"京都議定書CMP20、パリ協定CMA7も同時開催された。",
  c:["ブラジル・ベレン、2025年11月10日〜22日（1日延長）","ブラジル・ベレン、2024年11月11日〜22日","UAE・ドバイ、2025年11月10日〜22日","アゼルバイジャン・バクー、2025年11月10日〜22日"], a:0, v:"primary",
  n:"<b>ブラジル・ベレン、2025年11月10日〜22日（1日延長）</b>。成果文書は「ベレン政治パッケージ」。前年のCOP29（バクー）で合意したNCQG（新規合同数値目標、環境省公式訳）の実施が主要議題の一つだった。COP28（ドバイ）・COP29（バクー）の開催地と混同させる選択肢に注意。"},
 {f:"今年の注意事項", q:"COP30の成果文書「ベレン政治パッケージ」の中核をなす決定と、その名称の由来は？", h:"ブラジル議長国が掲げたCOP30全体のコンセプトで、環境省公式資料でもカタカナ表記されている。",
  c:["グローバル・ムチラオ決定（「ムチラオ」はポルトガル語で共同作業・寄合仕事の意）","グローバル・ストックテイク決定（「ストックテイク」は英語で棚卸しの意）","グローバル・ムチラオ決定（「ムチラオ」はスペイン語で連帯・団結の意）","ベレン枠組み決定（「ベレン」は先住民言語で分かち合いの意）"], a:0, v:"primary",
  n:"<b>グローバル・ムチラオ決定（「ムチラオ」はポルトガル語で共同作業・寄合仕事の意）</b>。ブラジル議長国が掲げたCOP30全体のコンセプトで、①パリ協定10周年を踏まえた緩和の取組の進展　②交渉から実施への移行　③実施・連帯・国際協力の加速、の3本柱で構成され、just transition・適応資金・貿易・ジェンダー・技術などを含む29の個別決定を束ねたパッケージ。「グローバル・ストックテイク」はパリ協定の別の仕組み（5年ごとの全体進捗評価）の名称であり、混同しないよう注意。「ムチラオ」の語源をポルトガル語からスペイン語にすり替えた選択肢にも注意。"},
 {f:"今年の注意事項", q:"COP29（2024年、バクー）で合意されたNCQG（新規合同数値目標／新規気候資金目標）について、正しい組み合わせは？", h:"先進国主導の拠出目標と、官民合わせた全体目標の2つの数字がある。2025年に期限切れとなる旧目標（年間1,000億ドル）の後継。",
  c:["先進国主導で2035年までに年間少なくとも3,000億ドルを動員、官民合わせて2035年までに年間1.3兆ドルまで拡大する全体目標","先進国主導で2035年までに年間少なくとも1.3兆ドルを動員、官民合わせて2035年までに年間3,000億ドルまで拡大する全体目標","先進国主導で2030年までに年間少なくとも3,000億ドルを動員、官民合わせて2030年までに年間1.3兆ドルまで拡大する全体目標","先進国主導で2035年までに年間少なくとも1,000億ドルを動員、官民合わせて2035年までに年間3,000億ドルまで拡大する全体目標"], a:0, v:"primary",
  n:"<b>先進国主導で2035年までに年間少なくとも3,000億ドルを動員、官民合わせて2035年までに年間1.3兆ドルまで拡大する全体目標</b>。2025年に期限切れとなる旧目標（年間1,000億ドル）の後継。COP30ではNCQGの実施に向けてハイレベル閣僚級ラウンドテーブルの開催が決定されたが、これは数字自体の再交渉ではない。2つの数字（3,000億ドルと1.3兆ドル）を入れ替えた選択肢、目標年を2030年にすり替えた選択肢、旧目標の1,000億ドルを紛れ込ませた選択肢に注意。"},
 {f:"今年の注意事項", q:"COP30の合意に盛り込まれた適応資金に関する目標と、その実現の道筋を示すロードマップの名称は？", h:"法的拘束力のない政治的コミットメント。実現の道筋として2026〜2028年を対象とするロードマップが示された。",
  c:["2035年までに適応資金を3倍にする努力を呼びかけ／バクー・ベレン・ロードマップ（2026〜2028年）","2030年までに適応資金を3倍にする努力を呼びかけ／バクー・ベレン・ロードマップ（2026〜2028年）","2035年までに適応資金を2倍にする努力を呼びかけ／バクー・ベレン・ロードマップ（2026〜2028年）","2035年までに適応資金を3倍にする努力を呼びかけ／グラスゴー・ベレン・ロードマップ（2026〜2028年）"], a:0, v:"primary",
  n:"<b>2035年までに適応資金を3倍にする努力を呼びかけ／バクー・ベレン・ロードマップ（2026〜2028年）</b>。法的拘束力のない政治的コミットメント。あわせてNCQGの実施に向けたハイレベル閣僚級ラウンドテーブルの開催も決定されたが、これはNCQGの数字自体の再交渉ではない。目標年（2030年）や倍率（2倍）にすり替えた選択肢、ロードマップ名を「グラスゴー」（COP26の開催地で無関係）にすり替えた選択肢に注意。"},
 {f:"今年の注意事項", q:"令和6年度地下水質測定結果（継続監視調査、3,642地点）で、環境基準超過井戸数が最も多かった測定項目は？", h:"令和3年度データを使ったR5-Ⅲ-6のグラフ問題と同じ顔ぶれ・同じ順位が続いているかが問われうる。",
  c:["硝酸性窒素及び亜硝酸性窒素","ふっ素","砒素","テトラクロロエチレン"], a:0, v:"primary",
  n:"<b>硝酸性窒素及び亜硝酸性窒素</b>が最多で、次いで砒素、テトラクロロエチレンの順（環境省・令和6年度地下水質測定結果）。この順位は令和3年度データ（R5-Ⅲ-6で出題された継続監視調査のグラフ）と同じ並びが続いている。"},
 {f:"今年の注意事項", q:"令和7年度末の全国の汚水処理人口普及率は？", h:"下水道・浄化槽・農業集落排水施設等・コミュニティ・プラントを合わせた普及率。R6試験で白書の汚水処理の記述が出題されている。",
  c:["94.0%","82.2%","99.1%","86.5%"], a:0, v:"primary",
  n:"<b>94.0%</b>（令和6年度末は93.7%、0.3ポイント増）。まだ汚水処理施設を使えない人は約740万人。<b>82.2%は下水道だけの普及率</b>で、「汚水処理人口普及率」と取り違えさせる選択肢の定番。（国土交通省・農林水産省・環境省 令和7年度末汚水処理人口普及状況）",
  y:"R6試験で、白書の汚水処理の記述が名指しで出題されています（R6-Ⅲ-6）。普及率は毎年公表される統計で、最新値が狙われやすいと<b>予想</b>しています。出題実績は1回です。"},
 {f:"今年の注意事項", q:"汚水処理人口普及率（令和7年度末）の内訳で、下水道の次に大きいのは？", h:"下水道が82.2%で最大。残りの約12%をどの施設が担っているか。",
  c:["浄化槽（9.5%）","農業集落排水施設等（9.5%）","コミュニティ・プラント（9.5%）","し尿処理施設（9.5%）"], a:0, v:"primary",
  n:"<b>浄化槽（9.5%）</b>。農業集落排水施設等は2.2%、コミュニティ・プラントは0.1%。<b>し尿処理施設は汚水処理人口の区分に入らない</b>（くみ取りし尿を処理する施設）ので、紛れ込ませた選択肢に注意。",

 {f:"今年の注意事項", q:"改正気候変動適応法（令和6年4月全面施行）で創設された「熱中症特別警戒情報」の発表基準は？", h:"従来の熱中症警戒情報（警戒アラート）との違いは、暑さ指数の値と、対象となる地点の範囲。",

  c:["最小存続可能個体数（MVP）","ボトルネック効果による遺伝的多様性の喪失を伴う個体数の激減","レジームシフト","アリー効果"], a:0, v:"answer",
  n:"<b>最小存続可能個体数（MVP）</b>。感染症で約70頭→10頭に激減し遺伝的多様性が失われた事例は<b>ボトルネック効果</b>、サンゴ群集から海藻藻場へ不可逆的に変化した事例は<b>レジームシフト</b>。3つセットで問われます。〔R7-Ⅲ-30〕"},

 {f:"自然環境", q:"生態系における「キーストーン種」の説明は？", h:"存在量の多寡ではなく、相互作用の要かどうか。",
  c:["群集の相互作用と多様性の要をなし、失われると生態系が変質する種","生息する多くの生物に餌資源を与える、群集中で存在量の多い種","生息地面積要求性が大きく、保全により多数の種が守られる種","美しさや魅力で特定の生育・生息地の保護をアピールできる種"], a:0, v:"answer",
  n:"「生息する多くの生物に餌資源を与え…」はアンブレラ種ではなく<b>基盤種</b>の説明、「生息地面積要求性が大きく、保全に…」が<b>アンブレラ種</b>、「美しさや魅力で特定の生育・生息地…」が<b>フラッグシップ種</b>。キーストーン種は存在量が少なくても生態系への影響が大きい点が要点。〔R4-Ⅲ-28〕"},

 {f:"自然環境", q:"植生自然度の類型区分について正しいものは？", h:"人為的影響の度合いにより日本の植生を10類型に区分したもの。",
  c:["造林地は二次草原よりも自然度が高い値になる","二次草原は造林地よりも自然度が高い値になる","自然度は高いほど良いという単一の価値尺度である","耕作地と樹園地は同じ自然度に区分される"], a:0, v:"answer",
  n:"<b>造林地（自然度6）＞二次草原（自然度2〜3）</b>。「二次草原のほうが高い」とした選択肢が誤りとして出題されました。なお自然度は単一の価値尺度ではなく、人と自然の関わりを表す類型区分の1つ。〔R5-Ⅲ-30〕"},

 {f:"地球環境", q:"IPCC AR6 第1作業部会報告書によると、1971〜2018年の海面水位上昇のうち海洋の熱膨張で説明される割合は？", h:"陸域の氷の減少と海洋の熱膨張の寄与配分。",
  c:["約50%","約10%","約90%","約25%"], a:0, v:"answer",
  n:"約50%が<b>熱膨張</b>によるもの。「10%が熱膨張で説明される」とした選択肢が誤りとして出題されました。〔R7-Ⅲ-1〕"},

 {f:"地球環境", q:"サプライチェーン排出量のScope3に該当するのは？", h:"GXとSBTの文脈で出題されます。",
  c:["事業の活動に関連する他社の排出等、その他の間接排出","燃料の燃焼や工業プロセス等による事業者自らの直接排出","他者から購入した電気・熱の使用に伴う間接排出","森林等による吸収量"], a:0, v:"answer",
  n:"「燃料の燃焼や工業プロセス等による…」がScope1、「他者から購入した電気・熱の使用に…」がScope2、「事業の活動に関連する他社の排出等…」が<b>Scope3</b>。なお「サプライチェーン全体での脱炭素化の動きは進んでいない」とした選択肢が誤りとして出題されており、主要サプライヤーにSBT整合の削減目標を求める企業は増加しています。〔R7-Ⅲ-3〕"},

 {f:"地球環境", q:"気候変動適応計画における自然生態系分野の記述として正しいものは？", h:"★4年で2回、5つの選択肢がそのまま再利用されています。",
  c:["気候変動以外のストレス（開発・環境汚染・過剰利用・外来種侵入等）の低減も対象としている","気候変動以外のストレスの低減は、適応計画では対象としておらず、気候変動由来の影響低減のみに特化する","生態系の変化は人為的対策で広範に抑制することが可能である","現在の生態系・種を維持するための積極的な干渉は行わない"], a:0, v:"answer",
  n:"★<b>この論点は選択肢まで同一で再出題</b>されました。正答はR4が①、R6が④の位置ですが、指している文は同じ「気候変動以外のストレスは対象としていない」（＝誤り）。順序が入れ替わるだけなので、選択肢単位で覚えれば確実に取れます。〔R4-Ⅲ-26／R6-Ⅲ-24〕"},

 {f:"地球環境", q:"ブルーカーボンに関して、国連の扱いとして正しいものは？", h:"2024年4月提出の日本の温室効果ガスインベントリが関係します。",
  c:["大型海藻養殖も海洋の二酸化炭素吸収源に含める方向にある","大型海藻養殖は有効な吸収源には含めておらず、対象はマングローブ林などに限られる","ブルーカーボンは吸収源として認められていない","対象はマングローブ林のみである"], a:0, v:"answer",
  n:"「大型海藻養殖は含めていない」とした選択肢が誤りとして出題されました。日本は2024年4月提出のインベントリで<b>世界で初めて藻場（海草・海藻）による吸収量を算定して国連に報告</b>しています。ブルーカーボン生態系＝藻場・塩性湿地・マングローブ林。〔R6-Ⅲ-25〕"},

 {f:"国際", q:"ワシントン条約（絶滅のおそれのある野生動植物の種の国際取引に関する条約）の採択年は？", h:"条約の採択年と対象の組合せが繰り返し問われます。",
  c:["1973年","1970年","1971年","1972年"], a:0, v:"answer",
  n:"<b>1973年</b>。「1970年に採択」とした選択肢が誤りとして出題されました。あわせてラムサール条約<b>1971年</b>、世界遺産条約<b>1972年</b>、南極条約環境保護議定書<b>1991年</b>、名古屋議定書<b>2010年</b>（COP10）。〔R7-Ⅲ-34〕"},

 {f:"統計", q:"産業廃棄物の種類別排出量で最も多いのは？", h:"「業種別」ではなく「種類別」。両方をセットで問われます。",
  c:["汚泥","動物のふん尿","がれき類","廃プラスチック類"], a:0, v:"answer",
  n:"<b>汚泥</b>。次いで動物のふん尿、がれき類で、この3品目で全排出量の約8割。「動物のふん尿が最も多い」は誤答の定番です。なお<b>業種別</b>の1位は電気・ガス・熱供給・水道業。〔R4-Ⅲ-10／R5-Ⅲ-10／R6-Ⅲ-10／R7-Ⅲ-9〕"},

 {f:"統計", q:"産業廃棄物の地域別排出量で最も多いのは？", h:"種類別・業種別とあわせて3点セットで出題されます。",
  c:["関東地方","中部地方","近畿地方","九州地方"], a:0, v:"answer",
  n:"<b>関東地方</b>、次いで中部地方。「中部地方が最も多い」は誤答の定番。なお一般廃棄物で県外搬出が多いのも<b>関東ブロック（22.4%・令和6年度）</b>。〔R5-Ⅲ-10／R6-Ⅲ-10／R7-Ⅲ-9〕"},

 {f:"統計", q:"一般廃棄物の最終処分場について、ブロック内で十分な処分先を確保できず県外搬出が多いのは？", h:"★4年連続で、同じ選択肢が「不適切なもの」として出題されています。",
  c:["関東ブロック","近畿ブロック","中部ブロック","九州ブロック"], a:0, v:"answer",
  n:"★<b>4年連続の頻出</b>。<b>関東ブロックで22.4%</b>が都道府県外へ搬出され、次いで中部ブロックの11.6%（令和6年度）。出題当時（R4〜R7）の値は関東18.3%・中部6.7%で、割合は年度で変わるが「関東が最多、次いで中部」は変わらない。「近畿ブロックにおいて十分な処分先の確保ができない」とした選択肢が<b>4年とも誤り</b>として出ています（R4-Ⅲ-9④／R5-Ⅲ-9①／R6-Ⅲ-9③／R7-Ⅲ-12①）。首都圏は土地利用の高度化により施設確保が難しく、都府県域を越えた広域処理が行われています。"},

 {f:"統計", q:"一般廃棄物最終処分場の残余年数（全国平均）の推移は？", h:"上の設問と同じ問題の別の選択肢として出ます。",
  c:["微増傾向","減少傾向","横ばい","年による変動が大きく傾向はない"], a:0, v:"answer",
  n:"<b>微増傾向</b>（一部年度を除く）。「減少している」は誤答の定番。処分量が減っているため、容量が増えなくても年数は延びます。最新値は24.9年。〔R4-Ⅲ-9／R5-Ⅲ-9／R6-Ⅲ-9／R7-Ⅲ-12〕"},

 {f:"法令・制度", q:"大気汚染防止法第22条に基づき都道府県知事等が常時監視を行う大気の状況のうち、環境基準が定められている物質として正しいものは？", h:"「NOx」と「NO2」、似た表記の使い分けが問われました。",
  c:["窒素酸化物のうち二酸化窒素（NO2）","窒素酸化物（NOx）全体","揮発性有機化合物（VOC）全体","浮遊粒子状物質のうち粒径2.5μmを超えるもの"], a:0, v:"answer",
  n:"環境基準が定められているのは窒素酸化物のうち<b>二酸化窒素（NO2）</b>で、「NOx」（窒素酸化物全体）を常時監視の対象物質としたのは誤りとして出題されました。あわせて令和4年度はPM2.5の環境基準達成率が極めて高い一方、光化学オキシダントは極めて低い水準が続き、有害大気汚染物質モニタリングは環境基準4物質・指針値11物質・その他6物質の計21物質が対象、ベンゼン等4物質は全測定地点で環境基準を達成しています。〔R7-Ⅲ-4〕"},

 {f:"大気・水質", q:"カドミウム(Cd)の排出基準0.03 mg/Lをさらにその1/10まで低減した排水中で、水酸化カドミウムの溶解度積 Ksp=[Cd²⁺][OH⁻]²=3.9×10⁻¹⁴（Cdの原子量112）から求まる水素イオン濃度[H+]に最も近いものは？", h:"Cd濃度（mol/L換算）→[OH⁻]→水のイオン積から[H+]、の順に計算します。",
  c:["約8.3×10⁻¹² mol/L","約2.6×10⁻¹¹ mol/L","約1.2×10⁻³ mol/L","約3.9×10⁻¹⁴ mol/L"], a:0, v:"answer",
  n:"<b>約8.3×10⁻¹² mol/L</b>。0.03mg/Lの1/10=0.003mg/Lを原子量112で割って[Cd²⁺]（mol/L）とし、Kspから[OH⁻]を求め、水のイオン積10⁻¹⁴を[OH⁻]で割って[H+]を得ます。「約2.6×10⁻¹¹ mol/L」は1/10への低減を忘れて元の0.03mg/Lのまま計算した値、「約1.2×10⁻³ mol/L」は計算途中の[OH⁻]の値をそのまま[H+]と取り違えた値、「約3.9×10⁻¹⁴ mol/L」はKspの数値をそのまま答えにした誤りです。〔R7-Ⅲ-5〕"},

 {f:"循環経済", q:"環境省が推進する「サステナブルファッション」の観点から、家庭で着られなくなった衣類の廃棄・リユースの実態として正しいものは？", h:"家庭からごみとして出された衣類が、その後どうなるかが問われました。",
  c:["家庭からごみとして廃棄された衣類は、大部分が焼却・埋立され再資源化されるのは5%ほどにとどまる","家庭で手放された衣類は、廃棄・譲渡を問わずほぼ全量がリユースまたはリサイクルされている","衣類の廃棄量は年々減少しており、新規購入量を上回ることはない","国内で販売される衣料品は、そのほとんどが国産で輸入品は数量ベースで1割に満たない"], a:0, v:"answer",
  n:"<b>ごみとして廃棄された衣類のうち再資源化されるのは5%ほど</b>にとどまり、大部分は焼却・埋立されています。「手放した衣類はほぼ全量がリユース・リサイクルされている」は実態と逆の誤りとして出題されました。あわせて衣類は手放す枚数より購入枚数の方が多く、国内で販売される衣料品の輸入依存度は数量ベースで約98%に達しています。〔R7-Ⅲ-10〕"},

 {f:"一般廃棄物", q:"いわゆる「ごみ屋敷」問題への市区町村の対応に関する記述として正しいものは？", h:"直接対応する法律の有無と、条例制定の実態が問われました。",
  c:["直接対応する法律・国の制度はないが、対応を目的とした条例を独自に制定した市区町村がある","直接対応する法律は既に整備されており、条例を制定する必要はない","対応を目的とした条例を制定した市区町村は全国に存在せず、対応の法的根拠が整備されないまま現場ごとの裁量に委ねられている","単なる廃棄物の問題であり、居住者への福祉的支援は不要である"], a:0, v:"answer",
  n:"ごみ屋敷に<b>直接対応する法律・国の制度はないが、対応を目的とした条例を制定した市区町村は存在</b>します。「条例を制定した市区町村はない」は実態と逆の誤りとして出題されました。また対応には廃棄物処理だけでなく居住者への福祉的支援を要することも多く、市区町村の対応で最も多いのは現地確認、次いで直接指導・助言。認知の経路としては市民からの通報・情報提供が最多です。〔R7-Ⅲ-11〕"},

 {f:"生物多様性", q:"JBO3（生物多様性及び生態系サービスの総合評価）で扱われた、「生物多様性」という言葉の国民認知度の推移に関する記述として、最も実態に近いものは？", h:"2012年頃に上昇した認知度が、その後どう推移したかが問われました。",
  c:["2014年以降、認知度が一貫して低下し続けているとは言えない","2014年以降、認知度は一貫して低下し続けている","調査開始以来、認知度は一貫して上昇を続けている","「生物多様性」という言葉の認知度調査自体が実施されていない"], a:0, v:"answer",
  n:"「2014年以降は一貫して減少傾向が続く」とした記述が誤りとして出題されました。あわせてJBO3はほかに、レッドデータブック2014で外来種を減少要因とする爬虫類の割合が約7割、第4次レッドリスト（第5回改訂）の汽水・淡水魚類で絶滅・絶滅危惧の割合が61%、森林面積は国土の67%、1945年以降で干潟の約4割が消滅、と報告しています。〔R7-Ⅲ-26〕"},

 {f:"生物多様性", q:"環境省が2017年に公表した「環境省版海洋生物レッドリスト」における小型鯨類の扱いとして正しいものは？", h:"評価対象になっていることと、実際に絶滅危惧種として掲載されているかは別の論点です。",
  c:["小型鯨類29種は評価対象とされ、そのうち絶滅危惧種として掲載されている種もある","小型鯨類は評価の対象外とされている","小型鯨類は評価対象だが、絶滅危惧種として掲載された種は一つもなく、評価基準やカテゴリーは陸域のレッドリストと共通の体系が用いられている","小型鯨類は甲殻類と同じカテゴリーで一括評価されている"], a:0, v:"answer",
  n:"小型鯨類29種は評価対象で、そのうち絶滅危惧種として掲載されている種もあります。「評価対象だが掲載種はない」とした記述が誤りとして出題されました。あわせて、海洋生物多様性保全戦略（2011年3月決定）を受けて2012年度から検討が始まり、評価基準・カテゴリーは陸域のレッドリスト（2015年版）と共通、掲載種は443種でうち絶滅危惧種56種、甲殻類は計30種が絶滅危惧種で多くは干潟や南西諸島の海底洞窟に生息する種です。〔R7-Ⅲ-27〕"},

 {f:"自然環境", q:"世界の主な植物群系のうち、地中海性気候などにみられる「硬葉樹林」の特徴として正しいものは？", h:"季節ごとの降水パターンと、葉の性質（常緑か落葉か、クチクラ層の発達度合い）の組合せが問われました。",
  c:["夏に乾燥し冬に雨が多い地域に分布し、クチクラ層が発達した常緑広葉樹が優占する","夏に雨が多く冬に乾燥する地域に分布し、クチクラ層が未発達な落葉広葉樹が優占する","夏に乾燥し冬に雨が多い地域に分布するが、優占するのは落葉広葉樹である","北緯50〜70°に分布し、1〜数種の針葉樹が優占する"], a:0, v:"answer",
  n:"<b>硬葉樹林は夏乾燥・冬雨（地中海性気候型）の地域に分布し、乾燥に耐えるクチクラ層が発達した常緑広葉樹が優占</b>します。出題では季節パターン（夏雨・冬乾燥）と葉の性質（クチクラ未発達の落葉樹）を<b>両方とも逆にした</b>記述が誤りとして出されました。片方だけ逆にした選択肢と混同しないよう注意が必要です。ほか雨緑樹林＝熱帯・亜熱帯の雨季乾季が明瞭な地域で乾季に落葉、亜寒帯針葉樹林＝北緯50〜70°または中低緯度の山岳、夏緑樹林＝中緯度の落葉広葉樹林。〔R7-Ⅲ-31〕"},

 {f:"自然環境", q:"「日高山脈襟裳十勝」の保護地域としての指定区分として正しいものは？", h:"国定公園ではなく、より指定基準の厳しい区分に指定されています。",
  c:["国立公園","国定公園","国指定鳥獣保護区","原生自然環境保全地域"], a:0, v:"answer",
  n:"<b>日高山脈襟裳十勝は国立公園</b>です。「国定公園」とした記述が誤りとして出題されました。ほかの正しい組合せ例として、国立公園は西表石垣・奄美群島・やんばる、国定公園は蔵王・京都丹波高原、国指定鳥獣保護区はウトナイ湖・伊豆沼・片野鴨池、ラムサール条約湿地は釧路湿原・葛西海浜公園・屋久島永田浜、原生自然環境保全地域は十勝川源流部・大井川源流部・南硫黄島。〔R7-Ⅲ-32〕"},

 {f:"自然環境", q:"鳥獣の捕獲強化対策における、シカとイノシシの2028年度に向けた個体数目標の扱いとして正しいものは？", h:"2023年の改定で、シカとイノシシの目標の「期限」の書き方が違う点が問われました。",
  c:["シカは2028年度までの半減を目指し、イノシシは半減を「早期に」達成することを目指す","シカ・イノシシともに、2028年度までに半減を目指す","イノシシは既に半減を達成しており、シカだけが2028年度までの半減を目指す","シカ・イノシシともに、既に半減を達成している"], a:0, v:"answer",
  n:"<b>シカは2028年度（令和10年度）までに2011年度水準からの半減、イノシシは同水準からの半減を「早期に」達成し、その後も捕獲圧を維持する</b>（環境省・農林水産省「シカ・イノシシの捕獲強化対策と捕獲目標について」2023年9月）。R7では「シカ・イノシシともに2028年度までに半減を目指す」とした記述が最も不適切とされた（イノシシには2028年度という期限が付いていない）。イノシシは期限の書き方が違うだけで、半減はまだ達成していない（令和4年度末の推定でも半減目標の水準を上回っている）ので、「イノシシは既に達成済み」とする選択肢も誤り。あわせて狩猟免許は2012年度以降下げ止まり増加に転じたもののわな猟が中心で、銃猟は減少傾向。クマ類は指定管理鳥獣に追加されましたが、ツキノワグマは徳島・香川・愛媛・高知の個体群を除いた扱いです。〔R7-Ⅲ-33〕"},
 {f:"大気・水質", q:"酸性雨に関する記述のうち、最も適切なものはどれか。", h:"pH5.6という数値はよく登場しますが、その位置づけに注意。",
  c:["湿性沈着とは大気中の化学物質が降水とともに地表に降下することをいい、乾性沈着とはガスやエアロゾルのまま降水によらずに降下することをいう","大気中の二酸化炭素と平衡にある水のpHは5.6程度であり、このpH値以下の降水を酸性雨とすることは国際的な公式基準として法定されている","降水の酸性化には硝酸イオンのみが影響し、硫酸イオンはむしろ酸性物質を中和する働きを持つ","黄砂粒子はアルカリ性炭酸塩を含まないため、黄砂が飛来すると降水のpH値はより低下（酸性化）する傾向がある"], a:0, v:"answer",
  n:"<b>湿性沈着＝降水に伴う沈着、乾性沈着＝降水によらない沈着</b>という定義が正しい。pH5.6は二酸化炭素と平衡にある水のpHの目安として使われる数値だが、これを酸性雨の「世界基準」とする法定義があるわけではない（この一文全体を不適切とする出題）。降水の酸性化には硫酸イオン・硝酸イオンの両方が影響し、酸性物質を中和するのはアンモニウムイオンやカルシウムイオンなどの塩基性物質。黄砂粒子はアルカリ性炭酸塩を多く含み、飛来時はむしろ降水のpH値を上げる（酸性度を弱める）方向に働く。〔R4-Ⅲ-3〕"},
 {f:"測定・分析", q:"「大気中微小粒子状物質（PM2.5）成分測定マニュアル」に関する記述のうち、最も不適切なものはどれか。", h:"有機炭素と対になる炭素成分区分の名称に注意。",
  c:["PM2.5に含まれる炭素成分は、有機炭素及び炭酸塩炭素の2種類に区分される","PM2.5に含まれるイオン成分をイオンクロマトグラフ法で分析する際は、捕集フィルタに超純水を加えて浸し、超音波を照射してイオン成分を抽出する","PM2.5に含まれるニッケルを分析する場合は、捕集フィルタを密閉容器内で硝酸、ふっ化水素酸及び過酸化水素を加えて分解する","PM2.5に含まれる水溶性有機炭素の測定方法として、燃焼酸化非分散赤外線吸収法による全有機炭素（TOC）測定法がある"], a:0, v:"answer",
  n:"<b>PM2.5の炭素成分は有機炭素（OC）と元素状炭素（EC、通称「黒色炭素」）の2種類に区分される</b>。「炭酸塩炭素」という区分は誤り。イオン成分はフィルタに超純水を加え超音波抽出、ニッケルは密閉容器内で硝酸・ふっ化水素酸・過酸化水素により分解、水溶性有機炭素はTOC測定法（燃焼酸化非分散赤外線吸収法）で測定するのはいずれもマニュアル記載の正しい方法。〔R4-Ⅲ-21〕"},
 {f:"測定・分析", q:"「水質汚濁に係る環境基準」における総水銀及びアルキル水銀の測定方法に関する記述のうち、最も適切なものはどれか。", h:"検出器の種類と対象成分の組合せに注意。",
  c:["アルキル水銀の測定には、電子捕獲型検出器（ECD）を備えたガスクロマトグラフを用いる","総水銀の測定には、pH指示薬を用いた比色分析装置を用いる","塩化物イオンを多量に含む試料では、過マンガン酸カリウムにより生じる遊離塩素の残留がアルキル水銀の測定を促進するため、積極的に残留させる","アルキル水銀の測定において、無機水銀の混入は測定精度に影響しないため、試料抽出液の洗浄は不要である"], a:0, v:"answer",
  n:"<b>アルキル水銀の測定にはECD付きガスクロマトグラフを用いる</b>のが正しい。総水銀の測定には比色分析ではなく、水銀中空陰極ランプ等を備えた原子吸光分析装置（還元気化方式）を用いる。塩化物イオン由来の遊離塩素は<b>総水銀の測定を妨げる</b>ため残留させないようにする必要があり、逆に積極的に残留させるのは誤り。多量の無機水銀は<b>アルキル水銀の測定に影響を与える</b>ため、試料抽出液は入念な洗浄が必要。〔R4-Ⅲ-22〕"},
 {f:"国際", q:"ラムサール条約（特に水鳥の生息地として国際的に重要な湿地に関する条約）に関する記述のうち、最も適切なものはどれか。", h:"『人工的な湿地は対象外』という誤解に注意。",
  c:["ラムサール条約が指定の対象とする湿地には、湖沼や河川などの自然の湿地のほか、ダム湖やため池などの人工的な湿地環境も含まれる","日本でラムサール条約湿地に登録するための条件には、国の法律による将来にわたる保全は含まれておらず、国際機関による直接管理が必須とされている","条約の基盤となる考え方は開発を優先するものであり、『ワイズユース（賢明な利用）』は例外的・補助的な位置づけにすぎない","2021年11月時点で日本のラムサール条約登録湿地は10箇所程度にとどまっている"], a:0, v:"answer",
  n:"<b>ラムサール条約の対象湿地には、ダム湖・ため池などの人工的な湿地環境も含まれる</b>（湿原・湖沼・河川・湧水地・地下水系・塩性湿地・マングローブ林・干潟・藻場など多岐にわたる）。日本での登録条件は「国際的に重要な湿地であること」「国の法律により将来にわたって自然環境の保全が図られること」「地元住民などから登録への賛意が得られること」の3つで、国際機関による直接管理は要件ではない。条約の基盤理念は「保全・再生」と「ワイズユース」及びこれらを促進する「交流・学習」。2021年11月時点で日本の登録湿地は53箇所、約15万ヘクタールに及ぶ。〔R4-Ⅲ-24〕"},
 {f:"自然環境", q:"国立公園に関する記述のうち、最も適切なものはどれか。", h:"『公園区域の大半が海域』という記述の対象公園に注意。",
  c:["屋久島国立公園は、樹齢千年を超えるスギなどの巨樹・巨木からなる天然林が広がる島と、現在も火山活動が続く薩南諸島最大の火山島から構成されている","奄美群島国立公園は、公園区域の大半が海域からなり、陸域の自然環境はごく一部にとどまるが、サンゴ礁や海浜植生を含む多様な海域景観を有し、周辺離島まで公園区域に含まれる","小笠原国立公園を構成する島々は、かつて大陸と陸続きであったため、大陸と共通する動植物相が広く見られる","西表石垣国立公園には我が国最大規模のマングローブ林があるが、サンゴ礁は分布していない"], a:0, v:"answer",
  n:"<b>屋久島国立公園は、巨樹・巨木の天然林が広がる島と、現在も火山活動が続く薩南諸島最大の火山島（口永良部島）から構成される</b>のが正しい。奄美群島国立公園は海と陸が連続する多様な景観を持つが、公園区域の<b>大半は陸域（森林）</b>であり「大半が海域」は誤り。小笠原国立公園は大陸と陸続きになったことがない「海洋島」で、独自の進化を遂げた動植物相を持つ。西表石垣国立公園はマングローブ林とサンゴ礁の<b>両方</b>を有する。〔R4-Ⅲ-25〕"},
 {f:"法令・制度", q:"令和4年改正外来生物法（特定外来生物による生態系等に係る被害の防止に関する法律）に関する記述のうち、最も適切なものはどれか。", h:"アカミミガメ・アメリカザリガニは『通常の特定外来生物』ではありません。",
  c:["改正外来生物法では、ヒアリ類など緊急に対処が必要な外来生物への対策として、生息調査のための土地への立ち入りを可能とするなど権限が拡充された","改正外来生物法により、アメリカザリガニやアカミミガメは通常の特定外来生物に指定され、施行前から飼育していた個体も含めて個人の飼育が全面的に禁止された","特定外来生物は生きた個体のみが規制対象であり、卵や種子、器官などは規制の対象外である","外来生物法では、特定外来生物の飼養等や輸入は原則自由であり、届出さえすれば特段の規制なく行うことができる"], a:0, v:"answer",
  n:"<b>令和4年改正では、緊急に対処が必要な外来生物（ヒアリ類など）への対処のため、生息調査のための土地への立ち入りを可能にするなど権限が拡充された</b>。一方、アメリカザリガニ・アカミミガメは通常の特定外来生物ではなく<b>条件付特定外来生物</b>として指定され、販売・頒布・輸入・野外放出等は規制されるが、施行前から飼育していた個体の<b>個人飼育は禁止されていない</b>点が異なる。特定外来生物は生きているものに限られるが、個体だけでなく卵・種子・器官なども対象。飼養等・輸入は原則禁止。〔R4-Ⅲ-27〕"},
 {f:"自然環境", q:"一般的な生物調査法に関する記述のうち、最も適切なものはどれか。", h:"スウィーピングとビーティングの手法を取り違えないように。",
  c:["昆虫類のベイトトラップ法は、誘引餌を入れたプラスチックコップなどの容器を、口が地表面と同じ高さになるように埋設し、落ち込んだ昆虫を採集する方法である","哺乳類のフィールドサイン法は、積雪のある地域では足跡が判別しにくくなるため、無雪期に実施することが基本である","昆虫類のライトトラップ法は夜行性昆虫を対象とするため、街灯など強い光源の近くで実施するとより多くの個体を捕獲でき、都市部の公園でも同様の効果が期待できる","昆虫類の調査法であるビーティングは、捕虫網を振って草本上や花上の昆虫をすくい採る方法である"], a:0, v:"answer",
  n:"<b>ベイトトラップ法は誘引餌入りの容器を地表面と同じ高さに埋設し、落ち込んだ昆虫を捕える方法</b>が正しい。哺乳類のフィールドサイン法は、むしろ<b>積雪期の方が足跡の確認が容易</b>で実施が重要とされる。ライトトラップ法は街灯等の強い光源の近くでは誘引効果が薄れるため<b>避けるべき</b>場所とされる。ビーティングは<b>叩き棒で樹上等の昆虫を叩き落とし白布で受ける</b>方法で、捕虫網ですくうのはスウィーピングであり、説明が入れ替わっている。〔R4-Ⅲ-30〕"},
 {f:"生物多様性", q:"環境省レッドリストのカテゴリーとその略称の組合せとして、正しいものはどれか。", h:"絶滅危惧のIA類・IB類・II類で略称を取り違えないように。",
  c:["準絶滅危惧 － NT","絶滅危惧IA類 － EN","絶滅危惧II類 － EX","絶滅 － CR"], a:0, v:"answer",
  n:"<b>準絶滅危惧の略称はNT（Near Threatened）</b>。環境省レッドリストのカテゴリーと略称は、絶滅＝EX、絶滅危惧IA類＝CR、絶滅危惧IB類＝EN、絶滅危惧II類＝VUの対応であり、IA類とIB類、あるいは絶滅と絶滅危惧II類の略称を取り違えないよう注意する。〔R4-Ⅲ-32〕"},
 {f:"国際", q:"我が国の世界自然遺産に関する記述のうち、最も適切なものはどれか。", h:"白神山地は国立公園に指定されているとは限りません。",
  c:["我が国の世界自然遺産には、「自然美」「地形・地質」「生態系」「生物多様性」の4つの評価基準のすべてを満たしているものはない","我が国には、文化遺産と自然遺産の両方の価値を有する複合遺産が1件存在する","世界自然遺産の管理のためには、自然公園法とは別に『世界自然遺産法』という特別の法制度が設けられている","我が国の世界自然遺産5か所（屋久島・白神山地・知床・小笠原諸島・奄美大島等）は、いずれも国立公園に指定されている"], a:0, v:"answer",
  n:"<b>日本の世界自然遺産（屋久島・白神山地・知床・小笠原諸島・奄美大島，徳之島，沖縄島北部及び西表島）は、いずれも4つの評価基準をすべて満たしているわけではない</b>。日本に複合遺産はなく、世界自然遺産に限定した特別の法制度もなく、自然公園法など既存の法律・制度の組合せで管理され、関係行政機関等からなる「地域連絡会議」が設置される。なお白神山地は森林生態系保護地域・自然環境保全地域等により保護されており、<b>国立公園には指定されていない</b>ため「いずれも国立公園」は誤り。〔R4-Ⅲ-33〕"},
 {f:"自然環境", q:"令和3年の自然公園法改正（自然公園法の一部を改正する法律）に関する記述のうち、最も適切なものはどれか。", h:"協議会制度は2つ創設されました。目的の違いに注意。",
  c:["集団施設地区等の利用拠点における質の向上のため、協議会の設置及び利用拠点整備改善計画制度が創設された","自然体験活動促進計画制度は地域住民の生活環境の保全のみを目的として創設され、国立公園等の利用促進とは関係がない","公園計画に質の高い自然体験活動の促進に関する基本的な事項を定めるのは、環境大臣ではなく各都道府県知事とされた","公園事業の譲渡が行われた場合、公園事業者の地位は承継されず、新たな事業者が改めて一から許可を取得しなければならない"], a:0, v:"answer",
  n:"<b>利用拠点整備改善計画制度が創設され、集団施設地区等の利用拠点の質向上のため協議会の設置による地域関係者の一体的な整備改善が促進される</b>ようになった。これとは別に、国立公園等の魅力向上のための自然体験活動促進を目的とした「自然体験活動促進計画制度」も協議会の設置とあわせて創設されており、国立公園等の利用促進と無関係ではない。公園計画の質の高い自然体験活動促進に関する基本的な事項は<b>環境大臣</b>が定めることとされた。公園事業の譲渡による公園事業者の<b>地位の承継</b>に関する規定も整備された。〔R4-Ⅲ-35〕"},
 {f:"法令・制度", q:"大気汚染防止法第22条に基づく「有害大気汚染物質等」の常時監視の対象物質について、適切なものは？", h:"『環境基準値がある物質だけ』と『指針値もある物質』の範囲の違いに注意。通常の大気汚染物質（6物質）の監視対象と混同しないこと。",
  c:["環境基準値が設定された4物質だけでなく、指針値が設定された物質等も含め計21物質が対象となる","環境基準値が設定されているベンゼン等4物質だけが対象である","指針値が設定された物質は常時監視の対象に含まれない","対象物質は毎年見直され、現在は通常の大気汚染物質と同じ6物質に統一され、指針値物質は廃止された"], a:0, v:"answer",
  n:"<b>有害大気汚染物質等の常時監視は計21物質が対象</b>（環境基準4物質＋指針値11物質＋その他6物質）。「環境基準値がある4物質だけ」とした記述が誤りとして出題されました。6物質（NO2・SPM・Ox・SO2・CO・PM2.5）は通常の大気汚染物質の環境基準対象で、有害大気汚染物質等とは別枠です。〔R5-Ⅲ-1〕"},
 {f:"大気・水質", q:"黄砂が日本の降水のpHに与える影響として適切なものは？", h:"黄砂粒子に含まれる成分の性質（酸性かアルカリ性か）から考える。",
  c:["黄砂粒子に含まれるアルカリ性炭酸塩が部分溶解し、降水のpH値を高くする（中和する）方向に働く","黄砂粒子は酸性の硫酸塩を主体とし、降水のpHをさらに低下させる方向に働き、硫酸イオン・硝酸イオンによる酸性化をいっそう強める","黄砂粒子はpHに影響を与えず、酸性雨とは無関係の現象である","黄砂粒子はオゾン層破壊物質であり、酸性雨とは別のメカニズムで気候に影響する"], a:0, v:"answer",
  n:"<b>黄砂粒子のアルカリ性炭酸塩が降水に取り込まれ部分溶解し、pHを高くする（酸性を和らげる）方向に働く</b>。あわせて降水の酸性化に強く影響する酸性物質は硫酸イオン・硝酸イオンで、これを中和する塩基性物質としてアンモニウムイオン・カルシウムイオンの寄与が大きい点も出題されました。〔R5-Ⅲ-3〕"},
 {f:"国際", q:"ロッテルダム条約（PIC条約）の対象・趣旨として適切なものは？", h:"「事前の情報に基づく同意（Prior Informed Consent）」という条約の通称がヒント。",
  c:["特定の有害な化学物質・農薬の国際取引に際し、輸入国の事前の同意（PIC手続）を義務付ける","残留性有機汚染物質から人の健康の保護及び環境の保全を図り、附属書に基づき製造・使用を廃絶する","水銀及び水銀化合物の人為的な排出及び放出から人の健康及び環境を保護する","有害廃棄物の国境を越える移動及びその処分を規制する"], a:0, v:"answer",
  n:"<b>ロッテルダム条約＝有害化学物質・農薬の国際取引におけるPIC（事前の情報に基づく同意）手続</b>。誤答はそれぞれ、残留性有機汚染物質＝ストックホルム条約（POPs条約）、水銀＝水俣条約、有害廃棄物の越境移動＝バーゼル条約の説明で、ロッテルダム条約に誤って充てると出題時の誤りになります。ほかウィーン条約はオゾン層の保護、ロンドン条約は陸上発生廃棄物等の投棄による海洋汚染の防止が対象。〔R5-Ⅲ-4〕"},
 {f:"法令・制度", q:"土壌汚染対策法施行規則が定める特定有害物質の溶出基準（検液1Lあたり）の組合せとして適切なものは？", h:"カドミウムと鉛、六価クロムと砒素、それぞれ値を入れ替えた誤答に注意。",
  c:["カドミウム0.003mg/L、六価クロム0.05mg/L、水銀0.0005mg/L、鉛0.01mg/L、砒素0.01mg/L","カドミウム0.01mg/L、六価クロム0.05mg/L、水銀0.0005mg/L、鉛0.003mg/L、砒素0.01mg/L","カドミウム0.003mg/L、六価クロム0.01mg/L、水銀0.0005mg/L、鉛0.05mg/L、砒素0.01mg/L","カドミウム0.003mg/L、六価クロム0.05mg/L、水銀0.0005mg/L、鉛0.01mg/L、砒素0.05mg/L"], a:0, v:"answer",
  n:"<b>カドミウム0.003／六価クロム0.05／水銀0.0005／鉛0.01／砒素0.01（すべて検液1Lあたりmg）</b>。誤答は、カドミウムと鉛の値を入れ替えたもの、六価クロムと鉛の値を入れ替えたもの、砒素だけ0.05にすり替えたもの。★要注意：六価クロムは<b>水質の環境基準が令和4年4月に0.02mg/Lへ強化</b>され、地下水の浄化基準も令和6年4月から0.02mg/Lになったが、<b>土壌の基準は0.05mg/Lのまま</b>（環境省「土壌環境基準 別表」）。水と土で値が違う点が狙われやすい。〔R5-Ⅲ-17〕"},
 {f:"測定・分析", q:"薄層クロマトグラフィー（TLC）のRf値の定義として適切なものは？", h:"「原線」を起点に、試料成分の移動距離と溶媒の移動最先端までの距離、どちらが分子でどちらが分母か。",
  c:["原線から試料成分までの移動距離を、原線から溶媒の移動最先端までの距離で除した値","原線から溶媒の移動最先端までの距離を、原線から試料成分までの移動距離で除した値","試料成分の保持時間を、移動相（溶媒）の流量で除した値","理論段数を用いてカラムの分離能を数値化した指標"], a:0, v:"answer",
  n:"<b>Rf値＝試料成分の移動距離 ÷ 溶媒の移動最先端までの距離</b>。誤答は、分子と分母を逆にしたもの、保持時間・流量というカラムクロマトグラフィーの概念と混同したもの、カラムの分離能の指標である理論段数と取り違えたもの。あわせて同じ設問では、電子捕獲検出器（ECD）は放射性同位元素のベータ線による自由電子の再結合を、熱イオン化検出器（FTD）はアルカリ（土類）塩による含窒素・含りん化合物のイオン化促進を利用する点も正しい記述として出題されました。〔R5-Ⅲ-21〕"},
 {f:"国際", q:"ラムサール条約における「湿地」の定義として適切なものは？", h:"「天然のもの」に限られるかどうかがポイント。環境省の条約解説ページに定義がある。",
  c:["天然のものであるか人工のものであるかを問わず、沼沢地・湿原・泥炭地又は水域をいい、低潮時の水深が6mを超えない海域を含む","天然のものに限られ、人工の水域（ため池・水田等）は対象に含まれず、指定の判断も国内の基準のみに基づいて行われる","淡水域に限られ、汽水域・鹹水域（海水）は対象に含まれない","低潮時の水深が10mを超えない海域まで含む、より広い定義である"], a:0, v:"answer",
  n:"<b>「天然又は人工」を問わない</b>のが条約第1条1の定義（環境省サイトで確認）。「天然のものに限られる」とした記述が誤りとして出題されました。水の滞留・流動、淡水・汽水・鹹水のいずれも問わず、低潮時水深6m以内の海域も含みます。〔R5-Ⅲ-26〕"},
 {f:"自然環境", q:"次の自然公園法に基づく指定地域のうち、すべて国立公園であるものは？", h:"1つでも国定公園が混じっていれば不正解。有名な国定公園の名前を覚えておく。",
  c:["秩父多摩甲斐、妙高戸隠連山、南アルプス、白山、伊勢志摩","利尻礼文サロベツ、網走、阿寒摩周、釧路湿原、支笏洞爺","十和田八幡平、鳥海、三陸復興、蔵王、磐梯朝日","山陰海岸、大山隠岐、瀬戸内海、秋吉台、足摺宇和海"], a:0, v:"answer",
  n:"<b>秩父多摩甲斐・妙高戸隠連山・南アルプス・白山・伊勢志摩はすべて国立公園</b>。誤答の組には、網走、鳥海・蔵王、秋吉台という<b>国定公園</b>がそれぞれ紛れ込んでいます。〔R5-Ⅲ-32〕"},
 {f:"国際", q:"生物多様性・自然環境に関する国際的な枠組みと、その発足年・開催地の組合せとして適切なものは？", h:"AP-BON・IPSI・APAP・IPBESの4つ、年と開催地を入れ替えた誤答に注意。",
  c:["アジア保護地域パートナーシップ（APAP）は、2014年にシドニーで開催された世界国立公園会議において発足した","アジア太平洋生物多様性観測ネットワーク（AP-BON）は、2014年にシドニーで開催された世界国立公園会議において設立された","SATOYAMAイニシアティブ国際パートナーシップ（IPSI）は、2019年にパリで発足した","IPBES総会は、2010年に名古屋で開催され、地球規模の生物多様性評価報告書を採択した"], a:0, v:"answer",
  n:"<b>APAPは2014年・シドニーの世界国立公園会議で発足</b>。誤答は、AP-BON（実際は2009年設立）にAPAPの年・開催地を充てたもの、IPSI（実際は2010年発足）にIPBES総会の年・開催地（2019年パリ）を充てたもの、IPBES総会（2019年パリで地球規模評価報告書を採択）を2010年名古屋（COP10）にすり替えたもの。〔R5-Ⅲ-33〕"},
 {f:"生物多様性", q:"国内の「30by30目標」推進体制に関する記述として適切なものは？", h:"「30by30ロードマップ」を取りまとめた主体と時期、有志連合「アライアンス」の発足時期がポイント。",
  c:["「30by30ロードマップ」は、生物多様性国家戦略関係省庁連絡会議により2022年3月に取りまとめられた","30by30目標は、2022年12月採択の「昆明・モントリオール生物多様性枠組」には、途上国の反対により盛り込まれなかった","有志連合「生物多様性のための30by30アライアンス」は、2021年6月のG7コーンウォール・サミットで発足した","「30by30ロードマップ」は、環境省が単独で2022年3月に策定した"], a:0, v:"answer",
  n:"<b>「30by30ロードマップ」は生物多様性国家戦略関係省庁連絡会議が2022年3月に取りまとめ</b>（環境省単独ではない）。30by30目標は実際には昆明・モントリオール生物多様性枠組に組み込まれており、「反対で盛り込まれなかった」は誤り。「30by30アライアンス」の発足は2022年4月で、2021年のG7コーンウォール・サミットで各国が約束した「自然協約」とは別の国内推進体制。〔R5-Ⅲ-34〕"},
 {f:"法令・制度", q:"令和4年改正の外来生物法における特定外来生物の新区分に関する記述として適切なものは？", h:"アカミミガメ・アメリカザリガニと、ヒアリとで区分が異なる点に注意。",
  c:["アカミミガメとアメリカザリガニは、規制の一部を政令で適用除外できる「条件付特定外来生物」に指定され、野外への放出・輸入・販売等が許可なしにはできなくなった","ヒアリは「条件付特定外来生物」に指定され、飼養・栽培等が広く認められることとなった","都道府県及び市町村が防除を行うに当たり、国への確認手続は一切不要となった","アカミミガメ・アメリカザリガニは、移動制限や通関後の検査等の対象となる「要緊急対処特定外来生物」に指定され、飼養も新たに許可制となった"], a:0, v:"answer",
  n:"<b>アカミミガメ・アメリカザリガニ＝「条件付特定外来生物」</b>。規制の一部を適用除外としつつ、野外放出・輸入・販売・購入・頒布等は許可なしに行うことを禁止。一方ヒアリは移動制限・通関後検査等の対象となる「要緊急対処特定外来生物」。誤答は、ヒアリを条件付特定外来生物としたもの、アカミミガメ・アメリカザリガニを要緊急対処特定外来生物としたもの（どちらも区分の取り違え）、自治体の防除で国への確認手続が「一切不要」になったとするもの（実際は国の確認・認定の仕組みが新設された）。〔R5-Ⅲ-35〕"},
 {f:"地球環境", q:"IPCC第6次評価報告書統合報告書（2023年3月公表）の政策決定者向け要約（SPM）に関する記述のうち、最も適切なものはどれか。", h:"「機会の窓」という表現が何について使われたかがカギ。",
  c:["全ての人々にとって住みやすく持続可能な将来を確保するための機会の窓は急速に閉じつつあり、この10年間の選択や対策が現在から数千年先まで影響を持つと指摘した。","検討したシナリオのほとんどで2050年代前半には1.5℃に到達し、遅くとも2060年頃までには到達するとの見通しを示し、対策には十分な猶予があるとした。","2021年10月までに発表された各国のNDCsから見込まれる2030年の世界全体の排出量であれば、21世紀中に温暖化を2℃未満に抑えられる可能性が高いとした。","コストが20米ドル/トン-CO2を超える太陽光、風力、エネルギー効率改善等に限り、温室効果ガスの排出削減に大きく貢献するとした。"], a:0, v:"answer",
  n:"<b>「機会の窓」が急速に閉じつつあり、この10年の選択・対策が数千年先まで影響する</b>というのがIPCC第6次評価報告書統合報告書（SPM）の警告。誤答は、1.5℃到達を2050年代前半〜2060年頃として猶予があるとしたもの（本試験で「最も不適切」とされた内容で、実際のSPMの記述とは異なる）、各国のNDCsのままでも2℃未満に抑えられるとしたもの（実際は「1.5℃を超える可能性が高い」が結論で正反対）、低コスト条件「20米ドル/トン-CO2以下」を「超える」に反転させたもの。〔R6-Ⅲ-3〕"},
 {f:"法令・制度", q:"土壌環境基準に関する記述のうち、最も適切なものはどれか。", h:"「検液中に検出されないこと」という基準が定められているのはどの物質かがポイント。",
  c:["全シアンの測定方法には、吸光光度法、イオン電極法又は流れ分析法が用いられる。","総水銀については、他の重金属類と同様に「検液中に検出されないこと」という基準が定められている。","カドミウム及び砒素については農用地に対する環境基準は定められておらず、銅についてのみ農用地に対する環境基準が定められている。","土壌環境基準の測定における検液の作成方法は、カドミウム等の重金属類とPCBとで異なる操作が必要である。"], a:0, v:"answer",
  n:"<b>全シアンの測定方法は吸光光度法、イオン電極法又は流れ分析法</b>（本試験で正しい記述として出題）。誤答は、総水銀を「検液中に検出されないこと」としたもの（そう定められているのはアルキル水銀・全シアン・有機燐・PCB等で、総水銀は「検液1Lにつき0.0005mg以下」。本試験で「最も不適切」とされた記述。環境省「土壌環境基準」別表で確認）、カドミウム・砒素・銅の農用地基準の有無を逆にしたもの（実際はカドミウム・砒素に農用地基準があり、銅は農用地の基準のみ）、検液の作成方法を重金属類とPCBで「異なる」としたもの（実際は同じ）。〔R6-Ⅲ-15〕"},
 {f:"自然環境", q:"日本の自然公園制度に関する記述のうち、最も適切なものはどれか。", h:"都道府県立自然公園の特別地域における行為規制は、誰の基準の範囲内で定められるかがカギ。",
  c:["都道府県立自然公園では、条例の定めにより特別地域を指定できるが、その区域内における行為に関する規制は、国立公園の規制の範囲内において定めることができる。","2023年3月31日現在の国立公園34か所・国定公園58か所に都道府県立自然公園を加えた自然公園の総面積は、国土の4分の1（25%）に達している。","1931年に制定されたのは自然公園法であり、同法に基づいて瀬戸内海・雲仙・霧島の3か所が最初の国立公園として指定された。","1957年に自然公園法が制定されたことにより、都道府県立自然公園の指定権限は環境大臣に一元化された。"], a:0, v:"answer",
  n:"<b>都道府県立自然公園の特別地域の行為規制は、条例により、国立公園の規制の範囲内で定める</b>（本試験で正しい記述として出題）。誤答は、自然公園の総面積の割合を誇張したもの（本試験では「国土の20%を超える」という記述が最も不適切とされた）、1931年に制定された法律を自然公園法としたもの（1931年は国立公園法で、1957年に自然公園法に改められた）、都道府県立自然公園の指定権限を環境大臣に一元化したとするもの（実際は都道府県が条例で指定する）。〔R6-Ⅲ-33〕"},
 {f:"生物多様性", q:"環境省レッドリスト及びレッドデータブックに関する記述のうち、最も適切なものはどれか。", h:"レッドリストに掲載されることと、捕獲・採取が法的に規制されることは別の話。",
  c:["レッドリストに掲載される種の中には、商業目的や鑑賞目的の乱獲・盗掘のおそれが増す種もあるが、掲載と同時に自動的に捕獲・採取等が規制されるわけではない。","絶滅のおそれがある種（絶滅危惧種）とは、レッドリストのカテゴリーのうち、絶滅危惧Ⅰ類・Ⅱ類に加え、準絶滅危惧も含む区分である。","レッドデータブックとは、専門家による検討会が個々の種の絶滅危険度を評価し順位付けしたリストそのものであり、レッドリストはその解説書として作成される。","環境省レッドリストで、絶滅危惧IA類の略称はEN（Endangered）である。"], a:0, v:"answer",
  n:"<b>レッドリストへの掲載は乱獲・盗掘の懸念を示すが、掲載＝法的な捕獲規制ではない</b>（規制には種の保存法等による別の指定が必要）。誤答は、絶滅危惧種に準絶滅危惧まで含めたもの（絶滅危惧種は絶滅危惧Ⅰ類・Ⅱ類）、レッドリストとレッドデータブックの役割を入れ替えたもの（リスト＝評価・順位付け、ブック＝生息状況などの解説書）、絶滅危惧IA類の略称をENとしたもの（IA類はCR、ENはIB類）。なお本試験では、改訂・刊行の頻度についての記述が「最も不適切」とされた。〔R6-Ⅲ-34〕"},
 {f:"法令・制度", q:"外来生物対策に関する記述のうち、最も適切なものはどれか。", h:"特定外来生物のうち、我が国で初めて根絶が確認された種は何か。",
  c:["カナダガンは、我が国に定着した特定外来生物のうち、初めて根絶が確認された事例である。","セイヨウオオマルハナバチは、外来生物法の許可を得ても飼養等が一切認められておらず、生業維持のための特例は設けられていない。","条件付特定外来生物として、野外への放出等が許可なしに禁止されているのは、ヒアリ類とセイヨウオオマルハナバチである。","セイヨウオオマルハナバチについては、在来マルハナバチ類の利用促進を図るため、総出荷量を倍増させる方針へ許可基準が変更された。"], a:0, v:"answer",
  n:"<b>カナダガンは、我が国に定着した特定外来生物で初めて根絶が確認された事例</b>（本試験で正しい記述として出題）。誤答は、セイヨウオオマルハナバチは許可を得ても飼養できないとしたもの（実際は生業の維持に該当すれば外来生物法の許可を得て飼養できる）、条件付特定外来生物の対象をヒアリ類とセイヨウオオマルハナバチとしたもの（条件付はアカミミガメ・アメリカザリガニ、ヒアリ類は要緊急対処特定外来生物）、セイヨウオオマルハナバチの総出荷量を倍増させるとしたもの（実際は在来種の利用促進のため半減を目指す）。〔R6-Ⅲ-35〕"},
 {f:"国際", q:"海洋投棄による汚染防止を目的とする「ロンドン条約」の正式名称・対象として、最も適切なものはどれか。", h:"有害廃棄物の越境移動やオゾン層保護とは対象が異なる条約です。",
  c:["廃棄物その他の物の投棄による海洋汚染の防止に関する条約で、陸上で発生した廃棄物等を船舶等から海洋に投棄することによる汚染を防止する。","有害廃棄物の国境を越える移動及びその処分を規制する条約であり、締約国は事前通報・同意なしに輸出入を行うことができず、違反時には是正措置を講じる義務を負う","オゾン層の保護のための国際的な枠組みを定める条約である。","水銀及び水銀化合物の人為的な排出・放出から人の健康及び環境を保護する条約である。"], a:0, v:"answer",
  n:"<b>ロンドン条約（廃棄物その他の物の投棄による海洋汚染の防止に関する条約）は、船舶等からの海洋投棄による汚染防止が目的</b>。誤答はそれぞれ、有害廃棄物の越境移動及び処分の規制＝バーゼル条約、オゾン層保護＝ウィーン条約、水銀規制＝水俣条約の説明を充てたもの。本試験では、ストックホルム条約（本来はPOPs＝残留性有機汚染物質の規制が対象）に、有害な化学物質・駆除剤の国際貿易における事前同意（PIC）手続という別の条約（ロッテルダム条約）の説明を誤って充てた組合せが「最も不適切」として出題された。〔R1-Ⅲ-3〕"},
 {f:"法令・制度", q:"環境影響評価法に基づき事業者が行う手続きのうち、「方法書」の次に行われる手続きとして正しいものはどれか。", h:"計画段階配慮書の後、まず調査・予測・評価の方法を決める段階があります。",
  c:["準備書（現地調査・予測・評価の結果をとりまとめ、公告・縦覧して意見を聴く）","配慮書（事業の位置・規模等の検討段階で環境保全上の配慮事項をとりまとめる）","評価書（意見を踏まえて評価内容を確定し公告・縦覧する）","報告書（工事完了後の事後調査の結果をとりまとめる）"], a:0, v:"answer",
  n:"<b>方法書の次は準備書</b>。図書の作成順は<b>配慮書→方法書（調査・予測・評価の項目・手法を絞り込むスコーピング）→準備書→評価書→報告書</b>。配慮書は方法書より前、評価書・報告書は準備書より後に作成される。<br><br><b>覚え方</b>：両端の配慮書と報告書は2011年の法改正（2013年4月全面施行）で足された書類で、<b>配慮書＝計画段階のいちばん最初</b>、<b>報告書＝工事後のいちばん最後</b>。真ん中の3つは<b>方法（どう調べるかを決める）→準備（下書きを出して意見を聴く）→評価（意見を反映した清書）</b>。語呂は「<b>はい、方法を準備して評価を報告</b>」（配・方・準・評・報）。〔R1-Ⅲ-5〕"},
 {f:"法令・制度", q:"湖沼水質保全特別措置法において、都道府県知事が流出水対策地区を指定したときの流出水対策推進計画の策定について、正しいものはどれか。", h:"指定地区ごとに湖沼水質保全計画の中に位置づけられる計画です。",
  c:["都道府県知事は、湖沼水質保全計画において流出水対策推進計画を定めなければならない。","流出水対策推進計画の策定は任意であり、都道府県知事の判断で定めないこともできる。","流出水対策推進計画は環境大臣が策定し、都道府県知事はこれに従うのみである。","流出水対策推進計画は、指定湖沼の総量規制が適用される場合に限り策定される。"], a:0, v:"answer",
  n:"<b>流出水対策地区を指定したときは、流出水対策推進計画の策定が義務付けられている</b>（定めなければならない）。同計画は湖沼水質保全計画の内計画として位置づけられる。なお都道府県知事が流出水対策地区を指定しようとするときに意見を聴くのは関係市町村長であり、指定後はその旨を公表するとともに区域を含む市町村に通知する。〔R1-Ⅲ-6〕"},
 {f:"大気・水質", q:"人の健康の保護に関する水質環境基準のうち、海域には基準値が適用されない項目の組合せとして正しいものはどれか。", h:"自然の海水中にもともと相当量含まれている元素が対象です。",
  c:["ふっ素及びほう素","ふっ素及びよう素","ほう素及び硝酸性窒素・亜硝酸性窒素","全ての健康項目（海域を除外する項目はない）"], a:0, v:"answer",
  n:"<b>ふっ素及びほう素は、海域には基準値を適用しない</b>（自然状態で海水中に相当量含まれているため）。硝酸性窒素及び亜硝酸性窒素は海域を含むすべての公共用水域に適用される。あわせて、生活環境の保全に関する環境基準では、有機汚濁の指標としてBODが河川に、CODが湖沼及び海域に適用される点も正しい記述として出題された。〔R1-Ⅲ-7〕"},
 {f:"化学物質", q:"シアン（CN）を70mg/L含むシアン化ナトリウム排水40m³を、次の2段階反応によりアルカリ塩素法で完全分解するのに必要な次亜塩素酸ナトリウム(NaOCl)の理論量に最も近い値はどれか。（CN=26、NaOCl=74.5）\n①NaCN+NaOCl→NaOCN+NaCl\n②2NaOCN+3NaOCl+H2O→2CO2+N2+2NaOH+3NaCl", h:"1段階目・2段階目それぞれで必要なNaOClのモル比をCN基準で合算します。",
  c:["約20kg","約12kg","約16kg","約10kg"], a:0, v:"answer",
  n:"<b>約20kg</b>。CN総量=70mg/L×40,000L=2,800g、モル数=2,800/26≈107.7mol。①式でCN 1molあたりNaOCl 1mol、②式でNaOCN(=CN由来)2molあたりNaOCl 3mol＝CN 1molあたり1.5mol必要なので、合計で<b>CN 1molあたりNaOCl 2.5mol</b>が必要。107.7mol×2.5×74.5g/mol≈20,060g≈20kg。〔R1-Ⅲ-8〕"},
 {f:"地球環境", q:"大気中の二酸化炭素(CO2)濃度に見られる季節変動の要因として、最も適切なものはどれか。", h:"陸上の植物の光合成と呼吸・分解、どちらが優勢かで濃度が上下します。",
  c:["夏季に植物の光合成が活発化してCO2が吸収されるため濃度が低下し、冬季は植物の呼吸や土壌有機物の分解が優勢となりCO2が放出されて濃度が上昇する。","夏季に植物の光合成が活発化することでCO2濃度が上昇し、冬季は呼吸・分解活動が優勢となって濃度が低下する。この変動幅は北半球高緯度ほど大きく、海洋の吸収量変化とあわせて年々の増加率にも影響する","季節変動は海洋のCO2吸収量の変化のみによって生じ、陸上生物圏の活動は関係しない。","季節変動は人為的なエネルギー消費量の季節差のみによって生じる。"], a:0, v:"answer",
  n:"<b>夏は光合成によるCO2吸収で濃度が下がり、冬は呼吸・分解によるCO2放出で濃度が上がる</b>。この向きを逆に「夏に上昇、冬に低下」とした記述が誤りとして出題された。海洋は人為起源CO2の大きな吸収源であり、大気中のメタン濃度も1980年代半ば以降増加基調（1999〜2006年頃は増加がほぼ停滞、2007年以降再び増加）が続いている。〔R1-Ⅲ-9〕"},
 {f:"循環経済", q:"第四次循環型社会形成推進基本計画が指摘する、有害物質を含む廃棄物のストック管理に関する記述として、最も適切なものはどれか。", h:"アスベスト・PCB等のPOPs廃棄物、水銀廃棄物、埋設農薬などが対象です。",
  c:["アスベスト、PCB等のPOPs廃棄物、水銀廃棄物、埋設農薬等について、所在が不明なものや適正な管理・処理を要するものが残されており、対応の遅れが懸念されている。","アスベストやPCB等の有害廃棄物問題は既に完全に解消しており、循環基本法制定から10年以上が経過し対応も完了しているため、今後の点検・報告義務も撤廃され、関連予算も計上されていない","有害物質を含む廃棄物のストック管理は、産業廃棄物のみが対象で一般廃棄物は対象外である。","埋設農薬は生分解性が高く、時間の経過とともに自然に無害化するためストック管理の対象から外れている。"], a:0, v:"answer",
  n:"<b>アスベスト・PCB等のPOPs廃棄物・水銀廃棄物・埋設農薬等は、所在不明や適正管理・処理を要するものが残り、対応の遅れが懸念される</b>という指摘が正しい記述として出題された。循環基本法制定（2000年）から約10年間で循環型社会形成は大きく進展したが、こうした有害物のストック管理は引き続き課題とされている。〔R1-Ⅲ-10〕"},
 {f:"一般廃棄物", q:"一般廃棄物のごみ焼却施設における余熱利用の方法として、最も適切なものはどれか。", h:"発電だけが余熱利用ではありません。",
  c:["発電のほか、施設内の暖房・給湯などにも利用されている。","余熱利用は発電に限られ、それ以外の用途に利用することは制度上認められていない。","余熱は焼却施設の運転には利用できず、必ず施設外の熱供給事業者に売却しなければならない。","余熱利用が可能なのは発電設備を持つ施設に限られ、発電設備のない施設では余熱は一切利用できない。"], a:0, v:"answer",
  n:"<b>ごみ焼却施設の余熱利用は、発電のほか施設内の暖房・給湯などの方法がある</b>。発電設備を有する施設は全体の一部にとどまり、発電設備のない施設でも温水・蒸気としての熱利用は行われている。〔R1-Ⅲ-11〕"},
 {f:"測定・分析", q:"PM2.5(微小粒子状物質)の標準測定法（ろ過捕集による質量濃度測定方法）における、フィルターの秤量条件として最も適切なものはどれか。", h:"秤量前に一定時間、温湿度を管理した部屋に置く必要があります。",
  c:["規定の温度・相対湿度に保たれた恒温・恒湿の部屋で、24時間以上コンディショニング（恒量化）してから秤量する。","秤量は現場で採取直後に、温湿度管理を行わずただちに行う。","フィルターは水洗いしてから乾燥重量を秤量する。","秤量は捕集後1週間以上経過してから行うことが望ましいとされ、恒温恒湿室での管理は不要であり、静電気除去の措置も特に求められない"], a:0, v:"answer",
  n:"<b>秤量前に恒温・恒湿の部屋で24時間以上コンディショニング（恒量化）する</b>。あわせて、質量濃度測定に用いる四フッ化エチレン（PTFE）製フィルターは帯電性が高いため、秤量にあたっては有効な静電気除去を行う必要がある点も正しい記述として出題された。〔R1-Ⅲ-13〕"},
 {f:"測定・分析", q:"分析装置に関する記述のうち、最も適切なものはどれか。", h:"対象が「常温で気体」に限られるとは限らない装置があります。",
  c:["ガスクロマトグラフ(GC)は、加熱により気化させた試料を移動相ガスとともにカラムに導入して分離する装置であり、常温で気体の物質に限らず、加熱すれば気化する液体・固体試料も対象となる。","ガスクロマトグラフ(GC)は、常温でガス状の物質のみを測定するための装置である。","蛍光X線分析計は、化合物中の元素の化学的な存在形態（酸化数・結合状態）を測定するための装置であり、非破壊で迅速に元素組成を把握できるため環境試料のスクリーニングに広く用いられ、前処理を要しない点が特長とされる","高速液体クロマトグラフ(HPLC)は、液体状の物質そのものを測定するための装置である。"], a:0, v:"answer",
  n:"<b>GCは加熱気化させた試料を対象にでき、常温で気体の物質に限らない</b>。誤答はそれぞれ、GCの対象を「常温で気体のみ」と限定した誤り、蛍光X線分析計を（実際は元素の種類・量を測定する装置なのに）存在形態の測定装置とした誤り、HPLCを（液相に溶けた物質の分離・測定装置なのに）「液体状物質そのもの」の測定装置とした誤り。〔R1-Ⅲ-15〕"},
 {f:"測定・分析", q:"LC/MS(液体クロマトグラフ質量分析法)において、移動相のpH調整に一般的に使用される緩衝液として、最も適切なものはどれか。", h:"MSのイオン源を汚染・詰まらせない、揮発性の緩衝液が使われます。",
  c:["酢酸アンモニウムなどの揮発性緩衝液","リン酸緩衝液などの不揮発性緩衝液","緩衝液は使用せず、常に純水のみを移動相とする","硫酸緩衝液などの強酸性の不揮発性緩衝液"], a:0, v:"answer",
  n:"<b>LC/MSの移動相pH調整には、酢酸アンモニウム等の揮発性緩衝液が一般的に用いられる</b>。リン酸緩衝液のような不揮発性の緩衝液はイオン源に析出・蓄積して感度低下や汚染の原因となるため、LC/MSでは避けられる。LC/MSはGC/MSに対し、難揮発性・高極性・熱不安定性の化合物を直接分析対象にできる点が有利で、イオン化法にはエレクトロスプレーイオン化法や大気圧化学イオン化法が用いられる。〔R1-Ⅲ-16〕"},
 {f:"測定・分析", q:"ガスクロマトグラフ(GC)分析における「コールドオンカラム注入法」に関する記述として、最も適切なものはどれか。", h:"試料を高温の注入口にさらさずにカラムへ直接導入する方法です。",
  c:["試料を加熱した注入口にさらさず低温でカラムに直接導入する方法で、熱に対して不安定な成分の分析に有効である。","試料を高温の気化室で瞬時に気化させてから導入する方法で、熱に不安定な成分ほど適しており、揮発性の高い成分の分析に広く用いられる","検出器の温度を試料注入時だけ低く保つ注入法で、カラムの温度とは無関係である。","固定相を持たないカラムでのみ使用できる注入法である。"], a:0, v:"answer",
  n:"<b>コールドオンカラム注入法は、試料を高温にさらさず低温でカラムに直接導入するため、熱に不安定な成分の分析に有効</b>。なお充てんカラム（パックドカラム）とキャピラリーカラムを分離能力（理論段数）で比較すると、キャピラリーカラムの方が高い理論段数を達成できる。〔R1-Ⅲ-17〕"},
 {f:"測定・分析", q:"排ガス中のダイオキシン類の測定方法(JIS K 0311)における試料採取に関する記述として、最も適切なものはどれか。", h:"ダストの濃度が低い場合や等速吸引が難しい場合の例外規定があります。",
  c:["等速吸引によって排ガスを吸引するのが原則だが、排ガス中のダスト濃度が1mg/m³(0℃、101.32kPa)以下の場合や等速吸引が不可能な場合は、等速吸引を行わずに平均流速程度で一定に吸引してもよい。","等速吸引は必須条件であり、ダスト濃度にかかわらず例外は認められない。等速吸引を行わない場合は測定値の信頼性が損なわれるため、ダスト濃度が1mg/m³以下であっても平均流速による吸引は認められていない","試料ガスの採取は、ダストの濃度が高いほど等速吸引を省略できる。","採取装置はダスト濃度に関わらず、常に定量ポンプによる一定流量吸引のみで行う。"], a:0, v:"answer",
  n:"<b>ダスト濃度1mg/m³以下または等速吸引が不可能な場合は、等速吸引を行わずに平均流速程度で一定に吸引してよい</b>という例外がある。この規定は2020年改正後のJIS K 0311：2020でも維持されている。〔R1-Ⅲ-18〕"},
 {f:"測定・分析", q:"「アスベストモニタリングマニュアル」に基づく、解体現場等における迅速測定法に関する記述として、最も適切なものはどれか。", h:"現場でその場測定でき、サンプリングから短時間で飛散の有無を判定できます。",
  c:["位相差/偏光顕微鏡法は現場での測定が可能で、サンプリングから1時間程度でアスベストの飛散の有無を判定できる。","迅速測定法は電子顕微鏡法に限られ、現場では実施できず必ず持ち帰って分析する。","迅速測定法による判定には、サンプリングから最低でも1週間程度を要する。","迅速測定法では、アスベストか否かの最終判定まで顕微鏡法のみで完結し、他の分析は一切不要である。"], a:0, v:"answer",
  n:"<b>位相差/偏光顕微鏡法は現場で測定でき、サンプリングから1時間程度で飛散の有無を判定できる</b>迅速測定法。なお試料採取は強風や降雨の場合には実施を避け、繊維状物質がアスベストかどうかの確定判別には位相差顕微鏡法と電子顕微鏡法のいずれかが必要となる。〔R1-Ⅲ-19〕"},
 {f:"測定・分析", q:"全窒素の分析法である紫外線吸光光度法（試料をペルオキソ二硫酸カリウムで加熱分解後、波長220nmの吸光度を測定する方法）に関する記述として、最も適切なものはどれか。", h:"海水には、紫外部の吸光度測定を妨害するイオンが多く含まれます。",
  c:["海水試料には臭化物イオン等が含まれ、これが紫外部の吸光度測定を妨害するため、海水にそのまま適用するのは困難である。","湖沼水・海水のいずれにも妨害なく適用できる、汎用性の高い方法である。","河川水には適用できるが、湖沼水には一切適用できない方法であり、湖沼水の全窒素測定には紫外線吸光光度法以外の測定法を用いる必要がある","紫外線吸光光度法は、試料を酸分解せずに直接測定する方法である。"], a:0, v:"answer",
  n:"<b>海水中の臭化物イオン等が紫外部の吸光度を妨害するため、全窒素の紫外線吸光光度法を海水にそのまま適用するのは困難</b>。「湖沼水・海水のいずれにも妨害なく適用できる」とした記述が誤りとして出題された。なお浮遊物質量(SS)は、試料をろ過しろ過材上に残留した物質を105〜110℃で乾燥してその質量を測定して求める。〔R1-Ⅲ-20〕"},
 {f:"生物多様性", q:"日本国内で問題となっている特定外来生物「ヒアリ」に関する記述のうち、最も適切なものはどれか。", h:"原産地はどこか、国内で初めて確認されたのはいつかがポイント。",
  c:["南米原産の外来生物であり、2017年6月に国内で初めて確認された","アフリカ原産の外来生物であり、2017年6月に国内で初めて確認された","南米原産の外来生物であり、2010年に国内で初めて確認された","東南アジア原産の外来生物であり、主に輸入木材に付着して侵入する"], a:0, v:"answer",
  n:"<b>ヒアリ（Solenopsis invicta）は南米原産の特定外来生物で、2017年6月に国内で初めて確認された</b>（兵庫県のコンテナ内）。原産地を「アフリカ」「東南アジア」とした記述は誤り。初確認の時期を2010年などにずらした記述も誤り。輸入貨物のコンテナ等に付着して非意図的に侵入するケースが近年増えている。〔R1-Ⅲ-27〕"},
 {f:"自然環境", q:"関東大震災（1923年）の復興事業に伴い、延焼遮断帯として整備された広幅員街路の例に関する記述のうち、最も適切なものはどれか。", h:"街路が実際に整備された経緯（震災復興か、それ以外の理由か）を区別する。",
  c:["横浜市の「日本大通り」は、関東大震災後の復興事業で道路幅が拡幅され、イチョウ並木が植えられた","札幌市の「大通り公園」は、関東大震災の復興事業として、延焼遮断帯を目的に新設された","仙台市の「青葉通り」は、関東大震災の復興事業として、延焼遮断帯を目的に拡幅整備された","東京都の「明治神宮表参道」は、関東大震災の復興事業として、遊歩道・乗馬道沿いに並木植樹帯が配された"], a:0, v:"answer",
  n:"<b>横浜市の「日本大通り」は関東大震災（1923年）後の復興事業で幅22mに拡幅され、イチョウ並木が植えられた</b>（東京都の「昭和通り」も同様の震災復興による延焼遮断帯街路の代表例）。札幌市の「大通り公園」は1871年の火災を機に防火帯として設けられたもので関東大震災とは無関係、仙台市の「青葉通り」の拡幅整備は第二次大戦後の戦災復興によるもの、明治神宮表参道は関東大震災の3年前（1920年）に明治神宮の参道として整備されたもので、いずれも関東大震災の復興事業ではない。〔R1-Ⅲ-31〕"},
 {f:"自然環境", q:"自然公園法及び自然環境保全法に基づく指定地域の名称の組合せのうち、すべて国立公園であるものはどれか。", h:"1つでも国定公園が混じっていれば不正解。",
  c:["伊勢志摩，吉野熊野，山陰海岸，瀬戸内海，足摺宇和海","十和田八幡平，栗駒，白神山地，鳥海，磐梯朝日","秩父多摩甲斐，水郷筑波，妙高戸隠連山，中部山岳，越前加賀海岸","西海，阿蘇くじゅう，九州中央山地，稲尾岳，慶良間諸島"], a:0, v:"answer",
  n:"<b>伊勢志摩・吉野熊野・山陰海岸・瀬戸内海・足摺宇和海はすべて国立公園</b>。他の組には、栗駒・鳥海（国定公園）、水郷筑波・越前加賀海岸（国定公園）、九州中央山地（国定公園）がそれぞれ紛れ込んでいる。なお白神山地は国立公園ではなく、森林生態系保護地域や自然環境保全地域などにより保護されている。〔R1-Ⅲ-24〕"},
 {f:"測定・分析", q:"「低周波音問題対応の手引書」（平成16年 環境省）の適用範囲に関する記述のうち、最も適切なものはどれか。", h:"対象となる音源が固定発生源か移動発生源かがポイント。",
  c:["対象は工場・事業場・店舗・近隣の住居などに設置された固定発生源からの低周波音であり、新幹線鉄道等の移動発生源や発破・爆発等の衝撃性の発生源からの低周波音には適用しない","新幹線鉄道や自動車などの移動発生源から発生する低周波音を主な適用対象としており、測定周波数は可聴域の低周波数帯を含めて設定し、参照値も地域指定ごとに区分し、固定発生源は対象から除外している","測定周波数範囲は、1／1オクターブバンド中心周波数20Hz〜200Hzとしている","参照値は、都市計画法の用途地域や騒音規制法の地域指定によって基準が異なるものとして定められている"], a:0, v:"answer",
  n:"<b>「低周波音問題対応の手引書」は固定発生源（工場・事業場・店舗・近隣住居の設備等）からの低周波音のみを対象とし、新幹線鉄道等の移動発生源や発破・爆発等の衝撃性発生源には適用しない</b>。移動発生源を主な適用対象としたとする記述は誤り。測定周波数範囲を1/1オクターブバンド20〜200Hzとした記述も誤りで、正しくは1/3オクターブバンド中心周波数1Hz〜80Hz。参照値は都市計画法の用途地域や騒音規制法の地域指定と<b>無関係に</b>適用されるため、地域区分で基準が変わるとした記述も誤り。〔R1-Ⅲ-22〕"},
 {f:"国際", q:"国際サンゴ礁イニシアティブ（ICRI）に関する記述のうち、最も適切なものはどれか。", h:"設立年と、設立のきっかけとなった国際的な枠組みに注意。",
  c:["1994年に日米豪仏など8か国が中心となり発足した、サンゴ礁の保全と持続可能な利用のための国際的な枠組みである","気候変動枠組条約（UNFCCC）に基づき、1992年に設立された","ラムサール条約の枠組みの下、1994年に湿地保全の一環として設立された","生物多様性条約（CBD）の正式な附属機関として、2010年のCOP10で設立され、以降は締約国会議(COP)の決定に基づいて運営方針が定められている"], a:0, v:"answer",
  n:"<b>ICRIは1994年、1992年の国連環境開発会議（地球サミット）の「アジェンダ21」でサンゴ礁保護の重要性が謳われたことを受け、日・米・豪・仏など8か国が中心となって発足した</b>枠組み。気候変動枠組条約（UNFCCC）に基づく設立ではなく、設立年も1994年（1992年ではない）。生物多様性条約の正式な附属機関でもなく、ラムサール条約とも別の枠組み。〔R1-Ⅲ-34〕"},
 {f:"測定・分析", q:"振動レベル測定（JIS Z 8735）における振動ピックアップの設置・測定に関する記述のうち、最も適切なものはどれか。", h:"受感軸の方向、風や電界磁界の影響への対処法がポイント。",
  c:["受感軸方向は、原則として鉛直方向とこれに直角な水平2方向の計3方向とし、鉛直方向をZ、水平方向をX・Yとして、X・Yの方向を明示する","受感軸は水平方向の1方向のみとし、鉛直方向は測定しない","風や電界・磁界などの影響を受けないため、遮へいや測定点の変更などの配慮は不要である","衝撃的な振動を測定する場合も、あらかじめ設定した1つの測定レンジのみを用い、レンジは変更せず、指示値が振り切れた場合はそのまま記録する"], a:0, v:"answer",
  n:"<b>振動ピックアップの受感軸方向は、原則として鉛直方向（Z）とこれに直角な水平2方向（X・Y）の計3方向とし、X・Yの方向を明示する</b>。振動ピックアップは風・電界・磁界などの影響を受ける場合があり、遮へいや測定点の変更などの配慮が必要（「影響を受けない」は誤り）。衝撃的な振動を測定する際は、振動レベル計が過負荷状態にならないよう測定レンジを選定する（レンジ固定は誤り）。〔R1-Ⅲ-21〕"},
 {f:"自然環境", q:"森林樹木や生物の種数と緯度の関係に関する記述のうち、最も適切なものはどれか。", h:"樹木以外の生物にも同じ傾向が当てはまるかがポイント。",
  c:["森林樹木の種数は熱帯低地林で最も多く、高緯度に行くほど少なくなる。多くの昆虫類や鳥類なども、同様に低緯度ほど種数が多い傾向がみられる","森林樹木の種数は熱帯低地林で最も多く、高緯度に行くほど少なくなるが、昆虫類や鳥類は日本の位置する中緯度地方で最も種数が多くなる","森林樹木の種数は寒帯林で最も多く、低緯度に行くほど少なくなる","森林樹木の種数は緯度と関係なく、土壌のpHのみによって決まる"], a:0, v:"answer",
  n:"<b>森林樹木の種数は熱帯低地林で最も多く、高緯度に行くほど少なくなる（緯度の多様性勾配）</b>。この傾向は樹木に限らず、多くの昆虫類や鳥類などでも同様に低緯度ほど種数が多い。「昆虫類や鳥類は中緯度地方で最も種数が多くなる」とした記述は誤り。〔R1-Ⅲ-28〕"},
 {f:"国際", q:"ユネスコ「人間と生物圏計画（MAB計画）」に基づく生物圏保存地域（ビオスフィアリザーブ）に関する記述のうち、最も適切なものはどれか。", h:"認定を行う国際機関はどこかに注意。",
  c:["生物多様性の保全と持続可能な発展との調和を目的としており、ユネスコ（UNESCO）が認定・登録を行う","生物多様性の保全と持続可能な発展との調和を目的としており、国際自然保護連合（IUCN）が認定・登録を行う","自然景観の保護のみを目的としており、国連食糧農業機関（FAO）が認定・登録を行う","科学的研究の推進のみを目的としており、ラムサール条約事務局が認定・登録を行う"], a:0, v:"answer",
  n:"<b>生物圏保存地域（ビオスフィアリザーブ）は、ユネスコの「人間と生物圏計画（MAB計画）」に基づき、生物多様性の保全と持続可能な発展との調和を目的として、ユネスコが認定・登録する</b>。国際自然保護連合（IUCN）は保護地域のカテゴリー分類などを行う別の国際機関であり、生物圏保存地域の認定主体ではない。世界農業遺産（GIAHS）を認定するのはFAO、国際的に重要な湿地を登録するのはラムサール条約事務局で、いずれも生物圏保存地域とは別の枠組み。〔R1-Ⅲ-35〕"},
 {f:"生物多様性", q:"環境省レッドリスト（2019年版）に記載されている哺乳類とそのカテゴリーの組合せとして、最も適切なものはどれか。", h:"「絶滅」は既に確認されている種、「絶滅危惧」は種ごとに深刻度が分かれる。",
  c:["オキナワオオコウモリ－絶滅（EX）","アマミノクロウサギ－絶滅危惧IA類（CR）","ラッコ－絶滅危惧II類（VU）","オガサワラオオコウモリ－準絶滅危惧（NT）"], a:0, v:"answer",
  n:"<b>オキナワオオコウモリは環境省レッドリストで「絶滅（EX）」と評価されている</b>。アマミノクロウサギとオガサワラオオコウモリは絶滅危惧IB類（EN）、ラッコは絶滅危惧IA類（CR）が実際のカテゴリーで、問題文の組合せはそれぞれ誤り。哺乳類のレッドリストは2020年公表の第4次版が最新で、2026年9月時点で改訂版は未公表。〔R1-Ⅲ-25〕"},
 {f:"測定・分析", q:"悪臭防止法の特定悪臭物質の測定方法に関する記述のうち、最も適切なものはどれか。", h:"炎光光度検出器（FPD）の検量線の特性、揮発しやすい成分の保管方法がポイント。",
  c:["硫化水素等の硫黄化合物を炎光光度検出器（FPD）付きガスクロマトグラフで分析する場合、その発光原理から、検量線は硫黄濃度に対して二次近似曲線となる","硫化水素等の硫黄化合物を炎光光度検出器（FPD）付きガスクロマトグラフで分析する場合、検量線は濃度に対して常に直線（比例関係）となる","低級脂肪酸類（プロピオン酸、ノルマル酪酸等）の分析には、電子捕獲型検出器（ECD）付きガスクロマトグラフを用いる","排出水中のメチルメルカプタンや硫化水素など揮散しやすい成分は、常温・常圧で数日程度は品質が保たれるため、特別な保管上の配慮は不要である"], a:0, v:"answer",
  n:"<b>FPDは硫黄化合物の発光を利用する検出器で、その発光原理（硫黄原子2個が結合したS2*分子からの発光）から、検量線は硫黄濃度に対して直線ではなく二次近似曲線になる</b>点に注意が必要。低級脂肪酸類（プロピオン酸・ノルマル酪酸・ノルマル吉草酸・イソ吉草酸）の分析には水素炎イオン化検出器（FID）を用いる（ECDは主にPCB等のハロゲン化合物向け）。揮散しやすいメチルメルカプタン・硫化水素・硫化メチル・二硫化メチルなどは、試料採取後直ちに0〜5℃の暗所に保管する必要がある。〔R1-Ⅲ-23〕"},
 {f:"自然環境", q:"ランドスケープ生態学における「エコトープ」の定義として、最も適切なものはどれか。", h:"似た用語「エコトーン」と混同しないこと。",
  c:["地質や土壌、地形などの非生物的要素と、植生に代表される生物的要素を重ね合わせ、人間による土地利用も考慮した、ランドスケープのモザイクを構成する単位である","隣接する異質な環境の境界に生じる移行帯を指し、周辺より種数や個体数が多くなりやすい領域として、ランドスケープのモザイクを構成する単位に位置づけられる","孤立化・小面積化した樹林地において、種子供給源が絶たれた状態の林分のみを指す用語である","生態系ネットワークを構成するコリドー（緑の回廊）そのものを指す用語である"], a:0, v:"answer",
  n:"<b>エコトープは、地質・土壌・地形などの非生物的要素と植生などの生物的要素、さらに人間による土地利用を重ね合わせて捉えた、ランドスケープのモザイクを構成する単位</b>。異質な環境の境界の移行帯を指す「エコトーン」や、生態系ネットワークの回廊を指す「コリドー」とは異なる概念。マッカーサーとウィルソンの種数平衡モデル（島の生物地理学）は孤立・分断化が進む陸域の生物群集にもしばしば援用され、孤立化・小面積化した樹林地ではエッジ効果や種子供給源の阻害により種組成・群落構造が影響を受ける傾向がある。〔R1-Ⅲ-30〕"},
 {f:"測定・分析", q:"微小粒子状物質（PM2.5）の定義に含まれる「分粒装置」に関する記述として、最も適切なものはどれか。", h:"PM2.5は「何%の粒子を分離できる装置」を使うか、という定義の数値がポイント。",
  c:["粒径2.5μmの粒子を50%の割合で分離できる分粒装置を用いて、より粗大な粒子を除去した後に採取される粒子をいう","粒径2.5μmの粒子を75%の割合で分離できる分粒装置を用いて、より粗大な粒子を除去した後に採取される粒子をいう","粒径10μmの粒子を50%の割合で分離できる分粒装置を用いて、より粗大な粒子を除去した後に採取される粒子をいう","粒径2.5μm以下の粒子をすべて完全に分離できる分粒装置を用いて採取される粒子をいう"], a:0, v:"answer",
  n:"<b>PM2.5は、粒径2.5μmの粒子を50%の割合で分離できる分粒装置（インパクタ等）を用いて、より粗大な粒子を除去した後に採取される粒子</b>と定義される。「75%」とした誤答は、実際の定義値（50%）を誤って大きくしたもの。「10μmで50%分離」とした誤答は、浮遊粒子状物質（SPM）を10μm以下として定義する際の数値と混同させたもの。「完全に分離」とした誤答は、分粒装置が特定粒径で100%カットするのではなく50%透過（カットオフ）特性を持つ点を見落としている。PM2.5には燃焼等で直接排出される一次生成粒子と、大気中の化学反応で生成する二次生成粒子がある。〔R2-Ⅲ-3〕"},
 {f:"大気・水質", q:"大気汚染の歴史に関する記述として、最も不適切なものはどれか。", h:"ロンドン型とロサンゼルス型、それぞれのスモッグの色や発生原因の違いに注目。",
  c:["ロサンゼルスで頻発した自動車排気ガス由来の大気汚染現象は、石炭の煤煙にちなんで「黒いスモッグ」と呼ばれる","1952年12月のロンドンでは、およそ4,000人の過剰死亡者を出したスモッグ事件が発生した","ロンドンで顕著だったスモッグとロサンゼルスのスモッグは発生メカニズムが大きく異なり、後者は太陽光の強いときに現れやすいことから「光化学スモッグ」と呼ばれる","大気汚染による人体への影響は、すでに14世紀のイギリスで、石炭使用の増加や家庭用暖房の燃料使用により問題になっていた"], a:0, v:"answer",
  n:"<b>ロサンゼルスの大気汚染は「黒いスモッグ」ではなく「光化学スモッグ」と呼ばれる</b>。ロサンゼルスのスモッグは自動車排気ガス中のVOCとNOxが紫外線を受けて生成するオゾン等を主成分とする光化学オキシダントによるもので、石炭の煤煙を主因とする「黒いスモッグ」（還元型・ロンドン型）とは発生メカニズムが異なる。1952年12月のロンドン・スモッグ事件（過剰死亡者約4,000人）は石炭燃焼由来の典型例。大気汚染の人体影響は14世紀のイギリスですでに問題化していた。〔R2-Ⅲ-4〕"},
 {f:"大気・水質", q:"公共用水域の水質環境基準達成状況に関する記述として、最も適切なものはどれか。", h:"毎年公表される水質測定結果で、達成率が高い項目・水域と低い項目・水域の組み合わせ。",
  c:["河川のBODは環境基準達成率が高い水準で安定して推移する一方、湖沼のCODは低い水準の横ばいが続いている","湖沼のCODは環境基準達成率が高い水準で安定して推移する一方、河川のBODは低い水準の横ばいが続いている","河川・湖沼・海域のいずれも、環境基準達成率はおおむね同水準で推移している","湖沼・海域では達成率が高い水準にある一方、河川はいずれの項目も低い水準にある"], a:0, v:"answer",
  n:"<b>河川のBODは環境基準達成率が高い水準（近年は90%台）で推移する一方、湖沼のCODは50%前後の低い水準の横ばいが続く</b>という関係は、公共用水域水質測定結果で長年繰り返し確認されている傾向。令和6年度の結果でも河川BOD達成率93.9%（19年連続で90%以上）、湖沼COD達成率50.8%と、この傾向は変わっていない。水域・項目によって達成率のばらつきが大きい点が問われる。〔R2-Ⅲ-5〕"},
 {f:"法令・制度", q:"浄化槽法に関する記述として、最も不適切なものはどれか。", h:"浄化槽の「製造」と「工事」、それぞれどんな制度で規律されているかの違い。",
  c:["浄化槽の製造業者は、都道府県知事の登録を受けなければならない","浄化槽法の目的は、公共用水域等の水質の保全等の観点から、浄化槽によるし尿及び雑排水の適切な処理を図り、生活環境の保全及び公衆衛生の向上に寄与することとされている","浄化槽工事業を営もうとする者は、原則として都道府県知事の登録を受けなければならない","浄化槽の設置後、浄化槽管理者には定期的な保守点検と、蓄積した汚泥を系外へ搬出する清掃の実施が義務づけられている"], a:0, v:"answer",
  n:"<b>浄化槽の「製造」は都道府県知事の登録制度ではなく、国土交通大臣の型式認定制度によって規律される</b>。登録制度の対象は「浄化槽工事業者」（浄化槽法第21条、都道府県知事登録）であって「製造業者」ではなく、ここを入れ替えると誤りになる。浄化槽法の目的規定（し尿及び雑排水の適切な処理→生活環境の保全・公衆衛生の向上）、浄化槽工事業者の登録制度、浄化槽管理者の保守点検・清掃義務は、いずれも正しい記述。〔R2-Ⅲ-6〕"},
 {f:"測定・分析", q:"「要調査項目等調査マニュアル」における分析精度管理に関する記述として、最も適切なものはどれか。", h:"検出下限値(MDL)を求めるとき、どのくらいの濃度の標準液を使うか。",
  c:["検出下限値（MDL）は、検出下限付近の低濃度の標準溶液を繰り返し分析し、その標準偏差から算出する","検出下限値（MDL）は、検量線の最高濃度の標準溶液を繰り返し分析し、その標準偏差から算出する","検出下限値（MDL）は、標準溶液を用いずブランク試料のみを1回分析して求める","検出下限値（MDL）は、装置メーカーが公表するカタログ値をそのまま用いる"], a:0, v:"answer",
  n:"<b>MDL（方法検出下限値）は、検出下限付近の低濃度標準溶液を繰り返し分析し、換算した試料濃度値の標準偏差から算出する</b>。「検量線の最高濃度の標準溶液」を使うとした記述は誤りで、高濃度側ではノイズに対する変動幅が小さすぎ、検出限界付近の測定精度を評価できない。ブランク試料のみの1回測定や、カタログ値の流用ではMDLとして成立しない（ばらつきを反映できないため）。なお添加回収率試験は、標準物質やサロゲート物質を試料に添加して前処理から測定まで行い、添加量と分析値から回収率を算出する別の精度管理手法。〔R2-Ⅲ-13〕"},
 {f:"測定・分析", q:"水質汚濁に係る環境基準の測定方法に関する記述として、最も適切なものはどれか。", h:"比較的新しく追加された生活環境項目の測定方法に注目。",
  c:["底層溶存酸素量は、光学式センサ溶存酸素計を用いて測定することができる","全シアンは、水試料から蒸留捕集した後、イオンクロマトグラフを用いて測定する方法のみが定められている","六価クロムは、原子吸光法だけが唯一の公定測定法として定められている","総水銀は、還元気化の工程を経ずに、水試料をそのまま原子吸光分析法で測定する"], a:0, v:"answer",
  n:"<b>底層溶存酸素量は、光学式センサ溶存酸素計を用いて測定できる</b>。底層溶存酸素量は湖沼・海域の生態系保全の観点から比較的新しく追加された生活環境項目。全シアンの公定法は吸光光度法、イオン電極法又は流れ分析法であり「イオンクロマトグラフのみ」という記述、六価クロムが「原子吸光法だけ」という記述（ジフェニルカルバジド吸光光度法等も可）、総水銀を還元気化せず直接測定するという記述（実際は水銀を還元気化してから原子吸光分析）は、いずれも実際の公定法と食い違う。〔R2-Ⅲ-15〕"},
 {f:"測定・分析", q:"大気中の微小粒子状物質（PM2.5）に含まれるイオン成分をイオンクロマトグラフ法で分析する際の記述として、最も適切なものはどれか。", h:"アニオン分析用の分離カラムに使われる充てん剤の種類。",
  c:["アニオン分析用イオンクロマトグラフには、強塩基性陰イオン交換体を充てんした分離カラムを用いる","アニオン分析用イオンクロマトグラフには、逆相系のオクタデシルシリル化シリカゲル（ODS）を充てんした分離カラムを用いる","アニオン分析用イオンクロマトグラフには、陽イオン交換体を充てんした分離カラムを用いる","アニオン分析用イオンクロマトグラフには、活性炭を充てんした分離カラムを用いる"], a:0, v:"answer",
  n:"<b>アニオン（陰イオン）分析用のイオンクロマトグラフには、強塩基性陰イオン交換体を充てんした分離カラムを用いる</b>。逆相系のODSカラムは主に有機化合物のHPLC分析に使うもので陰イオン分析には用いない。陽イオン交換体は逆にカチオン（陽イオン）分析用。活性炭は前処理の吸着剤として使われることはあるが分離カラムの充てん剤ではない。抽出液には超純水を用いて超音波抽出し、サプレッサは分析対象の陰イオンではなく溶離液成分の陽イオンをH⁺に交換してバックグラウンドを下げる仕組み。〔R2-Ⅲ-16〕"},
 {f:"化学物質", q:"残留性有機汚染物質に関するストックホルム条約（POPs条約）における、ペルフルオロオクタンスルホン酸（PFOS）及びペルフルオロオクタン酸（PFOA）の扱いに関する記述として、最も適切なものはどれか。", h:"附属書A（廃絶）に載っていても、すべての用途が即座に一律禁止されるわけではない。",
  c:["PFOAは附属書A（廃絶）の対象物質だが、作業者保護のための撥油・撥水繊維製品への使用など、条約が定める個別の適用除外（認められる目的）の対象となる用途がある","附属書A（廃絶）に追加された物質は、例外なくあらゆる用途で直ちに製造・使用が禁止される","附属書B（制限）は、附属書Aよりも規制が厳しく、いかなる適用除外も認められない","個別の適用除外（認められる目的）は、条約発効時に定めた内容が恒久的に固定され、その後見直されることはなく、締約国会議の議題にも上がらない仕組みとして運用されている"], a:0, v:"answer",
  n:"<b>附属書A（廃絶）の対象物質であっても、条約は「個別の適用除外」や「認められる目的」として一定の用途に限り継続使用を認めている</b>。PFOAには、半導体のフォトリソグラフィ・エッチング、作業者保護用の撥油・撥水繊維製品、産業用フィルター等に使うPTFE・PVDFの製造など、経過的に認められた用途がある。「例外なく直ちに全面禁止」という理解は誤り。規制区分としては廃絶（附属書A）の方が制限（附属書B）より厳しいが、附属書Aにも適用除外はある。適用除外や認められる目的は締約国会議（COP）のたびに見直しの対象となり、固定的ではない（2025年のCOP12でも既存物質の個別適用除外の見直しが議題となった）。〔R2-Ⅲ-17〕"},
 {f:"測定・分析", q:"有機汚染物質の分析法である液体クロマトグラフ質量分析計（LC/MS）に関する記述として、最も不適切なものはどれか。", h:"LC/MSで分析する物質にも、国際条約の規制対象になっているものがある。",
  c:["LC/MSの分析対象物質は揮発性をほとんど持たないため、地球規模の汚染を引き起こすことはなく、国際条約の対象とはならない","LC/MSは、難揮発性・高極性・熱不安定性の化合物を直接的に分析対象とできる点で、GC/MSより有利である","LC/MSで逆相クロマトグラフィーによりイオン解離性の物質を分析する場合、移動相のpH調整にはリン酸緩衝液のような不揮発性物質ではなく、ギ酸やアンモニアなど揮発性のある弱酸・弱塩基からなる緩衝液が使われる","大気圧イオン化法（ESI法・APCI法等）の台頭により、LC/MSの実用化が進んだ"], a:0, v:"answer",
  n:"<b>LC/MSで分析される難揮発性・高極性の物質にも、地球規模の汚染や生物蓄積が問題となり国際条約の規制対象となっているものがある</b>。代表例がPFOS・PFOAで、これらは揮発性をほとんど持たないがストックホルム条約（POPs条約）の規制対象。「揮発性がないから地球規模の汚染を起こさず条約の対象にもならない」という理解は誤り。LC/MSは難揮発性・高極性・熱不安定性化合物を直接分析できる点でGC/MSより有利、逆相クロマトグラフィーのpH調整には揮発性緩衝液（ギ酸・酢酸・アンモニア等）を使う（リン酸緩衝液のような不揮発性物質は質量分析計のイオン源を汚染するため使えない）、ESI・APCIなど大気圧イオン化法の実用化がLC/MS普及の基礎となった、のはいずれも正しい。〔R2-Ⅲ-18〕"},
 {f:"測定・分析", q:"「化学物質環境実態調査実施の手引き」（環境省）に基づく初期環境調査・詳細環境調査・モニタリング調査に関する記述として、最も不適切なものはどれか。", h:"調査は工場の敷地境界や排出口の直近で行うものか、それとも一般環境で行うものか。",
  c:["化学物質環境実態調査（初期環境調査、詳細環境調査、モニタリング調査）は、工場又は事業場の敷地境界や排出口等の特定の排出源の直近で実施する","トラベルブランク試験は、試料採取準備時から試料測定時までの汚染の有無を確認するためのもので、試料採取操作以外は試料と全く同様に扱い持ち込んだものを測定してトラベルブランク値とする","同じ河川で上流と下流の両方を採取する場合は、底質の巻き上げ等による汚染を防止するため、下流の採取を先に行い、その後に上流の採取を行う","底質を冷暗所に保存した場合、保存中に間隙水が上部に浮いて上澄み水となるが、これを除去すると試料泥の酸化が進行するため、分析直前まで除去しない"], a:0, v:"answer",
  n:"<b>化学物質環境実態調査（黒本調査）は、工場・事業場の敷地境界や排出口の直近ではなく、河川・海域等の一般環境中で実施する</b>。特定の排出源の直近で行う調査は、この手引きが対象とする一般環境調査とは別の枠組み（排出源周辺のモニタリング等）にあたる。トラベルブランク試験の定義、下流→上流の順で採水・採泥する理由（下流採取後の上流での巻き上げが、まだ採取していない下流試料を汚染しないようにするため）、底質保存時に上澄み水を分析直前まで除去しない理由は、いずれも手引きに沿った正しい記述。〔R2-Ⅲ-19〕"},
 {f:"測定・分析", q:"JIS K 0311:2020・JIS K 0312:2020(ダイオキシン類の測定方法)の令和2年改正内容として、最も適切なものはどれか。", h:"K 0311は排ガス、K 0312は水質が対象という違いに注意。",
  c:["K 0312:2020では、試料からの抽出法として分散型固相吸着-凝集法が新たに追加された","K 0311:2020では、試料の前処理は精製操作以外の操作がいかなる場合も認められないことになった","K 0311:2020では、液体からの抽出に用いる有機溶媒としてジクロロメタンの使用が廃止された","K 0311:2020は工業用水・工場排水、K 0312:2020は排ガス中のダイオキシン類の測定方法を定めている"], a:0, v:"answer",
  n:"<b>K 0312:2020では抽出法として分散型固相吸着-凝集法が新たに追加された</b>。前処理は精製操作以外の操作でも規格の条件をすべて満たせば用いてよい。K 0311:2020の抽出溶媒はジクロロメタンに加えてトルエンも使用可能になった（廃止ではない）。K 0311は排ガス、K 0312は工業用水・工場排水が対象で、これを逆にすると誤り。〔R2-Ⅲ-20〕"},
 {f:"測定・分析", q:"水質汚濁防止法に基づく水質調査方法(昭和46年環水管30号)における、工場・事業場排水の採水に関する記述として、最も適切なものはどれか。", h:"排水の水質変動の大小によって回数の扱いが変わる。",
  c:["1日の操業時間内に3回以上採水することを原則とするが、水質変動が少ない排水については適宜回数を減らしてもよい","水質変動の有無にかかわらず、5回以上採水しなければならず、採水時刻も一律に定められており、この基準はどの工場・事業場にも同じように適用される","操業時間中であれば1日1回の採水で足りるとされている","操業時間外に採水することが望ましいとされている"], a:0, v:"answer",
  n:"<b>工場・事業場排水の採水は1日の操業時間内に3回以上行うことを原則とするが、水質変動が少ないものは適宜回数を減らしてもよい</b>とされる。河川・湖沼の採水日は晴天が続き水質が安定した日を選び、感潮域では水質が最も悪くなる時刻を含むよう採水時刻を決め、湖沼は停滞期に深度別の多層採水、循環期は表層採水でよいとされる。〔R2-Ⅲ-21〕"},
 {f:"測定・分析", q:"土壌汚染状況調査における土壌ガス調査に関する記述として、最も適切なものはどれか。", h:"地下水で代替測定する場合の調査地点の扱いに注意。",
  c:["土壌ガスの採取が困難な場合は地下水を採取して対象物質の量を測定してよく、調査対象地内に土壌ガス調査地点と地下水調査地点が混在してもよい","土壌ガスの採取が困難な場合に地下水で代替測定するときは、土壌ガス調査地点と地下水調査地点を同一調査対象地内に混在させてはならない","土壌ガスは、表層から2.0m以深の地点でのみ採取が認められている","ガスクロマトグラフ電子捕獲型検出器(ECD)は、ベンゼンの検出に適した検出器である"], a:0, v:"answer",
  n:"<b>土壌ガスの採取が困難なときは地下水を採取して測定してよく、その場合も土壌ガス調査地点と地下水調査地点は同一調査対象地内に混在してよい</b>（混在を禁止する規定はない）。土壌ガスは表層から0.8〜1.0m下の地点で採取し、雨天時や地表に水たまりがある状態では採取しない。ガスクロマトグラフ電子捕獲型検出器(ECD)はハロゲン化合物の検出に適するが、ベンゼンの検出には適さない。〔R2-Ⅲ-22〕"},
 {f:"測定・分析", q:"騒音の測定方法に関する記述として、最も適切なものはどれか。", h:"実測が困難な場合の代替手段が認められているかどうかがポイント。",
  c:["実測に必要な時間が確保できない場合等には、道路交通量等の条件から騒音レベルを推計する方法を用いることができる","実測が困難な場合であっても、道路交通量等からの推計に代える方法は一切認められていない","降雨時は測定に適さないが、降雪時であれば通常どおり測定してよいとされる","ウインドスクリーンを装着すれば、風雑音や電線の風切り音が測定値へ影響することはなくなり、暗騒音の測定条件にも同様の効果が期待できる"], a:0, v:"answer",
  n:"<b>実測に必要な時間が確保できない場合等には、道路交通量等の条件から騒音レベルを推計する方法が認められている</b>。降雨時だけでなく降雪時も測定には適さない。ウインドスクリーンを装着しても風雑音等の影響を完全には排除できない。騒音の評価は等価騒音レベルにより、時間の区分ごとの全時間を通じて評価することを原則とする。〔R2-Ⅲ-23〕"},
 {f:"測定・分析", q:"振動規制法に基づく振動の測定に関する記述として、最も適切なものはどれか。", h:"対象振動と暗振動のレベル差がどれだけあれば望ましいかがポイント。",
  c:["ある振動源から出る振動だけの振動レベルを求める場合には、対象振動があるときとないときの振動レベル計の指示値の差が10dB以上あることが望ましい","指示値の差が3dB以上あれば、対象振動だけのレベルとして扱ってよいとされ、暗振動による補正計算は不要とされ、この基準はどの振動源にも一律に適用される","暗振動の影響は無視してよく、指示値の差は問われない","指示値の差が20dB未満の場合、そもそも測定自体が不可能とされる"], a:0, v:"answer",
  n:"<b>対象振動と暗振動とで振動レベル計の指示値の差が10dB以上あることが望ましい</b>とされる。振動レベル計は計量法の条件に合格したものを用い鉛直方向について測定し、振動ピックアップは原則として平坦なかたい地面などに設置する。〔R2-Ⅲ-24〕"},
 {f:"自然環境", q:"ニホンジカの生息状況の歴史的な推移に関する記述として、最も適切なものはどれか。", h:"狩猟規制→狩猟獣指定→低密度安定→1980年代の増加、という流れがポイント。",
  c:["明治期には各地で狩猟規制が行われたが、大正期に狩猟獣に指定され戦後まで捕獲され続けたため個体数は減少し、低密度安定状態が続いた","明治期から一貫して狩猟が禁止されたため、個体数は増加を続けた","1980年代以降は生息数の減少が進み、農林業被害はほとんど見られなくなり、生息域も本州以南に限定されるようになったため保護管理の対象から外された","ニホンジカは北海道にのみ生息し、本州以南には分布していない"], a:0, v:"answer",
  n:"<b>明治期の狩猟規制ののち大正期に狩猟獣指定され、戦後まで捕獲が続いたことで個体数は減少し低密度安定状態が続いた</b>。1980年代になると各地で個体数が増加し、農林業被害や自然植生への影響が深刻化した。ニホンジカ（エゾシカを含む）は北海道から九州まで多くの地域に生息する。〔R2-Ⅲ-25〕"},
 {f:"生物多様性", q:"我が国の絶滅危惧種の生育環境や種の保存法に関する記述として、最も適切なものはどれか。", h:"原生自然と二次的自然、どちらに多く分布しているかがポイント。",
  c:["絶滅危惧種の多くは、原生的な自然よりも里地里山などの二次的自然に生息・生育している","絶滅危惧種の多くは、人為的な影響をほとんど受けていない原生自然に生息・生育している","環境省レッドリストは、5年ごとに機械的に全面改訂することが法律で義務づけられている","種の保存法の特定第二種国内希少野生動植物種は、調査研究や環境教育目的の捕獲であっても一律に規制される"], a:0, v:"answer",
  n:"<b>絶滅危惧種の多くは里地里山等の二次的自然に生息・生育しており</b>、開発だけでなく水質汚濁・外来種による捕食・管理放棄や遷移進行による植生変化も大きな減少要因になっている。レッドリストの見直しは2015年度以降、時期を定めず必要に応じて個別に行われる。種の保存法は2017年改正により、販売・頒布等を目的とした行為に限定して規制する「特定第二種国内希少野生動植物種」制度を創設し、調査研究や環境教育目的の捕獲等は規制対象外とした。（確認元：環境省「特定第二種国内希少野生動植物種の保全」）〔R2-Ⅲ-26〕"},
 {f:"地球環境", q:"気候変動適応計画における自然生態系分野の記述として、最も適切なものはどれか。", h:"モニタリングの今後の方針と、積極的な管理介入の範囲がポイント。",
  c:["気候変動による生態系や種の分布等の変化をより的確に把握するため、モニタリング等の調査を引き続き実施するとともに、必要に応じて強化・拡充する","モニタリング調査はすでに十分な体制が整っているため、今後強化・拡充する予定はない","気候変動による生態系への影響は既に解明されているため、新たな調査・研究は不要とされている","現在の生態系・種を維持するための積極的な管理・介入は、影響の程度にかかわらず全面的に実施することとされており、実施の可否についての事前の検討は行われない"], a:0, v:"answer",
  n:"<b>気候変動による生態系や種の分布等の変化を的確に把握するため、モニタリング調査を引き続き実施し、必要に応じて強化・拡充する</b>とされる。気候変動による生物多様性・生態系サービスへの影響を把握するための調査・研究の推進も掲げられる。現在の生態系・種を維持するための積極的な管理・介入は、悪影響が著しい場合に限り限定的な範囲で検討するとされ、全面的な実施ではない。〔R2-Ⅲ-28〕"},
 {f:"自然環境", q:"生態系ネットワーク（エコロジカルネットワーク）の考え方の歴史に関する記述として、最も適切なものはどれか。", h:"制定当初の目的と、後年つけられた評価を混同しないこと。",
  c:["1944年の英国グレーター・ロンドン・プランでロンドン市周囲に設定されたグリーンベルトは、都市の無秩序な拡大を防ぐことを主な目的としたもので、当初から生態系ネットワーク形成を狙ったものではない","1944年のグレーター・ロンドン・プランは、当初から生態系ネットワークの形成を目的としてグリーンベルトを設定した","グリーンベルトは1990年代に日本で初めて考案され、その後英国に導入された制度である","グレーター・ロンドン・プランのグリーンベルトは、コアエリアとバッファーゾーンを区別しない単一機能の緑地帯として設計され、都市空間の秩序ある拡大抑制のみを目的とした土地利用計画である"], a:0, v:"answer",
  n:"<b>1944年のグレーター・ロンドン・プランのグリーンベルトは都市の無秩序な拡大を防ぐことを主目的に設定されたもの</b>で、当初から生態系ネットワーク形成を狙ったものではない。生態系ネットワークの構成要素にはコアエリア（人間活動の影響を極力排除すべき地域）・バッファーゾーン（緩衝地帯、研究・教育・レクリエーション等はある程度許容）・コリドー（線状構造とその生態学的機能）があり、日本では林野庁が国有林で「緑の回廊」の設定を進めている。〔R2-Ⅲ-29〕"},
 {f:"自然環境", q:"水辺を利用する鳥類の生息状況（本州以南）に関する記述として、最も適切なものはどれか。", h:"本州以南でのカワセミの居留区分に注意。",
  c:["カワセミは、本州以南では留鳥として周年生息する","カワセミは、本州以南では夏鳥として春に飛来し秋には見られなくなる","コサギ・チュウサギ・アオサギは、いずれも本州以南には生息しない","淡水ガモ類の多くは、本州以南に夏鳥として飛来する"], a:0, v:"answer",
  n:"<b>カワセミは本州以南では留鳥として周年生息する</b>（積雪の多い東北北部・北海道では夏鳥として扱われることが多い）。水辺を利用する鳥類には留鳥・夏鳥・冬鳥それぞれの種がおり、淡水ガモ類の多くは本州以南に冬鳥として飛来する。〔R2-Ⅲ-30〕"},
 {f:"生物多様性", q:"生物多様性の階層構造に関する記述として、最も適切なものはどれか。", h:"「1つの生態系内」の種数の多さを測るのはどちらの多様性か。",
  c:["生物多様性は種内(遺伝子)・種間(種)・生態系という異なる階層でとらえることができ、このうち1つの生態系内における種数の多さはアルファ多様性と呼ばれる","1つの生態系内における種数の多さはベータ多様性と呼ばれる","生物多様性は種内・種間の2階層のみでとらえられ、生態系という階層は含まれず、生態系サービスの評価や各種の指標化の対象としても取り扱われていない仕組みとなっている","生態系間で種構成がどれだけ異なるかを示す指標はアルファ多様性と呼ばれる"], a:0, v:"answer",
  n:"<b>1つの生態系内における種数の多さはアルファ多様性</b>と呼ばれる。生態系間での種構成の異なり具合を示すのはベータ多様性で、両者を取り違えないこと。生物多様性は種内（遺伝子）・種間（種）・生態系という3つの異なる階層でとらえられる。〔R2-Ⅲ-31〕"},
 {f:"法令・制度", q:"保存樹・保存樹林制度に関する記述として、最も適切なものはどれか。", h:"「風致の維持」と「歴史的景観の維持」を混同しないこと。",
  c:["保存樹・保存樹林は都市の風致を維持するために指定されるものであり、都市における歴史的景観の維持を直接の目的とするものではない","保存樹・保存樹林は都市における歴史的景観の維持を図るためのものであり、指定は環境大臣が行い、指定後は所有者に管理義務が課される","保存樹・保存樹林の指定は環境大臣が行う","保存樹・保存樹林は原生的な自然環境の保全のみを目的として指定される"], a:0, v:"answer",
  n:"<b>保存樹・保存樹林は都市の風致（緑による景観）を維持するために指定される制度</b>で、歴史的景観の維持を直接の目的とするものではない（指定は市町村長）。街路樹には夏期に直射日光を遮り樹冠の外側より低い温度をつくる緑陰機能があり、関東大震災後の復興事業では延焼抑制のためマテバシイなど常緑広葉樹が植えられた例がある。（確認元：国土交通省「保存樹および保存樹林」）〔R2-Ⅲ-32〕"},
 {f:"自然環境", q:"この10年間（令和2年時点）に自然公園法に基づき指定又は拡張された国立公園・国定公園に関する記述として、最も適切なものはどれか。", h:"国立公園と国定公園、どちらの種別で指定されたかに注意。",
  c:["2014年に慶良間諸島国立公園が指定され、2016年にやんばる国立公園が指定、2020年には中央アルプス国定公園が指定された","2014年に慶良間諸島国定公園が指定された","2020年に中央アルプス国立公園が指定された","やんばる国立公園は指定後、一度も区域の拡張は行われておらず、指定時の区域が現在まで維持されているため見直しの予定もなく、管理計画も指定当初のまま据え置かれている"], a:0, v:"answer",
  n:"<b>2014年に慶良間諸島国立公園、2016年にやんばる国立公園が指定され、2020年には中央アルプス国定公園が指定された</b>。やんばる国立公園は2018年に区域が拡張されており、西表石垣国立公園も2016年に拡張された。〔R2-Ⅲ-33〕"},
 {f:"法令・制度", q:"自然公園法の利用調整地区制度に関する記述として、最も適切なものはどれか。", h:"認定を行うのは市町村長ではない。",
  c:["利用調整地区の区域内に公園利用者が立ち入る場合は、環境大臣又は都道府県知事（指定認定機関が指定されている場合は指定認定機関）の認定を受けなければならない","利用調整地区の区域内に公園利用者が立ち入る場合は、市町村長の認定のみで足りるとされ、都道府県知事への届出は不要であり、環境大臣が関与する場面は生じない","利用調整地区は特別保護地区とは別に設けることができない制度である","利用調整地区に指定されると、当該区域への立ち入りは一切禁止される"], a:0, v:"answer",
  n:"<b>利用調整地区の区域内への立ち入りには、環境大臣又は都道府県知事（指定認定機関が指定されている場合は指定認定機関）の認定が必要</b>で、市町村長ではない。集団施設地区は利用施設を一定地区に集約整備し公園の適正利用を増進するための制度、生態系維持回復事業は生態系の維持・回復のための事業、風景地保護協定は人為的管理が必要な二次的自然からなる良好な風景地を、環境大臣・地方公共団体・公園管理団体が土地所有者との協定により保護する制度である。（確認元：環境省 国立公園「保護と利用」）〔R2-Ⅲ-34〕"},
 {f:"国際", q:"生物多様性及び生態系サービスに関する政府間科学-政策プラットフォーム（IPBES）に関する記述として、最も適切なものはどれか。", h:"設立年と、2019年に公表されたSPMの年を混同しないこと。",
  c:["IPBESは2012年に設立された政府間組織である","IPBESは1992年の地球サミットの決定に基づき、同年に設立された","IPBESは2019年のIPBES総会で設立が決定された組織である","IPBESはUNEPの内部部局として設立され、独立した組織ではない"], a:0, v:"answer",
  n:"<b>IPBESは2012年に設立された政府間組織</b>で、1992年の地球サミットの決定に基づくものではない。2019年にはIPBES総会で地球規模評価報告書の政策決定者向け要約（SPM）が承認・公表され、自然の変化を引き起こす直接的・間接的要因の度合いが過去50年間で加速していると指摘されている。〔R2-Ⅲ-35〕"},
 {f:"地球環境", q:"IPCCが2018年に公表した「1.5℃特別報告書」は、現在の進行速度で温暖化が続いた場合、工業化以前と比べて1.5℃の温暖化に到達する時期について、どのように予測しているか。", h:"1.5℃到達の予測時期と、2050年前後のCO2排出量正味ゼロ目標を混同しないこと。",
  c:["2030年から2052年の間に到達する可能性が高い","2050年から今世紀末までの間に到達する可能性が高い","2100年前後に到達する可能性が高い","既に2017年時点で到達している"], a:0, v:"answer",
  n:"<b>2030年から2052年の間に1.5℃に達する可能性が高い</b>としたのがIPCC「1.5℃特別報告書」（2018年10月公表）の予測。「2050年から今世紀末までの間」に達するとした記述は誤り。2050年前後は、むしろ1.5℃達成のための排出経路上、世界のCO2排出量が正味ゼロとなる時期の目安として報告書に登場する年代であり、温暖化の到達時期そのものではない。〔R3-Ⅲ-1〕"},
 {f:"地球環境", q:"我が国の温室効果ガス排出量の算定において、2013年度から新たに算定対象ガスとして加わったのはどれか。", h:"「地球温暖化対策の推進に関する法律」に基づく算定対象ガスの変遷を確認する。",
  c:["三フッ化窒素（NF3）","六ふっ化硫黄（SF6）","メタン（CH4）","一酸化二窒素（N2O）"], a:0, v:"answer",
  n:"<b>三フッ化窒素（NF3）</b>が2013年度から新たに温室効果ガスの算定対象に加わった（半導体製造等で使われる代替フロン等の一種）。六ふっ化硫黄（SF6）は京都議定書発効当初からの対象6ガスの一つであり、2013年度に新規追加されたガスではない。メタン・一酸化二窒素も従来からの対象ガス。〔R3-Ⅲ-2〕"},
 {f:"大気・水質", q:"四大公害病の一つ「イタイイタイ病」の主な原因物質として、最も適切なものはどれか。", h:"富山県神通川流域で発生した骨軟化症等を特徴とする公害病。",
  c:["カドミウム","六価クロム","有機水銀","二酸化硫黄"], a:0, v:"answer",
  n:"<b>イタイイタイ病の主な原因物質はカドミウム</b>（上流の鉱山からの排水に由来）。六価クロムは主に地下水汚染等で問題となった別の物質で、イタイイタイ病とは無関係。有機水銀は水俣病・新潟水俣病の原因物質、二酸化硫黄は四日市ぜんそくの原因物質。〔R3-Ⅲ-4〕"},
 {f:"化学物質", q:"シアンを45mg/L含むシアン化ナトリウム排水62m3を、下記の反応式に従いアルカリ塩素法で完全に分解する場合に必要な次亜塩素酸ナトリウムの理論量として、最も近い値はどれか（CN=26、NaOCl=74.5とする）。<br>NaCN + NaOCl → NaOCN + NaCl<br>2NaOCN + 3NaOCl + H2O → 2CO2 + N2 + 2NaOH + 3NaCl", h:"2段階の反応式それぞれで必要なNaOClのモル数を求め、合計する。",
  c:["20kg","16kg","12kg","8kg"], a:0, v:"answer",
  n:"<b>約20kg</b>。CN⁻の総量は45mg/L×62,000L=2,790,000mg=2.79kgで、モル数は2.79kg÷26g/mol≒107.3mol。第1段階（NaCN+NaOCl→NaOCN+NaCl）ではCN⁻1molにNaOCl1molが必要なので107.3mol。第2段階（2NaOCN+3NaOCl+H2O→2CO2+N2+2NaOH+3NaCl）ではNaOCN:NaOCl=2:3なので、107.3mol×3/2≒161.0molが追加で必要。合計約268.3molのNaOClが必要で、質量は268.3mol×74.5g/mol≒19,990g≒20kg。〔R3-Ⅲ-8〕"},
 {f:"地球環境", q:"文部科学省・気象庁が作成した「日本の気候変動2020」が示す観測結果に関する記述のうち、最も適切なものはどれか。", h:"台風の発生数・接近数・上陸数の統計に、長期的な傾向があるかどうかに注目。",
  c:["台風の発生数、日本への接近数及び上陸数には、統計的に有意な長期的な増加・減少の変化傾向は見られない","台風の発生数は長期的に増加傾向にある","日本への台風の上陸数は長期的に減少傾向にある","台風の接近数は長期的に増加傾向にあり、上陸数もこれに伴い増加しているため、沿岸部の防災対策の見直しが進められている"], a:0, v:"answer",
  n:"<b>台風の発生数・接近数・上陸数には、統計期間を通じて長期的な変化傾向は見られない</b>（1年〜数十年規模の変動が卓越する）というのが「日本の気候変動2020」の結論。長期的な変化傾向が見られるとした記述は誤り。一方、真夏日・猛暑日・熱帯夜の日数増加、大雨・短時間強雨の頻度の有意な増加、日本沿岸の海水の酸性化傾向は、同報告書で実際に観測されている変化として記載されている。〔R3-Ⅲ-10〕"},
 {f:"測定・分析", q:"各種分析装置に関する記述のうち、最も適切なものはどれか。", h:"誘導結合プラズマ質量分析計（ICP-MS）の基本原理に注目。",
  c:["誘導結合プラズマ質量分析計（ICP-MS）は、プラズマでイオン化した元素を、質量電荷比に応じて分離・測定する装置である","蛍光X線分析計は、試料中の元素の化学的な存在形態（化合物としての結合状態）を直接測定する装置である","ガスクロマトグラフ（GC）は、常温で気体状の物質のみを測定対象とする装置である","イオンクロマトグラフ（IC）は、試料中の無機イオンのみを測定対象とし、有機酸イオン等は測定できない装置である"], a:0, v:"answer",
  n:"<b>ICP-MSは、誘導結合プラズマ中でイオン化した元素を質量電荷比（m/z）により分離・検出する装置</b>。蛍光X線分析計が測定するのは元素の存在量（濃度）であり、化合物としての結合状態（化学形態）までは分からない。GCは加熱気化させた試料を分析するもので、対象は常温で気体の物質に限らず、揮発性の液体・固体試料も気化させて測定できる。ICは無機イオンだけでなく有機酸イオン等の分析にも用いられる。〔R3-Ⅲ-13〕"},
 {f:"測定・分析", q:"大気環境基準物質の測定方法に関する記述のうち、最も適切なものはどれか。", h:"光化学オキシダント・SPM・CO・SO2それぞれの測定・校正方法の細かな規定に注意。",
  c:["光化学オキシダントは、紫外線吸収法又は化学発光法により得られたオゾン濃度をもって光化学オキシダント濃度としてよい","浮遊粒子状物質（SPM）は、粒径10μmの粒子を50%の割合で分離する分粒装置を通過したものを測定対象とする","一酸化炭素は不安定な物質であるため、標準ガスによる測定機器の校正はできない","二酸化硫黄の試料採取管には、塩化ビニルやゴム製の素材を使用できる"], a:0, v:"answer",
