<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="技術士第一次試験・基礎科目（群1設計・計画／群2情報・論理／群3解析／群4材料・化学・バイオ／群5環境・エネルギー・技術）の学習ツール。過去問の出題論点にもとづく自作の4択クイズ。">
<title>技術士一次試験 基礎科目（群1〜5）クイズ</title>
</head>
<body>

<style>
  :root {
    --paper: #FCFBF8;
    --panel: #FFFFFF;
    --rule: #DCDDD6;
    --rule-strong: #B7BBB2;
    --ink: #191D1A;
    --ink-2: #4A5049;
    --ink-3: #767C74;
    --accent: #0E5049;
    --accent-soft: #E3EDEA;
    --ok: #1B6B3A;
    --ok-soft: #E2F0E5;
    --ng: #9E3324;
    --ng-soft: #F7E6E2;
    --shadow: 0 1px 2px rgba(25,29,26,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #131614; --panel: #1A1E1C; --rule: #2C312E; --rule-strong: #454B46;
      --ink: #E8EBE7; --ink-2: #AFB5AD; --ink-3: #838A82;
      --accent: #6FBFB2; --accent-soft: #1E3833;
      --ok: #6FC28C; --ok-soft: #1C3325;
      --ng: #E08878; --ng-soft: #3A2320;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --paper: #131614; --panel: #1A1E1C; --rule: #2C312E; --rule-strong: #454B46;
    --ink: #E8EBE7; --ink-2: #AFB5AD; --ink-3: #838A82;
    --accent: #6FBFB2; --accent-soft: #1E3833;
    --ok: #6FC28C; --ok-soft: #1C3325;
    --ng: #E08878; --ng-soft: #3A2320;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    font-size: 16px; line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 34rem; margin: 0 auto; padding: 1.5rem 1.1rem 4rem; }

  /* header */
  header { margin-bottom: 1.3rem; }
  .eyebrow { font-size: .72rem; letter-spacing: .15em; color: var(--ink-3); }
  h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 1.32rem; font-weight: 600; margin: .3rem 0 .5rem; line-height: 1.4;
  }
  .intro { font-size: .87rem; color: var(--ink-2); margin: 0; }

  /* progress */
  .status {
    display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap;
    font-size: .8rem; color: var(--ink-3); margin: 1.2rem 0 .45rem;
    font-variant-numeric: tabular-nums;
  }
  .status .field { color: var(--accent); font-weight: 600; letter-spacing: .02em; }
  .status .score { margin-left: auto; }
  .status b { color: var(--ink); }
  .status[hidden], .bar[hidden] { display: none; }

  /* 本番までの残り日数 */
  /* おまかせ出題 */
  .set.auto[aria-pressed="false"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .set .badge {
    display: inline-block; min-width: 1.4em; margin-left: .35em; padding: 0 .35em; border-radius: 999px;
    background: var(--ng); color: #fff; font-size: .68rem; font-weight: 700; line-height: 1.55; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .auto { margin-top: 1rem; padding-top: .9rem; border-top: 1px solid var(--rule); }
  .auto h3 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1rem; font-weight: 600; margin: 0 0 .3rem; }
  .auto-lead { font-size: .82rem; color: var(--ink-2); margin: 0 0 .7rem; line-height: 1.75; }
  .auto-n { display: flex; justify-content: space-between; align-items: baseline; font-size: .85rem; }
  .auto-n output { font-weight: 700; color: var(--accent); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  #autoN { display: block; width: 100%; margin: .45rem 0 .1rem; accent-color: var(--accent); }
  .auto-scale { display: flex; justify-content: space-between; font-size: .72rem; color: var(--ink-3); }
  .auto .btn.wide { margin-top: .8rem; }
  .mastery { display: flex; flex-wrap: wrap; gap: .3rem .9rem; margin-top: .7rem; font-size: .76rem; color: var(--ink-3); }
  .mastery b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .mastery .m1 b { color: var(--ng); }
  .mastery .m3 b, .mastery .m4 b { color: var(--ok); }
  .mst {
    display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .04em; padding: 0 .4rem;
    border-radius: 2px; margin-left: .45rem; vertical-align: 1px; border: 1px solid var(--rule-strong); color: var(--ink-3);
  }
  .mst.m1 { color: var(--ng); border-color: var(--ng); }
  .mst.m3, .mst.m4 { color: var(--ok); border-color: var(--ok); }
  .countdown { font-size: .82rem; color: var(--ink-2); margin: .5rem 0 0; font-variant-numeric: tabular-nums; }
  .countdown b { color: var(--accent); font-size: 1rem; }
  .countdown .cd2 { font-size: .76rem; color: var(--ink-3); }

  /* 覚える理由（過去問の出題実績） */
  .whys { display: flex; flex-wrap: wrap; gap: .3rem; margin: .35rem 0 0; }
  .why {
    display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .02em; line-height: 1.6;
    padding: 0 .45rem; border-radius: 2px; border: 1px solid var(--accent); color: var(--accent);
  }
  .why.t3 { background: var(--accent); color: var(--paper); }
  .why.same { background: var(--accent-soft); }
  .why.t1 { border-style: dashed; border-color: var(--rule-strong); color: var(--ink-3); font-weight: 600; }
  .whybox {
    margin: .7rem 0 0; padding: .55rem .7rem; background: var(--accent-soft);
    border-left: 3px solid var(--accent); font-size: .82rem; line-height: 1.7; color: var(--ink-2);
  }
  .whybox .wh { display: block; font-size: .72rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
  .whybox.t0 { border-left-color: var(--rule-strong); background: transparent; border: 1px dashed var(--rule); border-left: 3px solid var(--rule-strong); }
  .whybox.t0 .wh { color: var(--ink-3); }

  /* 合格までの道のり（ホーム） */
  .roadmap { margin-top: 1.1rem; padding-top: .9rem; border-top: 1px solid var(--rule); }
  .roadmap h3 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1rem; font-weight: 600; margin: 0 0 .3rem; }
  .roadmap .rm-lead { font-size: .84rem; color: var(--ink-2); margin: 0 0 .6rem; line-height: 1.75; }
  .rm-steps { list-style: none; margin: 0; padding: 0; }
  .rm-steps li {
    display: grid; grid-template-columns: 4.2rem 1fr; gap: .1rem .6rem; align-items: baseline;
    padding: .5rem 0; border-bottom: 1px solid var(--rule); font-size: .84rem;
  }
  .rm-steps .d { font-size: .74rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .rm-steps .t { color: var(--ink); }
  .rm-steps .v { grid-column: 2; font-size: .76rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .rm-steps .st { font-size: .68rem; font-weight: 700; padding: 0 .35rem; border-radius: 2px; margin-left: .35rem; vertical-align: 1px; }
  .rm-steps .done .st { color: var(--ok); border: 1px solid var(--ok); }
  .rm-steps .now .st { color: var(--paper); background: var(--accent); }
  .rm-steps .late .st { color: var(--paper); background: var(--ng); }
  .rm-steps .todo .t { color: var(--ink-3); }
  .roadmap .rm-note { font-size: .76rem; color: var(--ink-3); margin: .45rem 0 0; line-height: 1.65; }
  .rm-next { margin-top: .8rem; }
  .rm-next .lab { font-size: .74rem; color: var(--ink-3); margin: 0 0 .3rem; }
  .rm-next .btn { display: block; width: 100%; text-align: left; padding: .65rem 1rem; margin-top: .45rem; }
  .rm-next .btn .sub { display: block; font-size: .76rem; font-weight: 400; opacity: .88; }
  .homecard .hlead { font-size: .9rem; color: var(--ink-2); margin: 0; line-height: 1.7; }
  .homecard .btn.wide { display: block; width: 100%; text-align: left; padding: .7rem 1rem; margin-top: .9rem; }
  .homecard .btn.wide .sub { display: block; font-size: .78rem; font-weight: 400; opacity: .88; margin-top: .1rem; }
  .homestats {
    display: flex; gap: .4rem 1rem; flex-wrap: wrap; margin-top: 1rem; padding-top: .8rem;
    border-top: 1px solid var(--rule); font-size: .8rem; color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  .homestats b { color: var(--ink); }
  .bar { height: 3px; background: var(--rule); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

  /* card */
  .card {
    background: var(--panel); border: 1px solid var(--rule);
    box-shadow: var(--shadow); padding: 1.15rem 1.1rem 1.25rem; margin-top: 1.1rem;
  }
  .qn { font-size: .75rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .qt { font-size: 1.03rem; font-weight: 600; margin: .25rem 0 .1rem; line-height: 1.6; text-wrap: pretty; white-space: pre-line; }
  .qh { font-size: .82rem; color: var(--ink-3); margin: 0 0 .9rem; line-height: 1.6; }

  .choices { display: flex; flex-direction: column; gap: .45rem; }
  .ch {
    display: flex; align-items: flex-start; gap: .65rem; width: 100%;
    font: inherit; font-size: .95rem; text-align: left; cursor: pointer;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: 2px;
    padding: .58rem .7rem; line-height: 1.55;
    transition: background .12s, border-color .12s;
    font-variant-numeric: tabular-nums;
  }
  .ch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ch:disabled { cursor: default; }
  .ch .key {
    flex: none; width: 1.35rem; height: 1.35rem; margin-top: .1rem;
    display: grid; place-items: center;
    border: 1px solid var(--rule-strong); border-radius: 50%;
    font-size: .72rem; color: var(--ink-3);
  }
  .ch.ok { border-color: var(--ok); background: var(--ok-soft); }
  .ch.ok .key { border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .ch.ng { border-color: var(--ng); background: var(--ng-soft); }
  .ch.ng .key { border-color: var(--ng); color: var(--ng); font-weight: 700; }
  .ch.dim { opacity: .45; }
  .dk {
    align-self: flex-end; margin-top: .15rem; font: inherit; font-size: .8rem; color: var(--ink-3);
    background: transparent; border: 1px dashed var(--rule-strong); border-radius: 999px;
    padding: .35rem .95rem; cursor: pointer;
  }
  .dk:disabled { cursor: default; }
  .dk.on { color: var(--ng); border: 1px solid var(--ng); background: var(--ng-soft); }

  .verdict { margin-top: .95rem; padding-top: .85rem; border-top: 1px solid var(--rule); }
  .vtag { font-size: .82rem; font-weight: 700; letter-spacing: .04em; }
  .easy { margin: .6rem 0 .2rem; padding: .75rem .85rem; background: var(--accent-soft); border-radius: 10px; font-size: .9rem; line-height: 1.8; }
  .easyh, .vnoteh { font-size: .78rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; margin-bottom: .3rem; }
  .vnoteh { margin-top: .9rem; color: var(--ink-3); }
  .ezh { display: block; font-weight: 700; color: var(--accent); margin-bottom: .1rem; }
  .vtag.ok { color: var(--ok); }
  .vtag.ng { color: var(--ng); }
  .vnote { font-size: .86rem; color: var(--ink-2); margin: .3rem 0 0; line-height: 1.72; }
  .vnote b { color: var(--ink); }
  .vsrc {
    font-size: .73rem; color: var(--ink-3); margin: .55rem 0 0;
    padding-top: .45rem; border-top: 1px dotted var(--rule);
  }
  .vsrc.k { color: var(--ng); }

  .actions { display: flex; gap: .5rem; margin-top: 1rem; align-items: center; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: .87rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--paper);
    border: 1px solid var(--accent); border-radius: 2px; padding: .45rem 1.3rem;
  }
  @media (hover: hover) and (pointer: fine) { .btn:hover { filter: brightness(1.12); } }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--rule-strong); font-weight: 400; }
  @media (hover: hover) and (pointer: fine) { .btn.ghost:hover { border-color: var(--accent); color: var(--accent); filter: none; } }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: .35; cursor: default; filter: none; }
  /* 一番よく押す「次の問題」を横幅いっぱいに、その下に「前の問題」「ホーム」を半分ずつ */
  .qnav { margin-top: 1rem; }
  .navrow { display: grid; gap: .5rem; }
  .navrow.one { grid-template-columns: 1fr; margin-bottom: .5rem; }
  .navrow.two { grid-template-columns: 1fr 1fr; }
  .qnav .btn { padding: .6rem .5rem; white-space: nowrap; text-align: center; }
  .hintkey { font-size: .74rem; color: var(--ink-3); margin: .55rem 0 0; }
  @media (hover: none) { .hintkey { display: none; } }

  /* result */
  .result h2 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 1.18rem; margin: 0 0 .2rem;
  }
  .big { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--accent); }
  .big small { font-size: 1rem; font-weight: 400; color: var(--ink-3); }
  .judge { font-size: .9rem; color: var(--ink-2); margin: .5rem 0 1.1rem; line-height: 1.7; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
  th, td { padding: .38rem .3rem; border-bottom: 1px solid var(--rule); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  thead th { font-size: .75rem; color: var(--ink-3); font-weight: 600; border-bottom: 1px solid var(--rule-strong); }
  td .mini { display: inline-block; width: 3.2rem; height: 4px; background: var(--rule); vertical-align: middle; margin-left: .4rem; }
  td .mini i { display: block; height: 100%; background: var(--accent); }
  .missed { margin-top: 1.4rem; }
  .missed h3 { font-size: .85rem; margin: 0 0 .5rem; color: var(--ink-3); font-weight: 600; letter-spacing: .03em; }
  .missed ol { margin: 0; padding-left: 1.2rem; font-size: .87rem; color: var(--ink-2); line-height: 1.75; }
  .missed b { color: var(--ink); }

  /* 再開バナー・保存警告 */
  .resume {
    display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap;
    background: var(--accent-soft); border-left: 3px solid var(--accent);
    padding: .6rem .85rem; margin-top: 1rem; font-size: .84rem; color: var(--ink-2);
  }
  .resume b { color: var(--ink); }
  .resume button {
    font: inherit; font-size: .78rem; cursor: pointer; background: none; color: var(--accent);
    border: 0; border-bottom: 1px solid var(--accent); padding: 0 0 1px; margin-left: auto;
  }
  .nostore {
    background: var(--ng-soft); border-left: 3px solid var(--ng);
    padding: .6rem .85rem; margin-top: 1rem; font-size: .82rem; color: var(--ink-2); line-height: 1.7;
  }
  .nostore b { color: var(--ink); }

  /* データ読み込み */
  .datamgr { margin-top: 2rem; padding-top: 1.1rem; border-top: 1px solid var(--rule); }
  .datamgr h3 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 1rem; font-weight: 600; margin: 0 0 .3rem;
  }
  .datamgr p { font-size: .82rem; color: var(--ink-2); margin: 0 0 .8rem; line-height: 1.75; }
  .imp { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .imp input[type=file] { display: none; }
  .impfile {
    font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--paper); border: 1px solid var(--accent);
    border-radius: 2px; padding: .45rem 1.2rem; display: inline-block;
  }
  @media (hover: hover) and (pointer: fine) { .impfile:hover { filter: brightness(1.12); } }
  .impfile.ghost { background: transparent; color: var(--accent); }
  .impfile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .impmsg { font-size: .78rem; }
  .impmsg.ok { color: var(--ok); }
  .impmsg.ng { color: var(--ng); }
  .impitem {
    display: flex; align-items: baseline; gap: .6rem; padding: .5rem 0;
    border-bottom: 1px solid var(--rule); font-size: .86rem;
  }
  .impitem .n2 { color: var(--ink-3); font-size: .78rem; font-variant-numeric: tabular-nums; }
  .impitem button {
    margin-left: auto; font: inherit; font-size: .76rem; cursor: pointer;
    background: none; color: var(--ink-3); border: 0;
    border-bottom: 1px solid var(--rule-strong); padding: 0 0 1px;
  }
  @media (hover: hover) and (pointer: fine) { .impitem button:hover { color: var(--ng); border-bottom-color: var(--ng); } }
  .privacy { font-size: .76rem; color: var(--ink-3); line-height: 1.7; margin-top: .8rem; }

  /* 学習診断 */
  .diag { margin-top: 1.6rem; }
  .diag h3 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 1rem; font-weight: 600; margin: 0 0 .2rem;
    padding-bottom: .4rem; border-bottom: 1.5px solid var(--ink);
  }
  .diag .note2 { font-size: .8rem; color: var(--ink-3); margin: .5rem 0 .8rem; line-height: 1.7; }
  .drow {
    display: grid; grid-template-columns: 1fr 4.6rem 3.4rem; gap: .15rem .7rem;
    padding: .5rem 0; border-bottom: 1px solid var(--rule); align-items: center;
  }
  .drow .dn { font-size: .87rem; font-weight: 600; }
  .drow .dsub { grid-column: 1 / -1; font-size: .72rem; color: var(--ink-3); line-height: 1.55; }
  .drow .dv { font-size: .82rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .drow .dloss { font-size: .95rem; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .drow.p1 .dloss { color: var(--ng); }
  .drow.p2 .dloss { color: var(--amber, #8A6A1F); }
  .drow.p3 .dloss { color: var(--ink-3); font-weight: 400; }
  .rx { background: var(--accent-soft); padding: .9rem 1.1rem; margin-top: 1rem; font-size: .87rem; line-height: 1.8; }
  .rx b { color: var(--ink); }
  .rx ol { margin: .4rem 0 0; padding-left: 1.2rem; }
  .rx li { margin-bottom: .3rem; }
  .exp { margin-top: 1.2rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .exp .msg { font-size: .78rem; color: var(--accent); }

  /* 履歴タブ */
  .hsum {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr));
    gap: .1rem 1rem; margin: 1.1rem 0 .3rem; padding-bottom: .9rem;
    border-bottom: 1px solid var(--rule);
  }
  .hsum div { font-size: .74rem; color: var(--ink-3); }
  .hsum b { display: block; font-size: 1.35rem; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.35; }
  .hsum .warn b { color: var(--ng); }
  .filters { display: flex; gap: .35rem; flex-wrap: wrap; margin: .9rem 0 .2rem; align-items: center; }
  .flt {
    font: inherit; font-size: .78rem; cursor: pointer; background: var(--panel); color: var(--ink-2);
    border: 1px solid var(--rule-strong); border-radius: 999px; padding: .2rem .75rem;
  }
  .flt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 600; }
  @media (hover: hover) and (pointer: fine) { .flt:hover:not([aria-pressed="true"]) { border-color: var(--accent); color: var(--accent); } }
  .flt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hrow {
    display: grid; grid-template-columns: 1fr auto; gap: .1rem .8rem;
    padding: .62rem 0; border-bottom: 1px solid var(--rule); align-items: baseline;
  }
  .hrow .hq { font-size: .87rem; line-height: 1.55; white-space: pre-line; }
  .hrow .hf { font-size: .7rem; color: var(--accent); letter-spacing: .03em; }

<script>
// 基礎科目 群1（設計・計画）の予想問題。すべて自作で、過去問の文は転載していない。〔出題実績〕は論点単位。
const KISO1_DATA = [
{"f":"基礎:設計・計画","q":"直径 d＝20 mm の丸棒に軸方向の引張荷重を加える。材料の降伏点は 360 MPa で、降伏点を基準強さ、安全率を 2.4 として許容応力を定める。この丸棒に加えてよい最大の引張荷重として最も適切なものはどれか。座屈や応力集中は考えず、円周率は π＝3.14 として計算する。","h":"許容応力は基準強さを安全率で割った値で、断面積は π/4×d² です。","c":["約113 kN","約188 kN","約271 kN","約47.1 kN"],"a":3,"v":"calc","n":"<b>許容応力＝基準強さ÷安全率＝360÷2.4＝150 MPa</b>。断面積 A＝π×20²/4＝314 mm²。許容荷重＝150×314≒<b>47.1 kN</b>。<br>約113 kN は安全率を使わず降伏点 360 MPa をそのまま許容応力にした値。約188 kN は断面積を π×d²（半径と直径の混同、4 で割り忘れ）とした値。約271 kN は安全率 2.4 を割らずに掛けた値（安全率の向きの逆転）。<br><br>【出典】検算: 許容応力＝基準強さ/安全率、許容荷重＝許容応力×断面積（材料力学の教科書）。verify_g1.py で数値確認〔出題実績: R3 1-5、R6 1-2、R7 1-1、R7 1-3〕"},
{"f":"基礎:設計・計画","q":"構造物の限界状態設計における「終局限界状態」の説明として最も適切なものはどれか。","h":"終局は人命に関わる安全性、使用は機能、修復は継続使用のための補修、と整理できます。","c":["想定される作用で予測される応答に対して、構造物の設置目的を達成するための機能が確保される限界の状態","想定される損傷に対して、適用可能な技術で妥当な経費と期間の範囲で修復すれば、構造物の継続使用を可能にできる限界の状態","想定される作用で予測される破壊や大変形等に対して、構造物の安定性が損なわれず、人命に対する安全性等を確保できる限界の状態","想定される作用の下で、部材の応力が許容応力度を超えず、部材が弾性範囲にとどまることを確保できる限界の状態"],"a":2,"v":"primary","n":"<b>終局限界状態（安全性）</b>は、破壊や大変形等に対して構造物の安定性が損なわれず、内外の人命に対する安全性等を確保できる限界の状態。<br>「設置目的を達成するための機能が確保される」は使用限界状態（使用性）の定義、「妥当な経費と期間で修復すれば継続使用できる」は修復限界状態（修復性）の定義で、名称と定義を入れ替えると誤る。「応力が許容応力度を超えない」は許容応力度設計の考え方に近い記述で、限界状態の分類には含まれない。<br><br>【出典】国土交通省「土木・建築にかかる設計の基本」 https://www.mlit.go.jp/kisha/kisha02/13/131021/131021.pdf 表2-1（本文確認 2026-10-04）〔出題実績: R3 1-5、R6 1-2、R7 1-1、R7 1-3〕"},
{"f":"基礎:設計・計画","q":"JIS Z 8115:2019（ディペンダビリティ用語）における「安全係数」の定義として最も適切なものはどれか。","h":"最大側のストレスと最小側の強度を比べる定義で、平均同士の比は別名で呼ばれます。","c":["運用中のストレスの平均値に対する、設計上の強度の平均値の倍率","運用中に推定されるストレスの最大値に対する、設計における強度の平均値の倍率","運用中のストレスの平均値に対する、設計における強度の最小値の倍率","運用中に推定されるストレスの最大値に対する、設計における強度の最小値の倍率"],"a":3,"v":"primary","n":"<b>安全係数は、運用中に推定されるストレスの最大値に対する設計強度の最小値の倍率</b>（ばらつきや推定の不確かさを見込む）。<br>平均÷平均は同規格が「安全率」と呼ぶ倍率で、安全係数と安全率の取り違え。ストレスの最大値と強度の平均値の比、ストレスの平均値と強度の最小値の比は、最大・最小・平均の組合せを崩した記述。<br><br>【出典】JIS Z 8115:2019 ディペンダビリティ（総合信頼性）用語（jis.eomec.com の本文で確認 2026-10-04） 安全係数の定義および注記3〔出題実績: R3 1-5、R6 1-2、R7 1-1、R7 1-3〕"},
{"f":"基礎:設計・計画","q":"直径 10 mm、長さ 200 mm の丸棒に軸方向の引張荷重 10 kN を加えた。材料は縦弾性係数（ヤング率）200 GPa の弾性変形の範囲にあるとき、棒の伸びとして最も適切なものはどれか。","h":"伸び＝（荷重×長さ）÷（断面積×縦弾性係数）で、単位を N と mm に揃えます。","c":["約0.100 mm","約0.127 mm","約0.032 mm","約1.27 mm"],"a":1,"v":"calc","n":"フックの法則より<b>σ＝P/A＝10000/78.5＝127 MPa、ε＝σ/E＝127/200000＝6.37×10⁻⁴、伸び＝ε×L＝約0.127 mm</b>。<br>0.100 mm は断面積を d²（円の面積の係数 π/4 を落とした）とした値。約0.032 mm は断面積を πd²（半径と直径の混同）とした値。約1.27 mm は 200 GPa を 20 GPa として扱った桁ずれ（単位換算ミス）。<br><br>【出典】検算: フックの法則 σ＝Eε、伸び δ＝PL/(AE)（材料力学の教科書）。verify_g1.py で数値確認〔出題実績: R2 1-3、R4 1-1、R5 1-2、R5 1-3〕"},
{"f":"基礎:設計・計画","q":"長さ L＝1.0 m の細長い柱が、下端を固定、上端を自由にして圧縮荷重を受ける。柱の縦弾性係数は E＝200 GPa、座屈に対する断面二次モーメントは I＝2.0×10⁴ mm⁴ で、この支持条件の有効座屈長さは 2L とする。オイラーの座屈荷重として最も適切なものはどれか。円周率は π²＝9.87 とする。","h":"座屈荷重は π²EI を有効座屈長さの2乗で割った値で、有効座屈長さは 2L です。","c":["約39.5 kN","約9.9 kN","約19.7 kN","約158 kN"],"a":1,"v":"calc","n":"<b>Pcr＝π²EI/(2L)²＝9.87×200000×20000/2000²≒9870 N＝約9.9 kN</b>。<br>約39.5 kN は有効座屈長さを L とした両端ピンの値（支持条件の取り違え）。約19.7 kN は有効座屈長さ 2L を2乗せず 2 倍だけ反映した値（2乗の付け忘れ）。約158 kN は両端固定（有効座屈長さ 0.5L）の値。<br><br>【出典】検算: オイラーの座屈荷重 Pcr＝π²EI/(KL)²（材料力学の教科書）。verify_g1.py で数値確認〔出題実績: R2 1-3、R4 1-1、R5 1-2、R5 1-3〕"},
{"f":"基礎:設計・計画","q":"JIS Z 2241:2011（金属材料引張試験方法）の用語で「引張強さ」に当たるものはどれか。","h":"引張強さは、試験中に試験片が受けた最大の力に結び付けて定義されます。","c":["試験中に加わった最大試験力に対応する応力","最初に試験力の減少が観察されるより前の応力の最大値","塑性伸びが伸び計標点距離に対する規定の百分率に等しくなったときの応力","試験片が完全に分離したとみなされる瞬間の試験力に対応する応力"],"a":0,"v":"primary","n":"<b>引張強さ（Rm）は最大試験力 Fm に対応する応力</b>（3.10.1）。<br>「最初に試験力の減少が観察されるより前の応力の最大値」は上降伏応力 ReH（3.10.2.1）、「塑性伸びが規定の百分率に等しくなったときの応力」は耐力（オフセット法）Rp（3.10.3、例 Rp0.2）、「完全に分離する瞬間」を基準にした記述は破断（3.11）に関するもので、いずれも別の用語。破断時の応力を引張強さと思い込むのが典型的な誤り。<br><br>【出典】JIS Z 2241:2011 金属材料引張試験方法 3.10（kikakurui.com/z2/Z2241-2011-01.html で本文確認 2026-10-04）〔出題実績: R2 1-3、R4 1-1、R5 1-2、R5 1-3〕"},
{"f":"基礎:設計・計画","q":"ユニバーサルデザインの原則と事例の組合せとして最も適切なものはどれか。","h":"各原則は公平性・柔軟性・単純性・わかりやすさ・安全性・省体力・スペース確保の7つです。","c":["車いすでも通れるように幅広の改札を設ける：柔軟性","大きな事故を防ぐために出入口を二重扉にする：安全性","使い方が直感的に分かる動く歩道を設ける：省体力","位置がはっきり分かるサインでトイレを案内する：公平性"],"a":1,"v":"primary","n":"<b>二重扉は大きな事故を防ぐ例で「安全性」</b>。<br>幅広の改札は利用に適切な広さと幅を確保する例で「スペース確保」（柔軟性ではない）。動く歩道は使い方がすぐ分かる例で「単純性」（省体力ではない）。はっきりしたサインは必要な情報を分かりやすくする例で「わかりやすさ」（公平性ではない）。<br><br>【出典】国土交通省 中国地方整備局「ユニバーサルデザインとは」 https://www.cgr.mlit.go.jp/universal/pdf/01_01.pdf（本文確認 2026-10-04）〔出題実績: R2 1-1、R3 1-1、R6 1-1〕"},
{"f":"基礎:設計・計画","q":"バリアフリーとユニバーサルデザインの考え方の整理として最も適切なものはどれか。","h":"バリアフリーは障壁を後から取り除く発想で、ユニバーサルデザインは最初から設計に織り込む発想です。","c":["バリアフリーは全ての人を対象にはじめから設計する考え方で、ユニバーサルデザインは特定の人の障害（バリア）をなくす考え方","バリアフリーは特定の人の障害（バリア）をなくす考え方で、ユニバーサルデザインははじめから全ての人が使いやすいようにデザインする考え方","バリアフリーもユニバーサルデザインも健常者に合わせて整備した現況を前提に、高齢者や障害者向けの設備を別に付け足す考え方","バリアフリーは設計の過程で利用者の意見を反映することを重視し、ユニバーサルデザインは完成後に障害をなくす対策を重視する考え方"],"a":1,"v":"primary","n":"<b>バリアフリーは特定の方の障害をなくす考え方（対象は高齢者・障害者）、ユニバーサルデザインははじめから全ての人が使いやすいようにデザインする考え方（対象は全ての人）</b>。<br>両者の対象と考え方を入れ替えた記述は逆。両者とも健常者に合わせた現況に設備を付け足す考え方とする記述は、「現況」（健常な人に合わせた整備）と両者を同一視している。意見の反映を前者、完成後の対策を後者に当てる記述は説明が入れ替わっている（意見の反映は UD 側で重視される）。<br><br>【出典】国土交通省 中国地方整備局「ユニバーサルデザインとは」 https://www.cgr.mlit.go.jp/universal/pdf/01_01.pdf（本文確認 2026-10-04）〔出題実績: R2 1-1、R3 1-1、R6 1-1〕"},
{"f":"基礎:設計・計画","q":"ユニバーサルデザインの7原則（ノースカロライナ州立大学ユニバーサルデザインセンターが提唱）に含まれないものはどれか。","h":"7原則は人間工学的な使いやすさの視点で、美しさや価格は原則そのものに含まれません。","c":["無理な姿勢をとることなく、楽に利用できること（省体力）","美しく魅力的な外観で、デザイン性が高いこと（審美性）","必要な情報が、利用者に容易に理解できること（わかりやすさ）","あらゆる人に応じた使い方が選択できること（柔軟性）"],"a":1,"v":"primary","n":"<b>審美性は7原則に含まれない</b>。7原則は公平性・柔軟性・単純性・わかりやすさ・安全性・省体力・スペース確保。審美性は「よいデザイン」の別の要件として論じられ、7原則は美しさを言っていないとの指摘もある。<br>省体力・わかりやすさ・柔軟性はいずれも7原則そのもの。<br><br>【出典】国土交通省 中国地方整備局「ユニバーサルデザインとは」 https://www.cgr.mlit.go.jp/universal/pdf/01_01.pdf（本文確認 2026-10-04） 7原則と「その他の原則・考え方」の節〔出題実績: R2 1-1、R3 1-1、R6 1-1〕"},
{"f":"基礎:設計・計画","q":"穴の内径 X は平均 20.10 mm、標準偏差 0.03 mm の正規分布に、軸の外径 Y は平均 20.00 mm、標準偏差 0.04 mm の正規分布に従い、X と Y は互いに独立である。無作為に選んだ穴と軸を組み合わせたとき、軸が穴に入らない（X－Y＜0 となる）確率として最も適切なものはどれか。標準正規分布の上側確率は、Q(1.43)＝0.0764、Q(2.00)＝0.0228、Q(2.50)＝0.0062 とする。","h":"差 X－Y も正規分布に従い、平均は差、分散は2つの分散の和になります。","c":["約7.6％","約2.3％","約0.6％","約97.7％"],"a":1,"v":"calc","n":"<b>X－Y の平均＝0.10 mm、分散＝0.03²＋0.04²＝0.0025、標準偏差＝0.05 mm。z＝0.10/0.05＝2.0 なので、X－Y＜0 の確率＝Q(2.0)≒2.3％</b>。<br>約7.6％は標準偏差を 0.03＋0.04＝0.07 と足した値（z＝1.43、分散でなく標準偏差の加算）。約0.6％は軸の標準偏差 0.04 だけで割った値（z＝2.5、穴側のばらつきの無視）。約97.7％は確率の向きを逆にした値（入る確率を答えている）。<br><br>【出典】検算: 独立な正規変数の差は平均が差、分散が和の正規分布（確率統計の教科書）。verify_g1.py で数値確認〔出題実績: R2 1-2、R4 1-3、R6 1-6〕"},
{"f":"基礎:設計・計画","q":"3種類の部品 A、B、C を一列に積み重ねて組み立てる。部品の長さは互いに独立な正規分布に従い、平均と標準偏差は、A が 30.0 mm と 0.2 mm、B が 40.0 mm と 0.3 mm、C が 20.0 mm と 0.6 mm である。組み立てた全長が 91.05 mm を超える確率として最も適切なものはどれか。標準正規分布の上側確率は、Q(0.95)＝0.1711、Q(1.50)＝0.0668、Q(2.14)＝0.0162 とする。","h":"全長は3つの長さの和で、平均は和、分散も和になります。標準偏差は分散の和の平方根です。","c":["約13.4％","約17.1％","約6.7％","約1.6％"],"a":2,"v":"calc","n":"<b>全長の平均＝90.0 mm、分散＝0.2²＋0.3²＋0.6²＝0.49、標準偏差＝0.7 mm。z＝(91.05－90.0)/0.7＝1.5 なので、Q(1.5)≒6.7％</b>。<br>約13.4％は両側確率 2Q(1.5) とした値（「超える」は片側のみ）。約17.1％は標準偏差を 0.2＋0.3＋0.6＝1.1 と単純に足した値（z＝0.95）。約1.6％は分散 0.49 を標準偏差として使った値（√の付け忘れ、z＝2.14）。<br><br>【出典】検算: 独立な正規変数の和は平均が和、分散が和の正規分布（確率統計の教科書）。verify_g1.py で数値確認〔出題実績: R2 1-2、R4 1-3、R6 1-6〕"},
{"f":"基礎:設計・計画","q":"部材の強度 R と作用する応力 S は、互いに独立な正規分布に従う。強度が応力を下回る（R＜S）と破壊する。次の4つの設計のうち、破壊確率が最も小さいものはどれか。数値は［強度の平均, 標準偏差］と［応力の平均, 標準偏差］で、単位はいずれも MPa である。ア：［400, 20］と［250, 40］、イ：［500, 50］と［300, 50］、ウ：［450, 30］と［300, 30］、エ：［600, 80］と［380, 40］。","h":"R－S の平均を標準偏差で割った値が最も大きい設計が、破壊確率が最小です。","c":["ウ","ア","イ","エ"],"a":0,"v":"calc","n":"<b>R－S の平均を標準偏差√(σR²＋σS²)で割った値 z を比べる。ア 3.35、イ 2.83、ウ 3.54、エ 2.46 で、z が最大のウが破壊確率最小</b>。<br>イは平均の比（1.67）が最大、エは平均の差（220 MPa）が最大で、ばらつきを無視するとこれらを選んでしまう。アは z が近いが、ウに及ばない。<br><br>【出典】検算: 応力-強度干渉モデルで R－S は平均 μR－μS、分散 σR²＋σS² の正規分布（信頼性工学の教科書）。verify_g1.py で数値確認〔出題実績: R2 1-2、R4 1-3、R6 1-6〕"},
{"f":"基礎:設計・計画","q":"信頼度 0.70 の同一のユニットを n 台並列に接続し、1台でも動作していればシステムが機能する冗長系を作る。各ユニットは互いに独立に故障する。システムの信頼度を 0.99 以上にするために必要な最少の台数として最も適切なものはどれか。","h":"n 台すべてが故障する確率が 0.01 以下になればよく、1台が故障する確率は 0.30 です。","c":["3台","5台","4台","13台"],"a":2,"v":"calc","n":"<b>並列系の信頼度＝1－(1－0.7)ⁿ。n＝3 で 1－0.027＝0.973（不足）、n＝4 で 1－0.0081＝0.9919（0.99 以上）なので最少は4台</b>。<br>3台は 0.973 を 0.99 に足りると見た切り捨て。5台は必要台数に余裕を足した過剰設計。13台は 0.7ⁿ≦0.01 としてしまった値（故障確率 0.3 でなく信頼度 0.7 をべき乗した取り違え）。<br><br>【出典】検算: 並列系の信頼度 R＝1－Π(1－Rᵢ)（信頼性工学の教科書）。verify_g1.py で数値確認〔出題実績: R2 1-6、R3 1-2、R5 1-4〕"},
{"f":"基礎:設計・計画","q":"信頼度 0.80 の同一のユニット3台からなり、3台のうち2台以上が動作すれば機能する系（2-out-of-3 冗長系）の信頼度として最も適切なものはどれか。各ユニットは互いに独立に故障する。","h":"動作が2台ちょうどの場合と3台すべての場合を足し合わせます。","c":["0.992","0.896","0.512","0.384"],"a":1,"v":"calc","n":"<b>R＝3×0.8²×0.2＋0.8³＝0.384＋0.512＝0.896</b>（2台ちょうどが動作する確率と、3台とも動作する確率の和）。<br>0.992 は1台でも動けばよい並列系 1－0.2³ の値。0.512 は3台すべてが必要な直列系 0.8³ の値。0.384 は2台ちょうどの場合だけを数え、3台すべて動作する場合を落とした値。<br><br>【出典】検算: k-out-of-n 系の信頼度（二項分布の上側確率）R＝Σ C(n,i)Rⁱ(1－R)ⁿ⁻ⁱ（信頼性工学の教科書）。verify_g1.py で数値確認〔出題実績: R2 1-6、R3 1-2、R5 1-4〕"},
{"f":"基礎:設計・計画","q":"信頼度 0.80 の同一のユニット4台を使い、「2台を並列にしたブロック」を2段つなぎ、これらを直列に接続した系（並列2台の2段直列）を作る。各ユニットは互いに独立に故障する。この系の信頼度として最も適切なものはどれか。","h":"まず並列ブロック1つの信頼度を求め、次にそれを直列に2つ掛け合わせます。","c":["約0.870","約0.410","約0.998","約0.922"],"a":3,"v":"calc","n":"<b>並列ブロック＝1－0.2²＝0.96。2段直列なので 0.96²≒0.922</b>。<br>約0.870 は直列2台を1組にして2組を並列にした系（1－(1－0.64)²）の値で、直列と並列の構成の取り違え。約0.410 は4台すべてが直列の 0.8⁴。約0.998 は4台すべてが並列の 1－0.2⁴。<br><br>【出典】検算: 直列 R＝ΠRᵢ、並列 R＝1－Π(1－Rᵢ) を組み合わせて分解（信頼性工学の教科書）。verify_g1.py で数値確認〔出題実績: R2 1-6、R3 1-2、R5 1-4〕"},
{"f":"基礎:設計・計画","q":"ISO 9001:2015 が示す PDCA サイクルの各段階の説明として最も適切なものはどれか。","h":"Plan は目標と資源を整える段階、Do は実施、Check は監視・測定と報告、Act は改善の処置です。","c":["Plan：計画したことを実施し、その実施の結果として得られたプロセスと製品及びサービスの状況を関係者に報告する","Do：必要に応じて、パフォーマンスを改善するための処置をとり、方針及び目標に照らして成果を確認し、結果を報告する","Check：方針、目標及び計画した活動に照らして、プロセスと製品及びサービスを監視し、必要に応じて測定し、結果を報告する","Act：システムとそのプロセスの目標及び必要な資源を確立し、リスク及び機会を特定して、それらに確実に取り組む"],"a":2,"v":"primary","n":"<b>Check は、方針・目標・要求事項・計画した活動に照らしてプロセスと製品・サービスを監視し、（適用可能な場合）測定し、結果を報告する段階</b>。<br>Plan を「計画したことの実施と報告」とした記述は Plan と Do／Check の混同。Do を改善の処置とした記述は Act の内容を当てている。Act に目標と資源の確立、リスク及び機会への取組みを当てた記述は Plan の内容。段階名と内容の入れ替えを見抜く。<br><br>【出典】ISO 9001:2015 序文 0.3.2 Plan-Do-Check-Act cycle（JIS Q 9001:2015 序文 0.3.2 と同内容。ISO 9001:2015 本文で確認 2026-10-04）〔出題実績: R3 1-3、R7 1-2〕"},
{"f":"基礎:設計・計画","q":"ISO 9001:2015 の PDCA サイクルに関する記述として最も適切なものはどれか。","h":"PDCA は一つの工程にも組織全体の仕組みにも使え、Plan と Act の役割は逆にしてはいけません。","c":["PDCA サイクルは、個々のプロセスにのみ適用でき、品質マネジメントシステム全体には適用できず、Do は計画したことを実施する段階である","PDCA サイクルは、全てのプロセスにも品質マネジメントシステム全体にも適用でき、Do は目標と必要な資源を確立する段階である","PDCA サイクルは、全てのプロセスにも品質マネジメントシステム全体にも適用でき、Do は計画したことを実施する段階である","PDCA サイクルは、全てのプロセスにも品質マネジメントシステム全体にも適用でき、Do はパフォーマンスを改善する処置をとる段階である"],"a":2,"v":"primary","n":"<b>PDCA サイクルは全てのプロセスと品質マネジメントシステム全体に適用でき（0.3.2）、Do は「計画したことを実施する」段階</b>。<br>個別のプロセスにのみ適用できるとする記述は適用範囲を狭めている。Do に目標と必要な資源の確立（Plan の内容）を当てた記述、Do に改善の処置（Act の内容）を当てた記述は、段階名の取り違え。<br><br>【出典】ISO 9001:2015 序文 0.3.2 Plan-Do-Check-Act cycle（JIS Q 9001:2015 序文 0.3.2 と同内容。ISO 9001:2015 本文で確認 2026-10-04）〔出題実績: R3 1-3、R7 1-2〕"},
{"f":"基礎:設計・計画","q":"長さ 500 mm の片持ばりの自由端に、鉛直下向きに 500 N の集中荷重を加える。ばりの断面は幅 40 mm、高さ 20 mm の長方形で、高さ方向が荷重の方向である。固定端に生じる最大曲げ応力として最も適切なものはどれか。ばりの自重は無視する。","h":"固定端の曲げモーメントは荷重×長さで、長方形の断面係数は（幅×高さ²）÷6 です。","c":["約46.9 MPa","約93.8 MPa","約187 MPa","約9.4 MPa"],"a":1,"v":"calc","n":"<b>M＝500×500＝2.5×10⁵ N·mm、Z＝40×20²/6＝2667 mm³、σ＝M/Z＝約93.8 MPa</b>。<br>約46.9 MPa は幅と高さを入れ替えた Z＝20×40²/6 を使った値。約187 MPa は Z の分母を 6 でなく 12 とした値（I＝bh³/12 との混同）。約9.4 MPa は断面二次モーメント I＝bh³/12 を断面係数 Z の代わりに使った値。<br><br>【出典】検算: 片持ばりの固定端モーメント M＝PL、σ＝M/Z、長方形 Z＝bh²/6（材料力学の教科書）。verify_g1.py で数値確認〔出題実績: R4 1-5、R6 1-3〕"},
{"f":"基礎:設計・計画","q":"円形断面の片持ばりの自由端に集中荷重を加える。ばりの長さ、荷重、材料を変えずに断面の直径だけを1.5倍にしたとき、固定端の最大曲げ応力と自由端のたわみは、もとの何倍になるか。最も適切な組合せを選べ。","h":"円形断面の断面係数は直径の3乗、断面二次モーメントは直径の4乗に比例します。","c":["最大曲げ応力：約0.44倍、たわみ：約0.67倍","最大曲げ応力：約0.44倍、たわみ：約0.30倍","最大曲げ応力：約0.30倍、たわみ：約0.20倍","最大曲げ応力：約0.67倍、たわみ：約0.44倍"],"a":2,"v":"calc","n":"最大曲げ応力は M/Z で Z∝d³ なので 1/1.5³＝<b>約0.30倍</b>、たわみは PL³/(3EI) で I∝d⁴ なので 1/1.5⁴＝<b>約0.20倍</b>。<br>(0.44, 0.67) は応力を d²（断面積）、たわみを d に反比例とした組、(0.44, 0.30) は両方のべきを1つずつ小さく見積もった組、(0.67, 0.44) は d と d² に反比例とした組。いずれも円形断面の Z と I のべき（d³ と d⁴）の取り違え。<br><br>【出典】検算: 円形断面 Z＝πd³/32、I＝πd⁴/64、片持ばりの先端たわみ δ＝PL³/(3EI)（材料力学の教科書）。verify_g1.py で数値確認〔出題実績: R4 1-5、R6 1-3〕"},
{"f":"基礎:設計・計画","q":"ある工場は製品 A と製品 B を生産する。A は 1 個あたり利益 5 万円、B は 1 個あたり利益 6 万円である。A は原料 3 kg と加工時間 2 時間、B は原料 2 kg と加工時間 4 時間を要する。使える原料は合計 120 kg、加工時間は合計 128 時間までで、生産量は非負の実数とする。利益を最大にしたときの利益として最も適切なものはどれか。","h":"実行可能領域の頂点（A のみ・B のみ・両制約が同時に効く点）で、利益を比べます。","c":["200万円","192万円","320万円","248万円"],"a":3,"v":"calc","n":"制約は 3x＋2y≦120（原料）、2x＋4y≦128（時間）。頂点は (0,0)、(40,0)、(0,32)、両制約の交点 (28,18)。利益 5x＋6y は 0、200、192、<b>248（交点）</b>。最大は<b>248万円</b>。<br>200万円は A だけを原料の上限まで作った値、192万円は B だけを時間の上限まで作った値で、いずれも交点を調べていない。320万円は加工時間の制約だけを見て A を 64 個作った値で、原料の制約（3×64＝192 kg＞120 kg）を満たさない。<br><br>【出典】検算: 線形計画の最適解は実行可能領域の頂点にある（線形計画法の基本定理）。verify_g1.py で格子探索と頂点計算の両方で確認〔出題実績: R2 1-4、R6 1-5〕"},
{"f":"基礎:設計・計画","q":"製品 A（1個あたり原料 3 kg、加工時間 2 時間）と製品 B（1個あたり原料 2 kg、加工時間 4 時間）を生産する。使える原料は合計 120 kg、加工時間は合計 128 時間までで、B の利益は 1 個あたり 6 万円に固定されている。A の 1 個あたりの利益 cA が 5 万円のとき、利益を最大にする計画は A を 28 個、B を 18 個である。この計画が最適のまま変わらない cA の範囲として最も適切なものはどれか。","h":"利益の等高線の傾きが、原料制約の傾きと時間制約の傾きの間にあれば、交点が最適のままです。","c":["4万円以上 12万円以下","3万円以上（上限なし）","0万円以上 9万円以下","3万円以上 9万円以下"],"a":3,"v":"calc","n":"原料制約の傾きは A:B＝3:2、時間制約は 2:4。交点が最適であり続ける条件は、利益比 cA/cB が 2/4 以上 3/2 以下。cB＝6 なので <b>3≦cA≦9</b>（cA＝3 で (0,32)、cA＝9 で (40,0) も同じ利益になる境目）。<br>4〜12 万円は比を逆さにした（cB/cA を 2/4〜3/2 と比べた）値。「3 万円以上」は原料制約側の上限を見落とした範囲、「0 万円以上 9 万円以下」は時間制約側の下限を見落とした範囲。<br><br>【出典】検算: 目的関数の傾きが交点を挟む2制約の傾きの間にある範囲で最適解が不変（感度分析、OR の教科書）。verify_g1.py で頂点評価により確認〔出題実績: R2 1-4、R6 1-5〕"},
{"f":"基礎:設計・計画","q":"ある部品の安全率を s（s＞0）とする。製造コストは 2s（百万円）、破損による期待損失は 27/s²（百万円）で表され、総コストは両者の和である。総コストを最小にする安全率 s として最も適切なものはどれか。","h":"総コストを s で微分して 0 とおきます。27/s² の微分は −54/s³ です。","c":["2.4","3.7","3.0","5.2"],"a":2,"v":"calc","n":"総コスト C(s)＝2s＋27/s²。C'(s)＝2－54/s³＝0 より s³＝27、<b>s＝3.0</b>（このとき C＝9 百万円で最小）。<br>2.4 は 27/s² の微分で係数 2 を落とし（−27/s³ として）s³＝13.5 とした値。3.7 は損失項を 27/s の形と見て s²＝13.5 とした値（べきの取り違え）。5.2 は s³ でなく s²＝27 を解いた値（3乗根と平方根の取り違え）。<br><br>【出典】検算: 1変数関数の極値（C'(s)＝0）と二階微分の符号、数値による周辺確認（微分積分の教科書）。verify_g1.py で数値確認〔出題実績: R1再 1-5、R4 1-4〕"},
{"f":"基礎:設計・計画","q":"ある機器の安全率 s を決める。安全率 s を、1.2、1.4、1.6、1.8、2.0 から選べるとして、製造コストは順に 100、112、127、145、168（万円）、破損する確率は順に 0.10、0.04、0.015、0.006、0.002 である。破損したときの損失額は 1000 万円で、総コストは製造コストと期待損失（破損確率×損失額）の和とする。総コストが最小となる安全率として最も適切なものはどれか。","h":"各安全率について、製造コストに「確率×1000万円」を足して比べます。","c":["1.2","1.8","1.6","2.0"],"a":2,"v":"calc","n":"総コスト（万円）＝製造コスト＋1000×確率。s＝1.2：100＋100＝200、1.4：112＋40＝152、<b>1.6：127＋15＝142（最小）</b>、1.8：145＋6＝151、2.0：168＋2＝170。<br>1.2 は製造コストだけが最小、2.0 は破損確率だけが最小の案で、どちらか一方の項しか見ていない。1.8 は 142 に近い次点で、期待損失の計算で桁を誤ると選んでしまう。<br><br>【出典】検算: 総コスト＝製造コスト＋期待損失の表計算（信頼性・安全工学の考え方）。verify_g1.py で数値確認〔出題実績: R1再 1-5、R4 1-4〕"},
{"f":"基礎:設計・計画","q":"機械製図で投影図を第三角法で配置するとき、正面図に対する他の投影図の位置として最も適切なものはどれか。","h":"第三角法では、見た側（上から見た図は上、右から見た図は右）にその図が置かれます。","c":["平面図は正面図の下側、右側面図は正面図の左側に置く","平面図は正面図の上側、右側面図は正面図の左側に置く","平面図は正面図の下側、右側面図は正面図の右側に置く","平面図は正面図の上側、右側面図は正面図の右側に置く"],"a":3,"v":"primary","n":"<b>第三角法：平面図は上側、下面図は下側、左側面図は左側、右側面図は右側</b>に置く（B 0001 の 8.3）。<br>「平面図は下側、右側面図は左側」は第一角法の配置。残りの2つは、平面図と右側面図の一方だけを第一角法の位置にした混合の配置。<br><br>【出典】JIS B 0001:2019 機械製図 8.1〜8.4（kikakurui.com/b0/B0001-2019-01.html で本文確認 2026-10-04）、JIS Z 8315-2:1999 5.1〜5.2（kikakurui.com/z8/Z8315-2-1999-01.html で本文確認 2026-10-04）〔出題実績: R2 1-5、R3 1-6〕"},
{"f":"基礎:設計・計画","q":"JIS B 0001:2019（機械製図）の投影法の規定として最も適切なものはどれか。","h":"原則はどちらか一方の角法に決まっていて、例外的に別の方法も認められます。","c":["投影図は第一角法による。配置が困難な場合などには、第三角法又は矢示法を用いてもよい","投影図は第三角法による。配置が困難な場合などには、第一角法又は矢示法を用いてもよい","投影図は第三角法に限る。第一角法及び矢示法は、いかなる場合にも用いてはならない","第一角法と第三角法のどちらを用いてもよく、原則とする方法は定められていない"],"a":1,"v":"primary","n":"<b>8.1：投影図は第三角法による。ただし、正しい配置に描けない場合、又は図の一部を第三角法の位置に描くとかえって分かりにくくなる場合には、第一角法又は矢示法を用いてもよい</b>。<br>第一角法を原則とする記述は原則と例外の入れ替え。例外を一切認めない記述と、原則を定めない記述も、規定と食い違う。<br><br>【出典】JIS B 0001:2019 機械製図 8.1〜8.4（kikakurui.com/b0/B0001-2019-01.html で本文確認 2026-10-04）、JIS Z 8315-2:1999 5.1〜5.2（kikakurui.com/z8/Z8315-2-1999-01.html で本文確認 2026-10-04）〔出題実績: R2 1-5、R3 1-6〕"},
{"f":"基礎:設計・計画","q":"等方弾性体が平面ひずみ状態にある（厚さ方向 z のひずみ εz＝0）。面内の垂直応力が σx＝100 MPa、σy＝50 MPa、ポアソン比が ν＝0.3 のとき、厚さ方向の垂直応力 σz として最も適切なものはどれか。","h":"εz＝0 の条件から、フックの法則で σz を面内の応力で表します。","c":["45 MPa","0 MPa","150 MPa","30 MPa"],"a":0,"v":"calc","n":"εz＝[σz－ν(σx＋σy)]/E＝0 より <b>σz＝ν(σx＋σy)＝0.3×150＝45 MPa</b>。<br>0 MPa は平面応力（σz＝0）の値で、平面ひずみとの取り違え。150 MPa は ν を掛け忘れて σx＋σy をそのまま用いた値。30 MPa は ν×σx だけを使い、σy を落とした値。<br><br>【出典】検算: 3次元のフックの法則 εz＝[σz－ν(σx＋σy)]/E で εz＝0（弾性論の教科書）。verify_g1.py で数値確認〔出題実績: R7 1-4〕"},
{"f":"基礎:設計・計画","q":"窓口が1つ、到着が平均 0.75 人/分のポアソン到着、サービス時間が平均 1 分の指数分布（サービス率 1 人/分）の待ち行列（M/M/1）がある。窓口に着いてからサービスが終わるまでの平均時間（系内の平均滞在時間）として最も適切なものはどれか。","h":"M/M/1 の系内平均滞在時間は、サービス率と到着率の差の逆数です。","c":["4分","3分","1分","約1.3分"],"a":0,"v":"calc","n":"M/M/1 の平均滞在時間 <b>W＝1/(μ－λ)＝1/(1－0.75)＝4分</b>（利用率 ρ＝0.75）。<br>3分は待ち時間だけ（Wq＝ρ/(μ－λ)）で、サービス時間を含めていない。1分は平均サービス時間 1/μ だけ。約1.3分は平均到着間隔 1/λ で、混雑による待ちの効果を考えていない。<br><br>【出典】検算: M/M/1 の W＝1/(μ－λ)、Wq＝ρ/(μ－λ)（待ち行列理論の教科書）。verify_g1.py で数値確認〔出題実績: R7 1-5〕"},
{"f":"基礎:設計・計画","q":"母標準偏差が既知で σ＝10 の正規母集団から、無作為に n＝100 個を抽出したところ、標本平均は 50.0 であった。母平均の95％信頼区間として最も適切なものはどれか。標準正規分布の両側95％点は 1.96、両側90％点は 1.645 とする。","h":"信頼区間の半幅は、係数×σ÷√n です。","c":["30.4 以上 69.6 以下","49.80 以上 50.20 以下","48.36 以上 51.64 以下","48.04 以上 51.96 以下"],"a":3,"v":"calc","n":"標本平均の標準誤差＝σ/√n＝10/10＝1。半幅＝1.96×1＝1.96。<b>95％信頼区間＝50.0±1.96＝48.04〜51.96</b>。<br>30.4〜69.6 は標準誤差でなく σ をそのまま用いた値（√n で割り忘れ）。49.80〜50.20 は √n でなく n で割った値（√ の付け忘れ）。48.36〜51.64 は 90％の係数 1.645 を使った値（信頼水準の取り違え）。<br><br>【出典】検算: 母分散既知のときの母平均の信頼区間 x̄±z·σ/√n（統計学の教科書）。verify_g1.py で数値確認〔出題実績: R7 1-6〕"},
{"f":"基礎:設計・計画","q":"歯数 20 の駆動歯車（入力軸）と歯数 50 の被動歯車（出力軸）がかみ合っている。入力軸のトルクが 9.0 N·m、歯車対の伝達効率が 0.90 のとき、出力軸のトルクとして最も適切なものはどれか。","h":"減速すると回転数が下がる分、トルクは歯数比に応じて増え、損失の分だけ目減りします。","c":["22.5 N·m","25.0 N·m","約3.24 N·m","約20.3 N·m"],"a":3,"v":"calc","n":"減速比＝50/20＝2.5。出力トルク＝入力トルク×減速比×効率＝9.0×2.5×0.90＝<b>約20.3 N·m</b>（20.25）。<br>22.5 N·m は効率 0.90 を考えない値。25.0 N·m は効率で掛けず割った値（損失を出力の増加と見た向きの誤り）。約3.24 N·m は減速比で割った値（トルクと回転数の関係の逆転）。<br><br>【出典】検算: 動力＝トルク×角速度の保存と歯数比、出力トルク＝入力トルク×歯数比×効率（機械要素の教科書）。verify_g1.py で数値確認〔出題実績: R6 1-4〕"},
{"f":"基礎:設計・計画","q":"JIS Z 8115:2019（ディペンダビリティ用語）で定義される「フェールセーフ」の説明として最も適切なものはどれか。","h":"故障したときに危険側へ向かわず、安全側に倒れる性質を表す用語です。","c":["人為的に不適切な行為や過失が起きても、システムの信頼性と安全性を保つ性質","故障状態でも、本質的でない機能を縮退させつつ、基本的な要求機能を果たし続ける性質","故障が起きたときに、安全を保つことができるシステムの性質","一部の構成品が故障しても、システム全体は故障とならない性質"],"a":2,"v":"primary","n":"<b>フェールセーフは「故障時に、安全を保つことができるシステムの性質」</b>（安全に関する条件は用途ごとに定める）。<br>「人為的に不適切な行為や過失が起きても信頼性と安全性を保つ」はフールプルーフの定義。「本質的でない機能を縮退させつつ基本的な要求機能を果たし続ける」はフェールソフトの定義。「一部が故障してもシステムは故障とならない」は冗長性の定義で、いずれも安全側に倒れることを求める用語ではない。<br><br>【出典】JIS Z 8115:2019 ディペンダビリティ（総合信頼性）用語（jis.eomec.com の本文で確認 2026-10-04） フェールセーフ、フールプルーフ、フェールソフト、冗長の各定義〔出題実績: R5 1-5〕"},
{"f":"基礎:設計・計画","q":"同じ長さの棒に同じ大きさの引張荷重を加えるとき、断面積を引張強さまで使い切る寸法とすると、材料費は（価格×密度÷引張強さ）に比例する。次の4材料から材料費が最も小さくなるものを選べ。<br>構造用炭素鋼：引張強さ 400 MPa、密度 7.8 g/cm³、価格 200 円/kg<br>アルミニウム合金：300 MPa、2.7 g/cm³、300 円/kg<br>チタン合金：900 MPa、4.5 g/cm³、1500 円/kg<br>炭素繊維強化プラスチック（CFRP）：1500 MPa、1.6 g/cm³、3000 円/kg<br>安全率、座屈、加工費は考えない。","h":"各材料について 価格×密度÷引張強さ を計算して比べます。","c":["構造用炭素鋼","アルミニウム合金","チタン合金","炭素繊維強化プラスチック（CFRP）"],"a":1,"v":"calc","n":"価格×密度÷引張強さを求める。構造用炭素鋼＝200×7.8/400＝3.90、<b>アルミニウム合金＝300×2.7/300＝2.70</b>、チタン合金＝1500×4.5/900＝7.50、CFRP＝3000×1.6/1500＝3.20。最小はアルミニウム合金。<br>構造用炭素鋼は単価が最も安く、価格だけで選んだ場合の結論。ただし強度が低く密度も大きいので、必要な質量が多く材料費はアルミニウム合金より大きい。チタン合金は金属の中で強度が最大であることだけを見た選び方で、単価が高く材料費は最大になる。CFRP は比強度（強度÷密度）が最大だが、単価が高く材料費ではアルミニウム合金に及ばない。比強度の高さと費用の小ささは別の指標。<br><br>【出典】検算: 必要断面積＝荷重/引張強さ、質量＝密度×断面積×長さ、材料費＝単価×質量（材料力学・材料選定の教科書）。verify_g1.py で数値確認〔出題実績: R5 1-1〕"},
{"f":"基礎:設計・計画","q":"5組のデータ (x, y) が (1, 2)、(2, 4)、(3, 5)、(4, 7)、(5, 7) であるとき、x と y の相関係数として最も適切なものはどれか。","h":"相関係数は、共分散を x と y の標準偏差の積で割った値で、−1 以上 1 以下になります。","c":["約0.97","約0.94","1.3","約0.72"],"a":0,"v":"calc","n":"平均は x̄＝3、ȳ＝5。偏差積和 Sxy＝13、偏差平方和 Sxx＝10、Syy＝18。<b>相関係数 r＝Sxy/√(Sxx·Syy)＝13/√180≒0.97</b>。<br>約0.94 は r を2乗した決定係数（r²）。1.3 は Sxy/Sxx＝回帰直線の傾きで、相関係数は 1 を超えない。約0.72 は Syy だけで割った値（標準偏差の積にしていない）。<br><br>【出典】検算: ピアソンの積率相関係数 r＝Sxy/√(SxxSyy)（統計学の教科書）。verify_g1.py で数値確認〔出題実績: R5 1-6〕"},
{"f":"基礎:設計・計画","q":"ある新製品を発売すると、成功すれば 500 万円の利益、失敗すれば 120 万円の損失となる。成功確率は 0.3 である。発売前に市場調査を行えば、成功か失敗かが確実に分かり、失敗と分かった場合は発売を取りやめて損益をゼロにできる。期待値で判断するとき、この調査に支払ってよい費用の上限として最も適切なものはどれか。","h":"調査なしの期待値と、調査して分かった後に選ぶ場合の期待値を比べます。","c":["150万円","66万円","84万円","120万円"],"a":2,"v":"calc","n":"調査なしで発売する期待利益＝0.3×500−0.7×120＝66 万円。調査すれば成功時だけ発売でき、期待利益＝0.3×500＝150 万円。差の<b>150−66＝84 万円</b>が、情報の価値（調査費の上限）。失敗の期待損失 0.7×120＝84 万円を避けられる額とも一致する。<br>150 万円は調査後の期待利益そのもので、調査なしの 66 万円を差し引いていない。66 万円は調査をしない場合の期待利益で、情報の価値ではない。120 万円は失敗時の損失額を、失敗確率 0.7 を掛けずに使った値。<br><br>【出典】検算: 完全情報の期待価値＝完全情報のもとでの期待利益−情報なしの最大期待利益（意思決定論の教科書）。verify_g1.py で数値確認〔出題実績: R4 1-6〕"},
{"f":"基礎:設計・計画","q":"ある機械で発生する微小な欠陥の数は、1 時間あたりの平均が 1.5 個のポアソン分布に従うとする。1 時間にちょうど 2 個発生する確率として最も適切なものはどれか。e^(−1.5)＝0.2231 とする。","h":"ポアソン分布の確率は、平均^k × e^(−平均) ÷ k! です。","c":["約0.251","約0.223","約0.335","約0.502"],"a":0,"v":"calc","n":"P(X＝2)＝1.5²/2!×e^(−1.5)＝2.25/2×0.2231≒<b>0.251</b>。<br>約0.223 は 0 個の確率 e^(−1.5)。約0.335 は 1 個の確率 1.5×e^(−1.5)。約0.502 は階乗 2! で割り忘れて 1.5²×e^(−1.5) とした値（確率が 1/2 の 0.251 に対し 2 倍）。<br><br>【出典】検算: ポアソン分布 P(X＝k)＝λ^k e^(−λ)/k!（確率論の教科書）。verify_g1.py で数値確認〔出題実績: R4 1-2〕"},
{"f":"基礎:設計・計画","q":"ある装置の平均故障間動作時間（MTBF）は 400 時間、平均修復時間（MTTR）は 50 時間である。この装置を2台並列に接続し、どちらか1台が動作していればシステムは稼働しているものとする。2台の故障と修理は互いに独立であるとき、システムの稼働率として最も適切なものはどれか。","h":"1台の稼働率は MTBF÷（MTBF＋MTTR）で、並列は両方が止まっている確率を引きます。","c":["約0.889","約0.790","約0.012","約0.988"],"a":3,"v":"calc","n":"1台の稼働率 A＝400/(400+50)≒0.889。並列系は両方が停止している確率 (1−A)²＝0.0123 を 1 から引き、<b>1−0.0123≒0.988</b>。<br>約0.889 は1台の稼働率で、冗長化の効果を見ていない。約0.790 は A² で、直列系（両方が動作していることが必要）の稼働率。約0.012 は両方が停止している確率（不稼働率）を答えにした値。<br><br>【出典】検算: 稼働率 A＝MTBF/(MTBF+MTTR)、並列系の稼働率＝1−(1−A)²（信頼性工学の教科書）。verify_g1.py で数値確認〔出題実績: R3 1-4〕"},
{"f":"基礎:設計・計画","q":"故障の木解析（FTA）で、頂上事象は「部品 X が故障し、かつ部品 Y が故障する」または「部品 Z が故障する」のいずれかが成り立つとき発生する。X、Y、Z の故障は互いに独立で、故障確率はそれぞれ 0.3、0.5、0.2 である。頂上事象の発生確率として最も適切なものはどれか。","h":"「かつ」は確率の積、「または」は余事象の積を使って求めます。","c":["0.35","0.13","0.72","0.32"],"a":3,"v":"calc","n":"「X かつ Y」＝0.3×0.5＝0.15。これと Z の「または」＝1−(1−0.15)(1−0.2)＝1−0.85×0.8＝<b>0.32</b>。<br>0.35 は「または」を確率の和 0.15＋0.2 にした値（重なりを二重に数えている）。0.13 は「または」と「かつ」を逆にして (X または Y) かつ Z とした値。0.72 は全てを「または」で結んだ値。<br><br>【出典】検算: 独立事象の AND＝積、OR＝1−Π(1−p)（信頼性工学の教科書）。verify_g1.py で数値確認〔出題実績: R1再 1-3〕"},
{"f":"基礎:設計・計画","q":"あるプロジェクトの作業と所要日数、先行作業は次のとおりである。A（3日、先行なし）、B（5日、先行 A）、C（4日、先行 A）、D（6日、先行 B）、E（2日、先行 C）、F（3日、先行 D と E）。全体の最短所要日数を延ばさずに作業 C を遅らせられる日数（総余裕）として最も適切なものはどれか。","h":"最長経路（クリティカルパス）の日数と、C を通る経路の日数の差が総余裕です。","c":["5日","17日","12日","4日"],"a":0,"v":"calc","n":"経路は A→B→D→F＝3+5+6+3＝17日と、A→C→E→F＝3+4+2+3＝12日。最長の 17日がクリティカルパスで全体の所要日数。C を通る経路は 12日なので、<b>総余裕＝17−12＝5日</b>。<br>17日は全体の最短所要日数で、余裕ではない。12日は C を通る経路の長さ。4日は C 自身の所要日数で、経路全体の余裕とは別。<br><br>【出典】検算: PERT/CPM の最早・最遅時刻の計算、総余裕＝最遅開始−最早開始（プロジェクト管理の教科書）。verify_g1.py で数値確認〔出題実績: R1再 1-4〕"},
{"f":"基礎:設計・計画","q":"x が正の実数のとき、3x＋12/x の最小値として最も適切なものはどれか。","h":"和の最小値は、積が一定になる2項に相加平均と相乗平均の関係を使って求めます。","c":["12","2","15","36"],"a":0,"v":"calc","n":"相加平均≧相乗平均より 3x＋12/x ≧ 2√(3x×12/x)＝2√36＝<b>12</b>。等号は 3x＝12/x、すなわち x＝2 のとき成立する。<br>2 は最小値を与える x の値で、最小値そのものではない。15 は x＝1 を代入した値で、最小とは限らない。36 は2項の積を最小値とした値で、平方根と係数 2 の処理がない。<br><br>【出典】検算: 相加相乗平均の不等式 a＋b≧2√(ab)（a, b>0）、等号は a＝b（高校数学）。verify_g1.py で数値確認〔出題実績: R1再 1-1〕"},

{"f":"基礎:情報・論理","q":"16進数 3A7 を8進数で表したものはどれか。","h":"16進数の1桁は2進数の4桁、8進数の1桁は2進数の3桁に対応するので、いったん2進数にして区切り直す。","c":["427","1667","7231","1647"],"a":3,"v":"calc","n":"<b>正解は1647</b>。3A7 = 0011 1010 0111（2進）= 1110100111。最下位から3桁ずつ区切ると 001 110 100 111 → 1 6 4 7。10進では 3×256+10×16+7=935=1647（8進）。<br>誤答の出どころ: 1667 は A を11として計算した場合（951）、7231 は2進数を最上位から3桁ずつ区切った場合（111,010,011,1）、427 は16進の桁の重みを 8^k として計算した場合（3×64+10×8+7=279）。<br><br>【出典】検算: 基数変換（2進を介した区切り直し）。python で int(…,16) と oct() により照合。〔出題実績: R2 2-5、R4 2-5、R6 2-1（基数変換）〕"},
{"f":"基礎:情報・論理","q":"ユークリッドの互除法で 1547 と 560 の最大公約数を求める。「大きい方を小さい方で割った余りで大きい方を置き換える」操作を、余りが0になる割り算まで含めて繰り返す。割り算の回数と最大公約数の組合せとして正しいものはどれか。","h":"各回の余りを順に書き出し、0の1つ前の余りが最大公約数になる。","c":["5回、最大公約数7","6回、最大公約数7","4回、最大公約数21","3回、最大公約数28"],"a":1,"v":"calc","n":"<b>正解は6回、最大公約数7</b>。1547=2×560+427、560=1×427+133、427=3×133+28、133=4×28+21、28=1×21+7、21=3×7+0。余りは 427,133,28,21,7,0 で6回目に0になり、直前の余り7が最大公約数。<br>誤答の出どころ: 「5回、7」は余り0の割り算を数え忘れた場合、「4回、21」「3回、28」は余りが0になる前に止めて、その時点の余りを答えにした場合。<br><br>【出典】検算: gcd(a,b)=gcd(b, a mod b)（ユークリッドの互除法の原理）。python で余り列と回数を算出。〔出題実績: R1再 2-2、R5 2-2、R6 2-5〕"},
{"f":"基礎:情報・論理","q":"自然数 117, 45 の最大公約数を g とする。117x + 45y = g を満たす整数の組 (x, y) として正しいものはどれか。","h":"互除法の各回の等式を、余り＝（割られる数）−商×（割る数）の形に直して、最後の式から逆にたどる。","c":["x=-2, y=5","x=5, y=-2","x=2, y=-5","x=2, y=5"],"a":2,"v":"calc","n":"<b>正解は x=2, y=-5</b>。117=2×45+27、45=1×27+18、27=1×18+9、18=2×9+0 より g=9。逆にたどると 9=27−18=27−(45−27)=2×27−45=2×(117−2×45)−45=2×117−5×45。実際 117×2+45×(−5)=234−225=9。<br>誤答の出どころ: (−2, 5) は符号を逆にした場合で −9 になる、(5, −2) は x と y を入れ替えた場合で 495 になる、(2, 5) は係数の符号の処理を落とした場合で 459 になる。<br><br>【出典】検算: 拡張ユークリッド互除法（ベズーの等式 ax+by=gcd(a,b)）。python で全選択肢を代入して確認。〔出題実績: R1再 2-2、R5 2-2、R6 2-5〕"},
{"f":"基礎:情報・論理","q":"自然数 a, b（a≧b>0）の最大公約数を求める次の手順がある。<br>(1) イ の間、(2)〜(4) を繰り返す。<br>(2) r ← a を b で割った余り<br>(3) a ← ア<br>(4) b ← r<br>(5) ウ を出力する。<br>空欄 ア, イ, ウ に入る組合せとして、a=1547, b=560 のとき正しく最大公約数を出力するものはどれか。","h":"繰り返しの終了は「割る数が0になったとき」で、そのとき最大公約数は直前の割る数が持っている。","c":["ア=b、イ=b≠0、ウ=a","ア=b、イ=b≠0、ウ=b","ア=r、イ=b≠0、ウ=a","ア=b、イ=b=0、ウ=a"],"a":0,"v":"calc","n":"<b>正解は ア=b、イ=b≠0、ウ=a</b>。(a,b)→(b, a mod b) と置き換えて b が0になるまで繰り返すと、a に最大公約数が残る（1547,560 では 7）。<br>誤答の出どころ: ウ=b だと終了時の b は常に0を出力する。ア=r だと a と b がともに r になり、次の回で余りが0、最後は a=0 を出力する。イ=「b=0」だと最初から繰り返しに入らず、入力の1547をそのまま出力する。<br><br>【出典】検算: 互除法の原理 gcd(a,b)=gcd(b, a mod b)。python で4通りの手順を実際に実行し、正解のみが 7 を出力することを確認。〔出題実績: R5 2-2（流れ図の穴埋め）〕"},
{"f":"基礎:情報・論理","q":"ある文書集合（全500件）で、キーワードXを含む文書が320件、キーワードYを含む文書が270件ある。XとYの両方を含む文書の件数を k とするとき、k のとりうる範囲として正しいものはどれか。","h":"和集合の件数は全体の500件を超えられないことと、共通部分は小さい方の集合を超えられないことを使う。","c":["0≦k≦270","90≦k≦270","90≦k≦320","180≦k≦270"],"a":1,"v":"calc","n":"<b>正解は 90≦k≦270</b>。包除原理より |X∪Y|=320+270−k=590−k。これが全体500以下なので k≧90。また k は小さい方の集合の件数270以下。<br>誤答の出どころ: 0≦k≦270 は和集合が全体を超えられないという下限を見落とした場合、90≦k≦320 は上限を大きい方の集合の件数にした場合、180≦k≦270 は下限を 500−320 としてしまった場合。<br><br>【出典】検算: 包除原理 |A∪B|=|A|+|B|−|A∩B|。python で k=0〜320 を全探索し、条件を満たす k の範囲が 90〜270 であることを確認。〔出題実績: R1再 2-5、R4 2-2、R5 2-6〕"},
{"f":"基礎:情報・論理","q":"200人にA, B, Cの3つの質問へ「はい」か「いいえ」で答えてもらった。Aに「はい」が90人、Bに「はい」が80人、Cに「はい」が70人、AとBの両方に「はい」が30人、BとCの両方が25人、AとCの両方が20人、3つ全てに「はい」が10人であった。3つのどれにも「はい」と答えなかった人数はどれか。","h":"少なくとも1つに「はい」の人数を3集合の包除原理で求め、全体から引く。","c":["15人","35人","175人","25人"],"a":3,"v":"calc","n":"<b>正解は25人</b>。少なくとも1つに「はい」は 90+80+70−30−25−20+10=175人。200−175=25人。<br>誤答の出どころ: 35人は最後の＋10（3重の共通部分）を足し忘れた場合（165人を引く）、15人は3重の共通部分を引いてしまった場合（185人を引く）、175人は問われている補集合ではなく和集合の人数をそのまま答えた場合。<br><br>【出典】検算: 3集合の包除原理 |A∪B∪C|=ΣA−Σ(A∩B)+|A∩B∩C|、補集合は全体から引く。python で計算。〔出題実績: R1再 2-5、R4 2-2、R5 2-6〕"},
{"f":"基礎:情報・論理","q":"100人に英語・数学・理科の履修状況を調べた。英語を履修している者が60人、数学が50人、理科が40人、英語と数学の両方が25人、数学と理科の両方が20人、英語と理科の両方が15人、どの科目も履修していない者が5人であった。ちょうど2科目だけを履修している者の人数はどれか。","h":"まず3科目すべてを履修している人数 x を、包除原理と「どれも履修しない5人」から求める。","c":["45人","60人","50人","55人"],"a":0,"v":"calc","n":"<b>正解は45人</b>。少なくとも1科目は100−5=95人。95=60+50+40−25−20−15+x より x=5人。2科目の両方に入る人数の合計60には、3科目の者が3回ずつ数えられているので、ちょうど2科目は 60−3×5=45人。<br>誤答の出どころ: 60人は両方の人数の合計をそのまま答えた場合、50人は3科目の者を2回分しか引かなかった場合（60−2×5）、55人は1回分しか引かなかった場合（60−5）。<br><br>【出典】検算: 包除原理（3集合）と「ちょうどk個」の人数の数え方。python で各領域の人数を計算し合計が100になることを確認。〔出題実績: R1再 2-5、R4 2-2、R5 2-6〕"},
{"f":"基礎:情報・論理","q":"標的型攻撃への対策に関する次の記述のうち、最も不適切なものはどれか。","h":"侵入を100%防げるという前提に立っている記述を探す。","c":["脅威はできるだけ上流で食い止めるため、技術的対策に加えて、標的型メールの取扱い規則を組織として定めて周知する。","ウイルス対策ソフトとファイアウォールによる入口対策を十分に整備すれば、侵入を阻止できるので、出口対策や通信の監視は不要と判断してよい。","入口対策をすり抜けた場合に備え、組織内ネットワークの通信量を監視し、外部への通信をプロキシ経由に限るなどして、攻撃活動の抑止と早期発見を図る。","知的財産などを扱う重要なサーバーはインターネットから隔離し、アクセス制御と暗号化によって、最後の砦として保護を強化する。"],"a":1,"v":"primary","n":"<b>正解は「入口対策を整備すれば出口対策や監視は不要」とする記述</b>。IPAの資料は、対策の考え方として「一つの対策だけでなく、多層の防御が重要」とし、侵入を阻止できなかったときの攻撃活動の抑止・被害の極小化、最後の砦となる情報の保護の強化、システム全体の監視と証跡の分析を挙げている。出口対策は「入口対策をすり抜けた場合においても、攻撃者に情報を窃取させない」ための対策と定義されている。<br>他の3つは同資料の考え方（上流で食い止める・取扱い規則、ウイルス活動の阻害と通信量の監視・プロキシ経由、重要サーバーの隔離と暗号化）に沿った適切な記述。<br><br>【出典】IPA「標的型攻撃／新しいタイプの攻撃の実態と対策」（IPA技術本部セキュリティセンター、2011年）スライド28〜30・出口対策の節 https://www.ipa.go.jp/security/j-csip/ug65p9000000nkvm-att/000024542.pdf（確認日 2026-10-04）〔出題実績: R2 2-3、R7 2-4〕"},
{"f":"基礎:情報・論理","q":"IPAの資料は、標的型攻撃メールを起点とする攻撃を、初期潜入段階、攻撃基盤構築段階、システム調査段階、攻撃最終目的の遂行段階の4段階で説明している。このうち「システム調査段階」で行われる内容として最も適切なものはどれか。","h":"4段階は、潜入して足場を作り、中を調べ、最後に目的を果たす順に進むので、「調べる」段階の内容を選ぶ。","c":["標的型攻撃メールの添付ファイルやUSBメモリを介して、ウイルスを組織内の端末に送り込む。","バックドアを通じてウイルスを追加でダウンロードさせ、機能を拡張して攻撃の足場を築く。","組織のシステム内の情報を取得し、重要情報がどこにあるかを特定する。","重要情報を外部へ窃取し、得たアカウント情報などをもとに次の攻撃目標を設定し直す。"],"a":2,"v":"primary","n":"<b>正解は「組織のシステム内の情報を取得し、情報の存在箇所を特定する」</b>。IPAの資料の表では、第3段階（システム調査段階）が「組織のシステムにおける情報の取得」「情報の存在箇所特定」とされ、時間をかけて何度もしつこく行うと説明されている。<br>他の選択肢が属する段階: 添付ウイルスやUSB経由の送り込みは第1段階（初期潜入）、バックドアを使ったウイルスのダウンロードと拡張機能の追加は第2段階（攻撃基盤構築）、重要情報の窃取と目標の再設定は第4段階（攻撃最終目的の遂行）。<br><br>【出典】IPA「標的型攻撃／新しいタイプの攻撃の実態と対策」スライド23の表 https://www.ipa.go.jp/security/j-csip/ug65p9000000nkvm-att/000024542.pdf（確認日 2026-10-04）〔出題実績: R2 2-3、R7 2-4〕"},
{"f":"基礎:情報・論理","q":"通信回線でデータを伝送するのに要する時間は、「伝送時間＝伝送データ量（ビット）÷（データ伝送速度（ビット/秒）×回線利用率）」で求める。1.2Gバイトのデータを元の大きさの40%に圧縮してから、伝送速度100Mbps、回線利用率60%の回線で伝送するとき、伝送時間に最も近い値はどれか。ただし 1Gバイト=10^9バイト、1Mbps=10^6ビット/秒とする。","h":"圧縮後のデータ量をバイトからビットへ換算してから、速度と利用率の積で割る。","c":["8.0秒","96.0秒","64.0秒","38.4秒"],"a":2,"v":"calc","n":"<b>正解は64.0秒</b>。圧縮後のデータ量は 1.2×10^9×0.4=4.8×10^8バイト=3.84×10^9ビット。実効速度は 100×10^6×0.6=6×10^7ビット/秒。3.84×10^9÷(6×10^7)=64秒。<br>誤答の出どころ: 8.0秒はバイトをビットに換算（×8）し忘れた場合、96.0秒は圧縮後を40%でなく60%として計算した場合（利用率と取り違え）、38.4秒は回線利用率を考慮しなかった場合。<br><br>【出典】検算: 問題文に与えた伝送時間の式（R3・R7で出題された式と同形）。python で全誤答を再現。〔出題実績: R3 2-3、R7 2-5〕"},
{"f":"基礎:情報・論理","q":"360Mバイトのデータを元の大きさの8分の5に圧縮してから、伝送速度50Mbpsの回線で伝送したところ、伝送に60秒かかった。この間の回線利用率として最も適切なものはどれか。ただし 1Mバイト=10^6バイト、1Mbps=10^6ビット/秒とし、伝送時間は「伝送データ量（ビット）÷（データ伝送速度×回線利用率）」で求められるものとする。","h":"利用率は、実際に送ったビット数を、その60秒間に送れる最大ビット数で割った値になる。","c":["60%","7.5%","96%","37.5%"],"a":0,"v":"calc","n":"<b>正解は60%</b>。圧縮後は 360×10^6×5/8=2.25×10^8バイト=1.8×10^9ビット。60秒間に送れる最大は 50×10^6×60=3×10^9ビット。1.8×10^9÷(3×10^9)=0.6。<br>誤答の出どころ: 7.5%はバイトをビットに換算し忘れた場合、96%は圧縮を考慮しなかった場合（2.88×10^9÷3×10^9）、37.5%は圧縮比5/8を二重に掛けた場合（0.6×5/8）。<br><br>【出典】検算: 問題文に与えた伝送時間の式を利用率について解いたもの。python で全誤答を再現。〔出題実績: R3 2-3、R7 2-5〕"},
{"f":"基礎:情報・論理","q":"集合 A={a, b, c}、B={1, 2, 3}、C={0, 1} とする。直積集合 A×B から C への写像 f: A×B→C の総数はどれか。","h":"A×B の要素1つ1つについて、行き先を C の中から独立に選べる。","c":["9^2 = 81通り","2×9 = 18通り","2^6 = 64通り","2^9 = 512通り"],"a":3,"v":"calc","n":"<b>正解は 2^9 = 512通り</b>。|A×B|=3×3=9。9個の要素それぞれの行き先を C の2要素から選べるので 2^9=512。一般に写像の総数は |C|^|A×B|。<br>誤答の出どころ: 81は底と指数を入れ替えた場合（9^2）、18は積 2×9 を総数とした場合、64は指数を |A|+|B|=6 とした場合（直積の要素数ではなく和を使用）。<br><br>【出典】検算: 写像の総数 |C|^|定義域|（集合の基本）。python で itertools により小さい例（|A×B|=4）を全列挙して公式を確認し、本問を計算。〔出題実績: R1再 2-6、R7 2-1〕"},
{"f":"基礎:情報・論理","q":"3個の要素をもつ集合 A から、5個の要素をもつ集合 B への写像のうち、単射（A の異なる2要素が B の同じ要素に写らない写像）の総数はどれか。","h":"A の要素を1つずつ順に、すでに使われた B の要素を避けて行き先を決めていく。","c":["5^3 = 125通り","5×4×3 = 60通り","3^5 = 243通り","C(5,3) = 10通り"],"a":1,"v":"calc","n":"<b>正解は 5×4×3 = 60通り</b>。1番目の要素の行き先は5通り、2番目はすでに使われた1つを除いて4通り、3番目は3通りなので 5×4×3=60。<br>誤答の出どころ: 125は単射の条件を無視した写像全体の数（5^3）、243は定義域と値域を入れ替えた場合（3^5）、10は B から3要素を選ぶ組合せの数で、どの要素をどこへ写すかの順序を数えていない。<br><br>【出典】検算: 単射の個数＝順列 P(n,k)=n!/(n−k)!。python で itertools.product による全探索（125通りのうち単射が60通り）。〔出題実績: R1再 2-6、R7 2-1（写像の総数）〕"},
{"f":"基礎:情報・論理","q":"ディジタル署名（電子署名）に関する次の記述のうち、最も適切なものはどれか。","h":"署名を作れるのは本人だけで、確かめるのは誰でもできる、という非対称性に着目する。","c":["署名者と検証者が事前に共有した同じ共通鍵で署名を作り、その共通鍵を持つ者だけが署名を検証できる。","署名者が検証者の公開鍵で署名を作り、検証者だけが自分の秘密鍵で署名を検証できる。","署名の作成にも検証にも署名者の秘密鍵が必要なため、検証者は署名者から秘密鍵の預託を受けておく。","署名者が自分の秘密鍵で署名を作り、対応する公開鍵を入手した者なら誰でも署名を検証できる。"],"a":3,"v":"primary","n":"<b>正解は「署名者が自分の秘密鍵で署名を作り、公開鍵を入手した者なら誰でも検証できる」</b>。NIST FIPS 186-5は、署名の生成には秘密鍵、検証には対応する公開鍵を用い、公開鍵は公開してよく秘密鍵は秘匿する、秘密鍵を持つ者だけが署名を生成でき、誰でも署名者の公開鍵で検証できると定めている。<br>誤答の出どころ: 共通鍵で署名するのはメッセージ認証コード（MAC）の考え方で、第三者が検証できず署名者本人の証明にもならない。検証者の公開鍵で署名する記述は、暗号化（公開鍵で暗号化、秘密鍵で復号）と署名の鍵の使い方を逆にしたもの。秘密鍵を検証者へ預ける記述は、秘密鍵を本人しか持たないという前提を崩す。<br><br>【出典】NIST FIPS 186-5 Digital Signature Standard (DSS)、Explanation 欄 https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.186-5.pdf（確認日 2026-10-04）〔出題実績: R3 2-1、R6 2-6〕"},
{"f":"基礎:情報・論理","q":"ハッシュ関数 SHA-256 に関する次の記述のうち、最も適切なものはどれか。","h":"ハッシュ値は「入力の長さに関係なく固定長」で、「元に戻す」ためのものではない。","c":["入力メッセージの長さにかかわらず出力（メッセージダイジェスト）は256ビットで、入力が少し変わると出力は極めて高い確率で変わる。","出力の長さは入力メッセージの長さに比例して大きくなり、1Gバイトのデータを入力すると約1Gバイトのダイジェストが得られる。","ダイジェストから元のメッセージを効率よく復元できるので、メッセージを秘匿して送る暗号化の代わりに利用できる。","秘密の鍵を使ってダイジェストを計算するので、鍵を知っている者だけが同じメッセージのダイジェストを再計算できる。"],"a":0,"v":"primary","n":"<b>正解は「入力の長さによらず出力は256ビットで、入力が少し変わると出力は極めて高い確率で変わる」</b>。NIST FIPS 180-4 は、SHA-256 などに任意長（2^64ビット未満）のメッセージを入力すると固定長のメッセージダイジェストが出力され、ダイジェスト長は160〜512ビットの範囲でアルゴリズムごとに決まること、メッセージに変更があれば極めて高い確率で異なるダイジェストになることを定めている。SHA-256 のダイジェスト長は256ビット。<br>誤答の出どころ: 入力長に比例する記述は固定長という性質を落としたもの。復元できるとする記述は、同標準が「与えられたダイジェストに対応するメッセージを見つけることは計算量的に困難」としている性質（一方向性）に反する。鍵を使う記述は、鍵付きハッシュ（HMAC）と鍵を持たない通常のハッシュ関数を混同したもの。<br><br>【出典】NIST FIPS 180-4 Secure Hash Standard (SHS)、Explanation 欄 https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.180-4.pdf（確認日 2026-10-04）〔出題実績: R3 2-1、R6 2-6〕"},
{"f":"基礎:情報・論理","q":"長さ5ビットの4つの符号語 00000, 01111, 10110, 11001 からなる符号がある。この符号の最小ハミング距離と、符号語が1つ送られて一部のビットが反転したとき、確実に検出できる反転ビット数の最大値と、最も近い符号語への復号で確実に訂正できる反転ビット数の最大値の組合せとして、正しいものはどれか。","h":"最小距離を d とすると、検出できるのは d−1 ビット、訂正できるのは (d−1)÷2 の整数部分までのビット数。","c":["最小距離4、検出3ビット、訂正1ビット","最小距離3、検出2ビット、訂正1ビット","最小距離3、検出3ビット、訂正1ビット","最小距離3、検出1ビット、訂正1ビット"],"a":1,"v":"calc","n":"<b>正解は最小距離3、検出2ビット、訂正1ビット</b>。符号語どうしの距離は、00000-01111:4、00000-10110:3、00000-11001:3、01111-10110:3、01111-11001:3、10110-11001:4 なので最小は3。検出は d−1=2ビット、訂正は⌊(d−1)/2⌋=1ビット。<br>誤答の出どころ: 最小距離4は一部の組（距離4の組）だけを見て最小を決めた場合。検出3ビットは検出の限界を d として数えた場合（3ビットが反転して別の符号語に変わる可能性がある）。検出1ビットは検出と訂正の限界を同じ値としてしまった場合。<br><br>【出典】検算: 最小ハミング距離 d の符号は d−1 ビットまで検出、⌊(d−1)/2⌋ ビットまで訂正可能（Hamming, 1950, Bell System Technical Journal 29(2) の符号の距離の議論に基づく標準的結果）。python で全ペアの距離を計算。〔出題実績: R4 2-4、R6 2-4〕"},
{"f":"基礎:情報・論理","q":"7ビットの符号語 c1 c2 c3 c4 c5 c6 c7 からなる(7,4)ハミング符号を考える。c1, c2, c4 が検査ビット、c3, c5, c6, c7 がデータビットで、検査ビットは偶数パリティ、すなわち c1 は (c1, c3, c5, c7)、c2 は (c2, c3, c6, c7)、c4 は (c4, c5, c6, c7) の中の1の個数が偶数になるように定められる。受信語 c1 c2 c3 c4 c5 c6 c7 = 0110001 には高々1ビットの誤りがある。誤りを訂正した後のデータビット c3 c5 c6 c7 はどれか。","h":"3つの検査グループそれぞれの1の個数が偶数かどうかを調べ、不成立のグループが共通に含むビットの位置を探す。","c":["1001","0110","1011","0001"],"a":2,"v":"calc","n":"<b>正解は1011</b>。(c1,c3,c5,c7)=(0,1,0,1)は偶数で成立、(c2,c3,c6,c7)=(1,1,0,1)は奇数で不成立、(c4,c5,c6,c7)=(0,0,0,1)は奇数で不成立。不成立は2番目と3番目のグループだけで、両方に含まれ1番目に含まれないのは c6。シンドローム（c4のグループを上位、c1を下位とした2進数）=110₂=6 と一致する。c6 を反転して 0110011、データビットは c3 c5 c6 c7 = 1011。<br>誤答の出どころ: 1001 は訂正せずデータビットを取り出した場合、0110 は先頭の4ビットをそのままデータとした場合、0001 はシンドロームの並びを逆（011₂=3）に読んで c3 を反転してしまった場合。<br><br>【出典】検算: (7,4)ハミング符号のシンドローム復号（Hamming, 1950）。python で全128語から符号語16個を生成し、受信語に最も近い符号語（距離1）を探して照合。〔出題実績: R4 2-4、R6 2-4〕"},
{"f":"基礎:情報・論理","q":"5種類の記号 A〜E が情報源から独立に出力され、出現確率は A:0.40、B:0.30、C:0.15、D:0.10、E:0.05 である。この情報源をハフマン符号で符号化したときの、1記号あたりの平均符号長（ビット）として正しいものはどれか。","h":"確率の小さい2記号を順にまとめていく木を作ると、各記号の符号長が決まる。","c":["3.00ビット","2.80ビット","2.50ビット","2.05ビット"],"a":3,"v":"calc","n":"<b>正解は2.05ビット</b>。確率の小さい順にまとめる: E(0.05)+D(0.10)=0.15、これと C(0.15) で 0.30、これと B(0.30) で 0.60、最後に A(0.40)。符号長は A:1、B:2、C:3、D:4、E:4。平均は 0.40×1+0.30×2+0.15×3+0.10×4+0.05×4=2.05。（エントロピーは約2.009ビットで、平均符号長はそれ以上になる。）<br>誤答の出どころ: 3.00は5種類を固定長3ビットで符号化した場合、2.80は符号長を確率で重み付けせず単純平均した場合（(1+2+3+4+4)÷5）、2.50は各記号の符号長を −log2(確率) の切り上げ（2,2,3,4,5）としてそれを重み付けした場合。<br><br>【出典】検算: ハフマン符号（Huffman, 1952）の構成。python のヒープ実装で符号長と平均を算出。〔出題実績: R2 2-1、R5 2-4〕"},
{"f":"基礎:情報・論理","q":"データ圧縮に関する次の記述のうち、最も適切なものはどれか。","h":"圧縮して元に戻したときにデータが完全に一致するかどうかが、可逆と非可逆の分かれ目。","c":["PNG形式は DEFLATE による可逆圧縮を用いており、伸張すると元の画素値が完全に復元される。","JPEG形式の DCT 方式は、量子化で情報を捨てないため、伸張すると元の画像と完全に一致する。","LZ77 とハフマン符号を組み合わせる DEFLATE は非可逆圧縮のため、文書やプログラムの圧縮には使えない。","ランレングス符号化は、同じ値が連続しない画像ほど、データの大きさが小さくなる。"],"a":0,"v":"primary","n":"<b>正解は「PNGはDEFLATEによる可逆圧縮で、元の画素値が完全に復元される」</b>。W3CのPNG仕様は、PNGを「lossless（可逆）」な画像形式とし、圧縮方式として定義されるのは deflate（zlib形式）のみ、フィルタ処理も可逆と述べている。<br>誤答の出どころ: ITU-T T.81（JPEG）は、DCTに基づく処理は非可逆（lossy）で高い圧縮率を得る代わりに復元画像は元と完全には一致しない、と定めている。DEFLATE は RFC 1951 が「可逆圧縮（lossless）データ形式」と定義しており、文書やプログラムの圧縮にこそ向く。ランレングスは同じ値の連続を（値,長さ）で表すので、連続が少ないほど圧縮効果は小さくなり、逆に膨らむこともある。<br><br>【出典】W3C PNG Specification (Third Edition) https://www.w3.org/TR/png-3/、RFC 1951 DEFLATE 要旨 https://www.rfc-editor.org/rfc/rfc1951、ITU-T T.81 §4.2 https://www.w3.org/Graphics/JPEG/itu-t81.pdf（確認日 2026-10-04。ランレングスの性質のみ教科書的知識）〔出題実績: R2 2-1、R5 2-4〕"},
{"f":"基礎:情報・論理","q":"主記憶の前にキャッシュメモリを置いた計算機で、キャッシュのアクセス時間は10ns、主記憶のアクセス時間は100ns、キャッシュのヒット率は95%である。ヒットしたときはキャッシュだけにアクセスし、ヒットしなかったときはキャッシュにアクセスして失敗を確認したあと主記憶にアクセスするものとする。実効アクセス時間として正しいものはどれか。","h":"ヒット率で重み付けした平均を求め、ヒットしなかったときの所要時間はキャッシュと主記憶の合計とする。","c":["14.5ns","55.0ns","15.0ns","95.5ns"],"a":2,"v":"calc","n":"<b>正解は15.0ns</b>。ヒット時は10ns、ミス時は10+100=110ns。実効アクセス時間=0.95×10+0.05×110=9.5+5.5=15.0ns。<br>誤答の出どころ: 14.5nsはミス時にキャッシュの確認時間を加えず100nsとした場合（0.95×10+0.05×100）、55.0nsはヒット率を無視して両者の平均 (10+100)÷2 を取った場合、95.5nsはヒット率とミス率を入れ替えた場合（0.05×10+0.95×100）。<br><br>【出典】検算: 実効アクセス時間=h×t1+(1−h)×(t1+t2)（ミス時の経路は問題文で明示。計算機アーキテクチャの標準的な式）。python で計算。〔出題実績: R2 2-6、R4 2-3〕"},
{"f":"基礎:情報・論理","q":"主記憶に3ページ分の枠があり、最初は空である。ページ置換アルゴリズムとして LRU（最後に使われてから最も時間が経過したページを追い出す）を用い、ページを 3, 1, 4, 1, 5, 2, 1, 3, 5, 2, 3, 4, 1 の順に参照した。ページフォールト（参照したページが枠に無い）の回数はどれか。","h":"参照のたびに「最近使った順」を更新し、枠が埋まっているときだけ最も古いものを追い出す。","c":["11回","10回","8回","3回"],"a":1,"v":"calc","n":"<b>正解は10回</b>。枠（古い→新しい）の変化: 3→[3]、1→[3,1]、4→[3,1,4]、1:ヒット→[3,4,1]、5:3を追い出し→[4,1,5]、2:4を追い出し→[1,5,2]、1:ヒット→[5,2,1]、3:5を追い出し→[2,1,3]、5:2を追い出し→[1,3,5]、2:1を追い出し→[3,5,2]、3:ヒット→[5,2,3]、4:5を追い出し→[2,3,4]、1:2を追い出し→[3,4,1]。フォールトは13回中10回、ヒットは3回。<br>誤答の出どころ: 11回は FIFO（到着順に追い出す）で数えた場合、8回は将来の参照を知っている最適置換で数えた場合、3回はヒットの回数を答えた場合。<br><br>【出典】検算: LRU 置換（オペレーティングシステムの標準的なページ置換アルゴリズム）。python でLRU・FIFO・最適置換を実装して照合。〔出題実績: R2 2-6、R4 2-3〕"},
{"f":"基礎:情報・論理","q":"3変数 A, B, C の論理関数 F は、(A,B,C)=(0,0,1), (0,1,1), (1,0,0), (1,0,1) のときだけ F=1 で、他の組合せでは F=0 である。F を表す論理式として正しいものはどれか。ただし ¬ は否定、∧ は論理積、∨ は論理和を表す。","h":"A=1 のときと A=0 のときに分け、それぞれ F が B, C のどんな式になっているかを見る。","c":["(A∧¬B)∨(¬A∧C)","(A∧B)∨(¬A∧C)","(A∧¬B)∨(A∧C)","(¬A∧¬B)∨(A∧C)"],"a":0,"v":"calc","n":"<b>正解は (A∧¬B)∨(¬A∧C)</b>。A=1 のとき F=1 になるのは B=0（C は問わない）の (1,0,0),(1,0,1)、A=0 のとき F=1 になるのは C=1（B は問わない）の (0,0,1),(0,1,1)。したがって A=1 では ¬B、A=0 では C を選ぶ形になる。<br>誤答の出どころ: (A∧B) の形は B の否定を落とした場合で (1,1,*) が F=1 になってしまう。(A∧¬B)∨(A∧C) は A=0 の場合の項を落とした場合で (0,*,1) が F=0 になってしまう。(¬A∧¬B)∨(A∧C) は A=0 と A=1 での B, C の使い方を入れ替えた場合。<br><br>【出典】検算: 真理値表と論理式の対応（ブール代数）。python で8通りの全入力について各選択肢を評価し、正解のみが表と一致することを確認。〔出題実績: R2 2-2、R3 2-2〕"},
{"f":"基礎:情報・論理","q":"論理式 ¬((A∨¬B)∧C) と常に等しい論理式はどれか。ただし ¬ は否定、∧ は論理積、∨ は論理和を表す。","h":"ド・モルガンの法則（否定は ∧ と ∨ を入れ替え、各項の否定を取る）を外側から順に適用する。","c":["(¬A∨B)∧¬C","(¬A∧B)∧¬C","(A∧¬B)∨¬C","(¬A∧B)∨¬C"],"a":3,"v":"calc","n":"<b>正解は (¬A∧B)∨¬C</b>。¬(X∧C)=¬X∨¬C を適用し、X=(A∨¬B) について ¬(A∨¬B)=¬A∧¬¬B=¬A∧B。よって (¬A∧B)∨¬C。<br>誤答の出どころ: (¬A∨B)∧¬C は ∧ と ∨ を入れ替えず各項の否定だけを取った場合、(¬A∧B)∧¬C は外側の ∧ を入れ替えなかった場合、(A∧¬B)∨¬C は内側の項の否定を取らなかった場合。<br><br>【出典】検算: ド・モルガンの法則 ¬(P∧Q)=¬P∨¬Q、¬(P∨Q)=¬P∧¬Q。python で8通りの全入力を評価し、正解のみが元の式と一致することを確認。〔出題実績: R2 2-2、R3 2-2〕"},
{"f":"基礎:情報・論理","q":"TCP の輻輳（ふくそう）制御に関する次の記述のうち、最も適切なものはどれか。ただし SMSS は送信側の最大セグメントサイズ、cwnd は輻輳ウィンドウ、ssthresh はスロースタートのしきい値とする。","h":"再送タイムアウトは輻輳がかなり深刻だと判断される事象なので、cwnd の縮め方としきい値の更新を組で考える。","c":["スロースタートでは、ACK を受信するたびに cwnd を SMSS だけ増やすので、cwnd は RTT ごとに SMSS ずつ線形に増加する。","cwnd が ssthresh を下回っている間は輻輳回避フェーズで動作し、cwnd を RTT ごとに約1セグメント分だけ増やす。","再送タイムアウトが発生すると、ssthresh は変更せず、cwnd を従来の半分の値に縮小して送信を続ける。","再送タイムアウトが発生すると、ssthresh を未確認データ量の半分（最小 2×SMSS）に下げ、cwnd を1セグメント分に戻してスロースタートからやり直す。"],"a":3,"v":"primary","n":"<b>正解は「再送タイムアウトで ssthresh を未確認データ量の半分に下げ、cwnd を1セグメントに戻す」</b>。RFC 5681 §3.1 は、再送タイムアウトの際に ssthresh=max(FlightSize/2, 2×SMSS) とし、cwnd を損失ウィンドウ（1セグメント）に設定すると定めている。<br>誤答の出どころ: スロースタートでは ACK ごとに cwnd を増やすため cwnd は RTT ごとにおよそ2倍（指数的）に増える（線形増加は輻輳回避フェーズの性質）。輻輳回避に入るのは cwnd が ssthresh を超えたとき（下回っている間はスロースタート）。ssthresh を変えず cwnd だけ半分にするのは RFC の規定ではない。<br><br>【出典】RFC 5681 TCP Congestion Control §3.1 https://www.rfc-editor.org/rfc/rfc5681（確認日 2026-10-04）〔出題実績: R7 2-3〕"},
{"f":"基礎:情報・論理","q":"次の式を満たす関数 A: ℕ×ℕ→ℕ（ℕ は非負整数全体）はアッカーマン関数と呼ばれる。<br>A(0, n) = n + 1<br>A(m+1, 0) = A(m, 1)<br>A(m+1, n+1) = A(m, A(m+1, n))<br>このとき A(2, 3) として正しい値はどれか。","h":"A(1, n) を先に求めておくと、A(2, n) の計算が楽になる。","c":["7","5","9","11"],"a":2,"v":"calc","n":"<b>正解は9</b>。A(1,0)=A(0,1)=2、A(1,n+1)=A(0,A(1,n))=A(1,n)+1 より A(1,n)=n+2。A(2,0)=A(1,1)=3、A(2,n+1)=A(1,A(2,n))=A(2,n)+2 より A(2,n)=2n+3。よって A(2,3)=9。<br>誤答の出どころ: 7 は A(2,2)（引数を1つ小さく数えた場合）、11 は A(2,4)（1つ大きく数えた場合）、5 は A(1,3) または A(2,1) と、再帰の段数を取り違えた場合。<br><br>【出典】検算: 問題文の再帰定義をそのまま実行（python の再帰で A(2,3)=9、A(2,2)=7、A(2,4)=11、A(1,3)=5 を確認）。〔出題実績: R7 2-6〕"},
{"f":"基礎:情報・論理","q":"4種類の記号が、確率 1/2, 1/4, 1/8, 1/8 で独立に出力される情報源がある。この情報源の1記号あたりの平均情報量（エントロピー）はいくつか。対数の底は2とし、単位はビットとする。","h":"各記号の情報量は −log2(確率) で、それを出現確率で重み付けして足し合わせる。","c":["1.75ビット","2.00ビット","2.25ビット","1.21ビット"],"a":0,"v":"calc","n":"<b>正解は1.75ビット</b>。H=Σ p·log2(1/p)=(1/2)×1+(1/4)×2+(1/8)×3+(1/8)×3=0.5+0.5+0.375+0.375=1.75。<br>誤答の出どころ: 2.00ビットは4種類が等確率とみなした場合（log2 4）、2.25ビットは各記号の情報量 1,2,3,3 を確率で重み付けせず単純平均した場合、1.21は自然対数で計算した場合（単位はナット）。<br><br>【出典】検算: シャノンのエントロピー H=−Σ p log2 p（C. E. Shannon, 1948, A Mathematical Theory of Communication）。python で計算し、自然対数・単純平均・等確率の場合の値と照合。〔出題実績: R7 2-2〕"},
{"f":"基礎:情報・論理","q":"IPネットワークの経路制御に関する次の記述のうち、最も適切なものはどれか。","h":"リンク状態型は「全体の地図を持って自分で最短経路を計算」、距離ベクトル型は「隣から教わった距離を足していく」。","c":["OSPF はリンク状態型で、各ルータが同一のリンク状態データベースを持ち、自分を根とする最短経路木から経路表を計算する。","距離ベクトル型では、各ルータがネットワーク全体のトポロジを把握したうえで、自分を根とする最短経路木から経路表を作る。","RIP は距離ベクトル型で、メトリックは回線帯域幅の逆数を用い、有効な値の範囲は1〜255である。","RIP は30秒ごとに、前回の送信から変化した経路の差分だけを隣接する全てのルータへ送信する。"],"a":0,"v":"primary","n":"<b>正解は「OSPFはリンク状態型で、同一のデータベースから最短経路木で経路表を計算する」</b>。RFC 2328 は、OSPF はリンク状態型ルーティングプロトコルであり、各ルータが自律システムのトポロジを表す同一のデータベースを持ち、そこから最短経路木を構築して経路表を計算すると述べている。<br>誤答の出どころ: 全体のトポロジを把握するのはリンク状態型で、距離ベクトル型は隣接ルータから受け取った距離情報だけで次ホップを決める。RIP のメトリックはホップ数（有効値1〜15、16が到達不能を表す無限大）。RIP は30秒ごとに経路表の全体を送る（RFC 2453）。<br><br>【出典】RFC 2328 OSPF Version 2 要旨・§1 https://www.rfc-editor.org/rfc/rfc2328、RFC 2453 RIP Version 2 §3.4.1・§3.6・§3.8 https://www.rfc-editor.org/rfc/rfc2453（確認日 2026-10-04）〔出題実績: R6 2-3〕"},
{"f":"基礎:情報・論理","q":"実数 x について、次の空欄に当てはまる語句の組合せとして正しいものはどれか。<br>「x>2」は「x²>4」であるための（ア）。<br>「x³=8」は「x=2」であるための（イ）。","h":"それぞれ「P ならば Q」と「Q ならば P」の真偽を、反例（x=−3 など）も含めて調べる。","c":["ア：必要条件であるが十分条件ではない／イ：必要十分条件である","ア：十分条件であるが必要条件ではない／イ：必要十分条件である","ア：十分条件であるが必要条件ではない／イ：必要条件であるが十分条件ではない","ア：必要十分条件である／イ：十分条件であるが必要条件ではない"],"a":1,"v":"calc","n":"<b>正解は ア：十分条件であるが必要条件ではない／イ：必要十分条件である</b>。ア: x>2 ならば x²>4 は真（十分）。逆は x=−3 のとき x²=9>4 だが x>2 でないので偽（必要ではない）。イ: 実数の範囲では x³=8 と x=2 は同値（3乗は実数で単調増加）なので必要十分。<br>誤答の出どころ: アを「必要条件」とするのは、命題の向き（どちらがどちらの条件か）を逆に読んだ場合。イを「必要のみ」「十分のみ」とするのは、片方向の確認で止めた場合。<br><br>【出典】検算: 必要条件・十分条件の定義（P⇒Q のとき P は Q の十分条件、Q は P の必要条件）。python で整数・有理数の格子点について命題の真偽を調べ、反例 x=−3 を確認。〔出題実績: R6 2-2〕"},
{"f":"基礎:情報・論理","q":"8ビットの値 X=10110110 と Y=11001010 について、Z=(X XOR Y) AND 11110000 を求め、Z を論理右シフトで2ビット右へずらした値を16進数で表したものはどれか。","h":"XOR は同じビットで0・異なるビットで1となり、AND の 11110000 は上位4ビットだけを残すマスクである。","c":["70","3C","1C","C0"],"a":2,"v":"calc","n":"<b>正解は1C</b>。X XOR Y = 01111100、これに 11110000 を AND して 01110000（70）。論理右シフト2ビットで 00011100 = 1C。<br>誤答の出どころ: 70 はシフトを忘れた場合、3C は XOR を OR に取り違えた場合（(X OR Y)=11111110、AND で 11110000、右2ビットで 00111100）、C0 は右シフトを左シフトとしてしまった場合（01110000 を左へ2ビットで 11000000）。<br><br>【出典】検算: ビット演算（XOR・AND・シフト）の定義。python の ^ & >> で計算し、誤答の導出も再現。〔出題実績: R5 2-5〕"},
{"f":"基礎:情報・論理","q":"NIST SP 800-63B（デジタルアイデンティティガイドライン：認証とライフサイクル管理）の記述として、最も適切なものはどれか。","h":"近年のガイドラインは、定期変更や文字種の強制よりも、長さや漏えい済みパスワードの照合を重視している。","c":["検証者は、パスワードに大文字・小文字・数字・記号を混在させるなどの構成規則を課さなければならない。","検証者は、単要素認証に用いるパスワードの最小の長さを8文字とするだけで十分と考えてよい。","検証者は、利用者に対してパスワードを定期的に変更するよう要求してはならない。","検証者は、パスワード入力欄では、貼り付け（ペースト）機能を禁止することが望ましい。"],"a":2,"v":"primary","n":"<b>正解は「パスワードの定期的な変更を要求してはならない」</b>。SP 800-63B-4 §3.1.1.2 は、検証者およびCSPは利用者に定期的なパスワード変更を要求してはならない（SHALL NOT）と定めている。<br>誤答の出どころ: 構成規則（文字種の混在など）は「課してはならない（SHALL NOT）」。最小長は単要素認証で15文字、多要素認証の一要素としてなら8文字。貼り付け機能は「許可すべき（SHOULD permit）」でパスワードマネージャの利用を支える。総務省のテレワークセキュリティガイドライン（第5版）も、パスワードの定期変更は原則不要と述べている。<br><br>【出典】NIST SP 800-63B-4 §3.1.1.2 https://pages.nist.gov/800-63-4/sp800-63b.html、総務省 テレワークセキュリティガイドライン第5版 https://www.soumu.go.jp/main_content/000752925.pdf（確認日 2026-10-04）〔出題実績: R5 2-1、R3 2-1、R6 2-6〕"},
{"f":"基礎:情報・論理","q":"13桁のJANコードの第13桁はチェックディジットである。第1〜12桁のうち左から奇数番目の桁に1、偶数番目の桁に3を掛けて合計し、その合計の下1桁を10から引いた値（10になる場合は0）を第13桁とする。第1〜12桁が 450987654321 のとき、チェックディジットはどれか。","h":"12桁を左から順に、重み 1,3,1,3,… を掛けて足し合わせ、合計の下1桁だけを使う。","c":["8","4","7","6"],"a":3,"v":"calc","n":"<b>正解は6</b>。4×1+5×3+0×1+9×3+8×1+7×3+6×1+5×3+4×1+3×3+2×1+1×3=4+15+0+27+8+21+6+15+4+9+2+3=114。下1桁4を10から引いて6。<br>誤答の出どころ: 8は重みを3,1,3,1,…と逆に掛けた場合（合計がちがって下1桁2を引く）、4は合計の下1桁をそのまま答えた場合、7は合計を11で割った余り4を11から引いた場合（mod 10 と mod 11 の混同）。<br><br>【出典】GS1「How to calculate a check digit manually」（GTIN-13 は右から3,1,3,…の重み、合計を次の10の倍数に切り上げるまでの差がチェックディジット。12桁データでは左から奇数番目が1、偶数番目が3となる）https://www.gs1.org/services/how-calculate-check-digit-manually（直接取得は403のため検索結果の抜粋と、実在のJANコード 4901234567894 で規則どおりチェックディジット4になることを python で確認、確認日 2026-10-04）。検算: python。〔出題実績: R5 2-3〕"},
{"f":"基礎:情報・論理","q":"IPv4 アドレス 172.16.5.77 を含む、プレフィックス長 27（サブネットマスク 255.255.255.224）のネットワークのブロードキャストアドレスはどれか。","h":"ホスト部は下位5ビットなので、最後のオクテットを32ずつの区間に分け、77が入る区間の最後のアドレスを探す。","c":["172.16.5.64","172.16.5.95","172.16.5.79","172.16.5.127"],"a":1,"v":"calc","n":"<b>正解は172.16.5.95</b>。ホスト部は32−27=5ビットで、ブロックの大きさは 2^5=32。最後のオクテットは 0-31、32-63、64-95、…に分かれ、77 は 64-95 に入る。ネットワークアドレスは .64、ブロードキャストアドレス（ホスト部が全て1）は .95。<br>誤答の出どころ: .64 はネットワークアドレス、.79 はプレフィックス長を28としてブロックを16で区切った場合、.127 はプレフィックス長を25としてブロックを128で区切った場合。<br><br>【出典】RFC 4632 §3.1（/n のプレフィックスは 2^(32−n) 個のアドレスを表す）https://www.rfc-editor.org/rfc/rfc4632（確認日 2026-10-04）。検算: python の ipaddress モジュール。〔出題実績: R4 2-6（IPv4/IPv6）〕"},
{"f":"基礎:情報・論理","q":"総務省「テレワークセキュリティガイドライン（第5版）」の内容に照らして、テレワークでの情報セキュリティ対策に関する次の記述のうち、最も不適切なものはどれか。","h":"報告するかどうか迷ったときの行動について、ガイドラインは安全側に倒す立場をとっている。","c":["既知の脆弱性を放置したVPN機器が攻撃を受けた事例があるため、過去に使っていた機器を再利用するときは、ファームウェアを最新にして既知の脆弱性を解消してから使う。","第三者からののぞき見（ショルダーハッキング）や大声でのオンライン会議による情報漏えいが起きないよう、テレワークに適した環境を選んで作業する。","不審なメールを受け取ったときに、報告すべきか判断に迷う場合は、手間を増やさないよう報告せず、自分でメールを削除して済ませる。","クラウドサービスや社内システムへの接続では、利用者認証情報が漏えいしても直ちに不正アクセスを受けないよう、可能な限り多要素認証を利用する。"],"a":2,"v":"primary","n":"<b>正解は「判断に迷う場合は報告せず自分で削除する」</b>。ガイドラインは、少しでも不審を感じたメールは開かず、必要に応じて送信者に確認するほか、システム・セキュリティ管理者へ速やかに報告すること、報告の是非に迷う場合は報告することを心がけることを勤務者の基本対策としている。<br>他の3つはガイドラインの記述に沿う: 過去に使用した機器を再利用する場合はファームウェアを最新にして既知の脆弱性が残っていない状態で使う（VPN機器の脆弱性の放置の事例）、のぞき見（ショルダーハッキング）や大声でのオンライン会議を避ける適切なテレワーク環境の確保、クラウドサービスや社内接続での可能な限りの多要素認証。<br><br>【出典】総務省「テレワークセキュリティガイドライン 第5版」（令和3年5月）勤務者F-1、事例「VPN機器の脆弱性の放置」、管理者H-2 等 https://www.soumu.go.jp/main_content/000752925.pdf（確認日 2026-10-04）〔出題実績: R4 2-1〕"},
{"f":"基礎:情報・論理","q":"3つの条件 A, B, C が成立（Y）か不成立（N）かによって、動作 X または Y のいずれかを実行する。動作は「A と B がともに成立していれば X（C の成否は問わない）、それ以外は Y」である。決定表では、動作が同じで1つの条件だけが異なる規則を、その条件を不問（−）にして1つにまとめられる。「その他」の規則は使わず、規則が重ならないようにするとき、規則の列数は最小でいくつになるか。","h":"X になる組は (Y,Y,*) の2通りなので、残りの6通りの Y を何列で重ならずに表せるかを考える。","c":["3列","4列","7列","8列"],"a":0,"v":"calc","n":"<b>正解は3列</b>。(A,B,C)=(Y,Y,−)→X、(Y,N,−)→Y、(N,−,−)→Y の3列で、8通りすべての組合せが重なりなく含まれる。Y になる6通りは1つの列では表せない（−を含む列は2のべき乗個の組を表す）ので、最小は2列（4通りと2通り）、これに X の1列を加えて3列。<br>誤答の出どころ: 8列は8通りを1列ずつ展開したまま（まとめない場合）、7列は X の2通りだけを1列にまとめて Y の6通りをまとめなかった場合、4列は C だけを不問にして (A,B) の4通りを列挙し、A=N側の B を不問にする併合を行わなかった場合。<br><br>【出典】検算: 決定表（デシジョンテーブル）の規則の併合。python で3^3=27通りの規則の候補から、重ならない被覆の最小列数を全探索して3を確認。〔出題実績: R3 2-4〕"},
{"f":"基礎:情報・論理","q":"データ件数 n=1,024 のとき、あるアルゴリズムの処理時間が T であった。このアルゴリズムの計算量は O(n log n) であり、処理時間は n log2 n に比例するものとして、n=8,192 に増やしたときの処理時間は T の何倍になるか。定数係数と低次の項は無視できるものとする。","h":"n は8倍になるが log2 n も増えるので、n=1,024 と 8,192 のそれぞれで n×log2 n を計算して比べる。","c":["約8.0倍","約24.0倍","約64.0倍","約10.4倍"],"a":3,"v":"calc","n":"<b>正解は約10.4倍</b>。n=1,024 のとき n log2 n=1024×10、n=8,192 のとき 8192×13。比は (8192×13)÷(1024×10)=8×1.3=10.4倍。<br>誤答の出どころ: 8.0倍は計算量を O(n)（件数に比例）とみなした場合、24.0倍は n の増加率 8 に log2 8=3 をさらに掛けた場合、64.0倍は O(n²) とみなした場合。<br><br>【出典】検算: O(n log n)（ヒープソート・マージソート等の計算量）。python で比を計算。〔出題実績: R3 2-6〕"},
{"f":"基礎:情報・論理","q":"中置記法の式 a − b × (c + d) ÷ e を、逆ポーランド記法（後置記法）で表したものはどれか。ただし演算の優先順位は乗除が加減より高く、同順位の演算は左から順に行う。","h":"括弧内の c + d が最初に計算され、その後 b との積、さらに e での割り算、最後に a からの引き算になる。","c":["a b - c d + * e /","a b c * d + e / -","a b c d + * e / -","a b c d + e / - *"],"a":2,"v":"calc","n":"<b>正解は a b c d + * e / -</b>。式は a − ((b × (c+d)) ÷ e)。c d + で (c+d)、b を掛けて b c d + *、e で割って e /、最後に a から引く。後置記法は各演算子が直前の2つの値に作用する。<br>誤答の出どころ: 「a b - c d + * e /」は優先順位を無視して左から順に計算した場合（((a−b)×(c+d))÷e）、「a b c * d + e / -」は括弧を無視して b×c を先に計算した場合、「a b c d + e / - *」は割り算と引き算の結びつきを取り違えて a×(b−(c+d)÷e) の形にした場合。<br><br>【出典】検算: 後置記法への変換（操車場アルゴリズム）。python で各選択肢をスタックで評価し、乱数で元の式と値を比較して正解のみが一致することを確認。〔出題実績: R3 2-5〕"},
{"f":"基礎:情報・論理","q":"8ビットの2の補数表現で、10進数 −37 を表したものはどれか。","h":"37 を2進数で表し、全ビットを反転してから1を加える。","c":["11011010","11011011","10100101","00100101"],"a":1,"v":"calc","n":"<b>正解は11011011</b>。37=00100101、全ビット反転（1の補数）11011010、1を加えて11011011。検算: 11011011 を符号なしで読むと 219=256−37。<br>誤答の出どころ: 11011010 は1の補数で止めて1を加え忘れた場合、10100101 は符号ビットだけを1にした符号絶対値表現、00100101 は符号を処理せず +37 を答えた場合。<br><br>【出典】検算: 2の補数表現（−x = 2^n − x）。python で (-37)&0xFF を計算し、1の補数・符号絶対値との違いも確認。〔出題実績: R2 2-4〕"},
{"f":"基礎:情報・論理","q":"フィッシングやなりすましの手口に関する次の記述のうち、最も適切なものはどれか。","h":"ワンタイムパスワード（OTP）も、利用者本人が偽サイトへ入力してしまえば、攻撃者が使えてしまう。","c":["リアルタイムフィッシングでは、偽サイトにIDとパスワードを入力させた後でワンタイムパスワードも入力させ、攻撃者がそれを正規サイトへ即座に入力して多要素認証を突破しようとする。","SMS や認証アプリのワンタイムパスワードによる多要素認証を導入すれば、フィッシングサイトに入力してしまっても突破されないので、メールの見分け方の教育は不要になる。","中間者（AiTM）型のフィッシングでは、ブラウザーのアドレス欄に正規サイトのURLが表示されるため、URLの確認だけでは偽サイトと見抜けない。","フィッシングメールは特定の組織や個人だけを狙うもので、同じ文面を不特定多数に一斉に送りつける手口は、フィッシングには含まれない。"],"a":0,"v":"primary","n":"<b>正解は「リアルタイムフィッシングではOTPも入力させ、攻撃者がその場で正規サイトに入力して多要素認証を突破しようとする」</b>。IPAの資料は、リアルタイムフィッシングでは、偽サイトに入力させた情報をその場で抜き取って攻撃者が正規サイトに入力し、SMSや認証アプリを使った多要素認証を突破しようとする、と説明している。<br>誤答の出どころ: OTPの多要素認証を入れれば教育が不要になる、とする記述は、同資料が述べる突破の手口に反する（対策としてフィッシング耐性のある多要素認証が挙げられている）。AiTM では、ブラウザーには偽サイトのURLが表示される（接続先は正規サイトではない）と記載されている。フィッシングは実在の企業・サービスを騙るメールやSMSを不特定多数へ送るばらまき型が典型で、標的型とは区別される。<br><br>【出典】IPA「企業組織を狙う攻撃メールの手口とその対策」（2026年8月3日）2.1 フィッシング https://www.ipa.go.jp/security/support/rcu1hd0000019vmo-att/20260803_1.pdf（確認日 2026-10-04）〔出題実績: R1再 2-1、R4 2-1〕"},
{"f":"基礎:情報・論理","q":"10進法で表記された容量 500GB（1GB=10^9バイト）のストレージの容量を、2進接頭辞の GiB（1GiB=2^30バイト）で表したとき、最も近い値はどれか。","h":"500×10^9 バイトを 2^30 バイトで割ればよく、2^30 は 10^9 より約7.4%大きい。","c":["500.0GiB","536.9GiB","488.3GiB","465.7GiB"],"a":3,"v":"calc","n":"<b>正解は465.7GiB</b>。500×10^9÷2^30=500×10^9÷1,073,741,824≒465.66。GiB は 2^30 バイトで、GB（10^9）より大きいので、同じバイト数の数値は小さくなる。<br>誤答の出どころ: 500.0は単位の違い（GBとGiB）を無視した場合、536.9は掛け算と割り算を逆にした場合（500×2^30÷10^9）、488.3は 1024^3 でなく 1.024 倍の近似を1回だけ使って割った場合（500÷1.024）。<br><br>【出典】NIST「Prefixes for binary multiples」（kibi, mebi, gibi, tebi は 2^10, 2^20, 2^30, 2^40。IEC 60027-2 で規定）https://physics.nist.gov/cuu/Units/binary.html（確認日 2026-10-04）。検算: python。〔出題実績: R1再 2-3〕"},
{"f":"基礎:情報・論理","q":"IEEE 754 の単精度（32ビット）浮動小数点形式は、符号1ビット、指数部8ビット（バイアス127）、仮数部23ビット（最上位の1は省略）で実数を表す。10進数 −6.25 をこの形式で表したものを16進数で書いたものはどれか。","h":"6.25 を2進数にして 1.xxx×2^e の形に正規化し、指数にバイアスを加える。","c":["40C80000","C0C80000","C1480000","C0E40000"],"a":1,"v":"calc","n":"<b>正解は C0C80000</b>。6.25=110.01₂=1.1001×2^2。符号1（負）、指数=2+127=129=10000001₂、仮数部は 1001 に0を続けた23ビット。1 10000001 10010000000000000000000 を4ビットずつ区切ると C0C80000。<br>誤答の出どころ: 40C80000 は符号ビットを0（正）とした場合、C1480000 はバイアスを128として指数130を使った場合、C0E40000 は省略されるはずの最上位の1を仮数部に含めた場合（11001…）。<br><br>【出典】検算: IEEE 754-2019 binary32 の定義（符号1・指数8・仮数23、バイアス127）。python の struct.pack('>f', -6.25).hex() と、誤答の導出を再現して照合。〔出題実績: R1再 2-4〕"},
{"f":"基礎:情報・論理","q":"データ7ビットに偶数パリティの1ビットを付加した8ビットを伝送する。付加するビットは、8ビット全体の中の「1」の個数が偶数になるように決める。受信側は「1」の個数が奇数であれば伝送誤りありと判定する。伝送中に次のビット反転が起きたとき、受信側が誤りを検出できないものはどれか。","h":"反転したビットの個数が奇数のときと偶数のときで、「1」の個数の偶奇がどう変わるかを考える。","c":["データ部の1ビットだけが反転した。","付加したパリティビットだけが反転した。","データ部の2ビットが反転した。","データ部の3ビットが反転した。"],"a":2,"v":"calc","n":"<b>正解は「データ部の2ビットが反転した」</b>。ビットが反転するたびに「1」の個数は±1変わるので、反転したビット数が奇数なら偶奇が変わり、必ず検出できる。2ビット反転では偶奇が元に戻ることがあり、検出できない（8ビット全体で見ると偶数個の反転は検出できない）。<br>誤答の出どころ: データ部の1ビット、パリティビットだけ、データ部の3ビットは、いずれも反転したビット数が奇数で、「1」の個数が奇数になるので検出される。なお、1ビット誤りの検出はできても、どのビットが誤っているかは特定できない。<br><br>【出典】検算: パリティ検査の性質（反転ビット数が奇数なら検出、偶数なら検出不能）。python で 7ビットの全データ(128通り)と全反転パターン(255通り)を調べ、反転数の偶奇と検出可否が一致することを確認。〔出題実績: R4 2-4、R6 2-4〕"}
