  {"f":"SCR:Ch10 移行計画と炭素報告","q":"[LO 10.10] Which PCAF requirement creates demand from financial institutions for corporate clients to produce emissions data and plans?","h":"投融資先のScope 3は2025年以降、全セクターで求められます。","c":["PCAF's phase-in for including investees' Scope 3 emissions: by reports published in 2025 onwards, every sector is required.","PCAF's requirement that every client of a financial institution obtain a data quality score of 1 by 2025 or be excluded from the portfolio.","PCAF's requirement that clients publish a transition plan certified by PCAF before the financial institution may report financed emissions.","PCAF's requirement that clients buy carbon credits equal to their financed emissions, which the financial institution then retires on their behalf."],"a":0,"v":"primary","n":"<b>ひとことで</b> 投融資先のScope 3の算入について、2025年以降の報告からすべてのセクターが対象となる段階導入。<br><br><b>解説</b> PCAFは、EUのTEGの段階導入に沿い、投融資先のScope 3の算入を、2021年以降はエネルギー（石油・ガス）と鉱業、2023年以降は運輸・建設・建物・素材・産業、2025年以降はすべてのセクターに広げることを求める。金融機関は、取引先から、より詳細なデータを求めるようになる。<br><br><b>紛らわしい選択肢</b> 「全員スコア1」「PCAFの認証」「クレジット購入の義務」はいずれもPCAFの要件ではない。<br><br>【出典】PCAF, The Global GHG Accounting and Reporting Standard Part A: Financed Emissions, Second Edition, 2022. https://carbonaccountingfinancials.com/files/downloads/PCAF-Global-GHG-Standard.pdf"},
  {"f":"SCR:Ch10 移行計画と炭素報告","q":"[LO 10.10] A bank finds that its clients' emissions data are unavailable or not comparable. Which action does the BCBS climate principles suggest?","h":"取引先への働きかけと、暫定的な代理指標です。","c":["Wait until all clients publish verified data before reporting any climate-related financial risk exposures, because proxies are not allowed in internal reports.","Exclude clients without data from the climate analysis altogether, because the principles apply only to clients that report emissions data under a mandatory rule.","Assign the sector's highest emission figure to every client without data, because the principles require the most conservative assumption in all cases.","Consider actively engaging clients and counterparties to collect additional data, and, where reliable data are unavailable, use reasonable proxies and assumptions as an intermediate step."],"a":3,"v":"primary","n":"<b>ひとことで</b> 取引先に働きかけて追加データを集めることを検討し、信頼できるデータがない場合は、暫定的に合理的な代理指標と仮定を使う。<br><br><b>解説</b> BCBS原則のパラグラフ32は、移行戦略とリスクの特徴をより理解するため、取引先に積極的に働きかけ、追加データを集めること、信頼できる比較可能なデータがない場合には、内部報告で合理的な代理指標と仮定を、中間的な手段として使えるとする。取引先にとっては、移行計画やデータを整備する動機になる。<br><br><b>紛らわしい選択肢</b> 「全データが揃うまで待つ」「データなしの顧客を除外」「最高値を一律適用」はいずれも原則にない。<br><br>【出典】BCBS, Principles for the effective management and supervision of climate-related financial risks, 2022. https://www.bis.org/publications/202206-guidelines-principles-effective-management-and-supervision-climate-related-financial-risks.pdf"}
];
</script>

   回答履歴は問題文がキーなので共通のまま。受験日だけはモードごとに別に保存する */
const MODES = SUBJECT.modes ? ["一次"].concat(Object.keys(SUBJECT.modes)) : [];
let MODE = SUBJECT.defaultMode || "一次";
try {
  // スイッチを隠している間は、保存した選択を使わず既定のモードで開く（前に一次を選んだ端末が一次に閉じ込められないように）。
  // URL の ?mode=一次 を付けて開いたときだけ、そのモードで開く
  const um = new URLSearchParams(location.search).get("mode");
  if (MODES.indexOf(um) >= 0) MODE = um;
  else if (!SUBJECT.hideModeSwitch && MODES.indexOf(localStorage.getItem(SPFX + "mode")) >= 0) MODE = localStorage.getItem(SPFX + "mode");
} catch (e) {}
if (MODES.length) {
  SUBJECT.sets = SUBJECT.sets.filter(function (d) { return MODE === "一次" ? !SUBJECT.modes[d.group] : d.group === MODE; });
  if (MODE !== "一次") Object.assign(SUBJECT, SUBJECT.modes[MODE]);
}
function setMode(m) {
  try { localStorage.setItem(SPFX + "mode", m); } catch (e) {}
  location.reload();
}

function inRetry() { return RETRY_FROM >= 0 && i >= RETRY_FROM; }
function origCount() { return RETRY_FROM >= 0 ? RETRY_FROM : Q.length; }
function wrongOriginals() {
  const out = [];
  for (let k = 0; k < origCount(); k++) if (answers[k] && !answers[k].hit) out.push(Q[k]);

}
/* 本番の過去問を通しで解いた回（専門・基礎）では、選ばなかった問題も「もう一度」に入れる。問題番号の順 */
function retryOriginals() {
  const ex = examRun(), sk = !!ex && ex.kind !== "適性";
  const out = [];
  for (let k = 0; k < origCount(); k++) if (answers[k] ? !answers[k].hit : sk) out.push(Q[k]);

}
/* 「もう一度」の k 問目が、最初の回で選ばなかった（答えていない）問題か */
function retryWasSkipped(k) {
  if (RETRY_FROM < 0 || k < RETRY_FROM) return false;
  for (let j = 0; j < RETRY_FROM; j++) if (Q[j] === Q[k]) return !answers[j];
  return false;
}
function appendRetries() {
  if (RETRY_FROM >= 0) return;
  const w = retryOriginals();
  if (!w.length) return;
  RETRY_FROM = Q.length;
  w.forEach(function (q) { Q.push(q); });
}

function shuffle(n, seed) {
  // 決定論的シャッフル（問題ごとに選択肢の並びを変える）
  // 掛け算は Math.imul で32bitに収める。普通の * だと2^53を超えて下位ビットが消え、
  // 4択の正答がすべて④に固定されていた（2026-09-25 修正）
  const idx = [...Array(n).keys()];
  for (let k = n - 1; k > 0; k--) {
    seed = (Math.imul(seed, 1103515245) + 12345) >>> 0;
    const j = Math.floor(seed / 4294967296 * (k + 1));
    [idx[k], idx[j]] = [idx[j], idx[k]];
  }
  return idx;
}

function render() {
  AT_HOME = false;
  setQuizChrome(true);
  document.body.classList.remove("home-mode");
  const hb = document.getElementById("homeBottom");
  if (hb) hb.innerHTML = "";
  if (i >= Q.length) return renderResult();
  const q = Q[i];
  let seed = 0;
  for (let k = 0; k < q.q.length; k++) seed = (seed * 31 + q.q.charCodeAt(k)) & 0x7fffffff;
  // 「〜の数はどれか」の選択肢（2個・0個…）は並べ替えずに小さい順に出す（スマホで探しやすく）
  const isCount = q.c.every(function (c) { return /^\s*[0-9０-９]+\s*(個|つ)?\s*$/.test(c); }) &&
    (q.c.some(function (c) { return /(個|つ)\s*$/.test(c); }) || /の数/.test(q.q.split("<br>")[0]));
  const isPast = /^(過去問|○×) /.test(q.f || "") || q.keep === true;   // 暗記カードの「思い出せた／思い出せなかった」も順番固定   // 取り込んだ本番の過去問は原本の①〜⑤の順のまま（正答番号と合わせる）
  const order = isPast ? q.c.map(function (_, k) { return k; }) : isCount
    ? q.c.map(function (_, k) { return k; }).sort(function (a, b) { return parseInt(q.c[a].replace(/[０-９]/g, function (d) { return "０１２３４５６７８９".indexOf(d); }), 10) - parseInt(q.c[b].replace(/[０-９]/g, function (d) { return "０１２３４５６７８９".indexOf(d); }), 10); })
    : shuffle(q.c.length, seed);
  const prev = answers[i];
  answered = !!prev;

  elField.textContent = q.f;
  elCount.textContent = inRetry() ? "もう一度 " + (i - RETRY_FROM + 1) + " / " + (Q.length - RETRY_FROM) : (i + 1) + " / " + origCount();
  elScore.innerHTML = "正解 <b>" + correct + "</b>";
  elBar.style.width = (i / Q.length * 100) + "%";

  const card = document.createElement("div");
  card.className = "card";
  const h = histOf(q);
  let badge = '';
  if (h) {
    badge = '<span class="hist">これまで ' + h.n + '回中 ' + h.ok + '回正解</span>';
    if (h.last === 0) badge += '<span class="flagmark">前回まちがえた</span>';
    else badge += '<span class="mst m' + mastery(q) + '">' + MASTERY[mastery(q)] + '</span>';
  }
  const bm = isBookmarked(q);
  card.innerHTML =
    '<div class="qmeta"><span class="qn">Q' + (i + 1) + '</span>' + badge +
      '<span class="qtools">' +
        '<button type="button" class="qtool" id="bmTog" aria-pressed="' + bm + '">' + bmLabel(bm) + '</button>' +
        '<button type="button" class="qtool" id="memoTog" aria-expanded="false" aria-controls="memoBox"></button>' +
      '</span></div>' +
    whyChips(whyOf(q), q) +
    '<p class="qt"></p><div class="qimg" hidden></div><p class="qh"></p><div class="choices"></div>' +
    '<div class="memo" id="memoBox" hidden>' +
      '<label for="memoTa">メモ（この端末に自動で保存されます）</label>' +
      '<textarea id="memoTa" rows="3" placeholder="覚え方、間違えた理由など"></textarea>' +
      '<div class="saved" aria-live="polite"></div>' +
    '</div>';
  renderStatements(card, q);
  if (q.hasImg) {
    const box = card.querySelector(".qimg");

/* (ア)〜(オ) の記述を並べる問題は、各記述に ○／× の印を付けられる行に分け、○の数をその場で数える */
function renderStatements(card, q) {
  const qt = card.querySelector(".qt");
  // 1行に「(ア) …　(イ) …」と複数の記述が並んでいる場合も、記述ごとの行に分ける
  const parts = [].concat.apply([], q.q.split("<br>").map(function (l) {
    return /^\s*[（(][ア-コ][）)]/.test(l) ? l.split(/[\s　]+(?=[（(][ア-コ][）)])/) : [l];
  }));
  const isSt = parts.map(function (l) { return /^\s*[（(][ア-コ][）)]/.test(l); });
  if (isSt.filter(Boolean).length < 2) { setMxText(qt, q.q.replace(/<br>/g, "\n")); return; }
  setMxText(qt, parts.filter(function (_, k) { return !isSt[k]; }).join("\n"));
  const box = document.createElement("div");
  box.className = "stl";
  const tally = document.createElement("div");
  tally.className = "sttally";
  const marks = [];
  function upd() {
    const o = marks.filter(function (m) { return m === "○"; }).length, x = marks.filter(function (m) { return m === "×"; }).length;
    tally.textContent = "○ " + o + "個　× " + x + "個　未 " + (marks.length - o - x) + "個";
  }
  parts.forEach(function (l, k) {
    if (!isSt[k]) return;
    const idx = marks.push("") - 1;
    const row = document.createElement("div");
    row.className = "strow";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "stm";
    b.setAttribute("aria-label", "この記述の判定（タップで ○→×→未）");
    b.textContent = "・";
    b.addEventListener("click", function () {
      marks[idx] = marks[idx] === "" ? "○" : marks[idx] === "○" ? "×" : "";
      b.textContent = marks[idx] || "・";
      b.className = "stm" + (marks[idx] === "○" ? " o" : marks[idx] === "×" ? " x" : "");
      upd();
    });
    const t = document.createElement("span");
    t.className = "stt";
    t.textContent = l.trim();
    row.appendChild(b); row.appendChild(t);
    box.appendChild(row);
  });
  upd();
  box.appendChild(tally);
  qt.insertAdjacentElement("afterend", box);
}

/* 前へ／次へのナビゲーション。解答前でも「前へ」で戻れる */
/* 解答前も解答後も「← 前の問題／ホーム／次の問題 →」を同じ位置に出す */
/* 解答前は「とばす」扱い（控えめな見た目・Enterでは押されない）、解答後は通常の「次へ」 */
function navHtml(answeredNow) {
  let label = i + 1 < Q.length ? "次の問題 →" : "結果を見る";
  const ex = examRun();
  if (!answeredNow && ex && ex.kind !== "適性" && !inRetry() && i + 1 < Q.length) label = "この問題は選ばない →";
  if (selFull()) label = "結果を見る";
  return selCountHtml() + '<div class="navrow one">' +
      (answeredNow
        ? '<button class="btn" id="next">' + label + '</button>'
        : '<button class="btn ghost" id="skip">' + label + '</button>') +
    '</div>' +
    '<div class="navrow two">' +
      '<button class="btn ghost" id="prev"' + (i > 0 ? '' : ' disabled') + '>← 前の問題</button>' +
      '<button class="btn ghost" id="home">' + (FROM_HIST ? "← 履歴に戻る" : "ホーム") + '</button>' +
    '</div>' +
    // 通しで解く回（模試）以外は、途中でやめても解いた分だけで採点できる。解答は1問ごとに記録済みなので復習にも入っている
    (!ex && !inRetry() && log.length > 0 && i + 1 < Q.length
      ? '<div class="navrow one"><button class="btn ghost" id="stop">ここまでで採点する（解いた ' + log.length + ' 問）</button></div>' : '');
}
function wireNav(el) {
  const st = el.querySelector("#stop");
  if (st) st.addEventListener("click", function () { PARTIAL = true; i = Q.length; saveSession(); render(); });
  el.querySelector("#prev").addEventListener("click", goPrev);
  el.querySelector("#home").addEventListener("click", goBack);
  const nb = el.querySelector("#next");
  if (nb) nb.addEventListener("click", goNext);
  const sk = el.querySelector("#skip");
  if (sk) sk.addEventListener("click", goNext);
  return nb;
}
function renderNav(card) {
  const old = card.querySelector(".nav");
  if (old) old.remove();
  const nav = document.createElement("div");
  nav.className = "qnav nav";
  nav.innerHTML = navHtml(false);
  card.insertBefore(nav, card.querySelector(".memo"));
  wireNav(nav);
}
function goPrev() { if (i > 0) { i--; saveSession(); render(); } }
/* 本番の過去問を通しで解く回で、選ぶ数（専門25問・基礎は各群3問）を満たしたか。満たしたら次へで結果画面に進む */
function selFull() {
  const ex = examRun();
  if (!ex || ex.kind === "適性" || inRetry()) return false;
  const n = origCount();
  if (ex.kind === "専門") { let c = 0; for (let k = 0; k < n; k++) if (answers[k]) c++; return c >= 25; }
  const g = {};
  for (let k = 0; k < n; k++) if (answers[k]) { const x = kisoGroup(Q[k]); g[x] = (g[x] || 0) + 1; }
  return ["1", "2", "3", "4", "5"].every(x => (g[x] || 0) >= 3);
}
function goNext() { if (selFull()) i = Q.length; else i++; saveSession(); render(); }
/* 科目が resultJudge を持たないときの結果コメント（正答率の下限ごと） */
const DEFAULT_JUDGE = [
  { min: 90, text: "仕上がっています。間違えた問題だけ見直して、定着させてください。" },
  { min: 70, text: "合格ライン（50%）は超えています。間違えた問題だけ回し直して余裕を広げてください。" },
  { min: 50, text: "曖昧なところが残っています。解説を読み直してから、もう一度解いてください。" },
  { min: 0,  text: "まず解説を読んで、正解の根拠を確認してから解き直しましょう。" }
];
/* 本番の過去問を1年度まるごと解いている回か（専門35問・基礎30問・適性15問）。違えば null */
function examRun() {
  const n = origCount();
  const m = /^【(R\S+) (専門|基礎|適性) /.exec((Q[0] && Q[0].q) || "");
  if (!m || n !== { 専門: 35, 基礎: 30, 適性: 15 }[m[2]]) return null;
  const head = "【" + m[1] + " " + m[2] + " ";
  for (let k = 0; k < n; k++) if ((Q[k].q || "").indexOf(head) !== 0) return null;
  return { kind: m[2], year: m[1] };
}
function kisoGroup(q) { const m = /Ⅰ-(\d)-/.exec((q && q.q) || ""); return m ? m[1] : ""; }
/* 解いている途中の表示：選んで解く科目（専門25問・基礎は各群3問）では今いくつ選んだか、どの回でも飛ばした問題の数 */
function selCountHtml() {
  if (inRetry()) return "";
  const n = origCount();
  let skip = 0;
  for (let k = 0; k < Math.min(i, n); k++) if (!answers[k]) skip++;
  const ex = examRun();
  if (!ex || ex.kind === "適性") return skip ? '<p class="selcnt">とばした問題 <b>' + skip + '</b>問（結果画面から解けます）</p>' : "";
  // 専門は35問中10問、基礎は各群6問中3問まで選ばずに飛ばせる
  let c = 0, cap = 25, sk = skip, skCap = 10, what = "選んで解いた問題", skWhat = "選ばなかった";
  if (ex.kind === "基礎") {
    const g = kisoGroup(Q[i]); cap = 3; skCap = 3; sk = 0; what = g + "群で選んだ"; skWhat = "選ばなかった";
    for (let k = 0; k < n; k++) if (kisoGroup(Q[k]) === g) { if (answers[k]) c++; else if (k < i) sk++; }
  } else { for (let k = 0; k < n; k++) if (answers[k]) c++; }
  return '<p class="selcnt' + (c > cap || sk > skCap ? ' over' : '') + '">' + what + ' <b>' + c + '</b> / ' + cap + '問' +
    '　' + skWhat + ' <b>' + sk + '</b> / ' + skCap + '問' +
    (c > cap ? '（本番では' + cap + '問までしか解答できません）' : sk > skCap ? '（飛ばしすぎで' + cap + '問に届きません）' : '') + '</p>';
}
/* 本番の過去問を1年度まるごと解いたときの点数。本番の選び方・合格基準（各科目50%）で数える。
   全問に答えた回は「正解した問題を選べた」前提、選ばない問題があった回は選んだ問題だけで数える */
function pastExamScore(log, N) {
  const ex = examRun();
  if (!ex || !log.length) return null;
  const ok = log.filter(r => r.hit).length, all = log.length === N;
  if (ex.kind === "適性") return { kind: ex.kind, got: ok, of: 15, need: 8, all: all,
    how: "15問すべて解答し8問以上で合格" + (all ? "" : "（答えていない" + (N - log.length) + "問は0点）") };
  if (ex.kind === "専門") {
    if (all) return { kind: ex.kind, got: Math.min(ok, 25), of: 25, need: 13, all: true, how: "35問から25問を選び13問以上で合格。正解した問題を選べた前提で数えています" };
    if (log.length > 25) return { kind: ex.kind, over: '<b>25問を超えて解答しています（' + log.length + '問）。</b>本番では25問までしか解答できません。' };
    return { kind: ex.kind, got: ok, of: 25, need: 13, all: false, how: "選んだ" + log.length + "問で採点。25問を選び13問以上で合格" + (log.length < 25 ? "（あと" + (25 - log.length) + "問選べました）" : "") };
  }
  const g = {};
  log.forEach(r => { const k = kisoGroup(r); g[k] = g[k] || { n: 0, ok: 0 }; g[k].n++; if (r.hit) g[k].ok++; });
  if (all) return { kind: ex.kind, got: Object.keys(g).reduce((t, k) => t + Math.min(3, g[k].ok), 0), of: 15, need: 8, all: true, how: "各群6問から3問を選ぶ15問中8問以上で合格。各群で正解した問題を3問まで数えています" };
  const over = Object.keys(g).filter(k => g[k].n > 3).sort();
  if (over.length) return { kind: ex.kind, over: '<b>' + over.map(k => k + "群").join("・") + 'で3問を超えて解答しています。</b>本番では各群3問までしか解答できません。' };
  const short = ["1", "2", "3", "4", "5"].filter(k => !g[k] || g[k].n < 3);
  return { kind: ex.kind, got: ok, of: 15, need: 8, all: false, how: "選んだ問題で採点。各群3問・計15問中8問以上で合格" + (short.length ? "（" + short.map(k => k + "群").join("・") + "は3問に足りていません）" : "") };
}
function pastExamVerdict(log, N) {
  const r = pastExamScore(log, N);
  if (!r) return "";
  if (r.over) return r.over;
  return '<b>本番の採点なら' + (r.got >= r.need ? '合格' : '不合格') + '（' + r.got + '/' + r.of + '点）</b>　' + r.how + '。';
}
/* 過去問を通しで解いた回の点数の記録（年度ごと）。おまかせ・復習などで同じ問題を解いても、ここには入らない */
const MKEY = SPFX + "mock_v1";
let MOCKS = {};
try { MOCKS = JSON.parse(localStorage.getItem(MKEY) || "{}") || {}; } catch (e) { MOCKS = {}; }
/* 記録を始める前（2026-10-17 より前）に通しで解いた分を、1問ごとの解答履歴から一度だけ復元する。
   各問の最初の解答が確実に分かる年度（全問が「1回だけ解いた」「毎回正解」「毎回不正解」のどれか）だけ復元し、
   1問でも最初の正誤が分からない年度は復元しない（推測の点数を出さないため） */
function restoreOldMocks() {
  const MIG = SPFX + "mock_restored_v2";   // v2: 記録の不具合で入らなかった 2026-10-17 の回を拾うためにもう一度だけ復元する
  try { if (localStorage.getItem(MIG)) return; } catch (e) { return; }
  const byY = {};
  importedQuestions().forEach(function (q) { (byY[q.f] = byY[q.f] || []).push(q); });
  Object.keys(byY).forEach(function (k) {
    if (MOCKS[k] && MOCKS[k].length) return;
    const kind = k.split(" ")[1], list = byY[k];
    if ({ 専門: 35, 基礎: 30, 適性: 15 }[kind] !== list.length) return;
    let ts = 0; const first = [];
    for (let j = 0; j < list.length; j++) {
      const h = histOf(list[j]);
      if (!h || !h.n) return;
      if (h.ok === h.n) first.push(true);
      else if (h.ok === 0) first.push(false);
      else return;
      if (typeof h.ts === "number") ts = Math.max(ts, h.ts);
    }
    let got, of = kind === "専門" ? 25 : 15, need = kind === "専門" ? 13 : 8;
    if (kind === "基礎") {
      const g = {};
      list.forEach(function (q, j) { const gk = kisoGroup(q); g[gk] = (g[gk] || 0) + (first[j] ? 1 : 0); });
      got = Object.keys(g).reduce(function (t, gk) { return t + Math.min(3, g[gk]); }, 0);
    } else {
      got = first.filter(Boolean).length;
      if (kind === "専門") got = Math.min(got, 25);
    }
    MOCKS[k] = [{ t: ts || Date.now(), got: got, of: of, pass: got >= need, n: list.length, all: true, restored: true }];
  });
  try { localStorage.setItem(MKEY, JSON.stringify(MOCKS)); localStorage.setItem(MIG, "1"); } catch (e) {}
}
function saveMockScore(log, N) {
  const r = pastExamScore(log, N);
  if (!r) return;
  const key = Q[0].f;
  if (r.over) (MOCKS[key] = MOCKS[key] || []).push({ t: Date.now(), over: true, n: log.length, ok: log.filter(function (x) { return x.hit; }).length });
  else (MOCKS[key] = MOCKS[key] || []).push({ t: Date.now(), got: r.got, of: r.of, pass: r.got >= r.need, n: log.length, all: r.all,
    wrong: log.filter(function (x) { return !x.hit; }).map(function (x) { return (x.q.match(/^【[^】]*】/) || [""])[0]; }),
    // 選ばなかった（答えていない）問題も、あとで復習できるように番号を残す
    skip: Q.slice(0, N).filter(function (q, k) { return !answers[k]; }).map(function (q) { return (q.q.match(/^【[^】]*】/) || [""])[0]; }) });
  try { localStorage.setItem(MKEY, JSON.stringify(MOCKS)); } catch (e) {}
}
/* ---------- 合格までの道のり（本番日と期日の目安） ---------- */
/* 受験日はホーム画面から変更でき、この端末に保存する。未設定・壊れた値は既定日にフォールバック */
const EKEY = SPFX + (MODE === "一次" ? "" : "mode2_") + "exam_day";
function pad2(x) { return String(x).padStart(2, "0"); }
function ymd(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function mdLabel(d) { return (d.getMonth() + 1) + "/" + d.getDate(); }
function mdJp(d) { return (d.getMonth() + 1) + "月" + d.getDate() + "日"; }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
/* "YYYY-MM-DD" 以外・2/30のような存在しない日付はnullを返す（new Dateは繰り上げて解釈してしまうため） */
function parseYmd(s) {
  if (typeof s !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  const parts = s.split("-").map(Number);
  const y = parts[0], m = parts[1], dd = parts[2];
  const d = new Date(y, m - 1, dd);
  if (d.getFullYear() !== y || d.getMonth() !== m - 1 || d.getDate() !== dd) return null;
  return d;
}
const EXAM_DAY_DEFAULT = parseYmd(SUBJECT.examDayDefault);
function loadExamDay() {
  try {
    const d = parseYmd(localStorage.getItem(EKEY));
    if (d) return d;
  } catch (e) {}
  return new Date(EXAM_DAY_DEFAULT);
}
let EXAM_DAY = loadExamDay();
let RM_ROUND1, RM_RATE, RM_FINAL;
function computeRoadmapDates() {
  RM_ROUND1 = addDays(EXAM_DAY, -38);  // 全問1周
  RM_RATE = addDays(EXAM_DAY, -21);    // 正答率70%・測定分析の見直し
  RM_FINAL = addDays(EXAM_DAY, -14);   // 以降は苦手とブックマークだけ
}
computeRoadmapDates();
function setExamDay(s) {
  const d = parseYmd(s);
  if (!d) return false;
  EXAM_DAY = d;
  computeRoadmapDates();
  try { localStorage.setItem(EKEY, s); } catch (e) {}
  return true;
}
function todayMid() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function daysLeft() { return Math.round((EXAM_DAY - todayMid()) / 86400000); }
/* 正答率は「直近の解答で正解している問題の割合」。累計だと最初の失点をいつまでも引きずるため */
function progressNow() {
  const all = verifiedOnly(SETS.all);
  let done = 0, ok = 0, md = 0, mo = 0;
  all.forEach(function (q) {
    const h = histOf(q);
    if (!h) return;
    done++; if (h.last === 1) ok++;
    if (SUBJECT.focusField && q.f === SUBJECT.focusField) { md++; if (h.last === 1) mo++; }
  });
  return { total: all.length, done: done, rate: done ? ok / done : null, mRate: md ? mo / md : null };
}
function pct(x) { return x === null ? "—" : Math.round(x * 100) + "%"; }
let RM_ACTIONS = [];
/* 科目ごとの「迷ったときの絞り込み方」。設定がない科目には出さない */
function renderRoadmapTips() {
  const T = SUBJECT.roadmapTips;
  if (!T) return "";
  let steps = "";
  T.steps.forEach(function (x) {
    steps += '<li class=""><span class="d">' + x[0] + '</span><span class="t">' + x[1] + '</span><span class="v">' + x[2] + '</span></li>';
  });
  return '<details><summary>' + T.summary + '</summary><ol class="rm-steps">' + steps + '</ol>' +
    (T.note ? '<p class="rm-note">' + T.note + '</p>' : '') + '</details>';
}
function renderRoadmap() {
  const today = todayMid(), p = progressNow(), left = daysLeft();
  if (left < 0) return "";
  if (MODE !== "一次") return "";   // 道のりの目安は一次（4択・合格13問）向け
  const allDone = p.done >= p.total;
  const st = function (cls, word) { return { c: cls, w: word }; };
  const s1 = allDone ? st("done", "達成") : today > RM_ROUND1 ? st("late", "遅れ") : st("now", "いまここ");
  const s2 = (allDone && p.rate >= 0.7) ? st("done", "達成") : today > RM_RATE ? st("late", "遅れ") : allDone ? st("now", "いまここ") : st("todo", "");
  const s3 = today < RM_RATE ? st("todo", "")
    : (p.mRate !== null && p.mRate < 0.5) ? st("now", "絞る") : st("done", "不要");
  const s4 = today >= RM_FINAL ? st("now", "いまここ") : st("todo", "");
  const li = function (s, d, t, v) {
    return '<li class="' + s.c + '"><span class="d">' + d + '</span><span class="t">' + t +
      (s.w ? '<span class="st">' + s.w + '</span>' : '') + '</span>' + (v ? '<span class="v">' + v + '</span>' : '') + '</li>';
  };
  const tip = function (d, t, v) { return li({ c: "", w: "" }, d, t, v); };

  // 次にやること
  const weak = weakList(), freq = verifiedOnly(SETS.all).filter(function (q) { return whyOf(q).tier >= 2; });
  RM_ACTIONS = [];
  if (today >= RM_FINAL && weak.length) {
    RM_ACTIONS.push({ label: "苦手を解く", sub: weak.length + "問・直近でまちがえた／正答率6割未満", list: weak });
  } else if (!allDone) {
    const un = verifiedOnly(SETS.all).filter(function (q) { return !histOf(q); });
    RM_ACTIONS.push({ label: "まだ解いていない問題を解く", sub: "残り " + un.length + "問（頻出論点から先に出します）", list: un, limit: 20 });
  } else if (p.rate < 0.7) {
    const top = fieldStats().filter(function (r) { return r.loss !== null; })[0];
    if (top) RM_ACTIONS.push({ label: top.f + " を解く", sub: "いちばん点を落としている分野（正答率" + pct(top.rate) + "・" + (FIELD_WEIGHTS ? "本番で年" + top.weight + "問" : "収録の" + Math.round(top.weight * 100) + "%") + "）",
      list: verifiedOnly(SETS.all).filter(function (q) { return q.f === top.f; }) });
  } else if (weak.length) {
    RM_ACTIONS.push({ label: "苦手を解く", sub: weak.length + "問", list: weak });
  }
  if (freq.length) RM_ACTIONS.push({ label: "★ 頻出論点だけ解く", sub: freq.length + "問・過去7年で2回以上出た論点。まずここを固める", list: freq, ghost: true });

  let btns = "";
  RM_ACTIONS.forEach(function (a, k) {
    btns += '<button class="btn' + (a.ghost ? ' ghost' : '') + '" data-rm="' + k + '">' + a.label + '<span class="sub">' + a.sub + '</span></button>';
  });

  return '<div class="roadmap"><h3>合格までの道のり</h3>' +
    '<p class="rm-lead">本番まであと<b>' + left + '日</b>。' + (SUBJECT.roadmapLead || "") + '</p>' +
    '<details><summary>期日ごとの目安を見る</summary><ol class="rm-steps">' +
      li(s1, "〜" + mdLabel(RM_ROUND1), "全問を1周する", "解いた問題 " + p.done + " / " + p.total) +
      li(s2, "〜" + mdLabel(RM_RATE), "正答率を70%以上にする", "いま " + pct(p.rate) + "（直近の解答で正解している割合）") +
      (SUBJECT.focusField ? li(s3, mdLabel(RM_RATE), SUBJECT.focusField + "が50%未満なら、頻出論点だけに絞る", SUBJECT.focusField + " いま " + pct(p.mRate)) : "") +
      li(s4, mdLabel(RM_FINAL) + "〜", "新しい範囲は増やさず、苦手とブックマークだけを回す", "") +
      li(st(left === 0 ? "now" : "todo", left === 0 ? "今日" : ""), mdLabel(EXAM_DAY), "本番", "") +
    '</ol></details>' +
    renderRoadmapTips() +
    '<div class="rm-next"><p class="lab">次にやること</p>' + btns + '</div></div>';
}

      CUSTOM_LIST = list.slice(); CURRENT_SET = "custom";
      i = 0; correct = 0; log.length = 0; RESULT_SAVED = false; PARTIAL = false; answers.length = 0;

}

function choose(card, btn, origIdx) {
  if (answered) return;
  answered = true;
  const q = Q[i];
  const hit = origIdx === q.a;
  if (!inRetry()) {
    if (hit) correct++;
    recordAnswer(q, hit);
    log.push({ f: q.f, hit: hit, q: q.q, a: q.c[q.a] });
  } else if (retryWasSkipped(i)) recordAnswer(q, hit);   // 選ばなかった問題は初めて解くので記録する（点数は変えない）
  answers[i] = { pick: origIdx, hit: hit };
  saveSession();
  showVerdict(card, btn, hit, true);
}

/* 行列の表記 [[1,0,0],[a,1,0],[b,c,1]] を、本番の問題用紙と同じ「丸かっこで囲んだ縦並び」で表示する（2026-11-08）。
   過去問の基礎（Ⅰ-3-1 の逆行列・ヤコビ行列など）だけに出てくる。2行以上の [[…],[…]] だけを行列とみなす */
function mxRe() { return /\[(\[[^\[\]]*\](?:\s*,\s*\[[^\[\]]*\])+)\]/g; }
function mxRows(inner) {
  return inner.match(/\[[^\[\]]*\]/g).map(function (r) { return r.slice(1, -1).split(",").map(function (s) { return s.trim().replace(/-/g, "−"); }); });
}
/* セルの「-」は問題用紙と同じ「−」（マイナス記号）にする。
   文字として表示する場所（問題文・選択肢）用。セルも textContent で入れる */
function setMxText(el, text) {
  text = String(text == null ? "" : text);
  if (!mxRe().test(text)) { el.textContent = text; return; }
  el.textContent = "";
  let last = 0;
  text.replace(mxRe(), function (m, inner, off) {
    if (off > last) el.appendChild(document.createTextNode(text.slice(last, off)));
    const wrap = document.createElement("span"); wrap.className = "mx";
    const body = document.createElement("span"); body.className = "mxb";
    mxRows(inner).forEach(function (r) {
      const row = document.createElement("span"); row.className = "mxr";
      r.forEach(function (c) { const cell = document.createElement("span"); cell.className = "mxc"; cell.textContent = c; row.appendChild(cell); });
      body.appendChild(row);
    });
    wrap.appendChild(body); el.appendChild(wrap);
    last = off + m.length;
    return m;
  });
  if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
}
/* HTMLとして組み立てる場所（解説）用 */
function mxHtml(html) {
  return String(html).replace(mxRe(), function (m, inner) {
    return '<span class="mx"><span class="mxb">' + mxRows(inner).map(function (r) {
      return '<span class="mxr">' + r.map(function (c) { return '<span class="mxc">' + c + '</span>'; }).join("") + '</span>';
    }).join("") + '</span></span>';
  });
}

/* 専門外の人向けの「やさしい解説」。問題文をキーに別ファイル（easy.js の EASY_NOTES）から引く */
function easyHtml(q) {
  // 取り込んだ過去問は、解説を取り込みファイルの中（q.e）に持つ（本文を公開しないため）
  const t = ((window.EASY_NOTES && window.EASY_NOTES[q.q]) || q.e || "").replace(/<b>(ひとことで|用語|解き方|考え方|覚え方)<\/b>\s*/g, '<span class="ezh">$1</span>')
    .replace(/<b>今の状況<\/b>\s*/g, '<span class="ezh now">今の状況（過去問の当時から変わったか）</span>')
    // 文中に続けて書かれた手順（②③…）と選択肢ごとの理由（・2番：…）は、文の切れ目で改行して読みやすくする
    .replace(/([。）)])\s*(?=[②-⑳])/g, '$1<br>')
    .replace(/。\s*(?=・[1-5①-⑤]番)/g, '。<br>')
    // (ア)〜(オ)の記述ごとの判定と、最後のまとめ（「正しいのは…」など）も文の切れ目で改行する
    .replace(/。\s*(?=[（(][ア-オ][)）])/g, '。<br>')
    .replace(/。\s*(?=(正しいのは|誤っているのは|不適切なのは|適切なのは|したがって|よって|以上から|以上より))/g, '。<br>');
  return t ? '<div class="easy"><div class="easyh">やさしい解説</div><div class="easyb">' + mxHtml(t) + '</div></div><div class="vnoteh">詳しい解説（出典つき）</div>' : "";
}
function showVerdict(card, btn, hit, focusNext) {
  const q = Q[i];
  card.querySelectorAll(".ch").forEach(b => {
    b.disabled = true;
    const oi = Number(b.dataset.orig);
    if (oi === q.a) b.classList.add("ok");
    else if (b === btn) b.classList.add("ng");
    else b.classList.add("dim");
  });
  const dkb = card.querySelector(".dk");
  const unknown = !!btn && btn === dkb;
  if (dkb) { dkb.disabled = true; if (unknown) dkb.classList.add("on"); else dkb.hidden = true; }

  const oldNav = card.querySelector(".nav");
  if (oldNav) oldNav.remove();

  const v = document.createElement("div");

/* ---------- おまかせ出題（忘却曲線にもとづく復習日の管理） ---------- */
const DAY = 86400000;
// 連続正解数ごとの、次の復習までの日数。まちがえたら翌日。本番まで約2か月なので最長30日
const SR_DAYS = [1, 2, 4, 7, 14, 30];
const MASTERY = ["未学習", "要復習", "学習中", "定着", "完璧"];
function dayStart(t) { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function srSchedule(h, now) {
  h.ts = now;
  let d = SR_DAYS[Math.min(h.st || 0, SR_DAYS.length - 1)];
  // 本番の2日前までに必ず一度は復習が回るよう、間隔を本番までの残り日数で頭打ちにする
  const left = Math.round((EXAM_DAY - dayStart(now)) / DAY);
  if (left > 2) d = Math.min(d, left - 2);
  h.due = dayStart(now) + d * DAY;
}
/* 解いた日時を持たない古い履歴：まちがえた問題は今日が復習日、正解した問題は今日解いたものとして扱う */
function migrateSR() {
  let changed = false;
  const now = Date.now();
  Object.keys(HIST).forEach(function (k) {
    const h = HIST[k];
    if (typeof h.due === "number") return;
    h.st = h.last === 1 ? (h.ok === h.n ? Math.min(h.ok, 2) : 1) : 0;
    if (h.last === 1) srSchedule(h, now); else { h.ts = now; h.due = dayStart(now); }
    changed = true;
  });
  if (changed) saveHist();
}
migrateSR();
function isDue(h, today) { return !!h && typeof h.due === "number" && h.due <= today; }
function dueList() {

/* 習熟度：0未学習 1要復習（直近まちがえた／正答率6割未満） 2学習中 3定着（3回連続正解） 4完璧（5回連続正解） */
function mastery(q) {
  const h = histOf(q);
  if (!h) return 0;
  if (h.last === 0 || h.ok / h.n < 0.6) return 1;
  const st = h.st || 0;
  return st >= 5 ? 4 : st >= 3 ? 3 : 2;
}

/* 出題の順：①復習日を過ぎた問題（古い順・習熟度の低い順） ②まだ解いていない問題（頻出論点から） ③期限前でも習熟度の低い問題 */
function autoPick(n) {
  const today = dayStart(Date.now());
  const all = autoBase();
  let pick = all.filter(function (q) { return isDue(histOf(q), today); }).sort(function (a, b) {
    return histOf(a).due - histOf(b).due || mastery(a) - mastery(b) || whyOf(b).rank - whyOf(a).rank;
  }).slice(0, n);
  if (pick.length < n) {
    const fresh = [];
    [5, 4, 3, 2, 1].forEach(function (r) {
      fresh.push.apply(fresh, shuffled(all.filter(function (q) { return !histOf(q) && whyOf(q).rank === r; })));
    });
    pick = pick.concat(fresh.slice(0, n - pick.length));
  }
  if (pick.length < n) {
    const ahead = all.filter(function (q) { const h = histOf(q); return h && !isDue(h, today); }).sort(function (a, b) {
      return mastery(a) - mastery(b) || histOf(a).due - histOf(b).due;

}

/* 取り込んだ過去問の図（q.img＝data URI）は容量が大きいので localStorage ではなく IndexedDB に分けて置く */
const IMGDB = {
  db: null,
  open: function () {
    const self = this;
    return new Promise(function (res, rej) {
      if (self.db) return res(self.db);
      if (!window.indexedDB) return rej(new Error("no idb"));
      const r = indexedDB.open("gq_imgs", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("img"); };
      r.onsuccess = function () { self.db = r.result; res(self.db); };
      r.onerror = function () { rej(r.error); };
    });
  },
  put: function (k, v) {
    return this.open().then(function (db) {
      return new Promise(function (res, rej) {
        const t = db.transaction("img", "readwrite");
        t.objectStore("img").put(v, k);
        t.oncomplete = function () { res(); };
        t.onerror = function () { rej(t.error); };
      });
    });
  },
  get: function (k) {
    return this.open().then(function (db) {
      return new Promise(function (res) {
        const r = db.transaction("img").objectStore("img").get(k);
        r.onsuccess = function () { res(r.result || null); };
        r.onerror = function () { res(null); };
      });
    }).catch(function () { return null; });
  }
};

/* 過去問の記述を1つずつ○×で判定する問題を作る（2026-11-22）。
   本番では同じ問題が使い回され、誤りの選択肢だけが別の場所に移ることがある（R8専門 Ⅲ-2・24・26 で去年誤りだった選択肢を選んで失点）。
   「この問題の答えは〇番」ではなく、記述ごとに正誤を判断できるかを練習する。
   対象は「適切／不適切なものはどれか」の記述問題だけ（組合せ・数・並べ替え・計算は除く） */
const CIRC = ["①", "②", "③", "④", "⑤"];
function oxItems(list) {
  const out = [];
  list.forEach(function (q) {
    const tag = (q.q.match(/^【([^】]*)】/) || [])[1];
    if (!tag || !Array.isArray(q.c) || q.c.length < 4 || typeof q.a !== "number") return;
    const stem = q.q.replace(/^【[^】]*】/, "").split("<br>")[0];
    if (!/(適切|妥当|正しい|誤っている|誤り)(な|の)?もの/.test(stem)) return;
    if (/組合せ|組み合わせ|の数|順|並べ|値|式|どれだけ|いくら|何/.test(stem)) return;
    if (!q.c.every(function (c) { return String(c).length >= 15 && !/→|^[○×\s　]+$/.test(c); })) return;
    const wrongAsked = /不適切|妥当でない|誤っている|誤り/.test(stem);
    let topic = stem.replace(/(次の|以下の)?(記述|説明)?のうち.*$/, "").replace(/に関する$/, "").trim();
    if (topic.length > 50) topic = "…" + topic.slice(-45);   // 長い前置き（規格名など）は削り、末尾のテーマを残す
    const grp = (q.f || "").split(" ")[1] || "";
    const year = (q.f || "").split(" ")[2] || "";
    q.c.forEach(function (c, k) {
      const ok = wrongAsked ? k !== q.a : k === q.a;
      const item = {
        f: "○× " + grp + " " + year,
        q: "【○× " + tag + " " + CIRC[k] + "】" + (topic ? topic + "について" : "") + "<br>" + c + "<br>この記述は正しいか。",
        c: ["正しい（○）", "誤り（×）"],
        a: ok ? 0 : 1,
        n: "<b>この記述は" + (ok ? "正しい（○）" : "誤り（×）") + "</b>。元の問題は【" + tag + "】（" + (wrongAsked ? "不適切" : "適切") + "なものを選ぶ問題・正答は" + CIRC[q.a] + "）。<br>" + (q.n || ""),
        e: q.e || ""
      };
      if (q.img) item.img = q.img;
      out.push(item);
    });
  });
  return out;
}

let LIMIT = 0;              // 0 = 全問

try { INCLUDE_UNVERIFIED = localStorage.getItem(SPFX + "inc_unverified") === "1"; } catch (e) {}
function verifiedOnly(list) {

      : "一次資料または公開正答表で裏を取った <b>" + (all.length - unv) + "問</b> だけを出題しています（未検証の" + unv + "問は除外）。";
  }

/* その場でシャッフル（Fisher-Yates）。同じ並びで覚えてしまうのを防ぐ */
function shuffled(list) {
  const a = list.slice();
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    const t = a[k]; a[k] = a[j]; a[j] = t;
  }
  return a;
}
/* 絞り込むときは「未回答 → 直近誤答 → 正答率が低い順」で拾い、拾ったあとに順番を混ぜる */
function pickQuestions(list) {
  if (!LIMIT || list.length <= LIMIT) return shuffled(list);
  const base = shuffled(list);                     // 同点のときの並びも毎回変える
  const scored = base.map(function (q, idx) {
    const h = histOf(q);
    let s;
    if (!h) s = 0;
    else if (h.last === 0) s = 1;
    else s = 2 + (h.ok / h.n);
    return { q: q, s: s, idx: idx };
  });
  // 同じ優先度（未回答どうし等）なら、出題実績のある論点から拾う
  scored.sort(function (a, b) { return a.s - b.s || whyOf(b.q).rank - whyOf(a.q).rank || a.idx - b.idx; });
  return shuffled(scored.slice(0, LIMIT).map(function (x) { return x.q; }));
}
function rebuild() {
  const picked = pickQuestions(baseList());
  if (!picked.length) return false;
  Q.length = 0; RETRY_FROM = -1; picked.forEach(function (q) { Q.push(q); });
  i = 0; correct = 0; log.length = 0; RESULT_SAVED = false; PARTIAL = false; answers.length = 0;
  const host = document.getElementById("resumeHost");
  if (host) host.innerHTML = "";
  clearSession();
  updatePickInfo();
  updateUnvUI();
  render();
  return true;
}

}

/* 「頻出」は出題年が2年以上ある論点だけ。同じ年に2問出ただけのものは数えない */
function yearsOf(t) {
  const s = {};

// 白書・統計の数値問題は解説に過去問番号を持たないので、分野名で毎年出る廃棄物テーマに結びつける

  let t = null;
  cs.forEach(function (c) {

    if (x && (!t || yearsOf(x) > yearsOf(t))) t = x;
  });
  if (!t && SUBJECT.wasteSet && SETS[SUBJECT.wasteSet] && SETS[SUBJECT.wasteSet].indexOf(q) >= 0 && WASTE_TOPIC[q.f]) t = WASTE_TOPIC[q.f];
  const jm = (q.n || "").match(/〔出題実績:\s*([^〕]*)〕/);
  const jis = jm ? jm[1].split("、").map(function (c) { return c.trim(); }).filter(function (c) { return /^R\d/.test(c); }) : [];
  // 論点単位の記録が薄い分野（適性など）は、分野としての出題年数で頻出を判定する（4年以上＝毎年の過半）

  let w;
  if (t) {
    const y = yearsOf(t);
    w = { tier: y >= 3 ? 3 : 2, rank: y >= 3 ? 5 : 4, years: y, topic: t, same: t.flag === "選択肢が同一", label: "過去7年で" + y + "回出題" };

    w = { tier: 0, rank: 3, once: uniq, label: "" };
  } else if (jis.length || fieldHot) {
    const ys = {};
    jis.forEach(function (c) { ys[c.split(/\s+/)[0]] = 1; });
    const y = Object.keys(ys).length;
    if (y >= 2 && y >= fy.length) w = { tier: y >= 3 ? 3 : 2, rank: y >= 3 ? 5 : 4, years: y, topic: { cites: jis, note: "" }, same: false, label: "過去7年で" + y + "回出題" };
    else if (fieldHot) w = { tier: 3, rank: 5, years: fy.length, topic: { cites: fy, note: "分野としての出題年数です。この論点そのものが出たとは限りません。" + (jis.length ? "論点が近い過去問: " + jis.join("・") + "。" : "") }, same: false, label: "分野は過去7年で" + fy.length + "回出題" };

function fieldStats() {

function segTableHtml() {

    const rate = ans.length ? Math.round(ok / ans.length * 100) : null;
    const done = list.length ? Math.round(ans.length / list.length * 100) : 0;
    const w = list.filter(function (q) { return weakSet.has(q); }).length;
    const rc = rate === null ? "" : rate >= 70 ? " good" : rate < 50 ? " bad" : "";
    return '<tr class="' + (head ? "gh" : "") + '"><td>' + label + '</td>' +
      '<td>' + ans.length + '/' + list.length + '<span class="segbar"><i style="width:' + done + '%"></i></span></td>' +
      '<td class="rate' + rc + '">' + (rate === null ? "—" : rate + "%") + '</td>' +
      '<td>' + (w || "") + '</td></tr>';
  }
  let rows = "", fields = "";
  SEG_FIELDS = []; SEG_MOCK = [];

    const sets = SUBJECT.sets.filter(function (d) { return !g || d.group === g; });
    const all = [].concat.apply([], sets.map(function (d) { return SETS[d.key]; }));
    function withRun(html, list) {
      const k = SEG_FIELDS.push(list) - 1;

    }
    if (g) rows += withRun(row(g, all, true), all);
    sets.forEach(function (d) { rows += withRun(row(d.label, SETS[d.key], false), SETS[d.key]); });
    // 分野（f）ごと：手をつけていない割合が大きい順、同じなら正答率が低い順
    const byF = {};
    all.forEach(function (q) { (byF[q.f] = byF[q.f] || []).push(q); });
    const fl = Object.keys(byF).map(function (f) {
      const list = byF[f];
      const ans = list.filter(function (q) { return histOf(q); });
      const ok = ans.filter(function (q) { return histOf(q).last === 1; }).length;
      return { f: f, list: list, un: 1 - ans.length / list.length, rate: ans.length ? ok / ans.length : -1 };
    }).sort(function (a, b) { return (b.un - a.un) || (a.rate - b.rate); });

    fl.forEach(function (x) {
      const k = SEG_FIELDS.push(x.list) - 1;

    const nLow = fl.filter(function (x) { return x.rate >= 0 && x.rate < 0.5; }).length;
    const gk = g || "all";
    fields += '<details class="segf" data-g="' + gk + '"' + (SEGF_OPEN[gk] ? " open" : "") + '><summary>' + (g ? g + "の" : "") + '分野別　<span class="segsum">' + fl.length + '分野中 手つかず' + nUn + '・50%未満' + nLow + '</span></summary>' +
      '<table class="seg"><thead><tr><th></th><th>着手</th><th>正答率</th><th>苦手</th><th></th></tr></thead><tbody>' + fr + '</tbody></table></details>';
  });
  // 取り込んだ本番の過去問：年度ごとに問題番号順で通しで解く（模試用）
  let mock = "";
  const imp = importedQuestions();
  if (imp.length) {
    const byY = {};
    imp.forEach(function (q) { (byY[q.f] = byY[q.f] || []).push(q); });
    const order = { "専門": 0, "基礎": 1, "適性": 2 };
    const keys = Object.keys(byY).sort(function (a, b) {
      const pa = a.split(" "), pb = b.split(" ");
      return ((pa[1] in order ? order[pa[1]] : 9) - (pb[1] in order ? order[pb[1]] : 9)) || (parseInt((pb[2] || "").replace(/\D/g, ""), 10) - parseInt((pa[2] || "").replace(/\D/g, ""), 10));
    });
    function numKey(q) { const m = (q.q.match(/^【[^】]*】/) || [""])[0].match(/\d+/g) || []; return m.slice(1).map(function (x) { return ("000" + x).slice(-3); }).join("-"); }
    let mr = "";
    const allRec = [], sortedBy = {};
    keys.forEach(function (k) {
      const list = byY[k].slice().sort(function (a, b) { return numKey(a) < numKey(b) ? -1 : numKey(a) > numKey(b) ? 1 : 0; });
      const idx = SEG_MOCK.push(list) - 1;
      sortedBy[k] = list;
      // 点数は「通しで解く」で最後まで解いた回の記録だけから出す（おまかせ・復習で同じ問題を解いた分は入れない）
      const rec = MOCKS[k] || [], last = rec[rec.length - 1];
      const pc = last && !last.over ? Math.round(last.got / last.of * 100) : null;
      mr += '<tr><td>' + k.replace(/^過去問 /, "") + '</td>' +
        '<td>' + (!last ? "—" : last.over ? "超過" : last.got + '/' + last.of) + '</td>' +
        '<td class="rate' + (last ? (last.pass ? " good" : " bad") : "") + '">' + (pc === null ? "—" : pc + "%") + '</td>' +
        '<td>' + (rec.length || "") + '</td>' +
        '<td><button class="segrun mock" data-mock="' + idx + '">通しで解く</button></td></tr>';
      rec.forEach(function (x) { allRec.push({ k: k, x: x }); });
    });
    allRec.sort(function (a, b) { return b.x.t - a.x.t; });
    const recHtml = allRec.length ? '<details class="segf mockrec"' + (SEGF_OPEN.mockrec ? " open" : "") + ' data-g="mockrec"><summary>通しで解いた記録　<span class="segsum">' + allRec.length + '回</span></summary><table class="seg"><thead><tr><th>日付</th><th></th><th>点数</th><th>合否</th><th></th></tr></thead><tbody>' +
      allRec.map(function (r) {
        const d = new Date(r.x.t);
        // その回に間違えた問題だけを、あとから解き直せるボタン（記録を始めた後の回だけ）
        // 選ばなかった問題（r.x.skip）も一緒に解き直す。問題番号の順に並べる
        const ws = new Set((r.x.wrong || []).concat(r.x.skip || []));
        const nw = (r.x.wrong || []).length, ns = (r.x.skip || []).length;
        const wl = (sortedBy[r.k] || []).filter(function (q) { return ws.has((q.q.match(/^【[^】]*】/) || [""])[0]); });
        const wbtn = wl.length ? '<button class="segrun mock" data-mock="' + (SEG_MOCK.push(wl) - 1) + '">' +
          (ns ? '間違い' + nw + '・選ばず' + ns : '間違えた' + wl.length + '問') + '</button>' : '';
        return '<tr><td>' + (d.getMonth() + 1) + '/' + d.getDate() + '</td><td>' + r.k.replace(/^過去問 /, "") + '</td><td>' + (r.x.over ? '規定数超過<span class="mocksel">（' + r.x.n + '問解答・' + r.x.ok + '問正解）</span>' : r.x.got + '/' + r.x.of + (r.x.restored ? '<span class="mocksel">（復元）</span>' : r.x.all ? "" : '<span class="mocksel">（' + r.x.n + '問選択）</span>')) + '</td><td class="rate ' + (r.x.pass ? "good" : "bad") + '">' + (r.x.over ? "超過" : r.x.pass ? "合格" : "不合格") + '</td><td>' + wbtn + '</td></tr>';
      }).join("") + '</tbody></table></details>' : "";
    mock = '<h3 class="segh">本番の過去問（取り込んだ分）</h3>' +
      '<table class="seg"><thead><tr><th></th><th>最新の点</th><th>得点率</th><th>回数</th><th></th></tr></thead><tbody>' + mr + '</tbody></table>' +
      '<p class="segnote">点数は「通しで解く」で最後まで解いた回だけの記録です（本番の採点どおり：専門25点・基礎15点・適性15点、50%以上で合格。緑＝合格・赤＝不合格）。おまかせや復習で同じ問題を解いても変わりません。</p>' + recHtml +
      '<p class="segnote">「通しで解く」は問題番号の順に全問出します（模試用・選択肢も原本の順）。本番の時間の目安：基礎・適性 各1時間、専門 2時間。</p>';
  }
  return '<h3 class="segh">科目・セットごとの取り組み</h3>' +
    '<table class="seg"><thead><tr><th></th><th>着手</th><th>正答率</th><th>苦手</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<p class="segnote">正答率＝解いた問題のうち直近の解答が正解の割合。緑は70%以上（アプリの目標）、赤は50%未満。</p>' +
    fields +
    '<p class="segnote">「解く」はその科目・セット・分野だけで出題します（まだ解いていない問題と苦手を優先）。</p>' + mock;
}
let SEG_MOCK = [];

function renderHistory() {
  const p = document.getElementById("pane-hist");
  const all = SETS.all;
  const L = lifetimeStats();
  const answered = all.filter(function (q) { return histOf(q); });
  const weak = weakList();

  let list = all.map(function (q) { return { q: q, h: histOf(q) }; });
  if (HFILTER === "miss") list = list.filter(function (r) { return r.h && (r.h.last === 0 || r.h.ok / r.h.n < 0.6); });
  else if (HFILTER === "none") list = list.filter(function (r) { return !r.h; });
  else if (HFILTER === "bm") list = list.filter(function (r) { return isBookmarked(r.q); });
  else if (HFILTER === "memo") list = list.filter(function (r) { return !!memoOf(r.q); });
  const nBm = all.filter(isBookmarked).length;
  const nMemo = all.filter(function (q) { return !!memoOf(q); }).length;
  // 正答率が低い順、未回答は末尾
  list.sort(function (a, b) {
    if (!a.h && !b.h) return 0;
    if (!a.h) return 1;
    if (!b.h) return -1;
    return (a.h.ok / a.h.n) - (b.h.ok / b.h.n);
  });

  let rows = "";
  list.forEach(function (r) {
    const h = r.h;
    const cls = !h ? "none" : (h.last === 0 ? "miss" : "");

    const bad = h && pct < 60 ? " bad" : "";

      '<div>着手<b>' + answered.length + ' / ' + all.length + '</b></div>' +

    dailyHtml() + segTableHtml() +

    '<div class="filters">' +
      '<button class="flt" data-f="miss" aria-pressed="' + (HFILTER === "miss") + '">間違えた問題</button>' +
      '<button class="flt" data-f="all" aria-pressed="' + (HFILTER === "all") + '">すべて</button>' +
      '<button class="flt" data-f="none" aria-pressed="' + (HFILTER === "none") + '">未回答</button>' +
      '<button class="flt" data-f="bm" aria-pressed="' + (HFILTER === "bm") + '">★ ブックマーク ' + nBm + '</button>' +
      '<button class="flt" data-f="memo" aria-pressed="' + (HFILTER === "memo") + '">メモあり ' + nMemo + '</button>' +
    '</div>' +
    (list.length
      ? '<div class="hact"><button class="btn" id="solveThese">この ' + list.length + '問を解く</button>' +
        (L.answers ? '<button class="reset" id="resetHist2">履歴をリセット</button>' : '') + '</div>' + rows
      : '<p class="empty">' + (HFILTER === "miss"
          ? "間違えた問題はありません。まだ解いていない場合は「未回答」から始めてください。"
          : HFILTER === "none" ? "すべての問題に一度は解答済みです。"
          : HFILTER === "bm" ? "ブックマークした問題はありません。クイズ画面で問題の右上の「☆ ブックマーク」を押すと、ここに集まります。"
          : HFILTER === "memo" ? "メモを書いた問題はありません。クイズ画面で問題の右上の「メモ」から書けます。"
          : "履歴がありません。") + '</p>')
    + '</details>'
    + renderDiagnosis() + renderBackup() + renderDataManager();

  // 問題文・メモは利用者の入力を含むので textContent で入れる
  p.querySelectorAll(".hrow").forEach(function (row, idx) {
    const r = list[idx];
    if (!r) return;
    row.querySelector(".hq").textContent = r.q.q.replace(/<br>/g, "\n");
    const m = memoOf(r.q);
    if (m) {
      const d = document.createElement("div");
      d.className = "hmemo";
      d.textContent = m;
      row.appendChild(d);
    }
  });

  p.querySelectorAll(".flt").forEach(function (b) {
    b.addEventListener("click", function () { HFILTER = b.dataset.f; HLIST_OPEN = true; renderHistory(); });
  });
  const hl = p.querySelector(".hlist");
  if (hl) hl.addEventListener("toggle", function () { HLIST_OPEN = hl.open; });
  p.querySelectorAll(".segf").forEach(function (d) {
    d.addEventListener("toggle", function () { SEGF_OPEN[d.dataset.g] = d.open; });
  });
  p.querySelectorAll(".segrun.mock").forEach(function (b) {
    b.addEventListener("click", function () {
      const list = SEG_MOCK[Number(b.dataset.mock)];
      if (!list || !list.length) return;
      Q.length = 0; RETRY_FROM = -1; list.forEach(function (q) { Q.push(q); });
      CUSTOM_LIST = list.slice(); CURRENT_SET = "custom";
      i = 0; correct = 0; log.length = 0; RESULT_SAVED = false; PARTIAL = false; answers.length = 0;
      document.querySelectorAll(".set").forEach(function (o) { o.setAttribute("aria-pressed", "false"); });
      selectTab("quiz");
      FROM_HIST = true;
      const pi = document.getElementById("pickinfo");
      if (pi) pi.textContent = "";
      saveSession(); render();
    });
  });
  p.querySelectorAll(".segrun:not(.mock)").forEach(function (b) {
    b.addEventListener("click", function () {
      const list = SEG_FIELDS[Number(b.dataset.seg)];
      if (!list || !list.length) return;
      CUSTOM_LIST = list.slice();
      CURRENT_SET = "custom";
      document.querySelectorAll(".set").forEach(function (o) { o.setAttribute("aria-pressed", "false"); });
      selectTab("quiz");
      FROM_HIST = true;
      rebuild();

  });
  const st = p.querySelector("#solveThese");
  if (st) st.addEventListener("click", function () {
    CUSTOM_LIST = list.map(function (r) { return r.q; });
    CURRENT_SET = "custom";
    document.querySelectorAll(".set").forEach(function (o) { o.setAttribute("aria-pressed", "false"); });
    selectTab("quiz");
    FROM_HIST = true;
    rebuild();
  });
  wireBackup(p);
  wireDataManager(p);
  const cd = p.querySelector("#copyDiag");
  if (cd) cd.addEventListener("click", function () {
    const txt = diagnosisText();
    const msg = p.querySelector("#copyMsg");
    function done() { msg.textContent = "コピーしました。Claudeに貼れます"; setTimeout(function () { msg.textContent = ""; }, 4000); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      const ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { msg.textContent = "コピーできませんでした"; }
      document.body.removeChild(ta);

  });
  const rh2 = p.querySelector("#resetHist2");
  if (rh2) rh2.addEventListener("click", function () {
    if (!confirm("これまでの解答履歴をすべて削除します。よろしいですか。")) return;

          const t = document.createElement("textarea");
          t.innerHTML = el.innerHTML.replace(/<(br|\/p|\/div|\/h\d|\/li)[^>]*>/gi, "。").replace(/<[^>]+>/g, "");
          return t.value.replace(/([。．])\s*。+/g, "$1").replace(/^。+/, "");
        };
        const txt = k === "q" ? part(".rdq") : k === "sk" ? part(".rdf.sk .rdb") : k === "ans" ? part(".rdf.ans .rdb")
          : "問題。" + part(".rdq") + "。骨子。" + part(".rdf.sk .rdb") + "。解答例。" + part(".rdf.ans .rdb");
        speak(txt);
      });
    });
  }
  p.querySelectorAll(".rdmark").forEach(function (b) {
    b.addEventListener("click", function () {
      const id = b.closest(".rd").dataset.id, l = readLog();
      if (l[id]) delete l[id]; else l[id] = ymd(new Date());
      try { localStorage.setItem(RKEY, JSON.stringify(l)); } catch (e) {}
      renderReading();
      const again = p.querySelector('.rd[data-id="' + id + '"]');
      if (again) again.open = true;
    });
  });
}

/* 答案の読み上げ（端末の音声合成。通信不要）。長い文はiPhoneで途中で切れることがあるので、句点ごとに分けて順に読む */
const TTS_OK = typeof window !== "undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
function ttsRate() { const r = parseFloat((function () { try { return localStorage.getItem(SPFX + "tts_rate"); } catch (e) { return null; } })()); return r > 0 ? r : 0.85; }   // iPhoneは1倍でも速めに聞こえるので、既定は0.85
function speak(text) {
  // iPhoneでは、読んでいないのに cancel() した直後の speak() が無音になることがあるので、読み上げ中のときだけ止める
  if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  speechSynthesis.resume();
  const clean = text
    .replace(/【出典】[\s\S]*$/, "")             // 出典のURLは読まない
    .replace(/https?:\/\/\S+/g, "")
    .replace(/[→⇒]/g, "、").replace(/[／/]/g, "、").replace(/[・]/g, "、")
    .replace(/\s+/g, " ").trim();
  const parts = clean.split(/(?<=[。．！？])/).reduce(function (acc, t) {
    t = t.trim(); if (!t) return acc;
    if (acc.length && (acc[acc.length - 1] + t).length < 120) acc[acc.length - 1] += t; else acc.push(t);
    return acc;
  }, []);
  const voice = speechSynthesis.getVoices().filter(function (v) { return /^ja/.test(v.lang); })[0];
  const rate = ttsRate();
  parts.forEach(function (t) {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "ja-JP"; u.rate = rate; if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  });
}
function readImportHtml() {
  const rows = Object.keys(READ_IMP).sort().map(function (k) {
    return '<div class="impitem"><span>' + READ_IMP[k].label + '</span><span class="n2">' + READ_IMP[k].items.length + '問</span><button data-rdel="' + k + '">削除</button></div>';
  }).join("");
  return '<div class="datamgr"><h3>過去問の読み込み</h3><p>過去問の問題文は技術士会の著作物なので、公開サイトには置いていません。' +
    'Googleドライブの「技術士過去問」にあるファイル（past_nijishi_*.json）を選ぶと、<b>この端末の中だけ</b>に保存されます。</p>' +
    '<div class="imp"><label class="impfile" for="rdImpFile">JSONファイルを選ぶ</label><input type="file" id="rdImpFile" accept="application/json,.json"><span class="impmsg" id="rdImpMsg"></span></div>' +
    (rows ? '<div style="margin-top:1rem">' + rows + '</div>' : '') + '</div>';
}
function wireReadImport(p) {
  const f = p.querySelector("#rdImpFile");
  if (f) f.addEventListener("change", function () {
    const file = f.files && f.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = function () {
      const msg = document.getElementById("rdImpMsg");
      let d = null;
      try { d = JSON.parse(r.result); } catch (e) { msg.className = "impmsg ng"; msg.textContent = "JSONとして読めませんでした"; return; }
      const err = validateReadImport(d);
      if (err) { msg.className = "impmsg ng"; msg.textContent = err; return; }
      READ_IMP[d.id] = { label: d.label, items: d.items, guides: Array.isArray(d.guides) ? d.guides : [] };
      try { localStorage.setItem(RIKEY, JSON.stringify(READ_IMP)); } catch (e) { msg.className = "impmsg ng"; msg.textContent = "端末の保存領域が足りません"; return; }
      renderReading();
      const m2 = document.getElementById("rdImpMsg");
      if (m2) { m2.className = "impmsg ok"; m2.textContent = d.label + " を " + d.items.length + "問 読み込みました"; }
    };
    r.readAsText(file);
  });
  p.querySelectorAll("[data-rdel]").forEach(function (b) {
    b.addEventListener("click", function () {
      if (!confirm(READ_IMP[b.dataset.rdel].label + " を削除します。よろしいですか。")) return;
      delete READ_IMP[b.dataset.rdel];
      try { localStorage.setItem(RIKEY, JSON.stringify(READ_IMP)); } catch (e) {}
      renderReading();
    });
  });
}

/* ---------- タブ ---------- */
const PANES = { quiz: "pane-quiz", topics: "pane-topics", hist: "pane-hist" };
const TABS  = { quiz: "tab-quiz",  topics: "tab-topics",  hist: "tab-hist"  };
if (!HAS_TOPICS) {
  document.getElementById(TABS.topics).remove();
  document.getElementById(PANES.topics).remove();
  delete PANES.topics; delete TABS.topics;
}
function selectTab(which) {
  Object.keys(PANES).forEach(function (k) {
    document.getElementById(PANES[k]).hidden = (k !== which);
    document.getElementById(TABS[k]).setAttribute("aria-selected", String(k === which));
  });
  if (which === "topics") { if (MODE === "二次" && READ) renderReading(); else renderTopics(); }
  if (which === "hist") renderHistory();
  window.scrollTo({ top: 0, behavior: "instant" });
}
Object.keys(TABS).forEach(function (k) {
  document.getElementById(TABS[k]).addEventListener("click", function () {
    if (k === "quiz" && !document.getElementById("pane-quiz").hidden && !AT_HOME) { goHome(); return; }
    selectTab(k);
  });
});

refreshImportedSet();
restoreOldMocks();
renderCountdown();
updateUnvUI();
refreshWeakBtn();
(function boot() {
  if (!STORAGE_OK) {
    document.getElementById("resumeHost").innerHTML =
      '<div class="nostore"><b>この端末では学習履歴を保存できません。</b>' +
      'プライベートブラウズを使っている場合は通常のウィンドウで開いてください。' +
      '履歴・進捗ともにページを閉じると消えます。</div>';
  }
  const sv = loadSession();
  if (sv) {
    CURRENT_SET = sv.set;
    LIMIT = sv.limit;
    document.querySelectorAll(".lim").forEach(function (o) {
      o.setAttribute("aria-pressed", String(Number(o.dataset.lim) === LIMIT));
    });
    Q.length = 0; RETRY_FROM = -1; sv.list.forEach(function (q) { Q.push(q); });
    i = sv.i; correct = sv.correct; RETRY_FROM = sv.retry;
    answers.length = 0; sv.answers.forEach(function (a, idx) { answers[idx] = a; });
    // 途中から再開した回でも、結果画面の採点（過去問の合否・点数の記録）が最初からの解答で数えられるよう、解答の一覧を作り直す
    log.length = 0; RESULT_SAVED = !!sv.saved;
    for (let k = 0; k < origCount(); k++) if (answers[k]) log.push({ f: Q[k].f, hit: answers[k].hit, q: Q[k].q, a: Q[k].c[Q[k].a] });
    if (SETS[sv.set] || sv.set === "weak" || sv.set === "bm" || sv.set === "auto") applySetButtons(sv.set); else applySetButtons("__none__");
    updatePickInfo();
    showResume(sv.i, Q.length);
    render();
  } else {
    Q.length = 0; RETRY_FROM = -1;   // 初期値のまま「続きから」が出ないように
    goHome();       // 解きかけの回がないときは、道のりと出題範囲を選ぶ画面から始める
  }
})();

/* ---------- 一次／二次の切り替えスイッチ（ヘッダーの一番上） ---------- */
(function () {
  if (!MODES.length) return;
  const hd = document.querySelector("header");
  if (!hd) return;
  if (MODE !== "一次") {
    document.title = SUBJECT.title;
    const set = function (sel, v, isHtml) { const el = hd.querySelector(sel); if (el && v) el[isHtml ? "innerHTML" : "textContent"] = v; };
    set(".eyebrow", SUBJECT.eyebrow); set("h1", SUBJECT.h1); set(".intro", SUBJECT.intro, true);
    // 頻出テーマは一次の過去問の分析なので、二次では同じ場所を「答案を読む」（想定問題・骨子・解答例）に使う。データがなければタブごと隠す
    const tt = document.getElementById("tab-topics");
    if (tt && READ && MODE === "二次") tt.querySelector("span").textContent = "答案を読む";
    else if (tt) tt.style.display = "none";
  }
  if (SUBJECT.hideModeSwitch) return;
  const sw = document.createElement("div");
  sw.className = "modesw";
  sw.setAttribute("role", "tablist");
  sw.setAttribute("aria-label", "試験の切り替え");
  (SUBJECT.visibleModes || MODES).forEach(function (m) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = /^[一二]次$/.test(m) ? m + "試験" : m;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", m === MODE ? "true" : "false");
    if (m === MODE) b.className = "on";
    b.addEventListener("click", function () { if (m !== MODE) setMode(m); });
    sw.appendChild(b);
  });
  hd.insertBefore(sw, hd.firstChild);
})();
</script>
