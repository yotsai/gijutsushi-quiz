_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟｜解決策】出没防止と緊急対応の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　誘引物（放任果樹等）の管理、はこわな・電気柵の整備、ゾーニング管理計画の作成支援、緊急銃猟の体制整備<br><br><b>解説</b>　被害を減らすには、人里に引き寄せない出没防止と、出没時の緊急対応の両面が要る。ゾーニングは人とクマの生息域を分けて管理する考え方<br><br><b>答案に書くなら</b>　解決策として、放任果樹等の誘引物の管理、はこわな・電気柵の整備、ゾーニング管理計画の作成支援、緊急銃猟の体制整備を進める。<br><br><b>関連</b>　人材面ではガバメントハンターの人件費支援や捕獲技術者の養成がある。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 自治体施策の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/nature/choju/reinforce/index.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟｜注意】緊急銃猟を実施させる主体は誰か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　市町村長（都道府県ではない）。通行制限・避難指示、応援要請、損失補償も市町村長が行う<br><br><b>解説</b>　緊急銃猟は住民に最も近い市町村長が迅速に判断する仕組み。都道府県は応援要請を受ける側で、実施主体ではない<br><br><b>答案に書くなら</b>　緊急銃猟を実施させる主体は市町村長であり、通行制限・避難指示、都道府県知事への応援要請、損失補償も市町村長が行う。<br><br><b>関連</b>　4要件はすべて満たす必要がある。<br><br><b>答案での使い方</b>　実施主体の取り違えは減点<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/414AC0000000088\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜時期】外来生物法の2022年改正の公布と施行はいつか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　2022年5月18日公布。2022年7月1日に規制権限の拡充、2023年4月1日にその他が施行（全面施行済み）<br><br><b>解説</b>　ヒアリの侵入防止強化と、広く飼育されるアカミミガメ等への規制手法の整備が改正の柱。施行は2段階で、全面施行済み<br><br><b>答案に書くなら</b>　外来生物法の2022年改正は同年5月18日に公布され、2022年7月に規制権限の拡充、2023年4月にその他が施行され、全面施行済みである。<br><br><b>関連</b>　ヒアリ類の指定は2023年4月1日、対処指針の施行は同6月1日。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで施行済みと示す。2段階を落とさない<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/416AC0000000078\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜定義】要緊急対処特定外来生物とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　まん延すると著しく重大な被害が生じ、発見時に検査・防除等を緊急に行う必要があるものとして政令で定める生物。ヒアリ類を指定<br><br><b>解説</b>　特定外来生物の中でも、まん延すると著しく重大な被害が出て、発見時に緊急対応が要る種を政令で指定する区分。ヒアリを含むトフシアリ属4種群と交雑種が該当<br><br><b>答案に書くなら</b>　要緊急対処特定外来生物とは、まん延すると著しく重大な被害が生じ、発見時に検査・防除等を緊急に行う必要があるとして政令で定める生物で、ヒアリ類が指定されている。<br><br><b>関連</b>　ヒアリは特定外来生物でもある。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/416AC0000000078\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜制度】要緊急対処特定外来生物の主務大臣の権限は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　通関後も物品・土地・施設への立入検査、消毒・廃棄命令、移動の制限・禁止命令ができる<br><br><b>解説</b>　通常の特定外来生物では通関後の検査権限が弱いため、要緊急対処種については主務大臣の権限を強めた。水際で止めきれない場合の備え<br><br><b>答案に書くなら</b>　要緊急対処特定外来生物については、主務大臣が通関後も物品等・土地・施設への立入検査、消毒・廃棄命令、移動の制限・禁止命令を行える。<br><br><b>関連</b>　事業者向けの対処指針（ヒアリ類に係る対処指針）に従わない場合は勧告・命令の対象。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。水際強化の根拠<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/416AC0000000078\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜制度】条件付特定外来生物とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　アカミミガメとアメリカザリガニ（2023年6月指定）。家庭での飼養と少数への無償譲渡は適用除外。販売・購入・放出は原則禁止<br><br><b>解説</b>　アカミミガメ（幼体はミドリガメ）とアメリカザリガニは全国に定着し家庭で広く飼育されているため、通常の全面禁止とは別の線引きにした<br><br><b>答案に書くなら</b>　条件付特定外来生物はアカミミガメとアメリカザリガニの2種で、家庭での飼養と少数への無償譲渡は適用除外とし、販売・購入・野外放出は原則禁止である。<br><br><b>関連</b>　指定は2023年6月1日。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。規制の線引きを書く<br><br>【出典】<a href=\"https://www.env.go.jp/nature/intro/2outline/regulation/jokentsuki.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜課題】条件付き規制にした理由（課題）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　全て禁止にすると手続きの負担から野外放出が増えるおそれがある。終生飼養と放出禁止の周知が必要<br><br><b>解説</b>　全面禁止にすると手続きの負担を嫌った飼育者が野外に放出するおそれがある。そのため、飼育は認めつつ放出を禁じる設計にした<br><br><b>答案に書くなら</b>　制度・運用の観点から、課題は全て禁止にすると手続きの負担から野外放出が増えるおそれがあり、終生飼養と放出禁止を周知する必要があることである。<br><br><b>関連</b>　被害予防三原則は「入れない・捨てない・拡げない」。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 制度・運用の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/nature/intro/2outline/regulation/jokentsuki.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜課題】ヒアリ対策の課題を『技術・水際』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　輸入品に付着して非意図的に侵入する生物が増え、ヒアリの確認は2025年度に36件で過去最多。探知・検査の高度化が要る<br><br><b>解説</b>　ヒアリは輸入品に付着して非意図的に侵入する。2017年の初確認以降、毎年港湾等で発見され、2025年度は確認件数が過去最多となった<br><br><b>答案に書くなら</b>　技術・水際の観点から、課題は輸入品に付着して侵入する生物が増え、ヒアリの確認が2025年度に36件と過去最多で、探知・検査の高度化が要ることである。<br><br><b>関連</b>　累計は20都道府県で171事例（2025年度時点）。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 水際の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/pdf/full.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜解決策】水際対策の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　全国65港湾でのモニタリング・駆除と、ヒアリ探知犬など新たな対策技術の実証<br><br><b>解説</b>　港湾はヒアリの主な侵入口で、定期的なモニタリングと駆除で定着を防ぐ。探知犬など新しい技術の実証は令和8年度の取組<br><br><b>答案に書くなら</b>　解決策として、全国65港湾でのモニタリング・駆除と、ヒアリ探知犬など新たな対策技術の実証を進める。<br><br><b>関連</b>　環境省ウェブサイトとコールセンターで規制内容や終生飼養を周知する。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 水際施策の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/pdf/full.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜注意】条件付特定外来生物は、法律上、特定外来生物ではないのか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　特定外来生物のまま。適用除外は飼養・譲渡しの一部で、放出・輸入・販売・頒布・購入は原則禁止のまま<br><br><b>解説</b>　条件付特定外来生物は特定外来生物の一部規制を種ごとに適用除外としたもので、特定外来生物の地位は変わらない。放出・輸入・販売等は禁止のまま<br><br><b>答案に書くなら</b>　条件付特定外来生物も法律上は特定外来生物であり、適用除外は飼養・譲渡しの一部に限られ、放出・輸入・販売・頒布・購入は原則禁止である。<br><br><b>関連</b>　アメリカザリガニ以外の外国産ザリガニは全種が通常の特定外来生物。<br><br><b>答案での使い方</b>　「規制対象外」と書くと減点<br><br>【出典】<a href=\"https://www.env.go.jp/nature/intro/2outline/regulation/jokentsuki.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜時期】PFOS・PFOAの水質基準化はいつか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　2025年6月30日公布、2026年4月1日施行（施行済み）。水質基準52項目の1つとなった<br><br><b>解説</b>　PFOS・PFOAは2020年に水質管理目標設定項目（暫定目標値50ng/L）だったが、食品安全委員会の2024年6月の評価を踏まえ水質基準へ格上げされた。施行日は対応期間を確保するため公布から遅らせた<br><br><b>答案に書くなら</b>　PFOS・PFOAは2025年6月30日に公布、2026年4月1日に施行済みの水質基準52項目の1つである。<br><br><b>関連</b>　改正は水道法に基づく省令で、告示ではない。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで施行済みと示す<br><br>【出典】<a href=\"https://www.env.go.jp/content/000334172.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜定義】PFOS・PFOAとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　有機フッ素化合物（PFAS）の一種。化学的に極めて安定で難分解性。化審法で原則製造・輸入禁止（第一種特定化学物質）<br><br><b>解説</b>　PFASは有機フッ素化合物の総称。PFOS・PFOAは分解されにくく環境に長く残るため、化審法で原則製造・輸入が禁止されている<br><br><b>答案に書くなら</b>　PFOS・PFOAは化学的に極めて安定で難分解性のPFASの一種であり、化審法の第一種特定化学物質として原則製造・輸入が禁止されている。<br><br><b>関連</b>　PFOSは2010年、PFOAは2021年に第一種特定化学物質に指定。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://www.env.go.jp/water/pfas/faq003.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜制度】PFOS・PFOAの水道水質基準値は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　PFOSとPFOAの合算で50ng/L（0.00005mg/L）以下。水道事業者等に遵守・検査の義務がある<br><br><b>解説</b>　基準値は食品安全委員会のTDIから算出。PFOS・PFOAは同じ影響を指標とし同時に検出されるため、安全側に合算で50ng/Lとした<br><br><b>答案に書くなら</b>　水道水質基準はPFOSとPFOAの合算で50ng/L（0.00005mg/L）以下であり、水道事業者等に遵守・検査の義務がある。<br><br><b>関連</b>　検査は原則3か月に1回で、簡易水道・専用水道には頻度の特例がある。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の数字。合算と単位を書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000334172.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜制度】公共用水域・地下水のPFOS・PFOAの扱いは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　環境基準ではなく要監視項目の指針値（50ng/L合算）。2025年6月に「暫定」を外した<br><br><b>解説</b>　水道水は水道法の水質基準で義務があるが、公共用水域・地下水は環境基準ではなく、知見の集積を続ける要監視項目として指針値を置く<br><br><b>答案に書くなら</b>　公共用水域・地下水のPFOS・PFOAは環境基準ではなく要監視項目の指針値（合算50ng/L）であり、遵守義務のある水道水質基準とは位置づけが異なる。<br><br><b>関連</b>　2025年6月30日に「指針値（暫定）」の「暫定」を外した（値は同じ）。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。水道水との違いを書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000405361.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜課題】PFOS対策の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　濃度低減の対策技術の知見の充実が必要。使用済み活性炭の不適切な保管から流出した事案もあり、活性炭の管理が課題<br><br><b>解説</b>　浄水に使う活性炭はPFOS等を吸着するが、使用済みの活性炭の管理が不適切だと再び流出する。濃度を下げる対策技術の知見も十分でない<br><br><b>答案に書くなら</b>　技術の観点から、課題は濃度低減の対策技術の知見の充実が必要で、使用済み活性炭の不適切な保管から流出した事案もあり活性炭の管理が課題である。<br><br><b>関連</b>　環境省は実証事業を行い、対策技術集を公表している。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000405361.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜課題】PFOS対策の課題を『制度』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　PFOS・PFOA以外のPFASは毒性評価が定まらず、要検討項目に据え置かれている<br><br><b>解説</b>　PFASには多くの種類があるが、毒性評価が定まった物質は限られる。評価が定まらない物質は基準にできず、要検討項目に据え置かれる<br><br><b>答案に書くなら</b>　制度の観点から、課題はPFOS・PFOA以外のPFASは毒性評価が定まらず、要検討項目に据え置かれていることである。<br><br><b>関連</b>　2025年6月30日にPFHxSに加え7物質を要検討項目に追加し、計8物質となった。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 制度の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000405361.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜解決策】PFOS低減の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　対策技術の実証事業と対策技術集の活用、使用済み活性炭の適正な保管・取扱いの周知<br><br><b>解説</b>　低減対策は技術面（実証・技術集）と運用面（活性炭の保管・取扱い）の両方から進める。自治体には対応の手引き（第3版）も通知されている<br><br><b>答案に書くなら</b>　解決策として、対策技術の実証事業と対策技術集の活用を進め、使用済み活性炭の適正な保管・取扱いを周知する。<br><br><b>関連</b>　「PFOS及びPFOAに関する対応の手引き（第3版）」は2026年6月5日に通知。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 技術面の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000405361.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜注意】50ng/Lは基準化で変わった値か？合算か個別か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　値は暫定目標値から変わらず、変わったのは位置づけ（義務のある基準へ）。PFOSとPFOAの合算<br><br><b>解説</b>　基準化は、暫定目標値だった50ng/Lを守る義務のある水質基準に格上げしたもの。値を厳しくしたのではない<br><br><b>答案に書くなら</b>　50ng/Lは暫定目標値から変わらず、変わったのは義務のある基準へという位置づけで、PFOSとPFOAの合算値である。<br><br><b>関連</b>　食品安全委員会のTDIは両物質とも20ng/kg/日。<br><br><b>答案での使い方</b>　「基準値が厳しくなった」と書くと減点<br><br>【出典】<a href=\"https://www.env.go.jp/content/000334172.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準｜時期】底層溶存酸素量はいつ環境基準になり、類型指定はどこまで進んだか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　2016年3月に生活環境項目に追加。琵琶湖・東京湾（2021年）、伊勢湾・大阪湾（2022年）、霞ケ浦等（2024年）を指定<br><br><b>解説</b>　従来の環境基準だけでは湖底の貧酸素化や魚介類の減少が伝わりにくいとの指摘から、2015年12月の中環審答申を受けて導入された。国が県際水域から類型指定を進める<br><br><b>答案に書くなら</b>　底層溶存酸素量は2016年3月に生活環境項目に追加され、琵琶湖・東京湾（2021年）、伊勢湾・大阪湾（2022年）、霞ケ浦等（2024年）で類型指定が進んだ。<br><br><b>関連</b>　複数県にまたがる水域は国が指定する。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで時期と実績を示す<br><br>【出典】<a href=\"https://www.env.go.jp/press/102287.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準｜定義】底層溶存酸素量とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　魚介類等の生息や藻場等の生育への直接的な影響を判断できる指標。底層を利用する生物の生息・再生産に重要<br><br><b>解説</b>　水底付近の酸素が不足する貧酸素化は、底を利用する魚介類や藻場に直接影響する。底層の酸素量はその影響を直接判断できる指標<br><br><b>答案に書くなら</b>　底層溶存酸素量とは、魚介類等の生息や藻場等の生育への直接的な影響を判断できる指標であり、底層を利用する生物の生息・再生産に重要である。<br><br><b>関連</b>　同時期の沿岸透明度は環境基準ではなく、地域が設定する目標。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://www.env.go.jp/press/102287.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準｜制度】底層溶存酸素量の3つの類型と基準値は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　生物1は4.0mg/L以上、生物2は3.0mg/L以上、生物3は2.0mg/L以上（日間平均値）<br><br><b>解説</b>　生物の貧酸素への耐性に応じて、守る水域の目的を3段階に分けた。数字が小さい類型ほど耐性の低い生物を守る<br><br><b>答案に書くなら</b>　類型は生物1が4.0mg/L以上、生物2が3.0mg/L以上、生物3が2.0mg/L以上（いずれも日間平均値）で、耐性の低い生物の場ほど厳しい値である。<br><br><b>関連</b>　生物3は耐性の高い生物の場、または無生物域を解消する水域。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の数字。類型と値を対で書く<br><br>【出典】<a href=\"https://www.env.go.jp/press/102287.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準｜制度】大阪湾の底層溶存酸素量の類型指定の範囲は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　湾奥部のみ（生物3）。湾全域ではない。東京湾などは水域ごとに生物1〜3が混在<br><br><b>解説</b>　類型は水域ごとに指定するため、同じ湾の中でも区域により類型が異なる。大阪湾は湾奥部だけで、東京湾や伊勢湾は複数の類型が混在する<br><br><b>答案に書くなら</b>　大阪湾の類型指定は湾奥部のみ（生物3）であり、湾全域ではなく、東京湾などでは水域ごとに生物1〜3が混在する。<br><br><b>関連</b>　伊勢湾は名古屋港が生物2、伊勢湾央部が生物3、その他が生物1。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。指定は水域ごと<br><br>【出典】<a href=\"https://www.env.go.jp/press/110371.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準｜課題】底層の貧酸素化の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　湖沼では底質からの栄養塩溶出（内部負荷）や鉄・マンガン溶出による水道水の障害にもつながり、要因解析と対策技術の選定が要る<br><br><b>解説</b>　湖沼では底層の酸素が減ると底質から栄養塩が溶け出し（内部負荷）、さらに鉄・マンガンの溶出が水道水の障害にもなる。原因解析をして対策を選ぶ必要がある<br><br><b>答案に書くなら</b>　技術の観点から、課題は底層の貧酸素化が内部負荷や鉄・マンガンの溶出による水道水の障害にもつながり、要因解析と対策技術の選定が必要なことである。<br><br><b>関連</b>　湖沼の対策の手引き（2020年3月）が対策を整理している。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/900544873.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準｜解決策】貧酸素化の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　外部負荷削減に加え、内部負荷削減（浚渫・覆砂）と、曝気・酸素水供給による底層への酸素供給を組み合わせる<br><br><b>解説</b>　外部負荷（流入する汚濁）の削減だけでは底質に溜まった栄養塩の溶出は止まらないため、内部負荷の削減と底層への酸素供給を組み合わせる<br><br><b>答案に書くなら</b>　解決策として、外部負荷削減に加え、浚渫・覆砂による内部負荷削減と、曝気・酸素水供給による底層への酸素供給を組み合わせる。<br><br><b>関連</b>　対策の選定は水域の特性、改善目標、費用を踏まえ、副次的な影響にも留意する。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 水環境の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/900544873.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準｜注意】底層溶存酸素量の基準値は何の値か？どの類型が最も厳しいか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　日間平均値。生物1（4.0mg/L以上）が最も厳しい。1つの湾・湖でも類型は混在する<br><br><b>解説</b>　基準は1日の平均値で評価する。類型は守る生物の耐性で決まり、数値が大きい生物1が最も厳しい。1つの水域に複数類型が混在する<br><br><b>答案に書くなら</b>　底層溶存酸素量の基準値は日間平均値であり、生物1（4.0mg/L以上）が最も厳しく、1つの湾・湖でも類型は混在する。<br><br><b>関連</b>　令和8年度の方針で、達成率と達成期間の目標を設定するとされる。<br><br><b>答案での使い方</b>　基準値の種類と類型の取り違えは減点<br><br>【出典】<a href=\"https://www.env.go.jp/press/102287.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜時期】プラスチック汚染条約は成立したか？交渉の現状は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　未成立。2022年のUNEA5.2決議でINCを設置したが、2024年末の策定目標は未達。INC5.4は2027年3月に開催予定<br><br><b>解説</b>　プラスチック汚染は国境を越えるため、世界全体で対策が必要。UNEA5.2の決議でINCを設置して条約策定の交渉が続いている<br><br><b>答案に書くなら</b>　プラスチック汚染条約は未成立であり、2024年末の策定目標は未達のまま、INC5.4が2027年3月に開催予定である。<br><br><b>関連</b>　INC5は「INC5.1」とも呼ばれ、5.2・5.3は同じ第5回の再開会合。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで「交渉中」と示す<br><br>【出典】<a href=\"https://www.env.go.jp/water/inc.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜定義】大阪ブルー・オーシャン・ビジョンとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　2019年のG20大阪サミットで共有された、2050年までに海洋プラごみによる追加的な汚染をゼロにする目標。日本が提唱<br><br><b>解説</b>　日本が提唱し、2019年のG20大阪サミットで共有された目標。条約交渉でも日本が積極的に関わる根拠になる<br><br><b>答案に書くなら</b>　大阪ブルー・オーシャン・ビジョンとは、2050年までに海洋プラスチックごみによる追加的な汚染をゼロにする目標で、日本が提唱国である。<br><br><b>関連</b>　2023年G7広島サミットでは2040年までにゼロにする野心にコミット。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し・日本の取組の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_02873.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜課題】条約交渉の課題を『制度・運用』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　INC5.2（2025年8月）で、生産、プラスチック製品（第4条）、資金（第10条）は各国の意見の隔たりが大きく合意に至らなかった<br><br><b>解説</b>　INC5.2では条文交渉は進んだが、生産・製品・資金など利害の対立が大きい論点は合意できなかった。国際制度づくりが課題<br><br><b>答案に書くなら</b>　制度・運用の観点から、課題はINC5.2（2025年8月）で生産、プラスチック製品（第4条）、資金（第10条）の意見の隔たりが大きく、合意に至らなかったことである。<br><br><b>関連</b>　製品設計（第5条）や廃棄物管理（第7条）などは文言交渉が進展した。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 国際制度の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/water/inc.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜課題】条約実施の課題を『経済・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　途上国の廃棄物管理の能力構築とインフラ整備が必要。日本は人材育成（2025年までに1万人）等を表明している<br><br><b>解説</b>　条約を実施するには各国の廃棄物管理が前提で、途上国は能力とインフラが不足しがち。日本は人材育成で支援を表明している<br><br><b>答案に書くなら</b>　経済・担い手の観点から、課題は途上国の廃棄物管理の能力構築とインフラ整備が必要なことで、日本は人材育成（2025年までに1万人）等を表明している。<br><br><b>関連</b>　日本の支援の枠組みはマリーン・イニシアティブ。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 国際協力の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/council/content/i_03/000433372.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜解決策】途上国支援の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　ASEAN各国を中心とした国別行動計画の策定支援、海洋ごみモニタリング能力の強化、地域ナレッジセンターの設置<br><br><b>解説</b>　国別行動計画は各国が自国の対策を定める計画。モニタリング能力の強化と地域ナレッジセンターは、海洋ごみの実態把握と知見共有を支える<br><br><b>答案に書くなら</b>　解決策として、ASEAN各国を中心とした国別行動計画の策定支援、海洋ごみモニタリング能力の強化、地域ナレッジセンターの設置を進める。<br><br><b>関連</b>　条約の国別計画は第13条で定める。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 国際協力の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/council/content/i_03/000433372.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜解決策】国内でできる解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　プラスチック資源循環促進法による設計・使用の合理化・回収・再資源化と、海洋プラごみの回収・流出防止を進める<br><br><b>解説</b>　国内対策は条約とは別の枠組みで、国内法で設計から回収・再資源化まで進める。海洋への流出の防止も並行して行う<br><br><b>答案に書くなら</b>　国内の解決策として、プラスチック資源循環促進法による設計・使用の合理化・回収・再資源化と、海洋プラスチックごみの回収・流出防止を進める。<br><br><b>関連</b>　条約は法的拘束力のある国際文書で、国内法とは別。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 国内施策の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/council/content/i_03/000433372.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜注意】「2050年ゼロ」と「2040年ゼロ」は同じ目標か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　別。2050年は大阪ブルー・オーシャン・ビジョン（2019年）、2040年は2023年G7広島サミットでの野心<br><br><b>解説</b>　2050年は日本が提唱した大阪ブルー・オーシャン・ビジョン（2019年）、2040年はG7広島サミット（2023年）の野心で、出どころも年次も別<br><br><b>答案に書くなら</b>　2050年ゼロは大阪ブルー・オーシャン・ビジョン、2040年ゼロは2023年G7広島サミットの野心であり、別の目標である。<br><br><b>関連</b>　大阪ブルー・オーシャン・ビジョンは追加的な汚染をゼロにする目標。<br><br><b>答案での使い方</b>　年次の取り違えは減点<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_02873.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜注意】INC5.3（2026年2月）では条文交渉をしたか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　していない。前議長の辞任を受けた新議長の選出などを行う、組織的・事務的事項の会合<br><br><b>解説</b>　INC5.3（2026年2月7日）は前議長の辞任を受けた新議長（チリ）の選出など、実質的な交渉をしない事務的会合。5.2が条文交渉、5.4が次の交渉<br><br><b>答案に書くなら</b>　INC5.3は条文交渉を行わず、新議長の選出などを行う組織的・事務的事項の会合であり、実質的な交渉はINC5.2と5.4で行う。<br><br><b>関連</b>　INC5.4は2027年3月13〜24日の期間内に開催予定で、場所は未定。<br><br><b>答案での使い方</b>　INC5.2・5.3・5.4の役割を混同しない<br><br>【出典】<a href=\"https://www.env.go.jp/water/inc.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜時期】河川・湖沼マイクロプラスチック調査ガイドラインはいつ策定されたか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　河川版は2021年6月、湖沼を加えた現名称は2023年3月30日。その後改訂され、令和8年4月版が最新<br><br><b>解説</b>　河川版ガイドライン（2021年6月）に湖沼の調査方法を加え、「河川・湖沼」版として2023年3月30日に公開した。知見の集積に応じて見直されるため、版の表記に注意<br><br><b>答案に書くなら</b>　河川・湖沼マイクロプラスチック調査ガイドラインは2023年3月に河川・湖沼版として公開され、その後改訂されて令和8年4月版が最新である。<br><br><b>関連</b>　資料により版の表記が異なる。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで時期と最新版を示す<br><br>【出典】<a href=\"https://www.env.go.jp/water/marine_litter/post_118.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜定義】マイクロプラスチックとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　一般的に5mm未満の微細なプラスチック。海洋プラごみの約8割は陸域発生とされ、河川を経由して流出する<br><br><b>解説</b>　5mm未満は一般的な定義で、調査では1mm以上5mm未満と1mm未満を分ける場合もある。海洋プラごみの約8割は陸域発生とされ、河川が流出経路になる<br><br><b>答案に書くなら</b>　マイクロプラスチックとは一般的に5mm未満の微細なプラスチックであり、海洋プラスチックごみの約8割は陸域から発生し河川を経由して流出するとされる。<br><br><b>関連</b>　個数密度の単位は個/m3、質量濃度はmg/m3。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://www.env.go.jp/water/marine_litter/post_118.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜制度】マイクロプラスチックに法的基準値はあるか？ガイドラインの位置づけは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　ない。ガイドラインは調査方法の手引きで、結果を基に自治体が関係機関と連携して発生源対策を進める<br><br><b>解説</b>　環境基準・排出基準のような法的基準値はなく、ガイドラインは調査方法を示す手引き。結果を基に自治体が発生源対策を進める<br><br><b>答案に書くなら</b>　マイクロプラスチックに法的基準値はなく、ガイドラインは調査方法の手引きであり、結果を基に自治体が関係機関と連携して発生源対策を進める。<br><br><b>関連</b>　環境省は事業者の自主的な取組の後押しも行う。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。規制ではないと書く<br><br>【出典】<a href=\"https://www.env.go.jp/water/marine_litter/post_118.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜制度】令和4年度の河川調査（一級水系7水系）の結果は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　長径1〜5mmの平均個数密度は0.1〜0.8個/m3。人口密度・市街化率と強い正の相関<br><br><b>解説</b>　令和4年度の調査は一級水系7水系の下流域で、長径1mm以上5mm未満を対象にした。人口が多く市街化が進んだ地域ほど個数密度が高い<br><br><b>答案に書くなら</b>　令和4年度の河川調査では、1〜5mmの平均個数密度は0.1〜0.8個/m3で、人口密度・市街化率と強い正の相関があった。<br><br><b>関連</b>　最高は阿武隈川水系の槻木大橋、最低は留萌川水系と吉野川水系。<br><br><b>答案での使い方</b>　Ⅱ-1の数字。個数密度の単位は個/m3<br><br>【出典】<a href=\"https://www.env.go.jp/content/000220901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜課題】マイクロプラスチックの課題を『技術・科学』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　添加剤や吸着した化学物質が生物・生態系に及ぼす影響の科学的知見が、まだ十分に蓄積されていない<br><br><b>解説</b>　マイクロプラスチックに含まれる添加剤や、表面に吸着する化学物質が生物に与える影響は、まだ科学的に十分わかっていない<br><br><b>答案に書くなら</b>　技術・科学の観点から、課題は添加剤や吸着した化学物質が生物・生態系に及ぼす影響の科学的知見がまだ十分に蓄積されていないことである。<br><br><b>関連</b>　モニタリング手法の国際的な調和も課題。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 科学的知見の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/water/marine_litter/post_118.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜解決策】科学的知見の不足への解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　生物・生態系への影響評価手法の検討と、調和ガイドラインに沿ったデータ収集、AOMIによる国際共有<br><br><b>解説</b>　影響評価手法の検討、調和ガイドラインによる比較可能なデータ収集、国際データベースAOMI（Atlas of Ocean Microplastics）での共有が、知見不足を埋める流れ<br><br><b>答案に書くなら</b>　解決策として、生物・生態系への影響評価手法を検討し、調和ガイドラインに沿ってデータを収集し、AOMIで国際的に共有する。<br><br><b>関連</b>　AOMIは2024年5月に公表されたデータベース。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 調査検討事項の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/water/marine_litter/post_118.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜解決策】事業者との連携の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　マイクロプラスチック・スマート懇話会で業界団体・事業者と普及啓発を検討し、グッド・プラクティス集で先進事例を発信<br><br><b>解説</b>　発生抑制・流出抑制・回収・代替素材の開発は事業者の取組に依存する面があるため、業界団体・事業者との連携が要る。先進事例の発信で自主的な取組を後押しする<br><br><b>答案に書くなら</b>　解決策として、マイクロプラスチック・スマート懇話会で業界団体・事業者と普及啓発を検討し、グッド・プラクティス集で先進事例を発信する。<br><br><b>関連</b>　グッド・プラクティス集は第3版を2025年4月に公表。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 事業者連携の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/water/marine_litter/post_118.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜注意】マイクロプラスチックの個数密度は他の調査の数値と比べられるか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　直接比べられない。調査年度・地点・サイズ範囲（1mm以上5mm未満など）で大きく変わる<br><br><b>解説</b>　個数密度は調査年度・地点・サイズ範囲（1mm以上5mm未満など）で大きく変わる。条件が違う数字を並べても比較にならない<br><br><b>答案に書くなら</b>　マイクロプラスチックの個数密度は調査年度・地点・サイズ範囲で大きく変わるため、他の調査の数値とは条件を揃えずに直接比較できない。<br><br><b>関連</b>　東京湾周辺の河川では0.3〜35.2個/m3という別の調査結果がある。<br><br><b>答案での使い方</b>　数字を比較に使うときは条件を揃える<br><br>【出典】<a href=\"https://www.env.go.jp/content/000220901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}];

/* 自動生成（tools/practice_to_js.py）。元＝career-master/research/gijutsushi-cards/practice/。Claude作成の想定問題・骨子・解答例 */
const NJ_READ = {"city": "<p>A市（北海道東部の地方都市。実在の市ではない）</p><div class=\"rl l0\">人口：約16万人（2020年比で2035年に約1割減の見込み）。65歳以上が約33%。</div><div class=\"rl l0\">産業：畑作・酪農と食品加工（でん粉・乳製品・砂糖）。市内の温室効果ガス排出は、産業部門と、暖房を含む家庭・業務部門が大きい。</div><div class=\"rl l0\">気候：冬は−20℃を下回る日があり、暖房の灯油・重油の消費が多い。日照時間は長く、太陽光に向く。</div><div class=\"rl l0\">再エネの適地：太陽光（遊休農地・屋根）、陸上風力（丘陵地）、バイオマス（家畜ふん尿・でん粉かす・林地残材）。一方で送電網の空き容量が小さく、大規模電源は接続待ちになりやすい。</div><div class=\"rl l0\">自然：市の南部に湿原と河川があり、タンチョウ・オジロワシなど希少な鳥類が飛来する。</div><div class=\"rl l0\">行政：環境課は職員6名。2021年にゼロカーボンシティを表明済み。</div><p>（設定は自由に変えてよい。業務で土地勘のある地域に合わせると書きやすい。数字は答案の中で「本市の想定」として使う。実在の統計として書かない。）</p>", "items": [{"id": "Ⅱ-2-A", "kind": "選択Ⅱ-2", "title": "再エネ促進区域の設定", "q": "<p>地球温暖化対策推進法に基づき、市町村は地方公共団体実行計画（区域施策編）において、地域脱炭素化促進事業の対象となる区域（促進区域）を定めることができる。あなたが市の担当者として促進区域の設定を担当することになった場合、以下の内容について記述せよ。<br>(1) 調査、検討すべき事項とその内容について説明せよ。<br>(2) 業務を進める手順を列挙して、それぞれの項目ごとに留意すべき点、工夫を要する点を述べよ。<br>(3) 業務を効率的、効果的に進めるための関係者との調整方策について述べよ。</p>", "sk": "<div class=\"rl l0\">1. 本市の概要と方針：A市。太陽光・陸上風力・バイオマスの適地がある一方、南部の湿原に希少な鳥類。系統の空きが小さい。方針＝「屋根置き・遊休農地の太陽光」を中心に区域を設定し、風力は鳥類調査の結果を待つ（論点を太陽光に絞る）。</div><div class=\"rl l0\">(1) 調査・検討事項：再エネ導入ポテンシャル（REPOS）／環境情報（希少種・景観・土砂災害区域）／土地利用（農地・遊休地）／系統の空き容量／地域の意向（アンケート）。</div><div class=\"rl l0\">(2) 手順と留意点</div><div class=\"rl l1\">①既存情報の収集 → 留意：国・県の環境配慮基準と整合。</div><div class=\"rl l1\">②重ね合わせ地図で候補地 → 工夫：除外すべき区域を先に決める。</div><div class=\"rl l1\">③現地確認 → 留意：冬季の積雪・融雪の影響。</div><div class=\"rl l1\">④協議会で案を作成 → 留意：意見を反映した経過を記録する。</div><div class=\"rl l1\">⑤実行計画へ記載・公表。</div><div class=\"rl l0\">(3) 調整：庁内（農政・都市計画・防災）／県（環境配慮基準）／系統の運用者／地元の農業者・住民／専門家（鳥類）。協議会を1つにまとめ、論点ごとに部会。</div>", "ans": "<p>1. 本市の概要と方針<br>当市は人口約16万人の北海道東部の地方都市で、遊休農地・屋根の太陽光、丘陵地の風力、家畜ふん尿のバイオマスに適地がある。一方、南部の湿原にタンチョウなど希少な鳥類が飛来し、送電網の空き容量も小さい。そこで本稿は、系統への負荷が小さい屋根置き・遊休農地の太陽光に論点を絞る。風力は鳥類調査の結果を待って次期に判断する。促進区域は、環境配慮と地域貢献の要件を付して再エネを立地するポジティブゾーニングとして、実行計画（区域施策編）に定める。</p><p>2. 調査、検討すべき事項とその内容<br>1) 導入ポテンシャルと目標：屋根と遊休農地の賦存量を推計し、市内の電力需要と比べて導入目標を設定する。目標がないと区域の広さを決められないためである。<br>2) 環境情報：希少鳥類の生息・渡りのルート、湿原・河川、景観、土砂災害区域を整理する。環境保全・事業性・社会的調整に係る情報を重ね合わせるゾーニングの基礎とする。<br>3) 土地利用：遊休農地の所有・耕作状況と転用の制約を確認する。<br>4) 系統：変電所ごとの空き容量と接続の見通しを把握する。<br>5) 地域の意向：市民・事業者へのアンケートで、地域貢献の希望を把握する。エネルギー代金の多くが域外へ流出している現状を、区域の意義として共有する。</p><p>3. 業務を進める手順と留意点、工夫を要する点<br>1) 既存情報の収集：留意点は、国・道の環境配慮の基準と整合させることである。区域の根拠を説明できなくなるためである。<br>2) 重ね合わせ地図による候補地の抽出：工夫は、湿原周辺の生息地や土砂災害区域など除外すべき区域を先に決め、その外側で候補地を絞ることである。事業者が立地の予見性を持てる。<br>3) 現地確認：留意点は、積雪・融雪と−20℃を下回る低温の影響である。<br>4) 協議会での区域案の作成：環境配慮と地域貢献の要件を区域ごとに付す。留意点は、意見をどう反映したかの経過を記録し、公表することである。<br>5) 実行計画への記載と公表：工夫は、導入量と苦情件数を毎年確認し、区域を見直す仕組みを計画に入れることである。</p><p>4. 関係者との調整方策<br>協議会を一つに束ね、論点ごとに部会を置く。環境課は6名と少ないため、次のとおり役割を分ける。<br>1) 庁内：農政・都市計画・防災・企画の担当を含む横断チームを置く。農地や災害区域の情報を早期に得るためである。<br>2) 道・系統の運用者：環境配慮の基準と接続の見通しを事前に共有する。<br>3) 農業者・住民：遊休農地の所有者と地元に、地域貢献の内容を直接説明する。<br>4) 専門家：鳥類の有識者を部会に入れ、除外区域の根拠を科学的に示す。</p><p>以上</p>", "memo": "<div class=\"rl l0\">字数：1,075字（空白・改行を除く。上限1,200字）</div><div class=\"rl l0\">答案上の設定・推論：</div><div class=\"rl l1\">A市の概要（人口16万人・適地・湿原・系統の空き小）は想定問題の架空設定で、実在の統計ではない</div><div class=\"rl l1\">論点を太陽光に絞り、風力は次期とした判断（骨子どおり。一次資料にない判断）</div><div class=\"rl l1\">除外区域を先に決める工夫、冬季の積雪・低温の留意、導入量・苦情件数の毎年確認は一般的な技術常識に基づく提案</div><div class=\"rl l1\">環境課6名で庁内横断チームを置く役割分担は設定上の判断</div><div class=\"rl l1\">導入ポテンシャルの推計名称（REPOS等）は、カードにないため答案に書かなかった。書くなら一次資料で確認してから</div><div class=\"rl l0\">書き方のポイント：</div><div class=\"rl l1\">冒頭で市の条件を示し、論点を1つ（太陽光）に絞った（ガイド§4「構成」「合格の秘訣」）</div><div class=\"rl l1\">見出しを設問の言葉そのままにし、(1)(2)(3)の書き漏れを防いだ（ガイド§0-1 オウム返し）</div><div class=\"rl l1\">「〜ためである」「〜ことである」と理由を必ず添えて工夫を述べた（ガイド§4「理由を必ず添える」）</div><div class=\"rl l0\">自分で書くときの差し替え候補：A市の設定を実際に土地勘のある自治体に、系統・農地の記述を業務で見た実例に、協議会の運営を自分の経験に置き換える</div>"}, {"id": "Ⅰ-D", "kind": "必須Ⅰ", "title": "2035年度・2040年度の削減目標と地域脱炭素", "q": "<p>政府は2025年2月に地球温暖化対策計画を改定し、温室効果ガスを2013年度比で2035年度に60%、2040年度に73%削減する目標を掲げた。目標の達成には、地域の脱炭素化を全国に広げることが欠かせない。<br>(1) 地方公共団体が主体となって地域の脱炭素化を進めるに当たり、技術者としての立場で多面的な観点から3つの課題を抽出し、それぞれの観点を明記したうえで、その課題の内容を示せ。<br>(2)〜(4) Ⅰ-Aと同じ。</p>", "sk": "<div class=\"rl l0\">冒頭：2035年度60%・2040年度73%（2013年度比）。地域の脱炭素を全国に広げる。</div><div class=\"rl l0\">(1) 課題3つ</div><div class=\"rl l1\">① 人材・体制の観点：自治体に専門人材がいない。</div><div class=\"rl l1\">② 経済の観点：初期投資と採算。補助金が切れると止まる。</div><div class=\"rl l1\">③ 技術・インフラの観点：系統制約と、寒冷地の熱の脱炭素（暖房）が難しい。</div><div class=\"rl l0\">(2) 最重要＝②（理由：持続する事業にならなければ横展開しない（推論））</div><div class=\"rl l1\">解決策1：地域新電力やPPAで初期投資なしに導入する。</div><div class=\"rl l1\">解決策2：エネルギー代金の域外流出を地域経済循環分析で見える化し、投資の意義を示す。</div><div class=\"rl l1\">解決策3：脱炭素先行地域などのモデルを近隣に横展開する（脱炭素ドミノ）。</div><div class=\"rl l0\">(3) リスク：電力価格の変動で地域新電力が経営難 → 電源の多様化と需給管理。</div><div class=\"rl l0\">(4) Ⅰ-Aと同じ型。</div>", "ans": "<p>政府は2025年2月に地球温暖化対策計画を改定し、温室効果ガスを2013年度比で2035年度に60%、2040年度に73%削減する目標を掲げた。2024年度の排出・吸収量は9.94億t（2013年度比28.7%減）で、2035年度目標の5.7億tまで約4.2億tの削減が要る。これは年約0.39億tで、2023年度から2024年度の減少幅（約0.23億t）の約1.7倍の速さである。本問は、暖房需要の大きい寒冷地の地方都市が主体となる場合を対象とする。</p><p>(1) 地方公共団体による地域脱炭素の課題<br>1) 人材・体制の観点<br>課題は、計画の策定と実施を担う人材が足りないことである。脱炭素先行地域は2026年2月までに133市町村・102提案が選定されたが、コスト増大や地元合意の難航により3提案が辞退した。自治体職員や地元企業・金融機関の体制の差が、取組の差を生んでいる。<br>2) 経済の観点<br>課題は、初期投資の負担と、採算の確保である。約9割の市町村で、エネルギー代金の域内外の収支は域外への支出が上回る（2015年度）。重点対策加速化事業の交付は5年間であり、交付が終わった後も事業が続く収支を組めるかが問われる。<br>3) 技術・インフラの観点<br>課題は、系統の制約と、寒冷地の熱の脱炭素である。再エネの導入には系統整備と蓄電池が要る。脱炭素先行地域は民生部門の電力の実質ゼロが核で、運輸と熱利用は地域特性に応じた対策とされており、暖房に灯油・重油を使う寒冷地では削減が後回しになりやすい。</p><p>(2) 最も重要な課題と解決策<br>最も重要な課題は、2)経済の観点とする。理由は、事業として採算が取れず、地域に利益が残らなければ、交付金の終了後に続かず、他の自治体への横展開も起きないからである。<br>1) 初期投資ゼロの導入モデルの活用<br>PPA（電力販売契約）やリースにより、設備の初期費用を事業者が負担し、自治体と施設所有者は電気料金で長期に支払う形で、公共施設と民間の屋根に自家消費型の太陽光を導入する。地域新電力が電力を調達・供給し、売電収益を域内に残す。屋根置き太陽光は、2030年に設置可能な建築物の約50%、2040年に100%への導入が地域脱炭素ロードマップの目標である。<br>2) 地域経済循環分析による域外流出の見える化<br>エネルギー代金の域外流出額を地域経済循環分析で示し、再エネ・省エネへの投資が域内の所得になることを、議会・地域金融機関・住民に説明する。融資を呼び込む根拠にする。<br>3) モデルの横展開（脱炭素ドミノ）<br>脱炭素先行地域などで確立した事業モデルを、近隣の市町村に展開する。都道府県や連携中枢都市と共同で計画を策定し、人材と設計のノウハウを共有する。</p><p>(3) 全て実行しても生じうるリスクと対策<br>1) 電力価格の変動による地域新電力の経営悪化<br>卸電力市場の価格が高騰すると、調達コストが上昇する。対策は、自営の再エネ・蓄電池・長期の相対契約による電源の多様化と、需給管理の高度化である。経営指標の監視と、撤退基準の設定も行う。<br>2) 経済性の高い対策への偏りによる熱・運輸の削減不足<br>電力の対策に偏ると、暖房と運輸の排出が残る。対策は、バイオマス熱供給、地中熱、ヒートポンプ、公共施設のZEB化を計画に位置づけ、計画の審査で熱と運輸を評価することである。<br>3) 形だけの計画となるリスク<br>体制が不十分な小規模自治体では、計画が形だけになるおそれがある。対策は、地域協議会で実行可能性を検証し、都道府県・連携中枢都市等との共同策定と広域での人材支援を行うことである。</p><p>(4) 業務遂行上の要件・留意点<br>1) 技術者倫理の観点<br>公衆の安全を最優先する。削減量や採算の見通しを、科学的根拠に基づき、不確実性とともに隠さず説明する。関係法令を守り、自らの責任範囲を明確にする。<br>2) 社会の持続性の観点<br>環境・経済・社会の統合的向上を判断基準とし、将来世代の負担となる設備の撤去・更新費用まで計画に含める。電力料金や補助の恩恵が一部の層に偏らないようにする。<br>以上</p>", "memo": "<div class=\"rl l0\">字数：1,643字（空白・改行を除く。上限1,800字）</div><div class=\"rl l0\">構成：骨子（配分30・35・20・15%）どおり。変更点は2つ。冒頭に、2024年度実績と2035年度目標の差（算定）を入れて「全国で加速が要る」根拠を数字にした。(3)のリスクを骨子の1つから3つに増やした（熱・運輸の偏り、形だけの計画を追加）。</div><div class=\"rl l0\">使った事実と出典（16件）：</div><div class=\"rl l1\">地球温暖化対策計画（2025年2月）は2013年度比で2035年度60%、2040年度73%削減（材料カード「地球温暖化対策計画」目標）</div><div class=\"rl l1\">2024年度の排出・吸収量9.94億t、2013年度比28.7%減（同「答案で使える数字」の「最新」）</div><div class=\"rl l1\">2023年度確報値10.17億t（同。減少幅の算定に使用）</div><div class=\"rl l1\">2035年度目標5.7億t（同「目標」）</div><div class=\"rl l1\">脱炭素先行地域は2026年2月までに133市町村・102提案が選定、3提案が辞退（同「地域脱炭素ロードマップ」答案で使える数字）</div><div class=\"rl l1\">自治体職員・地元企業・金融機関の体制確保が取組の差を生む（同「課題の観点」【人材・担い手】）</div><div class=\"rl l1\">約9割の市町村でエネルギー代金の域内外収支は域外支出が上回る（2015年度）（同「答案で使える数字」）</div><div class=\"rl l1\">重点対策加速化事業の交付期間は5年間（同「解決策に使える専門用語」）</div><div class=\"rl l1\">脱炭素先行地域は民生部門の電力消費に伴うCO2実質ゼロが核で、運輸・熱利用は地域特性に応じた対策（同「間違えやすい点」）</div><div class=\"rl l1\">再エネ導入には系統整備と蓄電池が要る（同「GX2040ビジョン」課題の観点【技術】）</div><div class=\"rl l1\">屋根置き太陽光は2030年に設置可能建築物の約50%、2040年に100%（同「地域脱炭素ロードマップ」柱）</div><div class=\"rl l1\">初期投資ゼロの導入ビジネスモデルの確立が課題（同「課題の観点」【技術】）。PPAはその一例として書いた</div><div class=\"rl l1\">脱炭素ドミノ（同「解決策に使える専門用語」）</div><div class=\"rl l1\">都道府県・連携中枢都市等との共同策定、広域での人材支援・ノウハウ共有（同「地球温暖化対策計画」リスク）</div><div class=\"rl l1\">地域協議会の開催による合意形成（同「地域脱炭素ロードマップ」課題の観点【合意形成・地域】、リスク）</div><div class=\"rl l1\">ZEB（同「地域脱炭素ロードマップ」解決策の用語）</div><div class=\"rl l0\">答案上の設定・推論（7件）：</div><div class=\"rl l1\">冒頭の「約4.2億t」「年約0.39億t」「約0.23億t」「約1.7倍」は、カードの数字からの算定（9.94−5.7=4.24、4.24÷11年、10.17−9.94=0.23）。カードに書かれた数字そのものではない。2035年度目標は排出・吸収量、2024年度も排出・吸収量で、母集団は同じ。</div><div class=\"rl l1\">「暖房需要の大きい寒冷地」「暖房に灯油・重油を使う」はA市の設定（想問題）と一般常識。実在の統計ではない。</div><div class=\"rl l1\">最重要を「経済」とした理由（採算がなければ続かず横展開されない）は推論。骨子にも（推論）と付いている。</div><div class=\"rl l1\">「交付が終わった後も事業が続く収支を組めるか」は推論。交付期間5年は事実。</div><div class=\"rl l1\">解決策の具体（PPAの費用負担の形、地域新電力、地域経済循環分析、域内融資）は一般的な制度・手法の知識で、カードの事実ではない。</div><div class=\"rl l1\">リスク1「卸電力価格の高騰で地域新電力が経営悪化」と対策（電源の多様化・需給管理・撤退基準）は推論。骨子の対策を踏襲。</div><div class=\"rl l1\">リスク2「熱・運輸の削減不足」の対策（バイオマス熱供給、地中熱、ヒートポンプ）は一般的な技術常識。</div><div class=\"rl l0\">書き方のポイント（3つ）：</div><div class=\"rl l1\">冒頭に数字の差を置いた：実績と目標の差から「必要なペース」を算定し、題意（地域の脱炭素を全国に広げる）の緊急性を示した（ガイド「数値で書く」）。</div><div class=\"rl l1\">課題の観点と実在の制度を対応させた：人材は先行地域の辞退、経済は域外流出と交付期間、技術は電力偏重と寒冷地の熱と、各課題に制度上の事実を1つ付けた。</div><div class=\"rl l1\">解決策を性質で分けた：事業の仕組み（PPA・地域新電力）／見える化（地域経済循環分析）／横展開（脱炭素ドミノ・共同策定）（ガイド「解決策の注意」）。</div><div class=\"rl l0\">自分で書くときの差し替え候補：冒頭の「寒冷地の地方都市」を担当した自治体の特性に、(2)1)の導入モデルを自分が関わった事例に、(1)1)の人材不足の具体（職員数・担当者の兼務状況）に。</div>"}, {"id": "Ⅲ-A", "kind": "選択Ⅲ", "title": "[気候] 地域の再エネ導入と生物多様性の保全の両立", "q": "<p>陸上風力発電や大規模太陽光発電の導入が進む一方、鳥類の衝突事故（バードストライク）や森林・湿地の改変など、生物多様性への影響が懸念されている。<br>(1) 地域で再生可能エネルギーの導入と生物多様性の保全を両立させるに当たり、あなたの選択科目に関わる技術者としての立場で多面的な観点から課題を抽出し、その内容を観点とともに示せ。<br>(2) 前問(1)で抽出した課題のうち最も重要と考える課題を1つ挙げ、その課題に対する複数の解決策を示せ。<br>(3) 前問(2)で示したすべての解決策を実行しても新たに生じうるリスクとそれへの対策について、専門技術を踏まえた考えを示せ。</p>", "sk": "<div class=\"rl l0\">(1) 課題</div><div class=\"rl l1\">① 立地の観点：希少種の生息地・渡りのルートと重なる。</div><div class=\"rl l1\">② 調査・評価の観点：小規模事業は環境影響評価の対象外で、影響が把握されない。</div><div class=\"rl l1\">③ 合意形成の観点：保全団体と事業者の対立。</div><div class=\"rl l1\">④ 事後管理の観点：運転開始後の影響が監視されない。</div><div class=\"rl l0\">(2) 最重要＝①（理由：一度建てると20年以上動かせない。立地で失敗すると後から取り返せない）</div><div class=\"rl l1\">解決策1：鳥類の分布・飛翔データを集めたセンシティビティマップを作り、促進区域・除外区域に反映する。</div><div class=\"rl l1\">解決策2：小規模事業向けの簡易な環境配慮の手引きと事前協議。</div><div class=\"rl l1\">解決策3：順応的管理。事後調査で衝突が多ければ稼働停止の条件を決めておく。</div><div class=\"rl l0\">(3) リスクと対策</div><div class=\"rl l1\">リスク1：除外区域が広すぎて導入目標に届かない → 屋根・既開発地を優先。</div><div class=\"rl l1\">リスク2：事後調査の費用負担で事業性が悪化 → 地域の共同モニタリング。</div>", "ans": "<p>はじめに<br>私は環境保全計画を専門とし、人口約16万人のA市の環境課で、再エネ導入の計画づくりを担当する技術者の立場である。当市は遊休農地・屋根の太陽光と丘陵地の風力に適地がある一方、南部の湿原にタンチョウやオジロワシなどの希少な鳥類が飛来する。以下、当市の陸上風力と太陽光を対象に、計画段階で打てる手を中心に述べる。</p><p>(1) 地域で再生可能エネルギーの導入と生物多様性の保全を両立させるに当たっての課題<br>1) 立地の観点：再エネの適地と、希少種の生息地や渡りのルートが重なる。湿原に近い丘陵地の風力は、バードストライクの危険が高く、遊休農地の大規模な太陽光も、採餌場所の改変につながりうる。<br>2) 調査・評価の観点：規模の小さい事業は環境影響評価の対象とならず、影響が事前に把握されない。個別の事業ごとに調査の水準もばらつき、市が影響を比較・累積して評価することができない。<br>3) 合意形成の観点：保全団体と事業者が対立し、事業の計画段階で協議が進まない。根拠となる共通のデータがなく、主張が感覚の応酬になりやすい。<br>4) 事後管理の観点：運転開始後の鳥類の衝突や生息状況が継続的に監視されない。</p><p>(2) 最も重要な課題と複数の解決策<br>最も重要な課題は1)立地の観点である。理由は、一度設置した発電設備は長期間動かせず、立地を誤ると後から運用の工夫では取り返せないためである。他の3つの課題は、立地が適切であれば影響が小さくなり、解決しやすくなる。<br>解決策は、性質の異なる次の3つを組み合わせる。<br>1) 技術：鳥類の分布・飛翔データを、市内の観察記録と専門家の調査で集め、重要度を地図に示すセンシティビティマップを作る。環境保全・事業性・社会的調整に係る情報を重ね合わせるゾーニングで、促進区域と除外区域に反映する。ポジティブゾーニングとして、環境配慮と地域貢献の要件を区域に付す。事業者は区域内で手続を簡素にでき、区域外には事前協議を求める。<br>2) 仕組み：環境影響評価の対象外となる小規模事業にも、簡易な環境配慮の手引きと事前協議を求める。手引きは、調査の項目と期間を示し、調査水準のばらつきを抑える。市が事業ごとの情報を集約でき、累積した影響も評価できる。<br>3) 運用：順応的管理を取り入れる。事後調査で衝突が多いと確認された場合に、渡りの時期の一時停止や運転条件の変更を行う条件を、事業開始前に事業者・保全団体・市で合意しておく。条件が事前に決まっていれば、事後の対立を防ぎ、事業者にとっても予見性が高まる。</p><p>(3) 前問(2)のすべての解決策を実行しても新たに生じうるリスクと対策<br>1) リスク：除外区域が広すぎて、市の導入目標に届かない。<br>対策：屋根置きや既に開発された土地への導入を優先する。国の地域脱炭素ロードマップは、設置可能な建築物の約50%への導入を2030年の目標としており、屋根は生息地を改変しない。<br>2) リスク：事後調査の費用が事業者に偏り、事業性が悪化して導入が滞る。<br>対策：事業者・市・専門家が共同でモニタリングを行い、費用と得られたデータを共有する。データは次のゾーニングの見直しにも使える。市が地域の多様な主体と連携して行う活動を認定する制度（連携増進活動実施計画）を活用し、保全団体をモニタリングの担い手に位置づければ、費用の分担と手続の簡素化も期待できる。<br>3) リスク：想定外の種や場所で影響が生じる。<br>対策：5年ごとなど期間を決めて区域と要件を見直す。事後調査で新たに確認された種や飛翔経路を地図に加え、30by30に資する自然共生サイトの認定地との整合も確認する。</p><p>保護地域とOECMを合わせた陸域の割合は、全国で21.0%（2025年時点）と、30%以上の目標に届いていない。当市の湿原は、この目標に貢献しうる資源である。再エネと保全は二者択一ではなく、立地の段階で両立を設計し、運転後も見直し続けることが、技術者の責務である。</p><p>以上</p>", "memo": "<div class=\"rl l0\">字数：1,608字（空白・改行を除く。上限1,800字）</div><div class=\"rl l0\">答案上の設定・推論：</div><div class=\"rl l1\">A市の人口・適地・湿原・希少鳥類は想定問題の架空設定。「環境課の技術者」の立場は骨子の設定</div><div class=\"rl l1\">立地を最重要とする理由（長期間動かせない）、他の課題は立地が適切なら解決しやすいとの判断は、一次資料にない判断（骨子どおり、数字は書いていない）</div><div class=\"rl l1\">センシティビティマップ、順応的管理、渡りの時期の一時停止は一般的な技術手法。バードストライクの危険が湿原近くで高いのは一般的な知見</div><div class=\"rl l1\">規模の小さい事業は環境影響評価の対象とならない、は一般的な制度の理解（定性的）。規模の閾値は書いていない</div><div class=\"rl l1\">事業者・市・専門家の共同モニタリング、5年ごとの区域見直しは設定上の提案（5年の期間はたとえ。実在の制度ではない）</div><div class=\"rl l1\">屋根置き優先の対策は骨子どおり。国のロードマップの目標を引いて根拠づけたのは本答案の組み立て</div><div class=\"rl l1\">締めの段落の「当市の自然が国の目標にとっても貴重」は答案上の主張</div><div class=\"rl l0\">書き方のポイント：</div><div class=\"rl l1\">(1)で観点を見出しに明記し、4つの課題を重ならない切り口にした（ガイド§0-2、§5）</div><div class=\"rl l1\">最重要の理由を「取り返せない」の1点で述べ、他の課題との関係も1文で示した（ガイド§0-3）</div><div class=\"rl l1\">解決策を技術・仕組み・運用と性質を変え、(3)のリスク2つに対策を対応させた（ガイド§2 解決策の注意）</div><div class=\"rl l0\">自分で書くときの差し替え候補：A市の設定を実在の地域に、センシティビティマップや事後調査は自分が関わった環境影響評価・モニタリングの実例に、締めの段落は業務で実際に取った対策に置き換える</div>"}, {"id": "Ⅰ-A", "kind": "必須Ⅰ", "title": "脱炭素電源の拡大と地域との共生", "q": "<p>政府は2025年2月に「GX2040ビジョン」と「第7次エネルギー基本計画」を閣議決定し、再生可能エネルギーを主力電源として最大限導入する方針を示した。一方、各地で、大規模な太陽光・風力発電の開発に伴う自然環境・景観への影響や、地域住民との軋轢が生じている。<br>(1) 再生可能エネルギーの導入を地域と共生する形で進めるに当たり、技術者としての立場で多面的な観点から3つの課題を抽出し、それぞれの観点を明記したうえで、その課題の内容を示せ。<br>(2) 前問(1)で抽出した課題のうち最も重要と考える課題を1つ挙げ、その課題に対する複数の解決策を、専門技術用語を交えて示せ。<br>(3) 前問(2)で示したすべての解決策を実行しても新たに生じうるリスクとそれへの対策について、専門技術を踏まえた考えを示せ。<br>(4) 前問(1)〜(3)を業務として遂行するに当たり、技術者としての倫理、社会の持続性の観点から必要となる要件・留意点を述べよ。</p>", "sk": "<div class=\"rl l0\">冒頭（2行）：GX2040ビジョン・第7次エネ基で再エネを主力電源に。導入の加速と地域の受容が両立していない。</div><div class=\"rl l0\">(1) 課題3つ</div><div class=\"rl l1\">① 環境の観点：大規模開発による森林・湿地の改変、鳥類の衝突、土砂流出。立地段階で配慮されないまま開発が進む。</div><div class=\"rl l1\">② 社会（合意形成）の観点：地域に利益が残らず、景観・騒音・防災の不安から反対運動が起きる。</div><div class=\"rl l1\">③ 技術（系統）の観点：送電網の空き容量不足で接続待ち、出力抑制が増える。</div><div class=\"rl l0\">(2) 最重要＝②（理由：①③は技術で解けるが、合意がなければ事業そのものが止まる。導入量の上限を決めているのは地域の受容（推論））</div><div class=\"rl l1\">解決策1：促進区域の設定（ポジティブゾーニング）。環境情報（希少種・景観）を重ねた地図で、適地と保全すべき場所を事前に分ける。</div><div class=\"rl l1\">解決策2：地域裨益の仕組み。地元出資・地域新電力・売電収益の一部を地域の防災や交通に還元する。</div><div class=\"rl l1\">解決策3：計画初期からの住民参加。説明会でなく、計画段階の協議会で一緒に区域を決める。</div><div class=\"rl l0\">(3) リスクと対策</div><div class=\"rl l1\">リスク1：促進区域外での開発の駆け込み → 条例による規制区域・事前協議の義務化と組み合わせる。</div><div class=\"rl l1\">リスク2：地域裨益が一部の関係者に偏り、地域内の対立を生む → 配分ルールの透明化と第三者の検証。</div><div class=\"rl l0\">(4) 倫理：公衆の安全（土砂災害）を最優先し、環境影響を科学的に評価して隠さず説明する。持続可能性：将来の撤去・廃棄（パネルのリサイクル）までを計画に含め、将来世代に負担を残さない。</div>", "ans": "<p>本問は、再生可能エネルギー（以下、再エネ）のうち、導入量の大きい太陽光と陸上風力の大規模開発を対象とする。政府は2025年2月にGX2040ビジョンと第7次エネルギー基本計画を閣議決定し、2040年度の再エネ比率を4〜5割程度（2022年度は21.8%）と見込む。導入の加速と地域の受容の両立が問われている。</p><p>(1) 地域と共生する再エネ導入の課題<br>1) 環境保全の観点<br>課題は、立地段階で自然への配慮が確保されないまま開発が進むことである。森林・湿地の改変、鳥類の衝突、造成に伴う土砂流出が生じる。事業者任せの立地選定は計画段階での回避・低減の機会を失わせる。再エネの不適正な導入は生物多様性に悪影響を及ぼし、脱炭素と自然保護の間にトレードオフが生じる。<br>2) 社会・合意形成の観点<br>課題は、地域に利益が残らず、景観・騒音・防災への不安が解消されないまま事業が進むことである。大規模太陽光では不適切な事案が問題となっており、住民との軋轢が事業の停滞を招く。主力電源化を掲げても、地域の受容が得られなければ導入量は伸びない。<br>3) 技術・系統の観点<br>課題は、出力変動の大きい再エネを受け入れる系統整備と蓄電池が追いついていないことである。安定供給には周波数・系統安定性の維持が欠かせない。系統の空き容量が小さい地域では、接続待ちと出力抑制が生じ、事業の採算が悪化する。</p><p>(2) 最も重要な課題と解決策<br>最も重要な課題は、2)社会・合意形成の観点とする。理由は、環境配慮と系統は技術と制度で対処できるが、地域の合意がなければ事業そのものが止まり、導入量の上限を地域の受容が決めるからである。<br>1) ポジティブゾーニング（再エネ促進区域）の設定<br>市町村が、希少種の生息地（鳥類のセンシティビティマップ）・景観・土砂災害リスクをGISで重ね合わせ、促進区域と保全区域を事前に分ける。区域の設定では地域協議会を開き、環境配慮と地域貢献の要件を付す。環境保全の課題にも同時に効く。<br>2) 地域裨益の仕組みの構築<br>地域GX（地域に裨益する脱炭素電源の整備）の考え方に沿い、地元企業・住民による出資、地域新電力による電力の地産地消、売電収益の一部を防災・交通・福祉に充てる地域基金を設ける。利益が地域に残る構造にする。<br>3) 計画初期からの住民参加<br>説明会で終わらせず、事業計画の段階から協議会で区域と事業条件を協議する。環境アセスメントの調査結果と、景観のフォトモンタージュ、騒音予測を公開し、不安を数値と画像で示す。運用開始後は、鳥類の衝突調査や水質の事後モニタリングを行い、結果を協議会に報告する。</p><p>(3) 全て実行しても生じうるリスクと対策<br>1) 促進区域外への開発の駆け込み<br>区域設定が、規制の緩い区域外への開発流出を招くおそれがある。対策は、条例による事前協議の義務化と、区域外での環境影響評価の厳格な運用である。<br>2) 地域内での利益配分の偏り<br>出資者や土地所有者に利益が偏ると、地域内に新たな対立が生じる。対策は、配分ルールの透明化、基金の使途の公開、第三者による定期的な検証である。<br>3) 導入拡大に伴う系統の逼迫<br>区域内に事業が集中すると、系統の空き容量が不足し接続待ちが悪化する。対策は、ノンファーム型接続の活用、蓄電池の併設、送電網の増強計画との同時策定である。</p><p>(4) 業務遂行上の要件・留意点<br>1) 技術者倫理の観点<br>公衆の安全（土砂災害・騒音）を最優先する。環境影響を科学的根拠に基づき評価し、不利な結果も隠さず説明する。環境影響評価法などの関係法令を遵守し、自らの責任範囲を明確にする。<br>2) 社会の持続性の観点<br>太陽光パネルは2030年代後半以降に排出が増え、年間最大50万t程度に達する見込みである。計画に撤去・廃棄とリサイクルの費用積立を含め、将来世代に負担を残さない。2026年6月公布の太陽電池廃棄物の再資源化等の推進に関する法律にも適合させる。環境・経済・社会の統合的向上を判断基準とする。<br>以上</p>", "memo": "<div class=\"rl l0\">字数：1,620字（空白・改行を除く。上限1,800字）</div><div class=\"rl l0\">構成：骨子（配分30・35・20・15%）どおり。変更点は2つ。(3)にリスク3「系統の逼迫」を追加（骨子はリスク2つ）、冒頭に対象を太陽光と陸上風力に絞る1文を入れた（書き方ガイド「書き出しのコツ」）。</div><div class=\"rl l0\">使った事実と出典（11件）：</div><div class=\"rl l1\">GX2040ビジョン・第7次エネルギー基本計画は2025年2月閣議決定（材料カード「GX2040ビジョン／第7次エネルギー基本計画」決定）</div><div class=\"rl l1\">2040年度の再エネ比率は4〜5割程度（同「目標」。暫定値の注記があるため「見込む」と書いた）</div><div class=\"rl l1\">2022年度の再エネ比率21.8%（同「答案で使える数字」）</div><div class=\"rl l1\">再エネの不適正な導入は生物多様性に悪影響を及ぼし、脱炭素との間でトレードオフが生じる（同「生物多様性国家戦略2023-2030」リスク・波及効果と対策）</div><div class=\"rl l1\">環境影響評価・ゾーニングによる配慮（同上のリスク対策）</div><div class=\"rl l1\">大規模太陽光発電の不適切な事案（同「令和8年版 環境白書」リスク・波及効果と対策）</div><div class=\"rl l1\">再エネ主力電源化には系統整備・蓄電池・調整力が必要。周波数・系統安定性（同「GX2040ビジョン」課題の観点【技術】、リスク）</div><div class=\"rl l1\">促進区域（ポジティブゾーニング）、地域協議会の開催、環境配慮と地域貢献の要件（同「地域脱炭素ロードマップ」解決策の用語、リスク）</div><div class=\"rl l1\">地域GX（地域裨益型の脱炭素電源整備）（同「GX2040ビジョン」解決策の用語）</div><div class=\"rl l1\">太陽光パネルは2030年代後半以降に排出が増え、年間最大50万t程度（ii1/13「定義・背景」。「見込み」と書いた）</div><div class=\"rl l1\">太陽電池廃棄物の再資源化等の推進に関する法律は令和8年法律第33号、2026年6月5日公布（同「根拠」）</div><div class=\"rl l0\">答案上の設定・推論（5件）：</div><div class=\"rl l1\">最重要を「合意形成」とした理由（導入量の上限を地域の受容が決める）は推論。骨子にも（推論）と付いている。</div><div class=\"rl l1\">リスク1「促進区域外への駆け込み」と対策（条例による事前協議の義務化）は推論。カードに記載なし。</div><div class=\"rl l1\">リスク2「地域内の配分の偏り」と対策（配分ルールの透明化・第三者検証）は推論。</div><div class=\"rl l1\">リスク3「系統の逼迫」と対策（ノンファーム型接続・蓄電池併設）は推論。ノンファーム型接続は一般的な技術用語でカードにない。</div><div class=\"rl l1\">解決策の具体（センシティビティマップ、GIS、フォトモンタージュ、地域新電力、地域基金、事後モニタリング）は一般的な技術常識によるもので、カードの事実ではない。</div><div class=\"rl l0\">書き方のポイント（3つ）：</div><div class=\"rl l1\">オウム返しの見出し：設問の言葉をそのまま見出しにした（(1)〜(4)）。(1)は3課題すべてに「〜の観点」を見出しで明記。</div><div class=\"rl l1\">最重要の理由を1文で書く：(2)冒頭で「環境と系統は技術で対処できるが合意がなければ止まる」と選定理由を述べた。解決策は、制度（ゾーニング）・仕組み（地域裨益）・人（住民参加）と性質を変えた（ガイド「解決策の注意」）。</div><div class=\"rl l1\">(4)は定型文化：倫理（安全・科学的根拠・法令・責任範囲）と持続性（将来世代・統合的向上）に、テーマ固有の中身（パネル廃棄）を1つ足した。</div><div class=\"rl l0\">自分で書くときの差し替え候補：(2)の解決策の具体（実際に関わった協議会・ゾーニング・地域裨益の事例）、(3)のリスク2（業務で見た利益配分の揉め事）、(4)の倫理の例（担当業務での安全確認の経験）。</div>"}, {"id": "Ⅰ-B", "kind": "必須Ⅰ", "title": "気候変動影響の深刻化と適応", "q": "<p>環境省は気候変動影響評価報告書（第3次）を公表し、気候変動による影響が各分野で深刻化していることを示した。熱中症による死亡者数の増加や、豪雨災害の激甚化など、影響はすでに国民生活に及んでいる。<br>(1) 気候変動の影響に対する適応を地域で進めるに当たり、技術者としての立場で多面的な観点から3つの課題を抽出し、それぞれの観点を明記したうえで、その課題の内容を示せ。<br>(2)〜(4) Ⅰ-Aと同じ。</p>", "sk": "<div class=\"rl l0\">冒頭：第3次影響評価報告書。緩和だけでは避けられない影響への備え＝適応。</div><div class=\"rl l0\">(1) 課題3つ</div><div class=\"rl l1\">① 科学的知見の観点：地域単位の将来予測と影響の情報が足りず、自治体が優先順位を付けられない。</div><div class=\"rl l1\">② 担い手の観点：地域気候変動適応計画は努力義務で、小規模自治体には専門職員がいない。</div><div class=\"rl l1\">③ 脆弱な人への配慮の観点：高齢者・屋外労働者・独居世帯など、熱中症や災害の被害が集中する人に対策が届かない。</div><div class=\"rl l0\">(2) 最重要＝②（理由：知見や対策メニューがあっても、地域で実行する人がいなければ動かない）</div><div class=\"rl l1\">解決策1：地域気候変動適応センターを中核に、近隣自治体で共同の分析・計画づくり（広域協議会の活用）。</div><div class=\"rl l1\">解決策2：防災・農業・保健など既存の計画に適応を組み込む（主流化）。新しい計画を一から作らない。</div><div class=\"rl l1\">解決策3：大学・気象台・民間との連携と、職員研修。</div><div class=\"rl l0\">(3) リスク：適応策が別の環境負荷を生む（冷房増によるCO2増・堤防による生態系の分断）→ グリーンインフラ・Eco-DRRなど緩和と両立する適応を優先。</div><div class=\"rl l0\">(4) 倫理：不確実な予測を過大にも過小にも伝えない。持続可能性：将来世代と脆弱層への公平。</div>", "ans": "<p>環境省は2026年2月、気候変動影響評価報告書（第3次）を公表した。7分野80項目を評価し、水稲の収量低下、洪水・内水の増加、熱中症の増加などを特に優先的に対応が必要な項目とした。熱中症による死亡者は令和5年に1,651人、令和6年に2,160人となり、2030年に半減する目標の基準（令和4年概数1,295人）を上回る。緩和だけでは避けられない影響への備えである適応を、人材の限られる地方の市町村で進める場合を対象とする。</p><p>(1) 地域で適応を進める課題<br>1) 科学的知見の観点<br>課題は、地域の影響と適応策の効果に関する知見が足りず、優先順位を付けられないことである。報告書でも、適応策の効果を定量的に整理できたのは小項目全体の3割程度、特に強い影響を受ける地域は4割程度、対象は5割程度にとどまる。<br>2) 担い手・制度の観点<br>課題は、地域で適応を実行する体制がないことである。地域気候変動適応計画と地域気候変動適応センターは努力義務であり、2026年3月時点の策定は491自治体、センターは70にとどまる。人材と財政力に乏しい市町村ほど遅れ、地域間の適応力の差が拡大する。<br>3) 脆弱な人への配慮の観点<br>課題は、被害が集中する人に対策が届かないことである。熱中症警戒情報（WBGT33以上の予測）は令和7年度に延べ1,749回発表されたが、情報が行動に結びつくかは、周囲に見守る人がいるかに左右される。高齢者や子どもは自助による予防が難しい場合があり、見守りや声かけなどの共助と、公助による支援が要る。</p><p>(2) 最も重要な課題と解決策<br>最も重要な課題は、2)担い手・制度の観点とする。理由は、知見や対策のメニューが整っていても、地域で実行する人がいなければ対策は動かず、1)と3)の解決の前提にもなるからである。<br>1) 広域連携による共同の分析・計画づくり<br>気候変動適応広域協議会（全国7ブロック）を活用し、近隣の市町村で地域気候変動適応センターを共同設置する。影響の分析と計画の作成を分担し、A-PLATの影響予測と国立環境研究所の専門家派遣（オンライン可）で知見を補う。<br>2) 既存計画への適応の組み込み（主流化）<br>地域防災計画、農業振興計画、保健の計画に適応の視点を組み込み、適応計画を既存の計画と一体的に策定する。新しい計画を一から作らず、少人数でも実行できる形にする。洪水・内水への備えは、防災部局の流域治水の取組と一体で進める。<br>3) 人材育成と連携体制の構築<br>大学・気象台・民間事業者と連携し、職員研修を行う。熱中症対策では、熱中症対策普及団体を指定して見守りを担わせ、指定暑熱避難施設（クーリングシェルター）を確保する。</p><p>(3) 全て実行しても生じうるリスクと対策<br>1) 適応策が別の環境負荷を生むリスク<br>堤防などのハード整備は生態系の分断と財政負担を生み、冷房の普及は電力消費とCO2排出を増やす。対策は、グリーンインフラや自然を活用した解決策（NbS）、流域治水を優先し、高効率機器・断熱・再エネ電力の導入と組み合わせて緩和と両立させることである。<br>2) 広域化により責任が曖昧になり、計画が形骸化するリスク<br>対策は、役割分担を協定で明文化し、毎年の進捗点検に加え、おおむね5年ごとの影響評価に合わせて計画を見直すことである。<br>3) 予測の不確実性により、過大または過小な対策になるリスク<br>対策は、影響評価の確信度を明示し、効果を監視しながら段階的に対策を見直す順応的管理を採ることである。</p><p>(4) 業務遂行上の要件・留意点<br>1) 技術者倫理の観点<br>住民の生命の安全を最優先する。不確実な予測を、過大にも過小にも伝えず、確信度とともに説明する。気候変動適応法などの関係法令を守り、自らの責任範囲を明確にする。<br>2) 社会の持続性の観点<br>将来世代と脆弱な人への公平を確保する。適応を、緩和や地方創生と結びつけて環境・経済・社会の統合的向上につなげ、一部の地域だけが対策できる状況を避ける。<br>以上</p>", "memo": "<div class=\"rl l0\">字数：1,615字（空白・改行を除く。上限1,800字）</div><div class=\"rl l0\">構成：骨子（配分30・35・20・15%）どおり。変更点は2つ。(3)のリスクを骨子の1つから3つに増やした（冷房増・形骸化・予測の不確実性）。冒頭で対象を「地方の市町村」に絞った（ガイド「書き出しのコツ」）。</div><div class=\"rl l0\">使った事実と出典（19件）：</div><div class=\"rl l1\">気候変動影響評価報告書（第3次）の公表は2026年2月（ii1/11「定義・背景」）</div><div class=\"rl l1\">7分野80項目（同「制度の中身・数字」）</div><div class=\"rl l1\">特に優先的に対応が必要な項目（水稲・洪水内水・暑熱）（同）</div><div class=\"rl l1\">熱中症死亡者は令和5年1,651人、令和6年2,160人（材料カード「気候変動適応計画」答案で使える数字の「最新」）</div><div class=\"rl l1\">2030年に半減する目標、基準は令和4年概数1,295人（同「目標」）</div><div class=\"rl l1\">適応策の効果の整理は3割程度、強く影響を受ける地域は4割、対象は5割程度（ii1/11「課題」）</div><div class=\"rl l1\">地域気候変動適応計画・センターは努力義務（ii1/24「制度の中身・数字」）</div><div class=\"rl l1\">2026年3月時点で491自治体が策定、センターは70（同）</div><div class=\"rl l1\">努力義務のため小規模市町村で進まず地域間の差が拡大（材料カード「気候変動適応計画」リスク）</div><div class=\"rl l1\">高齢者・こどもは自助での予防が難しい場合があり、共助と公助が要る（ii1/10「課題」2）</div><div class=\"rl l1\">熱中症警戒情報はWBGT33以上の予測、令和7年度は延べ1,749回（ii1/10「制度の中身・数字」）</div><div class=\"rl l1\">広域協議会は全国7ブロック（ii1/24）</div><div class=\"rl l1\">センターは共同設置なら1件と数える（同）</div><div class=\"rl l1\">A-PLAT、国立環境研究所の専門家派遣（オンライン可）（同「支援」）</div><div class=\"rl l1\">異なる計画を一体的に策定できる（同「間違えやすい点」）</div><div class=\"rl l1\">熱中症対策普及団体、指定暑熱避難施設（ii1/10）</div><div class=\"rl l1\">グリーンインフラ・NbS・流域治水、堤防整備が生態系の分断を生む（材料カード「気候変動適応計画」リスク・解決策の用語）</div><div class=\"rl l1\">影響評価はおおむね5年ごと、評価の観点に確信度（ii1/11、材料カード「気候変動適応計画」目標）</div><div class=\"rl l1\">気候変動適応法、「気候変動適応×地方創生」の発信（ii1/24「対策」3）</div><div class=\"rl l0\">答案上の設定・推論（6件）：</div><div class=\"rl l1\">最重要を「担い手・制度」とした理由（実行する人がいなければ動かない）は推論。骨子の選定を踏襲。</div><div class=\"rl l1\">解決策1の「影響の分析と計画の作成を分担する」運用は推論。カードは共同設置が可能なことまで。</div><div class=\"rl l1\">解決策2の具体（地域防災計画・農業振興計画との一体策定、防災部局の流域治水との連携）は推論。</div><div class=\"rl l1\">リスク1の「冷房の普及でCO2が増える」と対策（高効率機器・断熱・再エネ電力）は一般的な技術常識。</div><div class=\"rl l1\">リスク2「広域化で責任が曖昧になり形骸化」と対策（協定で役割分担を明文化）は推論。</div><div class=\"rl l1\">リスク3「過大・過小な対策」と対策（順応的管理）は推論。順応的管理は一般的な技術用語。「見守る人がいるかに左右される」も推論。</div><div class=\"rl l0\">書き方のポイント（3つ）：</div><div class=\"rl l1\">数字で課題を裏付ける：(1)で「3割・4割・5割」「491・70」と書き、「知見が足りない」「体制がない」を数値で示した（ガイド「数値で書く」）。</div><div class=\"rl l1\">最重要課題を選び、他の課題の解決の前提と位置づけた：(2)冒頭で理由を述べ、解決策3の中に脆弱層対策（見守り・避難施設）を入れて(1)の3)も回収した。</div><div class=\"rl l1\">(3)を「対策の副作用」「運用の失敗」「予測の不確実性」と性質を変えて3つ並べ、各々に対策を1文で付けた。</div><div class=\"rl l0\">自分で書くときの差し替え候補：(2)の解決策1・2（実際に関わった広域連携・既存計画への組み込みの事例）、(1)2)の人数・体制の数字、(3)2)の形骸化の実例。</div>"}, {"id": "Ⅰ-C", "kind": "必須Ⅰ", "title": "環境・経済・社会の統合的向上（シナジーとトレードオフ）", "q": "<p>第六次環境基本計画は、環境の保全を通じた「現在及び将来の国民一人一人のウェルビーイング／高い生活の質」の実現を最上位の目標に掲げ、気候変動・生物多様性の損失・汚染という3つの危機に統合的に対処することを求めている。脱炭素・資源循環・自然再興の取組の間には、相乗効果（シナジー）がある一方で、相反する関係（トレードオフ）も生じうる。<br>(1) 3つの危機への対応を統合的に進めるに当たり、技術者としての立場で多面的な観点から3つの課題を抽出し、それぞれの観点を明記したうえで、その課題の内容を示せ。<br>(2) 前問(1)で抽出した課題のうち最も重要と考える課題を1つ挙げ、その課題に対する複数の解決策を示せ。<br>(3) 前問(2)で示したすべての解決策を実行して生じる波及効果と、専門技術を踏まえた懸念事項への対応策を示せ。<br>(4) Ⅰ-Aと同じ。</p>", "sk": "<div class=\"rl l0\">冒頭：第六次環境基本計画の最上位目標と3つの危機。個別最適の対策が別の危機を悪化させる例がある。</div><div class=\"rl l0\">(1) 課題3つ</div><div class=\"rl l1\">① 脱炭素と自然の観点：再エネ開発が生態系を損なうトレードオフ。</div><div class=\"rl l1\">② 脱炭素と資源循環の観点：太陽光パネル・蓄電池の大量導入で、将来の大量廃棄と資源制約が生じる。</div><div class=\"rl l1\">③ 制度・評価の観点：施策ごとに縦割りで評価され、相乗効果も悪影響も見えない。</div><div class=\"rl l0\">(2) 最重要＝③（理由：①②は③の「見えない」ことから起きる構造的な原因（推論））</div><div class=\"rl l1\">解決策1：LCAと自然への影響評価を事業の初期段階に入れる。</div><div class=\"rl l1\">解決策2：計画の統合。地域の実行計画・生物多様性地域戦略・循環の計画を一体で作る（地域循環共生圏）。</div><div class=\"rl l1\">解決策3：企業の情報開示（TNFDなど）で、市場が相乗効果を評価する仕組み。</div><div class=\"rl l0\">(3) 波及効果：地域資源を使う事業で地域経済が回り、ウェルビーイングが上がる。懸念：評価の手間とコストが中小事業者の負担になる → 簡易ツールと支援。</div><div class=\"rl l0\">(4) 倫理・持続可能性：Ⅰ-Aと同じ型。</div>", "ans": "<p>第六次環境基本計画（2024年5月閣議決定）は、ウェルビーイング／高い生活の質を最上位に置き、気候変動・生物多様性の損失・汚染の3つの危機への統合的対処と、ネット・ゼロ、循環経済、ネイチャーポジティブの同時達成を掲げる。一方、個別に最適化した対策が別の危機を悪化させる例がある。本問は、地域で脱炭素・資源循環・自然再興を進める事業を対象とする。</p><p>(1) 3つの危機への統合的対応の課題<br>1) 脱炭素と自然再興の観点<br>課題は、再エネ開発が生態系を損なうトレードオフの回避である。再エネの不適正な導入は生物多様性に悪影響を及ぼし、大規模太陽光は土地利用で自然再興と競合する。保護地域とOECMは陸域21.0%、海域13.3%（2025年）で、30by30の目標30%に届いていない。<br>2) 脱炭素と資源循環の観点<br>課題は、太陽光パネルの大量導入が将来の大量廃棄を生むことである。排出は2030年代後半以降に年間最大50万t程度に達する見込みだが、専用のリサイクル施設の処理能力は約13万t/年で、8府県には施設がない。埋立の方が安く、費用は8,000〜12,000円/kWに対し2,000円/kW程度からである。<br>3) 制度・評価の観点<br>課題は、施策が縦割りで評価され、相乗効果も悪影響も見えないことである。自然資本への負荷を定量評価する指標や手法の整備は途上にあり、経団連調査（2022年度）では回答企業の25%が自然と事業の関連性を「わからない」と答えた。</p><p>(2) 最も重要な課題と解決策<br>最も重要な課題は、3)制度・評価の観点とする。理由は、1)と2)のトレードオフは、事業の判断時に影響が見えていないことから起きる構造的な問題であり、見える化が他の課題の解決の前提になるからである。<br>1) LCAと自然影響評価の初期段階での実施<br>事業の立地・設備の選定段階で、ライフサイクル全体のCO2、資源量、自然への影響を評価する。ミティゲーション・ヒエラルキー（回避、最小化、修復、代償）の順で対策を選び、回避を優先する。評価結果は事業計画書に添付し、事業の採否と設計変更の根拠にする。<br>2) 計画の統合（地域循環共生圏）<br>地域の実行計画、生物多様性地域戦略、循環の計画を一体で策定し、同じ地図・指標で相乗効果と悪影響を評価する。自然資本を活かし、近隣地域と資源を補完し合う地域循環共生圏の考え方で進める。<br>3) 情報開示による市場の評価<br>TNFDなどの開示と、調達・ファイナンスの実践ガイドライン（2026年に公表）を活用し、金融機関と取引先が事業の自然・脱炭素への影響を評価する仕組みにする。</p><p>(3) 全て実行した場合の波及効果と、懸念への対応<br>1) 波及効果<br>ネイチャーポジティブへの移行は、2030年に日本で年47兆円のビジネス機会を生むと試算され、その4分の3以上が炭素中立・循環経済と強く関連する。地域資源を活用する事業で地域経済が回り、生活の質が高まる。脱炭素の設備投資が、再生材の利用や自然の回復と同じ地域で重なるためである。<br>2) 懸念1：評価・開示のコストが中小事業者に偏る<br>対策は、業種別の簡易評価ツール、段階的な導入、地域金融機関と連携した支援である。<br>3) 懸念2：評価の手続が増え、事業が遅れて脱炭素の速度が落ちる<br>対策は、場所に紐づく自然のデータ基盤を整え、リモートセンシングやAIで調査を効率化し、環境影響評価と評価データを共通化することである。<br>4) 懸念3：評価手法が未成熟で、結果の不確実性が大きい<br>対策は、不確実性を明示し、事後モニタリングで見直す順応的管理を採ることである。</p><p>(4) 業務遂行上の要件・留意点<br>1) 技術者倫理の観点<br>公衆の安全と健康を最優先する。評価の前提と不確実性を、科学的根拠に基づき隠さず説明する。関係法令を守り、自らの責任範囲を明確にする。<br>2) 社会の持続性の観点<br>環境・経済・社会の統合的向上を判断基準とし、特定の危機への対策が別の危機を悪化させていないかを確認する。将来世代に廃棄物や生態系の劣化を残さない。<br>以上</p>", "memo": "<div class=\"rl l0\">字数：1,645字（空白・改行を除く。上限1,800字）</div><div class=\"rl l0\">構成：骨子（配分30・35・20・15%）どおり。変更点は2つ。(3)を骨子の「波及効果1つ＋懸念1つ」から「波及効果1つ＋懸念3つ」に広げた。問題文(3)が「波及効果」と「懸念事項への対応策」の両方を求めているため。(2)解決策3に調達・ファイナンスのガイドラインを加えた（骨子はTNFD開示のみ）。</div><div class=\"rl l0\">使った事実と出典（17件）：</div><div class=\"rl l1\">第六次環境基本計画は2024年5月閣議決定、最上位はウェルビーイング／高い生活の質（材料カード「第六次環境基本計画」決定・根拠）</div><div class=\"rl l1\">3つの危機への統合的対処、ネット・ゼロ・循環経済・ネイチャーポジティブの同時達成（同「第五次循環型社会形成推進基本計画」解決策の用語。問題文の記述も踏襲）</div><div class=\"rl l1\">再エネの不適正な導入が生物多様性に悪影響を与え、トレードオフが生じる（同「生物多様性国家戦略2023-2030」リスク）</div><div class=\"rl l1\">大規模太陽光発電は自然再興と土地利用で競合する（同「令和8年版 環境白書」リスク）</div><div class=\"rl l1\">保護地域とOECMは陸域21.0%、海域13.3%（2025年）、目標30%（同「生物多様性国家戦略」答案で使える数字）</div><div class=\"rl l1\">パネルの排出は2030年代後半以降、年間最大50万t程度（ii1/13「定義・背景」。「見込み」と書いた）</div><div class=\"rl l1\">専用リサイクル施設の処理能力は約13万t/年、8府県に施設がない（同「制度の中身・数字」）</div><div class=\"rl l1\">リサイクル費用8,000〜12,000円/kW、埋立2,000円/kW程度〜（同）</div><div class=\"rl l1\">自然資本への負荷を定量評価する指標・手法の整備が途上（ii1/17「課題」1）</div><div class=\"rl l1\">経団連調査（2022年度）で回答企業の25%が「事業との関連性がわからない」（同「課題」2）</div><div class=\"rl l1\">ミティゲーション・ヒエラルキー（同「制度の中身・数字」5つの要素）</div><div class=\"rl l1\">地域循環共生圏（材料カード「第六次環境基本計画」解決策の用語）</div><div class=\"rl l1\">TNFD（同「生物多様性国家戦略」解決策の用語）</div><div class=\"rl l1\">調達・ファイナンスの実践ガイドラインは2026年に公表（ii1/17「制度の中身・数字」）</div><div class=\"rl l1\">2030年に日本で年47兆円のビジネス機会、その4分の3以上が炭素中立・循環経済と関連（同）</div><div class=\"rl l1\">開示コストが中小企業に偏る。段階的な導入支援・地域金融機関との連携（材料カード「生物多様性国家戦略」リスク）</div><div class=\"rl l1\">データ基盤、リモートセンシング、AI活用（ii1/17「対策・今後の方向」1）</div><div class=\"rl l0\">答案上の設定・推論（7件）：</div><div class=\"rl l1\">最重要を「制度・評価」とした理由（トレードオフは見えないことから起きる構造的な問題）は推論。骨子にも（推論）と付いている。</div><div class=\"rl l1\">LCA結果を事業計画書に添付し採否の根拠にする運用は推論。LCA自体は一般的な技術手法でカードにない。</div><div class=\"rl l1\">計画統合で「同じ地図・指標で相乗効果と悪影響を評価する」運用は推論。</div><div class=\"rl l1\">波及効果の「脱炭素の設備投資が再生材の利用や自然の回復と同じ地域で重なる」という説明は推論。</div><div class=\"rl l1\">懸念1の「業種別の簡易評価ツール」は推論（材料カード側も推論付き）。</div><div class=\"rl l1\">懸念2「評価の手続が増えて事業が遅れる」と対策（環境影響評価との共通化）は推論。</div><div class=\"rl l1\">懸念3「評価手法が未成熟で不確実」と対策（順応的管理）は推論。順応的管理は一般的な技術用語。</div><div class=\"rl l0\">書き方のポイント（3つ）：</div><div class=\"rl l1\">課題を「AとBのトレードオフ」の形で観点名に入れた：「脱炭素と自然再興」「脱炭素と資源循環」と、題意（シナジーとトレードオフ）をそのまま観点にした（ガイド「観点を明記」）。</div><div class=\"rl l1\">数字で現状の厳しさを示した：30by30の進捗、パネル50万t対13万t/年、費用差。課題の中身を数値で書く型（ガイド「数値で書く」）。</div><div class=\"rl l1\">(3)で相乗効果（47兆円）を先に書き、続けて懸念と対策を番号で並べた。問題文が「波及効果」と「懸念」の両方を求めているので、その順に見出しを立てた（オウム返し）。</div><div class=\"rl l0\">自分で書くときの差し替え候補：(1)1)の自然配慮の失敗例、(2)1)のLCAや環境影響評価の実務経験、(3)の懸念2（業務での手続負担の実感）。</div>"}, {"id": "Ⅱ-2-B", "kind": "選択Ⅱ-2", "title": "企業の温室効果ガス排出量の算定と開示", "q": "<p>サステナビリティ基準委員会（SSBJ）は2025年3月にサステナビリティ開示基準を公表した。2026年2月の内閣府令の改正により、プライム市場上場企業のうち時価総額の大きい企業から順に、有価証券報告書でのSSBJ基準に準拠した開示が義務化される。あなたが製造業の企業で、自社のScope1・2・3の排出量の算定と開示の体制づくりを担当することになった場合、以下の内容について記述せよ。<br>(1)〜(3) Ⅱ-2-Aと同じ。</p>", "sk": "<div class=\"rl l0\">1. 自社の概要と方針：食品加工の製造業（推論の設定）。Scope3はカテゴリ1（購入した原材料）が大半。方針＝Scope3のカテゴリ1の精度向上に絞る。</div><div class=\"rl l0\">(1) 調査・検討事項：開示義務の時期の確認（時価総額の区分）／算定範囲（組織・カテゴリ）／データの所在（購買・物流・エネルギー）／排出原単位の選び方／第三者保証。</div><div class=\"rl l0\">(2) 手順</div><div class=\"rl l1\">①現状の算定方法の棚卸し → 留意：前年との比較可能性。</div><div class=\"rl l1\">②重要カテゴリの特定 → 工夫：金額×原単位で概算し上位から精緻化。</div><div class=\"rl l1\">③サプライヤーの一次データ収集 → 留意：取引先の負担。</div><div class=\"rl l1\">④社内の算定規程・承認フロー → 留意：財務情報と同じ時期・同じ精度。</div><div class=\"rl l1\">⑤開示文案と保証対応。</div><div class=\"rl l0\">(3) 調整：経理・IR（財務報告と同時開示）／購買（サプライヤーへの依頼）／取引先（説明会・算定ツールの提供）／監査法人・保証機関。</div>", "ans": "<p>1. 当社の概要と方針<br>当社は北海道に主力工場を持つ食品加工メーカーで、想定する平均時価総額は約8,000億円である。SSBJ基準に準拠した有価証券報告書の開示は、5,000億円以上の区分で2029年3月期の予定であり、準備期間は約2年である。Scope3は購入した原材料（カテゴリ1）が大半を占める。そこで本稿は、カテゴリ1の算定精度の向上に論点を絞る。</p><p>2. 調査、検討すべき事項とその内容<br>1) 開示義務の時期：時価総額は過去5事業年度末の平均で判定される。1兆円に近く、上回れば2028年3月期に早まるため、毎期の水準を確認する。<br>2) 算定範囲：連結の組織境界とScope3のカテゴリを確定する。<br>3) データの所在：エネルギー使用量は工場、購入量・金額は購買、物流は物流部門にある。システムと担当者を洗い出す。<br>4) 排出原単位：金額ベースと物量ベースの原単位を、データの有無に応じて選ぶ。温対法の制度による排出量を使う場合の開示の扱いも確認する。<br>5) 第三者保証：保証は適用義務化の翌年から義務づけられ、当初2年は範囲が限定される。算定根拠を後から検証できる形で残す。</p><p>3. 業務を進める手順と留意点、工夫を要する点<br>1) 現状の算定方法の棚卸し：留意点は、前年との比較可能性を保つことである。方法を変えるときは過去分を再計算する。<br>2) 重要カテゴリの特定：工夫は、全カテゴリを購入金額×原単位で概算し、上位から精緻化することである。限られた人員で、削減につながる範囲に労力を集中できる。<br>3) サプライヤーの一次データ収集：原料の主要な調達先から、製造時のエネルギー使用量など実測値を集める。留意点は、取引先の負担である。算定ツールを当社が提供する。<br>4) 算定規程と承認フロー：留意点は、財務情報と同じ時期・同じ精度で算定することである。有価証券報告書は財務報告と同時に提出されるためである。<br>5) 開示文案と保証への対応：工夫は、最初の2事業年度に認められる二段階開示（訂正報告書での記載）と、Scope3の初年度免除を使える前提で計画しつつ、免除に頼らず初年度から開示できる体制を目指すことである。</p><p>4. 関係者との調整方策<br>1) 経理・IR：財務報告と同じ日程で動けるよう、算定の締め日と承認の期限を合わせる。<br>2) 購買：サプライヤーへの依頼を購買の窓口に一本化し、取引条件の交渉と混ざらないようにする。<br>3) 取引先：説明会を開き、算定ツールと記入例を提供して負担を下げる。<br>4) 監査法人・保証機関：登録された保証業務実施者に、早い時期から算定の根拠資料の形式を確認する。</p><p>以上</p>", "memo": "<div class=\"rl l0\">字数：1,069字（空白・改行を除く。上限1,200字）</div><div class=\"rl l0\">答案上の設定・推論：</div><div class=\"rl l1\">食品加工メーカー・平均時価総額約8,000億円・準備期間約2年は答案上の設定（実在企業ではない）。5,000億円以上の区分は、2026年6月30日時点で金融審議会WG報告の方針（予定）にとどまり、府令で義務づけたのは1兆円以上（カード「制度の中身・数字」）。答案では「予定」と書いた</div><div class=\"rl l1\">Scope3カテゴリ1が大半という設定、論点をカテゴリ1に絞る判断（骨子どおり、推論）</div><div class=\"rl l1\">GHGプロトコルのカテゴリ区分、金額ベース・物量ベースの原単位、一次データ、算定ツールの提供は一般的な技術常識</div><div class=\"rl l1\">経理・購買・取引先・保証機関への調整内容は設定上の判断</div><div class=\"rl l0\">書き方のポイント：</div><div class=\"rl l1\">冒頭で想定企業と義務化の時期を数字で置き、論点を1つに絞った（ガイド§4 数量の設定・論点の絞り込み）</div><div class=\"rl l1\">手順ごとに「留意点」「工夫」を明記し、設問(2)に直接答えた（ガイド§4 構成）</div><div class=\"rl l1\">最終段で「経過措置を使える前提で計画しつつ頼らない」と、制度の知識と判断を同時に示した（ガイド§4 理由を必ず添える）</div><div class=\"rl l0\">自分で書くときの差し替え候補：自社（または顧客）の業種・時価総額の区分、算定の実務で詰まった点（原単位の選び方、調達先データの集め方）、取引先とのやりとりの実例</div>"}, {"id": "Ⅱ-2-C", "kind": "選択Ⅱ-2", "title": "熱中症特別警戒情報への対応", "q": "<p>2023年の気候変動適応法の改正により、熱中症特別警戒情報が創設され、市町村長は指定暑熱避難施設（クーリングシェルター）を指定できるようになった。あなたが市の担当者として熱中症対策の実施計画づくりを担当することになった場合、以下の内容について記述せよ。<br>(1)〜(3) Ⅱ-2-Aと同じ。</p>", "sk": "<div class=\"rl l0\">1. 本市の概要と方針：寒冷地だが近年は猛暑日が出始め、エアコンのない高齢世帯が多い（推論の設定）。方針＝高齢者の屋内熱中症に絞る。</div><div class=\"rl l0\">(1) 調査・検討事項：過去の救急搬送データ（年齢・場所）／エアコン保有状況／クーリングシェルター候補（公共施設・商業施設の冷房・開館時間）／見守りの担い手。</div><div class=\"rl l0\">(2) 手順</div><div class=\"rl l1\">①データ分析で優先地区 → 留意：個人情報の扱い。</div><div class=\"rl l1\">②シェルターの指定 → 工夫：民間施設との協定、地図とアプリで周知。</div><div class=\"rl l1\">③熱中症特別警戒情報の発表時の連絡体制 → 留意：休日夜間。</div><div class=\"rl l1\">④見守り（民生委員・介護事業者）→ 留意：負担の集中。</div><div class=\"rl l1\">⑤検証と改善。</div><div class=\"rl l0\">(3) 調整：保健福祉部局・防災部局・消防（搬送データ）・民間施設・民生委員・気象台。</div>", "ans": "<p>1. 本市の概要と方針<br>当市は人口約16万人、65歳以上が約33%（約5.3万人）の寒冷地の都市である。冬は−20℃を下回る一方、エアコンのない高齢世帯が多く、近年は猛暑日も出始めている。そこで本稿は、高齢者の屋内での熱中症に論点を絞る。実施計画は、特別警戒情報の発表時だけでなく、発表頻度の高い警戒情報の段階から動く計画とする。</p><p>2. 調査、検討すべき事項とその内容<br>1) 救急搬送データ：過去の年齢・発生場所・時間帯を分析し、屋内で発症する高齢者の多い地区を特定する。<br>2) 世帯の状況：エアコンの保有状況と高齢単身世帯の分布を、福祉部局の情報で把握する。<br>3) クーリングシェルターの候補：公共施設と商業施設の冷房設備、開館時間、バリアフリー、徒歩圏の分布を調べる。特別警戒情報は都道府県内の全地点で暑さ指数（WBGT）35以上が予測されたときに限られる。2024年4月の運用開始から発表は0回のため、WBGT33以上で出る警戒情報の日にも開放できる施設かを確認する。<br>4) 見守りの担い手：民生委員、介護事業者、熱中症対策普及団体の候補の人数と負担を確認する。</p><p>3. 業務を進める手順と留意点、工夫を要する点<br>1) データ分析による優先地区の設定：留意点は個人情報の扱いである。個人が特定されない集計単位で分析し、利用目的を庁内で定める。<br>2) シェルターの指定：市町村長が指定する施設である。工夫は、商業施設や福祉施設と協定を結び、公共施設の閉まる休日・夜間もカバーすることである。地図とアプリで場所を周知する。<br>3) 発表時の連絡体制：特別警戒情報は環境大臣から知事を経て市町村長へ、前日の14時頃に伝わる。留意点は休日・夜間の受信体制である。当番制とし、庁内と民間施設への連絡を前日中に終える。<br>4) 見守りの実施：エアコンの使用を促す声かけを、民生委員と介護事業者が担う。留意点は、担い手の負担の集中を避けることである。訪問先を優先地区に絞り、負担を平準化する。<br>5) 検証と改善：夏の終わりに、搬送件数とシェルターの利用実績を確認して計画を見直す。2030年に死亡者数を半減する国の目標に合わせ、市の目標も設ける。</p><p>4. 関係者との調整方策<br>1) 庁内：保健福祉部局、防災部局、消防を一つの会議体に束ねる。搬送データと福祉情報を同じ席で共有でき、判断が早くなる。<br>2) 民間施設：協定の内容を統一し、開放の条件と費用負担を明確にする。<br>3) 民生委員・介護事業者：研修を行い、役割と連絡先を共有する。<br>4) 気象台：特別警戒情報と警戒情報の見通しを早めに得る体制を取る。</p><p>以上</p>", "memo": "<div class=\"rl l0\">字数：1,062字（空白・改行を除く。上限1,200字）</div><div class=\"rl l0\">答案上の設定・推論：</div><div class=\"rl l1\">A市の人口16万人・65歳以上約33%は想定問題の架空設定。約5.3万人は16万人×33%の概算</div><div class=\"rl l1\">エアコンのない高齢世帯が多い、近年猛暑日が出始めている、は骨子の設定（推論。実在の統計ではない）</div><div class=\"rl l1\">論点を高齢者の屋内熱中症に絞る判断、警戒情報の段階から動く計画とする判断（発表実績0回という事実からの推論）</div><div class=\"rl l1\">警戒情報の日にも開放できる施設かの確認は、法定の開放義務が特別警戒情報の発表時に限られる（カード「間違えやすい点」）ことを踏まえた、市の自主的な運用の提案</div><div class=\"rl l1\">当番制、地図とアプリでの周知、協定の統一、搬送データの集計単位は一般的な実務の提案</div><div class=\"rl l1\">市の目標を国の半減目標に合わせて設ける点は設定上の判断（目標値は書いていない）</div><div class=\"rl l0\">書き方のポイント：</div><div class=\"rl l1\">冒頭で市の人口・高齢化率を数字で置き、論点を1つに絞った（ガイド§4 数量の設定）</div><div class=\"rl l1\">制度の事実（発表0回、法定の開放時期）を、計画の工夫（警戒情報から動く）に直結させた（ガイド§4 理由を必ず添える）</div><div class=\"rl l1\">手順ごとに留意点と工夫を書き、設問(2)に直接答えた（ガイド§4 構成）</div><div class=\"rl l0\">自分で書くときの差し替え候補：市の高齢化率・搬送件数・エアコン保有率を実在の自治体の数字に、シェルター候補を実際の施設に、見守り体制を自分の関わった事例に置き換える</div>"}, {"id": "Ⅲ-B", "kind": "選択Ⅲ", "title": "[循環] 動脈産業と静脈産業の連携による資源循環", "q": "<p>2024年5月に再資源化事業等高度化法が成立し、廃棄物処理・リサイクル事業者（静脈産業）と製造事業者（動脈産業）が連携して、再生材の質と量を確保する取組が求められている。<br>(1) 製造業で再生材の利用を拡大するに当たり、あなたの選択科目に関わる技術者としての立場で多面的な観点から課題を抽出し、その内容を観点とともに示せ。<br>(2)(3) Ⅲ-Aと同じ。</p>", "sk": "<div class=\"rl l0\">(1) 課題</div><div class=\"rl l1\">① 品質の観点：再生材の品質のばらつき・不純物。</div><div class=\"rl l1\">② 量・供給の観点：安定した量が集まらない。</div><div class=\"rl l1\">③ 設計の観点：製品がリサイクルしにくい構造。</div><div class=\"rl l1\">④ コストの観点：バージン材より割高。</div><div class=\"rl l0\">(2) 最重要＝①（理由：品質が保証されなければ設計者は採用できず、他の課題を解いても使われない）</div><div class=\"rl l1\">解決策1：静脈事業者と品質規格を共同で決め、選別・洗浄の工程を改善する。</div><div class=\"rl l1\">解決策2：トレーサビリティ（デジタル製品パスポート等）で出所と組成を管理する（推論）。</div><div class=\"rl l1\">解決策3：再生材を前提にした設計（単一素材化・易解体設計）。</div><div class=\"rl l0\">(3) リスク：再生材の取り合いによる価格高騰 → 長期契約・地域内循環。リスク：再生工程のエネルギー増 → LCAで確認。</div>", "ans": "<p>はじめに<br>私は環境保全計画を専門とし、A市に工場を持つ食品用の樹脂容器メーカーで、製品の設計を担当する技術者の立場である。当社は容器の原料の一部を再生材に置き換える計画を持つ。再資源化事業等高度化法（2024年5月成立）は、静脈産業と動脈産業の連携による再生材の質と量の確保を求めている。以下、設計者の立場から述べる。</p><p>(1) 製造業で再生材の利用を拡大するに当たっての課題<br>1) 品質の観点：再生材は、原料の由来によって物性や不純物の量がばらつく。食品に触れる容器では、臭いや異物の混入が許されず、設計者は安定した品質が保証されない材料を使えない。<br>2) 量・供給の観点：回収された使用済み樹脂が安定した量で集まらず、必要な時期に必要な量を調達できない。生産計画に合わせた調達ができないと、再生材の配合を安定して続けられない。<br>3) 設計の観点：複数の素材の貼り合わせや接着剤の使用など、製品がリサイクルしにくい構造になっている。使用済みの容器から高品質の再生材を得にくく、品質の課題の一因にもなっている。<br>4) コストの観点：再生材は選別・洗浄の費用がかかり、バージン材より割高になりやすい。価格差を製品価格に転嫁しにくく、経営判断で後回しにされる。</p><p>(2) 最も重要な課題と複数の解決策<br>最も重要な課題は1)品質の観点である。理由は、品質が保証されなければ設計者は採用を判断できず、量やコストを解決しても使われないためである。<br>解決策は、技術・仕組み・設計の3つの性質で組み合わせる。<br>1) 技術：静脈事業者と、不純物や物性について共通の品質規格を決め、選別・洗浄の工程を改善する。規格は当社の受け入れ検査の基準にもそのまま使い、基準を満たすロットだけを購入する。再資源化事業等高度化法は、製造側の需要に応じた質・量の再生材を確保する高度再資源化事業計画を、環境大臣が認定する仕組みを設けている。認定を受ければ廃棄物処理法の許可の特例を受けられるため、静脈事業者と共同で計画を作る動機が生まれる。<br>2) 仕組み：デジタル製品パスポートのように、再生材の出所と組成をデータで管理し、ロットごとの品質を追跡できるようにする。不具合が出たときに、原因となった工程にさかのぼれる。品質の根拠を示せれば、取引先や消費者への説明もしやすくなる。<br>3) 設計：再生材を前提にした設計に変える。単一素材化と易解体設計で、不純物の混入を元から減らす。使用済みの容器が高品質の再生材として戻る循環が生まれ、品質の課題を製品側からも解く。プラスチック資源循環促進法の設計認定は、この方向の優れた製品を後押しする制度であり、認定の取得を目標に置く。</p><p>(3) 前問(2)のすべての解決策を実行しても新たに生じうるリスクと対策<br>1) リスク：再生材の需要が各社で同時に高まり、取り合いで価格が高騰する。<br>対策：静脈事業者との長期契約を結ぶ。また、市内の食品工場や小売店から出る使用済み容器を回収する地域内の循環を作り、調達先を複数に分け、価格の見通しを半年ごとに見直す。<br>2) リスク：再生工程で洗浄・加熱のエネルギーが増え、かえってCO2排出が増える。<br>対策：ライフサイクルアセスメント（LCA）で、バージン材との排出量を比較し、削減になる配合率の範囲を確認する。工程には再エネ電力を使う。<br>3) リスク：再生材の有害物質の管理が不十分で、製品の安全性に懸念が生じる。<br>対策：受け入れ検査の項目に有害物質を加え、基準に満たないロットを使わない手順を設計と品質保証で決める。設計変更の際は、安全性の確認を完了するまで出荷しない。</p><p>再生材の利用は、2030年度に出口側の循環利用率約44%を目指す国の循環の目標につながる。設計者は、品質を保証できる範囲から配合率を高め、成果を静脈事業者と共有しながら、段階的に利用を広げる。当社では、まず非食品接触部の部材から始め、実績を積んで食品に触れる部位へ広げる。</p><p>以上</p>", "memo": "<div class=\"rl l0\">字数：1,609字（空白・改行を除く。上限1,800字）</div><div class=\"rl l0\">答案上の設定・推論：</div><div class=\"rl l1\">食品用の樹脂容器メーカー、設計者の立場、A市に工場、は答案上の設定（骨子の「製造業の設計技術者」をさらに具体化）</div><div class=\"rl l1\">品質を最重要とする理由（採用判断ができない）は骨子どおり（推論）</div><div class=\"rl l1\">再生材の物性・不純物のばらつき、食品容器での臭い・異物の懸念、単一素材化・易解体設計、LCAは一般的な技術常識</div><div class=\"rl l1\">デジタル製品パスポートを再生材のロット追跡に使う提案は骨子で（推論）とされたもの。制度としてDPPの記述はカードにあるが、再生材のロット管理への応用は答案上の提案</div><div class=\"rl l1\">再生材の取り合いによる価格高騰、再生工程のエネルギー増は骨子どおり（推論）。長期契約・地域内循環・調達先の分散・再エネ電力は提案</div><div class=\"rl l1\">設計認定の取得を目標に置くのは提案。認定対象は特定の製品分野に限られるため、自社の製品が対象かは要確認</div><div class=\"rl l1\">認定を受ければ静脈事業者と共同で計画を作る動機が生まれる、は答案上の論理</div><div class=\"rl l1\">まず非食品接触部の部材から配合を始める進め方は答案上の提案（食品接触部位の法規制の確認は書いていない。実務では要確認）</div><div class=\"rl l0\">書き方のポイント：</div><div class=\"rl l1\">立場を設計者に絞り、課題を品質・量・設計・コストの4観点で書いた（ガイド§5 コツ「立場を絞ると具体的」）</div><div class=\"rl l1\">解決策を技術・仕組み・設計と性質を変え、法の仕組みを「動機が生まれる」と解決策の効果に結びつけた（ガイド§2 解決策の注意）</div><div class=\"rl l1\">(3)で3つのリスクに対策を1対1で対応させ、最後は設計者の行動で締めた（ガイド§5 コツ）</div><div class=\"rl l0\">自分で書くときの差し替え候補：製品・素材を自分の担当に、品質規格の決め方や静脈事業者とのやりとりを実際の経験に、配合率などの数字を自社の実績値に置き換える</div>"}, {"id": "Ⅲ-C", "kind": "選択Ⅲ", "title": "[気候] 産業の脱炭素化と水素・CCS", "q": "<p>2024年5月に水素社会推進法とCCS事業法が成立し、排出削減が難しい産業（製鉄・化学・セメントなど）の脱炭素化に向けて、低炭素水素等の供給とCO2の回収・貯留の事業環境が整備されつつある。<br>(1) 排出削減が難しい産業の脱炭素化を地域で進めるに当たり、あなたの選択科目に関わる技術者としての立場で多面的な観点から課題を抽出し、その内容を観点とともに示せ。<br>(2)(3) Ⅲ-Aと同じ。</p>", "sk": "<div class=\"rl l0\">(1) 課題</div><div class=\"rl l1\">① コストの観点：低炭素水素と既存燃料の価格差。</div><div class=\"rl l1\">② インフラの観点：水素・CO2の輸送網と貯留適地。</div><div class=\"rl l1\">③ 安全・社会受容の観点：水素の爆発・CO2の漏洩への不安。</div><div class=\"rl l1\">④ 制度の観点：CO2の排出削減としての計上ルール。</div><div class=\"rl l0\">(2) 最重要＝①</div><div class=\"rl l1\">解決策1：価格差に着目した支援（水素社会推進法の支援制度）の活用。</div><div class=\"rl l1\">解決策2：需要の集積。コンビナートで複数の事業者が共同利用し、単価を下げる（拠点整備）。</div><div class=\"rl l1\">解決策3：排出量取引（GX-ETS）による炭素価格で、相対的な価格差を縮める。</div><div class=\"rl l0\">(3) リスク：CO2の貯留後の長期の漏洩監視 → モニタリング義務と、事業者の責任の移転時期の明確化。リスク：既存燃料の固定化（ロックイン）→ 段階的な目標と見直し。</div>", "ans": "<p>はじめに<br>私は環境保全計画を専門とし、A市で食品加工工場の脱炭素化の計画づくりを担当する技術者の立場である。当市には、でん粉・乳製品・砂糖の工場があり、蒸気をつくる重油ボイラーと、原料の乾燥・煮詰めの高温の熱が、排出の大半を占める。電化しにくい高温熱が、当市での排出削減が難しい領域である。水素社会推進法とCCS事業法（2024年5月成立）を使う前提で述べる。</p><p>(1) 排出削減が難しい産業の脱炭素化を地域で進めるに当たっての課題<br>1) コストの観点：低炭素水素等はまだコストが高く、既存の燃料との間に大きな価格差がある。価格差のまま投資すると、工場の収益を圧迫する。<br>2) インフラの観点：水素やCO2を運ぶ導管・港湾と、CO2の貯留に適した場所が地域にない。単独の工場では整備できず、貯留は道内の海域などへ運ぶ必要がある。<br>3) 安全・社会受容の観点：水素の爆発やCO2の漏えいに、住民や従業員が不安を持つ。不安が解消されないと、立地や輸送の合意が得られず、事業が進まない。<br>4) 制度の観点：水素等の製造時の排出（炭素集約度）やCO2の貯留量を、排出削減としてどう計上するかのルールが整備の途上にある。計上が不明確では、投資の効果を経営層に示せない。</p><p>(2) 最も重要な課題と複数の解決策<br>最も重要な課題は1)コストの観点である。理由は、価格差が解消されなければ事業者は投資を決められず、インフラや制度が整っても使われないためである。<br>解決策は、支援・集積・価格の3つの性質で組み合わせる。<br>1) 支援：水素社会推進法の計画認定を使う。供給事業者と利用事業者が共同の計画を作り、主務大臣の認定を受けると、JOGMECが既存燃料との価格差に着目した助成を行う。助成の交付はJOGMECが行い、価格差支援には供給と利用の両事業者の連名の計画が要る。そこで、当市の工場と水素の供給事業者が、早い段階から共同の計画を整える。供給が一定期間内に始まり継続することが認定の要件であるため、供給側の見通しの確認が計画の出発点になる。<br>2) 集積：需要を集める。市内の複数の工場が水素の受け入れ設備を共同で使い、拠点整備の支援を受ける。需要が集まれば、供給の単価が下がり、導管や貯蔵の整備費も分担できる。港湾法や高圧ガス保安法の特例も、手続の短縮に使う。<br>3) 価格：将来の既存燃料の相対価格を投資判断に織り込む。2026年度に始まる排出量取引と、2028年度から徴収される化石燃料賦課金により、重油などの化石燃料に炭素のコストが加わる。移行の時期と価格水準の見通しを社内で共有し、早く取り組むほど将来の負担が軽くなると経営層に示す。</p><p>(3) 前問(2)のすべての解決策を実行しても新たに生じうるリスクと対策<br>1) リスク：CO2を貯留した後の長期の漏えいと、監視費用の確保。<br>対策：CCS事業法は、貯留開始後の温度・圧力等の監視と報告を貯留事業者に義務づけ、損害には貯留事業者が無過失責任を負う。注入終了後の管理は、拠出金を納めた貯留事業者に代わってJOGMECに移る。当社はこれらの制度の範囲を確認した上で貯留事業者を選び、貯留事業者との契約に、監視の頻度と結果の報告を盛り込む。<br>2) リスク：水素やCCSへの投資で既存の化石燃料の設備が固定化し、より削減効果の高い電化・省エネが遅れる（ロックイン）。<br>対策：段階的な目標を置き、電化できる低温の熱は先にヒートポンプ等へ切り替える。水素とCCSは高温の熱だけに使い、5年ごとに見直す。こうして、ロックインを避けながら、削減量を段階的に積み上げる。<br>3) リスク：水素の取り扱いの事故。<br>対策：高圧ガス保安法に基づく保安の基準に従うとともに、従業員の教育と、地域住民への説明会を計画段階から開く。</p><p>排出削減の難しい産業の脱炭素化は、一つの工場では完結しない。当市の事業者が需要を束ね、国の支援の仕組みを使いこなす調整役を、技術者として担う。</p><p>以上</p>", "memo": "<div class=\"rl l0\">字数：1,611字（空白・改行を除く。上限1,800字）</div><div class=\"rl l0\">答案上の設定・推論：</div><div class=\"rl l1\">A市の食品加工工場（でん粉・乳製品・砂糖）は想定問題の架空設定。高温の熱（重油ボイラー・乾燥・煮詰め）が排出の大半という設定は答案上の想定で、実在の統計ではない。製鉄・化学・セメントではなく地域の産業に合わせて立場を設定した</div><div class=\"rl l1\">コストを最重要とする理由は骨子どおり（推論）</div><div class=\"rl l1\">導管・港湾・貯留適地が地域にない、貯留は道内の海域などへ運ぶ必要がある（道内の苫小牧沖が2025年2月に特定区域に指定されたことは、ii1/03にあるが答案には書いていない）、水素の爆発・CO2漏えいの不安は一般的な知見（定性）</div><div class=\"rl l1\">排出量取引と賦課金で化石燃料の相対価格が上がる、という説明は制度趣旨からの推論。A市の工場が排出量取引の対象事業者かは不明で、答案では対象とは書いていない（対象は直近3年度平均のCO2排出量が10万トン以上の事業者）</div><div class=\"rl l1\">当社が貯留事業者を選ぶ・契約に監視の頻度を盛り込む、は答案上の提案。実際は排出事業者が貯留事業者と結ぶ契約の内容として検討する</div><div class=\"rl l1\">ヒートポンプで低温熱を先に切り替え、水素とCCSは高温の熱に限る、5年ごとの見直し、は一般的な技術判断に基づく提案</div><div class=\"rl l1\">高圧ガス保安法の保安基準、従業員の教育と住民説明会は一般的な実務の提案</div><div class=\"rl l1\">水素の利用が高温熱に向く、という前提は一般的な技術常識。ボイラーへの水素混焼の技術的な成立性は、実際に書くときは確認が必要</div><div class=\"rl l0\">書き方のポイント：</div><div class=\"rl l1\">製鉄・化学・セメントがない自分の地域に合わせ、立場を絞って現実的な課題設定にした（ガイド§5 コツ「立場を絞ると具体的になる」）</div><div class=\"rl l1\">解決策を支援・集積・価格と性質を変え、法の仕組みを「誰が何を担うか」まで書いた（ガイド§2 解決策の注意）</div><div class=\"rl l1\">(3)のロックインのように、(2)の解決策そのものが生む副作用を挙げた（設問(3)の「すべて実行しても」への直接の回答）</div><div class=\"rl l0\">自分で書くときの差し替え候補：A市の産業を自分の担当する工場・業種に、熱需要と排出量の数字を自分の実績値に、水素・CCSの関わり方を業務で検討した実例に置き換える</div>"}], "trend": "<h4>全体の結論</h4><p>1. 設問の「型」は令和元〜8年度の8年間まったく変わっていない。点差がつくのは型ではなく中身（課題の観点の切り方と解決策の専門性）。<br>2. 必須Ⅰは国の計画・戦略から出る。直近3年の6問のうち4問は、試験の1〜2年前に閣議決定された計画を名指しした問題。<br>3. 選択Ⅲは「気候」か「資源循環」の少なくとも一方が8年間毎年出ている。2本を準備すれば選べない年はなかった。<br>4. 選択Ⅱ-1は試験直前の制度から出る。同じテーマの再出題は8年で0問。</p><h4>必須Ⅰ（40点・2問から1問・3枚）</h4><div class=\"rl l0\">型（16問すべて同じ）：(1) 課題3つ（観点を明記）→ (2) 最重要の課題と複数の解決策 → (3) 新たなリスクと対策 → (4) 技術者倫理・社会の持続可能性</div><div class=\"rl l0\">年で違うのは(3)と(4)の言い回し。(3)は「リスク」だけの年と「波及効果と懸念事項」の両方の年がある。令和7年度以降は(1)が「技術課題」。本番では最初に言い回しを確かめる。</div><div class=\"rl l0\">題材：第六次環境基本計画・第五次循環基本計画（R7）、生物多様性国家戦略・地域脱炭素ロードマップ（R6）、地球温暖化対策計画の家庭部門・ネイチャーポジティブ（R8）など。</div><div class=\"rl l0\">内訳（16問）：環境全体の計画・概念 8／脱炭素・気候 4／自然 2／資源循環 1／処理水 1。大気・水質・土壌の汚染は8年で0問。</div><div class=\"rl l0\">対策：主な国の計画7〜8本について「目標・柱・課題・解決策・リスク」を準備（暗記カード「国の計画」）。(4)は定型文を用意。</div><h4>選択Ⅱ-1（10点・4問から1問・1枚）</h4><div class=\"rl l0\">出題のきっかけ（32問）：法令・告示・制度の開始 34%（最多）／国際条約・基準 16%／定番の概念 16%／科学報告・統計 13%／社会問題 13%／国の計画 9%。</div><div class=\"rl l0\">きっかけから試験までの期間：真ん中の値で約11か月。12か月以内が50%、24か月以内が73%。直近3年は半年以内が半分（例：R8 の光化学オキシダントの新しい基準は試験の半年前の告示）。</div><div class=\"rl l0\">範囲は水・大気・廃棄物・化学物質・気候・自然・金融と広い。ただし気候・エネルギー・金融は8年中7年で1問以上出ている。</div><div class=\"rl l0\">問い方：「概要と意義」「背景・内容・課題」「定義と現状」など。令和6年度以降は「課題」まで問う問題が3割に増えた。</div><div class=\"rl l0\">対策：直近1年の制度改正を広く押さえる（暗記カード「用語」、優先度A→B→C）。予測は2月と5月に見直す。</div><h4>選択Ⅱ-2（20点・2問から1問・2枚）</h4><div class=\"rl l0\">型（16問すべて同じ）：(1) 調査・検討すべき事項 → (2) 業務の手順と留意点・工夫 → (3) 関係者との調整方策</div><div class=\"rl l0\">設定：ほとんどが「自治体から依頼を受けた担当者」か「企業の担当者」。</div><div class=\"rl l0\">題材の3種類：計画策定型（実行計画・RE100・ZEB・里海・OECM。16問中6問で、業務に一番近い）／事故・災害対応型（災害廃棄物・水質事故・公害苦情）／現場作業型（石綿）。</div><div class=\"rl l0\">対策：3種類それぞれの「手順の骨格」（現況把握→目標設定→施策検討→合意形成→実施・監視）と「関係者リスト」（庁内・県・事業者・住民・専門家）を準備。冒頭で架空のA市の条件を数字つきで決め、論点を1つに絞る。</div><h4>選択Ⅲ（30点・2問から1問・3枚）</h4><div class=\"rl l0\">型：必須Ⅰから(4)倫理を除いた3段。立場（自治体の担当・企業の技術者など）を冒頭で具体化する。</div><div class=\"rl l0\">分野（16問）：気候 6／循環 5／汚染 4／自然 1。</div><div class=\"rl l0\">最近の傾向：前置きでテーマの概要説明を求める年が増えた。令和7年度以降は「技術課題」「将来的な懸念事項」という言い回し。</div><div class=\"rl l0\">対策：気候と循環の2本を深く。大きなテーマは環境保全計画の切り口（環境影響・合意形成・監視）に絞る。</div>"};

function shuffle(n, seed) {
  // 決定論的シャッフル（問題ごとに選択肢の並びを変える）
  // 掛け算は Math.imul で32bitに収める。普通の * だと2^53を超えて下位ビットが消え、
  // 4択の正答がすべて④に固定されていた（2026-09-25 修正）
  const idx = [...Array(n).keys()];
  for (let k = n - 1; k > 0; k--) {
    seed = (Math.imul(seed, 1103515245) + 12345) >>> 0;
    const j = Math.floor(seed / 4294967296 * (k + 1));
    [idx[k], idx[j]] = [idx[j], idx[k]];
  }
  return idx;
}

    if (h.last === 0) badge += '<span class="flagmark">前回まちがえた</span>';

/* (ア)〜(オ) の記述を並べる問題は、各記述に ○／× の印を付けられる行に分け、○の数をその場で数える */
function renderStatements(card, q) {
  const qt = card.querySelector(".qt");
  // 1行に「(ア) …　(イ) …」と複数の記述が並んでいる場合も、記述ごとの行に分ける
  const parts = [].concat.apply([], q.q.split("<br>").map(function (l) {
    return /^\s*[（(][ア-コ][）)]/.test(l) ? l.split(/[\s　]+(?=[（(][ア-コ][）)])/) : [l];
  }));
  const isSt = parts.map(function (l) { return /^\s*[（(][ア-コ][）)]/.test(l); });
  if (isSt.filter(Boolean).length < 2) { setMxText(qt, q.q.replace(/<br>/g, "\n")); return; }
  setMxText(qt, parts.filter(function (_, k) { return !isSt[k]; }).join("\n"));
  const box = document.createElement("div");
  box.className = "stl";
  const tally = document.createElement("div");
  tally.className = "sttally";
  const marks = [];
  function upd() {
    const o = marks.filter(function (m) { return m === "○"; }).length, x = marks.filter(function (m) { return m === "×"; }).length;
    tally.textContent = "○ " + o + "個　× " + x + "個　未 " + (marks.length - o - x) + "個";
  }
  parts.forEach(function (l, k) {
    if (!isSt[k]) return;
    const idx = marks.push("") - 1;
    const row = document.createElement("div");
    row.className = "strow";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "stm";
    b.setAttribute("aria-label", "この記述の判定（タップで ○→×→未）");
    b.textContent = "・";
    b.addEventListener("click", function () {
      marks[idx] = marks[idx] === "" ? "○" : marks[idx] === "○" ? "×" : "";
      b.textContent = marks[idx] || "・";
      b.className = "stm" + (marks[idx] === "○" ? " o" : marks[idx] === "×" ? " x" : "");
      upd();
    });
    const t = document.createElement("span");
    t.className = "stt";
    t.textContent = l.trim();
    row.appendChild(b); row.appendChild(t);
    box.appendChild(row);
  });
  upd();
  box.appendChild(tally);
  qt.insertAdjacentElement("afterend", box);
}

/* 前へ／次へのナビゲーション。解答前でも「前へ」で戻れる */

    (!ex && !inRetry() && log.length > 0 && i + 1 < Q.length

/* 本番の過去問を通しで解く回で、選ぶ数（専門25問・基礎は各群3問）を満たしたか。満たしたら次へで結果画面に進む */
function selFull() {

  if (ex.kind === "専門") { let c = 0; for (let k = 0; k < n; k++) if (answers[k]) c++; return c >= 25; }
  const g = {};
  for (let k = 0; k < n; k++) if (answers[k]) { const x = kisoGroup(Q[k]); g[x] = (g[x] || 0) + 1; }
  return ["1", "2", "3", "4", "5"].every(x => (g[x] || 0) >= 3);
}
function goNext() { if (selFull()) i = Q.length; else i++; saveSession(); render(); }
/* 科目が resultJudge を持たないときの結果コメント（正答率の下限ごと） */
const DEFAULT_JUDGE = [
  { min: 90, text: "仕上がっています。間違えた問題だけ見直して、定着させてください。" },
  { min: 70, text: "合格ライン（50%）は超えています。間違えた問題だけ回し直して余裕を広げてください。" },
  { min: 50, text: "曖昧なところが残っています。解説を読み直してから、もう一度解いてください。" },

/* 本番の過去問を1年度まるごと解いている回か（専門35問・基礎30問・適性15問）。違えば null */
function examRun() {
  const n = origCount();
  const m = /^【(R\S+) (専門|基礎|適性) /.exec((Q[0] && Q[0].q) || "");
  if (!m || n !== { 専門: 35, 基礎: 30, 適性: 15 }[m[2]]) return null;
  const head = "【" + m[1] + " " + m[2] + " ";
  for (let k = 0; k < n; k++) if ((Q[k].q || "").indexOf(head) !== 0) return null;
  return { kind: m[2], year: m[1] };
}
function kisoGroup(q) { const m = /Ⅰ-(\d)-/.exec((q && q.q) || ""); return m ? m[1] : ""; }
/* 解いている途中の表示：選んで解く科目（専門25問・基礎は各群3問）では今いくつ選んだか、どの回でも飛ばした問題の数 */
function selCountHtml() {
  if (inRetry()) return "";

  const ex = examRun();
  if (!ex || ex.kind === "適性") return skip ? '<p class="selcnt">とばした問題 <b>' + skip + '</b>問（結果画面から解けます）</p>' : "";
  // 専門は35問中10問、基礎は各群6問中3問まで選ばずに飛ばせる
