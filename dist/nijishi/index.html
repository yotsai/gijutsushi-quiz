<!-- 生成物です。直接編集しないでください。元は engine/ と subjects/ で、`node build.js nijishi` で作り直します -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="技術士第二次試験（環境部門・環境保全計画）の暗記用一問一答。国の計画の目標・柱と、選択Ⅱ-1の用語の定義・制度・数字。">
<title>技術士第二次試験 環境部門 暗記カード</title>
</head>
<body>

<style>
  :root {
    --paper: #FCFBF8;
    --panel: #FFFFFF;
    --rule: #DCDDD6;
    --rule-strong: #B7BBB2;
    --ink: #191D1A;
    --ink-2: #4A5049;
    --ink-3: #767C74;
    --accent: #0E5049;
    --accent-soft: #E3EDEA;
    --ok: #1B6B3A;
    --ok-soft: #E2F0E5;
    --ng: #9E3324;
    --ng-soft: #F7E6E2;
    --warn: #8A5A00;
    --shadow: 0 1px 2px rgba(25,29,26,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #131614; --panel: #1A1E1C; --rule: #2C312E; --rule-strong: #454B46;
      --ink: #E8EBE7; --ink-2: #AFB5AD; --ink-3: #838A82;
      --accent: #6FBFB2; --accent-soft: #1E3833;
      --ok: #6FC28C; --ok-soft: #1C3325;
      --ng: #E08878; --ng-soft: #3A2320; --warn: #E3B341;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --paper: #131614; --panel: #1A1E1C; --rule: #2C312E; --rule-strong: #454B46;
    --ink: #E8EBE7; --ink-2: #AFB5AD; --ink-3: #838A82;
    --accent: #6FBFB2; --accent-soft: #1E3833;
    --ok: #6FC28C; --ok-soft: #1C3325;
    --ng: #E08878; --ng-soft: #3A2320; --warn: #E3B341;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    font-size: 16px; line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 34rem; margin: 0 auto; padding: 1.5rem 1.1rem 4rem; }

  /* header */
  header { margin-bottom: 1.3rem; }
  .eyebrow { font-size: .72rem; letter-spacing: .15em; color: var(--ink-3); }
  h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 1.32rem; font-weight: 600; margin: .3rem 0 .5rem; line-height: 1.4;
  }
  .intro { font-size: .87rem; color: var(--ink-2); margin: 0; }

  /* progress */
  .status {
    display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap;
    font-size: .8rem; color: var(--ink-3); margin: 1.2rem 0 .45rem;
    font-variant-numeric: tabular-nums;
  }
  .status .field { color: var(--accent); font-weight: 600; letter-spacing: .02em; }
  .status .score { margin-left: auto; }
  .status b { color: var(--ink); }
  .status[hidden], .bar[hidden] { display: none; }

  /* 本番までの残り日数 */
  /* おまかせ出題 */
  .set.auto[aria-pressed="false"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .set .badge {
    display: inline-block; min-width: 1.4em; margin-left: .35em; padding: 0 .35em; border-radius: 999px;
    background: var(--ng); color: #fff; font-size: .68rem; font-weight: 700; line-height: 1.55; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .auto { margin-top: 1rem; padding-top: .9rem; border-top: 1px solid var(--rule); }
  .auto h3 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1rem; font-weight: 600; margin: 0 0 .3rem; }
  .auto-lead { font-size: .82rem; color: var(--ink-2); margin: 0 0 .7rem; line-height: 1.75; }
  .auto-n { display: flex; justify-content: space-between; align-items: baseline; font-size: .85rem; }
  .auto-n output { font-weight: 700; color: var(--accent); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  #autoN { display: block; width: 100%; margin: .45rem 0 .1rem; accent-color: var(--accent); }
  .auto-scale { display: flex; justify-content: space-between; font-size: .72rem; color: var(--ink-3); }
  .auto .btn.wide { margin-top: .8rem; }
  .mastery { display: flex; flex-wrap: wrap; gap: .3rem .9rem; margin-top: .7rem; font-size: .76rem; color: var(--ink-3); }
  .mastery b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .mastery .m1 b { color: var(--ng); }
  .mastery .m3 b, .mastery .m4 b { color: var(--ok); }
  .mst {
    display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .04em; padding: 0 .4rem;
    border-radius: 2px; margin-left: .45rem; vertical-align: 1px; border: 1px solid var(--rule-strong); color: var(--ink-3);
  }
  .mst.m1 { color: var(--ng); border-color: var(--ng); }
  .mst.m3, .mst.m4 { color: var(--ok); border-color: var(--ok); }
  .countdown { font-size: .82rem; color: var(--ink-2); margin: .5rem 0 0; font-variant-numeric: tabular-nums; }
  .countdown b { color: var(--accent); font-size: 1rem; }
  .countdown .cd2 { font-size: .76rem; color: var(--ink-3); }

  /* 覚える理由（過去問の出題実績） */
  .whys { display: flex; flex-wrap: wrap; gap: .3rem; margin: .35rem 0 0; }
  .why {
    display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .02em; line-height: 1.6;
    padding: 0 .45rem; border-radius: 2px; border: 1px solid var(--accent); color: var(--accent);
  }
  .why.t3 { background: var(--accent); color: var(--paper); }
  .why.same { background: var(--accent-soft); }
  .why.t1 { border-style: dashed; border-color: var(--rule-strong); color: var(--ink-3); font-weight: 600; }
  .why.prA { background: var(--accent); color: var(--paper); }
  .why.prC { border-color: var(--rule-strong); color: var(--ink-2); }
  .why.prN { border-style: dashed; border-color: var(--rule-strong); color: var(--ink-3); font-weight: 600; }
  .why.prD { border-color: var(--rule-strong); color: var(--ink-3); background: transparent; font-weight: 600; }
  .whybox {
    margin: .7rem 0 0; padding: .55rem .7rem; background: var(--accent-soft);
    border-left: 3px solid var(--accent); font-size: .82rem; line-height: 1.7; color: var(--ink-2);
  }
  .whybox .wh { display: block; font-size: .72rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
  .whybox.t0 { border-left-color: var(--rule-strong); background: transparent; border: 1px dashed var(--rule); border-left: 3px solid var(--rule-strong); }
  .whybox.t0 .wh { color: var(--ink-3); }

  /* 合格までの道のり（ホーム） */
  .roadmap { margin-top: 1.1rem; padding-top: .9rem; border-top: 1px solid var(--rule); }
  .roadmap h3 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1rem; font-weight: 600; margin: 0 0 .3rem; }
  .roadmap .rm-lead { font-size: .84rem; color: var(--ink-2); margin: 0 0 .6rem; line-height: 1.75; }
  .rm-steps { list-style: none; margin: 0; padding: 0; }
  .rm-steps li {
    display: grid; grid-template-columns: 4.2rem 1fr; gap: .1rem .6rem; align-items: baseline;
    padding: .5rem 0; border-bottom: 1px solid var(--rule); font-size: .84rem;
  }
  .rm-steps .d { font-size: .74rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .rm-steps .t { color: var(--ink); }
  .rm-steps .v { grid-column: 2; font-size: .76rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .rm-steps .st { font-size: .68rem; font-weight: 700; padding: 0 .35rem; border-radius: 2px; margin-left: .35rem; vertical-align: 1px; }
  .rm-steps .done .st { color: var(--ok); border: 1px solid var(--ok); }
  .rm-steps .now .st { color: var(--paper); background: var(--accent); }
  .rm-steps .late .st { color: var(--paper); background: var(--ng); }
  .rm-steps .todo .t { color: var(--ink-3); }
  .roadmap .rm-note { font-size: .76rem; color: var(--ink-3); margin: .45rem 0 0; line-height: 1.65; }
  .rm-next { margin-top: .8rem; }
  .rm-next .lab { font-size: .74rem; color: var(--ink-3); margin: 0 0 .3rem; }
  .rm-next .btn { display: block; width: 100%; text-align: left; padding: .65rem 1rem; margin-top: .45rem; }
  .rm-next .btn .sub { display: block; font-size: .76rem; font-weight: 400; opacity: .88; }
  .homecard .hlead { font-size: .9rem; color: var(--ink-2); margin: 0; line-height: 1.7; }
  .homecard .btn.wide { display: block; width: 100%; text-align: left; padding: .7rem 1rem; margin-top: .9rem; }
  .homecard .btn.wide .sub { display: block; font-size: .78rem; font-weight: 400; opacity: .88; margin-top: .1rem; }
  .homestats {
    display: flex; gap: .4rem 1rem; flex-wrap: wrap; margin-top: 1rem; padding-top: .8rem;
    border-top: 1px solid var(--rule); font-size: .8rem; color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  .homestats b { color: var(--ink); }
  .bar { height: 3px; background: var(--rule); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

  /* card */
  .card {
    background: var(--panel); border: 1px solid var(--rule);
    box-shadow: var(--shadow); padding: 1.15rem 1.1rem 1.25rem; margin-top: 1.1rem;
  }
  .qn { font-size: .75rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .qt { font-size: 1.03rem; font-weight: 600; margin: .25rem 0 .1rem; line-height: 1.6; text-wrap: pretty; white-space: pre-line; }
  .qimg { margin: .5rem 0 .6rem; overflow-x: auto; background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: .3rem; }
  .qimg img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .qimg.zoom img { max-width: none; width: 200%; }
  .stl { margin: .35rem 0 .6rem; display: flex; flex-direction: column; gap: .35rem; }
  .strow { display: flex; gap: .55rem; align-items: flex-start; font-size: .93rem; line-height: 1.6; }
  .stm { flex: none; width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 1px solid var(--rule-strong); background: var(--panel); color: var(--ink-3); font: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .stm.o { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
  .stm.x { border-color: var(--ng); color: var(--ng); background: var(--ng-soft); }
  .sttally { font-size: .8rem; color: var(--accent); font-weight: 700; margin-top: .15rem; text-align: right; }
  .qh { font-size: .82rem; color: var(--ink-3); margin: 0 0 .9rem; line-height: 1.6; }

  .choices { display: flex; flex-direction: column; gap: .45rem; }
  .ch {
    display: flex; align-items: flex-start; gap: .65rem; width: 100%;
    font: inherit; font-size: .95rem; text-align: left; cursor: pointer;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: 2px;
    padding: .58rem .7rem; line-height: 1.55;
    transition: background .12s, border-color .12s;
    font-variant-numeric: tabular-nums;
  }
  .ch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ch:disabled { cursor: default; }
  .ch .key {
    flex: none; width: 1.35rem; height: 1.35rem; margin-top: .1rem;
    display: grid; place-items: center;
    border: 1px solid var(--rule-strong); border-radius: 50%;
    font-size: .72rem; color: var(--ink-3);
  }
  .ch.ok { border-color: var(--ok); background: var(--ok-soft); }
  .ch.ok .key { border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .ch.ng { border-color: var(--ng); background: var(--ng-soft); }
  .ch.ng .key { border-color: var(--ng); color: var(--ng); font-weight: 700; }
  .ch.dim { opacity: .45; }
  .dk {
    align-self: flex-end; margin-top: .15rem; font: inherit; font-size: .8rem; color: var(--ink-3);
    background: transparent; border: 1px dashed var(--rule-strong); border-radius: 999px;
    padding: .35rem .95rem; cursor: pointer;
  }
  .dk:disabled { cursor: default; }
  .dk.on { color: var(--ng); border: 1px solid var(--ng); background: var(--ng-soft); }

  .verdict, .easy, .hq, .hmemo, .qt, .stt, .ch { overflow-wrap: anywhere; word-break: break-word; }
  .verdict { margin-top: .95rem; padding-top: .85rem; border-top: 1px solid var(--rule); }
  .vtag { font-size: .82rem; font-weight: 700; letter-spacing: .04em; }
  .easy { margin: .6rem 0 .2rem; padding: .75rem .85rem; background: var(--accent-soft); border-radius: 10px; font-size: .9rem; line-height: 1.8; }
  .easyh, .vnoteh { font-size: .78rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; margin-bottom: .3rem; }
  .vnoteh { margin-top: .9rem; color: var(--ink-3); }
  .ezh { display: block; font-weight: 700; color: var(--accent); margin-bottom: .1rem; }
  .ezh.now { color: var(--warn); }
  .selcnt { font-size: .82rem; color: var(--ink-3); margin: .2rem 0 .4rem; text-align: right; }
  .selcnt b { color: var(--accent); }
  .selcnt.over, .selcnt.over b { color: var(--ng); }
  .mocksel { font-size: .75em; color: var(--ink-3); margin-left: .2em; }
  .vtag.ok { color: var(--ok); }
  .vtag.ng { color: var(--ng); }
  .vnote { font-size: .86rem; color: var(--ink-2); margin: .3rem 0 0; line-height: 1.72; }
  .vnote b { color: var(--ink); }
  .vsrc {
    font-size: .73rem; color: var(--ink-3); margin: .55rem 0 0;
    padding-top: .45rem; border-top: 1px dotted var(--rule);
  }
  .vsrc.k { color: var(--ng); }

  .actions { display: flex; gap: .5rem; margin-top: 1rem; align-items: center; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: .87rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--paper);
    border: 1px solid var(--accent); border-radius: 2px; padding: .45rem 1.3rem;
  }
  @media (hover: hover) and (pointer: fine) { .btn:hover { filter: brightness(1.12); } }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--rule-strong); font-weight: 400; }
  @media (hover: hover) and (pointer: fine) { .btn.ghost:hover { border-color: var(--accent); color: var(--accent); filter: none; } }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: .35; cursor: default; filter: none; }
  /* 一番よく押す「次の問題」を横幅いっぱいに、その下に「前の問題」「ホーム」を半分ずつ */
  .qnav { margin-top: 1rem; }
  .navrow { display: grid; gap: .5rem; }
  .navrow.one { grid-template-columns: 1fr; margin-bottom: .5rem; }
  .navrow.two { grid-template-columns: 1fr 1fr; }
  .qnav .btn { padding: .6rem .5rem; white-space: nowrap; text-align: center; }
  .hintkey { font-size: .74rem; color: var(--ink-3); margin: .55rem 0 0; }
  @media (hover: none) { .hintkey { display: none; } }

  /* result */
  .result h2 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 1.18rem; margin: 0 0 .2rem;
  }
  .big { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--accent); }
  .big small { font-size: 1rem; font-weight: 400; color: var(--ink-3); }
  .judge { font-size: .9rem; color: var(--ink-2); margin: .5rem 0 1.1rem; line-height: 1.7; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
  th, td { padding: .38rem .3rem; border-bottom: 1px solid var(--rule); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  thead th { font-size: .75rem; color: var(--ink-3); font-weight: 600; border-bottom: 1px solid var(--rule-strong); }
  td .mini { display: inline-block; width: 3.2rem; height: 4px; background: var(--rule); vertical-align: middle; margin-left: .4rem; }
  td .mini i { display: block; height: 100%; background: var(--accent); }
  .missed { margin-top: 1.4rem; }
  .missed h3 { font-size: .85rem; margin: 0 0 .5rem; color: var(--ink-3); font-weight: 600; letter-spacing: .03em; }
  .missed ol { margin: 0; padding-left: 1.2rem; font-size: .87rem; color: var(--ink-2); line-height: 1.75; }
  .missed b { color: var(--ink); }

  /* 再開バナー・保存警告 */
  .resume {
    display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap;
    background: var(--accent-soft); border-left: 3px solid var(--accent);
    padding: .6rem .85rem; margin-top: 1rem; font-size: .84rem; color: var(--ink-2);
  }
  .resume b { color: var(--ink); }
  .resume button {
    font: inherit; font-size: .78rem; cursor: pointer; background: none; color: var(--accent);
    border: 0; border-bottom: 1px solid var(--accent); padding: 0 0 1px; margin-left: auto;
  }
  .nostore {
    background: var(--ng-soft); border-left: 3px solid var(--ng);
    padding: .6rem .85rem; margin-top: 1rem; font-size: .82rem; color: var(--ink-2); line-height: 1.7;
  }
  .nostore b { color: var(--ink); }

  /* データ読み込み */
  .datamgr { margin-top: 2rem; padding-top: 1.1rem; border-top: 1px solid var(--rule); }
  .datamgr h3 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 1rem; font-weight: 600; margin: 0 0 .3rem;
  }
  .datamgr p { font-size: .82rem; color: var(--ink-2); margin: 0 0 .8rem; line-height: 1.75; }
  .imp { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .imp input[type=file] { display: none; }
  .impfile {
    font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--paper); border: 1px solid var(--accent);
    border-radius: 2px; padding: .45rem 1.2rem; display: inline-block;
  }
  @media (hover: hover) and (pointer: fine) { .impfile:hover { filter: brightness(1.12); } }
  .impfile.ghost { background: transparent; color: var(--accent); }
  .impfile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .impmsg { font-size: .78rem; }
  .impmsg.ok { color: var(--ok); }
  .impmsg.ng { color: var(--ng); }
  .impitem {
    display: flex; align-items: baseline; gap: .6rem; padding: .5rem 0;
    border-bottom: 1px solid var(--rule); font-size: .86rem;
  }
  .impitem .n2 { color: var(--ink-3); font-size: .78rem; font-variant-numeric: tabular-nums; }
  .impitem button {
    margin-left: auto; font: inherit; font-size: .76rem; cursor: pointer;
    background: none; color: var(--ink-3); border: 0;
    border-bottom: 1px solid var(--rule-strong); padding: 0 0 1px;
  }
  @media (hover: hover) and (pointer: fine) { .impitem button:hover { color: var(--ng); border-bottom-color: var(--ng); } }
  .privacy { font-size: .76rem; color: var(--ink-3); line-height: 1.7; margin-top: .8rem; }

  /* 学習診断 */
  .diag { margin-top: 1.6rem; }
  .diag h3 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 1rem; font-weight: 600; margin: 0 0 .2rem;
    padding-bottom: .4rem; border-bottom: 1.5px solid var(--ink);
  }
  .diag .note2 { font-size: .8rem; color: var(--ink-3); margin: .5rem 0 .8rem; line-height: 1.7; }
  .drow {
    display: grid; grid-template-columns: 1fr 4.6rem 3.4rem; gap: .15rem .7rem;
    padding: .5rem 0; border-bottom: 1px solid var(--rule); align-items: center;
  }
  .drow .dn { font-size: .87rem; font-weight: 600; }
  .drow .dsub { grid-column: 1 / -1; font-size: .72rem; color: var(--ink-3); line-height: 1.55; }
  .drow .dv { font-size: .82rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .drow .dloss { font-size: .95rem; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .drow.p1 .dloss { color: var(--ng); }
  .drow.p2 .dloss { color: var(--amber, #8A6A1F); }
  .drow.p3 .dloss { color: var(--ink-3); font-weight: 400; }
  .rx { background: var(--accent-soft); padding: .9rem 1.1rem; margin-top: 1rem; font-size: .87rem; line-height: 1.8; }
  .rx b { color: var(--ink); }
  .rx ol { margin: .4rem 0 0; padding-left: 1.2rem; }
  .rx li { margin-bottom: .3rem; }
  .exp { margin-top: 1.2rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .exp .msg { font-size: .78rem; color: var(--accent); }

  /* 履歴タブ */
  .hsum {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr));
    gap: .1rem 1rem; margin: 1.1rem 0 .3rem; padding-bottom: .9rem;
    border-bottom: 1px solid var(--rule);
  }
  .hsum div { font-size: .74rem; color: var(--ink-3); }
  .hsum b { display: block; font-size: 1.35rem; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.35; }
  .hsum .warn b { color: var(--ng); }
  .filters { display: flex; gap: .35rem; flex-wrap: wrap; margin: .9rem 0 .2rem; align-items: center; }
  .flt {
    font: inherit; font-size: .78rem; cursor: pointer; background: var(--panel); color: var(--ink-2);
    border: 1px solid var(--rule-strong); border-radius: 999px; padding: .2rem .75rem;
  }
  .flt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 600; }
  @media (hover: hover) and (pointer: fine) { .flt:hover:not([aria-pressed="true"]) { border-color: var(--accent); color: var(--accent); } }
  .flt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hrow {
    display: grid; grid-template-columns: 1fr auto; gap: .1rem .8rem;
    padding: .62rem 0; border-bottom: 1px solid var(--rule); align-items: baseline;
  }
  .hrow .hq { font-size: .87rem; line-height: 1.55; white-space: pre-line; }
  .hrow .hf { font-size: .7rem; color: var(--accent); letter-spacing: .03em; }
  .hrow .hn { font-size: .8rem; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .hrow .hn b { color: var(--ink); }
  .hbar { display: block; width: 3.6rem; height: 4px; background: var(--rule); margin-top: .28rem; margin-left: auto; }
  .hbar i { display: block; height: 100%; background: var(--accent); }
  .hbar.bad i { background: var(--ng); }
  .hrow.miss .hq::before {
    content: "✕"; color: var(--ng); font-weight: 700; font-size: .78rem; margin-right: .35rem;
  }
  .hrow.none .hq { color: var(--ink-3); }
  .empty { font-size: .87rem; color: var(--ink-3); padding: 1.6rem 0; text-align: center; }
  .hact { margin: 1.2rem 0 .4rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

  /* 履歴・フラグ */
  .hist { font-size: .72rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .flagmark {
    display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .04em;
    color: var(--ng); background: var(--ng-soft); border: 1px solid var(--ng);
    padding: 0 .4rem; border-radius: 2px; margin-left: .45rem; vertical-align: 1px;
  }
  .qmeta { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .set.weak[aria-pressed="false"] { border-color: var(--ng); color: var(--ng); }
  .set.weak[aria-pressed="true"] { background: var(--ng); border-color: var(--ng); color: var(--paper); }
  .set:disabled { opacity: .4; cursor: default; }
  .set.bm[aria-pressed="false"]:not(:disabled) { border-color: var(--accent); color: var(--accent); }

  /* ブックマーク・メモ */
  .qtools { margin-left: auto; display: flex; gap: .35rem; }
  .qtool {
    font: inherit; font-size: .74rem; line-height: 1.6; cursor: pointer;
    background: var(--panel); color: var(--ink-3);
    border: 1px solid var(--rule-strong); border-radius: 999px; padding: .12rem .65rem; white-space: nowrap;
  }
  @media (hover: hover) and (pointer: fine) { .qtool:hover { border-color: var(--accent); color: var(--accent); } }
  .qtool[aria-pressed="true"], .qtool.has { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .qtool:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .memo { margin-top: 1rem; padding-top: .8rem; border-top: 1px dashed var(--rule-strong); }
  .memo[hidden] { display: none; }
  .memo label { display: block; font-size: .74rem; color: var(--ink-3); margin-bottom: .3rem; }
  .memo textarea {
    display: block; width: 100%; min-height: 4.6rem; resize: vertical;
    font: inherit; font-size: 16px; line-height: 1.6; color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule-strong); border-radius: 2px; padding: .5rem .6rem;
  }
  .memo textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .memo .saved { font-size: .72rem; color: var(--ink-3); margin-top: .25rem; min-height: 1.2em; }
  .hrow .bmk { color: var(--accent); margin-right: .3rem; }
  .hrow .hmemo {
    grid-column: 1 / -1; margin-top: .35rem; padding: .35rem .6rem;
    font-size: .8rem; line-height: 1.6; color: var(--ink-2); background: var(--accent-soft);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .reset {
    font: inherit; font-size: .76rem; cursor: pointer; background: none;
    color: var(--ink-3); border: 0; border-bottom: 1px solid var(--rule-strong); padding: 0 0 1px;
  }
  @media (hover: hover) and (pointer: fine) { .reset:hover { color: var(--ng); border-bottom-color: var(--ng); } }
  .lifetime {
    margin-top: 1.2rem; padding-top: .9rem; border-top: 1px solid var(--rule);
    display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap;
    font-size: .82rem; color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  .lifetime b { color: var(--ink); }
  .lifetime .reset { margin-left: auto; }

  /* set switch */
  .sets { display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; margin: 1rem 0 0; }
  .set {
    font: inherit; font-size: .78rem; cursor: pointer;
    background: var(--panel); color: var(--ink-2);
    border: 1px solid var(--rule-strong); border-radius: 999px; padding: .22rem .8rem;
  }
  @media (hover: hover) and (pointer: fine) { .set:hover { border-color: var(--accent); color: var(--accent); } }
  .set[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 600; }
  .set:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 出題数 */
  .limits { display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; margin-top: .5rem; }
  .limits .lab { font-size: .74rem; color: var(--ink-3); margin-right: .1rem; }
  .lim {
    font: inherit; font-size: .76rem; cursor: pointer;
    background: var(--panel); color: var(--ink-2);
    border: 1px solid var(--rule); border-radius: 2px; padding: .18rem .6rem;
  }
  .lim[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; background: var(--accent-soft); }
  @media (hover: hover) and (pointer: fine) { .lim:hover:not([aria-pressed="true"]) { border-color: var(--rule-strong); } }
  .lim:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pickinfo { font-size: .74rem; color: var(--ink-3); margin-left: .2rem; }
  .unvwrap {
    display: flex; align-items: center; gap: .4rem; margin-top: .55rem;
    font-size: .78rem; color: var(--ink-2); cursor: pointer;
  }
  .unvwrap input { width: 1rem; height: 1rem; accent-color: var(--ng); cursor: pointer; margin: 0; }
  .unvwrap .cnt2 { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .unvnote {
    background: var(--accent-soft); padding: .5rem .75rem; margin-top: .5rem;
    font-size: .76rem; color: var(--ink-2); line-height: 1.65;
  }
  .unvnote.on { background: var(--ng-soft); }

  /* tabs */
  .tabs {
    display: flex; gap: .3rem; border-bottom: 1px solid var(--rule); margin: 1.1rem 0 0;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; white-space: nowrap;
    font: inherit; font-size: .87rem; cursor: pointer; background: none; color: var(--ink-3);
    border: 0; border-bottom: 2px solid transparent; padding: .45rem .65rem; margin-bottom: -1px;
  }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pane[hidden] { display: none; }

  /* 頻出テーマ */
  .lede { font-size: .88rem; color: var(--ink-2); margin: 1.1rem 0 .3rem; line-height: 1.75; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: .9rem; }
  .segh { font-size: .95rem; margin: 1.1rem 0 .4rem; }
  .seg { width: 100%; border-collapse: collapse; font-size: .84rem; font-variant-numeric: tabular-nums; }
  .seg th, .seg td { padding: .38rem .25rem; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
  .seg th { font-size: .72rem; color: var(--ink-3); font-weight: 400; }
  .seg td:first-child { text-align: left; white-space: normal; padding-left: 1rem; }
  .seg tr.gh td { font-weight: 700; background: var(--accent-soft); }
  .seg tr.gh td:first-child { padding-left: .4rem; }
  .seg .rate.good { color: var(--ok); font-weight: 700; }
  .seg .rate.bad { color: var(--ng); font-weight: 700; }
  .segbar { display: block; height: 3px; background: var(--rule); margin-top: .2rem; }
  .segbar i { display: block; height: 100%; background: var(--accent); }
  .segf { margin: .3rem 0 .2rem; }
  .segf summary { font-size: .86rem; font-weight: 700; padding: .45rem 0; cursor: pointer; color: var(--accent); }
  .segrun { font: inherit; font-size: .74rem; padding: .2rem .55rem; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; cursor: pointer; }
  .segsum { font-weight: 400; color: var(--ink-3); font-size: .78rem; }
  .hlist { margin: 1rem 0; border-top: 1px solid var(--rule); }
  .hlist > summary { font-size: .9rem; font-weight: 700; padding: .7rem 0; cursor: pointer; color: var(--accent); }
  .segnote { font-size: .74rem; color: var(--ink-3); margin: .4rem 0 .8rem; line-height: 1.6; }
  .stats { width: 100%; min-width: 23rem; border-collapse: collapse; font-size: .82rem; font-variant-numeric: tabular-nums; }
  .stats th, .stats td { padding: .35rem .3rem; white-space: nowrap; border-bottom: 1px solid var(--rule); text-align: right; }
  .stats th:first-child, .stats td:first-child { text-align: left; white-space: normal; min-width: 11rem; }
  .stats thead th { font-size: .74rem; color: var(--ink-3); border-bottom: 1px solid var(--rule-strong); }
  .stats .nm { font-weight: 600; }
  .stats .sb { display: block; font-weight: 400; font-size: .74rem; color: var(--ink-3); line-height: 1.5; }
  .stats tr.hi td { background: var(--accent-soft); }
  .topic {
    border-top: 1px solid var(--rule); padding: .8rem 0;
    display: grid; grid-template-columns: 2.3rem 1fr; gap: .1rem .7rem;
  }
  .topic .cnt {
    grid-row: span 3; font-variant-numeric: tabular-nums;
    font-size: 1.25rem; font-weight: 700; color: var(--accent); text-align: center; line-height: 1.5;
  }
  .topic .cnt small { display: block; font-size: .62rem; font-weight: 400; color: var(--ink-3); letter-spacing: .06em; }
  .topic .ti { font-weight: 600; font-size: .95rem; line-height: 1.5; }
  .topic .meta { font-size: .74rem; color: var(--ink-3); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .topic .meta .f { color: var(--accent); }
  .topic .flag { color: var(--ng); font-weight: 700; }
  .topic .nt { font-size: .84rem; color: var(--ink-2); line-height: 1.72; margin-top: .18rem; }
  .foot { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .76rem; color: var(--ink-3); line-height: 1.8; }
  .foot a { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ===== スマホアプリ風のレイアウト ===== */
  .unvwrap[hidden], .unvnote[hidden] { display: none !important; }
  .wrap { padding-bottom: calc(5.6rem + env(safe-area-inset-bottom)); }
  header { margin-bottom: .6rem; }
  header .eyebrow { display: none; }
  header h1 { font-size: 1.02rem; margin: 0; letter-spacing: .02em; }
  header .intro { display: none; }

  /* 下部ナビ（タブを画面下に固定） */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; margin: 0; gap: 0;
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 0;
    /* iOSのホーム画面版で、解説が開いて画面の長さが変わると、すりガラス（backdrop-filter）付きの固定ナビが
       画面の途中に取り残される（2026-11-08 実機で発生）。不透明の背景にし、独立したレイヤーで描かせる */
    background: var(--panel);
    -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0);
    border-top: 1px solid var(--rule); padding: .35rem .3rem calc(.35rem + env(safe-area-inset-bottom));
  }
  .tab {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: .1rem;
    padding: .25rem 0; border: 0; margin: 0; font-size: .68rem; color: var(--ink-3);
    text-decoration: none; background: none; line-height: 1.3;
  }
  .tab svg { width: 24px; height: 24px; }
  .tab[aria-selected="true"] { color: var(--accent); border: 0; font-weight: 700; }
  .navbadge {
    position: absolute; top: .05rem; left: calc(50% + 6px); min-width: 1.2rem; padding: 0 .3rem;
    border-radius: 999px; background: var(--ng); color: #fff; font-size: .64rem; font-style: normal;
    font-weight: 700; line-height: 1.5; text-align: center; font-variant-numeric: tabular-nums;
  }
  .navbadge[hidden] { display: none; }

  /* ホームと問題を解く画面の切り替え */
  body:not(.home-mode) #setsHead, body:not(.home-mode) .sets, body:not(.home-mode) .limits,
  body:not(.home-mode) .unvwrap, body:not(.home-mode) .unvnote, body:not(.home-mode) #homeBottom,
  body:not(.home-mode) .countdown, body:not(.home-mode) .ver { display: none !important; }
  .ver { margin: .4rem .2rem 0; font-size: .7rem; color: var(--ink-3); }
  body.home-mode #pane-quiz:not([hidden]) { display: flex; flex-direction: column; }
  body.home-mode #stage { order: 1; }
  body.home-mode #setsHead { order: 2; }
  body.home-mode .sets { order: 3; }
  body.home-mode .limits { order: 4; }
  body.home-mode .unvwrap { order: 5; }
  body.home-mode .unvnote { order: 6; }
  body.home-mode #homeBottom { order: 7; }
  body.home-mode #autoBtn { display: none; }

  /* 本番までの日数（ヒーロー） */
  .countdown {
    margin: .7rem 0 0; padding: .9rem 1rem; border-radius: 16px; background: var(--panel);
    border: 1px solid var(--rule); font-size: .8rem; color: var(--ink-3); line-height: 1.5;
  }
  .countdown b { font-size: 2.1rem; color: var(--ink); font-weight: 800; letter-spacing: -.02em; margin: 0 .15rem; }
  .countdown .cd2 { display: block; margin-top: .15rem; }
  .countdown-row { display: flex; align-items: center; justify-content: space-between; gap: .5rem .6rem; flex-wrap: wrap; }
  .countdown-text { flex: 1 1 220px; min-width: 0; }
  .countdown-text .cd-days { white-space: nowrap; }
  .examEditBtn {
    display: inline-flex; align-items: center; gap: .3rem; flex-shrink: 0; min-height: 44px; margin-left: auto;
    font: inherit; font-size: .78rem; font-weight: 600; cursor: pointer;
    background: transparent; color: var(--ink-2); border: 1px solid var(--rule-strong);
    border-radius: 999px; padding: .4rem .85rem;
  }
  @media (hover: hover) and (pointer: fine) { .examEditBtn:hover { border-color: var(--accent); color: var(--accent); } }
  .examEditBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .examEditBtn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .examEdit {
    display: flex; flex-wrap: wrap; align-items: center; gap: .5rem;
    margin-top: .8rem; padding-top: .8rem; border-top: 1px solid var(--rule);
  }
  .examEdit[hidden] { display: none; }
  .examEdit input[type="date"] {
    font: inherit; font-size: .85rem; color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule-strong); border-radius: 2px; padding: .4rem .6rem; min-height: 44px;
  }
  .examEdit .btn { padding: .5rem 1rem; min-height: 44px; }

  /* ホームのカード共通 */
  body.home-mode .homecard { border-radius: 16px; border: 1px solid var(--rule); padding: 1rem; margin-top: .8rem; background: var(--panel); }
  body.home-mode #stage > .homecard { background: none; border: 0; padding: 0; box-shadow: none; }
  .homecard .hlead { display: none; }

  /* おまかせ出題（主役カード） */
  .homecard .auto.hero {
    margin: 0; padding: 1.1rem 1rem 1rem; border: 0; border-radius: 16px; color: #fff;
    background: linear-gradient(135deg, #0E5049, #2C7C72);
  }
  .auto.hero h3 { color: #fff; font-family: inherit; font-size: .95rem; font-weight: 700; margin: 0; opacity: .92; }
  .auto.hero .due { margin: .35rem 0 .1rem; font-size: .82rem; opacity: .9; }
  .auto.hero .due b { font-size: 2.4rem; font-weight: 800; line-height: 1.1; margin-right: .15rem; font-variant-numeric: tabular-nums; }
  .auto.hero .auto-n { color: #fff; margin-top: .6rem; }
  .auto.hero .auto-n output { color: #fff; }
  .auto.hero #autoN { accent-color: #fff; }
  .auto.hero .auto-scale { color: rgba(255,255,255,.75); }
  .auto.hero .btn.wide {
    margin-top: .8rem; background: #fff; color: #0E5049; border-color: #fff; border-radius: 12px;
    text-align: center; font-size: 1.05rem; font-weight: 800; padding: .8rem 1rem;
  }
  .auto.hero details { margin-top: .7rem; font-size: .78rem; opacity: .92; }
  .auto.hero summary { cursor: pointer; }
  .auto.hero details p { margin: .35rem 0 0; line-height: 1.7; }
  .auto.hero .mastery { color: rgba(255,255,255,.85); }
  .auto.hero .mastery b { color: #fff; }

  /* 続きから */
  .homecard .btn.wide#cont { border-radius: 12px; margin-top: .8rem; }

  /* 数字のタイル（2×2） */
  .agrps { display: flex; gap: .35rem; margin: .1rem 0 .5rem; flex-wrap: wrap; }
  .agrp { font: inherit; font-size: .8rem; padding: .3rem .8rem; border-radius: 999px; border: 1px solid rgba(255,255,255,.45); background: transparent; color: inherit; cursor: pointer; }
  .agrp[aria-pressed="true"] { background: #fff; color: #0E5049; border-color: #fff; font-weight: 700; }
  .asrcs { margin-top: -.15rem; }
  .asrc { font: inherit; font-size: .75rem; padding: .2rem .7rem; border-radius: 6px; border: 1px solid rgba(255,255,255,.35); background: transparent; color: inherit; cursor: pointer; }
  .asrc[aria-pressed="true"] { background: rgba(255,255,255,.22); border-color: #fff; font-weight: 700; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; margin-top: .8rem; }
  .tile {
    font: inherit; text-align: left; border: 1px solid var(--rule); border-radius: 14px; background: var(--paper);
    padding: .7rem .8rem; color: var(--ink-3); font-size: .74rem; line-height: 1.4;
  }
  .tile b { display: block; color: var(--ink); font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: .15rem; }
  .tile b small { font-size: .75rem; font-weight: 600; color: var(--ink-3); margin-left: .15rem; }
  button.tile { cursor: pointer; }
  button.tile:disabled { cursor: default; opacity: .55; }
  .tile.warn b { color: var(--ng); }

  /* 分野のタイル */
  .home-h { font-size: .95rem; font-weight: 700; margin: 1.3rem .1rem .55rem; font-family: inherit; }
  body.home-mode .sets { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; margin: 0; }
  .set.offgrp { display: none !important; }
  .grptabs { grid-column: 1 / -1; flex-basis: 100%; display: flex; gap: .3rem; padding: .25rem; border-radius: 12px; background: var(--panel); border: 1px solid var(--rule); }
  .grp { flex: 1; border: 0; border-radius: 9px; padding: .55rem 0; font: inherit; font-size: .9rem; font-weight: 700; background: transparent; color: var(--ink-2); cursor: pointer; }
  .grp[aria-selected="true"] { background: var(--accent); color: var(--paper); }
  body.home-mode .set {
    border-radius: 14px; padding: .8rem .8rem; text-align: left; font-size: .86rem; font-weight: 600;
    background: var(--panel); border: 1px solid var(--rule); color: var(--ink); min-height: 3.2rem;
  }
  body.home-mode .set[aria-pressed="true"] { background: var(--panel); color: var(--ink); border-color: var(--rule); }
  body.home-mode .set.weak:not(:disabled) { color: var(--ng); border-color: color-mix(in srgb, var(--ng) 45%, var(--rule)); }
  body.home-mode .set.freq { color: var(--accent); font-weight: 700; }
  body.home-mode .set.bm:not(:disabled) { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
  body.home-mode .limits { margin: .7rem .1rem 0; }
  body.home-mode .lim { border-radius: 999px; }

  /* 道のり（たたむ） */
  #homeBottom .homecard { margin-top: 1.1rem; }
  #homeBottom .roadmap { margin: 0; padding: 0; border: 0; }
  #homeBottom .roadmap details { margin-top: .5rem; }

const NJ_PLAN_DATA = [{"f": "二次:計画", "q": "【第六次環境基本計画｜時期】第六次環境基本計画が閣議決定されたのはいつ（何年何月）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2024年5月（5月21日）。第五次ではなくこの第六次が最新版である<br><br><b>解説</b>　2024年5月21日に閣議決定された環境基本計画で、根拠は環境基本法第15条である<br><br><b>答案に書くなら</b>　本計画は2024年5月に閣議決定された第六次環境基本計画であり、最新版に基づいて課題を整理する。<br><br><b>関連</b>　第五次はR2の題材で別の計画。目的規定は第1条で、策定根拠の第15条と混同しない。<br><br><b>答案での使い方</b>　書き出しで最新版を明示する。第五次(R2題材)と取り違えない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223504.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜目標】第六次環境基本計画が掲げる2030年度の温室効果ガス削減目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2013年度比46%削減（さらに50%の高みに向け挑戦を続ける）<br><br><b>解説</b>　基準年の2013年度と比べた2030年度の削減率で、日本全体の温室効果ガスが対象である<br><br><b>答案に書くなら</b>　環境の観点から、2030年度に2013年度比46%削減という高い目標の達成に向け、対策の加速が課題である。<br><br><b>関連</b>　2035年度60%・2040年度73%は別計画（地球温暖化対策計画）の数字で、本計画は2030年度46%とCN2050のみ明記する。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 課題の大きさの根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223504.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜目標】第六次環境基本計画が掲げる30by30目標とは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2030年までに陸と海の30%以上を保全する目標。ネイチャーポジティブ実現の手段<br><br><b>解説</b>　30by30は、2030年までに陸と海の30%以上を保全地域やOECM（保護地域以外で生物多様性保全に資する地域）にする国際目標。ネイチャーポジティブの実現手段と位置づけられる<br><br><b>答案に書くなら</b>　生態系の保全の観点から、30by30の達成に向け保全地域とOECMの拡大を進めることが解決策である。<br><br><b>関連</b>　ネイチャーポジティブは損失を止めて反転させる考え方で、30by30はその手段である。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 生物多様性の解決策の到達点に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223504.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜目標】世界の年平均気温は産業革命前より何℃上昇した（2023年）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　1.45℃上昇（2023年）。気候危機の背景として示されている<br><br><b>解説</b>　産業革命前を基準とした世界の年平均気温の上昇幅で、2023年に1.45℃と示されている。気候危機を課題の背景として説明するときの数字になる<br><br><b>答案に書くなら</b>　世界の年平均気温は2023年に産業革命前より1.45℃上昇しており、気候危機への対応が急務であることが課題の背景である。<br><br><b>関連</b>　パリ協定の1.5℃目標に近い水準だが、1.45℃は2023年時点の値であり将来目標ではない。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 冒頭で課題の背景を示す数字に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223504.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜柱】「環境・経済・社会の統合的向上」を実践する場と位置づけられた重点戦略は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　地域づくり。地域循環共生圏で地域脱炭素とネイチャーポジティブを同時に解決する<br><br><b>解説</b>　重点戦略の一つ「環境・経済・社会の統合的向上の実践・実装の場としての地域づくり」で、地域循環共生圏が中核の考え方。地域ごとに自然資本・経済・社会の課題が異なるため、地域単位の実践が要る<br><br><b>答案に書くなら</b>　地域の観点から、地域循環共生圏により地域脱炭素とネイチャーポジティブを同時に解決することが解決策である。<br><br><b>関連</b>　地域循環共生圏は自立・分散型の地域づくりで、近隣地域と資源を補完し合う。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の方向を国の言葉で言うときに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜柱】「新たな成長」を導く重点戦略の中身は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　持続可能な生産と消費を実現するグリーンな経済システム。自然資本への投資拡大と環境価値の内部化<br><br><b>解説</b>　「新たな成長」は経済を高付加価値化する考え方で、自然資本への投資を拡大し、環境という非市場的価値を市場的価値に取り込む（内部化する）ことで実現を図る<br><br><b>答案に書くなら</b>　経済の観点から、自然資本への投資拡大と環境価値の内部化により、グリーンな経済システムを構築することが解決策である。<br><br><b>関連</b>　重点戦略は6つあり、他に国土・地域・暮らし・科学技術・国際がある。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 経済面の解決策の方向づけに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜課題】第六次環境基本計画を根拠に、自然資本投資の課題を『制度・政策』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　環境価値を市場価値に内部化するため、成長志向型CP構想の実行と税制のグリーン化を、競争力を損なわず設計する必要がある<br><br><b>解説</b>　環境価値のような非市場的価値は価格に反映されにくく、市場で評価されない。成長志向型カーボンプライシングや税制のグリーン化は、その内部化の手段である<br><br><b>答案に書くなら</b>　制度・政策の観点から、環境価値の内部化に向け成長志向型カーボンプライシング構想と税制のグリーン化を、競争力を損なわずに設計する必要があることが課題である。<br><br><b>関連</b>　解決策側の用語は成長志向型カーボンプライシング構想（GX投資を先行させ炭素価格負担を段階導入）である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 制度・政策の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜課題】自然資本投資の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　サステナブルファイナンスと地域金融のESG化による資金動員が不可欠だが、評価指標が未成熟で資金が循環しにくい<br><br><b>解説</b>　自然資本投資には民間資金の動員が欠かせないが、環境価値の評価指標が未成熟だと投資判断がしにくく、資金が自然資本に回りにくい<br><br><b>答案に書くなら</b>　経済・資金の観点から、サステナブルファイナンスと地域金融のESG化による資金動員が不可欠だが、評価指標が未成熟で資金が循環しにくいことが課題である。<br><br><b>関連</b>　サステナブルファイナンスは環境・社会課題の解決に資する事業へ資金を誘導する枠組みである。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜課題】計画の実践・実装の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　環境人材の育成や公正な移行への人的資本投資、地域循環共生圏を支える中間支援組織の担い手不足が制約になっている<br><br><b>解説</b>　計画を地域で実行するには、環境分野の専門人材と、主体間を橋渡しする中間支援組織が要る。担い手が不足すると実践・実装が進まない<br><br><b>答案に書くなら</b>　人材・担い手の観点から、環境人材の育成や公正な移行への人的資本投資と、中間支援組織の担い手不足が実践・実装の制約となっていることが課題である。<br><br><b>関連</b>　公正な移行（ジャスト・トランジション）は、転換で影響を受ける産業・労働者・地域に不利益が偏らないようにする考え方である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 人材・担い手の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜解決策】地域ごとに異なる課題への解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　地域循環共生圏の形成で、地域の自然資本を活かし近隣と資源を補完し合う自立・分散型の地域づくりを進める<br><br><b>解説</b>　地域循環共生圏は、地域の自然資本を最大限活用し、近隣地域と資源を補完し合う自立・分散型の地域づくり。地域ごとに課題が違う問題への解決策として使える専門用語である<br><br><b>答案に書くなら</b>　地域の観点から、地域循環共生圏を形成し、地域の自然資本を活かして近隣と資源を補完し合う自立・分散型の地域づくりを進めることが解決策である。<br><br><b>関連</b>　地域固有の合意形成の例として水俣の「もやい直し」や福島の「未来志向」が挙げられる。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 地域系の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜解決策】環境価値の内部化に向けた解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　成長志向型カーボンプライシング構想で、先行投資を促しつつ炭素価格負担を段階的に導入し、脱炭素と競争力を両立する<br><br><b>解説</b>　成長志向型カーボンプライシング構想は、GX投資を先行させつつ将来の炭素価格負担を段階的に導入する構想。化石燃料依存の低減と産業競争力強化の両立を狙う<br><br><b>答案に書くなら</b>　制度の観点から、成長志向型カーボンプライシング構想により、先行投資を促しつつ炭素価格負担を段階的に導入し、脱炭素と競争力を両立することが解決策である。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 制度面の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜リスク】30by30を急ぐ地域共生型再エネ拡大で生じるリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：景観・生態系への新たな環境負荷。対策：洋上・陸上風力の環境配慮の制度検討を計画の初期段階から組み込む<br><br><b>解説</b>　再エネ・洋上風力の導入拡大は脱炭素に資する一方、景観や生態系に新たな負荷を与える可能性があり、脱炭素と自然共生のトレードオフになる<br><br><b>答案に書くなら</b>　リスクとして、再エネ導入拡大が景観・生態系に新たな環境負荷を生むおそれがあるため、洋上・陸上風力の環境配慮の制度検討を計画の初期段階から組み込む必要がある。<br><br><b>関連</b>　トレードオフを避けるには、導入計画の初期段階での環境配慮の組み込みが鍵である。<br><br><b>答案での使い方</b>　必須Ⅰ(3) 脱炭素と自然共生のトレードオフに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜注意】2035年度60%・2040年度73%削減は第六次環境基本計画の数字か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　違う。地球温暖化対策計画（2025年2月）の数字。第六次が明記するのは2030年度46%とCN2050<br><br><b>解説</b>　2035年度60%・2040年度73%削減（2013年度比）は2025年2月閣議決定の地球温暖化対策計画の数字。第六次環境基本計画の本体・概要には明記されていない<br><br><b>答案に書くなら</b>　本計画が明記する削減目標は2030年度46%とカーボンニュートラル2050であり、2035年度60%・2040年度73%は地球温暖化対策計画の数字である。<br><br><b>関連</b>　連携する第五次循環型社会形成推進基本計画や生物多様性国家戦略2023-2030も別個の計画で、本計画の内容として引用しない。<br><br><b>答案での使い方</b>　両計画の数字を混同すると減点。書き分ける<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223504.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜時期】地球温暖化対策計画（現行）が閣議決定されたのはいつ（何年何月）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2025年2月（2021年10月の前計画を改定）。2035・2040年度目標はこの改定で新設<br><br><b>解説</b>　地球温暖化対策推進法第8条第1項に基づく計画で、2021年10月の前計画を2025年2月18日に改定した。前計画は2030年度目標のみで、2035・2040年度目標が新設された<br><br><b>答案に書くなら</b>　本計画は2025年2月に改定された地球温暖化対策計画であり、2035・2040年度目標を含む最新版に基づいて課題を整理する。<br><br><b>関連</b>　根拠法は環境基本法第15条ではなく温対法第8条第1項で、第六次環境基本計画とは別の計画である。<br><br><b>答案での使い方</b>　書き出しで最新版を明示。旧計画(2030年度のみ)と区別<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜目標】地球温暖化対策計画の2030・2035・2040年度の削減目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2013年度比で2030年度46%（7.6億t）、2035年度60%（5.7億t）、2040年度73%（3.8億t）<br><br><b>解説</b>　削減率の基準は2013年度の排出・吸収量。2030年度は46%減（さらに50%の高みに挑戦）、2035年度は60%減、2040年度は73%減と段階的に深掘りし、2050年にネットゼロを目指す<br><br><b>答案に書くなら</b>　環境の観点から、2030年度46%、2035年度60%、2040年度73%という段階的な削減目標の達成に向け、対策の加速が課題である。<br><br><b>関連</b>　2030年度目標46%は旧計画から不変で、2035・2040年度が新設である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 課題の大きさと(2)の到達点の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜目標】2024年度の温室効果ガス排出・吸収量は何億t（2013年度比）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　9.94億t（2013年度比28.7%減）。初めて10億tを下回った（2026年4月発表）<br><br><b>解説</b>　2024年度の排出・吸収量は9.94億トンで、2013年度以降の最低値。初めて10億トンを下回った。2030年度目標の7.6億トンまでは依然として差がある<br><br><b>答案に書くなら</b>　環境の観点から、2024年度の排出・吸収量は9.94億トン（2013年度比28.7%減）であり、2030年度目標の7.6億トンまでなお大きな差がある。<br><br><b>関連</b>　2022年度は10.8億トン（2013年度比22.9%減）、2023年度確報値は10.17億トン（27.1%減）である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 現状と2030年度目標7.6億tとの差を示す<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜目標】家庭部門のエネルギー起源CO2の2030年度目安は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　71百万t（2013年度209百万tから66%減）<br><br><b>解説</b>　家庭部門のエネルギー起源CO2は、2013年度の209百万tから2030年度に71百万t（66%減）とする目安。全体目標の46%減より大幅に深い削減率である。R8 Ⅰ-2の題材でもある<br><br><b>答案に書くなら</b>　環境の観点から、家庭部門は2013年度209百万tから2030年度71百万t（66%減）へ、全体目標より深い削減が求められることが課題である。<br><br><b>関連</b>　2040年度は約40〜60百万t（71〜81%減）の目安で、運輸部門の2030年度目安は146百万t（35%減）である。<br><br><b>答案での使い方</b>　R8 Ⅰ-2の題材。全体目標46%と取り違えない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜柱】地球温暖化対策計画の4本の柱は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　エネルギー転換／産業・業務・運輸等／地域・くらし／横断的取組<br><br><b>解説</b>　計画の柱はエネルギー転換、産業・業務・運輸等、地域・くらし、横断的取組の4つ。エネルギー転換は再エネ・原子力の最大活用、LNG火力の脱炭素化、非効率石炭のフェードアウトなどを含む<br><br><b>答案に書くなら</b>　解決策として、エネルギー転換、産業・業務・運輸等、地域・くらし、横断的取組の4分野で対策を一体的に進めることが必要である。<br><br><b>関連</b>　地域・くらしの柱は脱炭素先行地域100以上の創出や省エネ住宅、食品ロス削減を含む。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の分野を国の分類で言う<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜柱】横断的取組に位置づく施策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　成長志向型カーボンプライシング、循環経済移行、吸収源確保、国際貢献<br><br><b>解説</b>　横断的取組は、特定の部門に限らず全体に効く施策群である。成長志向型カーボンプライシングで投資を促し、循環経済で資源を循環させ、吸収源で排出を相殺し、国際貢献で世界の削減にも寄与する<br><br><b>答案に書くなら</b>　解決策として、成長志向型カーボンプライシング、循環経済移行、吸収源確保、国際貢献を部門横断で進めることが有効である。<br><br><b>関連</b>　吸収源対策は森林やブルーカーボンで、2040年度は約84百万t-CO2の吸収を見込む。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 横断的な解決策を挙げるときに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜課題】温暖化対策計画を根拠に、脱炭素化が難しい分野の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　水素・アンモニア・CCUS等による火力の脱炭素化や、航空・海運の次世代燃料の実用化に技術的ブレイクスルーが必要<br><br><b>解説</b>　火力や航空・海運は、電化や再エネだけでは脱炭素が難しい分野。水素・アンモニアやCCUS（CO2の回収・利用・貯留）、次世代燃料の実用化に技術的な突破が要る<br><br><b>答案に書くなら</b>　技術の観点から、水素・アンモニア・CCUS等による火力の脱炭素化や航空・海運の次世代燃料の実用化に、技術的ブレイクスルーが必要であることが課題である。<br><br><b>関連</b>　CCUSは発電所・工場等から排出されるCO2を分離・回収し、利用または地中に貯留する技術である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜課題】脱炭素先行地域100以上の創出の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　計画策定・実施を担う自治体職員や事業者側の体制・人材の確保が課題<br><br><b>解説</b>　脱炭素先行地域は2030年度までに100以上の創出を目標とする。数が多いほど、計画の策定・実施を担う自治体職員や事業者側の体制が足りなくなりやすい<br><br><b>答案に書くなら</b>　人材・担い手の観点から、脱炭素先行地域の創出に向け、計画策定・実施を担う自治体職員や事業者側の体制・人材の確保が課題である。<br><br><b>関連</b>　小規模自治体では都道府県・連携中枢都市等との共同・連携策定が対策になる。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 人材・担い手の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜課題】2030年度目標とネットゼロを結ぶ道筋の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　中長期の予見可能性を高め、GX投資を加速する資金動員が課題<br><br><b>解説</b>　2030年度目標と2050年ネットゼロを直線的につなぐ経路には長期の巨額投資が必要。見通しが不透明だと企業は投資をためらうため、予見可能性の確保が資金動員の前提になる<br><br><b>答案に書くなら</b>　経済・資金の観点から、中長期の予見可能性を高め、GX投資を加速する資金動員が課題である。<br><br><b>関連</b>　制度面の対応が成長志向型カーボンプライシングで、エネルギー基本計画やGX2040ビジョンと一体的に運用する。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜解決策】火力発電の脱炭素化の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　水素・アンモニア混焼やCCUSで火力を脱炭素化し、非効率石炭火力は計画的にフェードアウトする<br><br><b>解説</b>　火力の脱炭素化は、水素・アンモニア混焼やCCUSで排出を減らす手法。非効率石炭火力のフェードアウトは、発電効率の低い石炭火力を計画的に休廃止する対策である<br><br><b>答案に書くなら</b>　解決策として、水素・アンモニア混焼やCCUSで火力を脱炭素化し、非効率石炭火力を計画的にフェードアウトすることが有効である。<br><br><b>関連</b>　LNG火力はトランジション手段として位置づけられ、再エネ・原子力の最大活用と並行する。<br><br><b>答案での使い方</b>　必須Ⅰ(2) エネルギー転換の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜解決策】地域の脱炭素化の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　脱炭素先行地域を2030年度までに100以上創出し、民生部門の電力CO2実質ゼロのモデルを全国へ広げる<br><br><b>解説</b>　脱炭素先行地域は、民生部門の電力消費に伴うCO2排出の実質ゼロ等を2030年度までに目指す先行モデルの地域。地域特性に応じた成功例を示し、横展開で全国の脱炭素化を進める<br><br><b>答案に書くなら</b>　解決策として、脱炭素先行地域を2030年度までに100以上創出し、民生部門の電力CO2実質ゼロのモデルを全国に広げることが有効である。<br><br><b>関連</b>　リスクは体制不足の小規模自治体で計画が形だけになることで、広域での人材支援が対策になる。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 地域・くらしの解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜リスク】石炭火力のフェードアウトを急ぐリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：代替電源の整備が追いつかず需給バランスに影響。対策：LNG火力を移行手段に使い、再エネ・原子力の最大活用を並行する<br><br><b>解説</b>　石炭火力を急に減らすと、代替電源が間に合わずに電力の需給バランス（供給の安定性）を崩すおそれがある。移行期間に使える電源を確保することが対策の骨格になる<br><br><b>答案に書くなら</b>　リスクとして、石炭火力のフェードアウトで電力の需給バランスに影響が出るおそれがあり、LNG火力を移行手段に用い、再エネ・原子力の最大活用を並行して進める必要がある。<br><br><b>関連</b>　JCM等の海外クレジット依存でも国内削減が希薄化するリスクがあり、国内削減を基本にフォローアップする。<br><br><b>答案での使い方</b>　必須Ⅰ(3) エネルギー転換のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜注意】2035・2040年度の部門別CO2数値は確定値か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　確定値ではない。複数シナリオ分析に基づく幅のある「目安」<br><br><b>解説</b>　2035・2040年度のエネルギー起源CO2の部門別数値は、複数シナリオの分析に基づく幅のある見通しで、確定した配分ではない。技術進展が遅れると目標と実績のギャップが広がり得る<br><br><b>答案に書くなら</b>　2035・2040年度の部門別数値は複数シナリオに基づく「目安」であり、毎年の進捗点検で対策を柔軟に見直す必要がある。<br><br><b>関連</b>　進捗点検は毎年1回、地球温暖化対策推進本部でフォローアップを行う。<br><br><b>答案での使い方</b>　答案で確定値のように書くと減点。「目安」と書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜時期】GX2040ビジョンと第7次エネルギー基本計画の閣議決定はいつ？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　いずれも2025年2月18日。別の文書で、GX2040は2023年7月の戦略の改訂版<br><br><b>解説</b>　GX2040ビジョンは脱炭素成長型経済構造移行推進法（GX推進法）に基づく戦略の改訂版、第7次エネルギー基本計画はエネルギー政策基本法第12条第1項に基づく計画で、根拠法が異なる別の文書である<br><br><b>答案に書くなら</b>　GX2040ビジョンと第7次エネルギー基本計画は2025年2月18日に閣議決定された最新版であり、これに基づいて課題を整理する。<br><br><b>関連</b>　GX2040ビジョンは2023年7月の脱炭素成長型経済構造移行推進戦略の改訂版である。<br><br><b>答案での使い方</b>　書き出しで最新版を明示。2文書を混ぜない<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜時期】排出量取引制度が本格稼働（義務化）する年度は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2026年度。2023年度開始の自主参加型GXリーグとは別<br><br><b>解説</b>　排出量取引制度は2026年度から本格稼働し、一定の排出規模以上の企業の参加を業種等を問わず義務化する。2023年度開始のGXリーグは自主参加型の第1段階で、本格稼働後は義務の制度に変わる<br><br><b>答案に書くなら</b>　制度の観点から、排出量取引制度は2026年度に本格稼働し、一定規模以上の排出企業に参加が義務化される。<br><br><b>関連</b>　義務化にはGX推進法改正案の国会提出が伴う。自主参加のGXリーグと時系列で混同しない。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰで「義務化済み」と書く根拠に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜目標】2040年度の電源構成（目安）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　再エネ4〜5割程度、火力3〜4割程度、原子力2割程度。2022年度は再エネ21.8%、火力72.6%<br><br><b>解説</b>　2040年度の電源構成は目安で、2022年度は火力が7割超と偏っていた。再エネを大きく伸ばし火力を減らす必要があり、現状との差が課題の大きさを示す<br><br><b>答案に書くなら</b>　環境・エネルギーの観点から、2022年度の再エネ21.8%・火力72.6%に対し、2040年度は再エネ4〜5割程度、火力3〜4割程度、原子力2割程度を目指す必要がある。<br><br><b>関連</b>　2040年度の数値は暫定値で確定した目標ではない。エネルギー自給率は3〜4割程度の見通し（2022年度は12.6%）である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 現状との差で課題の大きさを示す<br><br>【出典】<a href=\"https://www.enecho.meti.go.jp/category/others/basic_plan/pdf/20250218_03.pdf\" target=\"_blank\" rel=\"noopener\">資源エネルギー庁（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜目標】GX経済移行債の規模と、呼び込む官民投資の規模は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　10年間で20兆円規模の先行投資支援により、150兆円規模の官民投資を呼び込む<br><br><b>解説</b>　GX経済移行債は先行投資支援の財源となる国債。国が先に投資を支えることで、民間の投資判断を後押しし、規模の大きい官民投資を引き出す<br><br><b>答案に書くなら</b>　資金面の解決策として、GX経済移行債による10年間で20兆円規模の先行投資支援で、150兆円規模の官民投資を呼び込むことが有効である。<br><br><b>関連</b>　支援の配分は、炭素価格の予見性を確保しつつ多排出産業の構造転換へ適切に行う必要がある。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 資金面の解決策の規模感に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜柱】GX2040ビジョンの柱のうち、カーボンプライシングの柱は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　成長志向型カーボンプライシング構想。排出量取引制度の本格稼働と化石燃料賦課金（2028年度）で炭素価格を形成<br><br><b>解説</b>　カーボンプライシングは炭素に価格をつけて排出削減とGX投資を促す仕組み。この構想は排出量取引制度と化石燃料賦課金を組み合わせて、炭素価格を段階的に形成する<br><br><b>答案に書くなら</b>　制度の観点から、成長志向型カーボンプライシング構想により、排出量取引制度と化石燃料賦課金で炭素価格を段階的に形成することが解決策である。<br><br><b>関連</b>　化石燃料賦課金は化石燃料の輸入事業者等に課す賦課金で、2028年度から導入予定である。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 制度面の解決策の国の言葉に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜柱】GX2040ビジョンの「GX産業立地」の考え方は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　脱炭素電源を見据えた産業集積の加速と、地域に利益が及ぶ地域GXを進める<br><br><b>解説</b>　GX産業立地は、脱炭素電源が使える場所に産業を集積させる考え方。電源の近くに企業を集めれば競争力と脱炭素を両立でき、利益を地域に及ぼす地域GXが合意形成の鍵になる<br><br><b>答案に書くなら</b>　地域の観点から、脱炭素電源を見据えた産業集積を進めつつ、利益が地域に及ぶ地域GXを進めることが解決策である。<br><br><b>関連</b>　データセンター立地では電力と通信のインフラ整備を効率的に連携させるワット・ビット連携の考え方もある。<br><br><b>答案での使い方</b>　必須Ⅰ・Ⅲ 地域系の解決策の方向づけに<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜課題】再エネ主力電源化（2040年度4〜5割）の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　出力変動を調整する系統整備・蓄電池・次世代革新炉など複数技術の同時確立が必要で、単一技術では対応できない<br><br><b>解説</b>　再エネは天候で出力が変動するため、主力電源にするには需給を調整する手段が要る。系統整備、蓄電池、次世代革新炉などの複数技術がそろって初めて安定供給と両立できる<br><br><b>答案に書くなら</b>　技術の観点から、再エネ主力電源化には、出力変動に対応する系統整備・蓄電池・次世代革新炉など複数技術を同時に確立する必要があることが課題である。<br><br><b>関連</b>　次世代革新炉は安全性を高めた新型の原子炉技術で、原子力の活用と並行して検討される。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜課題】排出量取引制度の義務化の課題を『制度』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　公平性確保のため、業種別の無償割当ルールと価格安定化措置（上限・下限価格）の制度設計が課題<br><br><b>解説</b>　排出量取引は事業者に排出枠を割り当てる仕組みで、無償割当てのルールが不公平だと産業間の反発を招く。価格が乱高下すると投資計画も立てにくいため、上限・下限価格で安定させる<br><br><b>答案に書くなら</b>　制度の観点から、排出量取引制度の義務化にあたり、公平性確保のため業種別の無償割当ルールと上限・下限価格などの価格安定化措置の制度設計が課題である。<br><br><b>関連</b>　運営やGX投資へのファイナンス支援はGX推進機構（2024年7月業務開始）が担う。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 制度の観点の課題に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜課題】中堅・中小企業のGX対応の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　大企業に比べ支援機関・資金・人材が不足し、排出量の見える化や設備高度化の対応力の差が広がりやすい<br><br><b>解説</b>　排出量の見える化や設備の高度化には、専門の支援機関、資金、人材が必要。大企業は自力で対応できるが、中堅・中小企業は不足しやすく、対応力の差が広がる<br><br><b>答案に書くなら</b>　人材・担い手の観点から、中堅・中小企業は大企業に比べ支援機関・資金・人材が不足し、排出量の見える化や設備高度化の対応力の差が広がりやすいことが課題である。<br><br><b>関連</b>　GX産業構造の柱では、GX価値の見える化や企業の成長投資・カーブアウトで産業競争力を両立する。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 人材・担い手の観点の課題に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜解決策】排出量取引制度による解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　排出枠の無償割当てと取引で炭素価格を形成し、多排出産業の投資と構造転換を促す<br><br><b>解説</b>　排出量取引制度（GX-ETS）は、排出枠を割り当てて取引させることで炭素に価格をつける制度。排出に費用がかかるようになるため、多排出産業の投資や構造転換が促される<br><br><b>答案に書くなら</b>　制度面の解決策として、排出量取引制度で排出枠の無償割当てと取引により炭素価格を形成し、多排出産業の投資と構造転換を促すことが有効である。<br><br><b>関連</b>　リスクはコスト増による競争力低下と海外移転（カーボンリーケージ）で、対策は業種特性への配慮である。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 制度面の解決策に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜解決策】再エネ主力電源化の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　S+3Eを前提に、系統整備・蓄電池・次世代革新炉・火力の脱炭素化を並行して進める<br><br><b>解説</b>　S+3Eは、安全性を前提にエネルギー安定供給・経済効率性・環境適合の3つを同時に達成する基本視点。再エネだけに偏らず、系統整備や蓄電池、原子力、火力の脱炭素化を並行して進める根拠になる<br><br><b>答案に書くなら</b>　エネルギーの観点から、S+3Eを前提に、系統整備・蓄電池・次世代革新炉・火力の脱炭素化を並行して再エネ主力電源化を進めることが解決策である。<br><br><b>関連</b>　リスクは出力変動の増大による周波数・系統安定性の低下で、火力の調整力維持が対策になる。<br><br><b>答案での使い方</b>　必須Ⅰ(2) エネルギー面の解決策に<br><br>【出典】<a href=\"https://www.enecho.meti.go.jp/category/others/basic_plan/pdf/20250218_03.pdf\" target=\"_blank\" rel=\"noopener\">資源エネルギー庁（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜解決策】データセンター立地等の合意形成の解決策を、専門用語で言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　地域GX（地域裨益型・地域共生型）で、脱炭素電源の利益を地域に還元し、自治体と連携して地方創生につなげる<br><br><b>解説</b>　データセンターなどの立地は地域に雇用や税収をもたらす一方、電力需要の急増や住民の理解が課題になる。地域GXは、脱炭素電源の整備の利益を地域に還元し、自治体と連携して進めることで合意を得る考え方である<br><br><b>答案に書くなら</b>　地域の観点から、地域GXにより脱炭素電源の利益を地域に還元し、自治体と連携して地方創生につなげることが解決策である。<br><br><b>関連</b>　企業を誘致する自治体への支援と、住民への裨益を両立させることが課題とされる。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 地域系の解決策に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜リスク】排出量取引制度の義務化で生じるリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：多排出産業の競争力低下と海外移転（カーボンリーケージ）。対策：政府指針による業種配慮の無償割当てと移行期の投資余力確保<br><br><b>解説</b>　義務化で炭素のコストが上がると、鉄鋼・化学などの多排出産業は国際競争で不利になり、規制の緩い国へ製造拠点が移る（カーボンリーケージ）おそれがある。業種ごとの事情を制度に反映することが対策になる<br><br><b>答案に書くなら</b>　リスクとして、多排出産業の競争力低下とカーボンリーケージが懸念されるため、政府指針で業種特性に配慮した無償割当てを行い、移行期の投資余力を確保する必要がある。<br><br><b>関連</b>　排出量取引や賦課金のコストは電気料金・製品価格に転嫁され、中小企業や家庭の負担増につながるおそれもある。<br><br><b>答案での使い方</b>　必須Ⅰ(3) 制度導入のリスクと対策に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜注意】2035年度60%・2040年度73%削減と、R8 Ⅰ-2の家庭部門66%の違いは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　60%・73%は全体（2013年度比）、66%は家庭部門（2030年度）。母集団が違う<br><br><b>解説</b>　60%・73%は日本全体の温室効果ガス排出量の削減率（2013年度比、2035・2040年度）で、家庭部門の66%は地球温暖化対策計画の2030年度の目安。同じ数字でも、対象（母集団）と年度が違う<br><br><b>答案に書くなら</b>　2035年度60%・2040年度73%は全体の削減目標、家庭部門66%は地球温暖化対策計画の2030年度の目安であり、対象が異なる。<br><br><b>関連</b>　家庭部門の2040年度目安は71〜81%減で、いずれも2013年度が基準である。<br><br><b>答案での使い方</b>　数字は母集団とセットで書く。取り違えは減点<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜時期】気候変動適応計画の閣議決定と一部変更はいつ（何年何月）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2021年10月に閣議決定、2023年5月に一部変更。一部変更で熱中症対策実行計画が第4章に追加<br><br><b>解説</b>　当初の計画は2021年10月22日に閣議決定され、2023年5月30日の一部変更で熱中症対策実行計画が第4章に追加された。実行計画は2023年4月改正の気候変動適応法第16条第1項に基づく<br><br><b>答案に書くなら</b>　本計画は2021年10月に閣議決定され、2023年5月の一部変更で熱中症対策実行計画が第4章に加わった気候変動適応計画である。<br><br><b>関連</b>　計画変更の根拠は第8条第1項、実行計画の根拠は第16条第1項で、条文番号を混同しない。<br><br><b>答案での使い方</b>　書き出しで版を明示。熱中症対策は第4章の内容として書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜時期】気候変動適応計画の次の改定の見通しは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2026年2月の第3次影響評価報告書を受け、2026年度内に改定予定。骨子は2026年6月<br><br><b>解説</b>　第3次気候変動影響評価報告書が2026年2月16日に公表され、気候変動適応計画の改定は2026年度に予定されている。影響評価はおおむね5年ごとに実施され、その結果を勘案して計画を改定する<br><br><b>答案に書くなら</b>　気候変動適応計画は、2026年2月公表の第3次影響評価報告書を受けて2026年度に改定が予定されている。<br><br><b>関連</b>　現行計画の計画期間はおおむね5年間で、「改定予定」と書き、現行版と区別する。<br><br><b>答案での使い方</b>　書き出しで「改定予定」と書き、旧版との取り違えを避ける<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜目標】熱中症対策実行計画の中期目標（2030年）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　熱中症死亡者数（5年移動平均）を、令和4年概数の1,295名から半減<br><br><b>解説</b>　熱中症対策実行計画は、2030年までに熱中症による死亡者数（5年移動平均）を令和4年概数の1,295名から半減させる中期目標を置く。基準値と比べて到達度を測る数値目標になる<br><br><b>答案に書くなら</b>　解決策の到達点として、2030年までに熱中症死亡者数（5年移動平均）を令和4年概数1,295名から半減させることを目指す。<br><br><b>関連</b>　目標は死亡者数の5年移動平均で、単年の実績とは扱いが異なる。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の到達点の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000136709.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜目標】熱中症死亡者数の実績は目標の基準値と比べてどうか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　令和5年1,651人、令和6年2,160人と、基準値1,295名を大きく上回り増加（人口動態統計確定数）<br><br><b>解説</b>　実績は目標と逆方向に動いており、人口動態統計（確定数）の熱中症死亡者数は令和5年に1,651人、令和6年に2,160人。基準値1,295名を大きく上回り、課題の大きさを示す<br><br><b>答案に書くなら</b>　健康の観点から、熱中症死亡者数は令和5年1,651人、令和6年2,160人と基準値1,295名を大きく上回って増加しており、対策の強化が課題である。<br><br><b>関連</b>　基準値の1,295名は令和4年の概数で、確定数ではなく概数の数字である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 課題の大きさを示す数字に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000136709.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜柱】適応計画の7つの基本戦略は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　施策への組み込み、科学的知見、情報基盤、地域推進、事業者等の促進、国際貢献、関係機関連携<br><br><b>解説</b>　計画は、あらゆる施策に適応を組み込み、科学的知見に基づき、情報基盤を整備し、地域の実情に応じ、国民・事業者の理解を深め、途上国の能力向上に貢献し、関係機関が連携する、という7つの基本戦略を掲げる<br><br><b>答案に書くなら</b>　解決策として、あらゆる施策への適応の組み込みや科学的知見に基づく推進など、7つの基本戦略に沿って対策を進めることが有効である。<br><br><b>関連</b>　第2章の7分野（分野別施策）とは別物で、どちらも7個なので混同しない。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の方向を国の言葉で言う<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜柱】適応計画で「地域の実情に応じた適応」を進める仕組みは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　地域気候変動適応計画と地域適応センター。国立環境研究所が情報基盤A-PLATで支援<br><br><b>解説</b>　地域ごとに気候影響が違うため、地域単位で適応を進める。都道府県・市町村が地域気候変動適応計画を策定し、地域適応センターが影響情報の収集・提供を担い、国立環境研究所が情報基盤A-PLATで支える<br><br><b>答案に書くなら</b>　地域の観点から、地域気候変動適応計画と地域気候変動適応センターを軸に、A-PLATによる情報基盤で地域の実情に応じた適応を進めることが解決策である。<br><br><b>関連</b>　A-PLATは国内向け、AP-PLATはアジア太平洋の途上国向けの情報プラットフォームである。<br><br><b>答案での使い方</b>　必須Ⅰ・Ⅱ-2 地域施策の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜課題】地域の適応推進の課題を『制度・政策』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　地域適応計画の策定が努力義務にとどまるため、地域適応センターの設置を含む制度的な推進力の確保が課題<br><br><b>解説</b>　地域気候変動適応計画の策定は都道府県・市町村の努力義務にとどまり、強制力が弱い。推進力を確保するには、地域適応センターの設置など制度面の枠組みが要る<br><br><b>答案に書くなら</b>　制度・政策の観点から、地域気候変動適応計画の策定が努力義務にとどまるため、地域適応センターの設置を含む制度的な推進力の確保が課題である。<br><br><b>関連</b>　国と地方が連携する場として、環境省が主導して気候変動適応広域協議会を組織する。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 制度・政策の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜課題】適応策の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　事業者の気候リスク対応投資を促し、適応ビジネスをどう資金面で後押しするかが課題<br><br><b>解説</b>　気候リスクが事業に与える影響への備えは、事業者の投資に頼る部分が大きい。適応ビジネスは、気候変動影響を事業機会として捉え、他者の適応を支援する製品・サービスを展開する事業活動で、これを資金面でどう支えるかが課題になる<br><br><b>答案に書くなら</b>　経済・資金の観点から、事業者の気候リスク対応投資を促し、適応ビジネスを資金面でどう後押しするかが課題である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜課題】適応策の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　農業の高温耐性品種の開発・普及と、流域治水やグリーンインフラによるハード・ソフト一体の防災技術の高度化が課題<br><br><b>解説</b>　気候の高温化で作物の品質低下や水害の激甚化が進む。高温耐性品種は耐暑性を高めた品種で、流域治水やグリーンインフラは自然の機能も使う防災手法である。複数の技術を高度化する必要がある<br><br><b>答案に書くなら</b>　技術の観点から、農業の高温耐性品種の開発・普及と、流域治水やグリーンインフラによるハード・ソフト一体の防災技術の高度化が課題である。<br><br><b>関連</b>　高温耐性品種はコメや果樹で導入が進む。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜解決策】水害リスクの解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　流域治水で、河川整備に加え流域全体の関係者が協働し、ハード・ソフト一体で水害リスクを下げる<br><br><b>解説</b>　流域治水は、河川整備だけでなく流域全体のあらゆる関係者が協働する治水の考え方。ハード（堤防等）とソフト（情報・避難等）を一体で進め、水害リスクを低減する<br><br><b>答案に書くなら</b>　解決策として、流域治水により、河川整備に加え流域全体の関係者が協働し、ハード・ソフト一体で水害リスクを下げることが有効である。<br><br><b>関連</b>　グリーンインフラは自然の機能を活用する社会資本整備の手法で、流域治水と組み合わせて使う。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 自然災害分野の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜解決策】熱中症の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　熱中症警戒情報・特別警戒情報（WBGT基準）の発表と、指定暑熱避難施設の開放で、高齢者等の被害を防ぐ<br><br><b>解説</b>　熱中症警戒情報は、府県予報区内の1地点以上で日最高WBGTが33以上と予測される場合、特別警戒情報は都道府県内の全地点で35以上と予測される場合に発表される。特別警戒情報の発表時には指定暑熱避難施設が開放される<br><br><b>答案に書くなら</b>　解決策として、熱中症警戒情報・特別警戒情報の発表と指定暑熱避難施設の開放により、高齢者等の熱中症被害を防ぐことが有効である。<br><br><b>関連</b>　WBGT（暑さ指数）は気温・湿度・放射熱から算出する熱中症予防の指標である。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 健康分野の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000136709.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜リスク】流域治水の大規模投資で生じるリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：財政負担の拡大と生態系の分断など新たな環境影響。対策：グリーンインフラやNbSを組み合わせ環境配慮型の整備を優先する<br><br><b>解説</b>　堤防など大規模なハード整備は財政負担が重く、生態系の分断のような新たな環境影響も生む。グリーンインフラやNbS（自然を活用した解決策）を組み合わせれば環境への配慮と防災を両立しやすい<br><br><b>答案に書くなら</b>　リスクとして、流域治水の大規模投資は財政負担の拡大や生態系の分断を招くおそれがあり、グリーンインフラやNbSを組み合わせた環境配慮型の整備を優先する必要がある。<br><br><b>関連</b>　NbSは生態系の保全・再生など自然の機能を活用して社会課題を解決する手法である。<br><br><b>答案での使い方</b>　必須Ⅰ(3) ハード整備のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜リスク】地域適応計画が努力義務であることで生じるリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：小規模市町村で策定が進まず地域間の適応力が開く。対策：広域協議会を通じ都道府県が市町村を技術的・財政的に支援<br><br><b>解説</b>　努力義務のため、財政力や専門人材が乏しい小規模市町村で策定が進まず、自治体間の適応力の差が広がる。国と地方が連携する広域協議会を通じ、都道府県が市町村を技術的・財政的に支援する体制が対策になる<br><br><b>答案に書くなら</b>　リスクとして、努力義務のため小規模市町村で策定が進まず地域間の適応力が開くおそれがあり、気候変動適応広域協議会を通じて都道府県が市町村を技術的・財政的に支援する必要がある。<br><br><b>関連</b>　国立環境研究所も地方公共団体に技術的援助を行う。<br><br><b>答案での使い方</b>　必須Ⅰ(3)・Ⅱ-2 自治体支援の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜注意】適応計画の「7分野」と「7つの基本戦略」は同じか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　別物。7分野は農林水産業・水環境・自然生態系・自然災害・健康・産業経済・国民生活の分野別施策<br><br><b>解説</b>　7分野は第2章の分野別施策で、農業・林業・水産業、水環境・水資源、自然生態系、自然災害・沿岸域、健康、産業・経済活動、国民生活・都市生活を指す。7つの基本戦略は施策への組み込みなど進め方の枠組みで、別の分類である<br><br><b>答案に書くなら</b>　分野別施策の7分野（農林水産業、水環境・水資源、自然生態系、自然災害・沿岸域、健康、産業・経済活動、国民生活・都市生活）と7つの基本戦略は別物であり、設問に応じて書き分ける。<br><br><b>関連</b>　気候変動適応計画は適応策の計画で、温室効果ガスの46%削減など緩和策の数値目標は地球温暖化対策計画のものである。<br><br><b>答案での使い方</b>　どちらも7個。分野を問う設問に戦略を書くと減点<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜時期】生物多様性国家戦略2023-2030が閣議決定されたのはいつ（何年何月）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2023年3月（31日）。第六次環境基本計画（2024年5月）とは別の計画<br><br><b>解説</b>　2023年3月31日に閣議決定された戦略で、根拠は生物多様性基本法第12条第1項。環境基本計画を基本に策定するため協調関係にあるが、2024年5月閣議決定の第六次環境基本計画とは別の計画である<br><br><b>答案に書くなら</b>　本戦略は2023年3月に閣議決定された生物多様性国家戦略2023-2030であり、2030年のネイチャーポジティブ実現を目指す。<br><br><b>関連</b>　R6 Ⅰ-1とR8 Ⅰ-1で出題歴があり、「第六次」を付けて環境基本計画と取り違えない。<br><br><b>答案での使い方</b>　書き出しで版を明示。R6・R8 Ⅰ-1で出題<br><br>【出典】<a href=\"https://www.e
