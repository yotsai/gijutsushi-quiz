<!-- 生成物です。直接編集しないでください。元は engine/ と subjects/ で、`node build.js nijishi` で作り直します -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="技術士第二次試験（環境部門・環境保全計画）の暗記用一問一答。国の計画の目標・柱と、選択Ⅱ-1の用語の定義・制度・数字。">
<title>技術士第二次試験 環境部門 暗記カード</title>
</head>
<body>

<style>
  :root {
    --paper: #FCFBF8;
    --panel: #FFFFFF;
    --rule: #DCDDD6;
    --rule-strong: #B7BBB2;
    --ink: #191D1A;
    --ink-2: #4A5049;
    --ink-3: #767C74;
    --accent: #0E5049;
    --accent-soft: #E3EDEA;
    --ok: #1B6B3A;
    --ok-soft: #E2F0E5;
    --ng: #9E3324;
    --ng-soft: #F7E6E2;
    --warn: #8A5A00;
    --shadow: 0 1px 2px rgba(25,29,26,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #131614; --panel: #1A1E1C; --rule: #2C312E; --rule-strong: #454B46;
      --ink: #E8EBE7; --ink-2: #AFB5AD; --ink-3: #838A82;
      --accent: #6FBFB2; --accent-soft: #1E3833;
      --ok: #6FC28C; --ok-soft: #1C3325;
      --ng: #E08878; --ng-soft: #3A2320; --warn: #E3B341;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --paper: #131614; --panel: #1A1E1C; --rule: #2C312E; --rule-strong: #454B46;
    --ink: #E8EBE7; --ink-2: #AFB5AD; --ink-3: #838A82;
    --accent: #6FBFB2; --accent-soft: #1E3833;
    --ok: #6FC28C; --ok-soft: #1C3325;
    --ng: #E08878; --ng-soft: #3A2320; --warn: #E3B341;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    font-size: 16px; line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 34rem; margin: 0 auto; padding: 1.5rem 1.1rem 4rem; }

  /* header */
  header { margin-bottom: 1.3rem; }
  .eyebrow { font-size: .72rem; letter-spacing: .15em; color: var(--ink-3); }
  h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 1.32rem; font-weight: 600; margin: .3rem 0 .5rem; line-height: 1.4;
  }
  .intro { font-size: .87rem; color: var(--ink-2); margin: 0; }

  /* progress */
  .status {
    display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap;
    font-size: .8rem; color: var(--ink-3); margin: 1.2rem 0 .45rem;
    font-variant-numeric: tabular-nums;
  }
  .status .field { color: var(--accent); font-weight: 600; letter-spacing: .02em; }
  .status .score { margin-left: auto; }
  .status b { color: var(--ink); }
  .status[hidden], .bar[hidden] { display: none; }

  /* 本番までの残り日数 */
  /* おまかせ出題 */
  .set.auto[aria-pressed="false"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .set .badge {
    display: inline-block; min-width: 1.4em; margin-left: .35em; padding: 0 .35em; border-radius: 999px;
    background: var(--ng); color: #fff; font-size: .68rem; font-weight: 700; line-height: 1.55; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .auto { margin-top: 1rem; padding-top: .9rem; border-top: 1px solid var(--rule); }
  .auto h3 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1rem; font-weight: 600; margin: 0 0 .3rem; }
  .auto-lead { font-size: .82rem; color: var(--ink-2); margin: 0 0 .7rem; line-height: 1.75; }
  .auto-n { display: flex; justify-content: space-between; align-items: baseline; font-size: .85rem; }
  .auto-n output { font-weight: 700; color: var(--accent); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  #autoN { display: block; width: 100%; margin: .45rem 0 .1rem; accent-color: var(--accent); }
  .auto-scale { display: flex; justify-content: space-between; font-size: .72rem; color: var(--ink-3); }
  .auto .btn.wide { margin-top: .8rem; }
  .mastery { display: flex; flex-wrap: wrap; gap: .3rem .9rem; margin-top: .7rem; font-size: .76rem; color: var(--ink-3); }
  .mastery b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .mastery .m1 b { color: var(--ng); }
  .mastery .m3 b, .mastery .m4 b { color: var(--ok); }
  .mst {
    display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .04em; padding: 0 .4rem;
    border-radius: 2px; margin-left: .45rem; vertical-align: 1px; border: 1px solid var(--rule-strong); color: var(--ink-3);
  }
  .mst.m1 { color: var(--ng); border-color: var(--ng); }
  .mst.m3, .mst.m4 { color: var(--ok); border-color: var(--ok); }
  .countdown { font-size: .82rem; color: var(--ink-2); margin: .5rem 0 0; font-variant-numeric: tabular-nums; }
  .countdown b { color: var(--accent); font-size: 1rem; }
  .countdown .cd2 { font-size: .76rem; color: var(--ink-3); }

  /* 覚える理由（過去問の出題実績） */
  .whys { display: flex; flex-wrap: wrap; gap: .3rem; margin: .35rem 0 0; }
  .why {
    display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .02em; line-height: 1.6;
    padding: 0 .45rem; border-radius: 2px; border: 1px solid var(--accent); color: var(--accent);
  }
  .why.t3 { background: var(--accent); color: var(--paper); }
  .why.same { background: var(--accent-soft); }
  .why.t1 { border-style: dashed; border-color: var(--rule-strong); color: var(--ink-3); font-weight: 600; }
  .why.prA { background: var(--accent); color: var(--paper); }
  .why.prC { border-color: var(--rule-strong); color: var(--ink-2); }
  .why.prN { border-style: dashed; border-color: var(--rule-strong); color: var(--ink-3); font-weight: 600; }
  .why.prD { border-color: var(--rule-strong); color: var(--ink-3); background: transparent; font-weight: 600; }
  .whybox {
    margin: .7rem 0 0; padding: .55rem .7rem; background: var(--accent-soft);
    border-left: 3px solid var(--accent); font-size: .82rem; line-height: 1.7; color: var(--ink-2);
  }
  .whybox .wh { display: block; font-size: .72rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
  .whybox.t0 { border-left-color: var(--rule-strong); background: transparent; border: 1px dashed var(--rule); border-left: 3px solid var(--rule-strong); }
  .whybox.t0 .wh { color: var(--ink-3); }

  /* 合格までの道のり（ホーム） */
  .roadmap { margin-top: 1.1rem; padding-top: .9rem; border-top: 1px solid var(--rule); }
  .roadmap h3 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1rem; font-weight: 600; margin: 0 0 .3rem; }
  .roadmap .rm-lead { font-size: .84rem; color: var(--ink-2); margin: 0 0 .6rem; line-height: 1.75; }
  .rm-steps { list-style: none; margin: 0; padding: 0; }
  .rm-steps li {
    display: grid; grid-template-columns: 4.2rem 1fr; gap: .1rem .6rem; align-items: baseline;
    padding: .5rem 0; border-bottom: 1px solid var(--rule); font-size: .84rem;
  }
  .rm-steps .d { font-size: .74rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .rm-steps .t { color: var(--ink); }
  .rm-steps .v { grid-column: 2; font-size: .76rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .rm-steps .st { font-size: .68rem; font-weight: 700; padding: 0 .35rem; border-radius: 2px; margin-left: .35rem; vertical-align: 1px; }
  .rm-steps .done .st { color: var(--ok); border: 1px solid var(--ok); }
  .rm-steps .now .st { color: var(--paper); background: var(--accent); }
  .rm-steps .late .st { color: var(--paper); background: var(--ng); }
  .rm-steps .todo .t { color: var(--ink-3); }
  .roadmap .rm-note { font-size: .76rem; color: var(--ink-3); margin: .45rem 0 0; line-height: 1.65; }
  .rm-next { margin-top: .8rem; }
  .rm-next .lab { font-size: .74rem; color: var(--ink-3); margin: 0 0 .3rem; }
  .rm-next .btn { display: block; width: 100%; text-align: left; padding: .65rem 1rem; margin-top: .45rem; }
  .rm-next .btn .sub { display: block; font-size: .76rem; font-weight: 400; opacity: .88; }
  .homecard .hlead { font-size: .9rem; color: var(--ink-2); margin: 0; line-height: 1.7; }
  .homecard .btn.wide { display: block; width: 100%; text-align: left; padding: .7rem 1rem; margin-top: .9rem; }
  .homecard .btn.wide .sub { display: block; font-size: .78rem; font-weight: 400; opacity: .88; margin-top: .1rem; }
  .homestats {
    display: flex; gap: .4rem 1rem; flex-wrap: wrap; margin-top: 1rem; padding-top: .8rem;
    border-top: 1px solid var(--rule); font-size: .8rem; color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  .homestats b { color: var(--ink); }
  .bar { height: 3px; background: var(--rule); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

  /* card */
  .card {
    background: var(--panel); border: 1px solid var(--rule);
    box-shadow: var(--shadow); padding: 1.15rem 1.1rem 1.25rem; margin-top: 1.1rem;
  }
  .qn { font-size: .75rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .qt { font-size: 1.03rem; font-weight: 600; margin: .25rem 0 .1rem; line-height: 1.6; text-wrap: pretty; white-space: pre-line; }
  .qimg { margin: .5rem 0 .6rem; overflow-x: auto; background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: .3rem; }
  .qimg img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .qimg.zoom img { max-width: none; width: 200%; }
  .stl { margin: .35rem 0 .6rem; display: flex; flex-direction: column; gap: .35rem; }
  .strow { display: flex; gap: .55rem; align-items: flex-start; font-size: .93rem; line-height: 1.6; }
  .stm { flex: none; width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 1px solid var(--rule-strong); background: var(--panel); color: var(--ink-3); font: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .stm.o { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
  .stm.x { border-color: var(--ng); color: var(--ng); background: var(--ng-soft); }
  .sttally { font-size: .8rem; color: var(--accent); font-weight: 700; margin-top: .15rem; text-align: right; }
  .qh { font-size: .82rem; color: var(--ink-3); margin: 0 0 .9rem; line-height: 1.6; }

  .choices { display: flex; flex-direction: column; gap: .45rem; }
  .ch {
    display: flex; align-items: flex-start; gap: .65rem; width: 100%;
    font: inherit; font-size: .95rem; text-align: left; cursor: pointer;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: 2px;
    padding: .58rem .7rem; line-height: 1.55;
    transition: background .12s, border-color .12s;
    font-variant-numeric: tabular-nums;
  }
  .ch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ch:disabled { cursor: default; }
  .ch .key {
    flex: none; width: 1.35rem; height: 1.35rem; margin-top: .1rem;
    display: grid; place-items: center;
    border: 1px solid var(--rule-strong); border-radius: 50%;
    font-size: .72rem; color: var(--ink-3);
  }
  .ch.ok { border-color: var(--ok); background: var(--ok-soft); }
  .ch.ok .key { border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .ch.ng { border-color: var(--ng); background: var(--ng-soft); }
  .ch.ng .key { border-color: var(--ng); color: var(--ng); font-weight: 700; }
  .ch.dim { opacity: .45; }
  .dk {
    align-self: flex-end; margin-top: .15rem; font: inherit; font-size: .8rem; color: var(--ink-3);
    background: transparent; border: 1px dashed var(--rule-strong); border-radius: 999px;
    padding: .35rem .95rem; cursor: pointer;
  }
  .dk:disabled { cursor: default; }
  .dk.on { color: var(--ng); border: 1px solid var(--ng); background: var(--ng-soft); }

  .verdict, .easy, .hq, .hmemo, .qt, .stt, .ch { overflow-wrap: anywhere; word-break: break-word; }
  .verdict { margin-top: .95rem; padding-top: .85rem; border-top: 1px solid var(--rule); }
  .vtag { font-size: .82rem; font-weight: 700; letter-spacing: .04em; }
  .easy { margin: .6rem 0 .2rem; padding: .75rem .85rem; background: var(--accent-soft); border-radius: 10px; font-size: .9rem; line-height: 1.8; }
  .easyh, .vnoteh { font-size: .78rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; margin-bottom: .3rem; }
  .vnoteh { margin-top: .9rem; color: var(--ink-3); }
  .ezh { display: block; font-weight: 700; color: var(--accent); margin-bottom: .1rem; }
  .ezh.now { color: var(--warn); }
  .selcnt { font-size: .82rem; color: var(--ink-3); margin: .2rem 0 .4rem; text-align: right; }
  .selcnt b { color: var(--accent); }
  .selcnt.over, .selcnt.over b { color: var(--ng); }
  .mocksel { font-size: .75em; color: var(--ink-3); margin-left: .2em; }
  .vtag.ok { color: var(--ok); }
  .vtag.ng { color: var(--ng); }
  .vnote { font-size: .86rem; color: var(--ink-2); margin: .3rem 0 0; line-height: 1.72; }
  .vnote b { color: var(--ink); }
  .vsrc {
    font-size: .73rem; color: var(--ink-3); margin: .55rem 0 0;
    padding-top: .45rem; border-top: 1px dotted var(--rule);
  }
  .vsrc.k { color: var(--ng); }

  .actions { display: flex; gap: .5rem; margin-top: 1rem; align-items: center; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: .87rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--paper);
    border: 1px solid var(--accent); border-radius: 2px; padding: .45rem 1.3rem;
  }
  @media (hover: hover) and (pointer: fine) { .btn:hover { filter: brightness(1.12); } }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--rule-strong); font-weight: 400; }
  @media (hover: hover) and (pointer: fine) { .btn.ghost:hover { border-color: var(--accent); color: var(--accent); filter: none; } }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: .35; cursor: default; filter: none; }
  /* 一番よく押す「次の問題」を横幅いっぱいに、その下に「前の問題」「ホーム」を半分ずつ */
  .qnav { margin-top: 1rem; }
  .navrow { display: grid; gap: .5rem; }
  .navrow.one { grid-template-columns: 1fr; margin-bottom: .5rem; }
  .navrow.two { grid-template-columns: 1fr 1fr; }
  .qnav .btn { padding: .6rem .5rem; white-space: nowrap; text-align: center; }
  .hintkey { font-size: .74rem; color: var(--ink-3); margin: .55rem 0 0; }
  @media (hover: none) { .hintkey { display: none; } }

  /* result */
  .result h2 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 1.18rem; margin: 0 0 .2rem;
  }
  .big { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--accent); }
  .big small { font-size: 1rem; font-weight: 400; color: var(--ink-3); }
  .judge { font-size: .9rem; color: var(--ink-2); margin: .5rem 0 1.1rem; line-height: 1.7; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
  th, td { padding: .38rem .3rem; border-bottom: 1px solid var(--rule); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  thead th { font-size: .75rem; color: var(--ink-3); font-weight: 600; border-bottom: 1px solid var(--rule-strong); }
  td .mini { display: inline-block; width: 3.2rem; height: 4px; background: var(--rule); vertical-align: middle; margin-left: .4rem; }
  td .mini i { display: block; height: 100%; background: var(--accent); }
  .missed { margin-top: 1.4rem; }
  .missed h3 { font-size: .85rem; margin: 0 0 .5rem; color: var(--ink-3); font-weight: 600; letter-spacing: .03em; }
  .missed ol { margin: 0; padding-left: 1.2rem; font-size: .87rem; color: var(--ink-2); line-height: 1.75; }
  .missed b { color: var(--ink); }

  /* 再開バナー・保存警告 */
  .resume {
    display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap;
    background: var(--accent-soft); border-left: 3px solid var(--accent);
    padding: .6rem .85rem; margin-top: 1rem; font-size: .84rem; color: var(--ink-2);
  }
  .resume b { color: var(--ink); }
  .resume button {
    font: inherit; font-size: .78rem; cursor: pointer; background: none; color: var(--accent);
    border: 0; border-bottom: 1px solid var(--accent); padding: 0 0 1px; margin-left: auto;
  }
  .nostore {
    background: var(--ng-soft); border-left: 3px solid var(--ng);
    padding: .6rem .85rem; margin-top: 1rem; font-size: .82rem; color: var(--ink-2); line-height: 1.7;
  }
  .nostore b { color: var(--ink); }

  /* データ読み込み */
  .datamgr { margin-top: 2rem; padding-top: 1.1rem; border-top: 1px solid var(--rule); }
  .datamgr h3 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 1rem; font-weight: 600; margin: 0 0 .3rem;
  }
  .datamgr p { font-size: .82rem; color: var(--ink-2); margin: 0 0 .8rem; line-height: 1.75; }
  .imp { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .imp input[type=file] { display: none; }
  .impfile {
    font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--paper); border: 1px solid var(--accent);
    border-radius: 2px; padding: .45rem 1.2rem; display: inline-block;
  }
  @media (hover: hover) and (pointer: fine) { .impfile:hover { filter: brightness(1.12); } }
  .impfile.ghost { background: transparent; color: var(--accent); }
  .impfile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .impmsg { font-size: .78rem; }
  .impmsg.ok { color: var(--ok); }
  .impmsg.ng { color: var(--ng); }
  .impitem {
    display: flex; align-items: baseline; gap: .6rem; padding: .5rem 0;
    border-bottom: 1px solid var(--rule); font-size: .86rem;
  }
  .impitem .n2 { color: var(--ink-3); font-size: .78rem; font-variant-numeric: tabular-nums; }
  .impitem button {
    margin-left: auto; font: inherit; font-size: .76rem; cursor: pointer;
    background: none; color: var(--ink-3); border: 0;
    border-bottom: 1px solid var(--rule-strong); padding: 0 0 1px;
  }
  @media (hover: hover) and (pointer: fine) { .impitem button:hover { color: var(--ng); border-bottom-color: var(--ng); } }
  .privacy { font-size: .76rem; color: var(--ink-3); line-height: 1.7; margin-top: .8rem; }

  /* 学習診断 */
  .diag { margin-top: 1.6rem; }
  .diag h3 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 1rem; font-weight: 600; margin: 0 0 .2rem;
    padding-bottom: .4rem; border-bottom: 1.5px solid var(--ink);
  }
  .diag .note2 { font-size: .8rem; color: var(--ink-3); margin: .5rem 0 .8rem; line-height: 1.7; }
  .drow {
    display: grid; grid-template-columns: 1fr 4.6rem 3.4rem; gap: .15rem .7rem;
    padding: .5rem 0; border-bottom: 1px solid var(--rule); align-items: center;
  }
  .drow .dn { font-size: .87rem; font-weight: 600; }
  .drow .dsub { grid-column: 1 / -1; font-size: .72rem; color: var(--ink-3); line-height: 1.55; }
  .drow .dv { font-size: .82rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .drow .dloss { font-size: .95rem; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .drow.p1 .dloss { color: var(--ng); }
  .drow.p2 .dloss { color: var(--amber, #8A6A1F); }
  .drow.p3 .dloss { color: var(--ink-3); font-weight: 400; }
  .rx { background: var(--accent-soft); padding: .9rem 1.1rem; margin-top: 1rem; font-size: .87rem; line-height: 1.8; }
  .rx b { color: var(--ink); }
  .rx ol { margin: .4rem 0 0; padding-left: 1.2rem; }
  .rx li { margin-bottom: .3rem; }
  .exp { margin-top: 1.2rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .exp .msg { font-size: .78rem; color: var(--accent); }

  /* 履歴タブ */
  .hsum {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr));
    gap: .1rem 1rem; margin: 1.1rem 0 .3rem; padding-bottom: .9rem;
    border-bottom: 1px solid var(--rule);
  }
  .hsum div { font-size: .74rem; color: var(--ink-3); }
  .hsum b { display: block; font-size: 1.35rem; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.35; }
  .hsum .warn b { color: var(--ng); }
  .filters { display: flex; gap: .35rem; flex-wrap: wrap; margin: .9rem 0 .2rem; align-items: center; }
  .flt {
    font: inherit; font-size: .78rem; cursor: pointer; background: var(--panel); color: var(--ink-2);
    border: 1px solid var(--rule-strong); border-radius: 999px; padding: .2rem .75rem;
  }
  .flt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 600; }
  @media (hover: hover) and (pointer: fine) { .flt:hover:not([aria-pressed="true"]) { border-color: var(--accent); color: var(--accent); } }
  .flt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hrow {
    display: grid; grid-template-columns: 1fr auto; gap: .1rem .8rem;
    padding: .62rem 0; border-bottom: 1px solid var(--rule); align-items: baseline;
  }
  .hrow .hq { font-size: .87rem; line-height: 1.55; white-space: pre-line; }
  .hrow .hf { font-size: .7rem; color: var(--accent); letter-spacing: .03em; }
  .hrow .hn { font-size: .8rem; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .hrow .hn b { color: var(--ink); }
  .hbar { display: block; width: 3.6rem; height: 4px; background: var(--rule); margin-top: .28rem; margin-left: auto; }
  .hbar i { display: block; height: 100%; background: var(--accent); }
  .hbar.bad i { background: var(--ng); }
  .hrow.miss .hq::before {
    content: "✕"; color: var(--ng); font-weight: 700; font-size: .78rem; margin-right: .35rem;
  }
  .hrow.none .hq { color: var(--ink-3); }
  .empty { font-size: .87rem; color: var(--ink-3); padding: 1.6rem 0; text-align: center; }
  .hact { margin: 1.2rem 0 .4rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

  /* 履歴・フラグ */
  .hist { font-size: .72rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .flagmark {
    display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .04em;
    color: var(--ng); background: var(--ng-soft); border: 1px solid var(--ng);
    padding: 0 .4rem; border-radius: 2px; margin-left: .45rem; vertical-align: 1px;
  }
  .qmeta { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .set.weak[aria-pressed="false"] { border-color: var(--ng); color: var(--ng); }
  .set.weak[aria-pressed="true"] { background: var(--ng); border-color: var(--ng); color: var(--paper); }
  .set:disabled { opacity: .4; cursor: default; }
  .set.bm[aria-pressed="false"]:not(:disabled) { border-color: var(--accent); color: var(--accent); }

  /* ブックマーク・メモ */
  .qtools { margin-left: auto; display: flex; gap: .35rem; }
  .qtool {
    font: inherit; font-size: .74rem; line-height: 1.6; cursor: pointer;
    background: var(--panel); color: var(--ink-3);
    border: 1px solid var(--rule-strong); border-radius: 999px; padding: .12rem .65rem; white-space: nowrap;
  }
  @media (hover: hover) and (pointer: fine) { .qtool:hover { border-color: var(--accent); color: var(--accent); } }
  .qtool[aria-pressed="true"], .qtool.has { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .qtool:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .memo { margin-top: 1rem; padding-top: .8rem; border-top: 1px dashed var(--rule-strong); }
  .memo[hidden] { display: none; }
  .memo label { display: block; font-size: .74rem; color: var(--ink-3); margin-bottom: .3rem; }
  .memo textarea {
    display: block; width: 100%; min-height: 4.6rem; resize: vertical;
    font: inherit; font-size: 16px; line-height: 1.6; color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule-strong); border-radius: 2px; padding: .5rem .6rem;
  }
  .memo textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .memo .saved { font-size: .72rem; color: var(--ink-3); margin-top: .25rem; min-height: 1.2em; }
  .hrow .bmk { color: var(--accent); margin-right: .3rem; }
  .hrow .hmemo {
    grid-column: 1 / -1; margin-top: .35rem; padding: .35rem .6rem;
    font-size: .8rem; line-height: 1.6; color: var(--ink-2); background: var(--accent-soft);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .reset {
    font: inherit; font-size: .76rem; cursor: pointer; background: none;
    color: var(--ink-3); border: 0; border-bottom: 1px solid var(--rule-strong); padding: 0 0 1px;
  }
  @media (hover: hover) and (pointer: fine) { .reset:hover { color: var(--ng); border-bottom-color: var(--ng); } }
  .lifetime {
    margin-top: 1.2rem; padding-top: .9rem; border-top: 1px solid var(--rule);
    display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap;
    font-size: .82rem; color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  .lifetime b { color: var(--ink); }
  .lifetime .reset { margin-left: auto; }

  /* set switch */
  .sets { display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; margin: 1rem 0 0; }
  .set {
    font: inherit; font-size: .78rem; cursor: pointer;
    background: var(--panel); color: var(--ink-2);
    border: 1px solid var(--rule-strong); border-radius: 999px; padding: .22rem .8rem;
  }
  @media (hover: hover) and (pointer: fine) { .set:hover { border-color: var(--accent); color: var(--accent); } }
  .set[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 600; }
  .set:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 出題数 */
  .limits { display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; margin-top: .5rem; }
  .limits .lab { font-size: .74rem; color: var(--ink-3); margin-right: .1rem; }
  .lim {
    font: inherit; font-size: .76rem; cursor: pointer;
    background: var(--panel); color: var(--ink-2);
    border: 1px solid var(--rule); border-radius: 2px; padding: .18rem .6rem;
  }
  .lim[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; background: var(--accent-soft); }
  @media (hover: hover) and (pointer: fine) { .lim:hover:not([aria-pressed="true"]) { border-color: var(--rule-strong); } }
  .lim:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pickinfo { font-size: .74rem; color: var(--ink-3); margin-left: .2rem; }
  .unvwrap {
    display: flex; align-items: center; gap: .4rem; margin-top: .55rem;
    font-size: .78rem; color: var(--ink-2); cursor: pointer;
  }
  .unvwrap input { width: 1rem; height: 1rem; accent-color: var(--ng); cursor: pointer; margin: 0; }
  .unvwrap .cnt2 { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .unvnote {
    background: var(--accent-soft); padding: .5rem .75rem; margin-top: .5rem;
    font-size: .76rem; color: var(--ink-2); line-height: 1.65;
  }
  .unvnote.on { background: var(--ng-soft); }

  /* tabs */
  .tabs {
    display: flex; gap: .3rem; border-bottom: 1px solid var(--rule); margin: 1.1rem 0 0;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; white-space: nowrap;
    font: inherit; font-size: .87rem; cursor: pointer; background: none; color: var(--ink-3);
    border: 0; border-bottom: 2px solid transparent; padding: .45rem .65rem; margin-bottom: -1px;
  }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pane[hidden] { display: none; }

  /* 頻出テーマ */
  .lede { font-size: .88rem; color: var(--ink-2); margin: 1.1rem 0 .3rem; line-height: 1.75; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: .9rem; }
  .segh { font-size: .95rem; margin: 1.1rem 0 .4rem; }
  .seg { width: 100%; border-collapse: collapse; font-size: .84rem; font-variant-numeric: tabular-nums; }
  .seg th, .seg td { padding: .38rem .25rem; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
  .seg th { font-size: .72rem; color: var(--ink-3); font-weight: 400; }
  .seg td:first-child { text-align: left; white-space: normal; padding-left: 1rem; }
  .seg tr.gh td { font-weight: 700; background: var(--accent-soft); }
  .seg tr.gh td:first-child { padding-left: .4rem; }
  .seg .rate.good { color: var(--ok); font-weight: 700; }
  .seg .rate.bad { color: var(--ng); font-weight: 700; }
  .segbar { display: block; height: 3px; background: var(--rule); margin-top: .2rem; }
  .segbar i { display: block; height: 100%; background: var(--accent); }
  .segf { margin: .3rem 0 .2rem; }
  .segf summary { font-size: .86rem; font-weight: 700; padding: .45rem 0; cursor: pointer; color: var(--accent); }
  .segrun { font: inherit; font-size: .74rem; padding: .2rem .55rem; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; cursor: pointer; }
  .segsum { font-weight: 400; color: var(--ink-3); font-size: .78rem; }
  .hlist { margin: 1rem 0; border-top: 1px solid var(--rule); }
  .hlist > summary { font-size: .9rem; font-weight: 700; padding: .7rem 0; cursor: pointer; color: var(--accent); }
  .segnote { font-size: .74rem; color: var(--ink-3); margin: .4rem 0 .8rem; line-height: 1.6; }
  .stats { width: 100%; min-width: 23rem; border-collapse: collapse; font-size: .82rem; font-variant-numeric: tabular-nums; }
  .stats th, .stats td { padding: .35rem .3rem; white-space: nowrap; border-bottom: 1px solid var(--rule); text-align: right; }
  .stats th:first-child, .stats td:first-child { text-align: left; white-space: normal; min-width: 11rem; }
  .stats thead th { font-size: .74rem; color: var(--ink-3); border-bottom: 1px solid var(--rule-strong); }
  .stats .nm { font-weight: 600; }
  .stats .sb { display: block; font-weight: 400; font-size: .74rem; color: var(--ink-3); line-height: 1.5; }
  .stats tr.hi td { background: var(--accent-soft); }
  .topic {
    border-top: 1px solid var(--rule); padding: .8rem 0;
    display: grid; grid-template-columns: 2.3rem 1fr; gap: .1rem .7rem;
  }
  .topic .cnt {
    grid-row: span 3; font-variant-numeric: tabular-nums;
    font-size: 1.25rem; font-weight: 700; color: var(--accent); text-align: center; line-height: 1.5;
  }
  .topic .cnt small { display: block; font-size: .62rem; font-weight: 400; color: var(--ink-3); letter-spacing: .06em; }
  .topic .ti { font-weight: 600; font-size: .95rem; line-height: 1.5; }
  .topic .meta { font-size: .74rem; color: var(--ink-3); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .topic .meta .f { color: var(--accent); }
  .topic .flag { color: var(--ng); font-weight: 700; }
  .topic .nt { font-size: .84rem; color: var(--ink-2); line-height: 1.72; margin-top: .18rem; }
  .foot { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .76rem; color: var(--ink-3); line-height: 1.8; }
  .foot a { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ===== スマホアプリ風のレイアウト ===== */
  .unvwrap[hidden], .unvnote[hidden] { display: none !important; }
  .wrap { padding-bottom: calc(5.6rem + env(safe-area-inset-bottom)); }
  header { margin-bottom: .6rem; }
  header .eyebrow { display: none; }
  header h1 { font-size: 1.02rem; margin: 0; letter-spacing: .02em; }
  header .intro { display: none; }

  /* 下部ナビ（タブを画面下に固定） */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; margin: 0; gap: 0;
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 0;
    /* iOSのホーム画面版で、解説が開いて画面の長さが変わると、すりガラス（backdrop-filter）付きの固定ナビが
       画面の途中に取り残される（2026-11-08 実機で発生）。不透明の背景にし、独立したレイヤーで描かせる */
    background: var(--panel);
    -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0);
    border-top: 1px solid var(--rule); padding: .35rem .3rem calc(.35rem + env(safe-area-inset-bottom));
  }
  .tab {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: .1rem;
    padding: .25rem 0; border: 0; margin: 0; font-size: .68rem; color: var(--ink-3);
    text-decoration: none; background: none; line-height: 1.3;
  }
  .tab svg { width: 24px; height: 24px; }
  .tab[aria-selected="true"] { color: var(--accent); border: 0; font-weight: 700; }
  .navbadge {
    position: absolute; top: .05rem; left: calc(50% + 6px); min-width: 1.2rem; padding: 0 .3rem;
    border-radius: 999px; background: var(--ng); color: #fff; font-size: .64rem; font-style: normal;
    font-weight: 700; line-height: 1.5; text-align: center; font-variant-numeric: tabular-nums;
  }
  .navbadge[hidden] { display: none; }

  /* ホームと問題を解く画面の切り替え */
  body:not(.home-mode) #setsHead, body:not(.home-mode) .sets, body:not(.home-mode) .limits,
  body:not(.home-mode) .unvwrap, body:not(.home-mode) .unvnote, body:not(.home-mode) #homeBottom,
  body:not(.home-mode) .countdown, body:not(.home-mode) .ver { display: none !important; }
  .ver { margin: .4rem .2rem 0; font-size: .7rem; color: var(--ink-3); }
  body.home-mode #pane-quiz:not([hidden]) { display: flex; flex-direction: column; }
  body.home-mode #stage { order: 1; }
  body.home-mode #setsHead { order: 2; }
  body.home-mode .sets { order: 3; }
  body.home-mode .limits { order: 4; }
  body.home-mode .unvwrap { order: 5; }
  body.home-mode .unvnote { order: 6; }
  body.home-mode #homeBottom { order: 7; }
  body.home-mode #autoBtn { display: none; }

  /* 本番までの日数（ヒーロー） */
  .countdown {
    margin: .7rem 0 0; padding: .9rem 1rem; border-radius: 16px; background: var(--panel);
    border: 1px solid var(--rule); font-size: .8rem; color: var(--ink-3); line-height: 1.5;
  }
  .countdown b { font-size: 2.1rem; color: var(--ink); font-weight: 800; letter-spacing: -.02em; margin: 0 .15rem; }
  .countdown .cd2 { display: block; margin-top: .15rem; }
  .countdown-row { display: flex; align-items: center; justify-content: space-between; gap: .5rem .6rem; flex-wrap: wrap; }
  .countdown-text { flex: 1 1 220px; min-width: 0; }
  .countdown-text .cd-days { white-space: nowrap; }
  .examEditBtn {
    display: inline-flex; align-items: center; gap: .3rem; flex-shrink: 0; min-height: 44px; margin-left: auto;
    font: inherit; font-size: .78rem; font-weight: 600; cursor: pointer;
    background: transparent; color: var(--ink-2); border: 1px solid var(--rule-strong);
    border-radius: 999px; padding: .4rem .85rem;
  }
  @media (hover: hover) and (pointer: fine) { .examEditBtn:hover { border-color: var(--accent); color: var(--accent); } }
  .examEditBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .examEditBtn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .examEdit {
    display: flex; flex-wrap: wrap; align-items: center; gap: .5rem;
    margin-top: .8rem; padding-top: .8rem; border-top: 1px solid var(--rule);
  }
  .examEdit[hidden] { display: none; }
  .examEdit input[type="date"] {
    font: inherit; font-size: .85rem; color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule-strong); border-radius: 2px; padding: .4rem .6rem; min-height: 44px;
  }
  .examEdit .btn { padding: .5rem 1rem; min-height: 44px; }

  /* ホームのカード共通 */
  body.home-mode .homecard { border-radius: 16px; border: 1px solid var(--rule); padding: 1rem; margin-top: .8rem; background: var(--panel); }
  body.home-mode #stage > .homecard { background: none; border: 0; padding: 0; box-shadow: none; }
  .homecard .hlead { display: none; }

  /* おまかせ出題（主役カード） */
  .homecard .auto.hero {
    margin: 0; padding: 1.1rem 1rem 1rem; border: 0; border-radius: 16px; color: #fff;
    background: linear-gradient(135deg, #0E5049, #2C7C72);
  }
  .auto.hero h3 { color: #fff; font-family: inherit; font-size: .95rem; font-weight: 700; margin: 0; opacity: .92; }
  .auto.hero .due { margin: .35rem 0 .1rem; font-size: .82rem; opacity: .9; }
  .auto.hero .due b { font-size: 2.4rem; font-weight: 800; line-height: 1.1; margin-right: .15rem; font-variant-numeric: tabular-nums; }
  .auto.hero .auto-n { color: #fff; margin-top: .6rem; }
  .auto.hero .auto-n output { color: #fff; }
  .auto.hero #autoN { accent-color: #fff; }
  .auto.hero .auto-scale { color: rgba(255,255,255,.75); }
  .auto.hero .btn.wide {
    margin-top: .8rem; background: #fff; color: #0E5049; border-color: #fff; border-radius: 12px;
    text-align: center; font-size: 1.05rem; font-weight: 800; padding: .8rem 1rem;
  }
  .auto.hero details { margin-top: .7rem; font-size: .78rem; opacity: .92; }
  .auto.hero summary { cursor: pointer; }
  .auto.hero details p { margin: .35rem 0 0; line-height: 1.7; }
  .auto.hero .mastery { color: rgba(255,255,255,.85); }
  .auto.hero .mastery b { color: #fff; }

  /* 続きから */
  .homecard .btn.wide#cont { border-radius: 12px; margin-top: .8rem; }

  /* 数字のタイル（2×2） */
  .agrps { display: flex; gap: .35rem; margin: .1rem 0 .5rem; flex-wrap: wrap; }
  .agrp { font: inherit; font-size: .8rem; padding: .3rem .8rem; border-radius: 999px; border: 1px solid rgba(255,255,255,.45); background: transparent; color: inherit; cursor: pointer; }
  .agrp[aria-pressed="true"] { background: #fff; color: #0E5049; border-color: #fff; font-weight: 700; }
  .asrcs { margin-top: -.15rem; }
  .asrc { font: inherit; font-size: .75rem; padding: .2rem .7rem; border-radius: 6px; border: 1px solid rgba(255,255,255,.35); background: transparent; color: inherit; cursor: pointer; }
  .asrc[aria-pressed="true"] { background: rgba(255,255,255,.22); border-color: #fff; font-weight: 700; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; margin-top: .8rem; }
  .tile {
    font: inherit; text-align: left; border: 1px solid var(--rule); border-radius: 14px; background: var(--paper);
    padding: .7rem .8rem; color: var(--ink-3); font-size: .74rem; line-height: 1.4;
  }
  .tile b { display: block; color: var(--ink); font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: .15rem; }
  .tile b small { font-size: .75rem; font-weight: 600; color: var(--ink-3); margin-left: .15rem; }
  button.tile { cursor: pointer; }
  button.tile:disabled { cursor: default; opacity: .55; }
  .tile.warn b { color: var(--ng); }

  /* 分野のタイル */
  .home-h { font-size: .95rem; font-weight: 700; margin: 1.3rem .1rem .55rem; font-family: inherit; }
  body.home-mode .sets { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; margin: 0; }
  .set.offgrp { display: none !important; }
  .grptabs { grid-column: 1 / -1; flex-basis: 100%; display: flex; gap: .3rem; padding: .25rem; border-radius: 12px; background: var(--panel); border: 1px solid var(--rule); }
  .grp { flex: 1; border: 0; border-radius: 9px; padding: .55rem 0; font: inherit; font-size: .9rem; font-weight: 700; background: transparent; color: var(--ink-2); cursor: pointer; }
  .grp[aria-selected="true"] { background: var(--accent); color: var(--paper); }
  body.home-mode .set {
    border-radius: 14px; padding: .8rem .8rem; text-align: left; font-size: .86rem; font-weight: 600;
    background: var(--panel); border: 1px solid var(--rule); color: var(--ink); min-height: 3.2rem;
  }
  body.home-mode .set[aria-pressed="true"] { background: var(--panel); color: var(--ink); border-color: var(--rule); }
  body.home-mode .set.weak:not(:disabled) { color: var(--ng); border-color: color-mix(in srgb, var(--ng) 45%, var(--rule)); }
  body.home-mode .set.freq { color: var(--accent); font-weight: 700; }
  body.home-mode .set.bm:not(:disabled) { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
  body.home-mode .limits { margin: .7rem .1rem 0; }
  body.home-mode .lim { border-radius: 999px; }

  /* 道のり（たたむ） */
  #homeBottom .homecard { margin-top: 1.1rem; }
  #homeBottom .roadmap { margin: 0; padding: 0; border: 0; }
  #homeBottom .roadmap details { margin-top: .5rem; }

/* 自動生成（tools/flash_to_js.py）。元＝career-master/research/gijutsushi-cards/flash/flash.json */
const NJ_PLAN_DATA = [{"f": "二次:計画", "q": "【第六次環境基本計画｜時期】第六次環境基本計画が閣議決定されたのはいつ（何年何月）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2024年5月（5月21日）。第五次ではなくこの第六次が最新版である<br><br><b>答案での使い方</b>　書き出しで最新版を明示する。第五次(R2題材)と取り違えない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223504.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜目標】第六次環境基本計画が掲げる2030年度の温室効果ガス削減目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2013年度比46%削減（さらに50%の高みに向け挑戦を続ける）<br><br><b>答案での使い方</b>　必須Ⅰ(1) 課題の大きさの根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223504.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜目標】第六次環境基本計画が掲げる30by30目標とは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2030年までに陸と海の30%以上を保全する目標。ネイチャーポジティブ実現の手段<br><br><b>答案での使い方</b>　必須Ⅰ(2) 生物多様性の解決策の到達点に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223504.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜目標】世界の年平均気温は産業革命前より何℃上昇した（2023年）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　1.45℃上昇（2023年）。気候危機の背景として示されている<br><br><b>答案での使い方</b>　必須Ⅰ(1) 冒頭で課題の背景を示す数字に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223504.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜柱】「環境・経済・社会の統合的向上」を実践する場と位置づけられた重点戦略は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　地域づくり。地域循環共生圏で地域脱炭素とネイチャーポジティブを同時に解決する<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の方向を国の言葉で言うときに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜柱】「新たな成長」を導く重点戦略の中身は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　持続可能な生産と消費を実現するグリーンな経済システム。自然資本への投資拡大と環境価値の内部化<br><br><b>答案での使い方</b>　必須Ⅰ(2) 経済面の解決策の方向づけに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜課題】第六次環境基本計画を根拠に、自然資本投資の課題を『制度・政策』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　環境価値を市場価値に内部化するため、成長志向型CP構想の実行と税制のグリーン化を、競争力を損なわず設計する必要がある<br><br><b>答案での使い方</b>　必須Ⅰ(1) 制度・政策の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜課題】自然資本投資の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　サステナブルファイナンスと地域金融のESG化による資金動員が不可欠だが、評価指標が未成熟で資金が循環しにくい<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜課題】計画の実践・実装の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　環境人材の育成や公正な移行への人的資本投資、地域循環共生圏を支える中間支援組織の担い手不足が制約になっている<br><br><b>答案での使い方</b>　必須Ⅰ(1) 人材・担い手の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜解決策】地域ごとに異なる課題への解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　地域循環共生圏の形成で、地域の自然資本を活かし近隣と資源を補完し合う自立・分散型の地域づくりを進める<br><br><b>答案での使い方</b>　必須Ⅰ(2) 地域系の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜解決策】環境価値の内部化に向けた解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　成長志向型カーボンプライシング構想で、先行投資を促しつつ炭素価格負担を段階的に導入し、脱炭素と競争力を両立する<br><br><b>答案での使い方</b>　必須Ⅰ(2) 制度面の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜リスク】30by30を急ぐ地域共生型再エネ拡大で生じるリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　リスク：景観・生態系への新たな環境負荷。対策：洋上・陸上風力の環境配慮の制度検討を計画の初期段階から組み込む<br><br><b>答案での使い方</b>　必須Ⅰ(3) 脱炭素と自然共生のトレードオフに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜注意】2035年度60%・2040年度73%削減は第六次環境基本計画の数字か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　違う。地球温暖化対策計画（2025年2月）の数字。第六次が明記するのは2030年度46%とCN2050<br><br><b>答案での使い方</b>　両計画の数字を混同すると減点。書き分ける<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223504.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜時期】地球温暖化対策計画（現行）が閣議決定されたのはいつ（何年何月）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2025年2月（2021年10月の前計画を改定）。2035・2040年度目標はこの改定で新設<br><br><b>答案での使い方</b>　書き出しで最新版を明示。旧計画(2030年度のみ)と区別<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜目標】地球温暖化対策計画の2030・2035・2040年度の削減目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2013年度比で2030年度46%（7.6億t）、2035年度60%（5.7億t）、2040年度73%（3.8億t）<br><br><b>答案での使い方</b>　必須Ⅰ(1) 課題の大きさと(2)の到達点の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜目標】2024年度の温室効果ガス排出・吸収量は何億t（2013年度比）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　9.94億t（2013年度比28.7%減）。初めて10億tを下回った（2026年4月発表）<br><br><b>答案での使い方</b>　必須Ⅰ(1) 現状と2030年度目標7.6億tとの差を示す<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜目標】家庭部門のエネルギー起源CO2の2030年度目安は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　71百万t（2013年度209百万tから66%減）<br><br><b>答案での使い方</b>　R8 Ⅰ-2の題材。全体目標46%と取り違えない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜柱】地球温暖化対策計画の4本の柱は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　エネルギー転換／産業・業務・運輸等／地域・くらし／横断的取組<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の分野を国の分類で言う<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜柱】横断的取組に位置づく施策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　成長志向型カーボンプライシング、循環経済移行、吸収源確保、国際貢献<br><br><b>答案での使い方</b>　必須Ⅰ(2) 横断的な解決策を挙げるときに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜課題】温暖化対策計画を根拠に、脱炭素化が難しい分野の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　水素・アンモニア・CCUS等による火力の脱炭素化や、航空・海運の次世代燃料の実用化に技術的ブレイクスルーが必要<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜課題】脱炭素先行地域100以上の創出の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　計画策定・実施を担う自治体職員や事業者側の体制・人材の確保が課題<br><br><b>答案での使い方</b>　必須Ⅰ(1) 人材・担い手の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜課題】2030年度目標とネットゼロを結ぶ道筋の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　中長期の予見可能性を高め、GX投資を加速する資金動員が課題<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜解決策】火力発電の脱炭素化の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　水素・アンモニア混焼やCCUSで火力を脱炭素化し、非効率石炭火力は計画的にフェードアウトする<br><br><b>答案での使い方</b>　必須Ⅰ(2) エネルギー転換の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜解決策】地域の脱炭素化の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　脱炭素先行地域を2030年度までに100以上創出し、民生部門の電力CO2実質ゼロのモデルを全国へ広げる<br><br><b>答案での使い方</b>　必須Ⅰ(2) 地域・くらしの解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜リスク】石炭火力のフェードアウトを急ぐリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　リスク：代替電源の整備が追いつかず需給バランスに影響。対策：LNG火力を移行手段に使い、再エネ・原子力の最大活用を並行する<br><br><b>答案での使い方</b>　必須Ⅰ(3) エネルギー転換のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜注意】2035・2040年度の部門別CO2数値は確定値か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　確定値ではない。複数シナリオ分析に基づく幅のある「目安」<br><br><b>答案での使い方</b>　答案で確定値のように書くと減点。「目安」と書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜時期】GX2040ビジョンと第7次エネルギー基本計画の閣議決定はいつ？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　いずれも2025年2月18日。別の文書で、GX2040は2023年7月の戦略の改訂版<br><br><b>答案での使い方</b>　書き出しで最新版を明示。2文書を混ぜない<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜時期】排出量取引制度が本格稼働（義務化）する年度は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2026年度。2023年度開始の自主参加型GXリーグとは別<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰで「義務化済み」と書く根拠に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜目標】2040年度の電源構成（目安）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　再エネ4〜5割程度、火力3〜4割程度、原子力2割程度。2022年度は再エネ21.8%、火力72.6%<br><br><b>答案での使い方</b>　必須Ⅰ(1) 現状との差で課題の大きさを示す<br><br>【出典】<a href=\"https://www.enecho.meti.go.jp/category/others/basic_plan/pdf/20250218_03.pdf\" target=\"_blank\" rel=\"noopener\">資源エネルギー庁（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜目標】GX経済移行債の規模と、呼び込む官民投資の規模は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　10年間で20兆円規模の先行投資支援により、150兆円規模の官民投資を呼び込む<br><br><b>答案での使い方</b>　必須Ⅰ(2) 資金面の解決策の規模感に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜柱】GX2040ビジョンの柱のうち、カーボンプライシングの柱は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　成長志向型カーボンプライシング構想。排出量取引制度の本格稼働と化石燃料賦課金（2028年度）で炭素価格を形成<br><br><b>答案での使い方</b>　必須Ⅰ(2) 制度面の解決策の国の言葉に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜柱】GX2040ビジョンの「GX産業立地」の考え方は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　脱炭素電源を見据えた産業集積の加速と、地域に利益が及ぶ地域GXを進める<br><br><b>答案での使い方</b>　必須Ⅰ・Ⅲ 地域系の解決策の方向づけに<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜課題】再エネ主力電源化（2040年度4〜5割）の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　出力変動を調整する系統整備・蓄電池・次世代革新炉など複数技術の同時確立が必要で、単一技術では対応できない<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜課題】排出量取引制度の義務化の課題を『制度』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　公平性確保のため、業種別の無償割当ルールと価格安定化措置（上限・下限価格）の制度設計が課題<br><br><b>答案での使い方</b>　必須Ⅰ(1) 制度の観点の課題に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜課題】中堅・中小企業のGX対応の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　大企業に比べ支援機関・資金・人材が不足し、排出量の見える化や設備高度化の対応力の差が広がりやすい<br><br><b>答案での使い方</b>　必須Ⅰ(1) 人材・担い手の観点の課題に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜解決策】排出量取引制度による解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　排出枠の無償割当てと取引で炭素価格を形成し、多排出産業の投資と構造転換を促す<br><br><b>答案での使い方</b>　必須Ⅰ(2) 制度面の解決策に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜解決策】再エネ主力電源化の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　S+3Eを前提に、系統整備・蓄電池・次世代革新炉・火力の脱炭素化を並行して進める<br><br><b>答案での使い方</b>　必須Ⅰ(2) エネルギー面の解決策に<br><br>【出典】<a href=\"https://www.enecho.meti.go.jp/category/others/basic_plan/pdf/20250218_03.pdf\" target=\"_blank\" rel=\"noopener\">資源エネルギー庁（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜解決策】データセンター立地等の合意形成の解決策を、専門用語で言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　地域GX（地域裨益型・地域共生型）で、脱炭素電源の利益を地域に還元し、自治体と連携して地方創生につなげる<br><br><b>答案での使い方</b>　必須Ⅰ(2) 地域系の解決策に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜リスク】排出量取引制度の義務化で生じるリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　リスク：多排出産業の競争力低下と海外移転（カーボンリーケージ）。対策：政府指針による業種配慮の無償割当てと移行期の投資余力確保<br><br><b>答案での使い方</b>　必須Ⅰ(3) 制度導入のリスクと対策に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜注意】2035年度60%・2040年度73%削減と、R8 Ⅰ-2の家庭部門66%の違いは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　60%・73%は全体（2013年度比）、66%は家庭部門（2030年度）。母集団が違う<br><br><b>答案での使い方</b>　数字は母集団とセットで書く。取り違えは減点<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜時期】気候変動適応計画の閣議決定と一部変更はいつ（何年何月）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2021年10月に閣議決定、2023年5月に一部変更。一部変更で熱中症対策実行計画が第4章に追加<br><br><b>答案での使い方</b>　書き出しで版を明示。熱中症対策は第4章の内容として書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜時期】気候変動適応計画の次の改定の見通しは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2026年2月の第3次影響評価報告書を受け、2026年度内に改定予定。骨子は2026年6月<br><br><b>答案での使い方</b>　書き出しで「改定予定」と書き、旧版との取り違えを避ける<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜目標】熱中症対策実行計画の中期目標（2030年）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　熱中症死亡者数（5年移動平均）を、令和4年概数の1,295名から半減<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の到達点の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000136709.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜目標】熱中症死亡者数の実績は目標の基準値と比べてどうか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和5年1,651人、令和6年2,160人と、基準値1,295名を大きく上回り増加（人口動態統計確定数）<br><br><b>答案での使い方</b>　必須Ⅰ(1) 課題の大きさを示す数字に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000136709.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜柱】適応計画の7つの基本戦略は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　施策への組み込み、科学的知見、情報基盤、地域推進、事業者等の促進、国際貢献、関係機関連携<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の方向を国の言葉で言う<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜柱】適応計画で「地域の実情に応じた適応」を進める仕組みは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　地域気候変動適応計画と地域適応センター。国立環境研究所が情報基盤A-PLATで支援<br><br><b>答案での使い方</b>　必須Ⅰ・Ⅱ-2 地域施策の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜課題】地域の適応推進の課題を『制度・政策』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　地域適応計画の策定が努力義務にとどまるため、地域適応センターの設置を含む制度的な推進力の確保が課題<br><br><b>答案での使い方</b>　必須Ⅰ(1) 制度・政策の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜課題】適応策の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　事業者の気候リスク対応投資を促し、適応ビジネスをどう資金面で後押しするかが課題<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜課題】適応策の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　農業の高温耐性品種の開発・普及と、流域治水やグリーンインフラによるハード・ソフト一体の防災技術の高度化が課題<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜解決策】水害リスクの解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　流域治水で、河川整備に加え流域全体の関係者が協働し、ハード・ソフト一体で水害リスクを下げる<br><br><b>答案での使い方</b>　必須Ⅰ(2) 自然災害分野の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜解決策】熱中症の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　熱中症警戒情報・特別警戒情報（WBGT基準）の発表と、指定暑熱避難施設の開放で、高齢者等の被害を防ぐ<br><br><b>答案での使い方</b>　必須Ⅰ(2) 健康分野の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000136709.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜リスク】流域治水の大規模投資で生じるリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　リスク：財政負担の拡大と生態系の分断など新たな環境影響。対策：グリーンインフラやNbSを組み合わせ環境配慮型の整備を優先する<br><br><b>答案での使い方</b>　必須Ⅰ(3) ハード整備のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜リスク】地域適応計画が努力義務であることで生じるリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　リスク：小規模市町村で策定が進まず地域間の適応力が開く。対策：広域協議会を通じ都道府県が市町村を技術的・財政的に支援<br><br><b>答案での使い方</b>　必須Ⅰ(3)・Ⅱ-2 自治体支援の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜注意】適応計画の「7分野」と「7つの基本戦略」は同じか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　別物。7分野は農林水産業・水環境・自然生態系・自然災害・健康・産業経済・国民生活の分野別施策<br><br><b>答案での使い方</b>　どちらも7個。分野を問う設問に戦略を書くと減点<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜時期】生物多様性国家戦略2023-2030が閣議決定されたのはいつ（何年何月）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2023年3月（31日）。第六次環境基本計画（2024年5月）とは別の計画<br><br><b>答案での使い方</b>　書き出しで版を明示。R6・R8 Ⅰ-1で出題<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜目標】30by30は国家戦略のどの目標に位置づく？その内容は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　行動目標1-1。2030年までに陸と海の30%以上を保護地域・OECMで保全<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の到達点に。戦略そのものではない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜目標】中間評価（2026年2月）の保護地域・OECM占有率は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　陸域21.0%（2025年時点）、海域13.3%（2021年以降変化なし）。目標は各30%<br><br><b>答案での使い方</b>　必須Ⅰ(1) 目標との差で課題の大きさを示す<br><br>【出典】<a href=\"https://www.env.go.jp/content/000379260.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜柱】国家戦略の基本戦略1〜3は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　①生態系の健全性の回復、②自然を活用した社会課題の解決、③ネイチャーポジティブ経済の実現<br><br><b>答案での使い方</b>　R6 Ⅰ-1の3戦略。解決策の方向を国の言葉で言う<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜柱】基本戦略4と5は？また目標の構成数は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　4：生活・消費活動での価値の認識と行動、5：基盤整備と国際連携。5基本戦略・15状態目標・25行動目標<br><br><b>答案での使い方</b>　3戦略は全体の一部。設問の範囲を確認する<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜課題】30by30達成の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　OECMとして整理できる区域を見極める評価手法が未確立で、自然共生サイトの認定基準・モニタリング手法の標準化が課題<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜課題】ネイチャーポジティブ経営の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　自然資本の損失の外部不経済を価格に反映する経済的手法が実証段階にとどまり、民間資金の誘導が不十分<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜課題】里山・森林の保全の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　森林・農地・里山の管理の担い手が不足し、担い手の確保・育成と地域主体の取組を支えるインセンティブ設計が必要<br><br><b>答案での使い方</b>　必須Ⅰ(1) 人材・担い手の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜解決策】民間の取組を生かす30by30の解決策を、専門用語で言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　自然共生サイト（日本版OECM）で、民間等が保全する区域を国が認定し、国際データベースに登録する<br><br><b>答案での使い方</b>　必須Ⅰ(2) 30by30の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜解決策】企業の自然資本対応の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　TNFDによる自然関連リスク・機会の情報開示を促し、ESG金融と結び付けてネイチャーポジティブ経済へ移行する<br><br><b>答案での使い方</b>　必須Ⅰ(2) 経済面の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜解決策】社会課題と自然保全を両立する解決策を、専門用語で言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　グリーンインフラや生態系ネットワークで、防災・気候変動対応と生物の移動・遺伝的多様性の維持を両立する<br><br><b>答案での使い方</b>　必須Ⅰ(2) 自然活用の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜リスク】30by30を急ぐリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　リスク：住民のなりわいとの調整不足で反発を招く。対策：自然共生サイト認定や保護地域拡張時に事前協議プロセスを制度化する<br><br><b>答案での使い方</b>　必須Ⅰ(3) 合意形成のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜リスク】不適正な再エネ導入がもたらすリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　リスク：生態系への悪影響で脱炭素と保全がトレードオフに。対策：環境影響評価とゾーニング、地域共生型再エネの導入<br><br><b>答案での使い方</b>　必須Ⅰ(3) 再エネとの両立のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜注意】OECMと自然共生サイトの違いは？また30by30は戦略の別名か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　OECMは国際的な保全区分、自然共生サイトは国が認定する日本版。30by30は目標の一つで戦略の別名ではない<br><br><b>答案での使い方</b>　定義の書き分けで減点を避ける<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜時期】第五次循環型社会形成推進基本計画が閣議決定されたのはいつ（何年何月）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2024年8月（2日）。副題は「循環経済を国家戦略に」<br><br><b>答案での使い方</b>　書き出しで最新版を明示。第四次と取り違えない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜目標】2030年度の資源生産性・資源消費量・最終処分量の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　資源生産性約60万円/t、一人当たり天然資源消費量約11t/人・年、最終処分量約1,100万t/年<br><br><b>答案での使い方</b>　必須Ⅰ(1)(2) 現状との差と到達点の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜目標】2030年度の循環利用率と再生資源の投入割合の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　入口側約19%、出口側約44%。再生可能資源・循環資源の投入割合は約34%<br><br><b>答案での使い方</b>　入口と出口の数字を取り違えない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜目標】循環経済関連ビジネスの市場規模目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2030年までに80兆円以上、2050年に120兆円（2020年は約50兆円）<br><br><b>答案での使い方</b>　必須Ⅰ(2) 経済面の解決策の到達点に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜柱】第五次循環基本計画の5つの重点分野は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　①循環経済への移行②事業者間連携③地域の循環システム④基盤強靱化⑤国際資源循環<br><br><b>答案での使い方</b>　R7 Ⅰ-2は②③⑤の3つ。解決策の方向を国の言葉で<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜柱】動静脈連携とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　製造・小売の動脈産業と廃棄物処理・リサイクルの静脈産業が連携し、再生材利用の拡大と市場創出を図る取組<br><br><b>答案での使い方</b>　必須Ⅰ(2) 事業者間連携の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜課題】動静脈連携の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　再生材の品質の共通認識づくりと、デジタル製品パスポート対応のデータベースなど、循環性を計測・開示する技術基盤が未整備<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜課題】資源循環の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　人口減少で廃棄物処理・資源循環のエッセンシャルワーカーが不足し、中小企業が大半の処理業者への影響が大きい<br><br><b>答案での使い方</b>　必須Ⅰ(1) 人材・担い手の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜課題】市場規模80兆円の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　短期的には経済合理的でない動静脈連携への投資を、GX投資等で後押しする資金誘導が必要<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜解決策】再生材の利用拡大の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　動静脈連携で再生材利用を広げ、デジタル製品パスポート（DPP）で原材料・リサイクル性の情報を開示する<br><br><b>答案での使い方</b>　必須Ⅰ(2) 技術・制度面の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜解決策】地域の循環の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　地域の資源の地産地消・循環を進め、製造業・処理業と自治体・市民が連携する地域の循環システムで地方創生につなげる<br><br><b>答案での使い方</b>　必須Ⅰ・Ⅱ-2 地域施策の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜リスク】動静脈連携で再生材を急拡大するリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　リスク：品質管理や有害物質管理が不十分なまま流通。対策：製品安全・有害物質のリスク管理・不法投棄防止を伴う適正な取組を求める<br><br><b>答案での使い方</b>　必須Ⅰ(3) 再生材拡大のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜注意】第五次の数値目標の年次と、第四次との違いは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　目標年次は2030年度。第四次は指標が151あったが、第五次は指標数を絞り込んだ<br><br><b>答案での使い方</b>　旧計画の指標数・目標値で答案を書かない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜時期】地域脱炭素ロードマップの決定はいつで、決定主体は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2021年6月9日、国・地方脱炭素実現会議の決定。閣議決定ではない<br><br><b>答案での使い方</b>　R6 Ⅰ-2で出題。書き出しで決定主体を正確に書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜時期】脱炭素先行地域の現在の年限の整理は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2025年度までに少なくとも100か所を選定し、2030年度までに実行<br><br><b>答案での使い方</b>　選定年と実行年を取り違えない。当初は「2030年度までに100か所」<br><br>【出典】<a href=\"https://www.env.go.jp/content/000376957.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜定義】脱炭素先行地域の定義の核は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　民生部門（家庭部門及び業務その他部門）の電力消費に伴うCO2排出の実質ゼロ。運輸・熱利用等は地域特性に応じて実施<br><br><b>答案での使い方</b>　必須Ⅰ・Ⅱ-1 定義を問われたときの書き出しに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000376957.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜目標】脱炭素先行地域の選定状況は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　第7回（2026年2月）までに45道府県133市町村の102提案が選定。3提案が辞退<br><br><b>答案での使い方</b>　必須Ⅰ(1) 目標100か所との差・辞退を課題の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000376957.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜目標】重点対策①自家消費型太陽光の導入目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2030年に設置可能な建築物の約50%、2040年に100%<br><br><b>答案での使い方</b>　必須Ⅰ(2) 太陽光の解決策の到達点に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜柱】ロードマップの8つの重点対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　①自家消費型太陽光②地域共生型再エネ③業務ビルZEB化④住宅省エネ⑤ゼロカーボン・ドライブ⑥資源循環⑦まちづくり⑧農林水産業<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策を国の分類で言う<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜課題】地域脱炭素の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　太陽光自家消費・ZEB・ZEH・電動車を全国に普及させるには、低圧需要での経済性確保と初期投資ゼロの導入モデルの確立が課題<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜課題】地域脱炭素の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　先行地域の計画策定・実施を担う自治体職員や地元企業・金融機関の体制確保が、地域間の取組差を生んでいる<br><br><b>答案での使い方</b>　必須Ⅰ(1)・Ⅱ-2 人材の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜課題】再エネ促進区域設定の課題を『合意形成』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　地域協議会の開催等による合意形成が必要で、環境配慮や地域貢献の要件設定を円滑に進める仕組みが課題<br><br><b>答案での使い方</b>　必須Ⅰ(1) 合意形成・地域の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜解決策】合意形成が進まない課題への解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　促進区域の設定（ポジティブゾーニング）で、環境配慮と地域貢献の要件を付けて適地を事前に示す<br><br><b>答案での使い方</b>　必須Ⅰ(2) 再エネ立地の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜解決策】自治体の取組を後押しする解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　重点対策加速化事業（地域脱炭素移行・再エネ推進交付金）で、重点対策を組み合わせた複数年の計画を5年間支援する<br><br><b>答案での使い方</b>　必須Ⅰ(2)・Ⅱ-2 財政支援の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜リスク】先行地域の選定数を優先して生じるリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　リスク：コスト増や地元合意の難航で辞退が出る。対策：計画段階から地域協議会と要件明確化を徹底し、実行可能性を精査して選定<br><br><b>答案での使い方</b>　必須Ⅰ(3) 目標優先のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜リスク】促進区域の設定を急ぐリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　リスク：合意形成が不十分なまま区域指定が進み、住民と対立。対策：地域協議会で環境保全と地域の経済・社会課題の解決を併せて検討<br><br><b>答案での使い方</b>　必須Ⅰ(3)・Ⅱ-2 合意形成のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜注意】重点対策加速化事業の交付対象は、8つの重点対策のどれか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　①〜⑤のみ。⑥資源循環・⑦まちづくり・⑧農林水産業は対象外<br><br><b>答案での使い方</b>　「重点対策＝すべて交付金対象」と書くと減点<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜時期】令和8年版の環境白書等が閣議決定されたのはいつ？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2026年6月（5日）。環境の日に合わせて公表された、3白書の合冊<br><br><b>答案での使い方</b>　書き出しで最新版を明示。令和7年版と取り違えない<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/index.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜時期】令和8年版白書のテーマは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　循環経済（サーキュラーエコノミー）で日本列島を強く豊かに<br><br><b>答案での使い方</b>　令和7年版（グリーンな経済システム）と取り違えると減点<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜目標】循環経済行動計画が目指す2030年までの投資規模は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　再資源化拠点等の構築・ネットワーク形成に向け、官民で約1兆円<br><br><b>答案での使い方</b>　必須Ⅰ(2) 資金面の解決策の規模感に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜目標】令和8年版白書の保護地域・OECM指定割合（2025年8月）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　陸地約21.0%、海洋約13.3%。目標は2030年までに各30%以上<br><br><b>答案での使い方</b>　必須Ⅰ(1) 目標との差で課題の大きさを示す<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜柱】循環経済行動計画（2026年4月決定）の2つの柱は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　再生資源供給サプライチェーンの強靱化と、日本をハブとする国際資源循環ネットワークの構築<br><br><b>答案での使い方</b>　必須Ⅰ(2) 資源循環の解決策を国の言葉で言う<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜柱】大規模太陽光（メガソーラー）の対策パッケージの考え方は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　不適切事案への法的規制の強化と、地域共生型への支援強化を両立させる<br><br><b>答案での使い方</b>　必須Ⅰ(2)・Ⅲ 再エネ立地の方向づけに<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜課題】重要鉱物・金属の再生資源供給の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　重要鉱物・金属を質・量・コスト面で安定供給するための再資源化・製錬技術の確立が必要で、動脈と静脈をつなぐ技術基盤が不足<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜課題】再資源化拠点の整備の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　官民で約1兆円の投資を目指すが、再生材需要の創出を起点とした自律的な市場形成の設計が課題<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜課題】メガソーラーの課題を『合意形成』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　不適切事案への規制強化と地域共生型への支援を両立させる必要があり、地域住民との合意形成が課題<br><br><b>答案での使い方</b>　必須Ⅰ(1) 合意形成・地域の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜解決策】資源循環の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　再生資源供給サプライチェーンの強靱化で、再資源化拠点を構築・ネットワーク化し、再生材を質・量・コスト面で安定供給する<br><br><b>答案での使い方</b>　必須Ⅰ(2) 資源循環の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜解決策】自然再興の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　自然共生サイトの認定（地域生物多様性増進法、2025年4月施行）で、民間等の保全区域を国が認定し30by30を進める<br><br><b>答案での使い方</b>　必須Ⅰ(2) 生物多様性の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白
