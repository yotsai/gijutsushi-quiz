\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【SSBJ基準と有価証券報告書での開示義務化｜時期】SSBJ基準の有報での義務化はいつからか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　プライム市場の平均時価総額3兆円以上は2027年3月期、1兆円以上は2028年3月期、5,000億円以上は2029年3月期（予定）<br><br><b>解説</b>　開示義務は、時価総額が大きい企業から順に広げる。プライム市場の平均時価総額（過去5事業年度末の平均）で3段階に分け、準備期間を確保する<br><br><b>答案に書くなら</b>　SSBJ基準の義務化は、プライム市場の平均時価総額3兆円以上が2027年3月期、1兆円以上が2028年3月期、5,000億円以上が2029年3月期（予定）である。<br><br><b>関連</b>　5,000億円未満は今後検討。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで段階適用と時期を示す<br><br>【出典】<a href=\"https://www.fsa.go.jp/news/r7/shouken/20260220/20260220.html\" target=\"_blank\" rel=\"noopener\">金融庁を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【SSBJ基準と有価証券報告書での開示義務化｜定義】SSBJ基準とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　日本初のサステナビリティ開示基準。ISSB基準を踏まえ、サステナビリティ基準委員会が2025年3月に公表<br><br><b>解説</b>　有価証券報告書のサステナビリティ記載は、比較可能性と有用性に課題があった。そこで国際基準（ISSB基準）を踏まえ、日本の基準を作った<br><br><b>答案に書くなら</b>　SSBJ基準とは、ISSB基準を踏まえてサステナビリティ基準委員会が2025年3月に公表した、日本初のサステナビリティ開示基準である。<br><br><b>関連</b>　原則としてISSB基準の要求事項をすべて取り入れる。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://www.ssb-j.jp/jp/wp-content/uploads/sites/6/2026_07.pdf\" target=\"_blank\" rel=\"noopener\">SSBJ（サステナビリティ基準委員会）（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【SSBJ基準と有価証券報告書での開示義務化｜制度】SSBJ基準を構成する3つの基準は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　ユニバーサル基準「適用基準」、第1号「一般開示基準」、第2号「気候関連開示基準」<br><br><b>解説</b>　共通のルールを置く適用基準と、全テーマに共通の一般開示基準、気候テーマの基準で構成する。気候関連はその中の1つである<br><br><b>答案に書くなら</b>　SSBJ基準は、ユニバーサル基準の適用基準、テーマ別第1号の一般開示基準、同第2号の気候関連開示基準の3つで構成される。<br><br><b>関連</b>　2025年3月5日に3基準を公表。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。構成を1文で言う<br><br>【出典】<a href=\"https://www.ssb-j.jp/jp/wp-content/uploads/sites/6/2026_07.pdf\" target=\"_blank\" rel=\"noopener\">SSBJ（サステナビリティ基準委員会）（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【SSBJ基準と有価証券報告書での開示義務化｜制度】義務化の経過措置と保証の定めは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　義務化の翌年から第三者保証。最初の2年は訂正報告書での記載（二段階開示）、スコープ3は初年度免除<br><br><b>解説</b>　企業には算定・開示の準備が必要で、第三者保証も体制づくりに時間がかかる。そこで、最初の2年は訂正報告書での記載を認め、保証は義務化の翌年から始める<br><br><b>答案に書くなら</b>　義務化の翌年から第三者保証を義務づけ、最初の2事業年度は訂正報告書での記載（二段階開示）を認め、スコープ3は初年度免除とする。<br><br><b>関連</b>　保証の範囲は当初2年間は限定。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の留意点。段階的導入の根拠<br><br>【出典】<a href=\"https://www.fsa.go.jp/singi/singi_kinyu/tosin/20260108/02.pdf\" target=\"_blank\" rel=\"noopener\">金融庁（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【SSBJ基準と有価証券報告書での開示義務化｜課題】SSBJ義務化の課題を『技術・信頼性』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　開示の比較可能性・有用性の向上と、第三者保証がなければ確保しにくい信頼性<br><br><b>解説</b>　開示情報は企業ごとに差が出やすく、保証がないと投資家が信頼しにくい。そのため比較可能性・有用性と信頼性の確保が課題になる<br><br><b>答案に書くなら</b>　技術・信頼性の観点から、課題は開示の比較可能性・有用性の向上と、第三者保証がなければ確保しにくい信頼性の確保である。<br><br><b>関連</b>　有報の記載欄は2023年から。<br><br><b>答案での使い方</b>　Ⅱ-1の課題。観点名を明記して書く<br><br>【出典】<a href=\"https://www.fsa.go.jp/singi/singi_kinyu/tosin/20260108/02.pdf\" target=\"_blank\" rel=\"noopener\">金融庁（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【SSBJ基準と有価証券報告書での開示義務化｜課題】SSBJ義務化の課題を『担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　保証業務の実施者の確保。監査法人以外にも登録の道を開く必要がある<br><br><b>解説</b>　保証には専門性が必要で、担える機関が限られると義務化に支障が出る。従来は監査法人が中心だったため、担い手の裾野を広げる必要がある<br><br><b>答案に書くなら</b>　担い手の観点から、課題は保証業務の実施者の確保であり、監査法人以外にも登録の道を開く必要がある。<br><br><b>関連</b>　保証業務実施者は登録制（法人）。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 人材の観点の課題に<br><br>【出典】<a href=\"https://www.fsa.go.jp/singi/singi_kinyu/tosin/20260108/02.pdf\" target=\"_blank\" rel=\"noopener\">金融庁（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【SSBJ基準と有価証券報告書での開示義務化｜解決策】開示の信頼性の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　国際基準と整合する保証基準で第三者保証を義務づけ、保証業務実施者を登録制にする<br><br><b>解説</b>　国際的に通用する保証にするため、国際基準と整合する保証基準を用い、担い手は登録制にして質を担保する<br><br><b>答案に書くなら</b>　制度面の観点から、解決策は国際基準と整合する保証基準で第三者保証を義務づけ、保証業務実施者を登録制にして開示の信頼性を確保することである。<br><br><b>関連</b>　国際基準にはISSA5000がある。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 制度面の解決策に<br><br>【出典】<a href=\"https://www.fsa.go.jp/singi/singi_kinyu/tosin/20260108/02.pdf\" target=\"_blank\" rel=\"noopener\">金融庁（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【SSBJ基準と有価証券報告書での開示義務化｜注意】SSBJ基準は法令そのものか？義務化はいつ保証までか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　法令ではない。金融庁長官の告示指定で有報の基準になる。最初の義務化は2027年3月期で、保証はその翌年<br><br><b>解説</b>　SSBJ基準は民間の基準設定主体が作った基準で、そのままでは法的効力がない。金融庁長官が告示で指定すると、有報で従うべき基準になる<br><br><b>答案に書くなら</b>　SSBJ基準は法令そのものではなく、金融庁長官の告示指定により有報の基準となり、最初の義務化は2027年3月期、保証はその翌年である。<br><br><b>関連</b>　2026年3月に3基準を改正（2027年1月1日以後開始の期間から適用）。<br><br><b>答案での使い方</b>　基準の位置づけと保証の時期を取り違えない<br><br>【出典】<a href=\"https://www.fsa.go.jp/news/r7/shouken/20260220/20260220.html\" target=\"_blank\" rel=\"noopener\">金融庁を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【トランジション・ファイナンス｜時期】クライメート・トランジション・ファイナンスに関する基本指針はいつ策定・改訂されたか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2021年に策定、2025年3月に改訂（2025年版）。金融庁・経産省・環境省が策定<br><br><b>解説</b>　基本指針は2021年に策定され、国際資本市場協会（ICMA）のハンドブック改訂などを受けて2025年3月に改訂された。金融庁・経産省・環境省の3省庁が策定する<br><br><b>答案に書くなら</b>　クライメート・トランジション・ファイナンスに関する基本指針は2021年に策定され、2025年3月に改訂された2025年版が現行である。<br><br><b>関連</b>　2026年8月の検討会で改訂の項目が立てられている。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで最新版を示す<br><br>【出典】<a href=\"https://www.env.go.jp/content/000304405.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【トランジション・ファイナンス｜定義】トランジション・ファイナンスとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　気候変動対策を検討する企業が長期戦略に沿ってGHG削減に取り組む場合に、その取組を支える金融手法。長期戦略の信頼性に着目<br><br><b>解説</b>　排出削減が難しい産業の移行には、個別の使途だけでなく、企業の長期戦略への資金が要る。そこで企業レベルの長期戦略の信頼性に着目して、資金供給を後押しする<br><br><b>答案に書くなら</b>　トランジション・ファイナンスとは、長期戦略に沿ってGHG削減に取り組む企業の取組を支える金融手法であり、長期戦略の信頼性に着目する点が特徴である。<br><br><b>関連</b>　2050年カーボンニュートラルとパリ協定に整合する移行が前提。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000304405.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【トランジション・ファイナンス｜制度】基本指針が資金調達者に開示を推奨する4要素は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　①戦略とガバナンス②環境面のマテリアリティ③科学的根拠に基づく戦略と目標④実施の透明性<br><br><b>解説</b>　資金を出す側が、企業の戦略が本物かを見極める手がかりが必要。そこで4つの要素の開示を推奨し、国際原則とそろえる<br><br><b>答案に書くなら</b>　資金調達者に、戦略とガバナンス、環境面のマテリアリティ、科学的根拠に基づく戦略と目標、実施の透明性の4要素の開示を推奨する。<br><br><b>関連</b>　ICMAのハンドブックと整合する。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。ICMAハンドブックと整合<br><br>【出典】<a href=\"https://www.env.go.jp/content/000304405.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【トランジション・ファイナンス｜制度】分野別技術ロードマップはどの分野を対象にしているか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　鉄鋼・化学・電力・ガス・石油・紙パルプ・セメント・自動車に海運・航空を加えた10分野。日本の排出量の8割強<br><br><b>解説</b>　資金供給側が個別企業の戦略を評価するのは大変なため、分野ごとの道筋を国が示す。鉄鋼・化学など排出の多い産業を中心に、国交省策定の海運・航空を加えた10分野で、日本の排出量の8割強をカバーする<br><br><b>答案に書くなら</b>　分野別技術ロードマップは10分野を対象とし、資金調達者の戦略策定と資金供給者の評価の参照先となる。<br><br><b>関連</b>　基本指針は対象産業を限定しない。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。評価の参照先として書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000304405.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【トランジション・ファイナンス｜課題】トランジション・ファイナンスの課題を『経済・金融』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　実行した金融機関の投融資先の排出量（ファイナンスド・エミッション）が、一時的に増加する<br><br><b>解説</b>　排出の多い企業に融資すれば、その企業の排出が金融機関の投融資先の排出量として積み上がる。移行を支える融資は、短期的には金融機関の数字を悪化させることがある<br><br><b>答案に書くなら</b>　経済・金融の観点から、課題は実行した金融機関の投融資先の排出量（ファイナンスド・エミッション）が一時的に増加することである。<br><br><b>関連</b>　2023年に考え方を公表している。<br><br><b>答案での使い方</b>　Ⅱ-1の課題。観点名を明記して書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000304405.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【トランジション・ファイナンス｜課題】トランジション・ファイナンスの課題を『信頼性』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　国際的な共通認識の醸成は途上で、信頼性の確保のため良質な事例の積み上げが重要<br><br><b>解説</b>　トランジション・ファイナンスは、国際的な関心が高まる一方、定義を様々な機関が整理しており、共通認識の形成は途上である<br><br><b>答案に書くなら</b>　信頼性の観点から、課題は国際的な共通認識の醸成が途上であり、信頼性の確保のため良質な事例の積み上げが重要なことである。<br><br><b>関連</b>　資金供給者による戦略評価の難しさも課題。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 制度・信頼性の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000304405.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【トランジション・ファイナンス｜解決策】信頼性確保の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　4要素の開示を求めてICMAハンドブックと整合を図り、フォローアップガイダンスで資金供給後の確認を整える<br><br><b>解説</b>　資金が出た後に戦略が実行されなければ意味がない。そこで開示要素を示して国際原則とそろえ、資金供給後の確認方法も整える<br><br><b>答案に書くなら</b>　制度面の観点から、解決策は4要素の開示を求めてICMAハンドブックと整合を図り、フォローアップガイダンスで資金供給後の確認を整えることである。<br><br><b>関連</b>　フォローアップガイダンスは2023年。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 制度面の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000304405.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【トランジション・ファイナンス｜注意】クライメート・トランジション利付国債は、基本指針と同じ枠組みか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　別枠組み。2024年2月に国が発行を始めた世界初の国によるトランジションボンド<br><br><b>解説</b>　国のトランジションボンドは、国が移行債でリーディングマーケットを作る別の取組である。基本指針は民間の資金調達の考え方で、役割が違う<br><br><b>答案に書くなら</b>　クライメート・トランジション利付国債は基本指針とは別枠組みで、2024年2月に国が発行を始めた世界初の国によるトランジションボンドである。<br><br><b>関連</b>　基本指針は金融庁・経産省・環境省が策定。<br><br><b>答案での使い方</b>　基本指針（金融庁・経産省・環境省）と混同しない<br><br>【出典】<a href=\"https://www.fsa.go.jp/singi/transition_finance/siryou/20260821/014_03_00.pdf\" target=\"_blank\" rel=\"noopener\">金融庁（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【熱中症特別警戒情報｜時期】熱中症特別警戒情報はいつから運用され、発表実績は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2024年4月（改正気候変動適応法の全面施行）から運用。令和6・7年度とも発表0回<br><br><b>解説</b>　熱中症対策を気候変動適応の一分野として強化するため、2023年に改正された気候変動適応法が2024年4月に全面施行された。特別警戒情報はその時から運用されているが、基準が厳しく実績がない<br><br><b>答案に書くなら</b>　熱中症特別警戒情報は2024年4月から運用が始まっているが、令和6・7年度とも発表実績は0回である。<br><br><b>関連</b>　令和8年度も2026年8月6日時点で0回。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで運用開始時期を示す<br><br>【出典】<a href=\"https://www.wbgt.env.go.jp/about_special_alert.php\" target=\"_blank\" rel=\"noopener\">環境省 熱中症予防情報サイトを開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【熱中症特別警戒情報｜定義】熱中症特別警戒情報とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　気温が特に著しく高く、熱中症による人の健康への重大な被害が生ずるおそれがある場合に、環境大臣が発表する情報（法第19条）<br><br><b>解説</b>　警戒情報（アラート）より一段上の、重大な被害のおそれがある場合の情報。環境大臣が都道府県知事へ通知し、知事・市町村長を通じて住民へ伝わる<br><br><b>答案に書くなら</b>　熱中症特別警戒情報とは、気温が特に著しく高く、熱中症による人の健康への重大な被害が生ずるおそれがある場合に、環境大臣が発表する情報である。<br><br><b>関連</b>　根拠は気候変動適応法第19条。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/430AC0000000050\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【熱中症特別警戒情報｜制度】警戒情報と特別警戒情報の発表基準は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　警戒：府県予報区内の1地点以上で日最高WBGT33以上。特別警戒：都道府県内の全地点で35以上<br><br><b>解説</b>　警戒情報は広めに注意を促し、特別警戒は極端な場合に限る設計。地点数の条件が違うため、特別警戒は発表されにくい<br><br><b>答案に書くなら</b>　警戒情報は府県予報区内の1地点以上で日最高WBGT33以上、特別警戒情報は都道府県内の全地点で35以上と予測される場合に発表する。<br><br><b>関連</b>　WBGTは暑さ指数。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。基準と範囲を書き分ける<br><br>【出典】<a href=\"https://www.wbgt.env.go.jp/about_special_alert.php\" target=\"_blank\" rel=\"noopener\">環境省 熱中症予防情報サイトを開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【熱中症特別警戒情報｜制度】指定暑熱避難施設（クーリングシェルター）の仕組みは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　市町村長が冷房設備のある施設を指定し、特別警戒情報の発表時に開放する<br><br><b>解説</b>　暑い日に避難できる涼しい場所がないと、熱中症弱者が守れない。市町村長が冷房のある施設を指定し、特別警戒情報の発表時に開放する<br><br><b>答案に書くなら</b>　市町村長が適当な冷房設備を有する施設を指定暑熱避難施設に指定し、特別警戒情報の発表時に住民へ開放する。<br><br><b>関連</b>　管理者が開放義務を負うのは特別警戒情報の発表時で、公表した開放可能日等に限られる。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。自治体の役割として書く<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/430AC0000000050\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【熱中症特別警戒情報｜課題】熱中症対策の課題を『社会・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　高齢者やこども等の熱中症弱者は自助による予防が難しく、家族や身近な人の見守り・声かけ（共助）と公助が要る<br><br><b>解説</b>　高齢者やこどもは自分で暑さを避けにくく、気づきも遅れがち。自助だけに頼れず、周囲の見守りや行政の対応が欠かせない<br><br><b>答案に書くなら</b>　社会・担い手の観点から、課題は高齢者やこども等の熱中症弱者は自助による予防が難しく、家族や身近な人の見守り・声かけ（共助）と公助が必要なことである。<br><br><b>関連</b>　熱中症対策普及団体は市町村長が指定する。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 社会・担い手の観点の課題に<br><br>【出典】<a href=\"https://www.wbgt.env.go.jp/about_special_alert.php\" target=\"_blank\" rel=\"noopener\">環境省 熱中症予防情報サイトを開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【熱中症特別警戒情報｜解決策】熱中症の共助を強める解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　熱中症対策普及団体や福祉関係団体を通じた見守り・声かけの強化と、エアコン利用の有効性の周知<br><br><b>解説</b>　共助は身近な人の見守りが基本だが、きっかけがないと広がらない。普及団体や福祉関係団体の力を借り、エアコンの有効性も周知する<br><br><b>答案に書くなら</b>　担い手面の観点から、解決策は熱中症対策普及団体や福祉関係団体を通じた見守り・声かけの強化と、エアコン利用の有効性の周知である。<br><br><b>関連</b>　普及団体は啓発・広報や相談対応を行う。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 担い手面の解決策に<br><br>【出典】<a href=\"https://www.wbgt.env.go.jp/about_special_alert.php\" target=\"_blank\" rel=\"noopener\">環境省 熱中症予防情報サイトを開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【熱中症特別警戒情報｜解決策】極端な高温時の体制整備の解決策を、専門用語で言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　指定暑熱避難施設の指定・確保と、極端な高温時の自治体内の役割分担の明確化<br><br><b>解説</b>　極端な高温の日に自治体が混乱しないよう、避難施設を確保し役割分担を事前に決めておく。市町村が住民に伝える仕組みの実効性にも関わる<br><br><b>答案に書くなら</b>　解決策は指定暑熱避難施設の指定・確保と、極端な高温時の自治体内の役割分担の明確化である。<br><br><b>関連</b>　実行計画は令和8年度を目途に見直す予定。<br><br><b>答案での使い方</b>　Ⅱ-2 自治体の手順・調整事項に<br><br>【出典】<a href=\"https://www.wbgt.env.go.jp/about_special_alert.php\" target=\"_blank\" rel=\"noopener\">環境省 熱中症予防情報サイトを開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【熱中症特別警戒情報｜注意】熱中症対策実行計画の「半減」は、何を基準にした目標か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　令和4年（概数）の5年移動平均1,295名を基準に、2030年に熱中症死亡者数を半減<br><br><b>解説</b>　熱中症の死亡者数は年ごとに変動が大きいため、5年移動平均で目標を置く。基準は令和4年（概数）の1,295名で、この数字から2030年に半減をめざす<br><br><b>答案に書くなら</b>　熱中症対策実行計画は、令和4年（概数）の5年移動平均1,295名を基準に、2030年に熱中症死亡者数を半減する目標である。<br><br><b>関連</b>　目標は2023年5月30日に閣議決定。<br><br><b>答案での使い方</b>　基準年・基準値を落とすと減点<br><br>【出典】<a href=\"https://www.wbgt.env.go.jp/about_special_alert.php\" target=\"_blank\" rel=\"noopener\">環境省 熱中症予防情報サイトを開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【気候変動影響評価報告書（第3次）｜時期】気候変動影響評価報告書の第3次はいつ公表されたか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2026年2月16日に公表。第2次は令和2年12月。おおむね5年ごとに作成する（法第10条）<br><br><b>解説</b>　気候変動適応法の定めで、おおむね5年ごとに最新の知見で評価する。第3次は2026年2月16日に公表され、第2次は令和2年12月だった<br><br><b>答案に書くなら</b>　気候変動影響評価報告書の第3次は2026年2月16日に公表され、法に基づきおおむね5年ごとに作成される。<br><br><b>関連</b>　根拠は気候変動適応法第10条。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで最新版を示す<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_02915.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【気候変動影響評価報告書（第3次）｜定義】気候変動影響評価報告書とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　気候変動適応法に基づき、最新の科学的知見でおおむね5年ごとに行う影響の総合的評価。適応計画の変更時に勘案する<br><br><b>解説</b>　適応策は、どの分野でどの程度の影響が出るかを把握して初めて立てられる。そこで科学的知見をもとに影響を総合評価し、計画の見直しに使う<br><br><b>答案に書くなら</b>　気候変動影響評価報告書とは、気候変動適応法に基づき、最新の科学的知見でおおむね5年ごとに影響を総合的に評価する報告書である。<br><br><b>関連</b>　適応計画の変更時に勘案する。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/430AC0000000050\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【気候変動影響評価報告書（第3次）｜制度】影響評価の3つの観点は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　重大性、緊急性、確信度<br><br><b>解説</b>　影響は大きさだけでなく、いつ現れるか、どれだけ確かか、で対応の優先度が変わる。そこで重大性・緊急性・確信度の3つの物差しで評価する<br><br><b>答案に書くなら</b>　影響評価は、重大性・緊急性・確信度の3つの観点で行う。<br><br><b>関連</b>　重大性は社会・経済・環境の3観点で見る。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。評価の物差しとして書く<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_02915.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【気候変動影響評価報告書（第3次）｜制度】第3次報告書の改善点は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　重大性を3段階（レベル1〜3）に細分化し、現状・1.5〜2℃上昇時・3〜4℃上昇時で評価。「特に強い影響を受ける地域・対象」を追加<br><br><b>解説</b>　影響の大きさは気温上昇の程度で変わるため、3段階に細分化し、上昇幅別に評価することで、対策の優先度が分かりやすくなる<br><br><b>答案に書くなら</b>　第3次では重大性を3段階に細分化し、現状・1.5〜2℃上昇時・3〜4℃上昇時で評価し、特に強い影響を受ける地域・対象を追加した。<br><br><b>関連</b>　最も高いレベル3は特に重大な影響が認められる。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。第2次との違い<br><br>【出典】<a href=\"https://www.env.go.jp/content/000380482.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【気候変動影響評価報告書（第3次）｜制度】第3次が特に優先的に対応が必要とした項目は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　水稲の収量・品質低下、果樹の栽培適地の変化、洪水・内水、サンゴの白化、暑熱、インフラ・ライフラインの寸断など<br><br><b>解説</b>　重大性・緊急性が高い項目は、対応を急ぐ必要がある。農業、水害、生態系、暑熱、インフラと分野をまたいで挙げられている<br><br><b>答案に書くなら</b>　第3次は水稲の収量・品質低下、果樹の栽培適地の変化、洪水・内水、サンゴの白化、暑熱、インフラ・ライフラインの寸断を優先して対応が必要な項目とした。<br><br><b>関連</b>　暑熱は熱中症による救急搬送者・死亡者数の増加。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 課題の根拠に。分野を挙げるときに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000380482.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【気候変動影響評価報告書（第3次）｜課題】影響評価の課題を『科学的知見』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　適応策の効果を定量的・具体的に整理できたのは小項目全体の3割程度で、複数の適応策を比較できる知見は非常に限られる<br><br><b>解説</b>　適応策の効果を数字で示せなければ、どの策を優先するか決めにくい。第3次でも定量的・具体的に整理できたのは小項目の3割程度にとどまる<br><br><b>答案に書くなら</b>　科学的知見の観点から、課題は適応策の効果を定量的・具体的に整理できたのが小項目全体の3割程度で、複数の適応策を比較できる知見が非常に限られることである。<br><br><b>関連</b>　特に強い影響を受ける地域を整理できたのは4割程度。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 技術・知見の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000380482.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【気候変動影響評価報告書（第3次）｜解決策】評価結果をどう使うか（解決策）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2026年度の気候変動適応計画の改定と、自治体・事業者による影響の把握・適応策の検討に活用する<br><br><b>解説</b>　評価は作って終わりではなく、国の計画と地域・事業者の判断に使われて初めて意味を持つ。2026年度に適応計画が改定される予定である<br><br><b>答案に書くなら</b>　解決策は、評価結果を2026年度の気候変動適応計画の改定に活用し、自治体・事業者による影響の把握・適応策の検討にも活用することである。<br><br><b>関連</b>　計画改定は2026年度の予定で、公表年（2026年2月）とは別。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 調査検討事項の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000380482.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【気候変動影響評価報告書（第3次）｜注意】「80項目」とは何か？公表年と計画改定の年度は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　7分野を細分化した小項目の数で第2次より9項目増。公表は2026年2月、適応計画の改定は2026年度の予定<br><br><b>解説</b>　80項目は評価の細かさを示す数字で、7分野を細分化した小項目の数。第2次より9項目増え、細かく見る方向に進んでいる<br><br><b>答案に書くなら</b>　80項目は7分野を細分化した小項目の数で、第2次より9項目増えた。公表は2026年2月、適応計画の改定は2026年度の予定である。<br><br><b>関連</b>　公表年と改定年度を取り違えない。<br><br><b>答案での使い方</b>　数字と年度の取り違えは減点<br><br>【出典】<a href=\"https://www.env.go.jp/content/000380482.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【再資源化事業等高度化法｜時期】再資源化事業等高度化法はいつ全面施行されたか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　2025年11月21日に全面施行（一部は2025年2月1日）。公布は2024年5月29日<br><br><b>解説</b>　法は2024年5月29日に公布され、一部が2025年2月1日、全面施行が2025年11月21日と段階的に施行された。全面施行後は認定制度が動いている<br><br><b>答案に書くなら</b>　再資源化事業等高度化法は2025年11月21日に全面施行されており、認定制度が運用される段階にある。<br><br><b>関連</b>　公布日（2024年5月29日）と区別。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで施行済みと示す。公布日と区別<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000041\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【再資源化事業等高度化法｜定義】再資源化事業等高度化法とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　再資源化のための廃棄物の収集・運搬・処分と、再資源化の技術・設備の高度化を促し、GHG削減効果の高い資源循環を促進する法律<br><br><b>解説</b>　従来の廃棄物行政は適正処理が中心で、再生材の質と量を高める施策が不足していた。そこで再資源化の事業と技術・設備の高度化を促す<br><br><b>答案に書くなら</b>　再資源化事業等高度化法とは、再資源化のための廃棄物の収集・運搬・処分と技術・設備の高度化を促し、温室効果ガスの削減効果の高い資源循環を促進する法律である。<br><br><b>関連</b>　基本方針は環境大臣が策定する。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000041\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【再資源化事業等高度化法｜制度】再資源化事業等高度化法の認定3類型は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　①高度再資源化事業計画②高度分離・回収事業計画③再資源化工程高度化計画（既存施設向け）。環境大臣が認定<br><br><b>解説</b>　事業の形によって必要な支援が違うため、3つの類型に分ける。新設の事業、分離・回収の高度化、既存施設の高度化で、認定は環境大臣が行う<br><br><b>答案に書くなら</b>　認定は①高度再資源化事業計画、②高度分離・回収事業計画、③再資源化工程高度化計画（既存施設向け）の3類型で、環境大臣が認定する。<br><br><b>関連</b>　認定を受けると廃棄物処理法の許可の特例がある。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。3類型を番号で書く<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000041\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【再資源化事業等高度化法｜制度】判断基準と報告・公表の仕組みは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　廃棄物処分業者の判断基準を環境省令で定め、特定産業廃棄物処分業者が処分量・再資源化量を毎年度報告し、環境大臣が公表<br><br><b>解説</b>　認定を受けた事業者だけでなく、廃棄物処分業者全体の水準を引き上げる必要がある。基準を示し、処分量と再資源化量を報告・公表させる<br><br><b>答案に書くなら</b>　廃棄物処分業者の判断基準を環境省令で定め、特定産業廃棄物処分業者に処分量・再資源化量を毎年度報告させ、環境大臣が公表して全体の底上げを図る。<br><br><b>関連</b>　報告義務は処分量の多い特定産業廃棄物処分業者。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。底上げの仕組みとして書く<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000041\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【再資源化事業等高度化法｜課題】資源循環の課題を『制度・運用』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　製造（動脈）と廃棄物処分（静脈）の連携。再生資源の利用目標の共有と、トレーサビリティのためのデータ連携が要る<br><br><b>解説</b>　動脈（製造）と静脈（廃棄物処分）がつながらないと、再生材が製造側の求める質・量で流れない。情報の共有とトレーサビリティも要る<br><br><b>答案に書くなら</b>　制度・運用の観点から、課題は動脈と静脈の連携であり、再生資源の利用目標の共有とトレーサビリティのためのデータ連携が必要なことである。<br><br><b>関連</b>　動脈は製造、静脈は廃棄物処分を指す。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 制度の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000360673.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【再資源化事業等高度化法｜課題】資源循環の課題を『経済・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　製造業が求める量・質の再生材を安定供給できる事業が不足している。再資源化工程自体の脱炭素化も求められる<br><br><b>解説</b>　製造業は品質の安定した再生材を大量に求める。ところがそれに応える事業者が不足しており、再資源化の工程自体にも脱炭素化が求められる<br><br><b>答案に書くなら</b>　経済・担い手の観点から、課題は製造業が求める量・質の再生材を安定供給できる事業が不足していることであり、再資源化工程自体の脱炭素化も求められる。<br><br><b>関連</b>　目標は施行から3年間で100件以上の事業認定。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 経済の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000360673.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【再資源化事業等高度化法｜解決策】製造側と処分側をつなぐ解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　高度再資源化事業の認定で、製造側の需要に応じた質・量の再生材確保を図り、製造事業者と処分業者のマッチングを促す<br><br><b>解説</b>　製造側が求める再生材と、処分側の供給のギャップを埋める必要がある。高度再資源化事業の認定により、製造側の需要を前提とした事業を支援する<br><br><b>答案に書くなら</b>　連携面の観点から、解決策は高度再資源化事業の認定で製造側の需要に応じた質・量の再生材確保を図り、製造事業者と処分業者のマッチングを促すことである。<br><br><b>関連</b>　認定は環境大臣が国で一括して行う。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 連携面の解決策に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000041\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【再資源化事業等高度化法｜注意】認定は誰が行い、廃棄物処理法との関係は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　環境大臣が国で一括して認定し、廃掃法の許可の特例を与える。廃掃法そのものを置き換えるものではない<br><br><b>解説</b>　廃棄物処理法の許可は都道府県知事が出す。本法は環境大臣が国で一括認定し、廃掃法の許可手続の特例を与える仕組みで、廃掃法自体は残る<br><br><b>答案に書くなら</b>　認定は環境大臣が国で一括して行い、廃棄物処理法の許可に代わる特例を与えるが、廃棄物処理法そのものを置き換えるものではない。<br><br><b>関連</b>　登録調査機関が認定の調査業務を担う。<br><br><b>答案での使い方</b>　都道府県知事の認定と書くと減点<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000041\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽電池廃棄物の再資源化等の推進に関する法律｜時期】太陽電池廃棄物の再資源化等推進法は施行されているか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　令和8年法律第33号。2026年6月5日公布で未施行。施行は公布から1年6か月以内の政令日（2027年秋〜冬の予定）<br><br><b>解説</b>　本法は令和8年法律第33号で、2026年6月5日に公布された。施行日は政令で定める日で、公布から1年6か月以内。環境省は施行を2027年秋〜冬頃と見込む<br><br><b>答案に書くなら</b>　太陽電池廃棄物の再資源化等推進法は2026年6月に公布済みだが未施行であり、施行は政令で定める日である。<br><br><b>関連</b>　政省令の公布は2027年春頃の予定。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで「公布済み・未施行」と示す<br><br>【出典】<a href=\"https://www.env.go.jp/content/000404704.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽電池廃棄物の再資源化等の推進に関する法律｜定義】太陽電池廃棄物の再資源化等推進法とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　多量の事業用パネルの廃棄者からリサイクル規制を段階的に強化し、幅広い排出者への義務化に向けた環境整備を行う法律<br><br><b>解説</b>　パネルの排出量は2030年代後半以降に顕著に増え、年間最大50万t程度に達する見込みで、最終処分場の残余容量を圧迫するおそれがある。そこで排出が多い者から順に規制を強める<br><br><b>答案に書くなら</b>　太陽電池廃棄物の再資源化等推進法とは、多量の事業用パネルの廃棄者からリサイクル規制を段階的に強化し、幅広い排出者への義務化に向けた環境整備を行う法律である。<br><br><b>関連</b>　50万tは見込みで実績ではない。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000404704.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽電池廃棄物の再資源化等の推進に関する法律｜制度】義務づけの対象と、勧告・命令の対象は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　事業用パネルの廃棄者に、判断基準に基づくリサイクルの取組を義務づけ。勧告・命令の対象は多量廃棄者<br><br><b>解説</b>　全員に一律に課すのではなく、段階的に進める設計。事業用の廃棄者は基準に基づくリサイクルが義務で、勧告・命令は多量廃棄者に限る<br><br><b>答案に書くなら</b>　事業用パネルの廃棄者に判断基準に基づくリサイクルの取組を義務づけ、勧告・命令の対象は多量廃棄者とする。<br><br><b>関連</b>　指導・助言は全ての事業用廃棄者が対象。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。全面義務化と書かない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000404704.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽電池廃棄物の再資源化等の推進に関する法律｜制度】多量事業用太陽電池廃棄者に課される手続は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　廃棄前に実施計画を国へ届出し、原則、受理から30日経過後でなければ排出できない<br><br><b>解説</b>　多量に出す者は、その処理が地域の処分能力を圧迫しやすい。そこで廃棄前に実施計画を届け出させて、国が事前に把握・関与できるようにする<br><br><b>答案に書くなら</b>　多量事業用太陽電池廃棄者は、廃棄前に実施計画を国へ届出し、原則として受理から30日経過後でなければ排出できない。<br><br><b>関連</b>　計画が著しく不十分なら変更等を勧告・命令。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。排出前の事前届出と書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000404704.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽電池廃棄物の再資源化等の推進に関する法律｜課題】パネルのリサイクルの課題を『技術・体制』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　専用施設の処理能力は約13万t/年で今後の排出見込量に不足し、8府県に施設がない<br><br><b>解説</b>　専用のリサイクル施設は能力も立地も足りない。2025年11月時点で専用施設は87件、処理能力は約13万t/年で、将来の排出見込みに対して不足している<br><br><b>答案に書くなら</b>　技術・体制の観点から、課題は専用施設の処理能力が約13万t/年で今後の排出見込量に不足し、8府県に施設がないことである。<br><br><b>関連</b>　パネルの種類によっては技術的・経済的に困難。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 技術・体制の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000404704.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽電池廃棄物の再資源化等の推進に関する法律｜課題】パネルのリサイクルの課題を『経済』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　埋立とリサイクルの費用差が大きい（リサイクル8,000〜12,000円/kW、埋立2,000円/kW程度〜）<br><br><b>解説</b>　埋立のほうが安いと、排出者は埋立を選びやすい。費用差が大きいと、義務づけがない限りリサイクルは進まない<br><br><b>答案に書くなら</b>　経済の観点から、課題は埋立とリサイクルの費用差が大きく、リサイクルが8,000〜12,000円/kW、埋立が2,000円/kW程度〜であることである。<br><br><b>関連</b>　6割以上の事業者は実質的にリサイクルを検討していない。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 経済の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000404704.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽電池廃棄物の再資源化等の推進に関する法律｜解決策】リサイクル促進の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　設備・保管施設の導入支援に加え、国の認定制度（廃掃法の許可の特例）で広域的・効率的な処理を進めコストを下げる<br><br><b>解説</b>　リサイクルのコストが高い主因は、処理能力の不足と手続きの重さ。設備の支援と、都道府県ごとの許可が不要になる特例でコストを下げる<br><br><b>答案に書くなら</b>　制度・設備面の観点から、解決策は設備・保管施設の導入支援に加え、国の認定制度（廃掃法の許可の特例）で広域的・効率的な処理を進めてコストを下げることである。<br><br><b>関連</b>　認定の対象は費用効率的なリサイクル事業の計画。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 制度・設備面の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000404704.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽電池廃棄物の再資源化等の推進に関する法律｜注意】この法律は、全てのパネルにリサイクルを義務づけるか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　一律ではない。義務づけは事業用の廃棄者への判断基準の取組で、住宅用を含む全面義務化は附則の検討規定にとどまる<br><br><b>解説</b>　まず多量の事業用から始め、住宅用などの幅広い排出者への義務化は、将来の課題として附則の検討規定に置いた。一律義務化と書くと誤り<br><br><b>答案に書くなら</b>　本法の義務づけは事業用の廃棄者への判断基準に基づく取組であり、住宅用を含む全面義務化は附則の検討規定にとどまる。<br><br><b>関連</b>　製造・輸入業者の環境配慮設計は努力義務。<br><br><b>答案での使い方</b>　「全パネル義務化」と書くと減点<br><br>【出典】<a href=\"https://www.env.go.jp/content/000404704.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック資源循環促進法｜時期】プラスチック資源循環促進法の施行はいつか？また見直しの時期は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　2021年6月公布、2022年4月施行。附則で施行後5年の検討を定め、2027年4月以降に見直しが可能<br><br><b>解説</b>　本法は2021年6月に公布、2022年4月に施行された。附則で施行後5年の検討を定めており、2027年4月以降に見直しが可能だが、見直しが決まったわけではない<br><br><b>答案に書くなら</b>　プラスチック資源循環促進法は2022年4月に施行済みで、附則の検討規定により2027年4月以降に見直しが可能である。<br><br><b>関連</b>　見直しは未決定。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで施行済みと示す。見直しは未決定<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/503AC0000000060\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック資源循環促進法｜定義】プラスチック資源循環促進法とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　製品の設計から廃棄物処理まで、あらゆる主体のプラスチック資源循環の取組を促す法律。3R+Renewableが基本原則<br><br><b>解説</b>　海洋プラごみ、気候変動、アジア諸国の廃棄物輸入規制を背景に、2019年にプラスチック資源循環戦略を作った。本法はその実装で、製品の設計から廃棄までの全主体を対象とする<br><br><b>答案に書くなら</b>　プラスチック資源循環促進法とは、製品の設計から廃棄物処理まで、あらゆる主体の資源循環の取組を促す法律であり、3R+Renewableが基本原則である。<br><br><b>関連</b>　戦略は2019年5月に策定された。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/503AC0000000060\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック資源循環促進法｜制度】同法の措置の5本柱は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　設計指針・認定、使用の合理化、市町村の分別収集・再商品化、自主回収・再資源化、排出事業者の排出抑制・再資源化<br><br><b>解説</b>　プラスチックのライフサイクルを、設計から排出事業者までの5段階で押さえる。製造、使用、回収、再資源化と流れに沿って措置を置く<br><br><b>答案に書くなら</b>　措置は、設計指針・認定、使用の合理化、市町村の分別収集・再商品化、自主回収・再資源化、排出事業者の排出抑制・再資源化の5本柱である。<br><br><b>関連</b>　法の章立てに対応する。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。5段階で書く<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/503AC0000000060\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック資源循環促進法｜制度】特定プラスチック使用製品とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　無償提供される12製品（スプーン・ストロー・ヘアブラシ・歯ブラシ・ハンガー等）。提供量5t以上の事業者が勧告等の対象<br><br><b>解説</b>　使い捨てになりやすい無償提供の製品に絞り、提供量が多い事業者から取組を求める。対象は12製品で、前年度の提供量が5トン以上の事業者が多量提供事業者となる<br><br><b>答案に書くなら</b>　特定プラスチック使用製品とは無償で提供される12製品であり、提供量5t以上の事業者が、取組が著しく不十分な場合に勧告等の対象となる。<br><br><b>関連</b>　法施行後に特定12品目の提供量は11%減った。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。12製品と5tの数字<br><br>【出典】<a href=\"https://plastic-circulation.env.go.jp/pro/gorika\" target=\"_blank\" rel=\"noopener\">環境省 プラスチック資源循環を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック資源循環促進法｜目標】プラスチック資源循環戦略のマイルストーンは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　2030年までにワンウェイプラを累積25%排出抑制、2035年までに使用済プラを100%有効利用<br><br><b>解説</b>　戦略は2019年に策定され、削減・再利用の目標を年次で示している。排出抑制は2030年、使用済みの有効利用は2035年で、年次が違う<br><br><b>答案に書くなら</b>　プラスチック資源循環戦略は、2030年までにワンウェイプラを累積25%排出抑制し、2035年までに使用済プラを100%有効利用することを掲げる。<br><br><b>関連</b>　ほかに2030年までに再生利用を倍増。<br><br><b>答案での使い方</b>　Ⅱ-1の数字。年次とセットで書く<br><br>【出典】<a href=\"https://plastic-circulation.env.go.jp/about/senryaku\" target=\"_blank\" rel=\"noopener\">環境省 プラスチック資源循環を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック資源循環促進法｜課題】プラ資源循環の課題を『制度・運用』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　プラ資源の回収量の拡大が課題。容リ協の入札量は令和4年度約69万tから令和7年度約66万tへ微減した<br><br><b>解説</b>　リサイクルは回収量が増えなければ進まない。容リ協の入札量は令和4年度約69万tから令和7年度約66万tへ微減し、回収量の拡大が課題とされる<br><br><b>答案に書くなら</b>　制度・運用の観点から、課題はプラ資源の回収量の拡大であり、容リ協の入札量が令和4年度約69万tから令和7年度約66万tへ微減したことである。<br><br><b>関連</b>　製品プラも一括回収できる仕組みがある。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 回収の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/council/content/i_03/000433372.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック資源循環促進法｜解決策】再生材の需要づくりの解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　再生材・バイオプラの価値創出（GHG削減効果の評価、マスバランス方式）を検討し、再生プラ利用計画で需要を創出<br><br><b>解説</b>　再生材は新品より割高で、需要がなければ回収が進んでも使われない。そこで環境価値を見える化して需要を創り、再生プラ利用計画で利用を促す<br><br><b>答案に書くなら</b>　需要面の観点から、解決策は再生材・バイオプラの価値創出（GHG削減効果の評価、マスバランス方式）を検討し、再生プラ利用計画で需要を創出することである。<br><br><b>関連</b>　再生プラの利用計画提出は2027年度から。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 需要面の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/council/content/i_03/000433372.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック資源循環促進法｜注意】特定プラ12品目の要件と、レジ袋有料化との関係は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　要件は「無償提供」。レジ袋有料化（2020年7月）は本法施行（2022年4月）より前の別の施策<br><br><b>解説</b>　レジ袋は2020年7月から有料化され、本法の施行（2022年4月）より前の別施策。12品目は有料のものではなく、無償提供が要件である<br><br><b>答案に書くなら</b>　特定プラスチック使用製品12品目の要件は無償提供であり、レジ袋有料化（2020年7月）は本法施行（2022年4月）より前の別の施策である。<br><br><b>関連</b>　有償提供品や時期を取り違えない。<br><br><b>答案での使い方</b>　有償提供品や時期を取り違えない<br><br>【出典】<a href=\"https://plastic-circulation.env.go.jp/pro/gorika\" target=\"_blank\" rel=\"noopener\">環境省 プラスチック資源循環を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【食品ロス削減推進法と2030年度目標｜時期】食品ロス削減推進法と基本方針の時期は？また最新推計は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　法は2019年5月公布・10月施行。基本方針は2025年3月閣議決定。最新推計は令和6年度（2026年6月公表）<br><br><b>解説</b>　食品ロス削減推進法は国・自治体・事業者・消費者の責務を定め、政府が基本方針で数値目標を置く法律。推計は年度ごとに更新されるため年度を明記する<br><br><b>答案に書くなら</b>　食品ロス削減推進法は2019年10月に施行され、2025年3月閣議決定の基本方針の下、令和6年度推計が最新である。<br><br><b>関連</b>　10月は食品ロス削減月間、10月30日は食品ロス削減の日。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで最新版を示す<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/501AC1000000019\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【食品ロス削減推進法と2030年度目標｜定義】食品ロスとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　まだ食べることができるのに廃棄される食品（可食部）。食品廃棄物全体とは別（法第2条第2項）<br><br><b>解説</b>　食品ロスは食べられるのに捨てられた分（可食部）だけを指し、食べられない部分も含む食品廃棄物全体とは範囲が違う<br><br><b>答案に書くなら</b>　食品ロスとは、まだ食べることができるのに廃棄される食品であり、食品廃棄物全体とは区別される。<br><br><b>関連</b>　SDGsは2030年までに世界全体の一人当たり食料廃棄の半減を掲げる。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/501AC1000000019\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【食品ロス削減推進法と2030年度目標｜目標】基本方針が定める食品ロス削減の2030年度目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　家庭系は2000年度比で半減、事業系は2000年度比で60%削減<br><br><b>解説</b>　基本方針（2025年3月）は2000年度を基準に、家庭系と事業系で削減率を変えて総量目標を置いている。家庭系は早期達成も求める<br><br><b>答案に書くなら</b>　基本方針は2030年度までに2000年度比で家庭系を半減、事業系を60%削減する目標を掲げている。<br><br><b>関連</b>　目標値は家庭系433万tから216万t、事業系547万tから219万t。<br><br><b>答案での使い方</b>　Ⅱ-1の数字。家庭系と事業系の割合を書き分ける<br><br>【出典】<a href=\"https://www.env.go.jp/content/000408175.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【食品ロス削減推進法と2030年度目標｜制度】令和6年度の食品ロス発生量は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　461万t（事業系237万t、家庭系224万t）。前年度の464万tから約3万t減<br><br><b>解説</b>　発生量は農林水産省・環境省が毎年度推計し、事業系と家庭系に分けて公表する。最新は令和6年度で、年度を取り違えると数字が変わる<br><br><b>答案に書くなら</b>　令和6年度の食品ロス発生量は461万tで、事業系237万t、家庭系224万tである。<br><br><b>関連</b>　前年度比で事業系は約6万t増、家庭系は約9万t減。<br><br><b>答案での使い方</b>　Ⅱ-1の数字。年度とセットで書く<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05155.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【食品ロス削減推進法と2030年度目標｜課題】食品ロス削減の課題を『事業系』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　外食産業の食品ロスが増加傾向で、令和6年度は事業系全体が前年度比で増えた<br><br><b>解説</b>　事業系の内訳は食品製造業46%、外食産業30%、食品小売業20%、卸売業4%。外食産業の増加が全体を押し上げた<br><br><b>答案に書くなら</b>　事業系の観点から、課題は外食産業の食品ロスが増加傾向にあり、令和6年度は事業系全体が前年度比で増えたことである。<br><br><b>関連</b>　事業系では食品製造業110万tが最大の内訳。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 事業系の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05155.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【食品ロス削減推進法と2030年度目標｜課題】食品ロス削減の課題を『家庭系』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　削減率48.3%で半減目標に届かず、直接廃棄と食べ残しが大半を占める<br><br><b>解説</b>　家庭系の内訳は直接廃棄43%、食べ残し41%、過剰除去16%。削減率は2024年度時点で48.3%<br><br><b>答案に書くなら</b>　家庭系の観点から、課題は削減率が48.3%で半減目標に届かず、直接廃棄と食べ残しが大半を占めることである。<br><br><b>関連</b>　事業系の削減率は56.7%で、家庭系と事業系は進み方が違う。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 家庭系の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05155.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【食品ロス削減推進法と2030年度目標｜解決策】食品ロス削減の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　外食の食べ残し持ち帰り（mottECO）の導入支援と、デコ活による家庭の行動変容の後押し<br><br><b>解説</b>　mottECOは外食での食べ残し持ち帰りの導入手引きと伴走支援の事業。デコ活は家庭の行動変容を後押しする取組で、事業系と家庭系に対応する<br><br><b>答案に書くなら</b>　解決策として、事業系は外食の食べ残し持ち帰り（mottECO）の導入を支援し、家庭系はデコ活で行動変容を後押しする。<br><br><b>関連</b>　自治体向けにフードドライブ実施の手引きや取組事例集（29事例）がある。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 事業系・家庭系の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05155.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【食品ロス削減推進法と2030年度目標｜注意】令和5年度と令和6年度の食品ロス量、世界目標と国内目標の違いは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　令和5年度464万t、令和6年度461万t（最新）。世界は一人当たり食料廃棄の半減、国内は2000年度比の総量<br><br><b>解説</b>　令和5年度と6年度は値が違い、削減率も年度で変わる。また世界目標と国内目標は対象が別（世界は一人当たり、国内は総量）<br><br><b>答案に書くなら</b>　最新は令和6年度の461万tであり、世界の一人当たり食料廃棄の半減目標と国内の2000年度比の総量目標は別物である。<br><br><b>関連</b>　2024年度は発生量全体で旧目標（2000年度比半減）を達成した。<br><br><b>答案での使い方</b>　年度と目標の母集団を取り違えない<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05155.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域生物多様性増進法と自然共生サイト｜時期】地域生物多様性増進法はいつ施行されたか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　2024年4月公布、2025年4月1日施行（施行済み）。主務大臣は環境・農林水産・国土交通大臣<br><br><b>解説</b>　増進法は企業等による増進活動を促すため、基本方針・計画認定・許可手続の特例を設けた法律。2024年4月19日公布、2025年4月1日施行<br><br><b>答案に書くなら</b>　地域生物多様性増進法は2025年4月1日に施行済みで、環境・農林水産・国土交通の3大臣が主務大臣である。<br><br><b>関連</b>　平成22年の旧法は本法の附則で廃止された。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで施行済みと示す<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000018\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域生物多様性増進法と自然共生サイト｜定義】OECMとは何か？自然共生サイトとの関係は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　OECMは保護地域以外で生物多様性の保全に資する管理が行われている区域。自然共生サイトはその日本版を国が認定する制度<br><br><b>解説</b>　OECMは保護地域ではないが、民間の取組等で生物多様性が保たれている区域。自然共生サイトは国が認定し、保護地域と重複しない部分が国際データベースに登録される<br><br><b>答案に書くなら</b>　OECMとは保護地域以外で生物多様性の保全に資する区域であり、自然共生サイトはその日本版として国が認定する制度である。<br><br><b>関連</b>　自然共生サイトとOECMは同一ではない。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000018\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域生物多様性増進法と自然共生サイト｜制度】地域生物多様性増進法の仕組みは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　基本方針と、増進活動実施計画の認定制度。認定活動は自然公園法・森林法等の許可・届出の特例（ワンストップ化）を受ける<br><br><b>解説</b>　許認可が複数の法律にまたがる活動を、認定1回で進めやすくする仕組み。事業者は増進活動実施計画を作り主務大臣が認定する<br><br><b>答案に書くなら</b>　制度の中身は、主務大臣が基本方針を定め、増進活動実施計画を認定し、認定活動には自然公園法・森林法等の許可・届出の特例（ワンストップ化）を設けることである。<br><br><b>関連</b>　土地所有者等全員の合意で生物多様性維持協定を結べる。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。認定と特例の2点を書く<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000018\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域生物多様性増進法と自然共生サイト｜制度】自然共生サイトの累計認定数は？（2026年10月時点）", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　700か所（2026年10月30日の令和8年度第2回認定で到達。法施行前の328か所を含む累計）<br><br><b>解説</b>　自然共生サイトは2023年度に認定を開始し、2024年度までに328か所、2025年4月から法定の認定に移行した。累計は法施行前を含む<br><br><b>答案に書くなら</b>　自然共生サイトは2026年10月30日の認定で累計700か所に達し、法施行前の328か所を含む累計である。<br><br><b>関連</b>　令和8年度の認定数（第2回の122か所など）とは数え方が別。<br><br><b>答案での使い方</b>　Ⅱ-1の数字。累計の起点を明示する<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05720.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域生物多様性増進法と自然共生サイト｜課題】30by30の課題を『制度・運用』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　30by30は主にOECMの設定で達成する計画だが、OECMは陸域で0.2%にとどまる（2026年8月時点）<br><br><b>解説</b>　30by30は保護地域とOECMで陸と海の30%以上を保全する目標。計画は主にOECMの設定で達成する方針だが、OECMの面積が伸びていない<br><br><b>答案に書くなら</b>　制度・運用の観点から、課題は30by30を主にOECMの設定で達成する計画だが、OECMが陸域で0.2%にとどまることである。<br><br><b>関連</b>　保護地域の拡張も国立公園等の候補地14か所で調整が進行中。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 制度の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05386.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域生物多様性増進法と自然共生サイト｜課題】生物多様性の取組の課題を『技術・科学』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　生物多様性の状況と保全活動の効果の「見える化」が必要。見える化システムで国土全体の状況を可視化している<br><br><b>解説</b>　保全活動の効果や生物多様性の状況が見えないと、優先地域の判断や活動の評価がしにくい。国土全体を可視化する見える化システムを運用している<br><br><b>答案に書くなら</b>　技術・科学の観点から、課題は生物多様性の状況と保全活動の効果を見える化する必要があることである。<br><br><b>関連</b>　2026年度に30by30ロードマップの中間評価を実施する。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05386.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域生物多様性増進法と自然共生サイト｜解決策】OECMを増やす解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　自然共生サイトの認定を進め、保護地域との重複を除いてOECM国際データベースに登録する。支援証明書制度で企業の参画を促す<br><br><b>解説</b>　OECMの登録は、自然共生サイトを認定し、保護地域と重複する部分を除いて国際データベースに載せる流れ。支援証明書は支援した企業等に発行される<br><br><b>答案に書くなら</b>　解決策として、自然共生サイトの認定を進めて保護地域と重複しない区域をOECM国際データベースに登録し、支援証明書制度で企業の参画を促す。<br><br><b>関連</b>　支援証明書は2025年9月から本格運用。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 30by30の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05720.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域生物多様性増進法と自然共生サイト｜注意】自然共生サイトとOECMは同じか？保護地域との合計割合は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　同じではない。国際DBへの登録は保護地域と重複しない区域のみ。合計は陸域約21.0%、海域約13.3%で目標30%未満<br><br><b>解説</b>　自然共生サイトは国の認定、OECM登録は重複を除いた区域のみ。保護地域とOECMを合わせても目標の30%に届いていない<br><br><b>答案に書くなら</b>　自然共生サイトとOECMは同一ではなく、保護地域とOECMの合計は陸域約21.0%、海域約13.3%で目標の30%に届いていない。<br><br><b>関連</b>　OECMの登録面積は2026年8月時点で累計64.6千ha。<br><br><b>答案での使い方</b>　定義の書き分けで減点を避ける<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05386.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ネイチャーポジティブ経済移行戦略｜時期】ネイチャーポジティブ経済移行戦略はいつ誰が策定したか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　2024年3月に環境省・農水省・経産省・国交省が策定。2025年7月にロードマップ（2025-2030年）を策定<br><br><b>解説</b>　生物多様性国家戦略2023-2030の基本戦略3の重点施策で、企業が自然資本の保全を経営に組み込むのを後押しする。策定主体は4省庁<br><br><b>答案に書くなら</b>　ネイチャーポジティブ経済移行戦略は2024年3月に環境・農水・経産・国交の4省庁が策定し、2025年7月にロードマップ（2025-2030年）が策定された。<br><br><b>関連</b>　戦略は法律ではなく4省庁の戦略。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで策定主体と時期を示す<br><br>【出典】<a href=\"https://www.env.go.jp/content/000298927.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ネイチャーポジティブ経済移行戦略｜定義】ネイチャーポジティブ経営とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　自然資本の保全を価値創造のマテリアリティに据えて、ネイチャーポジティブを目指す経営。実現した経営の意味ではない<br><br><b>解説</b>　マテリアリティは企業にとって重要な経営課題のこと。ネイチャーポジティブは生物多様性の損失を止めて反転させる考え方で、経営は「目指す」姿勢を指す<br><br><b>答案に書くなら</b>　ネイチャーポジティブ経営とは、自然資本の保全を価値創造プロセスのマテリアリティに据え、ネイチャーポジティブを目指す経営である。<br><br><b>関連</b>　実現した経営という意味ではない（戦略の脚注）。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000298927.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ネイチャーポジティブ経済移行戦略｜制度】ネイチャーポジティブ移行による2030年のビジネス機会は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　世界で年1,372兆円（WEF2020年推計）、日本では環境省試算で年47兆円<br><br><b>解説</b>　世界経済フォーラム（WEF）の2020年推計を日本に当てはめて環境省が試算した値で、いずれも2030年時点で増える機会額。うち4分の3以上が炭素中立・循環経済と強く関連する<br><br><b>答案に書くなら</b>　ネイチャーポジティブ移行による2030年のビジネス機会は、世界で年1,372兆円、日本では環境省試算で年47兆円と見込まれる。<br><br><b>関連</b>　世界では年約368兆円の投資が必要とされる。<br><br><b>答案での使い方</b>　Ⅱ-1の数字。世界と日本を書き分ける<br><br>【出典】<a href=\"https://www.env.go.jp/content/000298927.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ネイチャーポジティブ経済移行戦略｜制度】国の施策の4つの構成は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　①リスク・機会の認識②機会の特定・創出③開示・対話を通じた資金呼び込み④基盤環境整備（DX・研究開発）<br><br><b>解説</b>　国の施策は、認識、機会創出、資金呼び込み、基盤整備の順に企業の移行を後押しする構成<br><br><b>答案に書くなら</b>　国の施策は、リスク・機会の認識、機会の特定・創出、開示・対話を通じた資金呼び込み、DX・研究開発等の基盤環境整備の4つで構成される。<br><br><b>関連</b>　戦略の3本柱（ビジネス機会の具体例、押さえる要素、国の施策）とは別の整理。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。4段階で書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000298927.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ネイチャーポジティブ経済移行戦略｜課題】ネイチャーポジティブの課題を『技術・評価』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　自然資本への負荷を定量評価する指標・手法の整備が途上で、効果の見える化と、場所に紐づくデータが必要<br><br><b>解説</b>　自然資本は場所ごとに状態が異なるため、負荷を測る指標・手法の整備が追いついていない。効果の見える化と場所に紐づくデータが要る<br><br><b>答案に書くなら</b>　技術・評価の観点から、課題は自然資本への負荷を定量評価する指標・手法が途上で、効果の見える化と場所に紐づくデータが必要なことである。<br><br><b>関連</b>　評価手法の基本的な考え方を2026年3月に作成している。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000298927.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ネイチャーポジティブ経済移行戦略｜課題】ネイチャーポジティブの課題を『制度・運用』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　自然資本の保全・再生が他の課題より劣後されがち。経団連調査（2022年度）で25%の企業が事業との関連性がわからないと回答<br><br><b>解説</b>　自然資本の保全・再生は他の課題より後回しにされがちで、国外の自然資本への依存が大きく危機を感じにくい。企業の認識不足が背景にある<br><br><b>答案に書くなら</b>　制度・運用の観点から、課題は保全・再生が劣後されがちで、経団連調査（2022年度）で25%の企業が事業との関連性がわからないと回答したことである。<br><br><b>関連</b>　国外の自然資本への依存も課題に挙がる。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 企業認識の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000298927.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ネイチャーポジティブ経済移行戦略｜解決策】企業の取組を促す解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　TNFD等による開示の促進と、調達ガイドライン（2026年7月）・ネイチャーファイナンス実践ガイドライン（同9月）の普及<br><br><b>解説</b>　TNFDは自然関連の情報開示の枠組み。ガイドラインは調達と投融資それぞれの実践を示す任意の指針で、法的拘束力はない<br><br><b>答案に書くなら</b>　解決策として、TNFD等による開示を促し、調達ガイドライン（2026年7月）とネイチャーファイナンス実践ガイドライン（同9月）を普及させる。<br><br><b>関連</b>　TNFDアダプター企業数は日本が219社で世界最多（2026年3月）。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 開示・金融の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/pdf/full.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ネイチャーポジティブ経済移行戦略｜注意】年1,372兆円と年47兆円の違い、戦略と法律・ロードマップの関係は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　1,372兆円は世界、47兆円は日本。戦略は4省庁の戦略で法律ではなく、ロードマップは別文書<br><br><b>解説</b>　1,372兆円は世界、47兆円は日本で、母集団が違う。戦略は4省庁の戦略で法律ではなく、ロードマップは別の文書<br><br><b>答案に書くなら</b>　年1,372兆円は世界、年47兆円は日本の2030年のビジネス機会であり、戦略は法律ではなくロードマップは別文書である。<br><br><b>関連</b>　ロードマップは2025年7月の策定で、期間は2025-2030年。<br><br><b>答案での使い方</b>　数字は母集団とセットで書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000298927.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟｜時期】クマ類の指定管理鳥獣追加と緊急銃猟の規定はいつか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　クマ類（四国を除く）の追加は2024年4月。緊急銃猟の規定は令和7年法律第28号で、2025年9月1日施行<br><br><b>解説</b>　ヒグマ・ツキノワグマの分布が人の生活圏周辺まで拡大して人身被害が増え、ニホンジカ・イノシシに続き指定管理鳥獣に追加された。四国の個体群は絶滅のおそれから対象外<br><br><b>答案に書くなら</b>　クマ類は2024年4月に指定管理鳥獣に追加され、緊急銃猟の規定は2025年9月1日に施行済みである。<br><br><b>関連</b>　緊急銃猟の条文は鳥獣保護管理法第34条の2〜6。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで時期を示す。四国個体群は除く<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/414AC0000000088\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟｜定義】指定管理鳥獣とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　希少鳥獣以外で集中的かつ広域的な管理が必要として環境大臣が指定する鳥獣。都道府県または国が捕獲等事業を実施できる<br><br><b>解説</b>　希少鳥獣以外で、集中的かつ広域的な管理が必要な鳥獣を環境大臣が指定する仕組み。実施計画に位置付ければ、捕獲の禁止などの特例が受けられる<br><br><b>答案に書くなら</b>　指定管理鳥獣とは、集中的かつ広域的な管理が必要として環境大臣が指定する鳥獣で、都道府県または国が捕獲等事業を実施できる。<br><br><b>関連</b>　認定鳥獣捕獲等事業者制度とは別の制度。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/414AC0000000088\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟｜目標】クマ被害の現状を示す数字は？（令和7年度）", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　人身被害216件・被害者238人・死亡13人（速報値の年度計、いずれも過去最多）<br><br><b>解説</b>　クマの分布域は拡大し、ヒグマの推定個体数は令和5年度に12,180頭と30年間で2倍以上になった。被害の大きさが対策強化の根拠<br><br><b>答案に書くなら</b>　クマ被害は令和7年度に人身被害216件・被害者238人・死亡13人と、いずれも過去最多であり、対策の緊急性は高い。<br><br><b>関連</b>　数字は速報値の年度計で、年度途中の値とは単純比較できない。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 課題の大きさを示す数字に<br><br>【出典】<a href=\"https://www.env.go.jp/nature/choju/effort/effort12/effort12.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟｜制度】緊急銃猟の4要件は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　危険鳥獣の侵入（おそれ含む）、人の生命・身体への危害防止の緊急性、銃猟以外が困難、弾丸到達のおそれなし<br><br><b>解説</b>　緊急銃猟は市街地等での危険な状況に限り、市町村長の判断で銃猟を実施させる制度。住民の安全確保が前提のため要件が厳しい<br><br><b>答案に書くなら</b>　緊急銃猟は、危険鳥獣の侵入（おそれ含む）、人の生命・身体への危害防止の緊急性、銃猟以外が困難、弾丸到達のおそれなしの4要件をすべて満たす場合に実施できる。<br><br><b>関連</b>　ガイドラインは2025年7月に公表（2026年4月改訂）。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。4要件すべて必要と書く<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/414AC0000000088\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟｜制度】クマ被害対策ロードマップ（2026年3月）の2030年度目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　緊急対応体制の確保率100%、推定個体数・捕獲目標数の明確化率100%、ゾーニング管理計画の策定率100%<br><br><b>解説</b>　ロードマップは2030年度までの計画で、体制確保・個体数把握・ゾーニングの3点を自治体ごとに100%とする目標。恒常的生息域の自治体が対象<br><br><b>答案に書くなら</b>　クマ被害対策ロードマップは2030年度までに、緊急対応体制の確保率、推定個体数・捕獲目標数の明確化率、ゾーニング管理計画の策定率をいずれも100%とする。<br><br><b>関連</b>　策定は2026年3月27日。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。3つの100%<br><br>【出典】<a href=\"https://www.env.go.jp/nature/choju/reinforce/index.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟｜課題】クマ対策の課題を『技術・科学』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　個体数管理のため、統一的な手法による個体数推定と捕獲目標数の精緻化が必要<br><br><b>解説</b>　個体数の推定方法が地域でばらつくと、捕獲目標数を科学的に決められない。ロードマップは個体数調査・推定を東北から全国へ広げる方針<br><br><b>答案に書くなら</b>　技術・科学の観点から、課題は個体数管理のため統一的な手法による個体数推定と捕獲目標数の精緻化が必要なことである。<br><br><b>関連</b>　統一的な個体数推定はクマ被害対策パッケージ（2025年11月）にも含まれる。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/council/content/i_09/000378789.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟｜解決策】出没防止と緊急対応の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　誘引物（放任果樹等）の管理、はこわな・電気柵の整備、ゾーニング管理計画の作成支援、緊急銃猟の体制整備<br><br><b>解説</b>　被害を減らすには、人里に引き寄せない出没防止と、出没時の緊急対応の両面が要る。ゾーニングは人とクマの生息域を分けて管理する考え方<br><br><b>答案に書くなら</b>　解決策として、放任果樹等の誘引物の管理、はこわな・電気柵の整備、ゾーニング管理計画の作成支援、緊急銃猟の体制整備を進める。<br><br><b>関連</b>　人材面ではガバメントハンターの人件費支援や捕獲技術者の養成がある。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 自治体施策の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/nature/choju/reinforce/index.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟｜注意】緊急銃猟を実施させる主体は誰か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　市町村長（都道府県ではない）。通行制限・避難指示、応援要請、損失補償も市町村長が行う<br><br><b>解説</b>　緊急銃猟は住民に最も近い市町村長が迅速に判断する仕組み。都道府県は応援要請を受ける側で、実施主体ではない<br><br><b>答案に書くなら</b>　緊急銃猟を実施させる主体は市町村長であり、通行制限・避難指示、都道府県知事への応援要請、損失補償も市町村長が行う。<br><br><b>関連</b>　4要件はすべて満たす必要がある。<br><br><b>答案での使い方</b>　実施主体の取り違えは減点<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/414AC0000000088\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜時期】外来生物法の2022年改正の公布と施行はいつか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　2022年5月18日公布。2022年7月1日に規制権限の拡充、2023年4月1日にその他が施行（全面施行済み）<br><br><b>解説</b>　ヒアリの侵入防止強化と、広く飼育されるアカミミガメ等への規制手法の整備が改正の柱。施行は2段階で、全面施行済み<br><br><b>答案に書くなら</b>　外来生物法の2022年改正は同年5月18日に公布され、2022年7月に規制権限の拡充、2023年4月にその他が施行され、全面施行済みである。<br><br><b>関連</b>　ヒアリ類の指定は2023年4月1日、対処指針の施行は同6月1日。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで施行済みと示す。2段階を落とさない<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/416AC0000000078\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜定義】要緊急対処特定外来生物とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　まん延すると著しく重大な被害が生じ、発見時に検査・防除等を緊急に行う必要があるものとして政令で定める生物。ヒアリ類を指定<br><br><b>解説</b>　特定外来生物の中でも、まん延すると著しく重大な被害が出て、発見時に緊急対応が要る種を政令で指定する区分。ヒアリを含むトフシアリ属4種群と交雑種が該当<br><br><b>答案に書くなら</b>　要緊急対処特定外来生物とは、まん延すると著しく重大な被害が生じ、発見時に検査・防除等を緊急に行う必要があるとして政令で定める生物で、ヒアリ類が指定されている。<br><br><b>関連</b>　ヒアリは特定外来生物でもある。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/416AC0000000078\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜制度】要緊急対処特定外来生物の主務大臣の権限は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　通関後も物品・土地・施設への立入検査、消毒・廃棄命令、移動の制限・禁止命令ができる<br><br><b>解説</b>　通常の特定外来生物では通関後の検査権限が弱いため、要緊急対処種については主務大臣の権限を強めた。水際で止めきれない場合の備え<br><br><b>答案に書くなら</b>　要緊急対処特定外来生物については、主務大臣が通関後も物品等・土地・施設への立入検査、消毒・廃棄命令、移動の制限・禁止命令を行える。<br><br><b>関連</b>　事業者向けの対処指針（ヒアリ類に係る対処指針）に従わない場合は勧告・命令の対象。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。水際強化の根拠<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/416AC0000000078\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜制度】条件付特定外来生物とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　アカミミガメとアメリカザリガニ（2023年6月指定）。家庭での飼養と少数への無償譲渡は適用除外。販売・購入・放出は原則禁止<br><br><b>解説</b>　アカミミガメ（幼体はミドリガメ）とアメリカザリガニは全国に定着し家庭で広く飼育されているため、通常の全面禁止とは別の線引きにした<br><br><b>答案に書くなら</b>　条件付特定外来生物はアカミミガメとアメリカザリガニの2種で、家庭での飼養と少数への無償譲渡は適用除外とし、販売・購入・野外放出は原則禁止である。<br><br><b>関連</b>　指定は2023年6月1日。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。規制の線引きを書く<br><br>【出典】<a href=\"https://www.env.go.jp/nature/intro/2outline/regulation/jokentsuki.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜課題】条件付き規制にした理由（課題）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　全て禁止にすると手続きの負担から野外放出が増えるおそれがある。終生飼養と放出禁止の周知が必要<br><br><b>解説</b>　全面禁止にすると手続きの負担を嫌った飼育者が野外に放出するおそれがある。そのため、飼育は認めつつ放出を禁じる設計にした<br><br><b>答案に書くなら</b>　制度・運用の観点から、課題は全て禁止にすると手続きの負担から野外放出が増えるおそれがあり、終生飼養と放出禁止を周知する必要があることである。<br><br><b>関連</b>　被害予防三原則は「入れない・捨てない・拡げない」。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 制度・運用の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/nature/intro/2outline/regulation/jokentsuki.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜課題】ヒアリ対策の課題を『技術・水際』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　輸入品に付着して非意図的に侵入する生物が増え、ヒアリの確認は2025年度に36件で過去最多。探知・検査の高度化が要る<br><br><b>解説</b>　ヒアリは輸入品に付着して非意図的に侵入する。2017年の初確認以降、毎年港湾等で発見され、2025年度は確認件数が過去最多となった<br><br><b>答案に書くなら</b>　技術・水際の観点から、課題は輸入品に付着して侵入する生物が増え、ヒアリの確認が2025年度に36件と過去最多で、探知・検査の高度化が要ることである。<br><br><b>関連</b>　累計は20都道府県で171事例（2025年度時点）。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 水際の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/pdf/full.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜解決策】水際対策の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　全国65港湾でのモニタリング・駆除と、ヒアリ探知犬など新たな対策技術の実証<br><br><b>解説</b>　港湾はヒアリの主な侵入口で、定期的なモニタリングと駆除で定着を防ぐ。探知犬など新しい技術の実証は令和8年度の取組<br><br><b>答案に書くなら</b>　解決策として、全国65港湾でのモニタリング・駆除と、ヒアリ探知犬など新たな対策技術の実証を進める。<br><br><b>関連</b>　環境省ウェブサイトとコールセンターで規制内容や終生飼養を周知する。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 水際施策の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/pdf/full.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正｜注意】条件付特定外来生物は、法律上、特定外来生物ではないのか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　特定外来生物のまま。適用除外は飼養・譲渡しの一部で、放出・輸入・販売・頒布・購入は原則禁止のまま<br><br><b>解説</b>　条件付特定外来生物は特定外来生物の一部規制を種ごとに適用除外としたもので、特定外来生物の地位は変わらない。放出・輸入・販売等は禁止のまま<br><br><b>答案に書くなら</b>　条件付特定外来生物も法律上は特定外来生物であり、適用除外は飼養・譲渡しの一部に限られ、放出・輸入・販売・頒布・購入は原則禁止である。<br><br><b>関連</b>　アメリカザリガニ以外の外国産ザリガニは全種が通常の特定外来生物。<br><br><b>答案での使い方</b>　「規制対象外」と書くと減点<br><br>【出典】<a href=\"https://www.env.go.jp/nature/intro/2outline/regulation/jokentsuki.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜時期】PFOS・PFOAの水質基準化はいつか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　2025年6月30日公布、2026年4月1日施行（施行済み）。水質基準52項目の1つとなった<br><br><b>解説</b>　PFOS・PFOAは2020年に水質管理目標設定項目（暫定目標値50ng/L）だったが、食品安全委員会の2024年6月の評価を踏まえ水質基準へ格上げされた。施行日は対応期間を確保するため公布から遅らせた<br><br><b>答案に書くなら</b>　PFOS・PFOAは2025年6月30日に公布、2026年4月1日に施行済みの水質基準52項目の1つである。<br><br><b>関連</b>　改正は水道法に基づく省令で、告示ではない。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで施行済みと示す<br><br>【出典】<a href=\"https://www.env.go.jp/content/000334172.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜定義】PFOS・PFOAとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　有機フッ素化合物（PFAS）の一種。化学的に極めて安定で難分解性。化審法で原則製造・輸入禁止（第一種特定化学物質）<br><br><b>解説</b>　PFASは有機フッ素化合物の総称。PFOS・PFOAは分解されにくく環境に長く残るため、化審法で原則製造・輸入が禁止されている<br><br><b>答案に書くなら</b>　PFOS・PFOAは化学的に極めて安定で難分解性のPFASの一種であり、化審法の第一種特定化学物質として原則製造・輸入が禁止されている。<br><br><b>関連</b>　PFOSは2010年、PFOAは2021年に第一種特定化学物質に指定。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://www.env.go.jp/water/pfas/faq003.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜制度】PFOS・PFOAの水道水質基準値は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　PFOSとPFOAの合算で50ng/L（0.00005mg/L）以下。水道事業者等に遵守・検査の義務がある<br><br><b>解説</b>　基準値は食品安全委員会のTDIから算出。PFOS・PFOAは同じ影響を指標とし同時に検出されるため、安全側に合算で50ng/Lとした<br><br><b>答案に書くなら</b>　水道水質基準はPFOSとPFOAの合算で50ng/L（0.00005mg/L）以下であり、水道事業者等に遵守・検査の義務がある。<br><br><b>関連</b>　検査は原則3か月に1回で、簡易水道・専用水道には頻度の特例がある。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の数字。合算と単位を書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000334172.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜制度】公共用水域・地下水のPFOS・PFOAの扱いは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　環境基準ではなく要監視項目の指針値（50ng/L合算）。2025年6月に「暫定」を外した<br><br><b>解説</b>　水道水は水道法の水質基準で義務があるが、公共用水域・地下水は環境基準ではなく、知見の集積を続ける要監視項目として指針値を置く<br><br><b>答案に書くなら</b>　公共用水域・地下水のPFOS・PFOAは環境基準ではなく要監視項目の指針値（合算50ng/L）であり、遵守義務のある水道水質基準とは位置づけが異なる。<br><br><b>関連</b>　2025年6月30日に「指針値（暫定）」の「暫定」を外した（値は同じ）。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。水道水との違いを書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000405361.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜課題】PFOS対策の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　濃度低減の対策技術の知見の充実が必要。使用済み活性炭の不適切な保管から流出した事案もあり、活性炭の管理が課題<br><br><b>解説</b>　浄水に使う活性炭はPFOS等を吸着するが、使用済みの活性炭の管理が不適切だと再び流出する。濃度を下げる対策技術の知見も十分でない<br><br><b>答案に書くなら</b>　技術の観点から、課題は濃度低減の対策技術の知見の充実が必要で、使用済み活性炭の不適切な保管から流出した事案もあり活性炭の管理が課題である。<br><br><b>関連</b>　環境省は実証事業を行い、対策技術集を公表している。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000405361.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜課題】PFOS対策の課題を『制度』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　PFOS・PFOA以外のPFASは毒性評価が定まらず、要検討項目に据え置かれている<br><br><b>解説</b>　PFASには多くの種類があるが、毒性評価が定まった物質は限られる。評価が定まらない物質は基準にできず、要検討項目に据え置かれる<br><br><b>答案に書くなら</b>　制度の観点から、課題はPFOS・PFOA以外のPFASは毒性評価が定まらず、要検討項目に据え置かれていることである。<br><br><b>関連</b>　2025年6月30日にPFHxSに加え7物質を要検討項目に追加し、計8物質となった。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 制度の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000405361.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜解決策】PFOS低減の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　対策技術の実証事業と対策技術集の活用、使用済み活性炭の適正な保管・取扱いの周知<br><br><b>解説</b>　低減対策は技術面（実証・技術集）と運用面（活性炭の保管・取扱い）の両方から進める。自治体には対応の手引き（第3版）も通知されている<br><br><b>答案に書くなら</b>　解決策として、対策技術の実証事業と対策技術集の活用を進め、使用済み活性炭の適正な保管・取扱いを周知する。<br><br><b>関連</b>　「PFOS及びPFOAに関する対応の手引き（第3版）」は2026年6月5日に通知。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 技術面の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000405361.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化｜注意】50ng/Lは基準化で変わった値か？合算か個別か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　値は暫定目標値から変わらず、変わったのは位置づけ（義務のある基準へ）。PFOSとPFOAの合算<br><br><b>解説</b>　基準化は、暫定目標値だった50ng/Lを守る義務のある水質基準に格上げしたもの。値を厳しくしたのではない<br><br><b>答案に書くなら</b>　50ng/Lは暫定目標値から変わらず、変わったのは義務のある基準へという位置づけで、PFOSとPFOAの合算値である。<br><br><b>関連</b>　食品安全委員会のTDIは両物質とも20ng/kg/日。<br><br><b>答案での使い方</b>　「基準値が厳しくなった」と書くと減点<br><br>【出典】<a href=\"https://www.env.go.jp/content/000334172.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準｜時期】底層溶存酸素量はいつ環境基準になり、類型指定はどこまで進んだか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　2016年3月に生活環境項目に追加。琵琶湖・東京湾（2021年）、伊勢湾・大阪湾（2022年）、霞ケ浦等（2024年）を指定<br><br><b>解説</b>　従来の環境基準だけでは湖底の貧酸素化や魚介類の減少が伝わりにくいとの指摘から、2015年12月の中環審答申を受けて導入された。国が県際水域から類型指定を進める<br><br><b>答案に書くなら</b>　底層溶存酸素量は2016年3月に生活環境項目に追加され、琵琶湖・東京湾（2021年）、伊勢湾・大阪湾（2022年）、霞ケ浦等（2024年）で類型指定が進んだ。<br><br><b>関連</b>　複数県にまたがる水域は国が指定する。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで時期と実績を示す<br><br>【出典】<a href=\"https://www.env.go.jp/press/102287.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準｜定義】底層溶存酸素量とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　魚介類等の生息や藻場等の生育への直接的な影響を判断できる指標。底層を利用する生物の生息・再生産に重要<br><br><b>解説</b>　水底付近の酸素が不足する貧酸素化は、底を利用する魚介類や藻場に直接影響する。底層の酸素量はその影響を直接判断できる指標<br><br><b>答案に書くなら</b>　底層溶存酸素量とは、魚介類等の生息や藻場等の生育への直接的な影響を判断できる指標であり、底層を利用する生物の生息・再生産に重要である。<br><br><b>関連</b>　同時期の沿岸透明度は環境基準ではなく、地域が設定する目標。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://www.env.go.jp/press/102287.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準｜制度】底層溶存酸素量の3つの類型と基準値は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　生物1は4.0mg/L以上、生物2は3.0mg/L以上、生物3は2.0mg/L以上（日間平均値）<br><br><b>解説</b>　生物の貧酸素への耐性に応じて、守る水域の目的を3段階に分けた。数字が小さい類型ほど耐性の低い生物を守る<br><br><b>答案に書くなら</b>　類型は生物1が4.0mg/L以上、生物2が3.0mg/L以上、生物3が2.0mg/L以上（いずれも日間平均値）で、耐性の低い生物の場ほど厳しい値である。<br><br><b>関連</b>　生物3は耐性の高い生物の場、または無生物域を解消する水域。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の数字。類型と値を対で書く<br><br>【出典】<a href=\"https://www.env.go.jp/press/102287.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準｜制度】大阪湾の底層溶存酸素量の類型指定の範囲は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　湾奥部のみ（生物3）。湾全域ではない。東京湾などは水域ごとに生物1〜3が混在<br><br><b>解説</b>　類型は水域ごとに指定するため、同じ湾の中でも区域により類型が異なる。大阪湾は湾奥部だけで、東京湾や伊勢湾は複数の類型が混在する<br><br><b>答案に書くなら</b>　大阪湾の類型指定は湾奥部のみ（生物3）であり、湾全域ではなく、東京湾などでは水域ごとに生物1〜3が混在する。<br><br><b>関連</b>　伊勢湾は名古屋港が生物2、伊勢湾央部が生物3、その他が生物1。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。指定は水域ごと<br><br>【出典】<a href=\"https://www.env.go.jp/press/110371.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準｜課題】底層の貧酸素化の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　湖沼では底質からの栄養塩溶出（内部負荷）や鉄・マンガン溶出による水道水の障害にもつながり、要因解析と対策技術の選定が要る<br><br><b>解説</b>　湖沼では底層の酸素が減ると底質から栄養塩が溶け出し（内部負荷）、さらに鉄・マンガンの溶出が水道水の障害にもなる。原因解析をして対策を選ぶ必要がある<br><br><b>答案に書くなら</b>　技術の観点から、課題は底層の貧酸素化が内部負荷や鉄・マンガンの溶出による水道水の障害にもつながり、要因解析と対策技術の選定が必要なことである。<br><br><b>関連</b>　湖沼の対策の手引き（2020年3月）が対策を整理している。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/900544873.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準｜解決策】貧酸素化の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　外部負荷削減に加え、内部負荷削減（浚渫・覆砂）と、曝気・酸素水供給による底層への酸素供給を組み合わせる<br><br><b>解説</b>　外部負荷（流入する汚濁）の削減だけでは底質に溜まった栄養塩の溶出は止まらないため、内部負荷の削減と底層への酸素供給を組み合わせる<br><br><b>答案に書くなら</b>　解決策として、外部負荷削減に加え、浚渫・覆砂による内部負荷削減と、曝気・酸素水供給による底層への酸素供給を組み合わせる。<br><br><b>関連</b>　対策の選定は水域の特性、改善目標、費用を踏まえ、副次的な影響にも留意する。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 水環境の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/900544873.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準｜注意】底層溶存酸素量の基準値は何の値か？どの類型が最も厳しいか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　日間平均値。生物1（4.0mg/L以上）が最も厳しい。1つの湾・湖でも類型は混在する<br><br><b>解説</b>　基準は1日の平均値で評価する。類型は守る生物の耐性で決まり、数値が大きい生物1が最も厳しい。1つの水域に複数類型が混在する<br><br><b>答案に書くなら</b>　底層溶存酸素量の基準値は日間平均値であり、生物1（4.0mg/L以上）が最も厳しく、1つの湾・湖でも類型は混在する。<br><br><b>関連</b>　令和8年度の方針で、達成率と達成期間の目標を設定するとされる。<br><br><b>答案での使い方</b>　基準値の種類と類型の取り違えは減点<br><br>【出典】<a href=\"https://www.env.go.jp/press/102287.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜時期】プラスチック汚染条約は成立したか？交渉の現状は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　未成立。2022年のUNEA5.2決議でINCを設置したが、2024年末の策定目標は未達。INC5.4は2027年3月に開催予定<br><br><b>解説</b>　プラスチック汚染は国境を越えるため、世界全体で対策が必要。UNEA5.2の決議でINCを設置して条約策定の交渉が続いている<br><br><b>答案に書くなら</b>　プラスチック汚染条約は未成立であり、2024年末の策定目標は未達のまま、INC5.4が2027年3月に開催予定である。<br><br><b>関連</b>　INC5は「INC5.1」とも呼ばれ、5.2・5.3は同じ第5回の再開会合。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで「交渉中」と示す<br><br>【出典】<a href=\"https://www.env.go.jp/water/inc.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜定義】大阪ブルー・オーシャン・ビジョンとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　2019年のG20大阪サミットで共有された、2050年までに海洋プラごみによる追加的な汚染をゼロにする目標。日本が提唱<br><br><b>解説</b>　日本が提唱し、2019年のG20大阪サミットで共有された目標。条約交渉でも日本が積極的に関わる根拠になる<br><br><b>答案に書くなら</b>　大阪ブルー・オーシャン・ビジョンとは、2050年までに海洋プラスチックごみによる追加的な汚染をゼロにする目標で、日本が提唱国である。<br><br><b>関連</b>　2023年G7広島サミットでは2040年までにゼロにする野心にコミット。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し・日本の取組の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_02873.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜課題】条約交渉の課題を『制度・運用』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　INC5.2（2025年8月）で、生産、プラスチック製品（第4条）、資金（第10条）は各国の意見の隔たりが大きく合意に至らなかった<br><br><b>解説</b>　INC5.2では条文交渉は進んだが、生産・製品・資金など利害の対立が大きい論点は合意できなかった。国際制度づくりが課題<br><br><b>答案に書くなら</b>　制度・運用の観点から、課題はINC5.2（2025年8月）で生産、プラスチック製品（第4条）、資金（第10条）の意見の隔たりが大きく、合意に至らなかったことである。<br><br><b>関連</b>　製品設計（第5条）や廃棄物管理（第7条）などは文言交渉が進展した。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 国際制度の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/water/inc.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜課題】条約実施の課題を『経済・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　途上国の廃棄物管理の能力構築とインフラ整備が必要。日本は人材育成（2025年までに1万人）等を表明している<br><br><b>解説</b>　条約を実施するには各国の廃棄物管理が前提で、途上国は能力とインフラが不足しがち。日本は人材育成で支援を表明している<br><br><b>答案に書くなら</b>　経済・担い手の観点から、課題は途上国の廃棄物管理の能力構築とインフラ整備が必要なことで、日本は人材育成（2025年までに1万人）等を表明している。<br><br><b>関連</b>　日本の支援の枠組みはマリーン・イニシアティブ。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 国際協力の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/council/content/i_03/000433372.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜解決策】途上国支援の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　ASEAN各国を中心とした国別行動計画の策定支援、海洋ごみモニタリング能力の強化、地域ナレッジセンターの設置<br><br><b>解説</b>　国別行動計画は各国が自国の対策を定める計画。モニタリング能力の強化と地域ナレッジセンターは、海洋ごみの実態把握と知見共有を支える<br><br><b>答案に書くなら</b>　解決策として、ASEAN各国を中心とした国別行動計画の策定支援、海洋ごみモニタリング能力の強化、地域ナレッジセンターの設置を進める。<br><br><b>関連</b>　条約の国別計画は第13条で定める。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 国際協力の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/council/content/i_03/000433372.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜解決策】国内でできる解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　プラスチック資源循環促進法による設計・使用の合理化・回収・再資源化と、海洋プラごみの回収・流出防止を進める<br><br><b>解説</b>　国内対策は条約とは別の枠組みで、国内法で設計から回収・再資源化まで進める。海洋への流出の防止も並行して行う<br><br><b>答案に書くなら</b>　国内の解決策として、プラスチック資源循環促進法による設計・使用の合理化・回収・再資源化と、海洋プラスチックごみの回収・流出防止を進める。<br><br><b>関連</b>　条約は法的拘束力のある国際文書で、国内法とは別。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 国内施策の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/council/content/i_03/000433372.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜注意】「2050年ゼロ」と「2040年ゼロ」は同じ目標か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　別。2050年は大阪ブルー・オーシャン・ビジョン（2019年）、2040年は2023年G7広島サミットでの野心<br><br><b>解説</b>　2050年は日本が提唱した大阪ブルー・オーシャン・ビジョン（2019年）、2040年はG7広島サミット（2023年）の野心で、出どころも年次も別<br><br><b>答案に書くなら</b>　2050年ゼロは大阪ブルー・オーシャン・ビジョン、2040年ゼロは2023年G7広島サミットの野心であり、別の目標である。<br><br><b>関連</b>　大阪ブルー・オーシャン・ビジョンは追加的な汚染をゼロにする目標。<br><br><b>答案での使い方</b>　年次の取り違えは減点<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_02873.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）｜注意】INC5.3（2026年2月）では条文交渉をしたか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><b
