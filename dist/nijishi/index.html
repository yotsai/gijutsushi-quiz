nv.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜目標】30by30は国家戦略のどの目標に位置づく？その内容は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　行動目標1-1。2030年までに陸と海の30%以上を保護地域・OECMで保全<br><br><b>解説</b>　30by30は国家戦略全体の名称ではなく、行動目標1-1として位置づく国際目標の一つ。2030年までに陸と海それぞれの30%以上を保護地域とOECMで保全する<br><br><b>答案に書くなら</b>　生態系保全の観点から、行動目標1-1の30by30に基づき、2030年までに陸と海の30%以上を保護地域・OECMで保全することが解決策の到達点である。<br><br><b>関連</b>　ネイチャーポジティブは2030年に目指す状態で、30by30はその指標・手段である。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の到達点に。戦略そのものではない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜目標】中間評価（2026年2月）の保護地域・OECM占有率は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　陸域21.0%（2025年時点）、海域13.3%（2021年以降変化なし）。目標は各30%<br><br><b>解説</b>　中間評価（2026年2月公表）では、保護地域とOECMが占める割合は陸域21.0%（2025年時点、2023年3月は20.5%）、海域13.3%（2021年以降変化なし）で、目標30%との差が大きい。特に海域は停滞している<br><br><b>答案に書くなら</b>　生態系保全の観点から、保護地域・OECMの割合は陸域21.0%、海域13.3%にとどまり、目標30%との差を埋めることが課題である。<br><br><b>関連</b>　陸域は20.5%から微増、海域は2021年以降変化がなく、海域の停滞が目立つ。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 目標との差で課題の大きさを示す<br><br>【出典】<a href=\"https://www.env.go.jp/content/000379260.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜柱】国家戦略の基本戦略1〜3は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　①生態系の健全性の回復、②自然を活用した社会課題の解決、③ネイチャーポジティブ経済の実現<br><br><b>解説</b>　基本戦略1は生息地の保全とネットワーク化、2は自然を活用した社会課題の解決、3は経済への自然資本の内部化に当たる。R6 Ⅰ-1ではこの3つの基本戦略が問われた<br><br><b>答案に書くなら</b>　解決策として、生態系の健全性の回復、自然を活用した社会課題の解決、ネイチャーポジティブ経済の実現の3つの基本戦略に沿って対策を進めることが有効である。<br><br><b>関連</b>　基本戦略は全部で5つで、4と5は暮らしの行動変容と基盤整備・国際連携である。<br><br><b>答案での使い方</b>　R6 Ⅰ-1の3戦略。解決策の方向を国の言葉で言う<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜柱】基本戦略4と5は？また目標の構成数は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　4：生活・消費活動での価値の認識と行動、5：基盤整備と国際連携。5基本戦略・15状態目標・25行動目標<br><br><b>解説</b>　基本戦略4は国民一人一人の行動変容を促す普及啓発・場づくり、5は生物多様性に係る取組を支える基盤整備（モニタリング基盤等）と国際連携である。戦略は全体で5つの基本戦略・15の状態目標・25の行動目標から成る<br><br><b>答案に書くなら</b>　解決策として、基本戦略4の生活・消費活動での価値の認識と行動、基本戦略5の基盤整備と国際連携を組み合わせて進めることが有効である。<br><br><b>関連</b>　R6 Ⅰ-1で問われた3戦略は全体の一部なので、設問の範囲を確認する。<br><br><b>答案での使い方</b>　3戦略は全体の一部。設問の範囲を確認する<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜課題】30by30達成の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　OECMとして整理できる区域を見極める評価手法が未確立で、自然共生サイトの認定基準・モニタリング手法の標準化が課題<br><br><b>解説</b>　OECMは法的な保護地域以外で生物多様性の保全に資する管理が行われている区域。保護地域の拡張だけでは30%に届かないため、OECMを見極める評価手法と、自然共生サイトの認定基準・モニタリング手法の標準化が要る<br><br><b>答案に書くなら</b>　技術の観点から、OECMとして整理できる区域を見極める評価手法が未確立であり、自然共生サイトの認定基準・モニタリング手法の標準化が課題である。<br><br><b>関連</b>　自然共生サイトは日本版OECMで、国際データベース（Protected Planet）に登録される。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜課題】ネイチャーポジティブ経営の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　自然資本の損失の外部不経済を価格に反映する経済的手法が実証段階にとどまり、民間資金の誘導が不十分<br><br><b>解説</b>　自然資本の損失は外部不経済で、価格に反映されにくい。OECM認定地の環境価値の売買や税制優遇などの経済的手法が調査・実証段階にとどまるため、民間資金の誘導が不十分になる<br><br><b>答案に書くなら</b>　経済・資金の観点から、自然資本の損失の外部不経済を価格に反映する経済的手法が実証段階にとどまり、ネイチャーポジティブ経営への民間資金の誘導が不十分であることが課題である。<br><br><b>関連</b>　解決策の側ではTNFDによる情報開示とESG金融で自然資本を経済に内部化する。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜課題】里山・森林の保全の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　森林・農地・里山の管理の担い手が不足し、担い手の確保・育成と地域主体の取組を支えるインセンティブ設計が必要<br><br><b>解説</b>　森林・農地・里山の保全活動は、管理の担い手不足に直面している。担い手の確保・育成と、地域主体の取組を支えるインセンティブ設計がないと、保全活動を持続できない<br><br><b>答案に書くなら</b>　人材・担い手の観点から、森林・農地・里山の管理の担い手不足に対し、担い手の確保・育成と地域主体の取組を支えるインセンティブ設計が必要であることが課題である。<br><br><b>関連</b>　鳥獣との軋轢緩和など、農林水産業被害の防止と生態系保全の利害調整も地域の課題である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 人材・担い手の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜解決策】民間の取組を生かす30by30の解決策を、専門用語で言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　自然共生サイト（日本版OECM）で、民間等が保全する区域を国が認定し、国際データベースに登録する<br><br><b>解説</b>　自然共生サイトは、民間等の取組で生物多様性が保全されている区域を国が認定する制度で、日本版OECMとして国際データベースに登録される。民間の土地を30by30の達成に取り込む手段になる<br><br><b>答案に書くなら</b>　解決策として、自然共生サイトにより民間等が保全する区域を国が認定し、日本版OECMとして国際データベースに登録して30by30の達成に寄与させることが有効である。<br><br><b>関連</b>　有志の企業・自治体が取組を促す生物多様性のための30by30アライアンスも枠組みとして使える。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 30by30の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜解決策】企業の自然資本対応の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　TNFDによる自然関連リスク・機会の情報開示を促し、ESG金融と結び付けてネイチャーポジティブ経済へ移行する<br><br><b>解説</b>　TNFDは、企業・金融機関が自然資本・生物多様性に関するリスクと機会を評価して開示する国際的な民間主導の枠組み。開示を促してESG金融と結び付けると、資金がネイチャーポジティブ経営へ流れる<br><br><b>答案に書くなら</b>　経済の観点から、TNFDによる自然関連リスク・機会の情報開示を促し、ESG金融と結び付けてネイチャーポジティブ経済へ移行することが解決策である。<br><br><b>関連</b>　SBTs for Natureも企業が自然資本の科学に基づく目標を設定する民間主導の枠組みで、リスクは情報開示コストが中小企業に偏ることである。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 経済面の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜解決策】社会課題と自然保全を両立する解決策を、専門用語で言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　グリーンインフラや生態系ネットワークで、防災・気候変動対応と生物の移動・遺伝的多様性の維持を両立する<br><br><b>解説</b>　グリーンインフラは自然の多様な機能を活用する国土・都市・地域づくりの考え方、生態系ネットワークは森・里・川・海をつなぎ生物の移動や遺伝的多様性を支える国土構造である。防災や気候変動対応と保全を両立させる<br><br><b>答案に書くなら</b>　解決策として、グリーンインフラや生態系ネットワークにより、防災・気候変動対応と生物の移動・遺伝的多様性の維持を両立することが有効である。<br><br><b>関連</b>　ネットワークの連結性向上は、鳥獣の生息域拡大や外来種の拡散という負の波及効果を伴うため、個体群管理や防除の強化が要る。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 自然活用の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜リスク】30by30を急ぐリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：住民のなりわいとの調整不足で反発を招く。対策：自然共生サイト認定や保護地域拡張時に事前協議プロセスを制度化する<br><br><b>解説</b>　30by30で保護地域やOECMの指定を急ぐと、土地利用やなりわいとの調整が不十分なまま進み、地元の反発を招く。事前協議のプロセスを制度化しておけば、合意形成を図りながら拡張できる<br><br><b>答案に書くなら</b>　リスクとして、30by30の指定を急ぐと住民のなりわいとの調整不足で反発を招くおそれがあり、自然共生サイト認定や保護地域拡張の際に事前協議プロセスを制度化する必要がある。<br><br><b>関連</b>　中小企業へのTNFD対応コストの偏りも別のリスクで、国が段階的な導入支援や人材育成で後押しする。<br><br><b>答案での使い方</b>　必須Ⅰ(3) 合意形成のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜リスク】不適正な再エネ導入がもたらすリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：生態系への悪影響で脱炭素と保全がトレードオフに。対策：環境影響評価とゾーニング、地域共生型再エネの導入<br><br><b>解説</b>　再エネ設備の不適正な導入は、自然生態系に悪影響を及ぼし、脱炭素と生物多様性保全がトレードオフになる。環境影響評価やゾーニング（環境保全・事業性・社会的調整の情報の重ね合わせ）で適地を選び、地域共生型の導入を進める<br><br><b>答案に書くなら</b>　リスクとして、不適正な再エネ導入が生態系に悪影響を及ぼし脱炭素と保全がトレードオフになるおそれがあり、環境影響評価とゾーニング、地域共生型の再エネ導入で対応する必要がある。<br><br><b>関連</b>　第六次環境基本計画でも、洋上・陸上風力の環境配慮の制度検討が同様のリスク対策に挙げられる。<br><br><b>答案での使い方</b>　必須Ⅰ(3) 再エネとの両立のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜注意】OECMと自然共生サイトの違いは？また30by30は戦略の別名か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　OECMは国際的な保全区分、自然共生サイトは国が認定する日本版。30by30は目標の一つで戦略の別名ではない<br><br><b>解説</b>　OECMは国際的な保全区分の考え方、自然共生サイトはその日本版として国が認定する具体の制度。30by30は国家戦略が掲げる目標の一つで、戦略の別名ではなく、ネイチャーポジティブも戦略の別名ではない<br><br><b>答案に書くなら</b>　OECMは国際的な保全区分で、自然共生サイトはその日本版として国が認定する制度であり、両者を書き分ける。<br><br><b>関連</b>　ネイチャーポジティブは戦略が目指す2030年の状態を指す概念である。<br><br><b>答案での使い方</b>　定義の書き分けで減点を避ける<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜時期】第五次循環型社会形成推進基本計画が閣議決定されたのはいつ（何年何月）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2024年8月（2日）。副題は「循環経済を国家戦略に」<br><br><b>解説</b>　2024年8月2日に閣議決定された計画で、根拠は循環型社会形成推進基本法第15条。副題は「循環経済を国家戦略に」で、旧計画（第四次）と区別して最新版であることを示す<br><br><b>答案に書くなら</b>　本計画は2024年8月に閣議決定された第五次循環型社会形成推進基本計画であり、循環経済を国家戦略に位置づけている。<br><br><b>関連</b>　根拠法は環境基本法や生物多様性基本法ではなく、循環型社会形成推進基本法である。<br><br><b>答案での使い方</b>　書き出しで最新版を明示。第四次と取り違えない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜目標】2030年度の資源生産性・資源消費量・最終処分量の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　資源生産性約60万円/t、一人当たり天然資源消費量約11t/人・年、最終処分量約1,100万t/年<br><br><b>解説</b>　資源生産性はGDP等を天然資源等投入量で割った指標で、少ない資源でどれだけ稼ぐかを示す。一人当たり天然資源消費量はマテリアルフットプリントと呼ぶ。最終処分量は埋立てに回る廃棄物の量で、いずれも2030年度が目標年次<br><br><b>答案に書くなら</b>　環境の観点から、2030年度に資源生産性約60万円/トン、一人当たり天然資源消費量約11トン/人・年、最終処分量約1,100万トン/年を目指す必要がある。<br><br><b>関連</b>　目標年次は2030年度で、他計画の2040年度などと混同しない。<br><br><b>答案での使い方</b>　必須Ⅰ(1)(2) 現状との差と到達点の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜目標】2030年度の循環利用率と再生資源の投入割合の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　入口側約19%、出口側約44%。再生可能資源・循環資源の投入割合は約34%<br><br><b>解説</b>　入口側は資源の投入段階（天然資源に対する再生資源の割合）、出口側は廃棄物等の発生段階（廃棄物等のうち循環利用に回る割合）の循環利用率を指す。2030年度に入口側約19%、出口側約44%を目指し、再生可能資源・循環資源の投入割合は約34%とする<br><br><b>答案に書くなら</b>　環境の観点から、2030年度に入口側循環利用率約19%、出口側約44%、再生可能資源・循環資源の投入割合約34%を目指す。<br><br><b>関連</b>　入口側と出口側の数字を逆に書かない。<br><br><b>答案での使い方</b>　入口と出口の数字を取り違えない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜目標】循環経済関連ビジネスの市場規模目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2030年までに80兆円以上、2050年に120兆円（2020年は約50兆円）<br><br><b>解説</b>　循環経済関連ビジネスの市場規模は2000年の約40兆円から2020年に約50兆円へ拡大した。成長戦略フォローアップ工程表のKPIを踏襲し、2030年までに80兆円以上、2050年に120兆円を目標とする<br><br><b>答案に書くなら</b>　経済の観点から、循環経済関連ビジネスの市場規模を2020年の約50兆円から2030年までに80兆円以上へ拡大することが解決策の到達点である。<br><br><b>関連</b>　市場規模の目標年は2030年「度」ではなく「年」の表記で、2050年は120兆円である。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 経済面の解決策の到達点に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜柱】第五次循環基本計画の5つの重点分野は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　①循環経済への移行②事業者間連携③地域の循環システム④基盤強靱化⑤国際資源循環<br><br><b>解説</b>　5つの重点分野は2.1循環経済への移行による持続可能な地域と社会づくり、2.2事業者間連携、2.3地域の循環システム、2.4基盤強靱化と適正処理、2.5国際資源循環。R7 Ⅰ-2では事業者間連携、地域の循環システムと地方創生、国際資源循環の3つが問われた<br><br><b>答案に書くなら</b>　解決策として、事業者間連携、地域の循環システム構築、適正な国際資源循環体制の構築などの重点分野に沿って対策を進めることが有効である。<br><br><b>関連</b>　2.1と2.4はR7の問題文に含まれていなかった分野で、2.1は基盤方針である。<br><br><b>答案での使い方</b>　R7 Ⅰ-2は②③⑤の3つ。解決策の方向を国の言葉で<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜柱】動静脈連携とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　製造・小売の動脈産業と廃棄物処理・リサイクルの静脈産業が連携し、再生材利用の拡大と市場創出を図る取組<br><br><b>解説</b>　動脈産業は製造業・小売業など製品をつくる側、静脈産業は廃棄物処理・リサイクル業など使用後を担う側を指す。両者が連携することで、再生材の需要と供給をつなぎ、資源循環の市場を創出する<br><br><b>答案に書くなら</b>　解決策として、動脈産業と静脈産業が連携する動静脈連携により、再生材利用を拡大し資源循環市場を創出することが有効である。<br><br><b>関連</b>　この連携は重点分野2.2の事業者間連携によるライフサイクル全体での資源循環に当たる。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 事業者間連携の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜課題】動静脈連携の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　再生材の品質の共通認識づくりと、デジタル製品パスポート対応のデータベースなど、循環性を計測・開示する技術基盤が未整備<br><br><b>解説</b>　再生材を使う製造側は品質への不安を持ちやすく、再生材の品質に関する共通認識がないと使われない。循環性を計測・開示するデータ基盤（デジタル製品パスポート対応のデータベース等）も整備途上である<br><br><b>答案に書くなら</b>　技術の観点から、再生材の品質に関する共通認識の醸成と、デジタル製品パスポート対応のデータベースなど循環性を計測・開示する技術基盤が未整備であることが課題である。<br><br><b>関連</b>　デジタル製品パスポート（DPP）は製品の原材料・成分・リサイクル性等をデジタルで記録・開示する欧州発の仕組みである。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜課題】資源循環の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　人口減少で廃棄物処理・資源循環のエッセンシャルワーカーが不足し、中小企業が大半の処理業者への影響が大きい<br><br><b>解説</b>　廃棄物処理や資源循環は現場の労働力に支えられ、エッセンシャルワーカーと呼ばれる。人口減少・少子高齢化で担い手が減り、事業者の大半が中小企業のため影響が大きい<br><br><b>答案に書くなら</b>　人材・担い手の観点から、人口減少で廃棄物処理・資源循環のエッセンシャルワーカーが不足し、中小企業が大半を占める処理業者への影響が大きいことが課題である。<br><br><b>関連</b>　重点分野2.4はDXと人材育成で担い手不足と災害廃棄物対応を強化する。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 人材・担い手の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜課題】市場規模80兆円の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　短期的には経済合理的でない動静脈連携への投資を、GX投資等で後押しする資金誘導が必要<br><br><b>解説</b>　動静脈連携は、短期的には既存ルートより費用がかかり経済合理性に乏しい場合がある。市場規模を2030年に80兆円以上へ拡大するには、その投資をGX投資等の資金誘導で後押しする必要がある<br><br><b>答案に書くなら</b>　経済・資金の観点から、短期的には経済合理的でない動静脈連携への投資を、GX投資等で後押しする資金誘導が必要であることが課題である。<br><br><b>関連</b>　80兆円は成長戦略フォローアップ工程表のKPIを踏襲した目標である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜解決策】再生材の利用拡大の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　動静脈連携で再生材利用を広げ、デジタル製品パスポート（DPP）で原材料・リサイクル性の情報を開示する<br><br><b>解説</b>　動静脈連携は製造と処理の事業者が連携して再生材利用を広げる取組、DPPは情報開示で循環を促す仕組み。両者を組み合わせれば、品質への不安を下げつつ再生材を流通させられる<br><br><b>答案に書くなら</b>　解決策として、動静脈連携で再生材利用を拡大し、デジタル製品パスポート（DPP）で原材料・リサイクル性の情報を開示することが有効である。<br><br><b>関連</b>　DPPは欧州発の制度的仕組みで、国内制度化が追いついていないことが制度面の課題である。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 技術・制度面の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜解決策】地域の循環の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　地域の資源の地産地消・循環を進め、製造業・処理業と自治体・市民が連携する地域の循環システムで地方創生につなげる<br><br><b>解説</b>　地域の循環システムは、地域資源の地産地消・循環で地方創生と生態系保全を同時に進める重点分野2.3の考え方。製造業・処理業と自治体・市民など各主体の主体的な連携が要る<br><br><b>答案に書くなら</b>　地域の観点から、地域資源の地産地消・循環を進め、製造業・処理業と自治体・市民が連携する地域の循環システムで地方創生につなげることが解決策である。<br><br><b>関連</b>　参画の枠組みづくりが地域ごとに異なる点が、合意形成面の課題とされる。<br><br><b>答案での使い方</b>　必須Ⅰ・Ⅱ-2 地域施策の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜リスク】動静脈連携で再生材を急拡大するリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：品質管理や有害物質管理が不十分なまま流通。対策：製品安全・有害物質のリスク管理・不法投棄防止を伴う適正な取組を求める<br><br><b>解説</b>　再生材の利用を急に増やすと、品質管理や有害物質の管理が追いつかないまま流通し、製品安全上の懸念が出る。利用拡大と同時に、製品の安全性確保・有害物質のリスク管理・不法投棄の防止を各主体に求める必要がある<br><br><b>答案に書くなら</b>　リスクとして、再生材の急拡大で品質管理や有害物質管理が不十分なまま流通するおそれがあり、製品安全・有害物質のリスク管理・不法投棄防止を伴う適正な取組を各主体に求める必要がある。<br><br><b>関連</b>　国際資源循環では、輸出先での不適正処理への懸念があり、バーゼル条約等に基づく適正な輸出管理を徹底する。<br><br><b>答案での使い方</b>　必須Ⅰ(3) 再生材拡大のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画｜注意】第五次の数値目標の年次と、第四次との違いは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　目標年次は2030年度。第四次は指標が151あったが、第五次は指標数を絞り込んだ<br><br><b>解説</b>　数値目標の目標年次は2030年度。第四次計画は指標が151あったが、第五次は指標数を絞り込んだ。旧計画の指標数や目標値を使って答案を書かない<br><br><b>答案に書くなら</b>　本計画の数値目標は2030年度を目標年次としており、第四次計画の指標や目標値ではなく第五次の目標値で答案を書く。<br><br><b>関連</b>　地球温暖化対策計画の2030・2040年度目標や家庭部門の目標年とは別の計画の数字である。<br><br><b>答案での使い方</b>　旧計画の指標数・目標値で答案を書かない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000242560.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜時期】地域脱炭素ロードマップの決定はいつで、決定主体は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2021年6月9日、国・地方脱炭素実現会議の決定。閣議決定ではない<br><br><b>解説</b>　地域脱炭素ロードマップは2021年6月9日の国・地方脱炭素実現会議（第3回）の決定文書で、閣議決定でも法定計画でもない。制度的な裏付けは2021年改正の地球温暖化対策推進法（地方公共団体実行計画・地域脱炭素化促進事業）である<br><br><b>答案に書くなら</b>　地域脱炭素ロードマップは2021年6月に国・地方脱炭素実現会議で決定された文書であり、地方からの脱炭素の移行戦略を示している。<br><br><b>関連</b>　第六次環境基本計画等は閣議決定で、決定主体が異なる点を書き分ける。R6 Ⅰ-2で出題された。<br><br><b>答案での使い方</b>　R6 Ⅰ-2で出題。書き出しで決定主体を正確に書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜時期】脱炭素先行地域の現在の年限の整理は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2025年度までに少なくとも100か所を選定し、2030年度までに実行<br><br><b>解説</b>　当初（2021年）は「2030年度までに少なくとも100か所をつくる」と表現されたが、現在の整理は「2025年度までに少なくとも100か所を選定し、2030年度までに実行」。選定の期限と実行の期限が別である<br><br><b>答案に書くなら</b>　脱炭素先行地域は、2025年度までに少なくとも100か所を選定し、2030年度までに実行することを目標としている。<br><br><b>関連</b>　当初の表現と現在の整理の2段階があり、選定年と実行年を取り違えない。<br><br><b>答案での使い方</b>　選定年と実行年を取り違えない。当初は「2030年度までに100か所」<br><br>【出典】<a href=\"https://www.env.go.jp/content/000376957.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜定義】脱炭素先行地域の定義の核は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　民生部門（家庭部門及び業務その他部門）の電力消費に伴うCO2排出の実質ゼロ。運輸・熱利用等は地域特性に応じて実施<br><br><b>解説</b>　脱炭素先行地域は、民生部門の電力消費に伴うCO2排出の実質ゼロを実現する地域。民生部門は家庭部門と業務その他部門を指し、運輸部門・熱利用等は地域特性に応じて排出削減する付随的な対策である<br><br><b>答案に書くなら</b>　脱炭素先行地域とは、民生部門（家庭部門及び業務その他部門）の電力消費に伴うCO2排出の実質ゼロを実現し、運輸・熱利用等も地域特性に応じて削減する地域である。<br><br><b>関連</b>　先行モデルを全国に伝搬させて2050年を待たずに脱炭素を実現する考え方を脱炭素ドミノという。<br><br><b>答案での使い方</b>　必須Ⅰ・Ⅱ-1 定義を問われたときの書き出しに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000376957.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜目標】脱炭素先行地域の選定状況は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　第7回（2026年2月）までに45道府県133市町村の102提案が選定。3提案が辞退<br><br><b>解説</b>　第1回〜第7回（2026年2月13日時点）で、全国45道府県133市町村の102提案が選定され、選定後に3提案が辞退した。数の上では目標の100か所に届いたが、辞退が出ている点が実行上の課題である<br><br><b>答案に書くなら</b>　地域の観点から、脱炭素先行地域は102提案が選定された一方で3提案が辞退しており、選定後の実行可能性の確保が課題である。<br><br><b>関連</b>　辞退の背景はコスト増大や地元合意の難航で、計画段階での協議の徹底が対策になる。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 目標100か所との差・辞退を課題の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000376957.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜目標】重点対策①自家消費型太陽光の導入目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2030年に設置可能な建築物の約50%、2040年に100%<br><br><b>解説</b>　重点対策①は屋根置きなどの自家消費型太陽光発電で、2030年に設置可能な建築物の約50%、2040年に100%への導入を目指す。再エネを地域内で消費して、エネルギー代金の域外流出を減らす考え方である<br><br><b>答案に書くなら</b>　解決策として、自家消費型の太陽光発電を2030年に設置可能な建築物の約50%、2040年に100%へ導入することが有効である。<br><br><b>関連</b>　環境省の試算では、約9割の市町村でエネルギー代金の域内外収支は域外支出が上回っている（2015年度）。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 太陽光の解決策の到達点に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜柱】ロードマップの8つの重点対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　①自家消費型太陽光②地域共生型再エネ③業務ビルZEB化④住宅省エネ⑤ゼロカーボン・ドライブ⑥資源循環⑦まちづくり⑧農林水産業<br><br><b>解説</b>　8つの重点対策は再エネ・省エネ・移動・循環・まちづくり・食農を網羅する。①自家消費型太陽光②地域共生型再エネ③業務ビルZEB化④住宅省エネ⑤ゼロカーボン・ドライブ⑥資源循環⑦まちづくり⑧農林水産業<br><br><b>答案に書くなら</b>　解決策として、自家消費型太陽光、地域共生型再エネ、ZEB・ZEH、ゼロカーボン・ドライブなど8つの重点対策を組み合わせることが有効である。<br><br><b>関連</b>　新築住宅はZEH、新築建築物はZEBの2030年平均実現、乗用車新車は2035年電動車100%を目指す。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策を国の分類で言う<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜課題】地域脱炭素の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　太陽光自家消費・ZEB・ZEH・電動車を全国に普及させるには、低圧需要での経済性確保と初期投資ゼロの導入モデルの確立が課題<br><br><b>解説</b>　太陽光自家消費・ZEB・ZEH・電動車は、全国津々浦々に広げる段階で、低圧需要での経済性が課題になる。初期投資ゼロの導入ビジネスモデルは、導入側の負担をなくして普及を加速させる手段である<br><br><b>答案に書くなら</b>　技術の観点から、太陽光自家消費・ZEB・ZEH・電動車を全国に普及させるため、低圧需要での経済性の確保と初期投資ゼロの導入ビジネスモデルの確立が課題である。<br><br><b>関連</b>　ゼロカーボン・ドライブは再エネ電力とEV/PHEV/FCVの組合せで、車両の蓄電機能を地域のレジリエンス向上にも使う。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜課題】地域脱炭素の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　先行地域の計画策定・実施を担う自治体職員や地元企業・金融機関の体制確保が、地域間の取組差を生んでいる<br><br><b>解説</b>　先行地域の計画策定や実施には、自治体職員の専門性に加え、地元企業や金融機関の関与が必要。体制が整う自治体と整わない自治体で差が生まれ、地域間の取組差につながる<br><br><b>答案に書くなら</b>　人材・担い手の観点から、脱炭素先行地域の計画策定・実施を担う自治体職員や地元企業・金融機関の体制確保が、地域間の取組差を生む要因となっていることが課題である。<br><br><b>関連</b>　リスク面でも、体制が不十分な地域では選定後に取組を辞退する例が出ている。<br><br><b>答案での使い方</b>　必須Ⅰ(1)・Ⅱ-2 人材の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜課題】再エネ促進区域設定の課題を『合意形成』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　地域協議会の開催等による合意形成が必要で、環境配慮や地域貢献の要件設定を円滑に進める仕組みが課題<br><br><b>解説</b>　再エネ促進区域の設定には、地域協議会の開催などで住民や事業者との合意形成が要る。環境配慮や地域貢献の要件を設ける作業が重いと、区域設定が進まなくなる<br><br><b>答案に書くなら</b>　合意形成・地域の観点から、再エネ促進区域の設定には地域協議会の開催等による合意形成が必要であり、環境配慮や地域貢献の要件設定を円滑に進める仕組みが課題である。<br><br><b>関連</b>　制度面では、洋上・陸上風力の特性に応じた環境アセスメントの最適化も改革課題である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 合意形成・地域の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜解決策】合意形成が進まない課題への解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　促進区域の設定（ポジティブゾーニング）で、環境配慮と地域貢献の要件を付けて適地を事前に示す<br><br><b>解説</b>　ポジティブゾーニングは、市町村が再エネの導入目標を設定し、環境配慮や地域貢献の要件を付けた上で再エネ事業を促進する区域を選ぶ仕組み。適地を事前に示すことで、地域に裨益する再エネの立地と合意形成を進めやすくする<br><br><b>答案に書くなら</b>　解決策として、ポジティブゾーニングで環境配慮と地域貢献の要件を付した促進区域を設定し、適地を事前に示して地域共生型の再エネ立地を進めることが有効である。<br><br><b>関連</b>　重点対策②の地域共生・地域裨益型再エネの立地を支える仕組みである。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 再エネ立地の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜解決策】自治体の取組を後押しする解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　重点対策加速化事業（地域脱炭素移行・再エネ推進交付金）で、重点対策を組み合わせた複数年の計画を5年間支援する<br><br><b>解説</b>　重点対策加速化事業は、重点対策①〜⑤を複合的に組み合わせた複数年の計画を実施する自治体を、交付期間5年間で支援する交付金制度。令和8年5月1日時点で全国170自治体が採択されている<br><br><b>答案に書くなら</b>　解決策として、地域脱炭素移行・再エネ推進交付金（重点対策加速化事業）により、重点対策を組み合わせた複数年の計画を5年間支援することが有効である。<br><br><b>答案での使い方</b>　必須Ⅰ(2)・Ⅱ-2 財政支援の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜リスク】先行地域の選定数を優先して生じるリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：コスト増や地元合意の難航で辞退が出る。対策：計画段階から地域協議会と要件明確化を徹底し、実行可能性を精査して選定<br><br><b>解説</b>　先行地域の選定数という目標を優先すると、実行可能性の吟味が甘くなり、コスト増や地元合意の難航で、選定後に辞退が出る。計画策定段階から協議と要件明確化を徹底して実現性を確認する必要がある<br><br><b>答案に書くなら</b>　リスクとして、選定数を優先するとコスト増や地元合意の難航で辞退する地域が生じるおそれがあり、計画段階から地域協議会と要件の明確化を徹底し、実行可能性を精査して選定する必要がある。<br><br><b>関連</b>　第7回時点で3提案が辞退している。<br><br><b>答案での使い方</b>　必須Ⅰ(3) 目標優先のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜リスク】促進区域の設定を急ぐリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：合意形成が不十分なまま区域指定が進み、住民と対立。対策：地域協議会で環境保全と地域の経済・社会課題の解決を併せて検討<br><br><b>解説</b>　促進区域の設定を急ぐと、住民の理解が得られないまま区域指定が進み、地域住民との対立を招く。地域協議会を開き、環境の保全と地域の経済・社会課題の解決を併せて検討することで対立を避けられる<br><br><b>答案に書くなら</b>　リスクとして、促進区域の設定を急ぐと合意形成が不十分なまま住民との対立を招くおそれがあり、地域協議会で環境保全と地域の経済・社会課題の解決を併せて検討する必要がある。<br><br><b>関連</b>　風力・地熱の開発では、海域の鳥類や温泉事業者への影響に配慮し、環境アセスメントの最適化や温泉モニタリングを行う。<br><br><b>答案での使い方</b>　必須Ⅰ(3)・Ⅱ-2 合意形成のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ｜注意】重点対策加速化事業の交付対象は、8つの重点対策のどれか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　①〜⑤のみ。⑥資源循環・⑦まちづくり・⑧農林水産業は対象外<br><br><b>解説</b>　加速化事業の交付対象は、8つの重点対策のうち①〜⑤（太陽光・地域共生型再エネ・業務ビルZEB化・住宅省エネ・ゼロカーボンドライブ）のみ。⑥資源循環・⑦まちづくり・⑧農林水産業は対象外で、他の制度で対応する<br><br><b>答案に書くなら</b>　重点対策加速化事業の交付対象は①〜⑤の重点対策に限られ、⑥〜⑧は対象外であるため、「すべて交付金対象」とは書かない。<br><br><b>関連</b>　⑥は食品ロスを2030年度までに2000年度比半減、⑧はみどりの食料システム戦略で2050年に有機農業取組面積25%を目指す。<br><br><b>答案での使い方</b>　「重点対策＝すべて交付金対象」と書くと減点<br><br>【出典】<a href=\"https://www.env.go.jp/content/000256901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜時期】令和8年版の環境白書等が閣議決定されたのはいつ？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2026年6月（5日）。環境の日に合わせて公表された、3白書の合冊<br><br><b>解説</b>　令和8年版は2026年6月5日に閣議決定され、環境の日に合わせて公表された。環境白書（環境基本法第12条）、循環型社会白書（循環基本法第14条）、生物多様性白書（生物多様性基本法第10条）を1冊に合冊したものである<br><br><b>答案に書くなら</b>　令和8年版の環境白書・循環型社会白書・生物多様性白書は2026年6月に閣議決定された最新版であり、これに基づいて現状を整理する。<br><br><b>関連</b>　第五次循環型社会形成推進基本計画（循環基本法第15条の計画そのもの）とは別の文書である。<br><br><b>答案での使い方</b>　書き出しで最新版を明示。令和7年版と取り違えない<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/index.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜時期】令和8年版白書のテーマは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　循環経済（サーキュラーエコノミー）で日本列島を強く豊かに<br><br><b>解説</b>　令和8年版のテーマは「循環経済（サーキュラーエコノミー）で日本列島を強く豊かに」。令和7年版は「新たな成長」を導くグリーンな経済システム、令和6年版は自然資本充実と環境価値、令和5年版はネットゼロ・循環経済・ネイチャーポジティブの統合だった<br><br><b>答案に書くなら</b>　令和8年版白書は「循環経済で日本列島を強く豊かに」をテーマに、循環経済への移行加速化を位置づけている。<br><br><b>関連</b>　年版ごとにテーマが異なるため、年版とテーマの対応を確認して書く。<br><br><b>答案での使い方</b>　令和7年版（グリーンな経済システム）と取り違えると減点<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜目標】循環経済行動計画が目指す2030年までの投資規模は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　再資源化拠点等の構築・ネットワーク形成に向け、官民で約1兆円<br><br><b>解説</b>　循環経済行動計画は2026年4月に関係閣僚会議で決定された計画。再資源化拠点等の構築・ネットワーク形成に向け、2030年までに官民で約1兆円の投資を目指す。再資源化拠点は再生資源を安定供給する基盤である<br><br><b>答案に書くなら</b>　経済・資金の観点から、再資源化拠点等の構築・ネットワーク形成に向け、2030年までに官民で約1兆円の投資を促進することが解決策の規模感である。<br><br><b>関連</b>　1兆円は循環経済行動計画の数字で、GX全体の150兆円とは母集団が異なる。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 資金面の解決策の規模感に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜目標】令和8年版白書の保護地域・OECM指定割合（2025年8月）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　陸地約21.0%、海洋約13.3%。目標は2030年までに各30%以上<br><br><b>解説</b>　保護地域・OECMの指定割合は、2025年8月現在で陸地約21.0%、海洋約13.3%。目標は2030年までにいずれも30%以上で、特に海洋の差が大きい<br><br><b>答案に書くなら</b>　生態系保全の観点から、保護地域・OECMの指定は陸地約21.0%、海洋約13.3%にとどまり、2030年までの30%以上という目標との差が課題である。<br><br><b>関連</b>　自然共生サイトは2026年3月時点で569ヶ所が認定されている。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 目標との差で課題の大きさを示す<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜柱】循環経済行動計画（2026年4月決定）の2つの柱は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　再生資源供給サプライチェーンの強靱化と、日本をハブとする国際資源循環ネットワークの構築<br><br><b>解説</b>　循環経済行動計画は、資源の海外依存と経済安全保障の観点から、国内で再生資源を確保し日本の製錬技術等を活かす狙いを持つ。柱は再生資源供給サプライチェーンの強靱化と、日本をハブとする国際資源循環ネットワークの構築である<br><br><b>答案に書くなら</b>　解決策として、再生資源供給サプライチェーンの強靱化と、日本をハブとする国際資源循環ネットワークの構築を進めることが有効である。<br><br><b>関連</b>　企業の資源循環の情報開示スキームであるグローバル循環プロトコル（GCP）1.0も国際標準化が進められている。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 資源循環の解決策を国の言葉で言う<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜柱】大規模太陽光（メガソーラー）の対策パッケージの考え方は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　不適切事案への法的規制の強化と、地域共生型への支援強化を両立させる<br><br><b>解説</b>　メガソーラーは再エネ導入に資する一方、無秩序な開発などの不適切事案が地域との摩擦を生む。対策パッケージは、不適切事案を抑える規制強化と、望ましい導入を支える地域共生型への支援強化を同時に行う考え方である<br><br><b>答案に書くなら</b>　解決策として、大規模太陽光発電事業について、不適切事案への法的規制の強化と地域共生型への支援強化を両立させることが有効である。<br><br><b>関連</b>　ペロブスカイト太陽電池は軽量・柔軟で、耐荷重性の低い屋根や壁面にも設置できる。<br><br><b>答案での使い方</b>　必須Ⅰ(2)・Ⅲ 再エネ立地の方向づけに<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜課題】重要鉱物・金属の再生資源供給の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　重要鉱物・金属を質・量・コスト面で安定供給するための再資源化・製錬技術の確立が必要で、動脈と静脈をつなぐ技術基盤が不足<br><br><b>解説</b>　再生資源の供給拠点をつくるには、重要鉱物・金属を質・量・コストの面で安定して供給できる再資源化・製錬技術が必要。製造側（動脈）と再資源化側（静脈）をつなぐ技術基盤が不足していることが課題である<br><br><b>答案に書くなら</b>　技術の観点から、重要鉱物・金属を質・量・コストの面で安定供給するための再資源化・製錬技術の確立と、動脈産業と静脈産業をつなぐ技術基盤の整備が課題である。<br><br><b>関連</b>　再資源化事業等の高度化に関する法律（2025年11月施行）は、高度な再資源化事業者を認定する制度を創設した。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜課題】再資源化拠点の整備の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　官民で約1兆円の投資を目指すが、再生材需要の創出を起点とした自律的な市場形成の設計が課題<br><br><b>解説</b>　再資源化拠点の整備は、投資の規模だけでなく、投資が回収される市場がなければ続かない。再生材の需要を創出・拡大して、自律的に回る市場形成をどう設計するかが資金循環の課題である<br><br><b>答案に書くなら</b>　経済・資金の観点から、再資源化拠点等に官民で約1兆円の投資を目指す一方、再生材需要の創出を起点とした自律的な市場形成の設計が課題である。<br><br><b>関連</b>　太陽光パネルの大量廃棄に備えたリサイクル義務化の法案（2026年4月国会提出）も、制度面の枠組みを整える。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜課題】メガソーラーの課題を『合意形成』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　不適切事案への規制強化と地域共生型への支援を両立させる必要があり、地域住民との合意形成が課題<br><br><b>解説</b>　メガソーラーに関する対策では、不適切事案を規制しつつ、地域共生型の導入も支援する。両方を進めるには、地域住民の納得を得る合意形成が欠かせない。住民が反対すると、規制強化と支援の両方が機能しにくくなる<br><br><b>答案に書くなら</b>　合意形成・地域の観点から、大規模太陽光発電事業で不適切事案への規制強化と地域共生型への支援を両立させるため、地域住民との合意形成が課題である。<br><br><b>関連</b>　クマ被害対策や不適切事案対応では、自治体の体制・人材不足も課題になる。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 合意形成・地域の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜解決策】資源循環の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　再生資源供給サプライチェーンの強靱化で、再資源化拠点を構築・ネットワーク化し、再生材を質・量・コスト面で安定供給する<br><br><b>解説</b>　再生資源供給サプライチェーンの強靱化は、再資源化拠点を構築してネットワークでつなぎ、重要鉱物・金属等の再生材を質・量・コスト面で安定供給する取組。資源の海外依存を減らし、経済安全保障にも寄与する<br><br><b>答案に書くなら</b>　解決策として、再生資源供給サプライチェーンの強靱化により、再資源化拠点を構築・ネットワーク化し、再生材を質・量・コスト面で安定供給することが有効である。<br><br><b>関連</b>　同じ計画の柱として、日本をハブとする国際資源循環ネットワークの構築がある。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 資源循環の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜解決策】自然再興の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　自然共生サイトの認定（地域生物多様性増進法、2025年4月施行）で、民間等の保全区域を国が認定し30by30を進める<br><br><b>解説</b>　自然共生サイトは、民間等の取組で生物多様性が保全されている区域を国が認定する制度で、2026年3月時点で569ヶ所。地域生物多様性増進法（2025年4月施行）に基づく認定を含み、民間の保全区域を30by30の達成に取り込む手段である<br><br><b>答案に書くなら</b>　解決策として、地域生物多様性増進法に基づく自然共生サイトの認定により、民間等の保全区域を国が認定して30by30の達成を進めることが有効である。<br><br><b>関連</b>　国立公園満喫プロジェクトは保護と利用の好循環を目指す別の取組で、2026年3月に2026年以降の方針を策定した。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 生物多様性の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜リスク】再資源化拠点の構築を急ぐリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：環境対策が不十分なスクラップヤード経由で循環資源が海外へ流出。対策：許可制導入とバーゼル法手続の適正化で監視強化<br><br><b>解説</b>　再資源化拠点の構築や国際資源循環ネットワーク化を急ぐと、環境対策が不十分なスクラップヤード事業者を通じて、循環資源が海外へ流出するおそれがある。許可制の導入と、バーゼル法に基づく輸入手続の適正化で監視を強める<br><br><b>答案に書くなら</b>　リスクとして、スクラップヤード経由で循環資源が海外へ流出するおそれがあり、スクラップヤード事業の許可制導入とバーゼル法手続の適正化で監視を強化する必要がある。<br><br><b>関連</b>　自治体アンケートで全国4,000件超の事業場が確認されている。<br><br><b>答案での使い方</b>　必須Ⅰ(3) 資源循環のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜リスク】メガソーラー拡大のリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：自然再興と土地利用で競合し、不適切な開発を招く。対策：対策パッケージで規制を強化し、地域共生型への支援を重点化<br><br><b>解説</b>　メガソーラーの導入拡大は、土地利用で自然再興（ネイチャーポジティブ）の目標と競合し、無秩序な開発などの不適切事案を招くおそれがある。規制と支援を組み合わせた対策パッケージで両立を図る<br><br><b>答案に書くなら</b>　リスクとして、メガソーラーの拡大が自然再興と土地利用で競合し不適切な開発を招くおそれがあり、対策パッケージで法的規制を強化し、地域共生型への支援を重点化する必要がある。<br><br><b>関連</b>　クマ等の個体数管理は生物多様性保全と住民の安全確保のトレードオフがあり、クマ被害対策ロードマップで両立を図る。<br><br><b>答案での使い方</b>　必須Ⅰ(3) 再エネと自然保全の両立に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書｜注意】令和8年版の「約1兆円」と、GX2040の「150兆円」の違いは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　1兆円は循環経済行動計画（再資源化拠点）、150兆円はGX全体の官民投資。母集団が違う<br><br><b>解説</b>　令和8年版白書の「約1兆円」は、循環経済行動計画が再資源化拠点等の構築・ネットワーク形成で2030年までに目指す官民投資。GX2040ビジョンの「150兆円」は、GX全体で10年間に呼び込む官民投資で、対象が違う<br><br><b>答案に書くなら</b>　約1兆円は循環経済行動計画の再資源化拠点等への官民投資、150兆円はGX全体の官民投資であり、母集団が異なるので混同しない。<br><br><b>関連</b>　2035年度60%・2040年度73%削減も、家庭部門の66%等とは母集団が異なる全体のNDCの数字である。<br><br><b>答案での使い方</b>　数字は何の目標かとセットで書く<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}];
const NJ_TERM_DATA = [{"f": "二次:用語", "q": "【排出量取引制度（GX-ETS）｜時期】排出量取引制度は本格稼働しているか。何年度からか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2026年度（2026年4月1日施行）。2023年度開始の自主参加型GXリーグとは別の、法定の制度<br><br><b>解説</b>　2026年4月1日に改正GX推進法が施行され、排出量取引は試行から法定の本格稼働に移った。2023年度開始のGXリーグは自主参加の試行で別物<br><br><b>答案に書くなら</b>　排出量取引制度は2026年度から本格稼働しており、法に基づく制度として運用が始まっている。<br><br><b>関連</b>　初年度は届出と移行計画のみで、排出枠の割当ては2027年度（2026年度に割当てではない）。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで「施行済み」と示す。GXリーグと区別<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505AC0000000032\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【排出量取引制度（GX-ETS）｜定義】排出量取引制度とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　政府が排出枠（CO2 1t＝1枠）を無償割当てし、排出実績量と同量の枠の保有を義務づけ、過不足を事業者間で取引できる制度<br><br><b>解説</b>　排出枠（CO2 1t＝1枠）を無償で割り当て、排出実績量と同量の保有を義務づけると、枠が不足する事業者と余る事業者の間で取引が生まれる<br><br><b>答案に書くなら</b>　排出量取引制度とは、政府が無償割当てした排出枠を排出実績量と同量保有する義務を課し、過不足を事業者間で取引できる制度である。<br><br><b>関連</b>　成長志向型カーボンプライシング構想の柱の1つで、もう1つの柱が化石燃料賦課金。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505AC0000000032\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【排出量取引制度（GX-ETS）｜制度】排出量取引制度の対象事業者の要件は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　CO2の直接排出量の直近3年度平均が10万トン以上の事業者。事業者単位で判定する<br><br><b>解説</b>　判定は事業者単位で、直近3年度の平均で見るため単年の増減に左右されにくい。子会社等は別事業者として扱う<br><br><b>答案に書くなら</b>　対象はCO2の直接排出量が直近3年度平均で10万トン以上の事業者であり、事業者単位で判定する。<br><br><b>関連</b>　初年度（2026年度）のみ、判定は2023〜2025年度の平均で行う特例がある。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。数字は「3年度平均10万t」<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505CO0000000379\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【排出量取引制度（GX-ETS）｜制度】排出量取引制度の価格安定の仕組みは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　参考上限取引価格と調整基準取引価格を毎年度設定。償却不足分は「未償却量×参考上限価格×1.1」の負担金<br><br><b>解説</b>　枠の価格が乱高下すると企業は投資計画を立てにくい。そこで価格の目安を年度開始前に定め、枠は投機的取引の対象にしてはならないとされる<br><br><b>答案に書くなら</b>　解決策は、参考上限取引価格と調整基準取引価格を毎年度設定し、償却不足分に未償却量×参考上限価格×1.1の負担金を課して価格を安定させることである。<br><br><b>関連</b>　GX推進機構が排出枠取引市場の設置・運営と価格調整の買入れを担う。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。価格の予見性の論点に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505AC0000000032\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【排出量取引制度（GX-ETS）｜課題】排出量取引制度の課題を『技術・運用』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　排出目標量・実績量は登録確認機関の確認が必須で、算定・確認の体制づくりが初年度から必要になる<br><br><b>解説</b>　排出量は自己申告のままでは信頼できないため、第三者の登録確認機関の確認が必須とされる。事業者側は算定の仕組みを整えないと報告・枠の保有に支障が出る<br><br><b>答案に書くなら</b>　技術・運用の観点から、課題は排出目標量・実績量の算定に登録確認機関の確認が必須で、算定・確認の体制づくりが初年度から必要になることである。<br><br><b>関連</b>　確認が必要なのは目標量と実績量の両方。<br><br><b>答案での使い方</b>　Ⅱ-1の課題。「確認体制」を観点つきで書く<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505AC0000000032\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【排出量取引制度（GX-ETS）｜解決策】排出量取引制度で国際競争力への影響を抑える仕組みを、専門用語で言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　原単位の改善率を用いた無償割当てで、事業分野間の均衡と国際競争力に配慮する<br><br><b>解説</b>　無償割当てなら事業者の負担が急に重くならず、原単位の改善率を使えば分野ごとの事情の差も調整できる。法も割当ての勘案事項に国際競争力の維持向上を挙げる<br><br><b>答案に書くなら</b>　経済・競争力の観点から、解決策は原単位の改善率を用いて無償割当てを行い、事業分野間の均衡と国際競争力に配慮することである。<br><br><b>関連</b>　発電事業者への有償割当ては2033年度から。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 競争力対策の解決策に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505AC0000000032\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【排出量取引制度（GX-ETS）｜解決策】排出量の算定・確認の体制づくりの解決策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　確認を担う登録確認機関を国の登録制とし、ERMSとマニュアルで算定・報告の手続きを整える<br><br><b>解説</b>　算定・確認がばらつくと制度の信頼が揺らぐ。そこで確認を担う登録確認機関を国の登録制とし、ERMSとマニュアルで手続きを標準化する<br><br><b>答案に書くなら</b>　技術・運用の観点から、解決策は登録確認機関を国の登録制とし、ERMSとマニュアルで算定・報告の手続きを整えることである。<br><br><b>関連</b>　登録確認機関の登録申請は制度の施行前から可能とされている。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 運用面の解決策に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505AC0000000032\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【排出量取引制度（GX-ETS）｜注意】排出量取引2026年度、化石燃料賦課金、発電の有償割当ての開始年度は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　排出量取引は2026年度、化石燃料賦課金は2028年度、発電事業者の有償割当ては2033年度<br><br><b>解説</b>　3つの制度は段階的に始まる。まず企業の排出に枠を課す排出量取引、次に燃料の採取・輸入に課す賦課金、最後に発電の有償化という順で負担が広がる<br><br><b>答案に書くなら</b>　排出量取引は2026年度、化石燃料賦課金は2028年度、発電事業者の有償割当ては2033年度から始まる。<br><br><b>関連</b>　賦課金は令和10年度、発電の有償割当ては令和15年度とも書かれる。<br><br><b>答案での使い方</b>　年度の取り違えは減点。順序で覚える<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505AC0000000032\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【化石燃料賦課金・成長志向型カーボンプライシング構想｜時期】化石燃料賦課金の徴収開始はいつか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2028年度（令和10年度）から徴収する予定で、まだ始まっていない<br><br><b>解説</b>　賦課金は法で令和10年度（2028年度）からの徴収と決まっているが、まだ始まっておらず予定の段階。2026年度開始の排出量取引とは時期が違う<br><br><b>答案に書くなら</b>　化石燃料賦課金は2028年度から徴収する予定であり、現時点では導入前の段階である。<br><br><b>関連</b>　既に採取・引取りをしている事業者の届出期限は令和10年3月31日。<br><br><b>答案での使い方</b>　Ⅱ-1で予定段階と示す。排出量取引(2026)と区別<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505AC0000000032\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【化石燃料賦課金・成長志向型カーボンプライシング構想｜定義】成長志向型カーボンプライシング構想とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　GX先行投資を促しつつ炭素価格の負担を段階的に導入し、脱炭素と産業競争力を両立させる構想<br><br><b>解説</b>　構想は、先行投資支援・カーボンプライシング・新たな金融手法を組み合わせる。企業にGXに取り組む期間を設けてから導入し、徐々に引き上げる方針を事前に示す<br><br><b>答案に書くなら</b>　成長志向型カーボンプライシング構想とは、GX先行投資を促しつつ炭素価格の負担を段階的に導入し、脱炭素と産業競争力を両立させる構想である。<br><br><b>関連</b>　先行投資支援は20兆円規模で、GX経済移行債を財源とする。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しの定義に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505AC0000000032\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【化石燃料賦課金・成長志向型カーボンプライシング構想｜制度】化石燃料賦課金は誰が納め、どう計算されるか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　化石燃料の採取・輸入事業者が納付。賦課額は「単価×CO2排出量（t）」で、最終消費者には直接課さない<br><br><b>解説</b>　徴収の手間を減らすため、課税の入口である化石燃料の採取・輸入事業者に課す。最終消費者には直接課さない<br><br><b>答案に書くなら</b>　化石燃料賦課金は採取・輸入事業者が納付し、賦課額は単価にCO2排出量（t）を乗じて計算する。<br><br><b>関連</b>　もう1つの財源である特定事業者負担金は、排出量の多い発電事業者に2033年度から課される。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。納付義務者の取り違え防止<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505AC0000000032\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【化石燃料賦課金・成長志向型カーボンプライシング構想｜制度】GX経済移行債の発行期間と償還の仕組みは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　令和5〜14年度に発行。賦課金と特定事業者負担金の収入で令和32年度（2050年度）までに償還<br><br><b>解説</b>　先行投資を前倒しで行うため、GX経済移行債で資金を調達し、将来の賦課金などの収入で返す設計にしている<br><br><b>答案に書くなら</b>　GX経済移行債は令和5〜14年度に発行し、賦課金と特定事業者負担金の収入で令和32年度までに償還する。<br><br><b>関連</b>　発行期間（令和5〜14年度）と償還期限（令和32年度）を混同しない。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。財源の裏付けとして<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505AC0000000032\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【化石燃料賦課金・成長志向型カーボンプライシング構想｜課題】化石燃料賦課金導入の課題を『経済』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　負担が産業・家計のエネルギーコストに及ぶ。法は「中長期的なエネルギー負担の抑制」「公正な移行」を基本理念とする<br><br><b>解説</b>　賦課金は燃料価格に上乗せされるため、産業のコストや家計の光熱費に波及しうる。法も基本理念に負担の抑制と公正な移行を掲げる<br><br><b>答案に書くなら</b>　経済の観点から、課題は賦課金の負担が産業・家計のエネルギーコストに及ぶことであり、法は中長期的な負担の抑制と公正な移行を基本理念とする。<br><br><b>関連</b>　単価は政令で定める。<br><br><b>答案での使い方</b>　Ⅱ-1の課題。観点名を明記して書く<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505AC0000000032\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【化石燃料賦課金・成長志向型カーボンプライシング構想｜解決策】賦課金の負担を抑える仕組みを、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　単価を上限・下限の算定式の範囲内で政令により定め、エネルギー施策との整合等に応じて減額・還付を認める<br><br><b>解説</b>　単価を青天井にしないよう法が上限と下限の算定式を置き、その範囲内で政令により単価を決める。さらに産業への影響を考えて減額・還付も認める<br><br><b>答案に書くなら</b>　解決策は、単価を上限・下限の算定式の範囲内で政令により定め、エネルギー施策との整合等に応じた減額・還付を認めることで負担を抑えることである。<br><br><b>関連</b>　上限は石油石炭税等の減収見込みを踏まえて算定される。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 負担抑制の解決策に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505AC0000000032\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【化石燃料賦課金・成長志向型カーボンプライシング構想｜解決策】企業の早期投資を促す設計を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　徴収開始時期と段階的に引き上げる方針を事前に示し、早く取り組むほど将来の負担が軽くなる設計にする<br><br><b>解説</b>　価格シグナルが働くには、企業が事前に負担の見通しを持てることが要る。開始時期と引上げ方針を先に示すと、早く動くほど有利になる<br><br><b>答案に書くなら</b>　解決策は、徴収開始時期と段階的に引き上げる方針を事前に示し、早期に取り組むほど将来の負担が軽くなる設計にして企業の早期投資を促すことである。<br><br><b>関連</b>　対策の3本目は20兆円規模の先行投資支援。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 予見性の解決策に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505AC0000000032\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【化石燃料賦課金・成長志向型カーボンプライシング構想｜注意】賦課金の単価は法律本文で定められているか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　定められていない。単価は政令で決め、法律が定めるのは上限・下限の算定式と徴収開始年度<br><br><b>解説</b>　法律が決めるのは骨格（上限・下限の算定式と徴収開始年度）で、具体的な単価は状況に応じて動かせるよう政令に委ねる<br><br><b>答案に書くなら</b>　賦課金の単価は法律本文では定められておらず、法の上限・下限の算定式の範囲内で政令により定める。<br><br><b>関連</b>　納付義務者も取り違えない（最終消費者ではなく採取・輸入事業者）。<br><br><b>答案での使い方</b>　「法律で単価を定める」と書くと減点<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/505AC0000000032\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【CCS事業法（二酸化炭素の貯留事業に関する法律）｜時期】CCS事業法の施行状況は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　段階施行で、探査は2024年8月、試掘は2024年11月、貯留事業・導管輸送は2026年5月22日に完全施行<br><br><b>解説</b>　事業が段階的に始まるため、法も3段階で施行された。探査は2024年8月、試掘は2024年11月、貯留事業と導管輸送は2026年5月22日で、現在は完全施行済み<br><br><b>答案に書くなら</b>　CCS事業法は段階施行され、2026年5月22日に貯留事業・導管輸送事業の規定まで完全施行された。<br><br><b>関連</b>　施行は探査→試掘→貯留事業の3段階。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで「施行済み」と示す<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000038\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【CCS事業法（二酸化炭素の貯留事業に関する法律）｜定義】CCS事業法とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　CO2を地下に貯蔵する貯留事業と、導管輸送事業に、許可制・届出制、保安規制、事業終了後の管理を定めた法律<br><br><b>解説</b>　CCSは電化や水素等では脱炭素化が難しい分野の排出を減らす手段。地下にCO2を長期貯蔵するため、事業の許可と保安、終了後の管理を法で定める必要がある<br><br><b>答案に書くなら</b>　CCS事業法とは、CO2の貯留事業と導管輸送事業について、許可制・届出制、保安規制、事業終了後の管理を定めた法律である。<br><br><b>関連</b>　国は2030年までに民間事業者がCCS事業を始める事業環境を整える方針。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://www.env.go.jp/council/content/i_18/000393953.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【CCS事業法（二酸化炭素の貯留事業に関する法律）｜制度】貯留事業の許可の仕組みは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　経産大臣が「特定区域」を指定して募集し、貯留区域ごとに許可。海域の指定は環境大臣の同意が必要<br><br><b>解説</b>　貯留層は特定の区域にしかなく、誰でも自由に掘れては困る。国が区域を指定して事業者を募集し、貯留区域ごとに許可する。海域は環境への影響があるので環境大臣の同意が必要になる<br><br><b>答案に書くなら</b>　経産大臣が特定区域を指定して募集し、貯留区域ごとに貯留事業を許可する。海域の指定には環境大臣の同意を要する。<br><br><b>関連</b>　貯留権は物権とみなされる。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。海域は経産・環境の共管<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000038\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【CCS事業法（二酸化炭素の貯留事業に関する法律）｜制度】注入終了後の管理の仕組みは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　事業者が引当金を積み、閉鎖措置の確認・廃止許可後は管理がJOGMECへ移り、事業者はJOGMECへ拠出金を納付<br><br><b>解説</b>　CO2は注入後も長期の監視が必要で、事業者が撤退しても管理は途切れさせられない。そこで事業者が引当金を積み、廃止後はJOGMECが管理を引き継ぐ<br><br><b>答案に書くなら</b>　事業者が引当金を積み、閉鎖措置の確認・廃止許可後は管理がJOGMECへ移り、事業者はJOGMECへ拠出金を納付する。<br><br><b>関連</b>　拠出金は少なくとも30年間分の管理費用を確保できる算定基準とする省令内容が整理されている。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。長期管理の資金確保<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000038\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【CCS事業法（二酸化炭素の貯留事業に関する法律）｜制度】漏えい等による損害の賠償責任は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　損害発生時の貯留事業者等が負う無過失責任。過失を立証されなくても責任を負う<br><br><b>解説</b>　漏えいが起きても、被害者が事業者の過失を証明するのは困難である。そのため無過失責任として被害者の救済を確実にする<br><br><b>答案に書くなら</b>　貯留事業者等は、漏えい等による損害について過失を立証されなくても賠償責任を負う無過失責任を負う。<br><br><b>関連</b>　賠償義務者は損害発生時の貯留事業者等。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の留意点に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000038\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【CCS事業法（二酸化炭素の貯留事業に関する法律）｜課題】CCSの課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　注入CO2が長期に安定して貯蔵され漏えいがないことの確認が要り、モニタリング・閉鎖措置の詳細設計が必要<br><br><b>解説</b>　CO2は地下に長期間とどまることが前提で、漏えいがないと確認できなければ温暖化対策の意味が薄れる。そのため監視と閉鎖措置の設計が課題になる<br><br><b>答案に書くなら</b>　技術の観点から、課題は注入したCO2が長期に安定して貯蔵され漏えいがないことの確認であり、モニタリング・閉鎖措置の詳細設計が必要なことである。<br><br><b>関連</b>　詳細は省令・ガイドラインで整理されている。<br><br><b>答案での使い方</b>　Ⅱ-1の課題。観点名を明記して書く<br><br>【出典】<a href=\"https://www.env.go.jp/council/content/i_18/000393953.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【CCS事業法（二酸化炭素の貯留事業に関する法律）｜解決策】CCSの漏えいリスクへの解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　貯留層の温度・圧力等の監視と報告を義務づけ、漏えい時は直ちに応急措置、閉鎖措置を確認して廃止を許可する<br><br><b>解説</b>　漏えいを早く見つけ、起きたら被害を拡げない手順を法で決めておく。注入後も監視・報告を義務づけ、廃止は安全確認後にのみ許可する<br><br><b>答案に書くなら</b>　技術・保安の観点から、解決策は貯留層の温度・圧力等の監視と報告を義務づけ、漏えい時は直ちに応急措置を講じ、閉鎖措置を確認して廃止を許可することである。<br><br><b>関連</b>　応急措置は法第48条、閉鎖措置の確認は第53条。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 保安面の解決策に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000038\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【CCS事業法（二酸化炭素の貯留事業に関する法律）｜注意】海底下CCSの許可は、海洋汚染等防止法と本法のどちらか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　本法に一元化され、経産大臣と環境大臣の共管となった<br><br><b>解説</b>　従来は海洋汚染等防止法の許可で海底下CCSを扱っていたが、事業の許可と保安を一体で扱うため、CCS事業法に一元化された<br><br><b>答案に書くなら</b>　海底下CCSの許可は本法に一元化されており、経済産業大臣と環境大臣の共管である。<br><br><b>関連</b>　海洋汚染等防止法の許可制度は本法へ一元化された（旧制度と混同しない）。<br><br><b>答案での使い方</b>　旧制度（海洋汚染等防止法の許可）と混同しない<br><br>【出典】<a href=\"https://www.env.go.jp/council/content/i_18/000393953.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【水素社会推進法｜時期】水素社会推進法の施行状況は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　令和6年法律第37号。2024年5月公布、2024年10月23日に施行済み。所管は経済産業省<br><br><b>解説</b>　水素社会推進法は令和6年法律第37号で、2024年5月に公布され10月23日に施行済み。所管は経産省で、価格差支援などの具体策は施行後に動いている<br><br><b>答案に書くなら</b>　水素社会推進法は2024年10月23日に施行済みであり、経済産業省が所管する。<br><br><b>関連</b>　施行後5年を目途に検討する規定がある。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで「施行済み」と示す<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000037\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【水素社会推進法｜定義】「低炭素水素等」とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　水素とアンモニア・合成メタン・合成燃料等で、製造時のCO2排出量が一定値以下と認められるもの（法第2条）<br><br><b>解説</b>　水素は燃やしてもCO2が出ないが、作る段階で出る場合がある。そこで製造時のCO2排出量が一定値以下のものだけを支援対象とする<br><br><b>答案に書くなら</b>　低炭素水素等とは、水素とアンモニア・合成メタン・合成燃料等であって、製造時のCO2排出量が一定値以下と認められるものをいう。<br><br><b>関連</b>　具体の化合物種と排出量の値は経産省令に委任されている。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000037\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【水素社会推進法｜制度】水素社会推進法の計画認定の仕組みは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　供給・利用事業者が計画を作り、主務大臣が認定。価格差支援は両者連名の共同計画で、供給の継続が要件<br><br><b>解説</b>　作る側だけ支援しても使う側がいないと続かず、逆も同じ。そこで供給と利用の両事業者が連名の共同計画を作って主務大臣が認定する<br><br><b>答案に書くなら</b>　供給・利用事業者が計画を作り主務大臣が認定する。価格差支援は両者連名の共同計画で、供給が継続することが要件である。<br><br><b>関連</b>　計画は単独でも共同でも作れる。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。需給一体で支援する点を書く<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000037\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【水素社会推進法｜制度】水素社会推進法の支援の実施主体は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　JOGMECが、継続的な供給に必要な資金や共用設備整備の資金として、認定事業者へ助成金を交付する<br><br><b>解説</b>　国が直接交付する形ではなく、専門機関のJOGMECを通じて助成する。助成を受けるのは認定を受けた事業者である<br><br><b>答案に書くなら</b>　支援の実施主体はJOGMECであり、認定事業者に対し、継続的な供給に必要な資金や共用設備整備の資金として助成金を交付する。<br><br><b>関連</b>　助成の根拠は法第10条。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。国が直接交付と書かない<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000037\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【水素社会推進法｜課題】低炭素水素等の課題を『制度・運用』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　大規模な利用ニーズの創出と、サプライチェーン構築に資する拠点の整備、保安規制の合理化が必要<br><br><b>解説</b>　低炭素水素は使う場所と作る場所が離れやすく、設備や保安の規制も壁になる。需要と供給網と規制の3点がそろって初めて自立する<br><br><b>答案に書くなら</b>　制度・運用の観点から、課題は大規模な利用ニーズの創出、サプライチェーン構築に資する拠点の整備、保安規制の合理化が必要なことである。<br><br><b>関連</b>　価格差の課題もある。<br><br><b>答案での使い方</b>　Ⅱ-1の課題。観点名を明記して書く<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000037\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【水素社会推進法｜解決策】供給拠点づくりの解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　拠点整備支援（助成）と、港湾法・高圧ガス保安法・道路占用の特例を、規制緩和と一体で進める<br><br><b>解説</b>　拠点を作るには資金と規制の壁がある。そこで助成と、港湾法・高圧ガス保安法・道路占用の特例をセットで進める<br><br><b>答案に書くなら</b>　制度の観点から、解決策は拠点整備支援（助成）と、港湾法・高圧ガス保安法・道路占用の特例を規制緩和と一体で進めることである。<br><br><b>関連</b>　特例は法第四章に置かれている。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 制度面の解決策に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000037\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【水素社会推進法｜解決策】国際サプライチェーンの解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　炭素集約度で評価する基準を日本が主導して策定し、国際標準と相互認証の認証スキームの構築を進める<br><br><b>解説</b>　水素等は国際的に取引されるため、製造方法ごとのCO2排出量を測る共通のものさしが必要になる<br><br><b>答案に書くなら</b>　国際面の観点から、解決策は炭素集約度で評価する基準を日本が主導して策定し、国際標準と相互認証の認証スキームの構築を進めることである。<br><br><b>関連</b>　認証スキームの構築は進められている段階で、国際サプライチェーンの活発化に向けた整備が要る。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 国際面の解決策に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000037\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【水素社会推進法｜注意】水素社会推進法の対象は水素だけか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　水素だけでなく、アンモニア・合成メタン・合成燃料等を含む「水素等」<br><br><b>解説</b>　対象を水素だけとすると誤り。アンモニアや合成メタン、合成燃料も含めて「水素等」と呼び、これらが脱炭素化の難しい分野の燃料・原料になる<br><br><b>答案に書くなら</b>　本法の対象は水素だけでなく、アンモニア・合成メタン・合成燃料等を含む水素等である。<br><br><b>関連</b>　支援の実施主体はJOGMEC（国が直接交付するのではない）。<br><br><b>答案での使い方</b>　対象を水素のみと書くと減点<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/506AC0000000037\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ペロブスカイト太陽電池（次世代型太陽電池戦略）｜時期】次世代型太陽電池戦略はいつ策定され、どの計画に目標が反映されたか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2024年11月に官民協議会が策定。第7次エネルギー基本計画とGX2040ビジョン（2025年2月）に目標を反映<br><br><b>解説</b>　日本はフィルム型の研究で世界をリードしてきたが、中国が量産に動いている。そこで官民協議会が2024年11月に戦略を作り、国の計画に目標を反映した<br><br><b>答案に書くなら</b>　次世代型太陽電池戦略は2024年11月に官民協議会が策定し、第7次エネルギー基本計画とGX2040ビジョンに目標が反映された。<br><br><b>関連</b>　GX2040ビジョンは2025年2月に閣議決定。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで時期と位置づけを示す<br><br>【出典】<a href=\"https://www.nedo.go.jp/content/800032923.pdf\" target=\"_blank\" rel=\"noopener\">NEDO（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ペロブスカイト太陽電池（次世代型太陽電池戦略）｜定義】ペロブスカイト太陽電池とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　軽量・柔軟で、従来のシリコン系では難しかった耐荷重性の低い屋根や壁面にも設置できる次世代型太陽電池<br><br><b>解説</b>　シリコン系は重く硬く、耐荷重性の低い屋根や壁面には置けなかった。軽く曲がる電池ならそうした場所も使え、日本の適地制約を和らげる<br><br><b>答案に書くなら</b>　ペロブスカイト太陽電池とは、軽量・柔軟で、耐荷重性の低い屋根や壁面にも設置できる次世代型太陽電池である。<br><br><b>関連</b>　日本はフィルム型の研究開発で世界をリードしてきた。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://www.nedo.go.jp/content/800032923.pdf\" target=\"_blank\" rel=\"noopener\">NEDO（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ペロブスカイト太陽電池（次世代型太陽電池戦略）｜目標】ペロブスカイト太陽電池の発電コスト目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2025年20円/kWh、2030年14円/kWh、2040年に自立化可能な10〜14円/kWh以下<br><br><b>解説</b>　量産とコスト低減を年次で示し、民間が投資判断できるようにしている。単位は円/kWhで、コストが下がるほど補助なしで普及する<br><br><b>答案に書くなら</b>　発電コストの目標は、2025年20円/kWh、2030年14円/kWh、2040年に自立化可能な10〜14円/kWh以下である。<br><br><b>関連</b>　数字は技術確立の目標で、実際の販売価格や発電実績ではない。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の数字。年次とセットで書く<br><br>【出典】<a href=\"https://www.nedo.go.jp/content/800032923.pdf\" target=\"_blank\" rel=\"noopener\">NEDO（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ペロブスカイト太陽電池（次世代型太陽電池戦略）｜注意】ペロブスカイト太陽電池の「約20GW」は何の目標か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2040年の導入目標。2030年の目標は導入量ではなく、GW級の量産体制と14円/kWh<br><br><b>解説</b>　量の目標（GW）と、コストや量産体制の目標は年次によって違う。20GWは最終年次の2040年の導入量<br><br><b>答案に書くなら</b>　約20GWは2040年の導入目標であり、2030年の目標は導入量ではなくGW級の量産体制と14円/kWhである。<br><br><b>関連</b>　政府施設の導入目標（2035年50〜70MW・2040年100MW以上）は別の数字。<br><br><b>答案での使い方</b>　年次の取り違えは減点。2030年は量産体制と書く<br><br>【出典】<a href=\"https://www.nedo.go.jp/content/800032923.pdf\" target=\"_blank\" rel=\"noopener\">NEDO（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ペロブスカイト太陽電池（次世代型太陽電池戦略）｜課題】ペロブスカイト太陽電池の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　長期に安定した性能を保つ耐久性の確立、製品サイズへの大型化・モジュール化、発電コストの低減が必要<br><br><b>解説</b>　新しい電池は、屋外で長期に使える耐久性、大きなサイズの製品化、価格の3点がそろわないと実用化できない<br><br><b>答案に書くなら</b>　技術の観点から、課題は長期に安定した性能を保つ耐久性の確立、製品サイズへの大型化・モジュール化、発電コストの低減が必要なことである。<br><br><b>関連</b>　GI基金の計画もこの3点を課題として整理している。<br><br><b>答案での使い方</b>　Ⅱ-1の課題。観点名を明記して書く<br><br>【出典】<a href=\"https://www.nedo.go.jp/content/800032923.pdf\" target=\"_blank\" rel=\"noopener\">NEDO（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ペロブスカイト太陽電池（次世代型太陽電池戦略）｜課題】ペロブスカイト太陽電池の課題を『産業競争力』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　中国など諸外国の研究開発・量産化が激化し、製品化と市場獲得の速度が競争力を左右する<br><br><b>解説</b>　日本が先行した技術でも、量産と市場獲得で負ければ産業にならない。中国など諸外国が研究開発・量産化を急いでおり、速度が競争力を左右する<br><br><b>答案に書くなら</b>　産業競争力の観点から、課題は中国など諸外国の研究開発・量産化が激化し、製品化と市場獲得の速度が競争力を左右することである。<br><br><b>関連</b>　戦略は「規模とスピード」を掲げる。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 経済・産業の観点の課題に<br><br>【出典】<a href=\"https://www.nedo.go.jp/content/800032923.pdf\" target=\"_blank\" rel=\"noopener\">NEDO（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ペロブスカイト太陽電池（次世代型太陽電池戦略）｜解決策】技術課題への解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　GI基金で量産技術と社会実証を支援し、2030年に14円/kWhを目指す。タンデム型の開発も加速する<br><br><b>解説</b>　GI基金は、民間だけでは難しい研究開発と実証を国が支える仕組み。タンデム型は別の材料と重ねて発電効率を上げる方式で、将来の効率向上の鍵になる<br><br><b>答案に書くなら</b>　技術の観点から、解決策はGI基金で量産技術と社会実証を支援して2030年に14円/kWhを目指し、タンデム型の開発も加速することである。<br><br><b>関連</b>　タンデム型は変換効率30%以上が目標。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 技術面の解決策に<br><br>【出典】<a href=\"https://www.nedo.go.jp/content/800032923.pdf\" target=\"_blank\" rel=\"noopener\">NEDO（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ペロブスカイト太陽電池（次世代型太陽電池戦略）｜解決策】初期需要づくりの解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　政府機関・自治体・環境価値を重視する民間企業が初期需要を牽引し、導入補助で投資の予見性を確保する<br><br><b>解説</b>　新技術は最初は高く需要が小さい。そこで政府機関・自治体・環境価値を重視する民間企業が先に買い、補助で投資の予見性を確保して量産を後押しする<br><br><b>答案に書くなら</b>　需要面の観点から、解決策は政府機関・自治体・環境価値を重視する民間企業が初期需要を牽引し、導入補助で投資の予見性を確保することである。<br><br><b>関連</b>　導入補助は2025年度から始まっている。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 需要面の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000389653.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【洋上風力のEEZ拡大（再エネ海域利用法改正）｜時期】再エネ海域利用法の改正の公布と施行はいつ？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2025年6月11日公布、2026年4月1日施行（施行済み）。閣議決定は2025年3月7日<br><br><b>解説</b>　再エネ海域利用法の改正は2025年6月11日公布、2026年4月1日施行で、現在は施行済み。2025年3月7日の閣議決定は法案を決めた日で、公布・施行とは別<br><br><b>答案に書くなら</b>　改正再エネ海域利用法は2025年6月に公布、2026年4月1日に施行済みであり、EEZでの洋上風力の設置が許可制の対象になった。<br><br><b>関連</b>　閣議決定（2025年3月7日）と取り違えない。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで施行済みと示す。閣議決定と混同しない<br><br>【出典】<a href=\"https://www.mlit.go.jp/report/press/port01_hh_000291.html\" target=\"_blank\" rel=\"noopener\">国土交通省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【洋上風力のEEZ拡大（再エネ海域利用法改正）｜定義】EEZへの洋上風力拡大とは何が変わったのか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　従来は領海・内水のみが対象。改正でEEZでの設置を許可する制度と、海洋環境保全のため国が調査する仕組みを新設<br><br><b>解説</b>　EEZ（排他的経済水域）は領海の外側の海域。従来の法は領海と内水にしか適用されず、EEZの設置ルールがなかった。改正で許可制度と、海洋環境保全のための国の調査が新設された<br><br><b>答案に書くなら</b>　EEZへの拡大とは、従来の領海・内水に限られた洋上風力の対象を広げ、EEZでの設置を許可する制度と国による海洋環境調査を新設したことである。<br><br><b>関連</b>　案件形成目標の達成が目的。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://www.mlit.go.jp/report/press/port01_hh_000291.html\" target=\"_blank\" rel=\"noopener\">国土交通省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【洋上風力のEEZ拡大（再エネ海域利用法改正）｜制度】EEZでの設置許可の流れは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　経産大臣が募集区域を指定→申請→経産・国交大臣が仮許可（5年以内）→協議会→許可<br><br><b>解説</b>　沖合は先行利用者や環境への影響が大きいため、国が区域を決めて募集し、仮許可で確認してから許可する二段階にしている<br><br><b>答案に書くなら</b>　経産大臣が募集区域を指定し、申請を受けて経産・国交大臣が仮許可（5年以内）を出し、協議会での協議を経て許可する二段階審査である。<br><br><b>関連</b>　許可の有効期間は法が数値を定めず個別に定める。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。二段階審査と書く<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/430AC0000000089\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【洋上風力のEEZ拡大（再エネ海域利用法改正）｜目標】洋上風力の案件形成目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2030年までに1,000万kW、2040年までに3,000万〜4,500万kW<br><br><b>解説</b>　洋上風力は2030年と2040年で段階的に増やす計画で、数字を取り違えやすい。EEZを開くのも、この目標に届かせるため<br><br><b>答案に書くなら</b>　洋上風力の案件形成目標は、2030年までに1,000万kW、2040年までに3,000万〜4,500万kWである。<br><br><b>関連</b>　2030年と2040年を取り違えない。<br><br><b>答案での使い方</b>　Ⅱ-1の数字。2030年と2040年を取り違えない<br><br>【出典】<a href=\"https://www.mlit.go.jp/report/press/port01_hh_000291.html\" target=\"_blank\" rel=\"noopener\">国土交通省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【洋上風力のEEZ拡大（再エネ海域利用法改正）｜課題】EEZ洋上風力の課題を『制度・運用』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　漁業・航路・港湾・系統との調整。許可基準に漁業・航路への支障がないこと、基地港湾の利用、電線路との接続がある<br><br><b>解説</b>　沖合でも漁場、船の航路、港湾、送電網との関係は避けて通れない。法は許可基準にこれらへの支障がないことを入れて調整する<br><br><b>答案に書くなら</b>　制度・運用の観点から、課題は漁業・航路・港湾・系統との調整であり、許可基準に漁業・航路への支障がないこと、基地港湾の利用、電線路との接続が置かれている。<br><br><b>関連</b>　先行利用者との調整は協議会が担う。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅲ 先行利用者との調整の観点の課題に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/430AC0000000089\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【洋上風力のEEZ拡大（再エネ海域利用法改正）｜課題】EEZ洋上風力の課題を『環境』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　区域指定の前に海洋環境の情報を把握すること。このため環境大臣が募集区域の海洋環境を調査し、結果を踏まえて区域を指定する仕組みが新設された<br><br><b>解説</b>　従来の再エネ海域利用法は領海・内水だけが対象で、EEZで区域ごとに海洋環境を調べる仕組みがなかった。改正で、環境大臣が調査して結果を経産大臣に通知・公表し、それを受けて区域を指定する<br><br><b>答案に書くなら</b>　環境の観点から、課題は、沖合の募集区域で海洋環境の情報を事前に把握し、区域指定に適切に反映することである。<br><br><b>関連</b>　調査を担うのは環境大臣。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅲ 環境影響の観点の課題に<br><br>【出典】<a href=\"https://www.mlit.go.jp/report/press/port01_hh_000291.html\" target=\"_blank\" rel=\"noopener\">国土交通省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【洋上風力のEEZ拡大（再エネ海域利用法改正）｜解決策】利害関係者の調整の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　協議会で利害関係者を含め協議し、その結果を尊重する。仮許可と許可の二段階審査で事業の確実性を担保<br><br><b>解説</b>　沖合の海は多くの人が使っており、一度に全員の合意を取るのは難しい。そこで協議の場を作って尊重し、仮許可・許可の二段階審査で、実行できる案件に絞る<br><br><b>答案に書くなら</b>　合意形成の観点から、解決策は協議会で利害関係者を含めて協議してその結果を尊重し、仮許可と許可の二段階審査で事業の確実性を担保することである。<br><br><b>関連</b>　協議会は両大臣が組織する。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅲ 合意形成の解決策に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/430AC0000000089\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【洋上風力のEEZ拡大（再エネ海域利用法改正）｜注意】領海・内水とEEZでは、洋上風力の仕組みは同じか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　別。領海・内水は「促進区域」（公募占用計画の認定）、EEZは「募集区域」（仮許可→許可）。EEZの許可は経産・国交の共管<br><br><b>解説</b>　領海・内水の制度は先に作られ、EEZは改正で新しく加わった別の仕組み。用語が似ているが、公募方式も許可権者も違う<br><br><b>答案に書くなら</b>　領海・内水は促進区域（公募占用計画の認定）、EEZは募集区域（仮許可から許可）であり、EEZの許可は経産・国交両大臣の共管である。<br><br><b>関連</b>　環境大臣は調査を担う。<br><br><b>答案での使い方</b>　用語の取り違えは減点。環境大臣は調査を担う<br><br>【出典】<a href=\"https://www.mlit.go.jp/kowan/content/001879078.pdf\" target=\"_blank\" rel=\"noopener\">国土交通省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【二国間クレジット制度（JCM）｜時期】JCMのパートナー国は何か国か（2026年5月時点）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　32か国（2026年5月29日時点）。2013年1月のモンゴルとの署名に始まり、法制化は令和6年の温対法改正<br><br><b>解説</b>　JCMは2013年1月のモンゴルとの署名に始まり、パートナー国が広がってきた。令和6年の温対法改正で法制化され、登録簿と指定実施機関が法に規定された<br><br><b>答案に書くなら</b>　JCMのパートナー国は2026年5月29日時点で32か国であり、2013年1月のモンゴルとの署名に始まる。<br><br><b>関連</b>　直近の追加はオマーン（2026年4月）。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで現状を示す<br><br>【出典】<a href=\"https://www.env.go.jp/content/000377659.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【二国間クレジット制度（JCM）｜定義】JCMとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　日本とパートナー国が協力して実施した対策による排出削減・吸収量を、両国の貢献度に応じて配分する仕組み<br><br><b>解説</b>　途上国での対策に日本が技術・資金で協力し、得られた削減量を両国で分け合う。日本はNDCに計上でき、相手国は排出削減のための技術導入が進む<br><br><b>答案に書くなら</b>　JCMとは、日本とパートナー国が協力して実施した対策による排出削減・吸収量を、両国の貢献度に応じて配分する仕組みである。<br><br><b>関連</b>　パリ協定第6条2項に整合する制度。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000377659.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【二国間クレジット制度（JCM）｜目標】JCMの削減量の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　官民連携で2030年度までの累積1億t-CO2程度、2040年度までの累積2億t-CO2程度<br><br><b>解説</b>　日本の排出削減目標の一部を、海外での削減で積み増す計画。官民連携で年度ごとに累積量を目標にしている<br><br><b>答案に書くなら</b>　JCMの削減量目標は、官民連携で2030年度までの累積1億t-CO2程度、2040年度までの累積2億t-CO2程度である。<br><br><b>関連</b>　地球温暖化対策計画とNDCに位置づく。<br><br><b>答案での使い方</b>　Ⅱ-1の数字。「累積」「年度まで」を落とさない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000377659.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【二国間クレジット制度（JCM）｜制度】JCMの「相当調整」とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　日本が無効化した量を日本の排出量から差し引き、同量をパートナー国の排出量に上乗せして二重計上を防ぐ<br><br><b>解説</b>　同じ削減量を日本と相手国の双方が数えると二重計上になる。そこで日本が無効化した量を日本の排出量から差し引き、同量を相手国の排出量に上乗せして調整する<br><br><b>答案に書くなら</b>　相当調整とは、日本が無効化した量を日本の排出量から差し引き、同量をパートナー国の排出量に上乗せして二重計上を防ぐ仕組みである。<br><br><b>関連</b>　クレジットを取消すとNDCに計上されない。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。パリ協定第6条の肝<br><br>【出典】<a href=\"https://www.env.go.jp/content/000377659.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【二国間クレジット制度（JCM）｜制度】JCMのクレジット量はどう算定するか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　BaU排出量を十分に下回る「リファレンス排出量」と比較して保守的に算定し、両国政府が承認する<br><br><b>解説</b>　何もしない場合（BaU）より少なく見積もると、削減量が水増しになる。そこで基準を十分に下回るリファレンス排出量を使って控えめに算定し、両国が承認する<br><br><b>答案に書くなら</b>　クレジット量はBaU排出量を十分に下回るリファレンス排出量と比較して保守的に算定し、両国政府が承認する。<br><br><b>関連</b>　第6条の手続でクレジット移転量を承認する。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。環境十全性の根拠<br><br>【出典】<a href=\"https://www.env.go.jp/content/000377659.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【二国間クレジット制度（JCM）｜課題】JCMの課題を『環境十全性』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　二重計上の防止と保守的算定の確保。相手国のインベントリの整備状況によっては、削減量が反映されない場合がある<br><br><b>解説</b>　削減量が過大だったり二重に数えられたりすると、地球全体の排出は減らない。これを防ぐのが環境十全性で、相手国の排出量の把握体制も関わる<br><br><b>答案に書くなら</b>　環境十全性の観点から、課題は二重計上の防止と保守的算定の確保であり、相手国のインベントリの整備状況によっては削減量が反映されない場合がある。<br><br><b>関連</b>　解決は相当調整と第6条報告で担保。<br><br><b>答案での使い方</b>　Ⅱ-1の課題。観点名を明記して書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000377659.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【二国間クレジット制度（JCM）｜解決策】JCMの事務の効率化の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　指定実施機関（JCMA）が多数の国と同時に調整し、クレジット発行までの事務をワンストップ化する<br><br><b>解説</b>　多くの国と同時に進めると手続きが膨らむ。温対法の改正で指定実施機関を規定し、公益財団法人地球環境センターがJCMAとして指定されている<br><br><b>答案に書くなら</b>　運用面の観点から、解決策は指定実施機関（JCMA）が多数の国と同時に調整し、クレジット発行までの事務をワンストップ化して効率化・迅速化することである。<br><br><b>関連</b>　根拠は令和6年の温対法改正。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 運用面の解決策に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/410AC0000000117\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【二国間クレジット制度（JCM）｜注意】JCMの1億tと2億tは、単年の削減量か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　単年ではない。1億tは2030年度までの累積、2億tは2040年度までの累積<br><br><b>解説</b>　2030年度や2040年度は期限で、それまでに積み上げる累積量の目標。毎年の削減量と読み違えると、規模感が大きく狂う<br><br><b>答案に書くなら</b>　JCMの1億tは2030年度までの累積、2億tは2040年度までの累積であり、単年の削減量ではない。<br><br><b>関連</b>　「累積」「年度まで」を落とさない。<br><br><b>答案での使い方</b>　数字の読み違えは減点。累積と書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000377659.pdf\" target=\"_blank\" rel=\"noopener
