const NJ_PLAN_DATA = [{"f": "二次:計画", "q": "【第六次環境基本計画】第六次環境基本計画が閣議決定された年月日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2024年5月21日<br><br><b>使い方</b>　R7 Ⅰ-1で出題。第五次（R2題材）と混同しない<br><br>【出典】https://www.env.go.jp/content/000223504.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画】環境基本計画の策定根拠となる条文は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　環境基本法第15条<br><br><b>使い方</b>　目的規定は第1条。条番号を混同しない<br><br>【出典】https://www.env.go.jp/content/000223504.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画】第六次環境基本計画が掲げる2030年度の温室効果ガス削減目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2013年度比46%削減（さらに50%の高みに向け挑戦）<br><br><b>使い方</b>　本計画が明記するのは46%とCN2050のみ<br><br>【出典】https://www.env.go.jp/content/000223504.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画】30by30とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2030年までに陸と海の30%以上を保全地域・OECMとする国際目標<br><br><b>使い方</b>　ネイチャーポジティブ実現の手段として位置づく<br><br>【出典】https://www.env.go.jp/content/000223504.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画】OECMとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　保護地域以外で生物多様性保全に資する地域<br><br><b>使い方</b>　30by30の達成に算入される地域<br><br>【出典】https://www.env.go.jp/content/000223504.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画】ネイチャーポジティブとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2030年までに生物多様性の損失を止め、反転させることを目指す概念<br><br><b>使い方</b>　30by30の達成が手段<br><br>【出典】https://www.env.go.jp/content/000223504.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画】シン・自然資本とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　自然資本と、それを維持・回復・充実させる人工・人的・社会関係資本等を総称した概念<br><br><b>使い方</b>　自然資本投資の課題整理に使う<br><br>【出典】https://www.env.go.jp/content/000223505.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画】成長志向型カーボンプライシング構想とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　GX先行投資を促しつつ、将来の炭素価格負担を段階的に導入し、脱炭素と競争力を両立させる構想<br><br><b>使い方</b>　制度・政策面の課題と解決策に使える<br><br>【出典】https://www.env.go.jp/content/000223505.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画】第六次環境基本計画で、地域循環共生圏が位置づく重点戦略は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　環境・経済・社会の統合的向上の実践・実装の場としての地域づくり<br><br><b>使い方</b>　地域脱炭素とネイチャーポジティブを同時解決<br><br>【出典】https://www.env.go.jp/content/000223505.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画】2035年度60%・2040年度73%削減は第六次環境基本計画に明記されているか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　明記されていない。地球温暖化対策計画（2025年2月閣議決定）の数字である<br><br><b>使い方</b>　両計画の数字を混同しない<br><br>【出典】https://www.env.go.jp/content/000223504.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画】地球温暖化対策計画（現行）が閣議決定された年月日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2025年2月18日（2021年10月22日閣議決定の前計画を改定）<br><br><b>使い方</b>　R8 Ⅰ-2は家庭部門が題材<br><br>【出典】https://www.env.go.jp/content/000291668.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画】地球温暖化対策計画の根拠法と条文は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　地球温暖化対策の推進に関する法律第8条第1項<br><br><b>使い方</b>　環境基本法第15条（環境基本計画）と混同しない<br><br>【出典】https://www.env.go.jp/content/000291668.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画】地球温暖化対策計画の2030年度目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2013年度比46%削減（7.6億トン）。さらに50%の高みに向け挑戦<br><br><b>使い方</b>　旧計画から不変<br><br>【出典】https://www.env.go.jp/content/000291668.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画】地球温暖化対策計画の2035年度目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2013年度比60%削減（5.7億トン）<br><br><b>使い方</b>　本改定で新設された目標<br><br>【出典】https://www.env.go.jp/content/000291668.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画】地球温暖化対策計画の2040年度目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2013年度比73%削減（3.8億トン）<br><br><b>使い方</b>　本改定で新設。2050年ネットゼロへの直線経路<br><br>【出典】https://www.env.go.jp/content/000291668.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画】2030年度までに創出を目指す脱炭素先行地域の数は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　100以上<br><br><b>使い方</b>　民生部門の電力消費に伴うCO2実質ゼロ等を目指す地域<br><br>【出典】https://www.env.go.jp/content/000291668.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画】家庭部門のエネルギー起源CO2の2030年度目安は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　71百万t（2013年度209百万tから▲66%）<br><br><b>使い方</b>　R8 Ⅰ-2の題材。46%等の全体目標と取り違えない<br><br>【出典】https://www.env.go.jp/content/000291668.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画】運輸部門のエネルギー起源CO2の2030年度目安は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　146百万t（2013年度比▲35%）<br><br><b>使い方</b>　2040年度は約40〜80百万t（▲64〜82%）の目安<br><br>【出典】https://www.env.go.jp/content/000291668.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画】JCM（二国間クレジット制度）の累積削減目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2030年度までに1億t-CO2程度、2040年度までに2億t-CO2程度<br><br><b>使い方</b>　日本のNDC達成にカウントする制度<br><br>【出典】https://www.env.go.jp/content/000291668.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画】2035・2040年度の部門別CO2数値の位置づけは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　複数シナリオ分析に基づく幅のある「目安」であり、確定値ではない<br><br><b>使い方</b>　答案で確定値のように書かない<br><br>【出典】https://www.env.go.jp/content/000291668.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画】GX2040ビジョンと第7次エネルギー基本計画の閣議決定日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　いずれも2025年2月18日<br><br><b>使い方</b>　別個の文書。GX2040は2023年7月の戦略の改訂版<br><br>【出典】https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画】GX2040ビジョンの根拠となる法律は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　脱炭素成長型経済構造移行推進法（GX推進法、令和5年法律第32号）<br><br><b>使い方</b>　エネ基の根拠法とは異なる<br><br>【出典】https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画】第7次エネルギー基本計画の根拠条文は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　エネルギー政策基本法第12条第1項<br><br><b>使い方</b>　GX2040はGX推進法。根拠法が違う<br><br>【出典】https://www.enecho.meti.go.jp/category/others/basic_plan/pdf/20250218_03.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画】2040年度の電源構成（目安）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　再エネ4〜5割程度、火力3〜4割程度、原子力2割程度（発電電力量）<br><br><b>使い方</b>　暫定値であり確定した数値目標ではない<br><br>【出典】https://www.enecho.meti.go.jp/category/others/basic_plan/pdf/20250218_03.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画】2040年度のエネルギー自給率の見通しは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　3〜4割程度（2022年度実績は12.6%）<br><br><b>使い方</b>　数字は年度・実績値とセットで書く<br><br>【出典】https://www.enecho.meti.go.jp/category/others/basic_plan/pdf/20250218_03.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画】GX経済移行債で先行投資支援する規模と、呼び込む官民投資の規模は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　10年間で20兆円規模の支援により、150兆円規模の官民投資を呼び込む<br><br><b>使い方</b>　GX実現に向けた基本方針（2023年2月）以降の数字<br><br>【出典】https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画】排出量取引制度（GX-ETS）が本格稼働する年度は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2026年度<br><br><b>使い方</b>　2023年度開始の自主参加型GXリーグ（第1段階）と混同しない<br><br>【出典】https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画】化石燃料賦課金の導入予定年度は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2028年度<br><br><b>使い方</b>　排出量取引制度と合わせたカーボンプライシングの一手法<br><br>【出典】https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画】GX推進機構が業務を開始した年月は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2024年7月<br><br><b>使い方</b>　排出量取引制度の運営やGX投資のファイナンス支援を担う<br><br>【出典】https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画】S+3Eとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　安全性を前提に、安定供給・経済効率性・環境適合の3Eを同時達成するエネルギー政策の基本視点<br><br><b>使い方</b>　エネルギー政策の課題整理で使う<br><br>【出典】https://www.enecho.meti.go.jp/category/others/basic_plan/pdf/20250218_01.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画】気候変動適応計画が閣議決定された年月日と一部変更の日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2021年10月22日に閣議決定、2023年5月30日に一部変更<br><br><b>使い方</b>　一部変更で熱中症対策実行計画が第4章に追加<br><br>【出典】https://www.env.go.jp/content/000176391.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画】気候変動適応計画の変更の根拠条文は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　気候変動適応法第8条第1項（当初の策定は第7条第1項）<br><br><b>使い方</b>　熱中症対策実行計画の根拠は第16条第1項<br><br>【出典】https://www.env.go.jp/content/000176391.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画】熱中症対策実行計画の根拠条文は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2023年4月改正の気候変動適応法第16条第1項<br><br><b>使い方</b>　適応計画の変更根拠（第8条第1項）と混同しない<br><br>【出典】https://www.env.go.jp/content/000136709.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画】熱中症対策実行計画の中期目標（2030年）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　熱中症死亡者数（5年移動平均）を現状（令和4年概数1,295名）から半減<br><br><b>使い方</b>　基準値は令和4年概数1,295名<br><br>【出典】https://www.env.go.jp/content/000136709.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画】気候変動適応計画の計画期間は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　今後おおむね5年間<br><br><b>使い方</b>　影響評価もおおむね5年ごとに実施し、結果を勘案して改定<br><br>【出典】https://www.env.go.jp/content/000176391.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画】気候変動適応計画で第2章の分野別施策にあたる「7分野」は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　農業・林業・水産業、水環境・水資源、自然生態系、自然災害・沿岸域、健康、産業・経済活動、国民生活・都市生活<br><br><b>使い方</b>　7つの基本戦略とは別物<br><br>【出典】https://www.env.go.jp/content/000176391.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画】気候変動適応計画の「7つの基本戦略」は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　施策への組み込み、科学的知見、情報基盤、地域推進、事業者等促進、国際貢献、関係機関連携<br><br><b>使い方</b>　7分野と取り違えない<br><br>【出典】https://www.env.go.jp/content/000176391.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画】A-PLATとAP-PLATの運営主体と対象の違いは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　いずれも国立環境研究所が運営。A-PLATは国内向け、AP-PLATはアジア太平洋の途上国向け<br><br><b>使い方</b>　適応情報基盤の解決策で使う<br><br>【出典】https://www.env.go.jp/content/000176391.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画】地域気候変動適応計画の策定について、都道府県・市町村にはどの程度の義務があるか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　努力義務にとどまる<br><br><b>使い方</b>　地域間の適応力の差が課題・リスクの論点<br><br>【出典】https://www.env.go.jp/content/000176391.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画】流域治水とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　河川整備だけでなく流域全体の関係者が協働し、ハード・ソフト一体で水害リスクを低減する治水の考え方<br><br><b>使い方</b>　適応策の解決策に使える<br><br>【出典】https://www.env.go.jp/content/000176391.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030】生物多様性国家戦略2023-2030の閣議決定日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2023年3月31日<br><br><b>使い方</b>　R6 Ⅰ-1、R8 Ⅰ-1で出題<br><br>【出典】https://www.env.go.jp/content/000124381.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030】生物多様性国家戦略2023-2030の根拠条文は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　生物多様性基本法第12条第1項<br><br><b>使い方</b>　第六次環境基本計画（環境基本法第15条）とは別の計画<br><br>【出典】https://www.env.go.jp/content/000124381.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030】生物多様性国家戦略2023-2030の基本戦略1〜3は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　①生態系の健全性の回復、②自然を活用した社会課題の解決、③ネイチャーポジティブ経済の実現<br><br><b>使い方</b>　R6 Ⅰ-1の3つの基本戦略<br><br>【出典】https://www.env.go.jp/content/000124381.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030】生物多様性国家戦略2023-2030の基本戦略4と5は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　4生活・消費活動における価値の認識と行動、5取組を支える基盤整備と国際連携の推進<br><br><b>使い方</b>　基本戦略は全部で5つ<br><br>【出典】https://www.env.go.jp/content/000124381.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030】生物多様性国家戦略2023-2030の目標の構成数は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　5つの基本戦略、15の状態目標、25の行動目標<br><br><b>使い方</b>　3つの基本戦略は全体の一部<br><br>【出典】https://www.env.go.jp/content/000124381.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030】30by30目標は国家戦略のどの行動目標に位置づく？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　行動目標1-1（2030年までに陸と海の30％以上を保全）<br><br><b>使い方</b>　30by30は戦略そのものではなく目標の一つ<br><br>【出典】https://www.env.go.jp/content/000124381.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030】自然共生サイトとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　民間等の取組で生物多様性が保全されている区域を国が認定する制度。日本版OECM<br><br><b>使い方</b>　OECMは国際的な保全区分の考え方<br><br>【出典】https://www.env.go.jp/content/000124381.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030】TNFDとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　企業・金融機関が自然資本・生物多様性のリスクと機会を評価し開示する、国際的な民間主導の枠組み<br><br><b>使い方</b>　基本戦略3（ネイチャーポジティブ経済）の用語<br><br>【出典】https://www.env.go.jp/content/000124381.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030】中間評価（2026年2月公表）での保護地域・OECMの占有割合は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　陸域21.0％（2025年時点）、海域13.3％（2021年以降変化なし）。目標はいずれも30％<br><br><b>使い方</b>　陸域は2023年3月時点20.5％から上昇<br><br>【出典】https://www.env.go.jp/content/000379260.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030】行動目標1-3が掲げる侵略的外来種対策の数値は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　侵略的外来種の定着率を50％削減する等、負の影響を防止・削減<br><br><b>使い方</b>　中間評価では50％以下に抑えられている<br><br>【出典】https://www.env.go.jp/content/000124381.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画】第五次循環型社会形成推進基本計画の閣議決定日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2024年8月2日<br><br><b>使い方</b>　副題は「循環経済を国家戦略に」<br><br>【出典】https://www.env.go.jp/content/000242560.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画】第五次循環型社会形成推進基本計画の根拠条文は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　循環型社会形成推進基本法（平成12年法律第110号）第15条<br><br><b>使い方</b>　環境基本法や生物多様性基本法とは別の法律が根拠<br><br>【出典】https://www.env.go.jp/content/000242560.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画】2030年度の資源生産性の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　約60万円/トン<br><br><b>使い方</b>　数値目標の年次は2030年度<br><br>【出典】https://www.env.go.jp/content/000242560.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画】2030年度の一人当たり天然資源消費量（マテリアルフットプリント）の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　約11トン/人・年<br><br><b>使い方</b>　一次資源等価換算の投入量から輸出分を引き人口で割った量<br><br>【出典】https://www.env.go.jp/content/000242560.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画】2030年度の再生可能資源及び循環資源の投入割合の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　約34％<br><br><b>使い方</b>　循環利用率とは別の指標<br><br>【出典】https://www.env.go.jp/content/000242560.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画】2030年度の入口側・出口側の循環利用率の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　入口側約19％、出口側約44％<br><br><b>使い方</b>　入口と出口の数字を取り違えない<br><br>【出典】https://www.env.go.jp/content/000242560.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画】2030年度の最終処分量の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　約1,100万トン/年<br><br><b>使い方</b>　廃棄物の埋立量を示す指標<br><br>【出典】https://www.env.go.jp/content/000242560.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画】循環経済関連ビジネスの市場規模目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2030年までに80兆円以上、2050年に120兆円（2020年は約50兆円）<br><br><b>使い方</b>　成長戦略フォローアップ工程表のKPIを踏襲<br><br>【出典】https://www.env.go.jp/content/000242560.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画】第五次循環基本計画の5つの重点分野（2.1〜2.5）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　①循環経済移行による地域と社会づくり②事業者間連携③地域の循環システム④基盤強靱化⑤国際資源循環<br><br><b>使い方</b>　R7 Ⅰ-2は2.2・2.3・2.5の3つ<br><br>【出典】https://www.env.go.jp/content/000242560.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第五次循環型社会形成推進基本計画】動静脈連携とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　製造・小売等の動脈産業と廃棄物処理・リサイクル等の静脈産業が連携し、再生材利用拡大と市場創出を図る取組<br><br><b>使い方</b>　重点分野②の中核用語<br><br>【出典】https://www.env.go.jp/content/000242560.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ】地域脱炭素ロードマップの決定日と決定主体は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2021年6月9日、国・地方脱炭素実現会議（第3回）の決定。閣議決定ではない<br><br><b>使い方</b>　R6 Ⅰ-2で出題。決定主体を混同しない<br><br>【出典】https://www.env.go.jp/content/000256901.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ】地域脱炭素ロードマップの法的な位置づけは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　法定計画ではない。裏付けは地球温暖化対策推進法の2021年改正条項<br><br><b>使い方</b>　実行計画・地域脱炭素化促進事業制度が新設<br><br>【出典】https://www.env.go.jp/content/000256901.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ】2021年ロードマップ当初の脱炭素先行地域の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2030年度までに少なくとも100か所をつくる<br><br><b>使い方</b>　当初の表現。現在の整理は選定年と実行年に分かれる<br><br>【出典】https://www.env.go.jp/content/000256901.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ】脱炭素先行地域の現在の目標年限の整理は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2025年度までに少なくとも100か所を選定し、2030年度までに実行<br><br><b>使い方</b>　選定年（2025年度）と実行年（2030年度）を取り違えない<br><br>【出典】https://www.env.go.jp/content/000376957.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ】脱炭素先行地域の定義の核は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　民生部門（家庭部門及び業務その他部門）の電力消費に伴うCO2排出の実質ゼロ<br><br><b>使い方</b>　運輸・熱利用等は地域特性に応じて実施<br><br>【出典】https://www.env.go.jp/content/000376957.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ】重点対策加速化事業の交付対象となる重点対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　8つの重点対策のうち①〜⑤（太陽光、地域共生型再エネ、ZEB化、住宅省エネ、ゼロカーボン・ドライブ）<br><br><b>使い方</b>　⑥〜⑧は対象外<br><br>【出典】https://www.env.go.jp/content/000256901.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ】ポジティブゾーニング（再エネ促進区域）とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　市町村が導入目標を設定し、環境配慮や地域貢献の要件を付して再エネ事業を促進する区域を選定する仕組み<br><br><b>使い方</b>　重点対策②。地域協議会で合意形成<br><br>【出典】https://www.env.go.jp/content/000256901.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ】脱炭素ドミノとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　脱炭素先行地域等のモデルを全国に伝搬させ、2050年を待たずに全国で脱炭素を実現する基本戦略<br><br><b>使い方</b>　ロードマップの基本戦略<br><br>【出典】https://www.env.go.jp/content/000256901.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ】ゼロカーボン・ドライブの2035年目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2035年までに乗用車新車販売の電動車割合を100%とする<br><br><b>使い方</b>　再エネ電力とEV/PHEV/FCVの組み合わせ<br><br>【出典】https://www.env.go.jp/content/000256901.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地域脱炭素ロードマップ】重点対策①の自家消費型太陽光発電の導入目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2030年に設置可能建築物の約50%、2040年に100%<br><br><b>使い方</b>　屋根置きなど自家消費型の太陽光発電<br><br>【出典】https://www.env.go.jp/content/000256901.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書】令和8年版の環境白書等が閣議決定された年月日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2026年6月5日（令和8年6月5日）<br><br><b>使い方</b>　環境の日に合わせて公表<br><br>【出典】https://www.env.go.jp/policy/hakusyo/r08/index.html", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書】令和8年版白書（合冊）の根拠となる3つの条文は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　環境基本法第12条、循環型社会形成推進基本法第14条、生物多様性基本法第10条<br><br><b>使い方</b>　第五次循環基本計画（同法第15条）とは別の文書<br><br>【出典】https://www.env.go.jp/policy/hakusyo/r08/index.html", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書】令和8年版白書のテーマは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　循環経済（サーキュラーエコノミー）で日本列島を強く豊かに<br><br><b>使い方</b>　令和7版・6版・5版とテーマを取り違えない<br><br>【出典】https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書】令和7年版環境白書のテーマは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　「新たな成長」を導く持続可能な生産と消費を実現するグリーンな経済システムの構築<br><br><b>使い方</b>　令和8年版（循環経済）と取り違えない<br><br>【出典】https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書】循環経済行動計画が目指す2030年までの投資規模は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　再資源化拠点等の構築・ネットワーク形成に向け、官民で約1兆円<br><br><b>使い方</b>　GX2040の150兆円（GX全体）と母集団が違う<br><br>【出典】https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書】循環経済行動計画が決定された年月と、柱は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2026年4月。再生資源供給サプライチェーンの強靱化と国際資源循環ネットワーク構築<br><br><b>使い方</b>　関係閣僚会議で決定<br><br>【出典】https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書】令和8年版白書による、2025年8月現在の保護地域及びOECMの指定割合は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　陸地約21.0％、海洋約13.3％<br><br><b>使い方</b>　目標は2030年までにいずれも30％<br><br>【出典】https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書】自然共生サイトの認定数（2026年3月時点）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　569ヶ所<br><br><b>使い方</b>　民間等の取組による保全区域を国が認定する制度<br><br>【出典】https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書】令和8年版白書が示す2025年の世界平均気温は工業化前比でどれだけ高い？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　約1.43℃（WMO発表）<br><br><b>使い方</b>　年と基準（工業化前比）をセットで書く<br><br>【出典】https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【令和8年版 環境白書・循環型社会白書・生物多様性白書】再資源化事業等高度化法と地域生物多様性増進法の施行時期は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　再資源化事業等高度化法は2025年11月、地域生物多様性増進法は2025年4月<br><br><b>使い方</b>　前者は高度な再資源化事業者の認定制度を創設<br><br>【出典】https://www.env.go.jp/policy/hakusyo/r08/gaiyou.pdf", "v": "primary", "keep": true}];
const NJ_TERM_DATA = [{"f": "二次:用語", "q": "【排出量取引制度（GX-ETS）】排出量取引制度で、排出枠1枠は何トンに当たり、事業者は何を保有する義務を負うか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　CO2 1トン。毎年度の排出実績量と同量の枠を期限までに保有する義務<br><br><b>使い方</b>　無償割当て・保有義務・事業者間取引が骨格<br><br>【出典】https://laws.e-gov.go.jp/law/505AC0000000032", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【排出量取引制度（GX-ETS）】排出量取引制度の根拠法と、2026年4月1日に施行された改正法は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　GX推進法（令和5年法律第32号）。改正は令和7年法律第52号<br><br><b>使い方</b>　2026年度から本格稼働。GXリーグ（試行）とは別物<br><br>【出典】https://laws.e-gov.go.jp/law/505AC0000000032", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【排出量取引制度（GX-ETS）】排出量取引制度の対象となる事業者の要件は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　CO2排出量の直近3年度平均が10万トン以上の事業者（施行令第2条）<br><br><b>使い方</b>　事業者単位で判定。子会社等は別事業者<br><br>【出典】https://laws.e-gov.go.jp/law/505CO0000000379", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【排出量取引制度（GX-ETS）】排出量取引制度の価格安定のため毎年度定める2つの価格は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　参考上限取引価格（法第39条）と調整基準取引価格（法第116条）<br><br><b>使い方</b>　年度開始前に定める<br><br>【出典】https://laws.e-gov.go.jp/law/505AC0000000032", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【排出量取引制度（GX-ETS）】排出枠が未償却の場合に課される負担金の額は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　未償却量×参考上限取引価格×1.1（法第41条）<br><br><b>使い方</b>　枠は投機的取引の対象にしてはならない（第38条第2項）<br><br>【出典】https://laws.e-gov.go.jp/law/505AC0000000032", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【排出量取引制度（GX-ETS）】発電事業者への排出枠の有償割当ては何年度から？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和15年度（2033年度）から（法第27条）<br><br><b>使い方</b>　賦課金2028年度との年度を取り違えない<br><br>【出典】https://laws.e-gov.go.jp/law/505AC0000000032", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【排出量取引制度（GX-ETS）】排出枠取引市場の設置・運営と価格調整の買入れを担う機関は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　GX推進機構（法第111条）<br><br><b>使い方</b>　徴収事務も同機構が担う<br><br>【出典】https://laws.e-gov.go.jp/law/505AC0000000032", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【化石燃料賦課金・成長志向型カーボンプライシング構想】化石燃料賦課金の徴収開始年度と納付義務者は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和10年度（2028年度）から。原油等を採取し、または保税地域から引き取る事業者<br><br><b>使い方</b>　家庭や一般企業に直接課すものではない<br><br>【出典】https://laws.e-gov.go.jp/law/505AC0000000032", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【化石燃料賦課金・成長志向型カーボンプライシング構想】化石燃料賦課金の賦課額の算式は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　単価×CO2排出量（トン）<br><br><b>使い方</b>　化石燃料由来のCO2排出量に応じて徴収<br><br>【出典】https://laws.e-gov.go.jp/law/505AC0000000032", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【化石燃料賦課金・成長志向型カーボンプライシング構想】化石燃料賦課金の単価は何で定め、法律は何を定めるか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　単価は政令で定める。法は上限・下限の算定式と徴収開始年度を定める（法第14条）<br><br><b>使い方</b>　負担抑制のため上限・下限と減額・還付（第15条）を置く<br><br>【出典】https://laws.e-gov.go.jp/law/505AC0000000032", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【化石燃料賦課金・成長志向型カーボンプライシング構想】GX経済移行債の発行期間と償還期限は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和5〜14年度に限り発行（法第7条）、令和32年度（2050年度）までに償還（法第8条）<br><br><b>使い方</b>　発行期間と償還期限を混同しない<br><br>【出典】https://laws.e-gov.go.jp/law/505AC0000000032", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【化石燃料賦課金・成長志向型カーボンプライシング構想】GX経済移行債の償還財源は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　化石燃料賦課金と特定事業者負担金の収入（法第8条）<br><br><b>使い方</b>　負担金は令和15年度から発電事業者に課す<br><br>【出典】https://laws.e-gov.go.jp/law/505AC0000000032", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【化石燃料賦課金・成長志向型カーボンプライシング構想】排出量取引・化石燃料賦課金・特定事業者負担金の開始年度の順は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　排出量取引2026年度、賦課金2028年度（令和10年度）、特定事業者負担金2033年度（令和15年度）<br><br><b>使い方</b>　年度の順序で覚える<br><br>【出典】https://laws.e-gov.go.jp/law/505AC0000000032", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【CCS事業法（二酸化炭素の貯留事業に関する法律）】CCS事業法の法律番号と公布日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和6年法律第38号、2024年5月24日公布<br><br><b>使い方</b>　貯留事業と導管輸送事業の許可・保安・事後管理を定める<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000038", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【CCS事業法（二酸化炭素の貯留事業に関する法律）】CCS事業法の施行の3段階と日付は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　探査2024年8月5日、試掘2024年11月18日、貯留事業・導管輸送事業2026年5月22日<br><br><b>使い方</b>　完全施行は2026年5月22日<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000038", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【CCS事業法（二酸化炭素の貯留事業に関する法律）】CCS事業法で貯留事業を許可するまでの流れは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　経産大臣が特定区域を指定して事業者を募集し、貯留区域ごとに許可する（法第3〜4条）<br><br><b>使い方</b>　試掘は試掘区域ごとに許可<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000038", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【CCS事業法（二酸化炭素の貯留事業に関する法律）】海域を特定区域に指定する際に必要な手続は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　環境大臣の同意（法第3条第3項）<br><br><b>使い方</b>　海底下CCSは経産・環境の共管<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000038", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【CCS事業法（二酸化炭素の貯留事業に関する法律）】CCSの注入終了後、貯留層の管理は誰に移るか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　閉鎖措置の確認後、廃止許可を受けると、JOGMEC（エネルギー・金属鉱物資源機構）へ移る<br><br><b>使い方</b>　法第53・54条<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000038", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【CCS事業法（二酸化炭素の貯留事業に関する法律）】貯留事業者がJOGMECへ納付する拠出金の納付期限は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　毎年度3月1日まで（法第45・46条）<br><br><b>使い方</b>　注入終了後は引当金（法第44条）で資金確保<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000038", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【CCS事業法（二酸化炭素の貯留事業に関する法律）】CCS事業法の賠償責任の仕組みは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　貯留・試掘・漏えいによる損害は、貯留事業者等が負う無過失責任（法第124条）<br><br><b>使い方</b>　過失の立証がなくても責任を負う<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000038", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【水素社会推進法】水素社会推進法の法律番号・公布日・施行日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和6年法律第37号、2024年5月24日公布、2024年10月23日施行<br><br><b>使い方</b>　所管は経済産業省<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000037", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【水素社会推進法】水素社会推進法の「低炭素水素等」の範囲は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　水素とアンモニア・合成メタン・合成燃料等の化合物で、製造に伴うCO2排出量が一定値以下のもの<br><br><b>使い方</b>　水素だけではない。具体の値は省令委任<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000037", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【水素社会推進法】水素社会推進法の計画認定の仕組みは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　供給事業者または利用事業者が単独または共同で計画を作り、主務大臣が認定（法第7条）<br><br><b>使い方</b>　価格差支援は供給・利用の連名の共同計画が要件<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000037", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【水素社会推進法】水素社会推進法で助成金を交付する主体は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　JOGMEC（法第10条）<br><br><b>使い方</b>　国が直接交付するのではない<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000037", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【水素社会推進法】水素等供給事業者の判断基準への取組が著しく不十分な場合の措置の順は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　指導・助言、勧告、従わなければ公表、なお従わなければ命令（法第32〜34条）<br><br><b>使い方</b>　経産大臣が判断基準を定める<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000037", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【水素社会推進法】水素社会推進法が特例を設ける3つの法令・制度は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　港湾法、高圧ガス保安法、道路占用<br><br><b>使い方</b>　拠点整備支援と規制の特例で一体推進<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000037", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【水素社会推進法】水素社会推進法の見直し時期は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　施行後5年を目途に検討（法附則第2条）<br><br><b>使い方</b>　施行日は2024年10月23日<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000037", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ペロブスカイト太陽電池（次世代型太陽電池戦略）】ペロブスカイト太陽電池の目標の元となる戦略と策定時期は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　次世代型太陽電池戦略（2024年11月、官民協議会取りまとめ）<br><br><b>使い方</b>　目標は第7次エネ基とGX2040ビジョンに反映<br><br>【出典】https://www.nedo.go.jp/content/800032923.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ペロブスカイト太陽電池（次世代型太陽電池戦略）】ペロブスカイト太陽電池の導入目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2040年に約20GW<br><br><b>使い方</b>　2030年の目標は導入量でなくGW級の生産体制<br><br>【出典】https://www.nedo.go.jp/content/800032923.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ペロブスカイト太陽電池（次世代型太陽電池戦略）】ペロブスカイト太陽電池の発電コスト目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2025年20円/kWh、2030年14円/kWh、2040年に自立化可能な10〜14円/kWh以下<br><br><b>使い方</b>　実際の販売価格ではなく「見通せる技術」の目標<br><br>【出典】https://www.nedo.go.jp/content/800032923.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ペロブスカイト太陽電池（次世代型太陽電池戦略）】ペロブスカイトのタンデム型の2030年度までの研究開発目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　住宅用12円/kWh以下、変換効率30%以上（GI基金）<br><br><b>使い方</b>　単接合型は2030年度までに14円/kWh以下<br><br>【出典】https://www.nedo.go.jp/content/800032923.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ペロブスカイト太陽電池（次世代型太陽電池戦略）】堺市でのペロブスカイト太陽電池の生産体制の内容は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　GW級ラインの構築に約3,150億円を投資、2027年度に100MWの供給体制が稼働予定<br><br><b>使い方</b>　GXサプライチェーン構築支援事業で半額補助<br><br>【出典】https://www.env.go.jp/content/000389653.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ペロブスカイト太陽電池（次世代型太陽電池戦略）】ペロブスカイトの環境省GX需要家支援事業の導入要件は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　フィルム型で耐荷重10kg/m2以下相当、1施設5kW以上、自家消費率50%以上<br><br><b>使い方</b>　補助率2/3（避難施設等は3/4）、上限10億円<br><br>【出典】https://www.env.go.jp/content/000389653.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ペロブスカイト太陽電池（次世代型太陽電池戦略）】政府施設へのペロブスカイト太陽電池の導入目標（2026年6月18日時点）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2035年に50〜70MW、2040年に100MW以上<br><br><b>使い方</b>　国全体の約20GW（2040年）とは別の数字<br><br>【出典】https://www.env.go.jp/content/000407876.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【洋上風力のEEZ拡大（再エネ海域利用法改正）】再エネ海域利用法の改正法の法律番号・公布日・施行日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和7年法律第59号、2025年6月11日公布、2026年4月1日施行<br><br><b>使い方</b>　閣議決定（2025年3月7日）と取り違えない<br><br>【出典】https://laws.e-gov.go.jp/law/430AC0000000089", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【洋上風力のEEZ拡大（再エネ海域利用法改正）】従来の再エネ海域利用法（2018年公布）の適用対象は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　領海及び内水に限られ、排他的経済水域（EEZ）の定めがなかった<br><br><b>使い方</b>　改正でEEZでの設置許可制度を新設<br><br>【出典】https://www.mlit.go.jp/report/press/port01_hh_000291.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【洋上風力のEEZ拡大（再エネ海域利用法改正）】洋上風力の案件形成目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2030年までに1,000万kW、2040年までに3,000万〜4,500万kW<br><br><b>使い方</b>　数値は年と単位（万kW）まで書く<br><br>【出典】https://www.mlit.go.jp/kowan/content/001879078.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【洋上風力のEEZ拡大（再エネ海域利用法改正）】EEZでの洋上風力設置が許可されるまでの流れは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　募集区域の指定→仮許可（有効期間5年以内）→協議会→許可<br><br><b>使い方</b>　経産大臣が募集区域を指定（法第32条）<br><br>【出典】https://laws.e-gov.go.jp/law/430AC0000000089", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【洋上風力のEEZ拡大（再エネ海域利用法改正）】EEZでの洋上風力の許可権者と、環境大臣の役割は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　許可は経産大臣と国交大臣の共管。環境大臣は海洋環境に関する調査を担う<br><br><b>使い方</b>　調査結果は経産大臣に通知・公表<br><br>【出典】https://laws.e-gov.go.jp/law/430AC0000000089", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【洋上風力のEEZ拡大（再エネ海域利用法改正）】領海・内水の「促進区域」とEEZの「募集区域」の違いは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　促進区域は公募占用計画の認定、募集区域は仮許可から許可の仕組み<br><br><b>使い方</b>　仕組みが異なるので取り違えない<br><br>【出典】https://laws.e-gov.go.jp/law/430AC0000000089", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【洋上風力のEEZ拡大（再エネ海域利用法改正）】EEZ洋上風力で仮許可事業者に適用しない手続の特例は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　環境影響評価法第二章第一節（配慮書手続）を適用しない（法第35条）<br><br><b>使い方</b>　環境大臣の調査と重複を避ける趣旨<br><br>【出典】https://laws.e-gov.go.jp/law/430AC0000000089", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【二国間クレジット制度（JCM）】JCMとは何か？また、整合するパリ協定の条文は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　日本とパートナー国が協力して得た削減・吸収量を両国の貢献度に応じ配分する仕組み。第6条第2項に整合<br><br><b>使い方</b>　移転量はITMOsとなる<br><br>【出典】https://www.env.go.jp/content/000377659.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【二国間クレジット制度（JCM）】JCMのパートナー国数（2026年5月29日時点）と開始は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　32か国。2013年1月8日のモンゴルとの署名に始まる<br><br><b>使い方</b>　直近の署名はオマーン（2026年4月9日）<br><br>【出典】https://www.env.go.jp/content/000377659.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【二国間クレジット制度（JCM）】JCMでクレジット量を保守的に算定する方法は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　BaU排出量を十分に下回る「リファレンス排出量」と比較して算定<br><br><b>使い方</b>　持続可能な開発への貢献を評価するガイドラインも導入<br><br>【出典】https://www.env.go.jp/content/000377659.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【二国間クレジット制度（JCM）】JCMの相当調整で日本が選んだ方法と計算は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　平均法。NDC期間に無効化したクレジット総量を10で割った値を日本の排出量から差し引く<br><br><b>使い方</b>　同量をパートナー国に上乗せ。NDC期間は2021〜2030年<br><br>【出典】https://www.env.go.jp/content/000377659.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【二国間クレジット制度（JCM）】2030年目標にJCMクレジットを計上するための無効化の期限は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　第5次隔年透明性報告書（提出期限2032年12月31日）の作成・提出まで<br><br><b>使い方</b>　取消しの場合は計上されない<br><br>【出典】https://www.env.go.jp/content/000377659.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【二国間クレジット制度（JCM）】JCMを法制化した法律改正と、指定実施機関は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和6年法律第56号（2024年6月19日公布）による温対法改正。公益財団法人地球環境センター（JCMA）<br><br><b>使い方</b>　登録簿（国際協力排出削減量口座簿）も規定<br><br>【出典】https://laws.e-gov.go.jp/law/410AC0000000117", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【二国間クレジット制度（JCM）】JCMクレジットの国内での用途は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　GX-ETSの排出実績量の算定、温対法の算定・報告・公表制度（SHK制度）でのオフセット<br><br><b>使い方</b>　国内削減を基本とする点との区分に注意<br><br>【出典】https://www.env.go.jp/content/000377659.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【SSBJ基準と有価証券報告書での開示義務化】SSBJ基準の公表日と、公表された3つの基準は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2025年3月5日。適用基準、第1号一般開示基準、第2号気候関連開示基準<br><br><b>使い方</b>　ISSB基準を踏まえた日本初の開示基準<br><br>【出典】https://www.ssb-j.jp/jp/wp-content/uploads/sites/6/2026_07.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【SSBJ基準と有価証券報告書での開示義務化】SSBJ基準の義務化時期は時価総額でどう分かれるか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　3兆円以上は2027年3月期、1兆円以上は2028年3月期、5,000億円以上は2029年3月期（予定）<br><br><b>使い方</b>　プライム市場、過去5事業年度末の平均時価総額<br><br>【出典】https://www.ssb-j.jp/jp/wp-content/uploads/sites/6/2026_07.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【SSBJ基準と有価証券報告書での開示義務化】2026年2月20日の開示府令改正で義務づけた対象は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　平均時価総額1兆円以上の会社<br><br><b>使い方</b>　5,000億円以上の区分はWG報告の方針（予定）にとどまる<br><br>【出典】https://www.fsa.go.jp/news/r7/shouken/20260220/20260220.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【SSBJ基準と有価証券報告書での開示義務化】SSBJ基準の義務化の経過措置「二段階開示」とは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　最初の2事業年度は、翌事業年度の半期報告書の提出期間末日までに訂正報告書で記載できる<br><br><b>使い方</b>　有報にSSBJ基準の事項を記載しなくてよい期間<br><br>【出典】https://www.ssb-j.jp/jp/wp-content/uploads/sites/6/2026_07.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【SSBJ基準と有価証券報告書での開示義務化】気候基準でスコープ3に関する経過措置は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　最初の年次報告期間にスコープ3排出を開示しないことができる（気候基準第103項(2)）<br><br><b>使い方</b>　スコープ3は算定が難しい事項<br><br>【出典】https://www.ssb-j.jp/jp/wp-content/uploads/sites/6/2026_07.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【SSBJ基準と有価証券報告書での開示義務化】SSBJ基準で第三者保証はいつから義務づけられるか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　適用義務化の翌年から。保証業務実施者は登録制で、監査法人以外も登録可能<br><br><b>使い方</b>　最初の義務化2027年3月期の翌年（2028年3月期）<br><br>【出典】https://www.ssb-j.jp/jp/wp-content/uploads/sites/6/2026_07.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【SSBJ基準と有価証券報告書での開示義務化】SSBJ基準が有報で従うべき基準になる根拠は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　金融庁長官の告示指定により、一般に公正妥当と認められる基準となる<br><br><b>使い方</b>　SSBJ基準自体は法令ではない<br><br>【出典】https://www.ssb-j.jp/jp/wp-content/uploads/sites/6/2026_07.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【トランジション・ファイナンス】クライメート・トランジション・ファイナンスに関する基本指針の策定年と現行版は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2021年策定、2025年3月改訂の2025年版（金融庁・経産省・環境省）<br><br><b>使い方</b>　現行は2025年版<br><br>【出典】https://www.env.go.jp/content/000304405.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【トランジション・ファイナンス】トランジション・ファイナンスの特徴は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　個別の資金使途や短期目標だけでなく、企業レベルの長期トランジション戦略の信頼性に着目する<br><br><b>使い方</b>　難削減産業の2050年CN整合の移行を資金面で支援<br><br>【出典】https://www.env.go.jp/content/000304405.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【トランジション・ファイナンス】基本指針が示す四要素は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　①戦略とガバナンス②環境面のマテリアリティ③科学的根拠に基づく戦略と目標④実施の透明性<br><br><b>使い方</b>　ICMAハンドブックに整合。資金調達者が開示を推奨<br><br>【出典】https://www.env.go.jp/content/000304405.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【トランジション・ファイナンス】分野別技術ロードマップの対象分野数と内訳は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　10分野。鉄鋼・化学・電力・ガス・石油・紙パルプ・セメント・自動車の8分野に、国交省策定の海運・航空を加えたもの<br><br><b>使い方</b>　日本のGHG排出量の8割強をカバー<br><br>【出典】https://www.env.go.jp/content/000304405.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【トランジション・ファイナンス】クライメート・トランジション利付国債の発行開始時期と位置づけは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2024年2月に発行開始。世界初の国によるトランジションボンド<br><br><b>使い方</b>　基本指針とは別の枠組み<br><br>【出典】https://www.fsa.go.jp/singi/transition_finance/siryou/20260821/014_03_00.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【トランジション・ファイナンス】国内の「トランジション」ラベルのボンド・ローンの累計発行額は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2024年末までで2.3兆円超<br><br><b>使い方</b>　数字は時点（2024年末）とセットで書く<br><br>【出典】https://www.env.go.jp/content/000304405.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【トランジション・ファイナンス】金融機関がトランジション・ファイナンスを実行する際の課題は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　投融資先の排出量（ファイナンスド・エミッション）が一時的に増加する<br><br><b>使い方</b>　対策は「ファイナンスド・エミッションの課題解決に向けた考え方」<br><br>【出典】https://www.env.go.jp/content/000304405.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【熱中症特別警戒情報】熱中症特別警戒情報とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　気温が特に著しく高く、熱中症による重大な被害が生ずるおそれがある場合に、環境大臣が発表する情報（法第19条）<br><br><b>使い方</b>　2024年4月から運用開始<br><br>【出典】https://laws.e-gov.go.jp/law/430AC0000000050", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【熱中症特別警戒情報】熱中症警戒情報の発表基準（法第18条）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　府県予報区内の1地点以上で、翌日または当日の日最高WBGTが33以上と予測される場合<br><br><b>使い方</b>　特別警戒の35以上・全地点と範囲が違う<br><br>【出典】https://laws.e-gov.go.jp/law/430AC0000000050", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【熱中症特別警戒情報】熱中症特別警戒情報の発表基準は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　都道府県内の全ての暑さ指数情報提供地点で、翌日の日最高WBGTが35以上と予測される場合等<br><br><b>使い方</b>　前日10時頃の予測で判断し、前日14時頃に発表<br><br>【出典】https://www.wbgt.env.go.jp/about_special_alert.php", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【熱中症特別警戒情報】熱中症特別警戒情報の伝達経路は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　環境大臣から都道府県知事へ通知、知事から市町村長へ、市町村長から住民へ<br><br><b>使い方</b>　国→都道府県→市町村→住民の順<br><br>【出典】https://www.wbgt.env.go.jp/about_special_alert.php", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【熱中症特別警戒情報】指定暑熱避難施設（クーリングシェルター）とは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　市町村長が適当な冷房設備を有する施設を指定し、特別警戒情報の発表時に開放する（法第21条）<br><br><b>使い方</b>　開放義務は特別警戒情報の発表時に限られる<br><br>【出典】https://laws.e-gov.go.jp/law/430AC0000000050", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【熱中症特別警戒情報】熱中症対策普及団体とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　市町村長が指定し、啓発・広報や相談対応を行う団体（法第23条）<br><br><b>使い方</b>　2023年改正で創設された制度<br><br>【出典】https://laws.e-gov.go.jp/law/430AC0000000050", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【熱中症特別警戒情報】熱中症対策に関する2023年の気候変動適応法改正の法律番号と施行は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和5年法律第23号（2023年5月12日公布）。全面施行は2024年4月1日<br><br><b>使い方</b>　実行計画は2023年5月30日に閣議決定<br><br>【出典】https://laws.e-gov.go.jp/law/430AC0000000050", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【気候変動影響評価報告書（第3次）】気候変動影響評価報告書の根拠条文と作成頻度は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　気候変動適応法第10条。中央環境審議会の意見を聴き、おおむね5年ごとに総合的な評価を行う<br><br><b>使い方</b>　適応計画の変更時に最新の評価を勘案（法第8条）<br><br>【出典】https://laws.e-gov.go.jp/law/430AC0000000050", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【気候変動影響評価報告書（第3次）】第3次気候変動影響評価報告書の公表日と、第2次の公表日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　第3次は2026年2月16日、第2次は令和2年12月17日<br><br><b>使い方</b>　適応計画の改定は2026年度の予定<br><br>【出典】https://www.env.go.jp/press/press_02915.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【気候変動影響評価報告書（第3次）】第3次影響評価報告書の評価対象の規模は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　7分野80項目（第2次より9項目増）<br><br><b>使い方</b>　80項目は7分野を細分化した小項目の数<br><br>【出典】https://www.env.go.jp/content/000380482.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【気候変動影響評価報告書（第3次）】影響評価報告書の評価の3観点は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　重大性、緊急性、確信度<br><br><b>使い方</b>　重大性は社会・経済・環境の3観点で評価<br><br>【出典】https://www.env.go.jp/content/000380482.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【気候変動影響評価報告書（第3次）】第3次報告書での重大性の評価方法の改善点は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2段階から3段階（レベル1〜3）に細分化し、現状・1.5〜2℃上昇時・3〜4℃上昇時の3場合で評価<br><br><b>使い方</b>　最も高いレベル3は特に重大な影響<br><br>【出典】https://www.env.go.jp/content/000380482.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【気候変動影響評価報告書（第3次）】第3次報告書の引用文献数は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2,186件（第2次の1,261件の約1.7倍）<br><br><b>使い方</b>　評価項目も9項目増<br><br>【出典】https://www.env.go.jp/content/000380482.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【気候変動影響評価報告書（第3次）】第3次報告書が示す「特に優先的に対応が必要な項目」は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　水稲の収量・品質低下、果樹の栽培適地の変化、洪水・内水の増加、サンゴの白化、暑熱、インフラ・ライフラインの寸断など<br><br><b>使い方</b>　適応策の課題の具体例に使える<br><br>【出典】https://www.env.go.jp/content/000380482.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【再資源化事業等高度化法】再資源化事業等高度化法の法律番号・公布日・施行日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和6年法律第41号、2024年5月29日公布、2025年2月1日一部施行、2025年11月21日全面施行<br><br><b>使い方</b>　公布日と全面施行日を取り違えない<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000041", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【再資源化事業等高度化法】再資源化事業等高度化法が定める3類型の認定は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　①高度再資源化事業計画、②高度分離・回収事業計画、③再資源化工程高度化計画<br><br><b>使い方</b>　③は既存施設の温室効果ガス削減設備向け<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000041", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【再資源化事業等高度化法】再資源化事業等高度化法の認定権者と認定の効果は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　環境大臣が国で一括認定。廃棄物処理法の許可の特例を受けられる<br><br><b>使い方</b>　都道府県知事ではない。廃棄物処理法を置き換えるものではない<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000041", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【再資源化事業等高度化法】再資源化事業等高度化法で廃棄物処分業者の判断基準を定めるのは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　環境省令（法第8条）<br><br><b>使い方</b>　需要に応じた質・量の再生材供給、生産性向上、工程の脱炭素化等を定める<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000041", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【再資源化事業等高度化法】再資源化事業等高度化法の報告・公表の仕組みは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　特定産業廃棄物処分業者が処分量と再資源化量を毎年度環境大臣へ報告し、環境大臣が公表（法第38条・第40条）<br><br><b>使い方</b>　報告義務は処分量の多い事業者が対象<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000041", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【再資源化事業等高度化法】再資源化事業等高度化法の事業認定の目標件数は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　施行から3年間で100件以上<br><br><b>使い方</b>　認定は国が一括して行う<br><br>【出典】https://www.env.go.jp/content/000360673.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【再資源化事業等高度化法】再資源化事業等高度化法の基本方針が示す2030年度の目標例は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　循環利用率は入口側約19%・出口側約44%。最終処分量は一般廃棄物約3.2百万t、産業廃棄物約7.8百万t<br><br><b>使い方</b>　一般廃棄物は2022年度比約5%、産業廃棄物は約10%削減<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000041", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽電池廃棄物の再資源化等の推進に関する法律】太陽電池廃棄物の再資源化等推進法の法律番号と、成立・公布の日付は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和8年法律第33号。2026年5月29日成立、6月5日公布（閣議決定は4月3日）<br><br><b>使い方</b>　公布済みだが施行前<br><br>【出典】https://www.env.go.jp/content/000404704.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽電池廃棄物の再資源化等の推進に関する法律】太陽電池廃棄物の再資源化等推進法の施行日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　公布から1年6か月を超えない範囲で政令で定める日<br><br><b>使い方</b>　届出制度は施行日以降に動く<br><br>【出典】https://www.env.go.jp/content/000404704.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽電池廃棄物の再資源化等の推進に関する法律】太陽光パネルの排出量の見込みは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2030年代後半以降に顕著に増え、年間最大50万t程度<br><br><b>使い方</b>　実績ではなく見込みの数字<br><br>【出典】https://www.env.go.jp/content/000404704.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽電池廃棄物の再資源化等の推進に関する法律】太陽電池廃棄物の再資源化等推進法で義務を負う対象と、勧告・命令の対象は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　事業用太陽電池廃棄者にリサイクル取組を義務付け。勧告・命令の対象は多量廃棄者（第7・8条）<br><br><b>使い方</b>　全パネルへの一律義務化ではない<br><br>【出典】https://www.env.go.jp/content/000404704.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽電池廃棄物の再資源化等の推進に関する法律】多量事業用太陽電池廃棄者が廃棄前に行う手続は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　多量事業用太陽電池廃棄実施計画を国へ届出。原則、受理から30日経過後でなければ排出できない（第9条）<br><br><b>使い方</b>　計画が著しく不十分なら変更等を勧告・命令<br><br>【出典】https://www.env.go.jp/content/000404704.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽電池廃棄物の再資源化等の推進に関する法律】太陽電池廃棄物の再資源化等推進法の認定制度の効果は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　費用効率的なリサイクル事業の計画を国が認定。認定事業者は都道府県ごとの廃棄物処理法の許可が不要（第12〜14条）<br><br><b>使い方</b>　保管基準の特例もある<br><br>【出典】https://www.env.go.jp/content/000404704.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽電池廃棄物の再資源化等の推進に関する法律】太陽光パネル専用リサイクル施設の現状（2025年11月時点）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　87件、処理能力約13万t/年。8府県には施設がない<br><br><b>使い方</b>　今後の排出見込みに対して不足<br><br>【出典】https://www.env.go.jp/content/000404704.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック資源循環促進法】プラスチック資源循環促進法の法律番号・公布日・施行日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和3年法律第60号、2021年6月11日公布、2022年4月1日施行<br><br><b>使い方</b>　レジ袋有料化（2020年7月）は別の先行施策<br><br>【出典】https://plastic-circulation.env.go.jp/about/hourei?tab=shingikai", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック資源循環促進法】プラスチック資源循環戦略の策定時期と基本原則は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2019年5月に策定。基本原則は3R+Renewable<br><br><b>使い方</b>　促進法はその実装のための法律<br><br>【出典】https://plastic-circulation.env.go.jp/about/senryaku", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック資源循環促進法】プラスチック資源循環促進法の措置の柱は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　設計認定、特定プラ使用製品の使用合理化、市町村の分別収集・再商品化、自主回収・再資源化、排出事業者の排出抑制<br><br><b>使い方</b>　設計から廃棄まで全主体を対象とする<br><br>【出典】https://laws.e-gov.go.jp/law/503AC0000000060", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック資源循環促進法】特定プラスチック使用製品とは？また多量提供事業者の要件は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　無償提供される主にプラ製の12製品。前年度の提供量が5トン以上の事業者が多量提供事業者<br><br><b>使い方</b>　無償提供が要件<br><br>【出典】https://plastic-circulation.env.go.jp/pro/gorika", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック資源循環促進法】特定プラスチック使用製品の12製品は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　フォーク、スプーン、テーブルナイフ、マドラー、飲料用ストロー、ヘアブラシ、くし、かみそり、シャワーキャップ、歯ブラシ、衣類用ハンガー、衣類用カバー<br><br><b>使い方</b>　取組が著しく不十分なら勧告・公表・命令<br><br>【出典】https://plastic-circulation.env.go.jp/pro/gorika", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック資源循環促進法】プラスチック資源循環戦略の2030年のワンウェイプラスチックの目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2030年までに累積25%排出抑制<br><br><b>使い方</b>　リユース・リサイクル可能なデザインは2025年まで<br><br>【出典】https://www.env.go.jp/council/content/i_03/000433372.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック資源循環促進法】プラスチック資源循環戦略の2035年の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2035年までに使用済プラスチックを100%有効利用<br><br><b>使い方</b>　容器包装の6割のリユース・リサイクルは2030年<br><br>【出典】https://www.env.go.jp/council/content/i_03/000433372.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【食品ロス削減推進法と2030年度目標】食品ロスの削減の推進に関する法律の法律番号・公布日・施行日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和元年法律第19号、2019年5月31日公布、同年10月1日施行<br><br><b>使い方</b>　基本方針（第2次）は2025年3月25日閣議決定<br><br>【出典】https://www.caa.go.jp/policies/policy/consumer_policy/information/food_loss/promote/", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【食品ロス削減推進法と2030年度目標】食品ロス削減推進法における「食品ロスの削減」の定義は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　まだ食べることができる食品が廃棄されないようにするための社会的な取組（第2条第2項）<br><br><b>使い方</b>　食品ロスは可食部の発生量で、食品廃棄物全体ではない<br><br>【出典】https://laws.e-gov.go.jp/law/501AC1000000019", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【食品ロス削減推進法と2030年度目標】2025年3月閣議決定の基本方針が掲げる食品ロスの削減目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　家庭系は2000年度比で2030年度までに半減、事業系は同60%削減<br><br><b>使い方</b>　家庭系は2030年を待たず早期達成を目指す<br><br>【出典】https://www.env.go.jp/press/press_05155.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【食品ロス削減推進法と2030年度目標】基本方針の目標値は、家庭系・事業系それぞれ何万tか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　家庭系は2000年度433万tから216万t、事業系は547万tから219万t<br><br><b>使い方</b>　合計の新目標は435万t（旧目標は489万t）<br><br>【出典】https://www.env.go.jp/content/000408175.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【食品ロス削減推進法と2030年度目標】令和6年度（2024年度）の食品ロス発生量の推計は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　461万t（事業系237万t、家庭系224万t）<br><br><b>使い方</b>　前年度（令和5年度）は464万t。最新は令和6年度<br><br>【出典】https://www.env.go.jp/press/press_05155.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【食品ロス削減推進法と2030年度目標】2024年度時点の食品ロス削減率（2000年度比）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　事業系56.7%、家庭系48.3%<br><br><b>使い方</b>　家庭系は半減目標に届いていない<br><br>【出典】https://www.env.go.jp/content/000408175.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【食品ロス削減推進法と2030年度目標】食品ロス削減月間と食品ロス削減の日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　10月が食品ロス削減月間、10月30日が食品ロス削減の日（第9条）<br><br><b>使い方</b>　都道府県・市町村の推進計画は努力義務（第12・13条）<br><br>【出典】https://laws.e-gov.go.jp/law/501AC1000000019", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域生物多様性増進法と自然共生サイト】地域生物多様性増進法の法律番号・公布日・施行日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和6年法律第18号、2024年4月19日公布、2025年4月1日施行<br><br><b>使い方</b>　自然共生サイトは同法の認定へ移行<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000018", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域生物多様性増進法と自然共生サイト】地域生物多様性増進法の主務大臣は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　環境大臣・農林水産大臣・国土交通大臣（第35条）<br><br><b>使い方</b>　主務大臣が基本方針を定める（第8条）<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000018", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域生物多様性増進法と自然共生サイト】地域生物多様性増進法の計画認定の2種類は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　事業者等の増進活動実施計画（第9条）と、市町村が連携して行う連携増進活動実施計画（第11条）<br><br><b>使い方</b>　どちらも主務大臣が認定<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000018", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域生物多様性増進法と自然共生サイト】認定を受けた活動が受ける手続の特例は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　自然公園法・自然環境保全法・森林法・都市緑地法などの許可・届出のワンストップ化（第15〜21条）<br><br><b>使い方</b>　企業等の活動促進の仕組み<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000018", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域生物多様性増進法と自然共生サイト】生物多様性維持協定は誰と誰が結び、成立要件は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　認定連携市町村が土地所有者等と締結（第22条）。土地所有者等の全員の合意が必要<br><br><b>使い方</b>　「全員」の合意が要件<br><br>【出典】https://laws.e-gov.go.jp/law/506AC0000000018", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域生物多様性増進法と自然共生サイト】自然共生サイトの認定の経緯は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2023年度に開始、2024年度までに328か所。2025年4月から本法に基づく認定に移行<br><br><b>使い方</b>　累計は2026年10月30日時点で700か所<br><br>【出典】https://www.env.go.jp/press/press_05720.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域生物多様性増進法と自然共生サイト】自然共生サイトとOECMの関係は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　同じではない。国際データベースへの登録は、保護地域と重複しない区域だけ<br><br><b>使い方</b>　OECM登録面積64.6千ha、OECM割合は陸域0.2%（2026年8月）<br><br>【出典】https://www.env.go.jp/press/press_05386.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ネイチャーポジティブ経済移行戦略】ネイチャーポジティブ経済移行戦略の策定主体と策定時期は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　環境省・農水省・経産省・国交省が2024年3月に策定。ロードマップ（2025-2030年）は2025年7月<br><br><b>使い方</b>　戦略は法律ではなく4省庁の戦略<br><br>【出典】https://www.env.go.jp/content/000298927.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ネイチャーポジティブ経済移行戦略】ネイチャーポジティブ経済移行戦略の位置づけは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　生物多様性国家戦略2023-2030の基本戦略3「ネイチャーポジティブ経済の実現」の重点施策<br><br><b>使い方</b>　ネイチャーポジティブ経営への移行を後押し<br><br>【出典】https://www.env.go.jp/content/000298927.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ネイチャーポジティブ経済移行戦略】ネイチャーポジティブ経済移行戦略の3本柱は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　企業の価値創造プロセスとビジネス機会の具体例、経営移行で企業が押さえる要素、国の施策によるバックアップ<br><br><b>使い方</b>　戦略の構成として覚える<br><br>【出典】https://www.env.go.jp/content/000298927.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ネイチャーポジティブ経済移行戦略】ネイチャーポジティブ経済移行戦略の5つの要素（行動指針）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　足元の負荷低減、一歩ずつの取組の奨励、損失のスピードダウンにも価値、消費者ニーズの創出・充足、地域価値の向上<br><br><b>使い方</b>　足元の負荷低減はミティゲーション・ヒエラルキー<br><br>【出典】https://www.env.go.jp/content/000298927.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ネイチャーポジティブ経済移行戦略】ネイチャーポジティブへの移行による2030年のビジネス機会の推計は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　世界で年1,372兆円（WEF2020年推計）、日本で年47兆円（環境省試算）<br><br><b>使い方</b>　世界は年約368兆円の投資が必要<br><br>【出典】https://www.env.go.jp/content/000298927.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ネイチャーポジティブ経済移行戦略】TNFDアダプター企業数で日本は世界の中でどの位置か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　219社（2026年3月時点）で世界最多<br><br><b>使い方</b>　令和7年度環境白書の実績<br><br>【出典】https://www.env.go.jp/policy/hakusyo/r08/pdf/full.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【ネイチャーポジティブ経済移行戦略】「ネイチャーポジティブ経営」の意味は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　ネイチャーポジティブを実現した経営ではなく、目指す経営（戦略の脚注）<br><br><b>使い方</b>　「実現済み」と書かない<br><br>【出典】https://www.env.go.jp/content/000298927.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟】クマ類が指定管理鳥獣に追加された時期と対象は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2024年4月。ヒグマ・ツキノワグマ（四国の個体群を除く）<br><br><b>使い方</b>　ニホンジカ・イノシシに続く追加。四国は絶滅のおそれで除外<br><br>【出典】https://www.env.go.jp/nature/choju/reinforce/index.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟】指定管理鳥獣とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　希少鳥獣以外で集中的かつ広域的な管理が必要として環境大臣が指定する鳥獣。都道府県または国が捕獲等事業を実施<br><br><b>使い方</b>　鳥獣保護管理法第2条第5項・第14条の2<br><br>【出典】https://laws.e-gov.go.jp/law/414AC0000000088", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟】緊急銃猟の実施主体と、満たすべき4要件は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　市町村長。侵入（おそれ含む）、緊急性、銃猟以外が困難、弾丸到達のおそれなし<br><br><b>使い方</b>　実施主体は都道府県ではない<br><br>【出典】https://laws.e-gov.go.jp/law/414AC0000000088", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟】緊急銃猟を定めた改正法の法律番号と施行日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和7年法律第28号（2025年4月25日公布）。緊急銃猟の規定は2025年9月1日施行<br><br><b>使い方</b>　第34条の2〜6<br><br>【出典】https://laws.e-gov.go.jp/law/414AC0000000088", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟】クマ被害対策ロードマップ（2026年3月27日）の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2030年度までに緊急対応体制確保率、個体数推定・捕獲目標数の明確化率、ゾーニング管理計画策定率を各100%<br><br><b>使い方</b>　恒常的生息域の自治体が対象<br><br>【出典】https://www.env.go.jp/nature/choju/effort/effort12/effort12.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟】クマ被害対策パッケージが決定された日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2025年11月14日（関係閣僚会議）<br><br><b>使い方</b>　ロードマップは2026年3月27日の別決定<br><br>【出典】https://www.env.go.jp/nature/choju/effort/effort12/effort12.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【クマ類の指定管理鳥獣追加と緊急銃猟】令和7年度のクマによる人身被害（速報値）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　被害者数238人（件数216件）、死亡13人。いずれも過去最多<br><br><b>使い方</b>　令和5年度は219人（198件）<br><br>【出典】https://www.env.go.jp/council/content/i_09/000378789.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正】外来生物法の2022年改正法の法律番号・公布日・施行日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　令和4年法律第42号、2022年5月18日公布。2022年7月1日と2023年4月1日の2段階施行<br><br><b>使い方</b>　7月は規制権限の拡充、4月はその他<br><br>【出典】https://laws.e-gov.go.jp/law/416AC0000000078", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正】要緊急対処特定外来生物とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　まん延すると著しく重大な被害が生じ、発見時に検査・防除等を緊急に行う必要があるものとして政令で定める種<br><br><b>使い方</b>　主務大臣は通関後も立入検査や移動制限・禁止命令ができる<br><br>【出典】https://laws.e-gov.go.jp/law/416AC0000000078", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正】要緊急対処特定外来生物に指定されたのは？また指定日と対処指針の施行日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　ヒアリを含むトフシアリ属4種群と交雑種（ヒアリ類）。指定は2023年4月1日、対処指針の施行は同年6月1日<br><br><b>使い方</b>　指定日と指針施行日が異なる<br><br>【出典】https://www.env.go.jp/press/press_01536.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正】条件付特定外来生物に当たる種と指定日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　アカミミガメとアメリカザリガニの2種のみ。2023年6月1日指定<br><br><b>使い方</b>　「ミドリガメ」はアカミミガメの幼体<br><br>【出典】https://www.env.go.jp/nature/intro/2outline/regulation/jokentsuki.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正】条件付特定外来生物の規制の中身は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　家庭での飼養と少数への無償譲渡は適用除外。販売・頒布・購入・輸入・野外放出等は原則禁止<br><br><b>使い方</b>　全て禁止にすると野外放出が増えるおそれがあるため<br><br>【出典】https://www.env.go.jp/nature/intro/2outline/regulation/jokentsuki.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正】ヒアリの確認件数（2025年度）と港湾モニタリングの規模は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2025年度は36件で過去最多。累計は20都道府県で171事例。全国65港湾で定期モニタリング<br><br><b>使い方</b>　令和7年度環境白書の記載<br><br>【出典】https://www.env.go.jp/policy/hakusyo/r08/pdf/full.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【外来生物法の2022年改正】外来種被害予防三原則とは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　入れない・捨てない・拡げない<br><br><b>使い方</b>　終生飼養と放出禁止の周知に使う<br><br>【出典】https://www.env.go.jp/nature/intro/2outline/regulation/jokentsuki.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化】PFOS・PFOAの水道水質基準値は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　PFOSとPFOAの合算で0.00005mg/L以下（50ng/L）<br><br><b>使い方</b>　それぞれ50ng/Lではなく合算。水質基準52項目の1つ<br><br>【出典】https://www.env.go.jp/content/000334172.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化】PFOS・PFOAの水質基準化の公布日と施行日は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　水質基準に関する省令の改正。2025年6月30日公布、2026年4月1日施行<br><br><b>使い方</b>　告示ではなく省令。公布日と施行日は別<br><br>【出典】https://www.env.go.jp/content/000334172.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化】PFOS・PFOAの50ng/Lは従来の暫定目標値と何が変わったか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　値は同じ。2020年の水質管理目標設定項目（暫定目標値）から、遵守義務のある水質基準に位置づけが変わった<br><br><b>使い方</b>　数値は不変、位置づけが変更<br><br>【出典】https://www.env.go.jp/content/000334172.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化】50ng/Lの算定の考え方は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　TDI 20ng/kg/日×体重50kg÷2L/日×割当率10%＝50ng/L<br><br><b>使い方</b>　食品安全委員会のTDI（2024年6月評価）を使用<br><br>【出典】https://www.env.go.jp/content/000334172.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化】PFOS・PFOAの水道水の検査頻度は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　3か月に1回。簡易水道・専用水道は条件を満たせば半年に1回または年1回<br><br><b>使い方</b>　過去3年間の検出状況で頻度減少が可能<br><br>【出典】https://www.env.go.jp/content/000334172.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化】公共用水域・地下水のPFOS・PFOAの扱いは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　環境基準ではなく要監視項目の指針値50ng/L（合算）。2025年6月30日に「暫定」を外した<br><br><b>使い方</b>　法的な遵守義務の基準ではない<br><br>【出典】https://www.env.go.jp/content/000405361.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【PFOS・PFOAの水道水質基準化】PFOS・PFOAの化審法上の扱いは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　PFOSは2010年、PFOAは2021年に第一種特定化学物質に指定され、製造・輸入が原則禁止<br><br><b>使い方</b>　化学的に安定で難分解性<br><br>【出典】https://www.env.go.jp/water/pfas/faq003.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準】底層溶存酸素量が生活環境項目に追加された時期と根拠は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2016年3月30日。環境基本法第16条に基づく水質汚濁の環境基準の改正<br><br><b>使い方</b>　2015年12月の中央環境審議会答申を受けて導入<br><br>【出典】https://www.env.go.jp/press/102287.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準】底層溶存酸素量とは何を判断する指標か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　魚介類等の生息や藻場等の生育に対する直接的な影響を判断できる指標<br><br><b>使い方</b>　従来基準では湖底の貧酸素化の実態が伝わりにくかった<br><br>【出典】https://www.env.go.jp/press/102287.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準】底層溶存酸素量の類型ごとの基準値は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　生物1は4.0mg/L以上、生物2は3.0mg/L以上、生物3は2.0mg/L以上（日間平均値）<br><br><b>使い方</b>　生物1が最も厳しく、耐性の低い生物の場を守る<br><br>【出典】https://www.env.go.jp/press/102287.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準】底層溶存酸素量の類型指定は誰が行うか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　複数の都道府県にまたがる水域（政令で定める）は国が指定<br><br><b>使い方</b>　類型は水域ごとに指定される<br><br>【出典】https://www.env.go.jp/press/102287.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準】底層溶存酸素量の類型指定の経緯は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2021年12月28日琵琶湖・東京湾（全国初）、2022年12月20日伊勢湾・大阪湾、2024年6月17日霞ケ浦等<br><br><b>使い方</b>　大阪湾は湾奥部のみ（生物3）の指定<br><br>【出典】https://www.env.go.jp/press/110371.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準】沿岸透明度は環境基準か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　環境基準ではなく、地域が設定する目標<br><br><b>使い方</b>　底層溶存酸素量と同時期に導入された指標<br><br>【出典】https://www.env.go.jp/press/102287.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【底層溶存酸素量の環境基準】湖沼の底層溶存酸素量対策の手引き（2020年3月）が示す対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　外部負荷削減、内部負荷削減（浚渫・覆砂等）、曝気・底層への酸素供給、生態系機能の活用、水草の刈り取り<br><br><b>使い方</b>　対策は湖沼の特性や費用を踏まえて選定<br><br>【出典】https://www.env.go.jp/content/900544873.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）】プラスチック汚染に関する国際条約の交渉委員会（INC）は何の決議で設置されたか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2022年3月の第5回国連環境総会再開セッション（UNEA5.2）の決議<br><br><b>使い方</b>　条約は未成立で交渉継続中<br><br>【出典】https://www.env.go.jp/water/inc.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）】大阪ブルー・オーシャン・ビジョンとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2019年のG20大阪サミットで共有された、2050年までに海洋プラスチックごみによる追加的な汚染をゼロにまで削減する目標<br><br><b>使い方</b>　日本が提唱<br><br>【出典】https://www.env.go.jp/water/inc.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）】G7広島サミット（2023年）がプラスチック汚染でコミットした内容は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2040年までに追加的なプラスチック汚染をゼロにする野心<br><br><b>使い方</b>　2050年ゼロ（大阪ブルー・オーシャン・ビジョン）と別の目標<br><br>【出典】https://www.env.go.jp/water/inc.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）】INC設置時の当初の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2024年末までに国際文書の策定に係る作業を完了すること<br><br><b>使い方</b>　未達。条約はまだ成立していない<br><br>【出典】https://www.env.go.jp/press/press_02873.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）】INC5.2（2025年8月）で合意に至らなかった論点は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　生産、プラスチック製品（第4条）、資金（第10条）<br><br><b>使い方</b>　目的、製品設計、廃棄物管理等は文言交渉が進展<br><br>【出典】https://www.env.go.jp/council/content/i_03/000433372.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）】INC5.3（2026年2月7日）の内容は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　ジュネーブで開催。前議長の辞任を受けチリのフリオ・コルダノ氏を新議長に選出。実質的な交渉はなし<br><br><b>使い方</b>　組織的・事務的事項のための会合<br><br>【出典】https://www.env.go.jp/press/press_02873.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【プラスチック汚染の国際条約交渉（INC）】INC5.4の開催予定は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2027年3月13日〜24日の期間内に開催予定（開催場所未定）<br><br><b>使い方</b>　2026年8月21日時点の環境省資料<br><br>【出典】https://www.env.go.jp/council/content/i_03/000433372.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン】マイクロプラスチックの一般的な定義は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　5mm未満の微細なプラスチック<br><br><b>使い方</b>　調査では長径1mm以上5mm未満と1mm未満を分ける場合があり<br><br>【出典】https://www.env.go.jp/water/marine_litter/post_118.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン】世界の海洋プラスチックごみのうち陸域から発生する割合は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　約8割とも言われる<br><br><b>使い方</b>　河川を経由して海洋へ流出するため、流域圏での発生抑制が重要<br><br>【出典】https://www.env.go.jp/water/marine_litter/post_118.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン】河川・湖沼マイクロプラスチック調査ガイドラインの経緯は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　河川版は2021年6月、湖沼を加えた現行名称の版は2023年3月30日公開。令和8年4月版が最新<br><br><b>使い方</b>　前処理の自動化の標準的仕様も追加<br><br>【出典】https://www.env.go.jp/press/press_01408.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン】マイクロプラスチックの法的な基準値はあるか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　環境基準・排出基準といった法的基準値はない<br><br><b>使い方</b>　ガイドラインは調査方法の手引きで、規制ではない<br><br>【出典】https://www.env.go.jp/water/marine_litter/post_118.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン】AOMI（Atlas of Ocean Microplastics）とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　2024年5月に公表された、海洋マイクロプラスチックの国際的なデータベース<br><br><b>使い方</b>　モニタリング手法の国際的な調和に使う<br><br>【出典】https://www.env.go.jp/water/marine_litter/post_118.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン】令和4年度の河川調査で分かったことは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　一級水系7水系の下流域で、長径1mm以上5mm未満の平均個数密度は0.1〜0.8個/m3。人口密度・市街化率と強い正の相関<br><br><b>使い方</b>　単位は個/m3<br><br>【出典】https://www.env.go.jp/content/000220901.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン】マイクロプラスチック削減のグッド・プラクティス集の公表は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　第3版を2025年4月に公表<br><br><b>使い方</b>　業界団体・事業者との連携で先進的な取組を発信<br><br>【出典】https://www.env.go.jp/water/marine_litter/post_118.html", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域気候変動適応計画・地域気候変動適応センター】地域気候変動適応計画の根拠条文と策定の義務の程度は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　気候変動適応法第12条。都道府県・市町村が策定するよう努める努力義務<br><br><b>使い方</b>　国の適応計画を勘案して策定する<br><br>【出典】https://laws.e-gov.go.jp/law/430AC0000000050", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域気候変動適応計画・地域気候変動適応センター】地域気候変動適応センターの根拠条文と役割は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　第13条。気候変動影響・適応の情報の収集・整理・分析・提供と技術的助言を行う体制の確保（努力義務）<br><br><b>使い方</b>　国立環境研究所と情報・分析結果を共有<br><br>【出典】https://laws.e-gov.go.jp/law/430AC0000000050", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域気候変動適応計画・地域気候変動適応センター】気候変動適応広域協議会の根拠条文と構成は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　第14条。国の地方行政機関、都道府県、市町村、センター、事業者等が組織でき、全国7ブロック<br><br><b>使い方</b>　2023年3月に広域アクションプランを策定<br><br>【出典】https://laws.e-gov.go.jp/law/430AC0000000050", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域気候変動適応計画・地域気候変動適応センター】地域気候変動適応計画・センターの2026年度の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　都道府県・政令指定都市の計画策定率100%、センター設置率100%<br><br><b>使い方</b>　市町村は目標の対象外<br><br>【出典】https://www.env.go.jp/content/000191251.pdf", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域気候変動適応計画・地域気候変動適応センター】地域気候変動適応計画の策定状況（2026年3月現在）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<b>答え</b>　491自治体が策定、地域適応センターは70センター<br><br><b>使い方</b>　共同設置は1件と数える。491は自治体数<br><br>【出典】h <script>
const SUBJECT = {"id":"nijishi","name":"第二次 暗記カード","groupLabel":"二次","title":"技術士第二次試験 環境部門 暗記カード","description":"技術士第二次試験（環境部門・環境保全計画）の暗記用一問一答。国の計画の目標・柱と、選択Ⅱ-1の用語の定義・制度・数字。","eyebrow":"技術士第二次試験｜環境部門","h1":"第二次 暗記カード","intro":"問いを見て答えを思い出し、「思い出せた／思い出せなかった」を押すと答えが出ます。思い出せなかったカードは翌日にまた出ます。","storagePrefix":"nijishi_","sets":[{"key":"njplan","label":"国の計画（必須Ⅰ）","short":"二次 国の計画","data":"NJ_PLAN_DATA","default":true},{"key":"njterm","label":"用語（選択Ⅱ-1）","short":"二次 用語","data":"NJ_TERM_DATA"}],"allSetLabel":"まとめて","examDayDefault":"2027-07-18","emptyMessage":"暗記カードは準備中です。","topics":false,"fieldYears":{}};
const SUBJECT_DATA = { NJ_PLAN_DATA: NJ_PLAN_DATA, NJ_TERM_DATA: NJ_TERM_DATA };
</script>
<script>
/* SUBJECT（科目ごとの設定）と SUBJECT_DATA（問題データの束）は build.js が先に埋め込む */
const SPFX = "gq_" + (SUBJECT.storagePrefix || "");   // localStorage キーの接頭辞
const HAS_TOPICS = !!SUBJECT.topics;
const FIELD_WEIGHTS = SUBJECT.fieldWeights || null;
const DEFAULT_SET = (SUBJECT.sets.filter(function (d) { return d.default; })[0] || SUBJECT.sets[0]).key;
const Q = [];

const LETTERS = ["1","2","3","4","5"];
/* 解説の根拠の質。誤った知識を覚えないよう、どこまで裏を取ったかを明示する */
const VLABEL = {
  primary:   "◎ 白書・法令・告示など一次資料で確認",
  answer:    "○ 公開正答表との突合により確定",
  calc:      "○ 計算で検算済み（式・定義は教科書・規格どおり）",
  textbook:  "△ 教科書の基本事項（独立した解き直しで正解を確認。規格・一次資料の本文は未確認）",
  knowledge: "△ 教科書的知識にもとづく記述（一次資料は未確認。テキストでの確認を推奨）"
};
// 科目ごとに根拠の表示文を差し替えられる（SCR は白書・法令ではなく国際機関・基準設定主体の公開文書）
if (SUBJECT.vlabel) Object.assign(VLABEL, SUBJECT.vlabel);
let i = 0, correct = 0, answered = false;
const log = [];
const answers = [];
/* 回の最後に、間違えた問題をもう一度出す（記録はしない）。RETRY_FROM はその開始位置。-1 は未追加 */
let RETRY_FROM = -1;
let RESULT_SAVED = false;   // この回の点数を過去問の記録に入れたか（結果画面を開き直しても二重に入れない）
let PARTIAL = false;        // 途中で「ここまでで採点する」を押した回（解いた問題だけで採点し、残りは採点に含めない）
/* 履歴の「解く」から始めた回は、ホームではなく履歴に戻れるようにする */
let FROM_HIST = false;
function goBack() {
  if (!FROM_HIST) { goHome(); return; }
  FROM_HIST = false;
  if (Q.length > 0 && i < Q.length) saveSession();
  selectTab("hist");
}
function inRetry() { return RETRY_FROM >= 0 && i >= RETRY_FROM; }
function origCount() { return RETRY_FROM >= 0 ? RETRY_FROM : Q.length; }
function wrongOriginals() {
  const out = [];
  for (let k = 0; k < origCount(); k++) if (answers[k] && !answers[k].hit) out.push(Q[k]);
  return out;
}
/* 本番の過去問を通しで解いた回（専門・基礎）では、選ばなかった問題も「もう一度」に入れる。問題番号の順 */
function retryOriginals() {
  const ex = examRun(), sk = !!ex && ex.kind !== "適性";
  const out = [];
  for (let k = 0; k < origCount(); k++) if (answers[k] ? !answers[k].hit : sk) out.push(Q[k]);
  return out;
}
/* 「もう一度」の k 問目が、最初の回で選ばなかった（答えていない）問題か */
function retryWasSkipped(k) {
  if (RETRY_FROM < 0 || k < RETRY_FROM) return false;
  for (let j = 0; j < RETRY_FROM; j++) if (Q[j] === Q[k]) return !answers[j];
  return false;
}
function appendRetries() {
  if (RETRY_FROM >= 0) return;
  const w = retryOriginals();
  if (!w.length) return;
  RETRY_FROM = Q.length;
  w.forEach(function (q) { Q.push(q); });
}

const stage = document.getElementById("stage");
const elField = document.getElementById("field");
const elCount = document.getElementById("count");
const elScore = document.getElementById("score");
const elBar = document.getElementById("bar");

function shuffle(n, seed) {
  // 決定論的シャッフル（問題ごとに選択肢の並びを変える）
  // 掛け算は Math.imul で32bitに収める。普通の * だと2^53を超えて下位ビットが消え、
  // 4択の正答がすべて④に固定されていた（2026-09-25 修正）
  const idx = [...Array(n).keys()];
  for (let k = n - 1; k > 0; k--) {
    seed = (Math.imul(seed, 1103515245) + 12345) >>> 0;
    const j = Math.floor(seed / 4294967296 * (k + 1));
    [idx[k], idx[j]] = [idx[j], idx[k]];
  }
  return idx;
}

function render() {
  AT_HOME = false;
  setQuizChrome(true);
  document.body.classList.remove("home-mode");
  const hb = document.getElementById("homeBottom");
  if (hb) hb.innerHTML = "";
  if (i >= Q.length) return renderResult();
  const q = Q[i];
  let seed = 0;
  for (let k = 0; k < q.q.length; k++) seed = (seed * 31 + q.q.charCodeAt(k)) & 0x7fffffff;
  // 「〜の数はどれか」の選択肢（2個・0個…）は並べ替えずに小さい順に出す（スマホで探しやすく）
  const isCount = q.c.every(function (c) { return /^\s*[0-9０-９]+\s*(個|つ)?\s*$/.test(c); }) &&
    (q.c.some(function (c) { return /(個|つ)\s*$/.test(c); }) || /の数/.test(q.q.split("<br>")[0]));
  const isPast = /^(過去問|○×) /.test(q.f || "") || q.keep === true;   // 暗記カードの「思い出せた／思い出せなかった」も順番固定   // 取り込んだ本番の過去問は原本の①〜⑤の順のまま（正答番号と合わせる）
  const order = isPast ? q.c.map(function (_, k) { return k; }) : isCount
    ? q.c.map(function (_, k) { return k; }).sort(function (a, b) { return parseInt(q.c[a].replace(/[０-９]/g, function (d) { return "０１２３４５６７８９".indexOf(d); }), 10) - parseInt(q.c[b].replace(/[０-９]/g, function (d) { return "０１２３４５６７８９".indexOf(d); }), 10); })
    : shuffle(q.c.length, seed);
  const prev = answers[i];
  answered = !!prev;

  elField.textContent = q.f;
  elCount.textContent = inRetry() ? "もう一度 " + (i - RETRY_FROM + 1) + " / " + (Q.length - RETRY_FROM) : (i + 1) + " / " + origCount();
  elScore.innerHTML = "正解 <b>" + correct + "</b>";
  elBar.style.width = (i / Q.length * 100) + "%";

  const card = document.createElement("div");
  card.className = "card";
  const h = histOf(q);
  let badge = '';
  if (h) {
    badge = '<span class="hist">これまで ' + h.n + '回中 ' + h.ok + '回正解</span>';
    if (h.last === 0) badge += '<span class="flagmark">前回まちがえた</span>';
    else badge += '<span class="mst m' + mastery(q) + '">' + MASTERY[mastery(q)] + '</span>';
  }
  const bm = isBookmarked(q);
  card.innerHTML =
    '<div class="qmeta"><span class="qn">Q' + (i + 1) + '</span>' + badge +
      '<span class="qtools">' +
        '<button type="button" class="qtool" id="bmTog" aria-pressed="' + bm + '">' + bmLabel(bm) + '</button>' +
        '<button type="button" class="qtool" id="memoTog" aria-expanded="false" aria-controls="memoBox"></button>' +
      '</span></div>' +
    whyChips(whyOf(q), q) +
    '<p class="qt"></p><div class="qimg" hidden></div><p class="qh"></p><div class="choices"></div>' +
    '<div class="memo" id="memoBox" hidden>' +
      '<label for="memoTa">メモ（この端末に自動で保存されます）</label>' +
      '<textarea id="memoTa" rows="3" placeholder="覚え方、間違えた理由など"></textarea>' +
      '<div class="saved" aria-live="polite"></div>' +
    '</div>';
  renderStatements(card, q);
  if (q.hasImg) {
    const box = card.querySelector(".qimg");
    IMGDB.get(imgKey(q)).then(function (src) {
      if (!src || !box.isConnected) return;
      const im = document.createElement("img");
      im.src = src; im.alt = "問題の図（原本より）";
      im.addEventListener("click", function () { box.classList.toggle("zoom"); });
      box.appendChild(im); box.hidden = false;
    });
  }
  card.querySelector(".qh").textContent = q.h;
  wireNoteTools(card, q);

  const box = card.querySelector(".choices");
  order.forEach((origIdx, pos) => {
    const b = document.createElement("button");
    b.className = "ch";
    b.type = "button";
    b.innerHTML = '<span class="key">' + LETTERS[pos] + '</span><span></span>';
    setMxText(b.lastChild, q.c[origIdx]);
    b.dataset.orig = origIdx;
    b.addEventListener("click", () => choose(card, b, origIdx));
    box.appendChild(b);
  });
  // 1つも消去できないときだけ使う。当てずっぽうの正解で「覚えた」扱いにならないよう、不正解として記録する
  const dk = document.createElement("button");
  dk.className = "dk";
  dk.type = "button";
  dk.textContent = "わからない";
  dk.addEventListener("click", () => choose(card, dk, -1));
  box.appendChild(dk);

  stage.replaceChildren(card);

  if (prev) {
    // 解答済みの問題に戻ってきた場合は、そのときの状態を復元する
    const btn = prev.pick === -1 ? card.querySelector(".dk") : Array.prototype.find.call(card.querySelectorAll(".ch"),
      b => Number(b.dataset.orig) === prev.pick);
    showVerdict(card, btn, prev.hit, false);
  } else {
    renderNav(card);
  }
  window.scrollTo({ top: 0, behavior: "instant" });
}

/* (ア)〜(オ) の記述を並べる問題は、各記述に ○／× の印を付けられる行に分け、○の数をその場で数える */
function renderStatements(card, q) {
  const qt = card.querySelector(".qt");
  // 1行に「(ア) …　(イ) …」と複数の記述が並んでいる場合も、記述ごとの行に分ける
  const parts = [].concat.apply([], q.q.split("<br>").map(function (l) {
    return /^\s*[（(][ア-コ][）)]/.test(l) ? l.split(/[\s　]+(?=[（(][ア-コ][）)])/) : [l];
  }));
  const isSt = parts.map(function (l) { return /^\s*[（(][ア-コ][）)]/.test(l); });
  if (isSt.filter(Boolean).length < 2) { setMxText(qt, q.q.replace(/<br>/g, "\n")); return; }
  setMxText(qt, parts.filter(function (_, k) { return !isSt[k]; }).join("\n"));
  const box = document.createElement("div");
  box.className = "stl";
  const tally = document.createElement("div");
  tally.className = "sttally";
  const marks = [];
  function upd() {
    const o = marks.filter(function (m) { return m === "○"; }).length, x = marks.filter(function (m) { return m === "×"; }).length;
    tally.textContent = "○ " + o + "個　× " + x + "個　未 " + (marks.length - o - x) + "個";
  }

/* 本番の過去問を1年度まるごと解いたときの点数。本番の選び方・合格基準（各科目50%）で数える。

function choose(card, btn, origIdx) {
