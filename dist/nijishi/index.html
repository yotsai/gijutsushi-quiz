<script>
/* 自動生成（tools/practice_to_js.py）。元＝career-master/research/gijutsushi-cards/practice/。Claude作成の想定問題・骨子・解答例 */
const NJ_READ = {"city": "<p>A市（北海道東部の地方都市。実在の市ではない）</p><div class=\"rl l0\">人口：約16万人（2020年比で2035年に約1割減の見込み）。65歳以上が約33%。</div><div class=\"rl l0\">産業：畑作・酪農と食品加工（でん粉・乳製品・砂糖）。市内の温室効果ガス排出は、産業部門と、暖房を含む家庭・業務部門が大きい。</div><div class=\"rl l0\">気候：冬は−20℃を下回る日があり、暖房の灯油・重油の消費が多い。日照時間は長く、太陽光に向く。</div><div class=\"rl l0\">再エネの適地：太陽光（遊休農地・屋根）、陸上風力（丘陵地）、バイオマス（家畜ふん尿・でん粉かす・林地残材）。一方で送電網の空き容量が小さく、大規模電源は接続待ちになりやすい。</div><div class=\"rl l0\">自然：市の南部に湿原と河川があり、タンチョウ・オジロワシなど希少な鳥類が飛来する。</div><div class=\"rl l0\">行政：環境課は職員6名。2021年にゼロカーボンシティを表明済み。</div><p>（設定は自由に変えてよい。業務で土地勘のある地域に合わせると書きやすい。数字は答案の中で「本市の想定」として使う。実在の統計として書かない。）</p>", "items": [{"id": "Ⅱ-2-A", "kind": "選択Ⅱ-2", "title": "再エネ促進区域の設定", "q": "<p>地球温暖化対策推進法に基づき、市町村は地方公共団体実行計画（区域施策編）において、地域脱炭素化促進事業の対象となる区域（促進区域）を定めることができる。あなたが市の担当者として促進区域の設定を担当することになった場合、以下の内容について記述せよ。<br>(1) 調査、検討すべき事項とその内容について説明せよ。<br>(2) 業務を進める手順を列挙して、それぞれの項目ごとに留意すべき点、工夫を要する点を述べよ。<br>(3) 業務を効率的、効果的に進めるための関係者との調整方策について述べよ。</p>", "sk": "<div class=\"rl l0\">1. 本市の概要と方針：A市。太陽光・陸上風力・バイオマスの適地がある一方、南部の湿原に希少な鳥類。系統の空きが小さい。方針＝「屋根置き・遊休農地の太陽光」を中心に区域を設定し、風力は鳥類調査の結果を待つ（論点を太陽光に絞る）。</div><div class=\"rl l0\">(1) 調査・検討事項：再エネ導入ポテンシャル（REPOS）／環境情報（希少種・景観・土砂災害区域）／土地利用（農地・遊休地）／系統の空き容量／地域の意向（アンケート）。</div><div class=\"rl l0\">(2) 手順と留意点</div><div class=\"rl l1\">①既存情報の収集 → 留意：国・県の環境配慮基準と整合。</div><div class=\"rl l1\">②重ね合わせ地図で候補地 → 工夫：除外すべき区域を先に決める。</div><div class=\"rl l1\">③現地確認 → 留意：冬季の積雪・融雪の影響。</div><div class=\"rl l1\">④協議会で案を作成 → 留意：意見を反映した経過を記録する。</div><div class=\"rl l1\">⑤実行計画へ記載・公表。</div><div class=\"rl l0\">(3) 調整：庁内（農政・都市計画・防災）／県（環境配慮基準）／系統の運用者／地元の農業者・住民／専門家（鳥類）。協議会を1つにまとめ、論点ごとに部会。</div>", "ans": "<p>1. 本市の概要と方針<br>当市は人口約16万人の北海道東部の地方都市で、遊休農地・屋根の太陽光、丘陵地の風力、家畜ふん尿のバイオマスに適地がある。一方、南部の湿原にタンチョウなど希少な鳥類が飛来し、送電網の空き容量も小さい。そこで本稿は、系統への負荷が小さい屋根置き・遊休農地の太陽光に論点を絞る。風力は鳥類調査の結果を待って次期に判断する。促進区域は、環境配慮と地域貢献の要件を付して再エネを立地するポジティブゾーニングとして、実行計画（区域施策編）に定める。</p><p>2. 調査、検討すべき事項とその内容<br>1) 導入ポテンシャルと目標：屋根と遊休農地の賦存量を推計し、市内の電力需要と比べて導入目標を設定する。目標がないと区域の広さを決められないためである。<br>2) 環境情報：希少鳥類の生息・渡りのルート、湿原・河川、景観、土砂災害区域を整理する。環境保全・事業性・社会的調整に係る情報を重ね合わせるゾーニングの基礎とする。<br>3) 土地利用：遊休農地の所有・耕作状況と転用の制約を確認する。<br>4) 系統：変電所ごとの空き容量と接続の見通しを把握する。<br>5) 地域の意向：市民・事業者へのアンケートで、地域貢献の希望を把握する。エネルギー代金の多くが域外へ流出している現状を、区域の意義として共有する。</p><p>3. 業務を進める手順と留意点、工夫を要する点<br>1) 既存情報の収集：留意点は、国・道の環境配慮の基準と整合させることである。区域の根拠を説明できなくなるためである。<br>2) 重ね合わせ地図による候補地の抽出：工夫は、湿原周辺の生息地や土砂災害区域など除外すべき区域を先に決め、その外側で候補地を絞ることである。事業者が立地の予見性を持てる。<br>3) 現地確認：留意点は、積雪・融雪と−20℃を下回る低温の影響である。<br>4) 協議会での区域案の作成：環境配慮と地域貢献の要件を区域ごとに付す。留意点は、意見をどう反映したかの経過を記録し、公表することである。<br>5) 実行計画への記載と公表：工夫は、導入量と苦情件数を毎年確認し、区域を見直す仕組みを計画に入れることである。</p><p>4. 関係者との調整方策<br>協議会を一つに束ね、論点ごとに部会を置く。環境課は6名と少ないため、次のとおり役割を分ける。<br>1) 庁内：農政・都市計画・防災・企画の担当を含む横断チームを置く。農地や災害区域の情報を早期に得るためである。<br>2) 道・系統の運用者：環境配慮の基準と接続の見通しを事前に共有する。<br>3) 農業者・住民：遊休農地の所有者と地元に、地域貢献の内容を直接説明する。<br>4) 専門家：鳥類の有識者を部会に入れ、除外区域の根拠を科学的に示す。</p><p>以上</p>", "memo": "<div class=\"rl l0\">字数：1,075字（空白・改行を除く。上限1,200字）</div><div class=\"rl l0\">答案上の設定・推論：</div><div class=\"rl l1\">A市の概要（人口16万人・適地・湿原・系統の空き小）は想定問題の架空設定で、実在の統計ではない</div><div class=\"rl l1\">論点を太陽光に絞り、風力は次期とした判断（骨子どおり。一次資料にない判断）</div><div class=\"rl l1\">除外区域を先に決める工夫、冬季の積雪・低温の留意、導入量・苦情件数の毎年確認は一般的な技術常識に基づく提案</div><div class=\"rl l1\">環境課6名で庁内横断チームを置く役割分担は設定上の判断</div><div class=\"rl l1\">導入ポテンシャルの推計名称（REPOS等）は、カードにないため答案に書かなかった。書くなら一次資料で確認してから</div><div class=\"rl l0\">書き方のポイント：</div><div class=\"rl l1\">冒頭で市の条件を示し、論点を1つ（太陽光）に絞った（ガイド§4「構成」「合格の秘訣」）</div><div class=\"rl l1\">見出しを設問の言葉そのままにし、(1)(2)(3)の書き漏れを防いだ（ガイド§0-1 オウム返し）</div><div class=\"rl l1\">「〜ためである」「〜ことである」と理由を必ず添えて工夫を述べた（ガイド§4「理由を必ず添える」）</div><div class=\"rl l0\">自分で書くときの差し替え候補：A市の設定を実際に土地勘のある自治体に、系統・農地の記述を業務で見た実例に、協議会の運営を自分の経験に置き換える</div>"}, {"id": "Ⅰ-D", "kind": "必須Ⅰ", "title": "2035年度・2040年度の削減目標と地域脱炭素", "q": "<p>政府は2025年2月に地球温暖化対策計画を改定し、温室効果ガスを2013年度比で2035年度に60%、2040年度に73%削減する目標を掲げた。目標の達成には、地域の脱炭素化を全国に広げることが欠かせない。<br>(1) 地方公共団体が主体となって地域の脱炭素化を進めるに当たり、技術者としての立場で多面的な観点から3つの課題を抽出し、それぞれの観点を明記したうえで、その課題の内容を示せ。<br>(2)〜(4) Ⅰ-Aと同じ。</p>", "sk": "<div class=\"rl l0\">冒頭：2035年度60%・2040年度73%（2013年度比）。地域の脱炭素を全国に広げる。</div><div class=\"rl l0\">(1) 課題3つ</div><div class=\"rl l1\">① 人材・体制の観点：自治体に専門人材がいない。</div><div class=\"rl l1\">② 経済の観点：初期投資と採算。補助金が切れると止まる。</div><div class=\"rl l1\">③ 技術・インフラの観点：系統制約と、寒冷地の熱の脱炭素（暖房）が難しい。</div><div class=\"rl l0\">(2) 最重要＝②（理由：持続する事業にならなければ横展開しない（推論））</div><div class=\"rl l1\">解決策1：地域新電力やPPAで初期投資なしに導入する。</div><div class=\"rl l1\">解決策2：エネルギー代金の域外流出を地域経済循環分析で見える化し、投資の意義を示す。</div><div class=\"rl l1\">解決策3：脱炭素先行地域などのモデルを近隣に横展開する（脱炭素ドミノ）。</div><div class=\"rl l0\">(3) リスク：電力価格の変動で地域新電力が経営難 → 電源の多様化と需給管理。</div><div class=\"rl l0\">(4) Ⅰ-Aと同じ型。</div>", "ans": "<p>政府は2025年2月に地球温暖化対策計画を改定し、温室効果ガスを2013年度比で2035年度に60%、2040年度に73%削減する目標を掲げた。2024年度の排出・吸収量は9.94億t（2013年度比28.7%減）で、2035年度目標の5.7億tまで約4.2億tの削減が要る。これは年約0.39億tで、2023年度から2024年度の減少幅（約0.23億t）の約1.7倍の速さである。本問は、暖房需要の大きい寒冷地の地方都市が主体となる場合を対象とする。</p><p>(1) 地方公共団体による地域脱炭素の課題<br>1) 人材・体制の観点<br>課題は、計画の策定と実施を担う人材が足りないことである。脱炭素先行地域は2026年2月までに133市町村・102提案が選定されたが、コスト増大や地元合意の難航により3提案が辞退した。自治体職員や地元企業・金融機関の体制の差が、取組の差を生んでいる。<br>2) 経済の観点<br>課題は、初期投資の負担と、採算の確保である。約9割の市町村で、エネルギー代金の域内外の収支は域外への支出が上回る（2015年度）。重点対策加速化事業の交付は5年間であり、交付が終わった後も事業が続く収支を組めるかが問われる。<br>3) 技術・インフラの観点<br>課題は、系統の制約と、寒冷地の熱の脱炭素である。再エネの導入には系統整備と蓄電池が要る。脱炭素先行地域は民生部門の電力の実質ゼロが核で、運輸と熱利用は地域特性に応じた対策とされており、暖房に灯油・重油を使う寒冷地では削減が後回しになりやすい。</p><p>(2) 最も重要な課題と解決策<br>最も重要な課題は、2)経済の観点とする。理由は、事業として採算が取れず、地域に利益が残らなければ、交付金の終了後に続かず、他の自治体への横展開も起きないからである。<br>1) 初期投資ゼロの導入モデルの活用<br>PPA（電力販売契約）やリースにより、設備の初期費用を事業者が負担し、自治体と施設所有者は電気料金で長期に支払う形で、公共施設と民間の屋根に自家消費型の太陽光を導入する。地域新電力が電力を調達・供給し、売電収益を域内に残す。屋根置き太陽光は、2030年に設置可能な建築物の約50%、2040年に100%への導入が地域脱炭素ロードマップの目標である。<br>2) 地域経済循環分析による域外流出の見える化<br>エネルギー代金の域外流出額を地域経済循環分析で示し、再エネ・省エネへの投資が域内の所得になることを、議会・地域金融機関・住民に説明する。融資を呼び込む根拠にする。<br>3) モデルの横展開（脱炭素ドミノ）<br>脱炭素先行地域などで確立した事業モデルを、近隣の市町村に展開する。都道府県や連携中枢都市と共同で計画を策定し、人材と設計のノウハウを共有する。</p><p>(3) 全て実行しても生じうるリスクと対策<br>1) 電力価格の変動による地域新電力の経営悪化<br>卸電力市場の価格が高騰すると、調達コストが上昇する。対策は、自営の再エネ・蓄電池・長期の相対契約による電源の多様化と、需給管理の高度化である。経営指標の監視と、撤退基準の設定も行う。<br>2) 経済性の高い対策への偏りによる熱・運輸の削減不足<br>電力の対策に偏ると、暖房と運輸の排出が残る。対策は、バイオマス熱供給、地中熱、ヒートポンプ、公共施設のZEB化を計画に位置づけ、計画の審査で熱と運輸を評価することである。<br>3) 形だけの計画となるリスク<br>体制が不十分な小規模自治体では、計画が形だけになるおそれがある。対策は、地域協議会で実行可能性を検証し、都道府県・連携中枢都市等との共同策定と広域での人材支援を行うことである。</p><p>(4) 業務遂行上の要件・留意点<br>1) 技術者倫理の観点<br>公衆の安全を最優先する。削減量や採算の見通しを、科学的根拠に基づき、不確実性とともに隠さず説明する。関係法令を守り、自らの責任範囲を明確にする。<br>2) 社会の持続性の観点<br>環境・経済・社会の統合的向上を判断基準とし、将来世代の負担となる設備の撤去・更新費用まで計画に含める。電力料金や補助の恩恵が一部の層に偏らないようにする。<br>以上</p>", "memo": "<div class=\"rl l0\">字数：1,643字（空白・改行を除く。上限1,800字）</div><div class=\"rl l0\">構成：骨子（配分30・35・20・15%）どおり。変更点は2つ。冒頭に、2024年度実績と2035年度目標の差（算定）を入れて「全国で加速が要る」根拠を数字にした。(3)のリスクを骨子の1つから3つに増やした（熱・運輸の偏り、形だけの計画を追加）。</div><div class=\"rl l0\">使った事実と出典（16件）：</div><div class=\"rl l1\">地球温暖化対策計画（2025年2月）は2013年度比で2035年度60%、2040年度73%削減（材料カード「地球温暖化対策計画」目標）</div><div class=\"rl l1\">2024年度の排出・吸収量9.94億t、2013年度比28.7%減（同「答案で使える数字」の「最新」）</div><div class=\"rl l1\">2023年度確報値10.17億t（同。減少幅の算定に使用）</div><div class=\"rl l1\">2035年度目標5.7億t（同「目標」）</div><div class=\"rl l1\">脱炭素先行地域は2026年2月までに133市町村・102提案が選定、3提案が辞退（同「地域脱炭素ロードマップ」答案で使える数字）</div><div class=\"rl l1\">自治体職員・地元企業・金融機関の体制確保が取組の差を生む（同「課題の観点」【人材・担い手】）</div><div class=\"rl l1\">約9割の市町村でエネルギー代金の域内外収支は域外支出が上回る（2015年度）（同「答案で使える数字」）</div><div class=\"rl l1\">重点対策加速化事業の交付期間は5年間（同「解決策に使える専門用語」）</div><div class=\"rl l1\">脱炭素先行地域は民生部門の電力消費に伴うCO2実質ゼロが核で、運輸・熱利用は地域特性に応じた対策（同「間違えやすい点」）</div><div class=\"rl l1\">再エネ導入には系統整備と蓄電池が要る（同「GX2040ビジョン」課題の観点【技術】）</div><div class=\"rl l1\">屋根置き太陽光は2030年に設置可能建築物の約50%、2040年に100%（同「地域脱炭素ロードマップ」柱）</div><div class=\"rl l1\">初期投資ゼロの導入ビジネスモデルの確立が課題（同「課題の観点」【技術】）。PPAはその一例として書いた</div><div class=\"rl l1\">脱炭素ドミノ（同「解決策に使える専門用語」）</div><div class=\"rl l1\">都道府県・連携中枢都市等との共同策定、広域での人材支援・ノウハウ共有（同「地球温暖化対策計画」リスク）</div><div class=\"rl l1\">地域協議会の開催による合意形成（同「地域脱炭素ロードマップ」課題の観点【合意形成・地域】、リスク）</div><div class=\"rl l1\">ZEB（同「地域脱炭素ロードマップ」解決策の用語）</div><div class=\"rl l0\">答案上の設定・推論（7件）：</div><div class=\"rl l1\">冒頭の「約4.2億t」「年約0.39億t」「約0.23億t」「約1.7倍」は、カードの数字からの算定（9.94−5.7=4.24、4.24÷11年、10.17−9.94=0.23）。カードに書かれた数字そのものではない。2035年度目標は排出・吸収量、2024年度も排出・吸収量で、母集団は同じ。</div><div class=\"rl l1\">「暖房需要の大きい寒冷地」「暖房に灯油・重油を使う」はA市の設定（想問題）と一般常識。実在の統計ではない。</div><div class=\"rl l1\">最重要を「経済」とした理由（採算がなければ続かず横展開されない）は推論。骨子にも（推論）と付いている。</div><div class=\"rl l1\">「交付が終わった後も事業が続く収支を組めるか」は推論。交付期間5年は事実。</div><div class=\"rl l1\">解決策の具体（PPAの費用負担の形、地域新電力、地域経済循環分析、域内融資）は一般的な制度・手法の知識で、カードの事実ではない。</div><div class=\"rl l1\">リスク1「卸電力価格の高騰で地域新電力が経営悪化」と対策（電源の多様化・需給管理・撤退基準）は推論。骨子の対策を踏襲。</div><div class=\"rl l1\">リスク2「熱・運輸の削減不足」の対策（バイオマス熱供給、地中熱、ヒートポンプ）は一般的な技術常識。</div><div class=\"rl l0\">書き方のポイント（3つ）：</div><div class=\"rl l1\">冒頭に数字の差を置いた：実績と目標の差から「必要なペース」を算定し、題意（地域の脱炭素を全国に広げる）の緊急性を示した（ガイド「数値で書く」）。</div><div class=\"rl l1\">課題の観点と実在の制度を対応させた：人材は先行地域の辞退、経済は域外流出と交付期間、技術は電力偏重と寒冷地の熱と、各課題に制度上の事実を1つ付けた。</div><div class=\"rl l1\">解決策を性質で分けた：事業の仕組み（PPA・地域新電力）／見える化（地域経済循環分析）／横展開（脱炭素ドミノ・共同策定）（ガイド「解決策の注意」）。</div><div class=\"rl l0\">自分で書くときの差し替え候補：冒頭の「寒冷地の地方都市」を担当した自治体の特性に、(2)1)の導入モデルを自分が関わった事例に、(1)1)の人材不足の具体（職員数・担当者の兼務状況）に。</div>"}, {"id": "Ⅲ-A", "kind": "選択Ⅲ", "title": "[気候] 地域の再エネ導入と生物多様性の保全の両立", "q": "<p>陸上風力発電や大規模太陽光発電の導入が進む一方、鳥類の衝突事故（バードストライク）や森林・湿地の改変など、生物多様性への影響が懸念されている。<br>(1) 地域で再生可能エネルギーの導入と生物多様性の保全を両立させるに当たり、あなたの選択科目に関わる技術者としての立場で多面的な観点から課題を抽出し、その内容を観点とともに示せ。<br>(2) 前問(1)で抽出した課題のうち最も重要と考える課題を1つ挙げ、その課題に対する複数の解決策を示せ。<br>(3) 前問(2)で示したすべての解決策を実行しても新たに生じうるリスクとそれへの対策について、専門技術を踏まえた考えを示せ。</p>", "sk": "<div class=\"rl l0\">(1) 課題</div><div class=\"rl l1\">① 立地の観点：希少種の生息地・渡りのルートと重なる。</div><div class=\"rl l1\">② 調査・評価の観点：小規模事業は環境影響評価の対象外で、影響が把握されない。</div><div class=\"rl l1\">③ 合意形成の観点：保全団体と事業者の対立。</div><div class=\"rl l1\">④ 事後管理の観点：運転開始後の影響が監視されない。</div><div class=\"rl l0\">(2) 最重要＝①（理由：一度建てると20年以上動かせない。立地で失敗すると後から取り返せない）</div><div class=\"rl l1\">解決策1：鳥類の分布・飛翔データを集めたセンシティビティマップを作り、促進区域・除外区域に反映する。</div><div class=\"rl l1\">解決策2：小規模事業向けの簡易な環境配慮の手引きと事前協議。</div><div class=\"rl l1\">解決策3：順応的管理。事後調査で衝突が多ければ稼働停止の条件を決めておく。</div><div class=\"rl l0\">(3) リスクと対策</div><div class=\"rl l1\">リスク1：除外区域が広すぎて導入目標に届かない → 屋根・既開発地を優先。</div><div class=\"rl l1\">リスク2：事後調査の費用負担で事業性が悪化 → 地域の共同モニタリング。</div>", "ans": "<p>はじめに<br>私は環境保全計画を専門とし、人口約16万人のA市の環境課で、再エネ導入の計画づくりを担当する技術者の立場である。当市は遊休農地・屋根の太陽光と丘陵地の風力に適地がある一方、南部の湿原にタンチョウやオジロワシなどの希少な鳥類が飛来する。以下、当市の陸上風力と太陽光を対象に、計画段階で打てる手を中心に述べる。</p><p>(1) 地域で再生可能エネルギーの導入と生物多様性の保全を両立させるに当たっての課題<br>1) 立地の観点：再エネの適地と、希少種の生息地や渡りのルートが重なる。湿原に近い丘陵地の風力は、バードストライクの危険が高く、遊休農地の大規模な太陽光も、採餌場所の改変につながりうる。<br>2) 調査・評価の観点：規模の小さい事業は環境影響評価の対象とならず、影響が事前に把握されない。個別の事業ごとに調査の水準もばらつき、市が影響を比較・累積して評価することができない。<br>3) 合意形成の観点：保全団体と事業者が対立し、事業の計画段階で協議が進まない。根拠となる共通のデータがなく、主張が感覚の応酬になりやすい。<br>4) 事後管理の観点：運転開始後の鳥類の衝突や生息状況が継続的に監視されない。</p><p>(2) 最も重要な課題と複数の解決策<br>最も重要な課題は1)立地の観点である。理由は、一度設置した発電設備は長期間動かせず、立地を誤ると後から運用の工夫では取り返せないためである。他の3つの課題は、立地が適切であれば影響が小さくなり、解決しやすくなる。<br>解決策は、性質の異なる次の3つを組み合わせる。<br>1) 技術：鳥類の分布・飛翔データを、市内の観察記録と専門家の調査で集め、重要度を地図に示すセンシティビティマップを作る。環境保全・事業性・社会的調整に係る情報を重ね合わせるゾーニングで、促進区域と除外区域に反映する。ポジティブゾーニングとして、環境配慮と地域貢献の要件を区域に付す。事業者は区域内で手続を簡素にでき、区域外には事前協議を求める。<br>2) 仕組み：環境影響評価の対象外となる小規模事業にも、簡易な環境配慮の手引きと事前協議を求める。手引きは、調査の項目と期間を示し、調査水準のばらつきを抑える。市が事業ごとの情報を集約でき、累積した影響も評価できる。<br>3) 運用：順応的管理を取り入れる。事後調査で衝突が多いと確認された場合に、渡りの時期の一時停止や運転条件の変更を行う条件を、事業開始前に事業者・保全団体・市で合意しておく。条件が事前に決まっていれば、事後の対立を防ぎ、事業者にとっても予見性が高まる。</p><p>(3) 前問(2)のすべての解決策を実行しても新たに生じうるリスクと対策<br>1) リスク：除外区域が広すぎて、市の導入目標に届かない。<br>対策：屋根置きや既に開発された土地への導入を優先する。国の地域脱炭素ロードマップは、設置可能な建築物の約50%への導入を2030年の目標としており、屋根は生息地を改変しない。<br>2) リスク：事後調査の費用が事業者に偏り、事業性が悪化して導入が滞る。<br>対策：事業者・市・専門家が共同でモニタリングを行い、費用と得られたデータを共有する。データは次のゾーニングの見直しにも使える。市が地域の多様な主体と連携して行う活動を認定する制度（連携増進活動実施計画）を活用し、保全団体をモニタリングの担い手に位置づければ、費用の分担と手続の簡素化も期待できる。<br>3) リスク：想定外の種や場所で影響が生じる。<br>対策：5年ごとなど期間を決めて区域と要件を見直す。事後調査で新たに確認された種や飛翔経路を地図に加え、30by30に資する自然共生サイトの認定地との整合も確認する。</p><p>保護地域とOECMを合わせた陸域の割合は、全国で21.0%（2025年時点）と、30%以上の目標に届いていない。当市の湿原は、この目標に貢献しうる資源である。再エネと保全は二者択一ではなく、立地の段階で両立を設計し、運転後も見直し続けることが、技術者の責務である。</p><p>以上</p>", "memo": "<div class=\"rl l0\">字数：1,608字（空白・改行を除く。上限1,800字）</div><div class=\"rl l0\">答案上の設定・推論：</div><div class=\"rl l1\">A市の人口・適地・湿原・希少鳥類は想定問題の架空設定。「環境課の技術者」の立場は骨子の設定</div><div class=\"rl l1\">立地を最重要とする理由（長期間動かせない）、他の課題は立地が適切なら解決しやすいとの判断は、一次資料にない判断（骨子どおり、数字は書いていない）</div><div class=\"rl l1\">センシティビティマップ、順応的管理、渡りの時期の一時停止は一般的な技術手法。バードストライクの危険が湿原近くで高いのは一般的な知見</div><div class=\"rl l1\">規模の小さい事業は環境影響評価の対象とならない、は一般的な制度の理解（定性的）。規模の閾値は書いていない</div><div class=\"rl l1\">事業者・市・専門家の共同モニタリング、5年ごとの区域見直しは設定上の提案（5年の期間はたとえ。実在の制度ではない）</div><div class=\"rl l1\">屋根置き優先の対策は骨子どおり。国のロードマップの目標を引いて根拠づけたのは本答案の組み立て</div><div class=\"rl l1\">締めの段落の「当市の自然が国の目標にとっても貴重」は答案上の主張</div><div class=\"rl l0\">書き方のポイント：</div><div class=\"rl l1\">(1)で観点を見出しに明記し、4つの課題を重ならない切り口にした（ガイド§0-2、§5）</div><div class=\"rl l1\">最重要の理由を「取り返せない」の1点で述べ、他の課題との関係も1文で示した（ガイド§0-3）</div><div class=\"rl l1\">解決策を技術・仕組み・運用と性質を変え、(3)のリスク2つに対策を対応させた（ガイド§2 解決策の注意）</div><div class=\"rl l0\">自分で書くときの差し替え候補：A市の設定を実在の地域に、センシティビティマップや事後調査は自分が関わった環境影響評価・モニタリングの実例に、締めの段落は業務で実際に取った対策に置き換える</div>"}, {"id": "Ⅰ-A", "kind": "必須Ⅰ", "title": "脱炭素電源の拡大と地域との共生", "q": "<p>政府は2025年2月に「GX2040ビジョン」と「第7次エネルギー基本計画」を閣議決定し、再生可能エネルギーを主力電源として最大限導入する方針を示した。一方、各地で、大規模な太陽光・風力発電の開発に伴う自然環境・景観への影響や、地域住民との軋轢が生じている。<br>(1) 再生可能エネルギーの導入を地域と共生する形で進めるに当たり、技術者としての立場で多面的な観点から3つの課題を抽出し、それぞれの観点を明記したうえで、その課題の内容を示せ。<br>(2) 前問(1)で抽出した課題のうち最も重要と考える課題を1つ挙げ、その課題に対する複数の解決策を、専門技術用語を交えて示せ。<br>(3) 前問(2)で示したすべての解決策を実行しても新たに生じうるリスクとそれへの対策について、専門技術を踏まえた考えを示せ。<br>(4) 前問(1)〜(3)を業務として遂行するに当たり、技術者としての倫理、社会の持続性の観点から必要となる要件・留意点を述べよ。</p>", "sk": "<div class=\"rl l0\">冒頭（2行）：GX2040ビジョン・第7次エネ基で再エネを主力電源に。導入の加速と地域の受容が両立していない。</div><div class=\"rl l0\">(1) 課題3つ</div><div class=\"rl l1\">① 環境の観点：大規模開発による森林・湿地の改変、鳥類の衝突、土砂流出。立地段階で配慮されないまま開発が進む。</div><div class=\"rl l1\">② 社会（合意形成）の観点：地域に利益が残らず、景観・騒音・防災の不安から反対運動が起きる。</div><div class=\"rl l1\">③ 技術（系統）の観点：送電網の空き容量不足で接続待ち、出力抑制が増える。</div><div class=\"rl l0\">(2) 最重要＝②（理由：①③は技術で解けるが、合意がなければ事業そのものが止まる。導入量の上限を決めているのは地域の受容（推論））</div><div class=\"rl l1\">解決策1：促進区域の設定（ポジティブゾーニング）。環境情報（希少種・景観）を重ねた地図で、適地と保全すべき場所を事前に分ける。</div><div class=\"rl l1\">解決策2：地域裨益の仕組み。地元出資・地域新電力・売電収益の一部を地域の防災や交通に還元する。</div><div class=\"rl l1\">解決策3：計画初期からの住民参加。説明会でなく、計画段階の協議会で一緒に区域を決める。</div><div class=\"rl l0\">(3) リスクと対策</div><div class=\"rl l1\">リスク1：促進区域外での開発の駆け込み → 条例による規制区域・事前協議の義務化と組み合わせる。</div><div class=\"rl l1\">リスク2：地域裨益が一部の関係者に偏り、地域内の対立を生む → 配分ルールの透明化と第三者の検証。</div><div class=\"rl l0\">(4) 倫理：公衆の安全（土砂災害）を最優先し、環境影響を科学的に評価して隠さず説明する。持続可能性：将来の撤去・廃棄（パネルのリサイクル）までを計画に含め、将来世代に負担を残さない。</div>", "ans": "<p>本問は、再生可能エネルギー（以下、再エネ）のうち、導入量の大きい太陽光と陸上風力の大規模開発を対象とする。政府は2025年2月にGX2040ビジョンと第7次エネルギー基本計画を閣議決定し、2040年度の再エネ比率を4〜5割程度（2022年度は21.8%）と見込む。導入の加速と地域の受容の両立が問われている。</p><p>(1) 地域と共生する再エネ導入の課題<br>1) 環境保全の観点<br>課題は、立地段階で自然への配慮が確保されないまま開発が進むことである。森林・湿地の改変、鳥類の衝突、造成に伴う土砂流出が生じる。事業者任せの立地選定は計画段階での回避・低減の機会を失わせる。再エネの不適正な導入は生物多様性に悪影響を及ぼし、脱炭素と自然保護の間にトレードオフが生じる。<br>2) 社会・合意形成の観点<br>課題は、地域に利益が残らず、景観・騒音・防災への不安が解消されないまま事業が進むことである。大規模太陽光では不適切な事案が問題となっており、住民との軋轢が事業の停滞を招く。主力電源化を掲げても、地域の受容が得られなければ導入量は伸びない。<br>3) 技術・系統の観点<br>課題は、出力変動の大きい再エネを受け入れる系統整備と蓄電池が追いついていないことである。安定供給には周波数・系統安定性の維持が欠かせない。系統の空き容量が小さい地域では、接続待ちと出力抑制が生じ、事業の採算が悪化する。</p><p>(2) 最も重要な課題と解決策<br>最も重要な課題は、2)社会・合意形成の観点とする。理由は、環境配慮と系統は技術と制度で対処できるが、地域の合意がなければ事業そのものが止まり、導入量の上限を地域の受容が決めるからである。<br>1) ポジティブゾーニング（再エネ促進区域）の設定<br>市町村が、希少種の生息地（鳥類のセンシティビティマップ）・景観・土砂災害リスクをGISで重ね合わせ、促進区域と保全区域を事前に分ける。区域の設定では地域協議会を開き、環境配慮と地域貢献の要件を付す。環境保全の課題にも同時に効く。<br>2) 地域裨益の仕組みの構築<br>地域GX（地域に裨益する脱炭素電源の整備）の考え方に沿い、地元企業・住民による出資、地域新電力による電力の地産地消、売電収益の一部を防災・交通・福祉に充てる地域基金を設ける。利益が地域に残る構造にする。<br>3) 計画初期からの住民参加<br>説明会で終わらせず、事業計画の段階から協議会で区域と事業条件を協議する。環境アセスメントの調査結果と、景観のフォトモンタージュ、騒音予測を公開し、不安を数値と画像で示す。運用開始後は、鳥類の衝突調査や水質の事後モニタリングを行い、結果を協議会に報告する。</p><p>(3) 全て実行しても生じうるリスクと対策<br>1) 促進区域外への開発の駆け込み<br>区域設定が、規制の緩い区域外への開発流出を招くおそれがある。対策は、条例による事前協議の義務化と、区域外での環境影響評価の厳格な運用である。<br>2) 地域内での利益配分の偏り<br>出資者や土地所有者に利益が偏ると、地域内に新たな対立が生じる。対策は、配分ルールの透明化、基金の使途の公開、第三者による定期的な検証である。<br>3) 導入拡大に伴う系統の逼迫<br>区域内に事業が集中すると、系統の空き容量が不足し接続待ちが悪化する。対策は、ノンファーム型接続の活用、蓄電池の併設、送電網の増強計画との同時策定である。</p><p>(4) 業務遂行上の要件・留意点<br>1) 技術者倫理の観点<br>公衆の安全（土砂災害・騒音）を最優先する。環境影響を科学的根拠に基づき評価し、不利な結果も隠さず説明する。環境影響評価法などの関係法令を遵守し、自らの責任範囲を明確にする。<br>2) 社会の持続性の観点<br>太陽光パネルは2030年代後半以降に排出が増え、年間最大50万t程度に達する見込みである。計画に撤去・廃棄とリサイクルの費用積立を含め、将来世代に負担を残さない。2026年6月公布の太陽電池廃棄物の再資源化等の推進に関する法律にも適合させる。環境・経済・社会の統合的向上を判断基準とする。<br>以上</p>", "memo": "<div class=\"rl l0\">字数：1,620字（空白・改行を除く。上限1,800字）</div><div class=\"rl l0\">構成：骨子（配分30・35・20・15%）どおり。変更点は2つ。(3)にリスク3「系統の逼迫」を追加（骨子はリスク2つ）、冒頭に対象を太陽光と陸上風力に絞る1文を入れた（書き方ガイド「書き出しのコツ」）。</div><div class=\"rl l0\">使った事実と出典（11件）：</div><div class=\"rl l1\">GX2040ビジョン・第7次エネルギー基本計画は2025年2月閣議決定（材料カード「GX2040ビジョン／第7次エネルギー基本計画」決定）</div><div class=\"rl l1\">2040年度の再エネ比率は4〜5割程度（同「目標」。暫定値の注記があるため「見込む」と書いた）</div><div class=\"rl l1\">2022年度の再エネ比率21.8%（同「答案で使える数字」）</div><div class=\"rl l1\">再エネの不適正な導入は生物多様性に悪影響を及ぼし、脱炭素との間でトレードオフが生じる（同「生物多様性国家戦略2023-2030」リスク・波及効果と対策）</div><div class=\"rl l1\">環境影響評価・ゾーニングによる配慮（同上のリスク対策）</div><div class=\"rl l1\">大規模太陽光発電の不適切な事案（同「令和8年版 環境白書」リスク・波及効果と対策）</div><div class=\"rl l1\">再エネ主力電源化には系統整備・蓄電池・調整力が必要。周波数・系統安定性（同「GX2040ビジョン」課題の観点【技術】、リスク）</div><div class=\"rl l1\">促進区域（ポジティブゾーニング）、地域協議会の開催、環境配慮と地域貢献の要件（同「地域脱炭素ロードマップ」解決策の用語、リスク）</div><div class=\"rl l1\">地域GX（地域裨益型の脱炭素電源整備）（同「GX2040ビジョン」解決策の用語）</div><div class=\"rl l1\">太陽光パネルは2030年代後半以降に排出が増え、年間最大50万t程度（ii1/13「定義・背景」。「見込み」と書いた）</div><div class=\"rl l1\">太陽電池廃棄物の再資源化等の推進に関する法律は令和8年法律第33号、2026年6月5日公布（同「根拠」）</div><div class=\"rl l0\">答案上の設定・推論（5件）：</div><div class=\"rl l1\">最重要を「合意形成」とした理由（導入量の上限を地域の受容が決める）は推論。骨子にも（推論）と付いている。</div><div class=\"rl l1\">リスク1「促進区域外への駆け込み」と対策（条例による事前協議の義務化）は推論。カードに記載なし。</div><div class=\"rl l1\">リスク2「地域内の配分の偏り」と対策（配分ルールの透明化・第三者検証）は推論。</div><div class=\"rl l1\">リスク3「系統の逼迫」と対策（ノンファーム型接続・蓄電池併設）は推論。ノンファーム型接続は一般的な技術用語でカードにない。</div><div class=\"rl l1\">解決策の具体（センシティビティマップ、GIS、フォトモンタージュ、地域新電力、地域基金、事後モニタリング）は一般的な技術常識によるもので、カードの事実ではない。</div><div class=\"rl l0\">書き方のポイント（3つ）：</div><div class=\"rl l1\">オウム返しの見出し：設問の言葉をそのまま見出しにした（(1)〜(4)）。(1)は3課題すべてに「〜の観点」を見出しで明記。</div><div class=\"rl l1\">最重要の理由を1文で書く：(2)冒頭で「環境と系統は技術で対処できるが合意がなければ止まる」と選定理由を述べた。解決策は、制度（ゾーニング）・仕組み（地域裨益）・人（住民参加）と性質を変えた（ガイド「解決策の注意」）。</div><div class=\"rl l1\">(4)は定型文化：倫理（安全・科学的根拠・法令・責任範囲）と持続性（将来世代・統合的向上）に、テーマ固有の中身（パネル廃棄）を1つ足した。</div><div class=\"rl l0\">自分で書くときの差し替え候補：(2)の解決策の具体（実際に関わった協議会・ゾーニング・地域裨益の事例）、(3)のリスク2（業務で見た利益配分の揉め事）、(4)の倫理の例（担当業務での安全確認の経験）。</div>"}, {"id": "Ⅰ-B", "kind": "必須Ⅰ", "title": "気候変動影響の深刻化と適応", "q": "<p>環境省は気候変動影響評価報告書（第3次）を公表し、気候変動による影響が各分野で深刻化していることを示した。熱中症による死亡者数の増加や、豪雨災害の激甚化など、影響はすでに国民生活に及んでいる。<br>(1) 気候変動の影響に対する適応を地域で進めるに当たり、技術者としての立場で多面的な観点から3つの課題を抽出し、それぞれの観点を明記したうえで、その課題の内容を示せ。<br>(2)〜(4) Ⅰ-Aと同じ。</p>", "sk": "<div class=\"rl l0\">冒頭：第3次影響評価報告書。緩和だけでは避けられない影響への備え＝適応。</div><div class=\"rl l0\">(1) 課題3つ</div><div class=\"rl l1\">① 科学的知見の観点：地域単位の将来予測と影響の情報が足りず、自治体が優先順位を付けられない。</div><div class=\"rl l1\">② 担い手の観点：地域気候変動適応計画は努力義務で、小規模自治体には専門職員がいない。</div><div class=\"rl l1\">③ 脆弱な人への配慮の観点：高齢者・屋外労働者・独居世帯など、熱中症や災害の被害が集中する人に対策が届かない。</div><div class=\"rl l0\">(2) 最重要＝②（理由：知見や対策メニューがあっても、地域で実行する人がいなければ動かない）</div><div class=\"rl l1\">解決策1：地域気候変動適応センターを中核に、近隣自治体で共同の分析・計画づくり（広域協議会の活用）。</div><div class=\"rl l1\">解決策2：防災・農業・保健など既存の計画に適応を組み込む（主流化）。新しい計画を一から作らない。</div><div class=\"rl l1\">解決策3：大学・気象台・民間との連携と、職員研修。</div><div class=\"rl l0\">(3) リスク：適応策が別の環境負荷を生む（冷房増によるCO2増・堤防による生態系の分断）→ グリーンインフラ・Eco-DRRなど緩和と両立する適応を優先。</div><div class=\"rl l0\">(4) 倫理：不確実な予測を過大にも過小にも伝えない。持続可能性：将来世代と脆弱層への公平。</div>", "ans": "<p>環境省は2026年2月、気候変動影響評価報告書（第3次）を公表した。7分野80項目を評価し、水稲の収量低下、洪水・内水の増加、熱中症の増加などを特に優先的に対応が必要な項目とした。熱中症による死亡者は令和5年に1,651人、令和6年に2,160人となり、2030年に半減する目標の基準（令和4年概数1,295人）を上回る。緩和だけでは避けられない影響への備えである適応を、人材の限られる地方の市町村で進める場合を対象とする。</p><p>(1) 地域で適応を進める課題<br>1) 科学的知見の観点<br>課題は、地域の影響と適応策の効果に関する知見が足りず、優先順位を付けられないことである。報告書でも、適応策の効果を定量的に整理できたのは小項目全体の3割程度、特に強い影響を受ける地域は4割程度、対象は5割程度にとどまる。<br>2) 担い手・制度の観点<br>課題は、地域で適応を実行する体制がないことである。地域気候変動適応計画と地域気候変動適応センターは努力義務であり、2026年3月時点の策定は491自治体、センターは70にとどまる。人材と財政力に乏しい市町村ほど遅れ、地域間の適応力の差が拡大する。<br>3) 脆弱な人への配慮の観点<br>課題は、被害が集中する人に対策が届かないことである。熱中症警戒情報（WBGT33以上の予測）は令和7年度に延べ1,749回発表されたが、情報が行動に結びつくかは、周囲に見守る人がいるかに左右される。高齢者や子どもは自助による予防が難しい場合があり、見守りや声かけなどの共助と、公助による支援が要る。</p><p>(2) 最も重要な課題と解決策<br>最も重要な課題は、2)担い手・制度の観点とする。理由は、知見や対策のメニューが整っていても、地域で実行する人がいなければ対策は動かず、1)と3)の解決の前提にもなるからである。<br>1) 広域連携による共同の分析・計画づくり<br>気候変動適応広域協議会（全国7ブロック）を活用し、近隣の市町村で地域気候変動適応センターを共同設置する。影響の分析と計画の作成を分担し、A-PLATの影響予測と国立環境研究所の専門家派遣（オンライン可）で知見を補う。<br>2) 既存計画への適応の組み込み（主流化）<br>地域防災計画、農業振興計画、保健の計画に適応の視点を組み込み、適応計画を既存の計画と一体的に策定する。新しい計画を一から作らず、少人数でも実行できる形にする。洪水・内水への備えは、防災部局の流域治水の取組と一体で進める。<br>3) 人材育成と連携体制の構築<br>大学・気象台・民間事業者と連携し、職員研修を行う。熱中症対策では、熱中症対策普及団体を指定して見守りを担わせ、指定暑熱避難施設（クーリングシェルター）を確保する。</p><p>(3) 全て実行しても生じうるリスクと対策<br>1) 適応策が別の環境負荷を生むリスク<br>堤防などのハード整備は生態系の分断と財政負担を生み、冷房の普及は電力消費とCO2排出を増やす。対策は、グリーンインフラや自然を活用した解決策（NbS）、流域治水を優先し、高効率機器・断熱・再エネ電力の導入と組み合わせて緩和と両立させることである。<br>2) 広域化により責任が曖昧になり、計画が形骸化するリスク<br>対策は、役割分担を協定で明文化し、毎年の進捗点検に加え、おおむね5年ごとの影響評価に合わせて計画を見直すことである。<br>3) 予測の不確実性により、過大または過小な対策になるリスク<br>対策は、影響評価の確信度を明示し、効果を監視しながら段階的に対策を見直す順応的管理を採ることである。</p><p>(4) 業務遂行上の要件・留意点<br>1) 技術者倫理の観点<br>住民の生命の安全を最優先する。不確実な予測を、過大にも過小にも伝えず、確信度とともに説明する。気候変動適応法などの関係法令を守り、自らの責任範囲を明確にする。<br>2) 社会の持続性の観点<br>将来世代と脆弱な人への公平を確保する。適応を、緩和や地方創生と結びつけて環境・経済・社会の統合的向上につなげ、一部の地域だけが対策できる状況を避ける。<br>以上</p>", "memo": "<div class=\"rl l0\">字数：1,615字（空白・改行を除く。上限1,800字）</div><div class=\"rl l0\">構成：骨子（配分30・35・20・15%）どおり。変更点は2つ。(3)のリスクを骨子の1つから3つに増やした（冷房増・形骸化・予測の不確実性）。冒頭で対象を「地方の市町村」に絞った（ガイド「書き出しのコツ」）。</div><div class=\"rl l0\">使った事実と出典（19件）：</div><div class=\"rl l1\">気候変動影響評価報告書（第3次）の公表は2026年2月（ii1/11「定義・背景」）</div><div class=\"rl l1\">7分野80項目（同「制度の中身・数字」）</div><div class=\"rl l1\">特に優先的に対応が必要な項目（水稲・洪水内水・暑熱）（同）</div><div class=\"rl l1\">熱中症死亡者は令和5年1,651人、令和6年2,160人（材料カード「気候変動適応計画」答案で使える数字の「最新」）</div><div class=\"rl l1\">2030年に半減する目標、基準は令和4年概数1,295人（同「目標」）</div><div class=\"rl l1\">適応策の効果の整理は3割程度、強く影響を受ける地域は4割、対象は5割程度（ii1/11「課題」）</div><div class=\"rl l1\">地域気候変動適応計画・センターは努力義務（ii1/24「制度の中身・数字」）</div><div class=\"rl l1\">2026年3月時点で491自治体が策定、センターは70（同）</div><div class=\"rl l1\">努力義務のため小規模市町村で進まず地域間の差が拡大（材料カード「気候変動適応計画」リスク）</div><div class=\"rl l1\">高齢者・こどもは自助での予防が難しい場合があり、共助と公助が要る（ii1/10「課題」2）</div><div class=\"rl l1\">熱中症警戒情報はWBGT33以上の予測、令和7年度は延べ1,749回（ii1/10「制度の中身・数字」）</div><div class=\"rl l1\">広域協議会は全国7ブロック（ii1/24）</div><div class=\"rl l1\">センターは共同設置なら1件と数える（同）</div><div class=\"rl l1\">A-PLAT、国立環境研究所の専門家派遣（オンライン可）（同「支援」）</div><div class=\"rl l1\">異なる計画を一体的に策定できる（同「間違えやすい点」）</div><div class=\"rl l1\">熱中症対策普及団体、指定暑熱避難施設（ii1/10）</div><div class=\"rl l1\">グリーンインフラ・NbS・流域治水、堤防整備が生態系の分断を生む（材料カード「気候変動適応計画」リスク・解決策の用語）</div><div class=\"rl l1\">影響評価はおおむね5年ごと、評価の観点に確信度（ii1/11、材料カード「気候変動適応計画」目標）</div><div class=\"rl l1\">気候変動適応法、「気候変動適応×地方創生」の発信（ii1/24「対策」3）</div><div class=\"rl l0\">答案上の設定・推論（6件）：</div><div class=\"rl l1\">最重要を「担い手・制度」とした理由（実行する人がいなければ動かない）は推論。骨子の選定を踏襲。</div><div class=\"rl l1\">解決策1の「影響の分析と計画の作成を分担する」運用は推論。カードは共同設置が可能なことまで。</div><div class=\"rl l1\">解決策2の具体（地域防災計画・農業振興計画との一体策定、防災部局の流域治水との連携）は推論。</div><div class=\"rl l1\">リスク1の「冷房の普及でCO2が増える」と対策（高効率機器・断熱・再エネ電力）は一般的な技術常識。</div><div class=\"rl l1\">リスク2「広域化で責任が曖昧になり形骸化」と対策（協定で役割分担を明文化）は推論。</div><div class=\"rl l1\">リスク3「過大・過小な対策」と対策（順応的管理）は推論。順応的管理は一般的な技術用語。「見守る人がいるかに左右される」も推論。</div><div class=\"rl l0\">書き方のポイント（3つ）：</div><div class=\"rl l1\">数字で課題を裏付ける：(1)で「3割・4割・5割」「491・70」と書き、「知見が足りない」「体制がない」を数値で示した（ガイド「数値で書く」）。</div><div class=\"rl l1\">最重要課題を選び、他の課題の解決の前提と位置づけた：(2)冒頭で理由を述べ、解決策3の中に脆弱層対策（見守り・避難施設）を入れて(1)の3)も回収した。</div><div class=\"rl l1\">(3)を「対策の副作用」「運用の失敗」「予測の不確実性」と性質を変えて3つ並べ、各々に対策を1文で付けた。</div><div class=\"rl l0\">自分で書くときの差し替え候補：(2)の解決策1・2（実際に関わった広域連携・既存計画への組み込みの事例）、(1)2)の人数・体制の数字、(3)2)の形骸化の実例。</div>"}, {"id": "Ⅰ-C", "kind": "必須Ⅰ", "title": "環境・経済・社会の統合的向上（シナジーとトレードオフ）", "q": "<p>第六次環境基本計画は、環境の保全を通じた「現在及び将来の国民一人一人のウェルビーイング／高い生活の質」の実現を最上位の目標に掲げ、気候変動・生物多様性の損失・汚染という3つの危機に統合的に対処することを求めている。脱炭素・資源循環・自然再興の取組の間には、相乗効果（シナジー）がある一方で、相反する関係（トレードオフ）も生じうる。<br>(1) 3つの危機への対応を統合的に進めるに当たり、技術者としての立場で多面的な観点から3つの課題を抽出し、それぞれの観点を明記したうえで、その課題の内容を示せ。<br>(2) 前問(1)で抽出した課題のうち最も重要と考える課題を1つ挙げ、その課題に対する複数の解決策を示せ。<br>(3) 前問(2)で示したすべての解決策を実行して生じる波及効果と、専門技術を踏まえた懸念事項への対応策を示せ。<br>(4) Ⅰ-Aと同じ。</p>", "sk": "<div class=\"rl l0\">冒頭：第六次環境基本計画の最上位目標と3つの危機。個別最適の対策が別の危機を悪化させる例がある。</div><div class=\"rl l0\">(1) 課題3つ</div><div class=\"rl l1\">① 脱炭素と自然の観点：再エネ開発が生態系を損なうトレードオフ。</div><div class=\"rl l1\">② 脱炭素と資源循環の観点：太陽光パネル・蓄電池の大量導入で、将来の大量廃棄と資源制約が生じる。</div><div class=\"rl l1\">③ 制度・評価の観点：施策ごとに縦割りで評価され、相乗効果も悪影響も見えない。</div><div class=\"rl l0\">(2) 最重要＝③（理由：①②は③の「見えない」ことから起きる構造的な原因（推論））</div><div class=\"rl l1\">解決策1：LCAと自然への影響評価を事業の初期段階に入れる。</div><div class=\"rl l1\">解決策2：計画の統合。地域の実行計画・生物多様性地域戦略・循環の計画を一体で作る（地域循環共生圏）。</div><div class=\"rl l1\">解決策3：企業の情報開示（TNFDなど）で、市場が相乗効果を評価する仕組み。</div><div class=\"rl l0\">(3) 波及効果：地域資源を使う事業で地域経済が回り、ウェルビーイングが上がる。懸念：評価の手間とコストが中小事業者の負担になる → 簡易ツールと支援。</div><div class=\"rl l0\">(4) 倫理・持続可能性：Ⅰ-Aと同じ型。</div>", "ans": "<p>第六次環境基本計画（2024年5月閣議決定）は、ウェルビーイング／高い生活の質を最上位に置き、気候変動・生物多様性の損失・汚染の3つの危機への統合的対処と、ネット・ゼロ、循環経済、ネイチャーポジティブの同時達成を掲げる。一方、個別に最適化した対策が別の危機を悪化させる例がある。本問は、地域で脱炭素・資源循環・自然再興を進める事業を対象とする。</p><p>(1) 3つの危機への統合的対応の課題<br>1) 脱炭素と自然再興の観点<br>課題は、再エネ開発が生態系を損なうトレードオフの回避である。再エネの不適正な導入は生物多様性に悪影響を及ぼし、大規模太陽光は土地利用で自然再興と競合する。保護地域とOECMは陸域21.0%、海域13.3%（2025年）で、30by30の目標30%に届いていない。<br>2) 脱炭素と資源循環の観点<br>課題は、太陽光パネルの大量導入が将来の大量廃棄を生むことである。排出は2030年代後半以降に年間最大50万t程度に達する見込みだが、専用のリサイクル施設の処理能力は約13万t/年で、8府県には施設がない。埋立の方が安く、費用は8,000〜12,000円/kWに対し2,000円/kW程度からである。<br>3) 制度・評価の観点<br>課題は、施策が縦割りで評価され、相乗効果も悪影響も見えないことである。自然資本への負荷を定量評価する指標や手法の整備は途上にあり、経団連調査（2022年度）では回答企業の25%が自然と事業の関連性を「わからない」と答えた。</p><p>(2) 最も重要な課題と解決策<br>最も重要な課題は、3)制度・評価の観点とする。理由は、1)と2)のトレードオフは、事業の判断時に影響が見えていないことから起きる構造的な問題であり、見える化が他の課題の解決の前提になるからである。<br>1) LCAと自然影響評価の初期段階での実施<br>事業の立地・設備の選定段階で、ライフサイクル全体のCO2、資源量、自然への影響を評価する。ミティゲーション・ヒエラルキー（回避、最小化、修復、代償）の順で対策を選び、回避を優先する。評価結果は事業計画書に添付し、事業の採否と設計変更の根拠にする。<br>2) 計画の統合（地域循環共生圏）<br>地域の実行計画、生物多様性地域戦略、循環の計画を一体で策定し、同じ地図・指標で相乗効果と悪影響を評価する。自然資本を活かし、近隣地域と資源を補完し合う地域循環共生圏の考え方で進める。<br>3) 情報開示による市場の評価<br>TNFDなどの開示と、調達・ファイナンスの実践ガイドライン（2026年に公表）を活用し、金融機関と取引先が事業の自然・脱炭素への影響を評価する仕組みにする。</p><p>(3) 全て実行した場合の波及効果と、懸念への対応<br>1) 波及効果<br>ネイチャーポジティブへの移行は、2030年に日本で年47兆円のビジネス機会を生むと試算され、その4分の3以上が炭素中立・循環経済と強く関連する。地域資源を活用する事業で地域経済が回り、生活の質が高まる。脱炭素の設備投資が、再生材の利用や自然の回復と同じ地域で重なるためである。<br>2) 懸念1：評価・開示のコストが中小事業者に偏る<br>対策は、業種別の簡易評価ツール、段階的な導入、地域金融機関と連携した支援である。<br>3) 懸念2：評価の手続が増え、事業が遅れて脱炭素の速度が落ちる<br>対策は、場所に紐づく自然のデータ基盤を整え、リモートセンシングやAIで調査を効率化し、環境影響評価と評価データを共通化することである。<br>4) 懸念3：評価手法が未成熟で、結果の不確実性が大きい<br>対策は、不確実性を明示し、事後モニタリングで見直す順応的管理を採ることである。</p><p>(4) 業務遂行上の要件・留意点<br>1) 技術者倫理の観点<br>公衆の安全と健康を最優先する。評価の前提と不確実性を、科学的根拠に基づき隠さず説明する。関係法令を守り、自らの責任範囲を明確にする。<br>2) 社会の持続性の観点<br>環境・経済・社会の統合的向上を判断基準とし、特定の危機への対策が別の危機を悪化させていないかを確認する。将来世代に廃棄物や生態系の劣化を残さない。<br>以上</p>", "memo": "<div class=\"rl l0\">字数：1,645字（空白・改行を除く。上限1,800字）</div><div class=\"rl l0\">構成：骨子（配分30・35・20・15%）どおり。変更点は2つ。(3)を骨子の「波及効果1つ＋懸念1つ」から「波及効果1つ＋懸念3つ」に広げた。問題文(3)が「波及効果」と「懸念事項への対応策」の両方を求めているため。(2)解決策3に調達・ファイナンスのガイドラインを加えた（骨子はTNFD開示のみ）。</div><div class=\"rl l0\">使った事実と出典（17件）：</div><div class=\"rl l1\">第六次環境基本計画は2024年5月閣議決定、最上位はウェルビーイング／高い生活の質（材料カード「第六次環境基本計画」決定・根拠）</div><div class=\"rl l1\">3つの危機への統合的対処、ネット・ゼロ・循環経済・ネイチャーポジティブの同時達成（同「第五次循環型社会形成推進基本計画」解決策の用語。問題文の記述も踏襲）</div><div class=\"rl l1\">再エネの不適正な導入が生物多様性に悪影響を与え、トレードオフが生じる（同「生物多様性国家戦略2023-2030」リスク）</div><div class=\"rl l1\">大規模太陽光発電は自然再興と土地利用で競合する（同「令和8年版 環境白書」リスク）</div><div class=\"rl l1\">保護地域とOECMは陸域21.0%、海域13.3%（2025年）、目標30%（同「生物多様性国家戦略」答案で使える数字）</div><div class=\"rl l1\">パネルの排出は2030年代後半以降、年間最大50万t程度（ii1/13「定義・背景」。「見込み」と書いた）</div><div class=\"rl l1\">専用リサイクル施設の処理能力は約13万t/年、8府県に施設がない（同「制度の中身・数字」）</div><div class=\"rl l1\">リサイクル費用8,000〜12,000円/kW、埋立2,000円/kW程度〜（同）</div><div class=\"rl l1\">自然資本への負荷を定量評価する指標・手法の整備が途上（ii1/17「課題」1）</div><div class=\"rl l1\">経団連調査（2022年度）で回答企業の25%が「事業との関連性がわからない」（同「課題」2）</div><div class=\"rl l1\">ミティゲーション・ヒエラルキー（同「制度の中身・数字」5つの要素）</div><div class=\"rl l1\">地域循環共生圏（材料カード「第六次環境基本計画」解決策の用語）</div><div class=\"rl l1\">TNFD（同「生物多様性国家戦略」解決策の用語）</div><div class=\"rl l1\">調達・ファイナンスの実践ガイドラインは2026年に公表（ii1/17「制度の中身・数字」）</div><div class=\"rl l1\">2030年に日本で年47兆円のビジネス機会、その4分の3以上が炭素中立・循環経済と関連（同）</div><div class=\"rl l1\">開示コストが中小企業に偏る。段階的な導入支援・地域金融機関との連携（材料カード「生物多様性国家戦略」リスク）</div><div class=\"rl l1\">データ基盤、リモートセンシング、AI活用（ii1/17「対策・今後の方向」1）</div><div class=\"rl l0\">答案上の設定・推論（7件）：</div><div class=\"rl l1\">最重要を「制度・評価」とした理由（トレードオフは見えないことから起きる構造的な問題）は推論。骨子にも（推論）と付いている。</div><div class=\"rl l1\">LCA結果を事業計画書に添付し採否の根拠にする運用は推論。LCA自体は一般的な技術手法でカードにない。</div><div class=\"rl l1\">計画統合で「同じ地図・指標で相乗効果と悪影響を評価する」運用は推論。</div><div class=\"rl l1\">波及効果の「脱炭素の設備投資が再生材の利用や自然の回復と同じ地域で重なる」という説明は推論。</div><div class=\"rl l1\">懸念1の「業種別の簡易評価ツール」は推論（材料カード側も推論付き）。</div><div class=\"rl l1\">懸念2「評価の手続が増えて事業が遅れる」と対策（環境影響評価との共通化）は推論。</div><div class=\"rl l1\">懸念3「評価手法が未成熟で不確実」と対策（順応的管理）は推論。順応的管理は一般的な技術用語。</div><div class=\"rl l0\">書き方のポイント（3つ）：</div><div class=\"rl l1\">課題を「AとBのトレードオフ」の形で観点名に入れた：「脱炭素と自然再興」「脱炭素と資源循環」と、題意（シナジーとトレードオフ）をそのまま観点にした（ガイド「観点を明記」）。</div><div class=\"rl l1\">数字で現状の厳しさを示した：30by30の進捗、パネル50万t対13万t/年、費用差。課題の中身を数値で書く型（ガイド「数値で書く」）。</div><div class=\"rl l1\">(3)で相乗効果（47兆円）を先に書き、続けて懸念と対策を番号で並べた。問題文が「波及効果」と「懸念」の両方を求めているので、その順に見出しを立てた（オウム返し）。</div><div class=\"rl l0\">自分で書くときの差し替え候補：(1)1)の自然配慮の失敗例、(2)1)のLCAや環境影響評価の実務経験、(3)の懸念2（業務での手続負担の実感）。</div>"}, {"id": "Ⅱ-2-B", "kind": "選択Ⅱ-2", "title": "企業の温室効果ガス排出量の算定と開示", "q": "<p>サステナビリティ基準委員会（SSBJ）は2025年3月にサステナビリティ開示基準を公表した。2026年2月の内閣府令の改正により、プライム市場上場企業のうち時価総額の大きい企業から順に、有価証券報告書でのSSBJ基準に準拠した開示が義務化される。あなたが製造業の企業で、自社のScope1・2・3の排出量の算定と開示の体制づくりを担当することになった場合、以下の内容について記述せよ。<br>(1)〜(3) Ⅱ-2-Aと同じ。</p>", "sk": "<div class=\"rl l0\">1. 自社の概要と方針：食品加工の製造業（推論の設定）。Scope3はカテゴリ1（購入した原材料）が大半。方針＝Scope3のカテゴリ1の精度向上に絞る。</div><div class=\"rl l0\">(1) 調査・検討事項：開示義務の時期の確認（時価総額の区分）／算定範囲（組織・カテゴリ）／データの所在（購買・物流・エネルギー）／排出原単位の選び方／第三者保証。</div><div class=\"rl l0\">(2) 手順</div><div class=\"rl l1\">①現状の算定方法の棚卸し → 留意：前年との比較可能性。</div><div class=\"rl l1\">②重要カテゴリの特定 → 工夫：金額×原単位で概算し上位から精緻化。</div><div class=\"rl l1\">③サプライヤーの一次データ収集 → 留意：取引先の負担。</div><div class=\"rl l1\">④社内の算定規程・承認フロー → 留意：財務情報と同じ時期・同じ精度。</div><div class=\"rl l1\">⑤開示文案と保証対応。</div><div class=\"rl l0\">(3) 調整：経理・IR（財務報告と同時開示）／購買（サプライヤーへの依頼）／取引先（説明会・算定ツールの提供）／監査法人・保証機関。</div>", "ans": "<p>1. 当社の概要と方針<br>当社は北海道に主力工場を持つ食品加工メーカーで、想定する平均時価総額は約8,000億円である。SSBJ基準に準拠した有価証券報告書の開示は、5,000億円以上の区分で2029年3月期の予定であり、準備期間は約2年である。Scope3は購入した原材料（カテゴリ1）が大半を占める。そこで本稿は、カテゴリ1の算定精度の向上に論点を絞る。</p><p>2. 調査、検討すべき事項とその内容<br>1) 開示義務の時期：時価総額は過去5事業年度末の平均で判定される。1兆円に近く、上回れば2028年3月期に早まるため、毎期の水準を確認する。<br>2) 算定範囲：連結の組織境界とScope3のカテゴリを確定する。<br>3) データの所在：エネルギー使用量は工場、購入量・金額は購買、物流は物流部門にある。システムと担当者を洗い出す。<br>4) 排出原単位：金額ベースと物量ベースの原単位を、データの有無に応じて選ぶ。温対法の制度による排出量を使う場合の開示の扱いも確認する。<br>5) 第三者保証：保証は適用義務化の翌年から義務づけられ、当初2年は範囲が限定される。算定根拠を後から検証できる形で残す。</p><p>3. 業務を進める手順と留意点、工夫を要する点<br>1) 現状の算定方法の棚卸し：留意点は、前年との比較可能性を保つことである。方法を変えるときは過去分を再計算する。<br>2) 重要カテゴリの特定：工夫は、全カテゴリを購入金額×原単位で概算し、上位から精緻化することである。限られた人員で、削減につながる範囲に労力を集中できる。<br>3) サプライヤーの一次データ収集：原料の主要な調達先から、製造時のエネルギー使用量など実測値を集める。留意点は、取引先の負担である。算定ツールを当社が提供する。<br>4) 算定規程と承認フロー：留意点は、財務情報と同じ時期・同じ精度で算定することである。有価証券報告書は財務報告と同時に提出されるためである。<br>5) 開示文案と保証への対応：工夫は、最初の2事業年度に認められる二段階開示（訂正報告書での記載）と、Scope3の初年度免除を使える前提で計画しつつ、免除に頼らず初年度から開示できる体制を目指すことである。</p><p>4. 関係者との調整方策<br>1) 経理・IR：財務報告と同じ日程で動けるよう、算定の締め日と承認の期限を合わせる。<br>2) 購買：サプライヤーへの依頼を購買の窓口に一本化し、取引条件の交渉と混ざらないようにする。<br>3) 取引先：説明会を開き、算定ツールと記入例を提供して負担を下げる。<br>4) 監査法人・保証機関：登録された保証業務実施者に、早い時期から算定の根拠資料の形式を確認する。</p><p>以上</p>", "memo": "<div class=\"rl l0\">字数：1,069字（空白・改行を除く。上限1,200字）</div><div class=\"rl l0\">答案上の設定・推論：</div><div class=\"rl l1\">食品加工メーカー・平均時価総額約8,000億円・準備期間約2年は答案上の設定（実在企業ではない）。5,000億円以上の区分は、2026年6月30日時点で金融審議会WG報告の方針（予定）にとどまり、府令で義務づけたのは1兆円以上（カード「制度の中身・数字」）。答案では「予定」と書いた</div><div class=\"rl l1\">Scope3カテゴリ1が大半という設定、論点をカテゴリ1に絞る判断（骨子どおり、推論）</div><div class=\"rl l1\">GHGプロトコルのカテゴリ区分、金額ベース・物量ベースの原単位、一次データ、算定ツールの提供は一般的な技術常識</div><div class=\"rl l1\">経理・購買・取引先・保証機関への調整内容は設定上の判断</div><div class=\"rl l0\">書き方のポイント：</div><div class=\"rl l1\">冒頭で想定企業と義務化の時期を数字で置き、論点を1つに絞った（ガイド§4 数量の設定・論点の絞り込み）</div><div class=\"rl l1\">手順ごとに「留意点」「工夫」を明記し、設問(2)に直接答えた（ガイド§4 構成）</div><div class=\"rl l1\">最終段で「経過措置を使える前提で計画しつつ頼らない」と、制度の知識と判断を同時に示した（ガイド§4 理由を必ず添える）</div><div class=\"rl l0\">自分で書くときの差し替え候補：自社（または顧客）の業種・時価総額の区分、算定の実務で詰まった点（原単位の選び方、調達先データの集め方）、取引先とのやりとりの実例</div>"}, {"id": "Ⅱ-2-C", "kind": "選択Ⅱ-2", "title": "熱中症特別警戒情報への対応", "q": "<p>2023年の気候変動適応法の改正により、熱中症特別警戒情報が創設され、市町村長は指定暑熱避難施設（クーリングシェルター）を指定できるようになった。あなたが市の担当者として熱中症対策の実施計画づくりを担当することになった場合、以下の内容について記述せよ。<br>(1)〜(3) Ⅱ-2-Aと同じ。</p>", "sk": "<div class=\"rl l0\">1. 本市の概要と方針：寒冷地だが近年は猛暑日が出始め、エアコンのない高齢世帯が多い（推論の設定）。方針＝高齢者の屋内熱中症に絞る。</div><div class=\"rl l0\">(1) 調査・検討事項：過去の救急搬送データ（年齢・場所）／エアコン保有状況／クーリングシェルター候補（公共施設・商業施設の冷房・開館時間）／見守りの担い手。</div><div class=\"rl l0\">(2) 手順</div><div class=\"rl l1\">①データ分析で優先地区 → 留意：個人情報の扱い。</div><div class=\"rl l1\">②シェルターの指定 → 工夫：民間施設との協定、地図とアプリで周知。</div><div class=\"rl l1\">③熱中症特別警戒情報の発表時の連絡体制 → 留意：休日夜間。</div><div class=\"rl l1\">④見守り（民生委員・介護事業者）→ 留意：負担の集中。</div><div class=\"rl l1\">⑤検証と改善。</div><div class=\"rl l0\">(3) 調整：保健福祉部局・防災部局・消防（搬送データ）・民間施設・民生委員・気象台。</div>", "ans": "<p>1. 本市の概要と方針<br>当市は人口約16万人、65歳以上が約33%（約5.3万人）の寒冷地の都市である。冬は−20℃を下回る一方、エアコンのない高齢世帯が多く、近年は猛暑日も出始めている。そこで本稿は、高齢者の屋内での熱中症に論点を絞る。実施計画は、特別警戒情報の発表時だけでなく、発表頻度の高い警戒情報の段階から動く計画とする。</p><p>2. 調査、検討すべき事項とその内容<br>1) 救急搬送データ：過去の年齢・発生場所・時間帯を分析し、屋内で発症する高齢者の多い地区を特定する。<br>2) 世帯の状況：エアコンの保有状況と高齢単身世帯の分布を、福祉部局の情報で把握する。<br>3) クーリングシェルターの候補：公共施設と商業施設の冷房設備、開館時間、バリアフリー、徒歩圏の分布を調べる。特別警戒情報は都道府県内の全地点で暑さ指数（WBGT）35以上が予測されたときに限られる。2024年4月の運用開始から発表は0回のため、WBGT33以上で出る警戒情報の日にも開放できる施設かを確認する。<br>4) 見守りの担い手：民生委員、介護事業者、熱中症対策普及団体の候補の人数と負担を確認する。</p><p>3. 業務を進める手順と留意点、工夫を要する点<br>1) データ分析による優先地区の設定：留意点は個人情報の扱いである。個人が特定されない集計単位で分析し、利用目的を庁内で定める。<br>2) シェルターの指定：市町村長が指定する施設である。工夫は、商業施設や福祉施設と協定を結び、公共施設の閉まる休日・夜間もカバーすることである。地図とアプリで場所を周知する。<br>3) 発表時の連絡体制：特別警戒情報は環境大臣から知事を経て市町村長へ、前日の14時頃に伝わる。留意点は休日・夜間の受信体制である。当番制とし、庁内と民間施設への連絡を前日中に終える。<br>4) 見守りの実施：エアコンの使用を促す声かけを、民生委員と介護事業者が担う。留意点は、担い手の負担の集中を避けることである。訪問先を優先地区に絞り、負担を平準化する。<br>5) 検証と改善：夏の終わりに、搬送件数とシェルターの利用実績を確認して計画を見直す。2030年に死亡者数を半減する国の目標に合わせ、市の目標も設ける。</p><p>4. 関係者との調整方策<br>1) 庁内：保健福祉部局、防災部局、消防を一つの会議体に束ねる。搬送データと福祉情報を同じ席で共有でき、判断が早くなる。<br>2) 民間施設：協定の内容を統一し、開放の条件と費用負担を明確にする。<br>3) 民生委員・介護事業者：研修を行い、役割と連絡先を共有する。<br>4) 気象台：特別警戒情報と警戒情報の見通しを早めに得る体制を取る。</p><p>以上</p>", "memo": "<div class=\"rl l0\">字数：1,062字（空白・改行を除く。上限1,200字）</div><div class=\"rl l0\">答案上の設定・推論：</div><div class=\"rl l1\">A市の人口16万人・65歳以上約33%は想定問題の架空設定。約5.3万人は16万人×33%の概算</div><div class=\"rl l1\">エアコンのない高齢世帯が多い、近年猛暑日が出始めている、は骨子の設定（推論。実在の統計ではない）</div><div class=\"rl l1\">論点を高齢者の屋内熱中症に絞る判断、警戒情報の段階から動く計画とする判断（発表実績0回という事実からの推論）</div><div class=\"rl l1\">警戒情報の日にも開放できる施設かの確認は、法定の開放義務が特別警戒情報の発表時に限られる（カード「間違えやすい点」）ことを踏まえた、市の自主的な運用の提案</div><div class=\"rl l1\">当番制、地図とアプリでの周知、協定の統一、搬送データの集計単位は一般的な実務の提案</div><div class=\"rl l1\">市の目標を国の半減目標に合わせて設ける点は設定上の判断（目標値は書いていない）</div><div class=\"rl l0\">書き方のポイント：</div><div class=\"rl l1\">冒頭で市の人口・高齢化率を数字で置き、論点を1つに絞った（ガイド§4 数量の設定）</div><div class=\"rl l1\">制度の事実（発表0回、法定の開放時期）を、計画の工夫（警戒情報から動く）に直結させた（ガイド§4 理由を必ず添える）</div><div class=\"rl l1\">手順ごとに留意点と工夫を書き、設問(2)に直接答えた（ガイド§4 構成）</div><div class=\"rl l0\">自分で書くときの差し替え候補：市の高齢化率・搬送件数・エアコン保有率を実在の自治体の数字に、シェルター候補を実際の施設に、見守り体制を自分の関わった事例に置き換える</div>"}, {"id": "Ⅲ-B", "kind": "選択Ⅲ", "title": "[循環] 動脈産業と静脈産業の連携による資源循環", "q": "<p>2024年5月に再資源化事業等高度化法が成立し、廃棄物処理・リサイクル事業者（静脈産業）と製造事業者（動脈産業）が連携して、再生材の質と量を確保する取組が求められている。<br>(1) 製造業で再生材の利用を拡大するに当たり、あなたの選択科目に関わる技術者としての立場で多面的な観点から課題を抽出し、その内容を観点とともに示せ。<br>(2)(3) Ⅲ-Aと同じ。</p>", "sk": "<div class=\"rl l0\">(1) 課題</div><div class=\"rl l1\">① 品質の観点：再生材の品質のばらつき・不純物。</div><div class=\"rl l1\">② 量・供給の観点：安定した量が集まらない。</div><div class=\"rl l1\">③ 設計の観点：製品がリサイクルしにくい構造。</div><div class=\"rl l1\">④ コストの観点：バージン材より割高。</div><div class=\"rl l0\">(2) 最重要＝①（理由：品質が保証されなければ設計者は採用できず、他の課題を解いても使われない）</div><div class=\"rl l1\">解決策1：静脈事業者と品質規格を共同で決め、選別・洗浄の工程を改善する。</div><div class=\"rl l1\">解決策2：トレーサビリティ（デジタル製品パスポート等）で出所と組成を管理する（推論）。</div><div class=\"rl l1\">解決策3：再生材を前提にした設計（単一素材化・易解体設計）。</div><div class=\"rl l0\">(3) リスク：再生材の取り合いによる価格高騰 → 長期契約・地域内循環。リスク：再生工程のエネルギー増 → LCAで確認。</div>", "ans": "<p>はじめに<br>私は環境保全計画を専門とし、A市に工場を持つ食品用の樹脂容器メーカーで、製品の設計を担当する技術者の立場である。当社は容器の原料の一部を再生材に置き換える計画を持つ。再資源化事業等高度化法（2024年5月成立）は、静脈産業と動脈産業の連携による再生材の質と量の確保を求めている。以下、設計者の立場から述べる。</p><p>(1) 製造業で再生材の利用を拡大するに当たっての課題<br>1) 品質の観点：再生材は、原料の由来によって物性や不純物の量がばらつく。食品に触れる容器では、臭いや異物の混入が許されず、設計者は安定した品質が保証されない材料を使えない。<br>2) 量・供給の観点：回収された使用済み樹脂が安定した量で集まらず、必要な時期に必要な量を調達できない。生産計画に合わせた調達ができないと、再生材の配合を安定して続けられない。<br>3) 設計の観点：複数の素材の貼り合わせや接着剤の使用など、製品がリサイクルしにくい構造になっている。使用済みの容器から高品質の再生材を得にくく、品質の課題の一因にもなっている。<br>4) コストの観点：再生材は選別・洗浄の費用がかかり、バージン材より割高になりやすい。価格差を製品価格に転嫁しにくく、経営判断で後回しにされる。</p><p>(2) 最も重要な課題と複数の解決策<br>最も重要な課題は1)品質の観点である。理由は、品質が保証されなければ設計者は採用を判断できず、量やコストを解決しても使われないためである。<br>解決策は、技術・仕組み・設計の3つの性質で組み合わせる。<br>1) 技術：静脈事業者と、不純物や物性について共通の品質規格を決め、選別・洗浄の工程を改善する。規格は当社の受け入れ検査の基準にもそのまま使い、基準を満たすロットだけを購入する。再資源化事業等高度化法は、製造側の需要に応じた質・量の再生材を確保する高度再資源化事業計画を、環境大臣が認定する仕組みを設けている。認定を受ければ廃棄物処理法の許可の特例を受けられるため、静脈事業者と共同で計画を作る動機が生まれる。<br>2) 仕組み：デジタル製品パスポートのように、再生材の出所と組成をデータで管理し、ロットごとの品質を追跡できるようにする。不具合が出たときに、原因となった工程にさかのぼれる。品質の根拠を示せれば、取引先や消費者への説明もしやすくなる。<br>3) 設計：再生材を前提にした設計に変える。単一素材化と易解体設計で、不純物の混入を元から減らす。使用済みの容器が高品質の再生材として戻る循環が生まれ、品質の課題を製品側からも解く。プラスチック資源循環促進法の設計認定は、この方向の優れた製品を後押しする制度であり、認定の取得を目標に置く。</p><p>(3) 前問(2)のすべての解決策を実行しても新たに生じうるリスクと対策<br>1) リスク：再生材の需要が各社で同時に高まり、取り合いで価格が高騰する。<br>対策：静脈事業者との長期契約を結ぶ。また、市内の食品工場や小売店から出る使用済み容器を回収する地域内の循環を作り、調達先を複数に分け、価格の見通しを半年ごとに見直す。<br>2) リスク：再生工程で洗浄・加熱のエネルギーが増え、かえってCO2排出が増える。<br>対策：ライフサイクルアセスメント（LCA）で、バージン材との排出量を比較し、削減になる配合率の範囲を確認する。工程には再エネ電力を使う。<br>3) リスク：再生材の有害物質の管理が不十分で、製品の安全性に懸念が生じる。<br>対策：受け入れ検査の項目に有害物質を加え、基準に満たないロットを使わない手順を設計と品質保証で決める。設計変更の際は、安全性の確認を完了するまで出荷しない。</p><p>再生材の利用は、2030年度に出口側の循環利用率約44%を目指す国の循環の目標につながる。設計者は、品質を保証できる範囲から配合率を高め、成果を静脈事業者と共有しながら、段階的に利用を広げる。当社では、まず非食品接触部の部材から始め、実績を積んで食品に触れる部位へ広げる。</p><p>以上</p>", "memo": "<div class=\"rl l0\">字数：1,609字（空白・改行を除く。上限1,800字）</div><div class=\"rl l0\">答案上の設定・推論：</div><div class=\"rl l1\">食品用の樹脂容器メーカー、設計者の立場、A市に工場、は答案上の設定（骨子の「製造業の設計技術者」をさらに具体化）</div><div class=\"rl l1\">品質を最重要とする理由（採用判断ができない）は骨子どおり（推論）</div><div class=\"rl l1\">再生材の物性・不純物のばらつき、食品容器での臭い・異物の懸念、単一素材化・易解体設計、LCAは一般的な技術常識</div><div class=\"rl l1\">デジタル製品パスポートを再生材のロット追跡に使う提案は骨子で（推論）とされたもの。制度としてDPPの記述はカードにあるが、再生材のロット管理への応用は答案上の提案</div><div class=\"rl l1\">再生材の取り合いによる価格高騰、再生工程のエネルギー増は骨子どおり（推論）。長期契約・地域内循環・調達先の分散・再エネ電力は提案</div><div class=\"rl l1\">設計認定の取得を目標に置くのは提案。認定対象は特定の製品分野に限られるため、自社の製品が対象かは要確認</div><div class=\"rl l1\">認定を受ければ静脈事業者と共同で計画を作る動機が生まれる、は答案上の論理</div><div class=\"rl l1\">まず非食品接触部の部材から配合を始める進め方は答案上の提案（食品接触部位の法規制の確認は書いていない。実務では要確認）</div><div class=\"rl l0\">書き方のポイント：</div><div class=\"rl l1\">立場を設計者に絞り、課題を品質・量・設計・コストの4観点で書いた（ガイド§5 コツ「立場を絞ると具体的」）</div><div class=\"rl l1\">解決策を技術・仕組み・設計と性質を変え、法の仕組みを「動機が生まれる」と解決策の効果に結びつけた（ガイド§2 解決策の注意）</div><div class=\"rl l1\">(3)で3つのリスクに対策を1対1で対応させ、最後は設計者の行動で締めた（ガイド§5 コツ）</div><div class=\"rl l0\">自分で書くときの差し替え候補：製品・素材を自分の担当に、品質規格の決め方や静脈事業者とのやりとりを実際の経験に、配合率などの数字を自社の実績値に置き換える</div>"}, {"id": "Ⅲ-C", "kind": "選択Ⅲ", "title": "[気候] 産業の脱炭素化と水素・CCS", "q": "<p>2024年5月に水素社会推進法とCCS事業法が成立し、排出削減が難しい産業（製鉄・化学・セメントなど）の脱炭素化に向けて、低炭素水素等の供給とCO2の回収・貯留の事業環境が整備されつつある。<br>(1) 排出削減が難しい産業の脱炭素化を地域で進めるに当たり、あなたの選択科目に関わる技術者としての立場で多面的な観点から課題を抽出し、その内容を観点とともに示せ。<br>(2)(3) Ⅲ-Aと同じ。</p>", "sk": "<div class=\"rl l0\">(1) 課題</div><div class=\"rl l1\">① コストの観点：低炭素水素と既存燃料の価格差。</div><div class=\"rl l1\">② インフラの観点：水素・CO2の輸送網と貯留適地。</div><div class=\"rl l1\">③ 安全・社会受容の観点：水素の爆発・CO2の漏洩への不安。</div><div class=\"rl l1\">④ 制度の観点：CO2の排出削減としての計上ルール。</div><div class=\"rl l0\">(2) 最重要＝①</div><div class=\"rl l1\">解決策1：価格差に着目した支援（水素社会推進法の支援制度）の活用。</div><div class=\"rl l1\">解決策2：需要の集積。コンビナートで複数の事業者が共同利用し、単価を下げる（拠点整備）。</div><div class=\"rl l1\">解決策3：排出量取引（GX-ETS）による炭素価格で、相対的な価格差を縮める。</div><div class=\"rl l0\">(3) リスク：CO2の貯留後の長期の漏洩監視 → モニタリング義務と、事業者の責任の移転時期の明確化。リスク：既存燃料の固定化（ロックイン）→ 段階的な目標と見直し。</div>", "ans": "<p>はじめに<br>私は環境保全計画を専門とし、A市で食品加工工場の脱炭素化の計画づくりを担当する技術者の立場である。当市には、でん粉・乳製品・砂糖の工場があり、蒸気をつくる重油ボイラーと、原料の乾燥・煮詰めの高温の熱が、排出の大半を占める。電化しにくい高温熱が、当市での排出削減が難しい領域である。水素社会推進法とCCS事業法（2024年5月成立）を使う前提で述べる。</p><p>(1) 排出削減が難しい産業の脱炭素化を地域で進めるに当たっての課題<br>1) コストの観点：低炭素水素等はまだコストが高く、既存の燃料との間に大きな価格差がある。価格差のまま投資すると、工場の収益を圧迫する。<br>2) インフラの観点：水素やCO2を運ぶ導管・港湾と、CO2の貯留に適した場所が地域にない。単独の工場では整備できず、貯留は道内の海域などへ運ぶ必要がある。<br>3) 安全・社会受容の観点：水素の爆発やCO2の漏えいに、住民や従業員が不安を持つ。不安が解消されないと、立地や輸送の合意が得られず、事業が進まない。<br>4) 制度の観点：水素等の製造時の排出（炭素集約度）やCO2の貯留量を、排出削減としてどう計上するかのルールが整備の途上にある。計上が不明確では、投資の効果を経営層に示せない。</p><p>(2) 最も重要な課題と複数の解決策<br>最も重要な課題は1)コストの観点である。理由は、価格差が解消されなければ事業者は投資を決められず、インフラや制度が整っても使われないためである。<br>解決策は、支援・集積・価格の3つの性質で組み合わせる。<br>1) 支援：水素社会推進法の計画認定を使う。供給事業者と利用事業者が共同の計画を作り、主務大臣の認定を受けると、JOGMECが既存燃料との価格差に着目した助成を行う。助成の交付はJOGMECが行い、価格差支援には供給と利用の両事業者の連名の計画が要る。そこで、当市の工場と水素の供給事業者が、早い段階から共同の計画を整える。供給が一定期間内に始まり継続することが認定の要件であるため、供給側の見通しの確認が計画の出発点になる。<br>2) 集積：需要を集める。市内の複数の工場が水素の受け入れ設備を共同で使い、拠点整備の支援を受ける。需要が集まれば、供給の単価が下がり、導管や貯蔵の整備費も分担できる。港湾法や高圧ガス保安法の特例も、手続の短縮に使う。<br>3) 価格：将来の既存燃料の相対価格を投資判断に織り込む。2026年度に始まる排出量取引と、2028年度から徴収される化石燃料賦課金により、重油などの化石燃料に炭素のコストが加わる。移行の時期と価格水準の見通しを社内で共有し、早く取り組むほど将来の負担が軽くなると経営層に示す。</p><p>(3) 前問(2)のすべての解決策を実行しても新たに生じうるリスクと対策<br>1) リスク：CO2を貯留した後の長期の漏えいと、監視費用の確保。<br>対策：CCS事業法は、貯留開始後の温度・圧力等の監視と報告を貯留事業者に義務づけ、損害には貯留事業者が無過失責任を負う。注入終了後の管理は、拠出金を納めた貯留事業者に代わってJOGMECに移る。当社はこれらの制度の範囲を確認した上で貯留事業者を選び、貯留事業者との契約に、監視の頻度と結果の報告を盛り込む。<br>2) リスク：水素やCCSへの投資で既存の化石燃料の設備が固定化し、より削減効果の高い電化・省エネが遅れる（ロックイン）。<br>対策：段階的な目標を置き、電化できる低温の熱は先にヒートポンプ等へ切り替える。水素とCCSは高温の熱だけに使い、5年ごとに見直す。こうして、ロックインを避けながら、削減量を段階的に積み上げる。<br>3) リスク：水素の取り扱いの事故。<br>対策：高圧ガス保安法に基づく保安の基準に従うとともに、従業員の教育と、地域住民への説明会を計画段階から開く。</p><p>排出削減の難しい産業の脱炭素化は、一つの工場では完結しない。当市の事業者が需要を束ね、国の支援の仕組みを使いこなす調整役を、技術者として担う。</p><p>以上</p>", "memo": "<div class=\"rl l0\">字数：1,611字（空白・改行を除く。上限1,800字）</div><div class=\"rl l0\">答案上の設定・推論：</div><div class=\"rl l1\">A市の食品加工工場（でん粉・乳製品・砂糖）は想定問題の架空設定。高温の熱（重油ボイラー・乾燥・煮詰め）が排出の大半という設定は答案上の想定で、実在の統計ではない。製鉄・化学・セメントではなく地域の産業に合わせて立場を設定した</div><div class=\"rl l1\">コストを最重要とする理由は骨子どおり（推論）</div><div class=\"rl l1\">導管・港湾・貯留適地が地域にない、貯留は道内の海域などへ運ぶ必要がある（道内の苫小牧沖が2025年2月に特定区域に指定されたことは、ii1/03にあるが答案には書いていない）、水素の爆発・CO2漏えいの不安は一般的な知見（定性）</div><div class=\"rl l1\">排出量取引と賦課金で化石燃料の相対価格が上がる、という説明は制度趣旨からの推論。A市の工場が排出量取引の対象事業者かは不明で、答案では対象とは書いていない（対象は直近3年度平均のCO2排出量が10万トン以上の事業者）</div><div class=\"rl l1\">当社が貯留事業者を選ぶ・契約に監視の頻度を盛り込む、は答案上の提案。実際は排出事業者が貯留事業者と結ぶ契約の内容として検討する</div><div class=\"rl l1\">ヒートポンプで低温熱を先に切り替え、水素とCCSは高温の熱に限る、5年ごとの見直し、は一般的な技術判断に基づく提案</div><div class=\"rl l1\">高圧ガス保安法の保安基準、従業員の教育と住民説明会は一般的な実務の提案</div><div class=\"rl l1\">水素の利用が高温熱に向く、という前提は一般的な技術常識。ボイラーへの水素混焼の技術的な成立性は、実際に書くときは確認が必要</div><div class=\"rl l0\">書き方のポイント：</div><div class=\"rl l1\">製鉄・化学・セメントがない自分の地域に合わせ、立場を絞って現実的な課題設定にした（ガイド§5 コツ「立場を絞ると具体的になる」）</div><div class=\"rl l1\">解決策を支援・集積・価格と性質を変え、法の仕組みを「誰が何を担うか」まで書いた（ガイド§2 解決策の注意）</div><div class=\"rl l1\">(3)のロックインのように、(2)の解決策そのものが生む副作用を挙げた（設問(3)の「すべて実行しても」への直接の回答）</div><div class=\"rl l0\">自分で書くときの差し替え候補：A市の産業を自分の担当する工場・業種に、熱需要と排出量の数字を自分の実績値に、水素・CCSの関わり方を業務で検討した実例に置き換える</div>"}]};

let PARTIAL = false;        // 途中で「ここまでで採点する」を押した回（解いた問題だけで採点し、残りは採点に含めない）
/* 履歴の「解く」から始めた回は、ホームではなく履歴に戻れるようにする */
let FROM_HIST = false;
function goBack() {
  if (!FROM_HIST) { goHome(); return; }
  FROM_HIST = false;
  if (Q.length > 0 && i < Q.length) saveSession();
  selectTab("hist");
}
function inRetry() { return RETRY_FROM >= 0 && i >= RETRY_FROM; }
function origCount() { return RETRY_FROM >= 0 ? RETRY_FROM : Q.length; }
function wrongOriginals() {
  const out = [];
  for (let k = 0; k < origCount(); k++) if (answers[k] && !answers[k].hit) out.push(Q[k]);
  return out;
}
/* 本番の過去問を通しで解いた回（専門・基礎）では、選ばなかった問題も「もう一度」に入れる。問題番号の順 */
function retryOriginals() {
  const ex = examRun(), sk = !!ex && ex.kind !== "適性";
  const out = [];
  for (let k = 0; k < origCount(); k++) if (answers[k] ? !answers[k].hit : sk) out.push(Q[k]);
  return out;
}
/* 「もう一度」の k 問目が、最初の回で選ばなかった（答えていない）問題か */
function retryWasSkipped(k) {
  if (RETRY_FROM < 0 || k < RETRY_FROM) return false;
  for (let j = 0; j < RETRY_FROM; j++) if (Q[j] === Q[k]) return !answers[j];
  return false;
}
function appendRetries() {
  if (RETRY_FROM >= 0) return;
  const w = retryOriginals();
  if (!w.length) return;
  RETRY_FROM = Q.length;
  w.forEach(function (q) { Q.push(q); });
}

function shuffle(n, seed) {
  // 決定論的シャッフル（問題ごとに選択肢の並びを変える）
  // 掛け算は Math.imul で32bitに収める。普通の * だと2^53を超えて下位ビットが消え、
  // 4択の正答がすべて④に固定されていた（2026-09-25 修正）
  const idx = [...Array(n).keys()];
  for (let k = n - 1; k > 0; k--) {
    seed = (Math.imul(seed, 1103515245) + 12345) >>> 0;
    const j = Math.floor(seed / 4294967296 * (k + 1));
    [idx[k], idx[j]] = [idx[j], idx[k]];
  }
  return idx;
}

function render() {
  AT_HOME = false;
  setQuizChrome(true);
  document.body.classList.remove("home-mode");
  const hb = document.getElementById("homeBottom");
  if (hb) hb.innerHTML = "";
  if (i >= Q.length) return renderResult();
  const q = Q[i];
  let seed = 0;
  for (let k = 0; k < q.q.length; k++) seed = (seed * 31 + q.q.charCodeAt(k)) & 0x7fffffff;
  // 「〜の数はどれか」の選択肢（2個・0個…）は並べ替えずに小さい順に出す（スマホで探しやすく）
  const isCount = q.c.every(function (c) { return /^\s*[0-9０-９]+\s*(個|つ)?\s*$/.test(c); }) &&
    (q.c.some(function (c) { return /(個|つ)\s*$/.test(c); }) || /の数/.test(q.q.split("<br>")[0]));
  const isPast = /^(過去問|○×) /.test(q.f || "") || q.keep === true;   // 暗記カードの「思い出せた／思い出せなかった」も順番固定   // 取り込んだ本番の過去問は原本の①〜⑤の順のまま（正答番号と合わせる）
  const order = isPast ? q.c.map(function (_, k) { return k; }) : isCount
    ? q.c.map(function (_, k) { return k; }).sort(function (a, b) { return parseInt(q.c[a].replace(/[０-９]/g, function (d) { return "０１２３４５６７８９".indexOf(d); }), 10) - parseInt(q.c[b].replace(/[０-９]/g, function (d) { return "０１２３４５６７８９".indexOf(d); }), 10); })
    : shuffle(q.c.length, seed);
  const prev = answers[i];
  answered = !!prev;

  elField.textContent = q.f;
  elCount.textContent = inRetry() ? "もう一度 " + (i - RETRY_FROM + 1) + " / " + (Q.length - RETRY_FROM) : (i + 1) + " / " + origCount();
  elScore.innerHTML = "正解 <b>" + correct + "</b>";
  elBar.style.width = (i / Q.length * 100) + "%";

  const card = document.createElement("div");
  card.className = "card";
  const h = histOf(q);
  let badge = '';
  if (h) {
    badge = '<span class="hist">これまで ' + h.n + '回中 ' + h.ok + '回正解</span>';
    if (h.last === 0) badge += '<span class="flagmark">前回まちがえた</span>';
    else badge += '<span class="mst m' + mastery(q) + '">' + MASTERY[mastery(q)] + '</span>';
  }
  const bm = isBookmarked(q);
  card.innerHTML =
    '<div class="qmeta"><span class="qn">Q' + (i + 1) + '</span>' + badge +
      '<span class="qtools">' +
        '<button type="button" class="qtool" id="bmTog" aria-pressed="' + bm + '">' + bmLabel(bm) + '</button>' +
        '<button type="button" class="qtool" id="memoTog" aria-expanded="false" aria-controls="memoBox"></button>' +
      '</span></div>' +
    whyChips(whyOf(q), q) +
    '<p class="qt"></p><div class="qimg" hidden></div><p class="qh"></p><div class="choices"></div>' +
    '<div class="memo" id="memoBox" hidden>' +
      '<label for="memoTa">メモ（この端末に自動で保存されます）</label>' +
      '<textarea id="memoTa" rows="3" placeholder="覚え方、間違えた理由など"></textarea>' +
      '<div class="saved" aria-live="polite"></div>' +
    '</div>';
  renderStatements(card, q);
  if (q.hasImg) {
    const box = card.querySelector(".qimg");
    IMGDB.get(imgKey(q)).then(function (src) {
      if (!src || !box.isConnected) return;
      const im = document.createElement("img");
      im.src = src; im.alt = "問題の図（原本より）";
      im.addEventListener("click", function () { box.classList.toggle("zoom"); });
      box.appendChild(im); box.hidden = false;
    });
  }
  card.querySelector(".qh").textContent = q.h;
  wireNoteTools(card, q);

  const box = card.querySelector(".choices");
  order.forEach((origIdx, pos) => {
    const b = document.createElement("button");
    b.className = "ch";
    b.type = "button";
    b.innerHTML = '<span class="key">' + LETTERS[pos] + '</span><span></span>';
    setMxText(b.lastChild, q.c[origIdx]);
    b.dataset.orig = origIdx;
    b.addEventListener("click", () => choose(card, b, origIdx));
    box.appendChild(b);
  });
  // 1つも消去できないときだけ使う。当てずっぽうの正解で「覚えた」扱いにならないよう、不正解として記録する
  const dk = document.createElement("button");
  dk.className = "dk";
  dk.type = "button";
  dk.textContent = "わからない";
  dk.addEventListener("click", () => choose(card, dk, -1));
  box.appendChild(dk);

  stage.replaceChildren(card);

  if (prev) {
    // 解答済みの問題に戻ってきた場合は、そのときの状態を復元する
    const btn = prev.pick === -1 ? card.querySelector(".dk") : Array.prototype.find.call(card.querySelectorAll(".ch"),
      b => Number(b.dataset.orig) === prev.pick);
    showVerdict(card, btn, prev.hit, false);
  } else {
    renderNav(card);
  }
  window.scrollTo({ top: 0, behavior: "instant" });
}

/* (ア)〜(オ) の記述を並べる問題は、各記述に ○／× の印を付けられる行に分け、○の数をその場で数える */
function renderStatements(card, q) {
  const qt = card.querySelector(".qt");
  // 1行に「(ア) …　(イ) …」と複数の記述が並んでいる場合も、記述ごとの行に分ける
  const parts = [].concat.apply([], q.q.split("<br>").map(function (l) {
    return /^\s*[（(][ア-コ][）)]/.test(l) ? l.split(/[\s　]+(?=[（(][ア-コ][）)])/) : [l];
  }));
  const isSt = parts.map(function (l) { return /^\s*[（(][ア-コ][）)]/.test(l); });
  if (isSt.filter(Boolean).length < 2) { setMxText(qt, q.q.replace(/<br>/g, "\n")); return; }
  setMxText(qt, parts.filter(function (_, k) { return !isSt[k]; }).join("\n"));
  const box = document.createElement("div");
  box.className = "stl";
  const tally = document.createElement("div");
  tally.className = "sttally";
  const marks = [];
  function upd() {
    const o = marks.filter(function (m) { return m === "○"; }).length, x = marks.filter(function (m) { return m === "×"; }).length;
    tally.textContent = "○ " + o + "個　× " + x + "個　未 " + (marks.length - o - x) + "個";
  }
  parts.forEach(function (l, k) {
    if (!isSt[k]) return;
    const idx = marks.push("") - 1;
    const row = document.createElement("div");
    row.className = "strow";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "stm";
    b.setAttribute("aria-label", "この記述の判定（タップで ○→×→未）");
    b.textContent = "・";
    b.addEventListener("click", function () {
      marks[idx] = marks[idx] === "" ? "○" : marks[idx] === "○" ? "×" : "";
      b.textContent = marks[idx] || "・";
      b.className = "stm" + (marks[idx] === "○" ? " o" : marks[idx] === "×" ? " x" : "");
      upd();
    });
    const t = document.createElement("span");
    t.className = "stt";
    t.textContent = l.trim();
    row.appendChild(b); row.appendChild(t);
    box.appendChild(row);
  });
  upd();
  box.appendChild(tally);
  qt.insertAdjacentElement("afterend", box);
}

/* 前へ／次へのナビゲーション。解答前でも「前へ」で戻れる */
/* 解答前も解答後も「← 前の問題／ホーム／次の問題 →」を同じ位置に出す */
/* 解答前は「とばす」扱い（控えめな見た目・Enterでは押されない）、解答後は通常の「次へ」 */
function navHtml(answeredNow) {
  let label = i + 1 < Q.length ? "次の問題 →" : "結果を見る";
  const ex = examRun();
  if (!answeredNow && ex && ex.kind !== "適性" && !inRetry() && i + 1 < Q.length) label = "この問題は選ばない →";
  if (selFull()) label = "結果を見る";
  return selCountHtml() + '<div class="navrow one">' +
      (answeredNow
        ? '<button class="btn" id="next">' + label + '</button>'
        : '<button class="btn ghost" id="skip">' + label + '</button>') +
    '</div>' +
    '<div class="navrow two">' +
      '<button class="btn ghost" id="prev"' + (i > 0 ? '' : ' disabled') + '>← 前の問題</button>' +
      '<button class="btn ghost" id="home">' + (FROM_HIST ? "← 履歴に戻る" : "ホーム") + '</button>' +
    '</div>' +
    // 通しで解く回（模試）以外は、途中でやめても解いた分だけで採点できる。解答は1問ごとに記録済みなので復習にも入っている
    (!ex && !inRetry() && log.length > 0 && i + 1 < Q.length
      ? '<div class="navrow one"><button class="btn ghost" id="stop">ここまでで採点する（解いた ' + log.length + ' 問）</button></div>' : '');
}
function wireNav(el) {
  const st = el.querySelector("#stop");
  if (st) st.addEventListener("click", function () { PARTIAL = true; i = Q.length; saveSession(); render(); });
  el.querySelector("#prev").addEventListener("click", goPrev);
  el.querySelector("#home").addEventListener("click", goBack);
  const nb = el.querySelector("#next");
  if (nb) nb.addEventListener("click", goNext);
  const sk = el.querySelector("#skip");
  if (sk) sk.addEventListener("click", goNext);
  return nb;
}
function renderNav(card) {
  const old = card.querySelector(".nav");
  if (old) old.remove();
  const nav = document.createElement("div");
  nav.className = "qnav nav";
  nav.innerHTML = navHtml(false);
  card.insertBefore(nav, card.querySelector(".memo"));
  wireNav(nav);
}
function goPrev() { if (i > 0) { i--; saveSession(); render(); } }
/* 本番の過去問を通しで解く回で、選ぶ数（専門25問・基礎は各群3問）を満たしたか。満たしたら次へで結果画面に進む */
function selFull() {
  const ex = examRun();
  if (!ex || ex.kind === "適性" || inRetry()) return false;
  const n = origCount();
  if (ex.kind === "専門") { let c = 0; for (let k = 0; k < n; k++) if (answers[k]) c++; return c >= 25; }
  const g = {};
  for (let k = 0; k < n; k++) if (answers[k]) { const x = kisoGroup(Q[k]); g[x] = (g[x] || 0) + 1; }
  return ["1", "2", "3", "4", "5"].every(x => (g[x] || 0) >= 3);
}
function goNext() { if (selFull()) i = Q.length; else i++; saveSession(); render(); }
/* 科目が resultJudge を持たないときの結果コメント（正答率の下限ごと） */
const DEFAULT_JUDGE = [
  { min: 90, text: "仕上がっています。間違えた問題だけ見直して、定着させてください。" },
  { min: 70, text: "合格ライン（50%）は超えています。間違えた問題だけ回し直して余裕を広げてください。" },
  { min: 50, text: "曖昧なところが残っています。解説を読み直してから、もう一度解いてください。" },
  { min: 0,  text: "まず解説を読んで、正解の根拠を確認してから解き直しましょう。" }
];
/* 本番の過去問を1年度まるごと解いている回か（専門35問・基礎30問・適性15問）。違えば null */
function examRun() {
  const n = origCount();
  const m = /^【(R\S+) (専門|基礎|適性) /.exec((Q[0] && Q[0].q) || "");
  if (!m || n !== { 専門: 35, 基礎: 30, 適性: 15 }[m[2]]) return null;
  const head = "【" + m[1] + " " + m[2] + " ";
  for (let k = 0; k < n; k++) if ((Q[k].q || "").indexOf(head) !== 0) return null;
  return { kind: m[2], year: m[1] };
}
function kisoGroup(q) { const m = /Ⅰ-(\d)-/.exec((q && q.q) || ""); return m ? m[1] : ""; }
/* 解いている途中の表示：選んで解く科目（専門25問・基礎は各群3問）では今いくつ選んだか、どの回でも飛ばした問題の数 */
function selCountHtml() {
  if (inRetry()) return "";
  const n = origCount();
  let skip = 0;
  for (let k = 0; k < Math.min(i, n); k++) if (!answers[k]) skip++;
  const ex = examRun();
  if (!ex || ex.kind === "適性") return skip ? '<p class="selcnt">とばした問題 <b>' + skip + '</b>問（結果画面から解けます）</p>' : "";
  // 専門は35問中10問、基礎は各群6問中3問まで選ばずに飛ばせる
  let c = 0, cap = 25, sk = skip, skCap = 10, what = "選んで解いた問題", skWhat = "選ばなかった";
  if (ex.kind === "基礎") {
    const g = kisoGroup(Q[i]); cap = 3; skCap = 3; sk = 0; what = g + "群で選んだ"; skWhat = "選ばなかった";
    for (let k = 0; k < n; k++) if (kisoGroup(Q[k]) === g) { if (answers[k]) c++; else if (k < i) sk++; }
  } else { for (let k = 0; k < n; k++) if (answers[k]) c++; }
  return '<p class="selcnt' + (c > cap || sk > skCap ? ' over' : '') + '">' + what + ' <b>' + c + '</b> / ' + cap + '問' +
    '　' + skWhat + ' <b>' + sk + '</b> / ' + skCap + '問' +
    (c > cap ? '（本番では' + cap + '問までしか解答できません）' : sk > skCap ? '（飛ばしすぎで' + cap + '問に届きません）' : '') + '</p>';
}
/* 本番の過去問を1年度まるごと解いたときの点数。本番の選び方・合格基準（各科目50%）で数える。
   全問に答えた回は「正解した問題を選べた」前提、選ばない問題があった回は選んだ問題だけで数える */
function pastExamScore(log, N) {
  const ex = examRun();
  if (!ex || !log.length) return null;
  const ok = log.filter(r => r.hit).length, all = log.length === N;
  if (ex.kind === "適性") return { kind: ex.kind, got: ok, of: 15, need: 8, all: all,
    how: "15問すべて解答し8問以上で合格" + (all ? "" : "（答えていない" + (N - log.length) + "問は0点）") };
  if (ex.kind === "専門") {
    if (all) return { kind: ex.kind, got: Math.min(ok, 25), of: 25, need: 13, all: true, how: "35問から25問を選び13問以上で合格。正解した問題を選べた前提で数えています" };
    if (log.length > 25) return { kind: ex.kind, over: '<b>25問を超えて解答しています（' + log.length + '問）。</b>本番では25問までしか解答できません。' };
    return { kind: ex.kind, got: ok, of: 25, need: 13, all: false, how: "選んだ" + log.length + "問で採点。25問を選び13問以上で合格" + (log.length < 25 ? "（あと" + (25 - log.length) + "問選べました）" : "") };
  }
  const g = {};
  log.forEach(r => { const k = kisoGroup(r); g[k] = g[k] || { n: 0, ok: 0 }; g[k].n++; if (r.hit) g[k].ok++; });
  if (all) return { kind: ex.kind, got: Object.keys(g).reduce((t, k) => t + Math.min(3, g[k].ok), 0), of: 15, need: 8, all: true, how: "各群6問から3問を選ぶ15問中8問以上で合格。各群で正解した問題を3問まで数えています" };
  const over = Object.keys(g).filter(k => g[k].n > 3).sort();
  if (over.length) return { kind: ex.kind, over: '<b>' + over.map(k => k + "群").join("・") + 'で3問を超えて解答しています。</b>本番では各群3問までしか解答できません。' };
  const short = ["1", "2", "3", "4", "5"].filter(k => !g[k] || g[k].n < 3);
  return { kind: ex.kind, got: ok, of: 15, need: 8, all: false, how: "選んだ問題で採点。各群3問・計15問中8問以上で合格" + (short.length ? "（" + short.map(k => k + "群").join("・") + "は3問に足りていません）" : "") };
}
function pastExamVerdict(log, N) {
  const r = pastExamScore(log, N);
  if (!r) return "";
  if (r.over) return r.over;
  return '<b>本番の採点なら' + (r.got >= r.need ? '合格' : '不合格') + '（' + r.got + '/' + r.of + '点）</b>　' + r.how + '。';
}
/* 過去問を通しで解いた回の点数の記録（年度ごと）。おまかせ・復習などで同じ問題を解いても、ここには入らない */
const MKEY = SPFX + "mock_v1";
let MOCKS = {};
try { MOCKS = JSON.parse(localStorage.getItem(MKEY) || "{}") || {}; } catch (e) { MOCKS = {}; }
/* 記録を始める前（2026-10-17 より前）に通しで解いた分を、1問ごとの解答履歴から一度だけ復元する。
   各問の最初の解答が確実に分かる年度（全問が「1回だけ解いた」「毎回正解」「毎回不正解」のどれか）だけ復元し、
   1問でも最初の正誤が分からない年度は復元しない（推測の点数を出さないため） */
function restoreOldMocks() {
  const MIG = SPFX + "mock_restored_v2";   // v2: 記録の不具合で入らなかった 2026-10-17 の回を拾うためにもう一度だけ復元する
  try { if (localStorage.getItem(MIG)) return; } catch (e) { return; }
  const byY = {};
  importedQuestions().forEach(function (q) { (byY[q.f] = byY[q.f] || []).push(q); });
  Object.keys(byY).forEach(function (k) {
    if (MOCKS[k] && MOCKS[k].length) return;
    const kind = k.split(" ")[1], list = byY[k];
    if ({ 専門: 35, 基礎: 30, 適性: 15 }[kind] !== list.length) return;
    let ts = 0; const first = [];
    for (let j = 0; j < list.length; j++) {
      const h = histOf(list[j]);
      if (!h || !h.n) return;
      if (h.ok === h.n) first.push(true);
      else if (h.ok === 0) first.push(false);
      else return;
      if (typeof h.ts === "number") ts = Math.max(ts, h.ts);
    }
    let got, of = kind === "専門" ? 25 : 15, need = kind === "専門" ? 13 : 8;
    if (kind === "基礎") {
      const g = {};
      list.forEach(function (q, j) { const gk = kisoGroup(q); g[gk] = (g[gk] || 0) + (first[j] ? 1 : 0); });
      got = Object.keys(g).reduce(function (t, gk) { return t + Math.min(3, g[gk]); }, 0);
    } else {
      got = first.filter(Boolean).length;
      if (kind === "専門") got = Math.min(got, 25);
    }
    MOCKS[k] = [{ t: ts || Date.now(), got: got, of: of, pass: got >= need, n: list.length, all: true, restored: true }];
  });
  try { localStorage.setItem(MKEY, JSON.stringify(MOCKS)); localStorage.setItem(MIG, "1"); } catch (e) {}
}
function saveMockScore(log, N) {
  const r = pastExamScore(log, N);
  if (!r) return;
  const key = Q[0].f;
  if (r.over) (MOCKS[key] = MOCKS[key] || []).push({ t: Date.now(), over: true, n: log.length, ok: log.filter(function (x) { return x.hit; }).length });
  else (MOCKS[key] = MOCKS[key] || []).push({ t: Date.now(), got: r.got, of: r.of, pass: r.got >= r.need, n: log.length, all: r.all,

/* ---------- 合格までの道のり（本番日と期日の目安） ---------- */

function pad2(x) { return String(x).padStart(2, "0"); }

/* 行列の表記 [[1,0,0],[a,1,0],[b,c,1]] を、本番の問題用紙と同じ「丸かっこで囲んだ縦並び」で表示する（2026-11-08）。
   過去問の基礎（Ⅰ-3-1 の逆行列・ヤコビ行列など）だけに出てくる。2行以上の [[…],[…]] だけを行列とみなす */
function mxRe() { return /\[(\[[^\[\]]*\](?:\s*,\s*\[[^\[\]]*\])+)\]/g; }
function mxRows(inner) {
  return inner.match(/\[[^\[\]]*\]/g).map(function (r) { return r.slice(1, -1).split(",").map(function (s) { return s.trim().replace(/-/g, "−"); }); });
}
/* セルの「-」は問題用紙と同じ「−」（マイナス記号）にする。
   文字として表示する場所（問題文・選択肢）用。セルも textContent で入れる */
function setMxText(el, text) {
  text = String(text == null ? "" : text);
  if (!mxRe().test(text)) { el.textContent = text; return; }
  el.textContent = "";
  let last = 0;
  text.replace(mxRe(), function (m, inner, off) {
    if (off > last) el.appendChild(document.createTextNode(text.slice(last, off)));
    const wrap = document.createElement("span"); wrap.className = "mx";
    const body = document.createElement("span"); body.className = "mxb";
    mxRows(inner).forEach(function (r) {
      const row = document.createElement("span"); row.className = "mxr";
      r.forEach(function (c) { const cell = document.createElement("span"); cell.className = "mxc"; cell.textContent = c; row.appendChild(cell); });
      body.appendChild(row);
    });
    wrap.appendChild(body); el.appendChild(wrap);
    last = off + m.length;
    return m;
  });
  if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
}
/* HTMLとして組み立てる場所（解説）用 */
function mxHtml(html) {
  return String(html).replace(mxRe(), function (m, inner) {
    return '<span class="mx"><span class="mxb">' + mxRows(inner).map(function (r) {
      return '<span class="mxr">' + r.map(function (c) { return '<span class="mxc">' + c + '</span>'; }).join("") + '</span>';
    }).join("") + '</span></span>';
  });
}

/* 専門外の人向けの「やさしい解説」。問題文をキーに別ファイル（easy.js の EASY_NOTES）から引く */
function easyHtml(q) {
  // 取り込んだ過去問は、解説を取り込みファイルの中（q.e）に持つ（本文を公開しないため）
  const t = ((window.EASY_NOTES && window.EASY_NOTES[q.q]) || q.e || "").replace(/<b>(ひとことで|用語|解き方|考え方|覚え方)<\/b>\s*/g, '<span class="ezh">$1</span>')
    .replace(/<b>今の状況<\/b>\s*/g, '<span class="ezh now">今の状況（過去問の当時から変わったか）</span>')
    // 文中に続けて書かれた手順（②③…）と選択肢ごとの理由（・2番：…）は、文の切れ目で改行して読みやすくする
    .replace(/([。）)])\s*(?=[②-⑳])/g, '$1<br>')
    .replace(/。\s*(?=・[1-5①-⑤]番)/g, '。<br>')
    // (ア)〜(オ)の記述ごとの判定と、最後のまとめ（「正しいのは…」など）も文の切れ目で改行する
    .replace(/。\s*(?=[（(][ア-オ][)）])/g, '。<br>')
    .replace(/。\s*(?=(正しいのは|誤っているのは|不適切なのは|適切なのは|したがって|よって|以上から|以上より))/g, '。<br>');
  return t ? '<div class="easy"><div class="easyh">やさしい解説</div><div class="easyb">' + mxHtml(t) + '</div></div><div class="vnoteh">詳しい解説（出典つき）</div>' : "";
}

function renderResult() {
  clearSession();
  elField.textContent = "結果";
  const N = origCount();
  elCount.textContent = N + " / " + N;

  // 選んで解く科目（専門・基礎）で選ばない問題があった回は、本番と同じく選んだ問題だけを採点する
  const exr = examRun();
  const sel = !!exr && exr.kind !== "適性" && log.length < N;
  const D = sel ? (exr.kind === "専門" ? 25 : 15) : (PARTIAL ? log.length : N);
  if (PARTIAL) elCount.textContent = log.length + " / " + N;
  const pct = Math.round(correct / D * 100);
  const byField = {};
  log.forEach(r => {
    byField[r.f] = byField[r.f] || { n: 0, ok: 0 };
    byField[r.f].n++;
    if (r.hit) byField[r.f].ok++;
  });

  let judge = "";
  (SUBJECT.resultJudge || DEFAULT_JUDGE).some(function (r) { if (pct >= r.min) { judge = r.text; return true; } return false; });
  const exam = pastExamVerdict(log, N);

const DAY = 86400000;
// 連続正解数ごとの、次の復習までの日数。まちがえたら翌日。本番まで約2か月なので最長30日
const SR_DAYS = [1, 2, 4, 7, 14, 30];
const MASTERY = ["未学習", "要復習", "学習中", "定着", "完璧"];
function dayStart(t) { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function srSchedule(h, now) {
  h.ts = now;
  let d = SR_DAYS[Math.min(h.st || 0, SR_DAYS.length - 1)];
  // 本番の2日前までに必ず一度は復習が回るよう、間隔を本番までの残り日数で頭打ちにする
  const left = Math.round((EXAM_DAY - dayStart(now)) / DAY);
  if (left > 2) d = Math.min(d, left - 2);
  h.due = dayStart(now) + d * DAY;
}
/* 解いた日時を持たない古い履歴：まちがえた問題は今日が復習日、正解した問題は今日解いたものとして扱う */
function migrateSR() {
  let changed = false;
  const now = Date.now();
  Object.keys(HIST).forEach(function (k) {
    const h = HIST[k];
    if (typeof h.due === "number") return;
    h.st = h.last === 1 ? (h.ok === h.n ? Math.min(h.ok, 2) : 1) : 0;
    if (h.last === 1) srSchedule(h, now); else { h.ts = now; h.due = dayStart(now); }
    changed = true;
  });
  if (changed) saveHist();
}

function isDue(h, today) { return !!h && typeof h.due === "number" && h.due <= today; }
function dueList() {

/* 習熟度：0未学習 1要復習（直近まちがえた／正答率6割未満） 2学習中 3定着（3回連続正解） 4完璧（5回連続正解） */
function mastery(q) {
  const h = histOf(q);
  if (!h) return 0;
  if (h.last === 0 || h.ok / h.n < 0.6) return 1;
  const st = h.st || 0;
  return st >= 5 ? 4 : st >= 3 ? 3 : 2;

/* 出題の順：①復習日を過ぎた問題（古い順・習熟度の低い順） ②まだ解いていない問題（頻出論点から） ③期限前でも習熟度の低い問題 */
function autoPick(n) {
  const today = dayStart(Date.now());
  const all = autoBase();
  let pick = all.filter(function (q) { return isDue(histOf(q), today); }).sort(function (a, b) {
    return histOf(a).due - histOf(b).due || mastery(a) - mastery(b) || whyOf(b).rank - whyOf(a).rank;
  }).slice(0, n);
  if (pick.length < n) {
    const fresh = [];
    [5, 4, 3, 2, 1].forEach(function (r) {
      fresh.push.apply(fresh, shuffled(all.filter(function (q) { return !histOf(q) && whyOf(q).rank === r; })));
    });
    pick = pick.concat(fresh.slice(0, n - pick.length));
  }
  if (pick.length < n) {
    const ahead = all.filter(function (q) { const h = histOf(q); return h && !isDue(h, today); }).sort(function (a, b) {
      return mastery(a) - mastery(b) || histOf(a).due - histOf(b).due;

const IMGDB = {
  db: null,
  open: function () {
    const self = this;
    return new Promise(function (res, rej) {
      if (self.db) return res(self.db);
      if (!window.indexedDB) return rej(new Error("no idb"));
      const r = indexedDB.open("gq_imgs", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("img"); };
      r.onsuccess = function () { self.db = r.result; res(self.db); };
      r.onerror = function () { rej(r.error); };
    });
  },
  put: function (k, v) {
    return this.open().then(function (db) {
      return new Promise(function (res, rej) {
        const t = db.transaction("img", "readwrite");
        t.objectStore("img").put(v, k);
        t.oncomplete = function () { res(); };
        t.onerror = function () { rej(t.error); };
      });
    });
  },
  get: function (k) {
    return this.open().then(function (db) {
      return new Promise(function (res) {
        const r = db.transaction("img").objectStore("img").get(k);
        r.onsuccess = function () { res(r.result || null); };
        r.onerror = function () { res(null); };
      });
    }).catch(function () { return null; });
  }
};

/* 過去問の記述を1つずつ○×で判定する問題を作る（2026-11-22）。

   対象は「適切／不適切なものはどれか」の記述問題だけ（組合せ・数・並べ替え・計算は除く） */
const CIRC = ["①", "②", "③", "④", "⑤"];
function oxItems(list) {
  const out = [];
  list.forEach(function (q) {
    const tag = (q.q.match(/^【([^】]*)】/) || [])[1];
    if (!tag || !Array.isArray(q.c) || q.c.length < 4 || typeof q.a !== "number") return;
    const stem = q.q.replace(/^【[^】]*】/, "").split("<br>")[0];
    if (!/(適切|妥当|正しい|誤っている|誤り)(な|の)?もの/.test(stem)) return;
    if (/組合せ|組み合わせ|の数|順|並べ|値|式|どれだけ|いくら|何/.test(stem)) return;
    if (!q.c.every(function (c) { return String(c).length >= 15 && !/→|^[○×\s　]+$/.test(c); })) return;
    const wrongAsked = /不適切|妥当でない|誤っている|誤り/.test(stem);
    let topic = stem.replace(/(次の|以下の)?(記述|説明)?のうち.*$/, "").replace(/に関する$/, "").trim();
    if (topic.length > 50) topic = "…" + topic.slice(-45);   // 長い前置き（規格名など）は削り、末尾のテーマを残す
    const grp = (q.f || "").split(" ")[1] || "";
    const year = (q.f || "").split(" ")[2] || "";
    q.c.forEach(function (c, k) {
      const ok = wrongAsked ? k !== q.a : k === q.a;
      const item = {
        f: "○× " + grp + " " + year,
        q: "【○× " + tag + " " + CIRC[k] + "】" + (topic ? topic + "について" : "") + "<br>" + c + "<br>この記述は正しいか。",
        c: ["正しい（○）", "誤り（×）"],
        a: ok ? 0 : 1,
        n: "<b>この記述は" + (ok ? "正しい（○）" : "誤り（×）") + "</b>。元の問題は【" + tag + "】（" + (wrongAsked ? "不適切" : "適切") + "なものを選ぶ問題・正答は" + CIRC[q.a] + "）。<br>" + (q.n || ""),
        e: q.e || ""

      if (q.img) item.img = q.img;

    });
  });

}

let LIMIT = 0;              // 0 = 全問

  }

/* その場でシャッフル（Fisher-Yates）。同じ並びで覚えてしまうのを防ぐ */
function shuffled(list) {
  const a = list.slice();
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    const t = a[k]; a[k] = a[j]; a[j] = t;
  }
  return a;
}
/* 絞り込むときは「未回答 → 直近誤答 → 正答率が低い順」で拾い、拾ったあとに順番を混ぜる */
function pickQuestions(list) {
  if (!LIMIT || list.length <= LIMIT) return shuffled(list);
  const base = shuffled(list);                     // 同点のときの並びも毎回変える
  const scored = base.map(function (q, idx) {
    const h = histOf(q);
    let s;
    if (!h) s = 0;
    else if (h.last === 0) s = 1;
    else s = 2 + (h.ok / h.n);
    return { q: q, s: s, idx: idx };
  });
  // 同じ優先度（未回答どうし等）なら、出題実績のある論点から拾う
  scored.sort(function (a, b) { return a.s - b.s || whyOf(b.q).rank - whyOf(a.q).rank || a.idx - b.idx; });
  return shuffled(scored.slice(0, LIMIT).map(function (x) { return x.q; }));
}
function rebuild() {
  const picked = pickQuestions(baseList());
  if (!picked.length) return false;
  Q.length = 0; RETRY_FROM = -1; picked.forEach(function (q) { Q.push(q); });
  i = 0; correct = 0; log.length = 0; RESULT_SAVED = false; PARTIAL = false; answers.length = 0;

  return '<div class="whybox t' + (w.tier >= 2 ? 3 : w.tier) + '"><span class="wh">' +
    (w.tier >= 2 ? '★ 絶対に覚える理由' : w.tier === 1 ? '覚える理由（予想）' : 'この問題の位置づけ') + '</span>' + body + '</div>';
}

function fieldStats() {
  const m = {};
  const totalQ = SETS.all.length;
  SETS.all.forEach(function (q) {
    const h = histOf(q);
    if (!m[q.f]) m[q.f] = { n: 0, ok: 0, q: 0, done: 0 };
    m[q.f].q++;
    if (h) { m[q.f].n += h.n; m[q.f].ok += h.ok; m[q.f].done++; }
  });
  return Object.keys(m).map(function (f) {
    const d = m[f];
    const rate = d.n ? d.ok / d.n : null;
    // 年間出題数の設定がない科目は、収録に占める割合（0〜1）を重みにする
    const w = FIELD_WEIGHTS ? (FIELD_WEIGHTS[f] || 1) : d.q / totalQ;
    return { f: f, rate: rate, n: d.n, done: d.done, total: d.q, weight: w,
             loss: (rate === null || w === 0) ? null : w * (1 - rate) };
  }).sort(function (a, b) {
    if (a.loss === null && b.loss === null) return b.weight - a.weight;
    if (a.loss === null) return 1;
    if (b.loss === null) return -1;
    return b.loss - a.loss;
  });
}
function lossText(loss) { return FIELD_WEIGHTS ? loss.toFixed(1) : (loss * 100).toFixed(1); }
function weightText(r) {
  if (!FIELD_WEIGHTS) return '収録の ' + Math.round(r.weight * 100) + '%';
  return r.weight ? '本試験で年 ' + r.weight + '問前後' : '専門科目とは別の科目';
}
function renderDiagnosis() {
  const fs = fieldStats();
  const scored = fs.filter(function (r) { return r.loss !== null; });
  if (!scored.length) {
    return '<div class="diag"><h3>学習診断</h3><p class="note2">何問か解くと、分野ごとの正答率から' + (FIELD_WEIGHTS ? '「本番で何問落とす計算になるか」' : '「どの分野が全体の正答率を押し下げているか」') + 'を出します。</p></div>';
  }
  let rows = "";
  fs.forEach(function (r, idx) {
    const cls = r.loss === null ? "p3" : (idx === 0 ? "p1" : idx <= 2 ? "p2" : "p3");
    rows += '<div class="drow ' + cls + '">' +
      '<div class="dn">' + r.f + '</div>' +
      '<div class="dv">' + (r.rate === null ? '未着手' : Math.round(r.rate * 100) + '%') + '</div>' +
      '<div class="dloss">' + (r.loss === null ? '—' : '▲' + lossText(r.loss)) + '</div>' +
      '<div class="dsub">' + weightText(r) + ' ／ 収録 ' + r.total + '問中 ' + r.done + '問に解答' +
        (r.n ? '（延べ' + r.n + '回）' : '') + '</div>' +
    '</div>';
  });
  const top = scored.slice(0, 3);
  const totalLoss = scored.reduce(function (a, r) { return a + r.loss; }, 0);
  let rx = '<div class="rx"><b>いまの正答率のままなら、' + (FIELD_WEIGHTS && SUBJECT.diagLoss
    ? SUBJECT.diagLoss.replace("{n}", totalLoss.toFixed(1))
    : '全体の正答率は約' + Math.round((1 - totalLoss) * 100) + '%の見込み</b>') + '。効く順に並べるとこうなります。<ol>';
  top.forEach(function (r) {
    rx += '<li><b>' + r.f + '</b>（正答率' + Math.round(r.rate * 100) + '%・' + (FIELD_WEIGHTS ? '年' + r.weight + '問' : '収録の' + Math.round(r.weight * 100) + '%') + '）— ' +
      (r.rate < 0.5 ? '基礎から。用語の定義と数値をまず1周' :
       r.rate < 0.75 ? '取りこぼしを潰す段階。間違えた問題だけ回す' :
       '仕上がりつつある。維持で十分') + '</li>';
  });
  rx += '</ol></div>';
  return '<div class="diag"><h3>学習診断</h3>' +
    (FIELD_WEIGHTS
      ? '<p class="note2">▲は「本試験でその分野から落とす問題数の見込み」＝ 年間出題数 ×（1 − 正答率）。出題が多い分野ほど、同じ正答率でも損失が大きくなります。</p>'
      : '<p class="note2">▲は「その分野が全体の正答率を押し下げている分（％ポイント）」＝ 収録に占める割合 ×（1 − 正答率）。収録が多い分野ほど、同じ正答率でも影響が大きくなります。</p>') +
    rows + rx +
    '<div class="exp"><button class="btn ghost" id="copyDiag">診断結果をコピー</button>' +
    '<span class="msg" id="copyMsg"></span></div></div>';
}
function diagnosisText() {
  const fs = fieldStats(), L = lifetimeStats();
  let t = "【" + (SUBJECT.shareTitle || "技術士一次試験 学習状況") + "】\n";
  t += "累計 " + L.answers + "回解答／正答率 " + (L.answers ? Math.round(L.correct / L.answers * 100) : 0) + "%／苦手 " + weakList().length + "問\n\n";
  t += FIELD_WEIGHTS ? "分野別（正答率 / 本試験の年間出題数 / 落とす見込み）\n" : "分野別（正答率 / 収録に占める割合 / 全体を押し下げる分）\n";
  fs.forEach(function (r) {

      "（収録" + r.total + "問中" + r.done + "問に解答）\n";

  const miss = SETS.all.filter(function (q) { const h = histOf(q); return h && h.last === 0; });

  return t;
}

function exportStudyData() {
  const nh = Object.keys(HIST).length, nn = Object.keys(NOTES).length;
  if (!nh && !nn) return null;
  const d = { app: "gijutsushi-quiz", kind: "study-data", v: 1,
              exported: new Date().toISOString(), history: HIST, notes: NOTES, mocks: MOCKS, daily: DAILY, examDay: ymd(EXAM_DAY) };
  const t = new Date();
  const pad = function (x) { return String(x).padStart(2, "0"); };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(d)], { type: "application/json" }));
  a.download = "gijutsushi-study-" + t.getFullYear() + pad(t.getMonth() + 1) + pad(t.getDate()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
  return { h: nh, n: nn };
}
function mergeStudyData(d) {
  if (!d || d.app !== "gijutsushi-quiz" || d.kind !== "study-data" ||
      !d.history || typeof d.history !== "object" || !d.notes || typeof d.notes !== "object") {
    return { err: "このアプリの学習データのファイルではありません" };
  }
  let h = 0, n = 0;
  Object.keys(d.history).forEach(function (k) {
    const r = d.history[k];
    if (!r || typeof r.n !== "number" || typeof r.ok !== "number" || r.n < 1 || r.ok < 0 || r.ok > r.n) return;
    const cur = HIST[k];
    // 合算すると同じファイルを2回読んだとき回数が倍になるので、解答回数の多い方を残す
    if (!cur || r.n > cur.n) {
      HIST[k] = { n: r.n, ok: r.ok, last: (r.last === 0 || r.last === 1) ? r.last : null };
      if (typeof r.st === "number" && r.st >= 0) HIST[k].st = r.st;
      if (typeof r.ts === "number") HIST[k].ts = r.ts;
      if (typeof r.due === "number") HIST[k].due = r.due;
      h++;
    }
  });
  Object.keys(d.notes).forEach(function (k) {
    const r = d.notes[k];
    if (!r || typeof r !== "object") return;
    const memo = typeof r.memo === "string" ? r.memo : "";
    const bm = r.bm === true;
    if (!memo && !bm) return;
    const t = typeof r.t === "number" ? r.t : 0;
    const cur = NOTES[k];
    if (!cur || t > (cur.t || 0)) { NOTES[k] = { bm: bm, memo: memo, t: t || Date.now() }; n++; }
  });
  // 過去問を通しで解いた記録：同じ回（解いた日時が同じ）は1回だけ入れる
  if (d.mocks && typeof d.mocks === "object") {
    Object.keys(d.mocks).forEach(function (k) {
      if (!Array.isArray(d.mocks[k])) return;
      const cur = MOCKS[k] = MOCKS[k] || [];
      d.mocks[k].forEach(function (r) {
        if (!r || typeof r.t !== "number" || typeof r.got !== "number" || typeof r.of !== "number") return;
        if (cur.some(function (x) { return x.t === r.t; })) return;
        cur.push({ t: r.t, got: r.got, of: r.of, pass: !!r.pass, n: r.n, all: !!r.all, wrong: Array.isArray(r.wrong) ? r.wrong.filter(function (x) { return typeof x === "string"; }) : undefined, skip: Array.isArray(r.skip) ? r.skip.filter(function (x) { return typeof x === "string"; }) : undefined, restored: !!r.restored });
      });
      cur.sort(function (a, b) { return a.t - b.t; });
    });
    try { localStorage.setItem(MKEY, JSON.stringify(MOCKS)); } catch (e) {}
  }
  // 日ごとの記録：同じ日・同じ分野は、解答数の多い方を残す（同じファイルを2回読んでも倍にならない）
  if (d.daily && typeof d.daily === "object") {
    Object.keys(d.daily).forEach(function (day) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || !d.daily[day] || typeof d.daily[day] !== "object") return;
      Object.keys(d.daily[day]).forEach(function (c) {
        const r = d.daily[day][c];
        if (!Array.isArray(r) || typeof r[0] !== "number" || typeof r[1] !== "number" || r[1] > r[0]) return;
        DAILY[day] = DAILY[day] || {};
        if (!DAILY[day][c] || r[0] > DAILY[day][c][0]) DAILY[day][c] = [r[0], r[1]];
      });
    });
    saveDaily();
  }
  saveHist(); saveNotes();
  migrateSR();   // 復習日を持たない古い形式のファイルにも復習日を付ける
  // 受験日はこの端末が既定日のままのときだけ取り込む（すでに変更済みの設定を上書きしないため）
  let examTaken = false;
  if (typeof d.examDay === "string" && ymd(EXAM_DAY) === ymd(EXAM_DAY_DEFAULT) && setExamDay(d.examDay)) {
    examTaken = true;
  }
  return { h: h, n: n, e: examTaken };
}
