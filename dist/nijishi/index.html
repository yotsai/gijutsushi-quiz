r><b>答え</b>　していない。前議長の辞任を受けた新議長の選出などを行う、組織的・事務的事項の会合<br><br><b>解説</b>　INC5.3（2026年2月7日）は前議長の辞任を受けた新議長（チリ）の選出など、実質的な交渉をしない事務的会合。5.2が条文交渉、5.4が次の交渉<br><br><b>答案に書くなら</b>　INC5.3は条文交渉を行わず、新議長の選出などを行う組織的・事務的事項の会合であり、実質的な交渉はINC5.2と5.4で行う。<br><br><b>関連</b>　INC5.4は2027年3月13〜24日の期間内に開催予定で、場所は未定。<br><br><b>答案での使い方</b>　INC5.2・5.3・5.4の役割を混同しない<br><br>【出典】<a href=\"https://www.env.go.jp/water/inc.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜時期】河川・湖沼マイクロプラスチック調査ガイドラインはいつ策定されたか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　河川版は2021年6月、湖沼を加えた現名称は2023年3月30日。その後改訂され、令和8年4月版が最新<br><br><b>解説</b>　河川版ガイドライン（2021年6月）に湖沼の調査方法を加え、「河川・湖沼」版として2023年3月30日に公開した。知見の集積に応じて見直されるため、版の表記に注意<br><br><b>答案に書くなら</b>　河川・湖沼マイクロプラスチック調査ガイドラインは2023年3月に河川・湖沼版として公開され、その後改訂されて令和8年4月版が最新である。<br><br><b>関連</b>　資料により版の表記が異なる。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで時期と最新版を示す<br><br>【出典】<a href=\"https://www.env.go.jp/water/marine_litter/post_118.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜定義】マイクロプラスチックとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　一般的に5mm未満の微細なプラスチック。海洋プラごみの約8割は陸域発生とされ、河川を経由して流出する<br><br><b>解説</b>　5mm未満は一般的な定義で、調査では1mm以上5mm未満と1mm未満を分ける場合もある。海洋プラごみの約8割は陸域発生とされ、河川が流出経路になる<br><br><b>答案に書くなら</b>　マイクロプラスチックとは一般的に5mm未満の微細なプラスチックであり、海洋プラスチックごみの約8割は陸域から発生し河川を経由して流出するとされる。<br><br><b>関連</b>　個数密度の単位は個/m3、質量濃度はmg/m3。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し（定義）の1文に<br><br>【出典】<a href=\"https://www.env.go.jp/water/marine_litter/post_118.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜制度】マイクロプラスチックに法的基準値はあるか？ガイドラインの位置づけは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　ない。ガイドラインは調査方法の手引きで、結果を基に自治体が関係機関と連携して発生源対策を進める<br><br><b>解説</b>　環境基準・排出基準のような法的基準値はなく、ガイドラインは調査方法を示す手引き。結果を基に自治体が発生源対策を進める<br><br><b>答案に書くなら</b>　マイクロプラスチックに法的基準値はなく、ガイドラインは調査方法の手引きであり、結果を基に自治体が関係機関と連携して発生源対策を進める。<br><br><b>関連</b>　環境省は事業者の自主的な取組の後押しも行う。<br><br><b>答案での使い方</b>　Ⅱ-1の制度の中身。規制ではないと書く<br><br>【出典】<a href=\"https://www.env.go.jp/water/marine_litter/post_118.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜制度】令和4年度の河川調査（一級水系7水系）の結果は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　長径1〜5mmの平均個数密度は0.1〜0.8個/m3。人口密度・市街化率と強い正の相関<br><br><b>解説</b>　令和4年度の調査は一級水系7水系の下流域で、長径1mm以上5mm未満を対象にした。人口が多く市街化が進んだ地域ほど個数密度が高い<br><br><b>答案に書くなら</b>　令和4年度の河川調査では、1〜5mmの平均個数密度は0.1〜0.8個/m3で、人口密度・市街化率と強い正の相関があった。<br><br><b>関連</b>　最高は阿武隈川水系の槻木大橋、最低は留萌川水系と吉野川水系。<br><br><b>答案での使い方</b>　Ⅱ-1の数字。個数密度の単位は個/m3<br><br>【出典】<a href=\"https://www.env.go.jp/content/000220901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜課題】マイクロプラスチックの課題を『技術・科学』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　添加剤や吸着した化学物質が生物・生態系に及ぼす影響の科学的知見が、まだ十分に蓄積されていない<br><br><b>解説</b>　マイクロプラスチックに含まれる添加剤や、表面に吸着する化学物質が生物に与える影響は、まだ科学的に十分わかっていない<br><br><b>答案に書くなら</b>　技術・科学の観点から、課題は添加剤や吸着した化学物質が生物・生態系に及ぼす影響の科学的知見がまだ十分に蓄積されていないことである。<br><br><b>関連</b>　モニタリング手法の国際的な調和も課題。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(1) 科学的知見の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/water/marine_litter/post_118.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜解決策】科学的知見の不足への解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　生物・生態系への影響評価手法の検討と、調和ガイドラインに沿ったデータ収集、AOMIによる国際共有<br><br><b>解説</b>　影響評価手法の検討、調和ガイドラインによる比較可能なデータ収集、国際データベースAOMI（Atlas of Ocean Microplastics）での共有が、知見不足を埋める流れ<br><br><b>答案に書くなら</b>　解決策として、生物・生態系への影響評価手法を検討し、調和ガイドラインに沿ってデータを収集し、AOMIで国際的に共有する。<br><br><b>関連</b>　AOMIは2024年5月に公表されたデータベース。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 調査検討事項の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/water/marine_litter/post_118.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜解決策】事業者との連携の解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　マイクロプラスチック・スマート懇話会で業界団体・事業者と普及啓発を検討し、グッド・プラクティス集で先進事例を発信<br><br><b>解説</b>　発生抑制・流出抑制・回収・代替素材の開発は事業者の取組に依存する面があるため、業界団体・事業者との連携が要る。先進事例の発信で自主的な取組を後押しする<br><br><b>答案に書くなら</b>　解決策として、マイクロプラスチック・スマート懇話会で業界団体・事業者と普及啓発を検討し、グッド・プラクティス集で先進事例を発信する。<br><br><b>関連</b>　グッド・プラクティス集は第3版を2025年4月に公表。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰ(2) 事業者連携の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/water/marine_litter/post_118.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【マイクロプラスチックの実態調査と調査ガイドライン｜注意】マイクロプラスチックの個数密度は他の調査の数値と比べられるか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priC\">優先度 C</span> <small>専門外の保険。何の話かと一番大事な数字だけでよい</small><br><br><b>答え</b>　直接比べられない。調査年度・地点・サイズ範囲（1mm以上5mm未満など）で大きく変わる<br><br><b>解説</b>　個数密度は調査年度・地点・サイズ範囲（1mm以上5mm未満など）で大きく変わる。条件が違う数字を並べても比較にならない<br><br><b>答案に書くなら</b>　マイクロプラスチックの個数密度は調査年度・地点・サイズ範囲で大きく変わるため、他の調査の数値とは条件を揃えずに直接比較できない。<br><br><b>関連</b>　東京湾周辺の河川では0.3〜35.2個/m3という別の調査結果がある。<br><br><b>答案での使い方</b>　数字を比較に使うときは条件を揃える<br><br>【出典】<a href=\"https://www.env.go.jp/content/000220901.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域気候変動適応計画・地域気候変動適応センター｜時期】気候変動適応法の施行と、次期適応計画の改定時期は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2018年6月公布、同12月施行。2023年に熱中症対策を強化。次期計画は2026年度内に改定予定<br><br><b>解説</b>　気候変動の影響は地域で異なるため、適応法が国・自治体・事業者・国民の役割を定めた。施行後も改正で熱中症対策を強化し、国の計画は影響評価を受けて改定中<br><br><b>答案に書くなら</b>　気候変動適応法は2018年12月に施行され、2023年の改正で熱中症対策が強化され、次期計画は2026年度内に改定予定である。<br><br><b>関連</b>　2026年2月に第3次の気候変動影響評価報告書を公表。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで時期を示す<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/430AC0000000050\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域気候変動適応計画・地域気候変動適応センター｜定義】地域気候変動適応センターとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　都道府県・市町村が、影響・適応の情報の収集・整理・分析・提供と技術的助言を行う拠点機能を担う体制（第13条、努力義務）<br><br><b>解説</b>　地域の適応策を進めるには、気候変動影響・適応に関する情報の収集・分析・提供と技術的助言を担う拠点が要る。努力義務で、国立環境研究所と情報を共有する<br><br><b>答案に書くなら</b>　地域気候変動適応センターとは、都道府県・市町村が影響・適応の情報の収集・整理・分析・提供と技術的助言を行う拠点機能を担う体制であり、確保は努力義務である（第13条）。<br><br><b>関連</b>　複数自治体の共同設置は1件と数える。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 自治体の体制の定義に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/430AC0000000050\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域気候変動適応計画・地域気候変動適応センター｜制度】地域気候変動適応計画の根拠と義務の程度は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　法第12条。都道府県・市町村が国の適応計画を勘案して策定するよう努める努力義務<br><br><b>解説</b>　地域計画は都道府県・市町村が国の適応計画を勘案して作る計画で、義務ではなく努力義務。温対法の地方公共団体実行計画（緩和）とは別の計画<br><br><b>答案に書くなら</b>　地域気候変動適応計画は気候変動適応法第12条に基づき、都道府県・市町村が国の計画を勘案して策定するよう努める努力義務の計画である。<br><br><b>関連</b>　異なる計画を一体的に策定することは可能。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 自治体計画の書き出しに<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/430AC0000000050\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域気候変動適応計画・地域気候変動適応センター｜制度】気候変動適応広域協議会とは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　国の地方行政機関・都道府県・市町村・センター・事業者等で組織でき、全国7ブロックで広域アクションプランを策定<br><br><b>解説</b>　広域協議会は、複数の自治体にまたがる課題を関係者で調整する場。全国7ブロックに置かれ、地域の課題に応じた広域アクションプランを作る<br><br><b>答案に書くなら</b>　気候変動適応広域協議会は国の地方行政機関・都道府県・市町村・センター・事業者等で組織でき、全国7ブロックで広域アクションプランを策定する。<br><br><b>関連</b>　根拠は適応法第14条で、2023年3月にプランを策定・公開。<br><br><b>答案での使い方</b>　Ⅱ-2 関係者調整（広域連携）の根拠に<br><br>【出典】<a href=\"https://laws.e-gov.go.jp/law/430AC0000000050\" target=\"_blank\" rel=\"noopener\">e-Gov法令検索を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域気候変動適応計画・地域気候変動適応センター｜目標】地域適応計画とセンターの現状（2026年3月）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　491自治体が計画を策定し、センターは70か所。491は自治体数、70はセンター数（共同設置は1件）<br><br><b>解説</b>　2026年3月現在、計画は491自治体、センターは70か所。センター数は共同設置を1件と数えるため、自治体数とは一致しない<br><br><b>答案に書くなら</b>　2026年3月現在で491自治体が地域気候変動適応計画を策定し、地域適応センターは70か所確保されている。<br><br><b>関連</b>　491は自治体数、70はセンター数で、数え方が異なる。<br><br><b>答案での使い方</b>　Ⅱ-1・Ⅱ-2 現状の数字。自治体数とセンター数を書き分ける<br><br>【出典】<a href=\"https://www.env.go.jp/content/000427991.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域気候変動適応計画・地域気候変動適応センター｜課題】地域適応の課題を『制度・運用』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　市町村の計画策定の促進と計画の質の向上、センターの地域適応のハブとしての機能強化が必要<br><br><b>解説</b>　市区町村は人材不足の中で計画を作る必要があり、策定が進みにくい。センターは地域適応のハブとして機能を強める必要がある<br><br><b>答案に書くなら</b>　制度・運用の観点から、課題は市町村の計画策定の促進と計画の質の向上、センターの地域適応のハブとしての機能強化が必要なことである。<br><br><b>関連</b>　市区町村では人材不足等が負担になっている。<br><br><b>答案での使い方</b>　Ⅱ-2・必須Ⅰ(1) 自治体の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000191251.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域気候変動適応計画・地域気候変動適応センター｜解決策】自治体の適応を支える解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　A-PLATでの影響予測・優良事例の共有、国立環境研究所の専門家派遣（オンライン可）、策定マニュアルの改訂とツール提供<br><br><b>解説</b>　A-PLATは影響予測や優良事例を共有する情報基盤。国立環境研究所の専門家派遣や策定マニュアルの改訂で、自治体の負担を軽くして策定を支える<br><br><b>答案に書くなら</b>　解決策として、A-PLATで影響予測・優良事例を共有し、国立環境研究所の専門家をオンラインも含め派遣し、策定マニュアルの改訂とツール提供を行う。<br><br><b>関連</b>　策定マニュアルは2018年11月に策定、2023年3月に改訂。<br><br><b>答案での使い方</b>　Ⅱ-2 自治体支援の手順に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000427991.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【地域気候変動適応計画・地域気候変動適応センター｜注意】地域適応計画・センターの100%目標は、誰が対象か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　都道府県・政令指定都市が対象で、市町村は対象外。計画もセンターも努力義務（2026年度目標）<br><br><b>解説</b>　100%目標は都道府県・政令指定都市が対象で、市町村は含まれない。計画もセンターも法律上は努力義務なので、「義務」と書かない<br><br><b>答案に書くなら</b>　計画・センターの2026年度100%目標は都道府県・政令指定都市が対象で、市町村は対象外であり、いずれも努力義務である。<br><br><b>関連</b>　令和6年1月時点で全ての都道府県・政令指定都市は計画を策定済み。<br><br><b>答案での使い方</b>　義務と書くと減点。対象自治体も明記<br><br>【出典】<a href=\"https://www.env.go.jp/content/000191251.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【循環経済行動計画｜時期】循環経済行動計画はいつ、どの会議のどんな形の決定で決まった？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2026年4月21日、循環経済に関する関係閣僚会議（第4回）の決定。閣議決定ではない<br><br><b>解説</b>　世界で資源の獲得競争が激化し、国内の再生可能な資源が海外流出や焼却・埋立てされる現状を受けた。関係閣僚会議は2024年7月の設置<br><br><b>答案に書くなら</b>　循環経済行動計画は2026年4月21日の循環経済に関する関係閣僚会議（第4回）の決定であり、閣議決定ではない。<br><br><b>関連</b>　基本計画（第五次）は2024年8月の閣議決定で別物。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出しで時期と決定主体を示す<br><br>【出典】<a href=\"https://www.env.go.jp/guide/photo_report/report_01160.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【循環経済行動計画｜定義】行動計画は、循環経済への移行をどう位置づけたか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　環境保全にとどまらない経済安全保障の課題と位置づけ、日本の「勝ち筋」として再生資源供給サプライチェーンの強靱化を急ぐ<br><br><b>解説</b>　資源獲得競争が激しく、再生資源の確保は国の経済安全保障に関わる。重要鉱物・金属資源のリサイクルと再生材の活用が軸<br><br><b>答案に書くなら</b>　行動計画は、循環経済への移行を環境保全にとどまらない経済安全保障の課題と位置づけ、再生資源供給サプライチェーンの強靱化を日本の勝ち筋として急ぐ。<br><br><b>関連</b>　構成は、サプライチェーン強靱化、国際資源循環ネットワーク、地域活性化・国際ルール・国民運動の3節。<br><br><b>答案での使い方</b>　Ⅱ-1 定義・背景の1〜2文目に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/html/hj26010401.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【循環経済行動計画｜制度】行動計画が掲げた投資の目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　再資源化拠点の構築等に、2030年までに官民で約1兆円の投資を目指す（国の予算額ではない）<br><br><b>解説</b>　再資源化拠点の整備には大きな設備投資が必要で、民間の資金を呼び込むことが狙い。数字は官民合わせた投資目標で、国の予算額ではない<br><br><b>答案に書くなら</b>　行動計画は、再資源化拠点の構築等に2030年までに官民で約1兆円の投資を目指すとしている。<br><br><b>関連</b>　官民ファンドの脱炭素化支援機構（JICN）等の活用で後押しする。<br><br><b>答案での使い方</b>　Ⅱ-1 制度の本文。数字の主語を官民と書く<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/pdf/full.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【循環経済行動計画｜制度】メタルリサイクル推進戦略の2030年の再生材供給目標を、品目別に言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　鉄は高品位スクラップ化の処理能力約200万t/年を追加確保。アルミ展伸材約4割、電解銅約3割、永久磁石の原料約3割を再生資源由来に<br><br><b>解説</b>　メタルリサイクル推進戦略は、品目ごとに指標を変えて2030年の再生材供給目標を置く。鉄は処理能力、アルミ・銅・磁石は国内に占める割合で測る<br><br><b>答案に書くなら</b>　2030年の再生材供給目標は、鉄が高品位スクラップ化の処理能力約200万t/年の追加確保、アルミ展伸材約4割、電解銅約3割、永久磁石の原料約3割である。<br><br><b>関連</b>　品目ごとに指標が違うため同じ尺度で比べられない。<br><br><b>答案での使い方</b>　Ⅱ-1 制度の目標。品目ごとに指標が違う点に注意<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/html/hj26010401.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【循環経済行動計画｜課題】循環経済行動計画を根拠に、資源循環の課題を『担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　静脈産業は小規模分散で長期・大口契約を結べる事業者が少なく、設備投資の回収も長いため民間融資を受けにくい<br><br><b>解説</b>　静脈産業（回収・再資源化側）は地域ごとに小規模で分散し、製造業と長期・大口の契約を結びにくい。高度リサイクルの設備は投資回収も長く、民間融資を受けにくい<br><br><b>答案に書くなら</b>　担い手の観点から、課題は静脈産業が小規模分散で長期・大口契約を結べる事業者が少なく、投資回収も長いため民間融資を受けにくいことである。<br><br><b>関連</b>　動静脈連携は製造業（動脈）と静脈産業の連携のこと。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 担い手の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/pdf/full.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【循環経済行動計画｜課題】行動計画が挙げる資源循環の課題を『制度・運用』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　不適正なスクラップヤードが環境対策のコストをかけず高値で資源を買い集め、公正な競争を阻害している<br><br><b>解説</b>　不適正なスクラップヤードは環境対策のコストをかけず高値で買えるため、適正な事業者との公正な競争を妨げる。100以上の都道府県等が国レベルの規制を望んでいる<br><br><b>答案に書くなら</b>　制度・運用の観点から、課題は不適正なスクラップヤードが環境対策のコストをかけず高値で資源を買い集め、公正な競争を阻害していることである。<br><br><b>関連</b>　対策は廃棄物処理法の改正（2026年6月公布）で許可制を導入。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 制度・運用の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/html/hj26010401.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【循環経済行動計画｜解決策】動静脈連携を進める解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　再資源化事業等高度化法の大臣認定を3年で100件以上目指し、官民ファンド（JICN）等の活用で投資を後押しする<br><br><b>解説</b>　再資源化事業等高度化法は、再資源化事業の高度化を認定する制度で、2025年11月に全面施行された。認定制度に官民ファンドの出資を組み合わせて投資を促す<br><br><b>答案に書くなら</b>　解決策として、再資源化事業等高度化法の大臣認定を3年で100件以上目指し、官民ファンド（JICN）等の活用で投資を後押しする。<br><br><b>関連</b>　同法は令和6年法律第41号。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の1つに。認定制度とファンドを併記<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/pdf/full.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【循環経済行動計画｜注意】行動計画と第五次循環型社会形成推進基本計画の違いは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　第五次基本計画は2024年8月閣議決定で別物。資源生産性約60万円/トン（2030年度）等の指標は基本計画のもの<br><br><b>解説</b>　第五次循環基本計画（2024年8月閣議決定）は循環型社会形成推進基本法に基づく別の計画で、行動計画はその上乗せ施策群。指標は基本計画のものを混ぜない<br><br><b>答案に書くなら</b>　行動計画は関係閣僚会議の決定で、第五次基本計画（2024年8月閣議決定）とは別であり、資源生産性約60万円/トン（2030年度）等の指標は基本計画のものである。<br><br><b>関連</b>　2023年度の資源生産性は約50.9万円/トン。<br><br><b>答案での使い方</b>　Ⅱ-1 留意点。基本計画の指標を行動計画の目標と混ぜない<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/pdf/full.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【廃棄物処理法の2026年改正｜時期】令和8年法律第43号（廃棄物処理法等の改正）の公布日と、ヤード許可制の施行時期は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　2026年6月19日公布。ヤードの許可制は公布から2年6か月以内（令和10年12月19日より前）に施行で、未施行<br><br><b>解説</b>　許可制本体は公布から2年6か月以内の政令で定める日に施行するため、2026年11月28日時点では施行日が未確定・未施行。災害廃棄物関係は先行施行<br><br><b>答案に書くなら</b>　令和8年法律第43号は2026年6月19日公布で、ヤードの許可制は公布から2年6か月以内（令和10年12月19日より前）に施行する未施行の規定である。<br><br><b>関連</b>　施行済み・未施行を書き分ける。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し。施行済みか予定かを書き分ける<br><br>【出典】<a href=\"https://www.env.go.jp/content/000419110.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【廃棄物処理法の2026年改正｜注意】2026年の改正で、すでに施行されている部分はどこか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　災害廃棄物関係は施行期日政令により令和8年9月16日に施行済み。許可制本体とは時期が異なる<br><br><b>解説</b>　本改正は許可制（ヤード）と災害廃棄物対策の2本立てで、部分ごとに施行期日が異なる。災害廃棄物関係は令和8年9月16日に施行済み<br><br><b>答案に書くなら</b>　2026年の改正のうち災害廃棄物関係は令和8年9月16日に施行済みで、スクラップヤードの許可制本体とは施行時期が異なる。<br><br><b>関連</b>　許可申請の準備行為の規定も施行済み。<br><br><b>答案での使い方</b>　Ⅱ-1 留意点。全部施行済みと書かない<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05564.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【廃棄物処理法の2026年改正｜定義】スクラップヤードを規制する法改正の背景は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　有価物は廃棄物処理法の規制対象外で、廃棄物を有価物と称して規制を逃れる事業者がいた。この隙間を埋める許可制を導入<br><br><b>解説</b>　有価物は原則として廃棄物処理法の対象外のため、廃棄物を有価物と称して規制を逃れる事業者がいた。騒音・悪臭・水質土壌汚染・火災などの問題が一部で生じていた<br><br><b>答案に書くなら</b>　背景として、有価物は廃棄物処理法の規制対象外で、廃棄物を有価物と称して規制を逃れる事業者がいたため、この隙間を埋める許可制を導入した。<br><br><b>関連</b>　実態は令和7年度調査で全国4,625事業場。<br><br><b>答案での使い方</b>　Ⅱ-1 定義・背景の書き出しに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000419110.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【廃棄物処理法の2026年改正｜制度】スクラップヤードの許可制の対象と義務を言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　使用済金属・プラスチック物品の保管又は再生を行う事業者が都道府県知事の許可を要し、保管・再生の基準の遵守と帳簿作成を義務付け<br><br><b>解説</b>　対象は廃棄物ではない有価物（使用済金属・プラスチック物品）で、雑品スクラップや使用済基板が典型。既存の許可業者は許可を受けたものとみなす<br><br><b>答案に書くなら</b>　制度として、使用済金属・プラスチック物品の保管又は再生を行う事業者は都道府県知事の許可を要し、保管・再生の基準の遵守と帳簿の作成が義務付けられる。<br><br><b>関連</b>　小規模事業場や国・自治体等は許可不要。<br><br><b>答案での使い方</b>　Ⅱ-1 制度の中身の本文に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000427424.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【廃棄物処理法の2026年改正｜制度】バーゼル法に関わる物品の輸出の規制を言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　使用済鉛蓄電池・廃電子基板等は国内再生が原則で、輸出には環境大臣の確認が要る。無確認輸出は罰則で未遂罪・予備罪もある<br><br><b>解説</b>　バーゼル法の特定有害廃棄物等は、輸出先での不適正処理を防ぐため国内再生を原則とする。輸出には環境大臣の確認が必要で、無確認の輸出は罰則の対象<br><br><b>答案に書くなら</b>　使用済鉛蓄電池・廃電子基板等は国内再生が原則で、輸出には環境大臣の確認が要り、無確認輸出は未遂罪・予備罪を含む罰則の対象である。<br><br><b>関連</b>　バーゼル条約のPIC手続は2028年度から電子化を目指す。<br><br><b>答案での使い方</b>　Ⅱ-1 制度の本文。国内資源循環の観点で<br><br>【出典】<a href=\"https://www.env.go.jp/content/000427424.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【廃棄物処理法の2026年改正｜課題】適正な事業者への影響という観点で、ヤード規制の課題を1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　不適正ヤードは環境対策のコストを省き買取価格を高く設定でき、適正事業者との公正な競争が妨げられている<br><br><b>解説</b>　不適正ヤードは環境対策のコストを省けるぶん買取価格を高く設定でき、適正事業者の仕入れが不利になる。環境面だけでなく経済面の公正さが問題<br><br><b>答案に書くなら</b>　経済の観点から、課題は不適正ヤードが環境対策のコストを省いて買取価格を高く設定でき、適正事業者との公正な競争が妨げられていることである。<br><br><b>関連</b>　資源の海外流出にもつながる。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000427424.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【廃棄物処理法の2026年改正｜解決策】不適正なヤードへの解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　許可制と基準・帳簿の義務付けを軸に、基準違反に改善命令・措置命令・事業停止命令・許可取消しで対応し、許可を失った者の放置にも措置命令<br><br><b>解説</b>　許可制と基準・帳簿の義務で入口を絞り、違反には段階的な命令・取消しで対応する。許可を失った者が放置したスクラップにも措置命令が使える<br><br><b>答案に書くなら</b>　解決策として、許可制と基準・帳簿の義務付けを軸に、基準違反に改善命令・措置命令・事業停止命令・許可取消しで対応し、許可を失った者の放置にも措置命令を出す。<br><br><b>関連</b>　無許可営業は最大5年の拘禁刑等の罰則。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の1つに。罰則まで書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000427424.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【廃棄物処理法の2026年改正｜解決策】災害廃棄物の処理を強くする解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　処理計画への記載と協定締結の努力義務、非常災害廃棄物最終処分場の「指定」、JESCOの事業追加による自治体への専門的支援<br><br><b>解説</b>　災害時は自治体の人員・ノウハウが不足するため、平時の計画と協定で備える。最終処分場は許可でなく「指定」で、JESCOが専門的支援を担う<br><br><b>答案に書くなら</b>　解決策として、処理計画への記載と協定締結の努力義務、非常災害廃棄物最終処分場の指定、JESCOの事業追加による自治体への専門的支援を進める。<br><br><b>関連</b>　指定の更新期間は5年（政令）。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 官民連携の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000427424.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽光発電の環境アセス対象拡大｜時期】環境影響評価法施行令の太陽光規模見直しは、いつ決まっていつ施行か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2026年7月17日に閣議決定（令和8年政令第230号）。施行は令和9年（2027年）4月1日で、決定済みだが未施行<br><br><b>解説</b>　2025年12月23日の関係閣僚会議の対策パッケージを受けた政令改正。政令は決定済みだが、施行日は令和9年4月1日で未施行<br><br><b>答案に書くなら</b>　環境影響評価法施行令の太陽光規模見直しは2026年7月17日に閣議決定され、2027年4月1日施行で、決定済みだが未施行である。<br><br><b>関連</b>　意見募集（2026年6月2日〜7月1日）は政令案についてだった。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し。案ではなく決定済みと書く<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05279.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽光発電の環境アセス対象拡大｜定義】環境アセスの第一種事業と第二種事業の違いは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　第一種は規模が大きくアセス必須。第二種は個別にスクリーニングで要否を判定する。太陽電池発電所は2020年4月に対象化<br><br><b>解説</b>　第一種は規模が大きくアセスが必須、第二種はスクリーニングで個別に要否を判定する。太陽電池発電所は2020年4月に対象に追加された<br><br><b>答案に書くなら</b>　第一種事業は規模が大きくアセス必須で、第二種事業は個別にスクリーニングで要否を判定し、太陽電池発電所は2020年4月に対象事業へ追加された。<br><br><b>関連</b>　従来は第一種が4万kW以上、第二種が3万kW以上4万kW未満。<br><br><b>答案での使い方</b>　Ⅱ-1 定義の書き出しに<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05279.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽光発電の環境アセス対象拡大｜制度】太陽電池発電所の第一種・第二種の規模は、どう変わるか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　第一種は4万kW以上から2万kW以上へ。第二種は3万kW以上4万kW未満から1.5万kW以上2万kW未満へ（出力、交流）<br><br><b>解説</b>　規模の指標は出力（交流側）で、面積ではない。土地改変の影響を踏まえて、第一種・第二種とも下限を引き下げる<br><br><b>答案に書くなら</b>　太陽電池発電所は、第一種が4万kW以上から2万kW以上へ、第二種が3万kW以上4万kW未満から1.5万kW以上2万kW未満へ見直される。<br><br><b>関連</b>　第二種の下限の見直しと第一種の下限の見直しは別の改正点。<br><br><b>答案での使い方</b>　Ⅱ-1 制度の本文。新旧の数字を並べる<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05279.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽光発電の環境アセス対象拡大｜制度】施行時に手続中の事業を守る経過措置を言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　施行前に法手続を始めた3〜4万kWは第二種のまま継続。新たに対象となる事業は条例等の図書を相当書類とみなし途中から法手続へ<br><br><b>解説</b>　施行直前に手続を進めている事業者が、規模の見直しで手戻りしないよう、経過措置を置く。条例アセスの図書を法の図書とみなして途中から移れる<br><br><b>答案に書くなら</b>　施行前に法手続を始めた3〜4万kWの事業は第二種のまま継続でき、新たに対象となる事業は条例等の図書を相当書類とみなして途中から法手続へ移れる。<br><br><b>関連</b>　根拠は環境影響評価法第54条。<br><br><b>答案での使い方</b>　Ⅱ-1 制度の留意点。Ⅱ-2 手戻り防止の調整に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000416630.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽光発電の環境アセス対象拡大｜課題】太陽光アセスの規模要件の課題を『技術・科学』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　影響が大きいのは土地の面的改変だが、出力と面積の関係は蓄電池の併設や発電効率の向上で変わりうる。2019年答申は5年程度での見直しを求めた<br><br><b>解説</b>　影響が大きいのは土地の面的な改変だが、出力と面積の関係は蓄電池の併設や発電効率の向上で変わりうる。2019年答申は5年程度での見直しを求めていた<br><br><b>答案に書くなら</b>　技術・科学の観点から、課題は出力と面積の関係が蓄電池の併設や発電効率の向上で変わりうるため、規模要件を状況に応じて見直す必要があることである。<br><br><b>関連</b>　環境影響で特に大きいのは土地の面的改変。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://assess.env.go.jp/files/0_db/contents/1086_04/shiryou2.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽光発電の環境アセス対象拡大｜課題】太陽光アセスの課題を『制度・運用』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　法対象外の規模は条例アセスが担うが、対象規模は自治体で差が大きく、出力基準でも0.8万〜5万kW等とまちまち<br><br><b>解説</b>　法対象外の規模は条例アセスが担うが、条例の対象規模は自治体で異なる。面積基準の自治体も多く、出力基準でも0.8万〜5万kW等とまちまち<br><br><b>答案に書くなら</b>　制度・運用の観点から、課題は法対象外の規模は条例アセスが担うが、対象規模が自治体で差が大きく、出力基準でも0.8万〜5万kW等とまちまちなことである。<br><br><b>関連</b>　施行前後の事業を法手続へつなぐ経過措置の運用も要る。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 制度・運用の観点の課題に<br><br>【出典】<a href=\"https://assess.env.go.jp/files/0_db/contents/1086_04/shiryou2.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽光発電の環境アセス対象拡大｜解決策】立地の多様な太陽光事業に配慮する解決策を、専門用語で言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　第二種のスクリーニング基準に森林開発・傾斜地の観点を加え、造成地は合理化ガイドライン、対象外は環境配慮ガイドラインで促す<br><br><b>解説</b>　森林や傾斜地は土地改変の影響が大きいため、スクリーニングで観点を加える。造成済みの土地には項目選定を簡略化する合理化ガイドラインがある<br><br><b>答案に書くなら</b>　解決策として、第二種のスクリーニング基準に森林開発・傾斜地の観点を加え、造成地は合理化ガイドライン、法・条例の対象外は環境配慮ガイドラインで配慮を促す。<br><br><b>関連</b>　環境配慮ガイドラインは令和2年3月公表で、10kW以上の事業用太陽光が対象。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の1つに。基準とガイドラインを併記<br><br>【出典】<a href=\"https://www.env.go.jp/council/content/i_01/000419510.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【太陽光発電の環境アセス対象拡大｜注意】2026年9月15日からの意見募集は、何についてのものか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　政令そのものではなく、条例等の書類を法の相当書類として指定する件（案）についてのもの<br><br><b>解説</b>　2026年9月15日からの意見募集は、法第54条第2項に基づき、条例等の書類を相当書類として指定する件（案）についてで、政令そのものではない<br><br><b>答案に書くなら</b>　2026年9月15日からの意見募集は、政令ではなく、条例等の書類を法の相当書類として指定する件（案）についてのものである。<br><br><b>関連</b>　政令案の意見募集は2026年6〜7月で、別のもの。<br><br><b>答案での使い方</b>　Ⅱ-1 留意点。政令案の意見募集（6〜7月）と混同しない<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05577.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【生物多様性COP17と30by30｜時期】生物多様性条約COP17の日程・場所と、会議の最大の成果は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　2026年10月19〜30日、アルメニアのエレバン。GBF実施を初めて世界全体で点検するグローバルレビューを行い、実施加速を求めた<br><br><b>解説</b>　COP17はGBF（昆明・モントリオール生物多様性枠組）の実施を初めて世界全体で点検する会議。決定は「エレバン・パスウェイ」で、実施加速を求めた<br><br><b>答案に書くなら</b>　COP17は2026年10月にアルメニアのエレバンで開かれ、GBF実施の初のグローバルレビューを行い、各締約国に実施加速を強く求めた。<br><br><b>関連</b>　第2回グローバルレビューはCOP19、COP18はエクアドルで開催。<br><br><b>答案での使い方</b>　Ⅱ-1の書き出し。30by30が達成と評価されたわけではない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000439580.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【生物多様性COP17と30by30｜定義】30by30とは何か。OECMとは何か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　2030年までに陸と海の30%以上を保護地域とOECMで保全する目標。OECMは保護地域以外で生物多様性保全に資する地域<br><br><b>解説</b>　30by30は2030年までに陸と海の30%以上を保全するGBFの目標。日本では国家戦略2023-2030で、2030年ネイチャーポジティブの国内目標の一つに位置づけた<br><br><b>答案に書くなら</b>　30by30とは2030年までに陸と海の30%以上を保護地域とOECMで保全する目標で、OECMは保護地域以外で生物多様性保全に資する地域である。<br><br><b>関連</b>　日本は国家戦略2023-2030で位置づけた。<br><br><b>答案での使い方</b>　Ⅱ-1 定義の書き出しに<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05386.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【生物多様性COP17と30by30｜制度】日本の30by30の現状を、保護地域＋OECMの割合で言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　2026年8月時点で陸域21.0%（うちOECM0.2%）、海域13.3%。自然共生サイトは2026年10月に累計700か所<br><br><b>解説</b>　保護地域＋OECMの合計割合を、2026年8月3日の環境省発表で示した。OECMは国際データベースに登録される保護地域と重複しない区域<br><br><b>答案に書くなら</b>　日本の保護地域＋OECMは2026年8月時点で陸域21.0%（うちOECM0.2%）、海域13.3%で、自然共生サイトは累計700か所である。<br><br><b>関連</b>　OECMの登録面積は累計64.6千ha。<br><br><b>答案での使い方</b>　Ⅱ-1 制度の現状の数字。必須Ⅰ(1)の課題の大きさの根拠にも<br><br>【出典】<a href=\"https://www.env.go.jp/press/press_05386.html\" target=\"_blank\" rel=\"noopener\">環境省を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【生物多様性COP17と30by30｜課題】COP17後の30by30の達成に向けた課題を『制度・運用』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　海域は13.3%で、追加で約17%の保全が必要。OECMに該当し得る国の制度の地域を関係省庁で検討する段階<br><br><b>解説</b>　海域は13.3%にとどまり、30%には追加で約17%の保全が必要。国の制度で管理される森林・河川・港湾・都市緑地・海域のうち、OECMに該当し得る地域を関係省庁で検討中<br><br><b>答案に書くなら</b>　制度・運用の観点から、課題は海域が13.3%にとどまり追加で約17%の保全が必要で、OECMに該当し得る国制度の地域の検討が途上なことである。<br><br><b>関連</b>　国家戦略の中間評価で、状態目標の進展は半数弱にとどまった。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 制度・運用の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/pdf/full.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【生物多様性COP17と30by30｜課題】30by30の課題を『担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　自然共生サイトの申請主体は企業が約半数で民間の自主的な活動に依存し、参画企業へのインセンティブが重要<br><br><b>解説</b>　自然共生サイトは民間の自主的な取組を国が認定する制度で、申請主体は企業が約半数。民間の自主性に依存するため、参画企業のインセンティブが要る<br><br><b>答案に書くなら</b>　担い手の観点から、課題は自然共生サイトの申請主体の約半数が企業で民間の自主的な活動に依存しており、参画企業へのインセンティブが重要なことである。<br><br><b>関連</b>　支援証明書の本格運用は2025年9月。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 担い手の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000431252.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【生物多様性COP17と30by30｜解決策】海域と陸域の保護地域を増やす解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　国立・国定公園の候補地14か所を2030年までに順次指定・編入し、国立公園の海域公園地区の面積を2030年までに倍増する<br><br><b>解説</b>　陸域の保護地域を広げる国立・国定公園の新規指定・拡張と、海域の保護を強める海域公園地区の拡大が柱。目標年は2030年<br><br><b>答案に書くなら</b>　解決策として、国立・国定公園の候補地14か所を2030年までに順次指定・編入し、国立公園の海域公園地区の面積を2030年までに倍増する。<br><br><b>関連</b>　海洋保護区の設定も進める。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の1つに。目標年を書く<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/pdf/full.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【生物多様性COP17と30by30｜解決策】民間の参画を進める解決策を、専門用語を使って言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　地域生物多様性増進法の認定（維持・回復・創出）、支援証明書（2025年9月本格運用）、見える化システムで企業の参画を促す<br><br><b>解説</b>　地域生物多様性増進法の認定は維持・回復・創出の各タイプがあり、回復・創出は将来OECMの基準を満たす場所を想定。支援証明書と見える化システムで企業を後押しする<br><br><b>答案に書くなら</b>　解決策として、地域生物多様性増進法の認定（維持・回復・創出）、支援証明書（2025年9月本格運用）、見える化システムで企業の参画を促す。<br><br><b>関連</b>　30by30アライアンスにも企業・自治体が参画する。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の1つに。法の認定を軸に<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/pdf/full.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:用語", "q": "【生物多様性COP17と30by30｜注意】陸域の20.8%と21.0%は、何が違うか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priB\">優先度 B</span> <small>書ける問題の幅を広げる分野。要点と数字を1つ</small><br><br><b>答え</b>　20.8%は2025年8月時点の保護地域のみ。21.0%は2026年8月発表の保護地域＋OECM（OECMだけだと陸域0.2%）<br><br><b>解説</b>　20.8%は2025年8月時点の保護地域のみ、21.0%は2026年8月発表の保護地域＋OECMで、対象と時点が違う。OECM単独だと陸域0.2%程度<br><br><b>答案に書くなら</b>　陸域の20.8%は2025年8月時点の保護地域のみ、21.0%は2026年8月発表の保護地域＋OECMで、出典と時点が異なる。<br><br><b>関連</b>　自然共生サイトの数（700か所）とOECM登録面積（64.6千ha）も別の指標。<br><br><b>答案での使い方</b>　Ⅱ-1 留意点。割合の出典と時点を書き分ける<br><br>【出典】<a href=\"https://www.env.go.jp/policy/hakusyo/r08/pdf/full.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}];
const NJ_PRI_A_DATA = [{"f": "二次:計画", "q": "【第六次環境基本計画｜時期】第六次環境基本計画が閣議決定されたのはいつ（何年何月）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2024年5月（5月21日）。第五次ではなくこの第六次が最新版である<br><br><b>解説</b>　2024年5月21日に閣議決定された環境基本計画で、根拠は環境基本法第15条である<br><br><b>答案に書くなら</b>　本計画は2024年5月に閣議決定された第六次環境基本計画であり、最新版に基づいて課題を整理する。<br><br><b>関連</b>　第五次はR2の題材で別の計画。目的規定は第1条で、策定根拠の第15条と混同しない。<br><br><b>答案での使い方</b>　書き出しで最新版を明示する。第五次(R2題材)と取り違えない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223504.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜目標】第六次環境基本計画が掲げる2030年度の温室効果ガス削減目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2013年度比46%削減（さらに50%の高みに向け挑戦を続ける）<br><br><b>解説</b>　基準年の2013年度と比べた2030年度の削減率で、日本全体の温室効果ガスが対象である<br><br><b>答案に書くなら</b>　環境の観点から、2030年度に2013年度比46%削減という高い目標の達成に向け、対策の加速が課題である。<br><br><b>関連</b>　2035年度60%・2040年度73%は別計画（地球温暖化対策計画）の数字で、本計画は2030年度46%とCN2050のみ明記する。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 課題の大きさの根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223504.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜目標】第六次環境基本計画が掲げる30by30目標とは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2030年までに陸と海の30%以上を保全する目標。ネイチャーポジティブ実現の手段<br><br><b>解説</b>　30by30は、2030年までに陸と海の30%以上を保全地域やOECM（保護地域以外で生物多様性保全に資する地域）にする国際目標。ネイチャーポジティブの実現手段と位置づけられる<br><br><b>答案に書くなら</b>　生態系の保全の観点から、30by30の達成に向け保全地域とOECMの拡大を進めることが解決策である。<br><br><b>関連</b>　ネイチャーポジティブは損失を止めて反転させる考え方で、30by30はその手段である。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 生物多様性の解決策の到達点に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223504.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜目標】世界の年平均気温は産業革命前より何℃上昇した（2023年）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　1.45℃上昇（2023年）。気候危機の背景として示されている<br><br><b>解説</b>　産業革命前を基準とした世界の年平均気温の上昇幅で、2023年に1.45℃と示されている。気候危機を課題の背景として説明するときの数字になる<br><br><b>答案に書くなら</b>　世界の年平均気温は2023年に産業革命前より1.45℃上昇しており、気候危機への対応が急務であることが課題の背景である。<br><br><b>関連</b>　パリ協定の1.5℃目標に近い水準だが、1.45℃は2023年時点の値であり将来目標ではない。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 冒頭で課題の背景を示す数字に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223504.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜柱】「環境・経済・社会の統合的向上」を実践する場と位置づけられた重点戦略は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　地域づくり。地域循環共生圏で地域脱炭素とネイチャーポジティブを同時に解決する<br><br><b>解説</b>　重点戦略の一つ「環境・経済・社会の統合的向上の実践・実装の場としての地域づくり」で、地域循環共生圏が中核の考え方。地域ごとに自然資本・経済・社会の課題が異なるため、地域単位の実践が要る<br><br><b>答案に書くなら</b>　地域の観点から、地域循環共生圏により地域脱炭素とネイチャーポジティブを同時に解決することが解決策である。<br><br><b>関連</b>　地域循環共生圏は自立・分散型の地域づくりで、近隣地域と資源を補完し合う。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の方向を国の言葉で言うときに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜柱】「新たな成長」を導く重点戦略の中身は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　持続可能な生産と消費を実現するグリーンな経済システム。自然資本への投資拡大と環境価値の内部化<br><br><b>解説</b>　「新たな成長」は経済を高付加価値化する考え方で、自然資本への投資を拡大し、環境という非市場的価値を市場的価値に取り込む（内部化する）ことで実現を図る<br><br><b>答案に書くなら</b>　経済の観点から、自然資本への投資拡大と環境価値の内部化により、グリーンな経済システムを構築することが解決策である。<br><br><b>関連</b>　重点戦略は6つあり、他に国土・地域・暮らし・科学技術・国際がある。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 経済面の解決策の方向づけに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜課題】第六次環境基本計画を根拠に、自然資本投資の課題を『制度・政策』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　環境価値を市場価値に内部化するため、成長志向型CP構想の実行と税制のグリーン化を、競争力を損なわず設計する必要がある<br><br><b>解説</b>　環境価値のような非市場的価値は価格に反映されにくく、市場で評価されない。成長志向型カーボンプライシングや税制のグリーン化は、その内部化の手段である<br><br><b>答案に書くなら</b>　制度・政策の観点から、環境価値の内部化に向け成長志向型カーボンプライシング構想と税制のグリーン化を、競争力を損なわずに設計する必要があることが課題である。<br><br><b>関連</b>　解決策側の用語は成長志向型カーボンプライシング構想（GX投資を先行させ炭素価格負担を段階導入）である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 制度・政策の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜課題】自然資本投資の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　サステナブルファイナンスと地域金融のESG化による資金動員が不可欠だが、評価指標が未成熟で資金が循環しにくい<br><br><b>解説</b>　自然資本投資には民間資金の動員が欠かせないが、環境価値の評価指標が未成熟だと投資判断がしにくく、資金が自然資本に回りにくい<br><br><b>答案に書くなら</b>　経済・資金の観点から、サステナブルファイナンスと地域金融のESG化による資金動員が不可欠だが、評価指標が未成熟で資金が循環しにくいことが課題である。<br><br><b>関連</b>　サステナブルファイナンスは環境・社会課題の解決に資する事業へ資金を誘導する枠組みである。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜課題】計画の実践・実装の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　環境人材の育成や公正な移行への人的資本投資、地域循環共生圏を支える中間支援組織の担い手不足が制約になっている<br><br><b>解説</b>　計画を地域で実行するには、環境分野の専門人材と、主体間を橋渡しする中間支援組織が要る。担い手が不足すると実践・実装が進まない<br><br><b>答案に書くなら</b>　人材・担い手の観点から、環境人材の育成や公正な移行への人的資本投資と、中間支援組織の担い手不足が実践・実装の制約となっていることが課題である。<br><br><b>関連</b>　公正な移行（ジャスト・トランジション）は、転換で影響を受ける産業・労働者・地域に不利益が偏らないようにする考え方である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 人材・担い手の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜解決策】地域ごとに異なる課題への解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　地域循環共生圏の形成で、地域の自然資本を活かし近隣と資源を補完し合う自立・分散型の地域づくりを進める<br><br><b>解説</b>　地域循環共生圏は、地域の自然資本を最大限活用し、近隣地域と資源を補完し合う自立・分散型の地域づくり。地域ごとに課題が違う問題への解決策として使える専門用語である<br><br><b>答案に書くなら</b>　地域の観点から、地域循環共生圏を形成し、地域の自然資本を活かして近隣と資源を補完し合う自立・分散型の地域づくりを進めることが解決策である。<br><br><b>関連</b>　地域固有の合意形成の例として水俣の「もやい直し」や福島の「未来志向」が挙げられる。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 地域系の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜解決策】環境価値の内部化に向けた解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　成長志向型カーボンプライシング構想で、先行投資を促しつつ炭素価格負担を段階的に導入し、脱炭素と競争力を両立する<br><br><b>解説</b>　成長志向型カーボンプライシング構想は、GX投資を先行させつつ将来の炭素価格負担を段階的に導入する構想。化石燃料依存の低減と産業競争力強化の両立を狙う<br><br><b>答案に書くなら</b>　制度の観点から、成長志向型カーボンプライシング構想により、先行投資を促しつつ炭素価格負担を段階的に導入し、脱炭素と競争力を両立することが解決策である。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 制度面の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜リスク】30by30を急ぐ地域共生型再エネ拡大で生じるリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：景観・生態系への新たな環境負荷。対策：洋上・陸上風力の環境配慮の制度検討を計画の初期段階から組み込む<br><br><b>解説</b>　再エネ・洋上風力の導入拡大は脱炭素に資する一方、景観や生態系に新たな負荷を与える可能性があり、脱炭素と自然共生のトレードオフになる<br><br><b>答案に書くなら</b>　リスクとして、再エネ導入拡大が景観・生態系に新たな環境負荷を生むおそれがあるため、洋上・陸上風力の環境配慮の制度検討を計画の初期段階から組み込む必要がある。<br><br><b>関連</b>　トレードオフを避けるには、導入計画の初期段階での環境配慮の組み込みが鍵である。<br><br><b>答案での使い方</b>　必須Ⅰ(3) 脱炭素と自然共生のトレードオフに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223505.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【第六次環境基本計画｜注意】2035年度60%・2040年度73%削減は第六次環境基本計画の数字か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　違う。地球温暖化対策計画（2025年2月）の数字。第六次が明記するのは2030年度46%とCN2050<br><br><b>解説</b>　2035年度60%・2040年度73%削減（2013年度比）は2025年2月閣議決定の地球温暖化対策計画の数字。第六次環境基本計画の本体・概要には明記されていない<br><br><b>答案に書くなら</b>　本計画が明記する削減目標は2030年度46%とカーボンニュートラル2050であり、2035年度60%・2040年度73%は地球温暖化対策計画の数字である。<br><br><b>関連</b>　連携する第五次循環型社会形成推進基本計画や生物多様性国家戦略2023-2030も別個の計画で、本計画の内容として引用しない。<br><br><b>答案での使い方</b>　両計画の数字を混同すると減点。書き分ける<br><br>【出典】<a href=\"https://www.env.go.jp/content/000223504.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜時期】地球温暖化対策計画（現行）が閣議決定されたのはいつ（何年何月）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2025年2月（2021年10月の前計画を改定）。2035・2040年度目標はこの改定で新設<br><br><b>解説</b>　地球温暖化対策推進法第8条第1項に基づく計画で、2021年10月の前計画を2025年2月18日に改定した。前計画は2030年度目標のみで、2035・2040年度目標が新設された<br><br><b>答案に書くなら</b>　本計画は2025年2月に改定された地球温暖化対策計画であり、2035・2040年度目標を含む最新版に基づいて課題を整理する。<br><br><b>関連</b>　根拠法は環境基本法第15条ではなく温対法第8条第1項で、第六次環境基本計画とは別の計画である。<br><br><b>答案での使い方</b>　書き出しで最新版を明示。旧計画(2030年度のみ)と区別<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜目標】地球温暖化対策計画の2030・2035・2040年度の削減目標は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2013年度比で2030年度46%（7.6億t）、2035年度60%（5.7億t）、2040年度73%（3.8億t）<br><br><b>解説</b>　削減率の基準は2013年度の排出・吸収量。2030年度は46%減（さらに50%の高みに挑戦）、2035年度は60%減、2040年度は73%減と段階的に深掘りし、2050年にネットゼロを目指す<br><br><b>答案に書くなら</b>　環境の観点から、2030年度46%、2035年度60%、2040年度73%という段階的な削減目標の達成に向け、対策の加速が課題である。<br><br><b>関連</b>　2030年度目標46%は旧計画から不変で、2035・2040年度が新設である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 課題の大きさと(2)の到達点の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜目標】2024年度の温室効果ガス排出・吸収量は何億t（2013年度比）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　9.94億t（2013年度比28.7%減）。初めて10億tを下回った（2026年4月発表）<br><br><b>解説</b>　2024年度の排出・吸収量は9.94億トンで、2013年度以降の最低値。初めて10億トンを下回った。2030年度目標の7.6億トンまでは依然として差がある<br><br><b>答案に書くなら</b>　環境の観点から、2024年度の排出・吸収量は9.94億トン（2013年度比28.7%減）であり、2030年度目標の7.6億トンまでなお大きな差がある。<br><br><b>関連</b>　2022年度は10.8億トン（2013年度比22.9%減）、2023年度確報値は10.17億トン（27.1%減）である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 現状と2030年度目標7.6億tとの差を示す<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜目標】家庭部門のエネルギー起源CO2の2030年度目安は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　71百万t（2013年度209百万tから66%減）<br><br><b>解説</b>　家庭部門のエネルギー起源CO2は、2013年度の209百万tから2030年度に71百万t（66%減）とする目安。全体目標の46%減より大幅に深い削減率である。R8 Ⅰ-2の題材でもある<br><br><b>答案に書くなら</b>　環境の観点から、家庭部門は2013年度209百万tから2030年度71百万t（66%減）へ、全体目標より深い削減が求められることが課題である。<br><br><b>関連</b>　2040年度は約40〜60百万t（71〜81%減）の目安で、運輸部門の2030年度目安は146百万t（35%減）である。<br><br><b>答案での使い方</b>　R8 Ⅰ-2の題材。全体目標46%と取り違えない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜柱】地球温暖化対策計画の4本の柱は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　エネルギー転換／産業・業務・運輸等／地域・くらし／横断的取組<br><br><b>解説</b>　計画の柱はエネルギー転換、産業・業務・運輸等、地域・くらし、横断的取組の4つ。エネルギー転換は再エネ・原子力の最大活用、LNG火力の脱炭素化、非効率石炭のフェードアウトなどを含む<br><br><b>答案に書くなら</b>　解決策として、エネルギー転換、産業・業務・運輸等、地域・くらし、横断的取組の4分野で対策を一体的に進めることが必要である。<br><br><b>関連</b>　地域・くらしの柱は脱炭素先行地域100以上の創出や省エネ住宅、食品ロス削減を含む。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の分野を国の分類で言う<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜柱】横断的取組に位置づく施策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　成長志向型カーボンプライシング、循環経済移行、吸収源確保、国際貢献<br><br><b>解説</b>　横断的取組は、特定の部門に限らず全体に効く施策群である。成長志向型カーボンプライシングで投資を促し、循環経済で資源を循環させ、吸収源で排出を相殺し、国際貢献で世界の削減にも寄与する<br><br><b>答案に書くなら</b>　解決策として、成長志向型カーボンプライシング、循環経済移行、吸収源確保、国際貢献を部門横断で進めることが有効である。<br><br><b>関連</b>　吸収源対策は森林やブルーカーボンで、2040年度は約84百万t-CO2の吸収を見込む。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 横断的な解決策を挙げるときに<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜課題】温暖化対策計画を根拠に、脱炭素化が難しい分野の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　水素・アンモニア・CCUS等による火力の脱炭素化や、航空・海運の次世代燃料の実用化に技術的ブレイクスルーが必要<br><br><b>解説</b>　火力や航空・海運は、電化や再エネだけでは脱炭素が難しい分野。水素・アンモニアやCCUS（CO2の回収・利用・貯留）、次世代燃料の実用化に技術的な突破が要る<br><br><b>答案に書くなら</b>　技術の観点から、水素・アンモニア・CCUS等による火力の脱炭素化や航空・海運の次世代燃料の実用化に、技術的ブレイクスルーが必要であることが課題である。<br><br><b>関連</b>　CCUSは発電所・工場等から排出されるCO2を分離・回収し、利用または地中に貯留する技術である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜課題】脱炭素先行地域100以上の創出の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　計画策定・実施を担う自治体職員や事業者側の体制・人材の確保が課題<br><br><b>解説</b>　脱炭素先行地域は2030年度までに100以上の創出を目標とする。数が多いほど、計画の策定・実施を担う自治体職員や事業者側の体制が足りなくなりやすい<br><br><b>答案に書くなら</b>　人材・担い手の観点から、脱炭素先行地域の創出に向け、計画策定・実施を担う自治体職員や事業者側の体制・人材の確保が課題である。<br><br><b>関連</b>　小規模自治体では都道府県・連携中枢都市等との共同・連携策定が対策になる。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 人材・担い手の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜課題】2030年度目標とネットゼロを結ぶ道筋の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　中長期の予見可能性を高め、GX投資を加速する資金動員が課題<br><br><b>解説</b>　2030年度目標と2050年ネットゼロを直線的につなぐ経路には長期の巨額投資が必要。見通しが不透明だと企業は投資をためらうため、予見可能性の確保が資金動員の前提になる<br><br><b>答案に書くなら</b>　経済・資金の観点から、中長期の予見可能性を高め、GX投資を加速する資金動員が課題である。<br><br><b>関連</b>　制度面の対応が成長志向型カーボンプライシングで、エネルギー基本計画やGX2040ビジョンと一体的に運用する。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜解決策】火力発電の脱炭素化の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　水素・アンモニア混焼やCCUSで火力を脱炭素化し、非効率石炭火力は計画的にフェードアウトする<br><br><b>解説</b>　火力の脱炭素化は、水素・アンモニア混焼やCCUSで排出を減らす手法。非効率石炭火力のフェードアウトは、発電効率の低い石炭火力を計画的に休廃止する対策である<br><br><b>答案に書くなら</b>　解決策として、水素・アンモニア混焼やCCUSで火力を脱炭素化し、非効率石炭火力を計画的にフェードアウトすることが有効である。<br><br><b>関連</b>　LNG火力はトランジション手段として位置づけられ、再エネ・原子力の最大活用と並行する。<br><br><b>答案での使い方</b>　必須Ⅰ(2) エネルギー転換の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜解決策】地域の脱炭素化の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　脱炭素先行地域を2030年度までに100以上創出し、民生部門の電力CO2実質ゼロのモデルを全国へ広げる<br><br><b>解説</b>　脱炭素先行地域は、民生部門の電力消費に伴うCO2排出の実質ゼロ等を2030年度までに目指す先行モデルの地域。地域特性に応じた成功例を示し、横展開で全国の脱炭素化を進める<br><br><b>答案に書くなら</b>　解決策として、脱炭素先行地域を2030年度までに100以上創出し、民生部門の電力CO2実質ゼロのモデルを全国に広げることが有効である。<br><br><b>関連</b>　リスクは体制不足の小規模自治体で計画が形だけになることで、広域での人材支援が対策になる。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 地域・くらしの解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜リスク】石炭火力のフェードアウトを急ぐリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：代替電源の整備が追いつかず需給バランスに影響。対策：LNG火力を移行手段に使い、再エネ・原子力の最大活用を並行する<br><br><b>解説</b>　石炭火力を急に減らすと、代替電源が間に合わずに電力の需給バランス（供給の安定性）を崩すおそれがある。移行期間に使える電源を確保することが対策の骨格になる<br><br><b>答案に書くなら</b>　リスクとして、石炭火力のフェードアウトで電力の需給バランスに影響が出るおそれがあり、LNG火力を移行手段に用い、再エネ・原子力の最大活用を並行して進める必要がある。<br><br><b>関連</b>　JCM等の海外クレジット依存でも国内削減が希薄化するリスクがあり、国内削減を基本にフォローアップする。<br><br><b>答案での使い方</b>　必須Ⅰ(3) エネルギー転換のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【地球温暖化対策計画｜注意】2035・2040年度の部門別CO2数値は確定値か？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　確定値ではない。複数シナリオ分析に基づく幅のある「目安」<br><br><b>解説</b>　2035・2040年度のエネルギー起源CO2の部門別数値は、複数シナリオの分析に基づく幅のある見通しで、確定した配分ではない。技術進展が遅れると目標と実績のギャップが広がり得る<br><br><b>答案に書くなら</b>　2035・2040年度の部門別数値は複数シナリオに基づく「目安」であり、毎年の進捗点検で対策を柔軟に見直す必要がある。<br><br><b>関連</b>　進捗点検は毎年1回、地球温暖化対策推進本部でフォローアップを行う。<br><br><b>答案での使い方</b>　答案で確定値のように書くと減点。「目安」と書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000291668.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜時期】GX2040ビジョンと第7次エネルギー基本計画の閣議決定はいつ？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　いずれも2025年2月18日。別の文書で、GX2040は2023年7月の戦略の改訂版<br><br><b>解説</b>　GX2040ビジョンは脱炭素成長型経済構造移行推進法（GX推進法）に基づく戦略の改訂版、第7次エネルギー基本計画はエネルギー政策基本法第12条第1項に基づく計画で、根拠法が異なる別の文書である<br><br><b>答案に書くなら</b>　GX2040ビジョンと第7次エネルギー基本計画は2025年2月18日に閣議決定された最新版であり、これに基づいて課題を整理する。<br><br><b>関連</b>　GX2040ビジョンは2023年7月の脱炭素成長型経済構造移行推進戦略の改訂版である。<br><br><b>答案での使い方</b>　書き出しで最新版を明示。2文書を混ぜない<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜時期】排出量取引制度が本格稼働（義務化）する年度は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2026年度。2023年度開始の自主参加型GXリーグとは別<br><br><b>解説</b>　排出量取引制度は2026年度から本格稼働し、一定の排出規模以上の企業の参加を業種等を問わず義務化する。2023年度開始のGXリーグは自主参加型の第1段階で、本格稼働後は義務の制度に変わる<br><br><b>答案に書くなら</b>　制度の観点から、排出量取引制度は2026年度に本格稼働し、一定規模以上の排出企業に参加が義務化される。<br><br><b>関連</b>　義務化にはGX推進法改正案の国会提出が伴う。自主参加のGXリーグと時系列で混同しない。<br><br><b>答案での使い方</b>　Ⅱ-1・必須Ⅰで「義務化済み」と書く根拠に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜目標】2040年度の電源構成（目安）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　再エネ4〜5割程度、火力3〜4割程度、原子力2割程度。2022年度は再エネ21.8%、火力72.6%<br><br><b>解説</b>　2040年度の電源構成は目安で、2022年度は火力が7割超と偏っていた。再エネを大きく伸ばし火力を減らす必要があり、現状との差が課題の大きさを示す<br><br><b>答案に書くなら</b>　環境・エネルギーの観点から、2022年度の再エネ21.8%・火力72.6%に対し、2040年度は再エネ4〜5割程度、火力3〜4割程度、原子力2割程度を目指す必要がある。<br><br><b>関連</b>　2040年度の数値は暫定値で確定した目標ではない。エネルギー自給率は3〜4割程度の見通し（2022年度は12.6%）である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 現状との差で課題の大きさを示す<br><br>【出典】<a href=\"https://www.enecho.meti.go.jp/category/others/basic_plan/pdf/20250218_03.pdf\" target=\"_blank\" rel=\"noopener\">資源エネルギー庁（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜目標】GX経済移行債の規模と、呼び込む官民投資の規模は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　10年間で20兆円規模の先行投資支援により、150兆円規模の官民投資を呼び込む<br><br><b>解説</b>　GX経済移行債は先行投資支援の財源となる国債。国が先に投資を支えることで、民間の投資判断を後押しし、規模の大きい官民投資を引き出す<br><br><b>答案に書くなら</b>　資金面の解決策として、GX経済移行債による10年間で20兆円規模の先行投資支援で、150兆円規模の官民投資を呼び込むことが有効である。<br><br><b>関連</b>　支援の配分は、炭素価格の予見性を確保しつつ多排出産業の構造転換へ適切に行う必要がある。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 資金面の解決策の規模感に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜柱】GX2040ビジョンの柱のうち、カーボンプライシングの柱は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　成長志向型カーボンプライシング構想。排出量取引制度の本格稼働と化石燃料賦課金（2028年度）で炭素価格を形成<br><br><b>解説</b>　カーボンプライシングは炭素に価格をつけて排出削減とGX投資を促す仕組み。この構想は排出量取引制度と化石燃料賦課金を組み合わせて、炭素価格を段階的に形成する<br><br><b>答案に書くなら</b>　制度の観点から、成長志向型カーボンプライシング構想により、排出量取引制度と化石燃料賦課金で炭素価格を段階的に形成することが解決策である。<br><br><b>関連</b>　化石燃料賦課金は化石燃料の輸入事業者等に課す賦課金で、2028年度から導入予定である。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 制度面の解決策の国の言葉に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜柱】GX2040ビジョンの「GX産業立地」の考え方は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　脱炭素電源を見据えた産業集積の加速と、地域に利益が及ぶ地域GXを進める<br><br><b>解説</b>　GX産業立地は、脱炭素電源が使える場所に産業を集積させる考え方。電源の近くに企業を集めれば競争力と脱炭素を両立でき、利益を地域に及ぼす地域GXが合意形成の鍵になる<br><br><b>答案に書くなら</b>　地域の観点から、脱炭素電源を見据えた産業集積を進めつつ、利益が地域に及ぶ地域GXを進めることが解決策である。<br><br><b>関連</b>　データセンター立地では電力と通信のインフラ整備を効率的に連携させるワット・ビット連携の考え方もある。<br><br><b>答案での使い方</b>　必須Ⅰ・Ⅲ 地域系の解決策の方向づけに<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜課題】再エネ主力電源化（2040年度4〜5割）の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　出力変動を調整する系統整備・蓄電池・次世代革新炉など複数技術の同時確立が必要で、単一技術では対応できない<br><br><b>解説</b>　再エネは天候で出力が変動するため、主力電源にするには需給を調整する手段が要る。系統整備、蓄電池、次世代革新炉などの複数技術がそろって初めて安定供給と両立できる<br><br><b>答案に書くなら</b>　技術の観点から、再エネ主力電源化には、出力変動に対応する系統整備・蓄電池・次世代革新炉など複数技術を同時に確立する必要があることが課題である。<br><br><b>関連</b>　次世代革新炉は安全性を高めた新型の原子炉技術で、原子力の活用と並行して検討される。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜課題】排出量取引制度の義務化の課題を『制度』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　公平性確保のため、業種別の無償割当ルールと価格安定化措置（上限・下限価格）の制度設計が課題<br><br><b>解説</b>　排出量取引は事業者に排出枠を割り当てる仕組みで、無償割当てのルールが不公平だと産業間の反発を招く。価格が乱高下すると投資計画も立てにくいため、上限・下限価格で安定させる<br><br><b>答案に書くなら</b>　制度の観点から、排出量取引制度の義務化にあたり、公平性確保のため業種別の無償割当ルールと上限・下限価格などの価格安定化措置の制度設計が課題である。<br><br><b>関連</b>　運営やGX投資へのファイナンス支援はGX推進機構（2024年7月業務開始）が担う。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 制度の観点の課題に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜課題】中堅・中小企業のGX対応の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　大企業に比べ支援機関・資金・人材が不足し、排出量の見える化や設備高度化の対応力の差が広がりやすい<br><br><b>解説</b>　排出量の見える化や設備の高度化には、専門の支援機関、資金、人材が必要。大企業は自力で対応できるが、中堅・中小企業は不足しやすく、対応力の差が広がる<br><br><b>答案に書くなら</b>　人材・担い手の観点から、中堅・中小企業は大企業に比べ支援機関・資金・人材が不足し、排出量の見える化や設備高度化の対応力の差が広がりやすいことが課題である。<br><br><b>関連</b>　GX産業構造の柱では、GX価値の見える化や企業の成長投資・カーブアウトで産業競争力を両立する。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 人材・担い手の観点の課題に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜解決策】排出量取引制度による解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　排出枠の無償割当てと取引で炭素価格を形成し、多排出産業の投資と構造転換を促す<br><br><b>解説</b>　排出量取引制度（GX-ETS）は、排出枠を割り当てて取引させることで炭素に価格をつける制度。排出に費用がかかるようになるため、多排出産業の投資や構造転換が促される<br><br><b>答案に書くなら</b>　制度面の解決策として、排出量取引制度で排出枠の無償割当てと取引により炭素価格を形成し、多排出産業の投資と構造転換を促すことが有効である。<br><br><b>関連</b>　リスクはコスト増による競争力低下と海外移転（カーボンリーケージ）で、対策は業種特性への配慮である。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 制度面の解決策に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜解決策】再エネ主力電源化の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　S+3Eを前提に、系統整備・蓄電池・次世代革新炉・火力の脱炭素化を並行して進める<br><br><b>解説</b>　S+3Eは、安全性を前提にエネルギー安定供給・経済効率性・環境適合の3つを同時に達成する基本視点。再エネだけに偏らず、系統整備や蓄電池、原子力、火力の脱炭素化を並行して進める根拠になる<br><br><b>答案に書くなら</b>　エネルギーの観点から、S+3Eを前提に、系統整備・蓄電池・次世代革新炉・火力の脱炭素化を並行して再エネ主力電源化を進めることが解決策である。<br><br><b>関連</b>　リスクは出力変動の増大による周波数・系統安定性の低下で、火力の調整力維持が対策になる。<br><br><b>答案での使い方</b>　必須Ⅰ(2) エネルギー面の解決策に<br><br>【出典】<a href=\"https://www.enecho.meti.go.jp/category/others/basic_plan/pdf/20250218_03.pdf\" target=\"_blank\" rel=\"noopener\">資源エネルギー庁（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜解決策】データセンター立地等の合意形成の解決策を、専門用語で言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　地域GX（地域裨益型・地域共生型）で、脱炭素電源の利益を地域に還元し、自治体と連携して地方創生につなげる<br><br><b>解説</b>　データセンターなどの立地は地域に雇用や税収をもたらす一方、電力需要の急増や住民の理解が課題になる。地域GXは、脱炭素電源の整備の利益を地域に還元し、自治体と連携して進めることで合意を得る考え方である<br><br><b>答案に書くなら</b>　地域の観点から、地域GXにより脱炭素電源の利益を地域に還元し、自治体と連携して地方創生につなげることが解決策である。<br><br><b>関連</b>　企業を誘致する自治体への支援と、住民への裨益を両立させることが課題とされる。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 地域系の解決策に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜リスク】排出量取引制度の義務化で生じるリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：多排出産業の競争力低下と海外移転（カーボンリーケージ）。対策：政府指針による業種配慮の無償割当てと移行期の投資余力確保<br><br><b>解説</b>　義務化で炭素のコストが上がると、鉄鋼・化学などの多排出産業は国際競争で不利になり、規制の緩い国へ製造拠点が移る（カーボンリーケージ）おそれがある。業種ごとの事情を制度に反映することが対策になる<br><br><b>答案に書くなら</b>　リスクとして、多排出産業の競争力低下とカーボンリーケージが懸念されるため、政府指針で業種特性に配慮した無償割当てを行い、移行期の投資余力を確保する必要がある。<br><br><b>関連</b>　排出量取引や賦課金のコストは電気料金・製品価格に転嫁され、中小企業や家庭の負担増につながるおそれもある。<br><br><b>答案での使い方</b>　必須Ⅰ(3) 制度導入のリスクと対策に<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【GX2040ビジョン／第7次エネルギー基本計画｜注意】2035年度60%・2040年度73%削減と、R8 Ⅰ-2の家庭部門66%の違いは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　60%・73%は全体（2013年度比）、66%は家庭部門（2030年度）。母集団が違う<br><br><b>解説</b>　60%・73%は日本全体の温室効果ガス排出量の削減率（2013年度比、2035・2040年度）で、家庭部門の66%は地球温暖化対策計画の2030年度の目安。同じ数字でも、対象（母集団）と年度が違う<br><br><b>答案に書くなら</b>　2035年度60%・2040年度73%は全体の削減目標、家庭部門66%は地球温暖化対策計画の2030年度の目安であり、対象が異なる。<br><br><b>関連</b>　家庭部門の2040年度目安は71〜81%減で、いずれも2013年度が基準である。<br><br><b>答案での使い方</b>　数字は母集団とセットで書く。取り違えは減点<br><br>【出典】<a href=\"https://www.cas.go.jp/jp/seisaku/gx_jikkou_kaigi/pdf/gx2040_vision_kaitei.pdf\" target=\"_blank\" rel=\"noopener\">内閣官房（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜時期】気候変動適応計画の閣議決定と一部変更はいつ（何年何月）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2021年10月に閣議決定、2023年5月に一部変更。一部変更で熱中症対策実行計画が第4章に追加<br><br><b>解説</b>　当初の計画は2021年10月22日に閣議決定され、2023年5月30日の一部変更で熱中症対策実行計画が第4章に追加された。実行計画は2023年4月改正の気候変動適応法第16条第1項に基づく<br><br><b>答案に書くなら</b>　本計画は2021年10月に閣議決定され、2023年5月の一部変更で熱中症対策実行計画が第4章に加わった気候変動適応計画である。<br><br><b>関連</b>　計画変更の根拠は第8条第1項、実行計画の根拠は第16条第1項で、条文番号を混同しない。<br><br><b>答案での使い方</b>　書き出しで版を明示。熱中症対策は第4章の内容として書く<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜時期】気候変動適応計画の次の改定の見通しは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2026年2月の第3次影響評価報告書を受け、2026年度内に改定予定。骨子は2026年6月<br><br><b>解説</b>　第3次気候変動影響評価報告書が2026年2月16日に公表され、気候変動適応計画の改定は2026年度に予定されている。影響評価はおおむね5年ごとに実施され、その結果を勘案して計画を改定する<br><br><b>答案に書くなら</b>　気候変動適応計画は、2026年2月公表の第3次影響評価報告書を受けて2026年度に改定が予定されている。<br><br><b>関連</b>　現行計画の計画期間はおおむね5年間で、「改定予定」と書き、現行版と区別する。<br><br><b>答案での使い方</b>　書き出しで「改定予定」と書き、旧版との取り違えを避ける<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜目標】熱中症対策実行計画の中期目標（2030年）は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　熱中症死亡者数（5年移動平均）を、令和4年概数の1,295名から半減<br><br><b>解説</b>　熱中症対策実行計画は、2030年までに熱中症による死亡者数（5年移動平均）を令和4年概数の1,295名から半減させる中期目標を置く。基準値と比べて到達度を測る数値目標になる<br><br><b>答案に書くなら</b>　解決策の到達点として、2030年までに熱中症死亡者数（5年移動平均）を令和4年概数1,295名から半減させることを目指す。<br><br><b>関連</b>　目標は死亡者数の5年移動平均で、単年の実績とは扱いが異なる。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の到達点の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000136709.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜目標】熱中症死亡者数の実績は目標の基準値と比べてどうか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　令和5年1,651人、令和6年2,160人と、基準値1,295名を大きく上回り増加（人口動態統計確定数）<br><br><b>解説</b>　実績は目標と逆方向に動いており、人口動態統計（確定数）の熱中症死亡者数は令和5年に1,651人、令和6年に2,160人。基準値1,295名を大きく上回り、課題の大きさを示す<br><br><b>答案に書くなら</b>　健康の観点から、熱中症死亡者数は令和5年1,651人、令和6年2,160人と基準値1,295名を大きく上回って増加しており、対策の強化が課題である。<br><br><b>関連</b>　基準値の1,295名は令和4年の概数で、確定数ではなく概数の数字である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 課題の大きさを示す数字に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000136709.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜柱】適応計画の7つの基本戦略は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　施策への組み込み、科学的知見、情報基盤、地域推進、事業者等の促進、国際貢献、関係機関連携<br><br><b>解説</b>　計画は、あらゆる施策に適応を組み込み、科学的知見に基づき、情報基盤を整備し、地域の実情に応じ、国民・事業者の理解を深め、途上国の能力向上に貢献し、関係機関が連携する、という7つの基本戦略を掲げる<br><br><b>答案に書くなら</b>　解決策として、あらゆる施策への適応の組み込みや科学的知見に基づく推進など、7つの基本戦略に沿って対策を進めることが有効である。<br><br><b>関連</b>　第2章の7分野（分野別施策）とは別物で、どちらも7個なので混同しない。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の方向を国の言葉で言う<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜柱】適応計画で「地域の実情に応じた適応」を進める仕組みは？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　地域気候変動適応計画と地域適応センター。国立環境研究所が情報基盤A-PLATで支援<br><br><b>解説</b>　地域ごとに気候影響が違うため、地域単位で適応を進める。都道府県・市町村が地域気候変動適応計画を策定し、地域適応センターが影響情報の収集・提供を担い、国立環境研究所が情報基盤A-PLATで支える<br><br><b>答案に書くなら</b>　地域の観点から、地域気候変動適応計画と地域気候変動適応センターを軸に、A-PLATによる情報基盤で地域の実情に応じた適応を進めることが解決策である。<br><br><b>関連</b>　A-PLATは国内向け、AP-PLATはアジア太平洋の途上国向けの情報プラットフォームである。<br><br><b>答案での使い方</b>　必須Ⅰ・Ⅱ-2 地域施策の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜課題】地域の適応推進の課題を『制度・政策』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　地域適応計画の策定が努力義務にとどまるため、地域適応センターの設置を含む制度的な推進力の確保が課題<br><br><b>解説</b>　地域気候変動適応計画の策定は都道府県・市町村の努力義務にとどまり、強制力が弱い。推進力を確保するには、地域適応センターの設置など制度面の枠組みが要る<br><br><b>答案に書くなら</b>　制度・政策の観点から、地域気候変動適応計画の策定が努力義務にとどまるため、地域適応センターの設置を含む制度的な推進力の確保が課題である。<br><br><b>関連</b>　国と地方が連携する場として、環境省が主導して気候変動適応広域協議会を組織する。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 制度・政策の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜課題】適応策の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　事業者の気候リスク対応投資を促し、適応ビジネスをどう資金面で後押しするかが課題<br><br><b>解説</b>　気候リスクが事業に与える影響への備えは、事業者の投資に頼る部分が大きい。適応ビジネスは、気候変動影響を事業機会として捉え、他者の適応を支援する製品・サービスを展開する事業活動で、これを資金面でどう支えるかが課題になる<br><br><b>答案に書くなら</b>　経済・資金の観点から、事業者の気候リスク対応投資を促し、適応ビジネスを資金面でどう後押しするかが課題である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜課題】適応策の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　農業の高温耐性品種の開発・普及と、流域治水やグリーンインフラによるハード・ソフト一体の防災技術の高度化が課題<br><br><b>解説</b>　気候の高温化で作物の品質低下や水害の激甚化が進む。高温耐性品種は耐暑性を高めた品種で、流域治水やグリーンインフラは自然の機能も使う防災手法である。複数の技術を高度化する必要がある<br><br><b>答案に書くなら</b>　技術の観点から、農業の高温耐性品種の開発・普及と、流域治水やグリーンインフラによるハード・ソフト一体の防災技術の高度化が課題である。<br><br><b>関連</b>　高温耐性品種はコメや果樹で導入が進む。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜解決策】水害リスクの解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　流域治水で、河川整備に加え流域全体の関係者が協働し、ハード・ソフト一体で水害リスクを下げる<br><br><b>解説</b>　流域治水は、河川整備だけでなく流域全体のあらゆる関係者が協働する治水の考え方。ハード（堤防等）とソフト（情報・避難等）を一体で進め、水害リスクを低減する<br><br><b>答案に書くなら</b>　解決策として、流域治水により、河川整備に加え流域全体の関係者が協働し、ハード・ソフト一体で水害リスクを下げることが有効である。<br><br><b>関連</b>　グリーンインフラは自然の機能を活用する社会資本整備の手法で、流域治水と組み合わせて使う。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 自然災害分野の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜解決策】熱中症の解決策を、専門用語を使って1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　熱中症警戒情報・特別警戒情報（WBGT基準）の発表と、指定暑熱避難施設の開放で、高齢者等の被害を防ぐ<br><br><b>解説</b>　熱中症警戒情報は、府県予報区内の1地点以上で日最高WBGTが33以上と予測される場合、特別警戒情報は都道府県内の全地点で35以上と予測される場合に発表される。特別警戒情報の発表時には指定暑熱避難施設が開放される<br><br><b>答案に書くなら</b>　解決策として、熱中症警戒情報・特別警戒情報の発表と指定暑熱避難施設の開放により、高齢者等の熱中症被害を防ぐことが有効である。<br><br><b>関連</b>　WBGT（暑さ指数）は気温・湿度・放射熱から算出する熱中症予防の指標である。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 健康分野の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000136709.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜リスク】流域治水の大規模投資で生じるリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：財政負担の拡大と生態系の分断など新たな環境影響。対策：グリーンインフラやNbSを組み合わせ環境配慮型の整備を優先する<br><br><b>解説</b>　堤防など大規模なハード整備は財政負担が重く、生態系の分断のような新たな環境影響も生む。グリーンインフラやNbS（自然を活用した解決策）を組み合わせれば環境への配慮と防災を両立しやすい<br><br><b>答案に書くなら</b>　リスクとして、流域治水の大規模投資は財政負担の拡大や生態系の分断を招くおそれがあり、グリーンインフラやNbSを組み合わせた環境配慮型の整備を優先する必要がある。<br><br><b>関連</b>　NbSは生態系の保全・再生など自然の機能を活用して社会課題を解決する手法である。<br><br><b>答案での使い方</b>　必須Ⅰ(3) ハード整備のリスクと対策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜リスク】地域適応計画が努力義務であることで生じるリスクと対策は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　リスク：小規模市町村で策定が進まず地域間の適応力が開く。対策：広域協議会を通じ都道府県が市町村を技術的・財政的に支援<br><br><b>解説</b>　努力義務のため、財政力や専門人材が乏しい小規模市町村で策定が進まず、自治体間の適応力の差が広がる。国と地方が連携する広域協議会を通じ、都道府県が市町村を技術的・財政的に支援する体制が対策になる<br><br><b>答案に書くなら</b>　リスクとして、努力義務のため小規模市町村で策定が進まず地域間の適応力が開くおそれがあり、気候変動適応広域協議会を通じて都道府県が市町村を技術的・財政的に支援する必要がある。<br><br><b>関連</b>　国立環境研究所も地方公共団体に技術的援助を行う。<br><br><b>答案での使い方</b>　必須Ⅰ(3)・Ⅱ-2 自治体支援の根拠に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【気候変動適応計画｜注意】適応計画の「7分野」と「7つの基本戦略」は同じか？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　別物。7分野は農林水産業・水環境・自然生態系・自然災害・健康・産業経済・国民生活の分野別施策<br><br><b>解説</b>　7分野は第2章の分野別施策で、農業・林業・水産業、水環境・水資源、自然生態系、自然災害・沿岸域、健康、産業・経済活動、国民生活・都市生活を指す。7つの基本戦略は施策への組み込みなど進め方の枠組みで、別の分類である<br><br><b>答案に書くなら</b>　分野別施策の7分野（農林水産業、水環境・水資源、自然生態系、自然災害・沿岸域、健康、産業・経済活動、国民生活・都市生活）と7つの基本戦略は別物であり、設問に応じて書き分ける。<br><br><b>関連</b>　気候変動適応計画は適応策の計画で、温室効果ガスの46%削減など緩和策の数値目標は地球温暖化対策計画のものである。<br><br><b>答案での使い方</b>　どちらも7個。分野を問う設問に戦略を書くと減点<br><br>【出典】<a href=\"https://www.env.go.jp/content/000176391.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜時期】生物多様性国家戦略2023-2030が閣議決定されたのはいつ（何年何月）？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　2023年3月（31日）。第六次環境基本計画（2024年5月）とは別の計画<br><br><b>解説</b>　2023年3月31日に閣議決定された戦略で、根拠は生物多様性基本法第12条第1項。環境基本計画を基本に策定するため協調関係にあるが、2024年5月閣議決定の第六次環境基本計画とは別の計画である<br><br><b>答案に書くなら</b>　本戦略は2023年3月に閣議決定された生物多様性国家戦略2023-2030であり、2030年のネイチャーポジティブ実現を目指す。<br><br><b>関連</b>　R6 Ⅰ-1とR8 Ⅰ-1で出題歴があり、「第六次」を付けて環境基本計画と取り違えない。<br><br><b>答案での使い方</b>　書き出しで版を明示。R6・R8 Ⅰ-1で出題<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜目標】30by30は国家戦略のどの目標に位置づく？その内容は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　行動目標1-1。2030年までに陸と海の30%以上を保護地域・OECMで保全<br><br><b>解説</b>　30by30は国家戦略全体の名称ではなく、行動目標1-1として位置づく国際目標の一つ。2030年までに陸と海それぞれの30%以上を保護地域とOECMで保全する<br><br><b>答案に書くなら</b>　生態系保全の観点から、行動目標1-1の30by30に基づき、2030年までに陸と海の30%以上を保護地域・OECMで保全することが解決策の到達点である。<br><br><b>関連</b>　ネイチャーポジティブは2030年に目指す状態で、30by30はその指標・手段である。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 解決策の到達点に。戦略そのものではない<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜目標】中間評価（2026年2月）の保護地域・OECM占有率は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　陸域21.0%（2025年時点）、海域13.3%（2021年以降変化なし）。目標は各30%<br><br><b>解説</b>　中間評価（2026年2月公表）では、保護地域とOECMが占める割合は陸域21.0%（2025年時点、2023年3月は20.5%）、海域13.3%（2021年以降変化なし）で、目標30%との差が大きい。特に海域は停滞している<br><br><b>答案に書くなら</b>　生態系保全の観点から、保護地域・OECMの割合は陸域21.0%、海域13.3%にとどまり、目標30%との差を埋めることが課題である。<br><br><b>関連</b>　陸域は20.5%から微増、海域は2021年以降変化がなく、海域の停滞が目立つ。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 目標との差で課題の大きさを示す<br><br>【出典】<a href=\"https://www.env.go.jp/content/000379260.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜柱】国家戦略の基本戦略1〜3は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　①生態系の健全性の回復、②自然を活用した社会課題の解決、③ネイチャーポジティブ経済の実現<br><br><b>解説</b>　基本戦略1は生息地の保全とネットワーク化、2は自然を活用した社会課題の解決、3は経済への自然資本の内部化に当たる。R6 Ⅰ-1ではこの3つの基本戦略が問われた<br><br><b>答案に書くなら</b>　解決策として、生態系の健全性の回復、自然を活用した社会課題の解決、ネイチャーポジティブ経済の実現の3つの基本戦略に沿って対策を進めることが有効である。<br><br><b>関連</b>　基本戦略は全部で5つで、4と5は暮らしの行動変容と基盤整備・国際連携である。<br><br><b>答案での使い方</b>　R6 Ⅰ-1の3戦略。解決策の方向を国の言葉で言う<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜柱】基本戦略4と5は？また目標の構成数は？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　4：生活・消費活動での価値の認識と行動、5：基盤整備と国際連携。5基本戦略・15状態目標・25行動目標<br><br><b>解説</b>　基本戦略4は国民一人一人の行動変容を促す普及啓発・場づくり、5は生物多様性に係る取組を支える基盤整備（モニタリング基盤等）と国際連携である。戦略は全体で5つの基本戦略・15の状態目標・25の行動目標から成る<br><br><b>答案に書くなら</b>　解決策として、基本戦略4の生活・消費活動での価値の認識と行動、基本戦略5の基盤整備と国際連携を組み合わせて進めることが有効である。<br><br><b>関連</b>　R6 Ⅰ-1で問われた3戦略は全体の一部なので、設問の範囲を確認する。<br><br><b>答案での使い方</b>　3戦略は全体の一部。設問の範囲を確認する<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜課題】30by30達成の課題を『技術』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　OECMとして整理できる区域を見極める評価手法が未確立で、自然共生サイトの認定基準・モニタリング手法の標準化が課題<br><br><b>解説</b>　OECMは法的な保護地域以外で生物多様性の保全に資する管理が行われている区域。保護地域の拡張だけでは30%に届かないため、OECMを見極める評価手法と、自然共生サイトの認定基準・モニタリング手法の標準化が要る<br><br><b>答案に書くなら</b>　技術の観点から、OECMとして整理できる区域を見極める評価手法が未確立であり、自然共生サイトの認定基準・モニタリング手法の標準化が課題である。<br><br><b>関連</b>　自然共生サイトは日本版OECMで、国際データベース（Protected Planet）に登録される。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 技術の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜課題】ネイチャーポジティブ経営の課題を『経済・資金』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　自然資本の損失の外部不経済を価格に反映する経済的手法が実証段階にとどまり、民間資金の誘導が不十分<br><br><b>解説</b>　自然資本の損失は外部不経済で、価格に反映されにくい。OECM認定地の環境価値の売買や税制優遇などの経済的手法が調査・実証段階にとどまるため、民間資金の誘導が不十分になる<br><br><b>答案に書くなら</b>　経済・資金の観点から、自然資本の損失の外部不経済を価格に反映する経済的手法が実証段階にとどまり、ネイチャーポジティブ経営への民間資金の誘導が不十分であることが課題である。<br><br><b>関連</b>　解決策の側ではTNFDによる情報開示とESG金融で自然資本を経済に内部化する。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 経済・資金の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜課題】里山・森林の保全の課題を『人材・担い手』の観点で1つ言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　森林・農地・里山の管理の担い手が不足し、担い手の確保・育成と地域主体の取組を支えるインセンティブ設計が必要<br><br><b>解説</b>　森林・農地・里山の保全活動は、管理の担い手不足に直面している。担い手の確保・育成と、地域主体の取組を支えるインセンティブ設計がないと、保全活動を持続できない<br><br><b>答案に書くなら</b>　人材・担い手の観点から、森林・農地・里山の管理の担い手不足に対し、担い手の確保・育成と地域主体の取組を支えるインセンティブ設計が必要であることが課題である。<br><br><b>関連</b>　鳥獣との軋轢緩和など、農林水産業被害の防止と生態系保全の利害調整も地域の課題である。<br><br><b>答案での使い方</b>　必須Ⅰ(1) 人材・担い手の観点の課題に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=\"noopener\">環境省（PDF）を開く ↗</a>", "v": "primary", "keep": true}, {"f": "二次:計画", "q": "【生物多様性国家戦略2023-2030｜解決策】民間の取組を生かす30by30の解決策を、専門用語で言うと？", "c": ["思い出せた（○）", "思い出せなかった（×）"], "a": 0, "n": "<span class=\"pri priA\">優先度 A</span> <small>必須Ⅰの国の計画、または得意分野・Ⅱ-1予測の上位。中身まで答案に書けるように</small><br><br><b>答え</b>　自然共生サイト（日本版OECM）で、民間等が保全する区域を国が認定し、国際データベースに登録する<br><br><b>解説</b>　自然共生サイトは、民間等の取組で生物多様性が保全されている区域を国が認定する制度で、日本版OECMとして国際データベースに登録される。民間の土地を30by30の達成に取り込む手段になる<br><br><b>答案に書くなら</b>　解決策として、自然共生サイトにより民間等が保全する区域を国が認定し、日本版OECMとして国際データベースに登録して30by30の達成に寄与させることが有効である。<br><br><b>関連</b>　有志の企業・自治体が取組を促す生物多様性のための30by30アライアンスも枠組みとして使える。<br><br><b>答案での使い方</b>　必須Ⅰ(2) 30by30の解決策に<br><br>【出典】<a href=\"https://www.env.go.jp/content/000124381.pdf\" target=\"_blank\" rel=
